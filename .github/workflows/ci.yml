name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 各包的测试有单个测试的时限；这里兜住测试以外的挂住，免得一次挂住占满缺省的 6 小时。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm test

