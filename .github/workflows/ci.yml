name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      REPA_TEST_REQUIRE_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - uses: actions/cache@v4
        with:
          path: packages/python-runner/.cache/pyodide
          # npm 锁定 Pyodide 及其 pyodide-lock.json；课程清单决定 wheel 及其依赖。
          key: ${{ runner.os }}-pyodide-${{ hashFiles('package-lock.json', 'packages/python-runner/package.json', 'packages/learning/courses/*/course.yaml') }}
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2 python3
      - run: npm ci
      - run: npm run course:runtime
      - run: npm test

  windows:
    runs-on: windows-latest
    # 等 Windows 任务稳定变绿以后去掉 continue-on-error。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - uses: actions/cache@v4
        with:
          path: packages/python-runner/.cache/pyodide
          key: ${{ runner.os }}-pyodide-${{ hashFiles('package-lock.json', 'packages/python-runner/package.json', 'packages/learning/courses/*/course.yaml') }}
      - run: npm ci
      - run: npm run course:runtime
      - id: build
        run: npm run build:packages
      # 构建成功后，每个包的测试都跑一遍，前一个包失败不挡住后面的，一次运行就能看到全部结果。
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test -w @repa/space-history
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test -w @repa/base
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test -w @repa/python-runner
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test -w @repa/learning
