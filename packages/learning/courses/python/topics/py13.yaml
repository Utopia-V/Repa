    quiz:
      - id: py13.k2.x1
        kind: [explain]
        uses: [py04.k1]
        body: |
          math 模块的文档摘要：

          > **math.floor(x)**：返回不大于 x 的最大整数（向下取整）。
          >
          > **math.ceil(x)**：返回不小于 x 的最小整数（向上取整）。

          一共 200 个样本，每块板最多装 96 个。至少需要几块板？宿主已经运行了 `import math`。哪一行算得对？
        slots:
          - id: line
            type: choice
            options:
              - id: round
                content: |
                  ```python
                  plates = round(200 / 96)
                  ```
              - id: floor
                content: |
                  ```python
                  plates = math.floor(200 / 96)
                  ```
              - id: ceil
                content: |
                  ```python
                  plates = math.ceil(200 / 96)
                  ```
              - id: int
                content: |
                  ```python
                  plates = int(200 / 96)
                  ```
            key: ceil
        explanation: |
          200 / 96 约等于 2.08。两块板只能装 192 个，剩下的 8 个还要一块板，所以至少 3 块：要“不小于它的最小整数”，也就是 **`math.ceil`**，得 3。

          `math.floor` 和 `int` 都去掉小数部分得 2；`round` 取最接近的整数，也得 2。它们都少算了一块板。
        verify: |
          import math
          need = next(n for n in range(1, 100) if n * 96 >= 200)
          fits = [option for option, line in OPTIONS["line"].items() if run("import math\n" + line)["plates"] == need]
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py13.k2.x2
        kind: [predict]
        uses: [py04.k3]
        body: |
          `math.ceil` 交回向上取整的结果；print 显示内容，交回 None。这段代码当作脚本运行。

          ```python startLine=1
          import math
