notes: |
  建议题型与判分：找错（P）、解释代码（S/O）、小改代码（T）。
  范围：只用标准库 math 和 pandas 的导入；pandas 在本节只导入、建一张空表，不讲它的功能（留给 py14）。题面里的“文档”是课程参照 Python 官方文档自写的中文摘要，不是原文；math.log 的官方签名用方括号表示可省略的参数，这里改写成说明文字，避免多引入一种记法。
  k2 引入 >>> 交互形式和 WWPD（What Would Python Display）作答约定：交互窗口里表达式会自动显示值，什么也不显示填 NOTHING，报错填 ERROR。py01 起的脚本约定不变：脚本里只有 print 会显示。这个约定在 intro 和 k2 讲解里说明，WWPD 题题面里再提醒一次。py14、py16 沿用。
  WWPD 题的输入写在表格里，核对程序把同样的输入交给 repl() 独立算出显示内容；签名题用 inspect.signature 读出参数默认值。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 5 分钟；k2 讲解与例题 4 分钟、练习 5 分钟；收束 2 分钟。
  情境与数据为本课自拟。
intro: |
  这一节学两件事：用 import 把现成的工具拿进来；读一小段文档，弄清一个函数要什么、交回什么、还做了什么。

  代码仍当作脚本运行，只有 print 会显示内容。第二个知识点会引入文档里常见的交互形式：`>>>` 后面是输入的一行，下一行是 Python 显示的结果。
wrapup: |
  读到 import，先记下它创建了哪个名字，后面的代码就只能用这个名字。用一个不熟的函数，先看签名里有哪些参数、哪些带默认值，再看说明里它返回什么、有没有副作用和例外，最后用示例核对自己的理解。

  请 AI 写代码时，也可以要求它“写明从哪个模块导入、用到的参数是什么意思”，读起来就有据可查。
kps:
  - id: py13.k1
    keyPrerequisites: [py04, py11]
    title: import/as 让名称可用
    card:
      name: import
      aliases: [导入, 模块, import as]
      definition: import 让模块里的工具在之后的代码里可用，用的名字取决于写法：`import math` 创建 math，`import pandas as pd` 只创建 pd，`from math import sqrt` 只创建 sqrt。
      conditions:
        - import 那一行要在用到这个名字之前运行；忘了导入，用到时报 NameError。
        - 后面写的名字要和导入时创建的一致：写了 `as pd`，就用 `pd.`，不能写 `pandas.`。
      example:
        from: py13.k1.e0
        text: |
          ```python
          import math
          root = math.sqrt(16)
          ```
          第 1 行创建名字 math；`math.sqrt` 是“math 里面的 sqrt”，算出 4.0。
    lesson: |
      Python 一开始只认识少数内置的名字，例如 `print`、`int`、`round`。更多的工具放在**模块**里，要先导入才能用：

      ```python startLine=1
      import math
      root = math.sqrt(16)
      ```

      第 1 行运行之后，名字 `math` 才存在。`math.sqrt` 读作“math 里面的 sqrt”：点号前面是模块的名字，后面是模块里的函数。

      导入有三种常见写法，区别在于**之后能用哪个名字**：

      | 写法 | 之后能用的名字 | 怎样调用 |
      |---|---|---|
      | `import math` | math | `math.sqrt(16)` |
      | `import pandas as pd` | pd，**不是** pandas | `pd.DataFrame()` |
      | `from math import sqrt` | sqrt，**不是** math | `sqrt(16)` |

      `as` 给模块起一个短名字。数据分析的代码几乎都以 `import pandas as pd` 开头，之后看到 `pd.`，指的就是 pandas。

      导入出问题时的报错，都可以用 [读报错](repa:concept/py11.k1) 的办法看：

      - 用到 `math.sqrt` 之前没有运行 `import math`：NameError，名字还不存在。
      - 写了 `import pandas as pd`，后面却写 `pandas.`：也是 NameError，因为只创建了 pd。
      - 模块名拼错，例如 `import maths`：ModuleNotFoundError，找不到这个模块。
      - 模块里没有这个名字，例如 `math.squareroot`：AttributeError。
    example:
      id: py13.k1.e0
      kind: [predict, explain]
      body: |
        `math.sqrt(x)` 算 x 的平方根，结果是小数（float）。

        ```python startLine=1
        import math
        side = 16
        root = math.sqrt(side)
        print(root)
        ```
      slots:
        - id: name
          type: choice
          prompt: 第 1 行运行之后，多了哪个可以用的名字？
          options:
            - { id: math, content: "`math`" }
            - { id: sqrt, content: "`sqrt`" }
            - { id: both, content: "`math` 和 `sqrt` 都有" }
          key: math
        - id: output
          type: text
          match: output
          prompt: 第 4 行显示什么？
          key: "4.0"
          feedback:
            - when: "4"
              message: sqrt 的结果是小数，显示 4.0。
      explanation: |
        `import math` 只创建了名字 **math**；sqrt 在 math 里面，要写成 `math.sqrt`，单独写 `sqrt` 是不存在的名字。

        第 3 行算 16 的平方根，结果是小数，显示 **4.0**。
      verify: |
        names = run(BLOCKS[0].splitlines()[0]).vars
        made = [name for name in ("math", "sqrt") if name in names]
        answers = {"name": made[0] if len(made) == 1 else "both", "output": run().lines()[-1]}
    practice:
      - id: py13.k1.q1
        kind: [predict]
        body: |
          填写表格：每一行的导入语句单独运行之后，下面三个名字能不能用？

          提示：`import math as m` 和 `import pandas as pd` 是同一种写法。
        slots:
          - id: names
            type: table
            columns:
              - { id: stmt, header: 导入语句 }
              - { id: math, header: 能用 math 吗, input: bool }
              - { id: m, header: 能用 m 吗, input: bool }
              - { id: sqrt, header: 能用 sqrt 吗, input: bool }
            rows:
              - { id: plain, cells: { stmt: "`import math`", math: true, m: false, sqrt: false } }
              - { id: alias, cells: { stmt: "`import math as m`", math: false, m: true, sqrt: false } }
              - { id: from, cells: { stmt: "`from math import sqrt`", math: false, m: false, sqrt: true } }
        explanation: |
          | 导入语句 | math | m | sqrt |
          |---|---|---|---|
          | `import math` | 能 | 不能 | 不能 |
          | `import math as m` | 不能 | 能 | 不能 |
          | `from math import sqrt` | 不能 | 不能 | 能 |

          每种写法只创建一个名字。`as m` 之后只有 m，要写 `m.sqrt`；`from math import sqrt` 之后只有 sqrt，直接写 `sqrt(...)`，math 这个名字并不存在。
        verify: |
          statements = {"plain": "import math", "alias": "import math as m", "from": "from math import sqrt"}
          answers = {"names": {
              row: {name: name in run(code).vars for name in ("math", "m", "sqrt")}
              for row, code in statements.items()
          }}
      - id: py13.k1.q2
        kind: [debug]
        uses: [py11.k1]
        body: |
          `math.floor(x)` 去掉 x 的小数部分，向下取整。运行 clean.py，出现了报错。

          ```python startLine=1
          import math as m
          value = math.floor(7.8)
          print(value)
          ```
        slots:
          - id: error
            type: choice
            prompt: 报错是哪一种？
            options:
              - { id: name, content: NameError：名字 math 不存在 }
              - { id: module, content: ModuleNotFoundError：找不到 math 模块 }
              - { id: attribute, content: AttributeError：math 里面没有 floor }
            key: name
          - id: fix
            type: choice
            prompt: 第 2 行应改成哪一种，程序才会显示 7？
            options:
              - id: alias
                content: |
                  ```python
                  value = m.floor(7.8)
                  ```
              - id: bare
                content: |
                  ```python
                  value = floor(7.8)
                  ```
              - id: same
                content: |
                  ```python
                  value = math.floor(m)
                  ```
            key: alias
        explanation: |
          第 1 行写了 `as m`，只创建了名字 m，第 2 行用到的 math 不存在，报 **NameError**。math 模块本身找得到，floor 也确实在里面。

          改成 **`m.floor(7.8)`**，显示 7。单独写 `floor` 同样是没有导入的名字。
        verify: |
          lines = CODE.splitlines()
          r = run()
          error = {"NameError": "name", "ModuleNotFoundError": "module", "AttributeError": "attribute"}.get(r.error, r.error)
          fits = [option for option, line in OPTIONS["fix"].items()
                  if run("\n".join([lines[0], line, lines[2]])).out.strip() == "7"]
          answers = {"error": error, "fix": fits[0] if len(fits) == 1 else fits}
      - id: py13.k1.q3
        kind: [debug]
        uses: [py11.k1]
        body: |
          下面四段代码各自单独运行，都会报错。

          代码 1：

          ```python
          print(math.pi)
          ```

          代码 2：

          ```python
          import maths
          ```

          代码 3：

          ```python
          import math
          print(math.squareroot(9))
          ```

          代码 4：

          ```python
          import math as m
          print(math.sqrt(9))
          ```
        slots:
          - id: errors
            type: table
            prompt: 每段代码报的是哪一种错？
            columns:
              - { id: code, header: 代码 }
              - id: error
                header: 报错类型
                input:
                  type: choice
                  options:
                    - { id: NameError, label: NameError }
                    - { id: ModuleNotFoundError, label: ModuleNotFoundError }
                    - { id: AttributeError, label: AttributeError }
            rows:
              - { id: c1, cells: { code: 代码 1, error: NameError } }
              - { id: c2, cells: { code: 代码 2, error: ModuleNotFoundError } }
              - { id: c3, cells: { code: 代码 3, error: AttributeError } }
              - { id: c4, cells: { code: 代码 4, error: NameError } }
        explanation: |
          | 代码 | 报错 | 原因 |
          |---|---|---|
          | 1 | NameError | 没有导入，math 这个名字不存在 |
          | 2 | ModuleNotFoundError | 模块叫 math，没有叫 maths 的模块 |
          | 3 | AttributeError | math 导入了，但里面没有 squareroot，平方根叫 sqrt |
          | 4 | NameError | `as m` 只创建了 m，没有 math |

          三种报错分别指向三个问题：名字不存在、模块找不到、模块里没有这一项。
        verify: |
          answers = {"errors": {f"c{i}": {"error": run(code).error} for i, code in enumerate(BLOCKS, 1)}}
      - id: py13.k1.q4
        kind: [trace]
        body: |
          as 决定导入后使用哪个名字。填写这个实际调用的结果。

          ```python
          import math as m
          print(m.sqrt(81))
          ```
        slots:
          - {id: output, type: text, match: output, prompt: 最后显示, key: "9.0"}
        explanation: "模块被绑定到别名 m，因此通过 m.sqrt 找到平方根函数。sqrt 返回浮点数 9.0；别名不会改变函数的计算含义。"
        verify: |
          answers = {"output": run().lines()[0]}
      - id: py13.k1.q5
        kind: [debug]
        body: |
          这是全新脚本，之前没有导入 math。只执行下面两行，会怎样？

          ```python
          import math as m
          print(math.sqrt(81))
          ```
        slots:
          - id: name
            type: choice
            options:
              - {id: alias, content: NameError；这次导入绑定的是 m，不是 math}
              - {id: both, content: 显示 9.0；两个名字总会一起绑定}
              - {id: syntax, content: SyntaxError；as 不能用在导入里}
            key: alias
        explanation: "import math as m 只在当前脚本中建立 m 这个名字。要使用这个导入，应调用 m.sqrt；模块原名不会自动成为另一个局部名字。"
        verify: |
          answers = {"name": "alias" if run().error == "NameError" else "both"}
    review:
      - id: py13.k1.r1
        kind: [modify]
        body: |
          要求：显示 30.25 的平方根。作答框里的代码运行时报 NameError：`name 'sqrt' is not defined`。补上导入，让它正常显示 5.5。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              value = sqrt(30.25)
              print(value)
            solution: |
              from math import sqrt
              value = sqrt(30.25)
              print(value)
            accepts:
              - |
                import math
                value = math.sqrt(30.25)
                print(value)
            rejects:
              - code: |
                  import math
                  value = sqrt(30.25)
                  print(value)
                why: "`import math` 只创建 math，sqrt 仍不存在"
              - code: |
                  value = sqrt(30.25)
                  from math import sqrt
                  print(value)
                why: 导入写在用到 sqrt 之后
            tests:
              - name: 显示平方根
                stdout: "5.5"
        explanation: |
          第 1 行用到了 sqrt，就要在它前面创建这个名字：

          ```python
          from math import sqrt
          value = sqrt(30.25)
          print(value)
          ```

          也可以写 `import math`，再把调用改成 `math.sqrt(30.25)`。只加 `import math` 而不改调用不行，那样只有 math，没有 sqrt；导入写在后面也不行，用到时名字还不存在。
      - id: py13.k1.r2
        kind: [predict]
        uses: [py11.k1]
        body: |
          ```python startLine=1
          print("开始")
          root = math.sqrt(9)
          import math
          print(root)
          ```
        slots:
          - id: result
            type: choice
            prompt: 运行结果是什么？
            options:
              - { id: works, content: 显示“开始”和 3.0，正常结束 }
              - { id: start_then_error, content: 显示“开始”，然后第 2 行报 NameError }
              - { id: nothing, content: 什么也不显示，直接报错 }
            key: start_then_error
          - id: stop
            type: text
            format: integer
            prompt: 程序停在第几行？
            key: 2
        explanation: |
          程序从上往下运行。第 1 行显示“开始”；第 2 行用到 math 时，第 3 行的 import 还没有运行，名字不存在，报 **NameError**，停在第 **2** 行。这是运行时异常，不是语法错误，所以第 1 行已经显示出来了。

          import 和赋值一样，要写在用到这个名字之前；通常把所有 import 放在文件最上面。
        verify: |
          import traceback
          def stop_line(code=CODE):
              try:
                  exec(compile(code, "<q>", "exec"), {})
              except SyntaxError as error:
                  return error.lineno
              except Exception as error:
                  return [frame.lineno for frame in traceback.extract_tb(error.__traceback__) if frame.filename == "<q>"][-1]
              return None
          r = run()
          if r.error is None:
              result = "works"
          elif r.lines() == ["开始"] and r.error == "NameError":
              result = "start_then_error"
          else:
              result = "nothing"
          answers = {"result": result, "stop": stop_line()}
    quiz:
      - id: py13.k1.x1
        kind: [predict]
        body: |
          `sqrt` 在 math 模块里，算平方根，结果是小数。下面哪几段程序能正常运行并显示 3.0？选出所有可以的。
        slots:
          - id: programs
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - id: plain
                content: |
                  ```python
                  import math
                  print(math.sqrt(9))
                  ```
              - id: alias_wrong
                content: |
                  ```python
                  import math as m
                  print(math.sqrt(9))
                  ```
              - id: from
                content: |
                  ```python
                  from math import sqrt
                  print(sqrt(9))
                  ```
              - id: from_wrong
                content: |
                  ```python
                  from math import sqrt
                  print(math.sqrt(9))
                  ```
              - id: late
                content: |
                  ```python
                  print(math.sqrt(9))
                  import math
                  ```
            key: [plain, from]
        explanation: |
          能显示 3.0 的是 **`import math` 加 `math.sqrt(9)`** 和 **`from math import sqrt` 加 `sqrt(9)`**：用的名字和导入时创建的一致。

          `as m` 之后只有 m，`from math import sqrt` 之后只有 sqrt，这两段再写 `math.` 都会报 NameError；import 写在 print 之后，用到时 math 还不存在，也报 NameError。
        verify: |
          answers = {"programs": [option for option, code in OPTIONS["programs"].items()
                                  if run(code).error is None and run(code).out.strip() == "3.0"]}
      - id: py13.k1.x2
        kind: [debug]
        uses: [py11.k1]
        body: |
          `pd.DataFrame()` 建一张空表，`len(表)` 是它的行数。运行 clean.py，出现了下面的报错。

          ```python startLine=1
          import pandas as pd
          table = pandas.DataFrame()
          print(len(table))
          ```

          ```text
          Traceback (most recent call last):
            File "clean.py", line 2, in <module>
              table = pandas.DataFrame()
                      ^^^^^^
          NameError: name 'pandas' is not defined
          ```
        slots:
          - id: cause
            type: choice
            prompt: 问题出在哪里？
            options:
              - { id: missing, content: 电脑上没有装 pandas }
              - { id: alias, content: 第 1 行只创建了名字 pd，没有创建 pandas }
              - { id: attribute, content: pandas 里面没有 DataFrame }
            key: alias
          - id: fix
            type: choice
            prompt: 第 2 行应改成哪一种？
            options:
              - id: pd
                content: |
                  ```python
                  table = pd.DataFrame()
                  ```
              - id: bare
                content: |
                  ```python
                  table = DataFrame()
                  ```
              - id: lower
                content: |
                  ```python
                  table = pd.dataframe()
                  ```
            key: pd
        explanation: |
          报错是第 2 行的 NameError：名字 pandas 不存在。第 1 行没有报错，说明 pandas 装好了（没装会在第 1 行报 ModuleNotFoundError）；只是 `as pd` 让它以 **pd** 这个名字出现。

          第 2 行改成 **`pd.DataFrame()`**，显示 0。单独写 `DataFrame` 是没有导入的名字；`pd.dataframe` 大小写不对，pandas 里没有这一项。
        verify: |
          lines = CODE.splitlines()
          first = run(lines[0])
          # 第 1 行单独运行没有出错，并且只创建了 pd。
          cause = "alias" if first.error is None and "pd" in first.vars and "pandas" not in first.vars and run().error == "NameError" else "other"
          fits = [option for option, line in OPTIONS["fix"].items()
                  if run("\n".join([lines[0], line, lines[2]])).out.strip() == "0"]
          answers = {"cause": cause, "fix": fits[0] if len(fits) == 1 else fits}

      - id: py13.k1.x3
        kind:
          - trace
        body: |
          from 导入只把指定对象放入当前名字空间；名字的拼写由 as 决定。填写成功调用的结果。

          ```python
          from math import sqrt as root
          print(root(49))
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '7.0'
        explanation: root 绑定到导入的 sqrt 函数，调用返回平方根 7.0。原函数的功能没有因为别名改变。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py13.k1.x4
        kind:
          - trace
        body: |
          在全新脚本中导入函数并起别名后，旧函数名不会自动额外绑定。填写实际异常类型。

          ```python
          from math import sqrt as root
          print(sqrt(49))
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: NameError
        explanation: 当前只建立了 root，未建立 sqrt。要调用这次导入的函数，应该用 root 这个名字。
        verify: |
          r = run()
          values = [as_shown(r.error)]
          answers = {f"v{i}": value for i, value in enumerate(values)}
  - id: py13.k2
    keyPrerequisites: [py04]
    title: 从签名和示例找参数、返回值与副作用
