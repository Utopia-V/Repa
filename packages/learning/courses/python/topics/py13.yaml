        kind: [specify]
        body: |
          一段文档写着：`sorted(iterable, *, key=None, reverse=False)`，返回一个新列表，不改变原输入；`reverse=True` 表示降序。
          想保留原输入并得到降序的新列表，应该选哪个调用？
        slots:
          - id: call
            type: choice
            options:
              - {id: positional, content: '`sorted(values, True)`'}
              - {id: keyword, content: '`sorted(values, reverse=True)`'}
              - {id: ascending, content: '`sorted(values)`'}
            key: keyword
        explanation: "签名中的 * 表示其后的参数只能按关键字传入，因此 reverse=True 要带上参数名。文档同时说明 sorted 返回新列表，不在原输入上排序。"
        verify: |
          programs = {"positional": "result = sorted(values, True)", "keyword": "result = sorted(values, reverse=True)", "ascending": "result = sorted(values)"}
          fits = [key for key, code in programs.items() if run(code, values=[3, 1, 2]).error is None and run(code, values=[3, 1, 2])["result"] == [3, 2, 1]]
          assert len(fits) == 1
          answers = {"call": fits[0]}
      - id: py13.k2.q5
        uses: [py04.k3]
        kind: [explain]
        body: |
          文档注明：“`sorted(values)` 返回新列表，不修改 values。”程序作者看到返回值已经排好序，就断言 values 也变了。
          根据这条约定，哪个判断成立？
        slots:
          - id: effect
            type: choice
            options:
              - {id: original, content: 返回值和原输入要分别看；values 保持原顺序}
              - {id: changed, content: 返回值排好序就证明原输入也已修改}
              - {id: none, content: 所有排序函数都返回 None}
            key: original
        explanation: "返回值与副作用是文档中的两项独立信息。这里已经明确“不修改 values”，不能从返回值有序反推原输入也被修改。"
