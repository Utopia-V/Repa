            key: base
          - id: wwpd
            type: table
            prompt: 在交互窗口里依次输入下面几行，Python 显示什么？什么也不显示填 NOTHING，报错填 ERROR。
            columns:
              - { id: input, header: 输入 }
              - { id: shown, header: 显示, input: { type: text, match: output, quick: [NOTHING, ERROR] } }
            rows:
              - { id: r1, cells: { input: "`>>> import math`", shown: NOTHING } }
              - { id: r2, cells: { input: "`>>> math.log(8, 2)`", shown: "3.0" } }
              - { id: r3, cells: { input: "`>>> math.log(100, 10)`", shown: "2.0" } }
              - { id: r4, cells: { input: "`>>> math.log(1)`", shown: "0.0" } }
        explanation: |
          第二个参数是**对数的底**：`math.log(8, 2)` 问“2 的几次方是 8”，答案 3，结果是小数，显示 **3.0**。

          | 输入 | 显示 |
          |---|---|
          | `import math` | NOTHING：import 什么也不显示 |
          | `math.log(8, 2)` | 3.0 |
          | `math.log(100, 10)` | 2.0 |
          | `math.log(1)` | 0.0：只给 x，取自然对数，1 的对数是 0 |
        verify: |
          import math
          inputs = ["import math", "math.log(8, 2)", "math.log(100, 10)", "math.log(1)"]
          shown = repl("\n".join(inputs))
          # 2 是底：2 的 3 次方是 8，与 math.log(8, 2) 的结果一致。
          answers = {
              "base": "base" if math.isclose(2 ** math.log(8, 2), 8) else "other",
              "wwpd": {f"r{i}": {"shown": text} for i, text in enumerate(shown, 1)},
