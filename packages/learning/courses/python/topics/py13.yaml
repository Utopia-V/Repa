      - id: py13.k2.q2
        kind: [predict, explain]
        uses: [py04.k3]
        body: |
          在交互窗口里依次输入下面几行。print 把内容显示在屏幕上，它交回的是 None；交互窗口不显示 None 这个值本身。
        slots:
          - id: wwpd
            type: table
            prompt: Python 显示什么？什么也不显示填 NOTHING，报错填 ERROR。
            columns:
              - { id: input, header: 输入 }
              - { id: shown, header: 显示, input: { type: text, match: output, quick: [NOTHING, ERROR] } }
            rows:
              - { id: r1, cells: { input: "`>>> y = round(3.7)`", shown: NOTHING } }
              - { id: r2, cells: { input: "`>>> y`", shown: "4" } }
              - { id: r3, cells: { input: "`>>> x = print(\"已保存\")`", shown: 已保存 } }
              - { id: r4, cells: { input: "`>>> x`", shown: NOTHING } }
              - { id: r5, cells: { input: "`>>> print(x)`", shown: None } }
          - id: side
            type: choice
            prompt: 第 3 行显示的“已保存”是什么？
            options:
              - { id: effect, content: print 的副作用，不是它的返回值 }
              - { id: value, content: print 的返回值，已经存进了 x }
            key: effect
        explanation: |
          | 输入 | 显示 | 原因 |
          |---|---|---|
          | `y = round(3.7)` | NOTHING | 赋值不显示 |
          | `y` | 4 | y 是 round 的返回值 |
          | `x = print("已保存")` | 已保存 | 赋值本身不显示，但 print 运行时把文字显示了出来 |
          | `x` | NOTHING | x 是 print 的返回值 None，交互窗口不显示 None |
          | `print(x)` | None | 用 print 才把 None 显示出来 |

          “已保存”是 print 的**副作用**，x 得到的是返回值 None。round 正好相反：没有副作用，靠返回值交出结果。
        verify: |
          inputs = ["y = round(3.7)", "y", 'x = print("已保存")', "x", "print(x)"]
          shown = repl("\n".join(inputs))
          r = run('x = print("已保存")')
          # print 运行时显示了文字，交回的值却是 None：显示的内容不是返回值。
          side = "effect" if r.out.strip() == "已保存" and r["x"] is None else "value"
          answers = {"wwpd": {f"r{i}": {"shown": text} for i, text in enumerate(shown, 1)}, "side": side}
      - id: py13.k2.q3
        kind: [modify]
        uses: [py04.k2, py04.k3]
        body: |
          宿主事先给 `mean` 赋了一个平均值，例如 3.14159。要求：把它舍入到小数点后 2 位，**存进 `result`**，后面的代码还要用 result 继续计算。

          作答框里的代码只把结果显示了出来，result 并没有得到它。按 round 的签名 `round(number, ndigits=None)` 改动代码。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              print(round(mean, 2))
            solution: |
              result = round(mean, 2)
            accepts:
              - result = round(mean, ndigits=2)
              - |
                result = round(mean, 2)
                print(result)
            rejects:
              - code: result = round(mean)
                why: 省略了 ndigits，得到的是整数
              - code: result = print(round(mean, 2))
                why: result 接住的是 print 的返回值 None
              - code: result = round(2, mean)
                why: 参数顺序反了，2 被当成要舍入的数
              - code: result = 3.14
                why: 照着例子写死了结果
            tests:
              - name: mean 为 3.14159
                setup: mean = 3.14159
                expect:
                  result: "3.14"
              - name: mean 为 2.71828
                hidden: true
                setup: mean = 2.71828
                expect:
                  result: "2.72"
        explanation: |
          ```python
          result = round(mean, 2)
          ```

          round 的返回值要赋给 result 才能继续用。`print(round(mean, 2))` 只是显示，result 没有得到任何值；`result = print(...)` 得到的是 print 的返回值 None。第二个参数按位置给 ndigits，写成 `ndigits=2` 也可以；写成 `round(2, mean)` 就把顺序弄反了。
      - id: py13.k2.q4
