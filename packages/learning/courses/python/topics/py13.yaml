      name: 读函数文档
      aliases: [签名, 文档, 返回值, 副作用, 默认值]
      definition: 签名列出参数的名字和顺序，带 = 的参数有默认值、可以省略；说明和示例告诉你函数交回什么（返回值），以及在返回之外还做了什么（副作用）。
      conditions:
        - 返回值要赋给名字或交给下一步才能继续用；显示在屏幕上是副作用，print 显示了内容，交回的却是 None。
        - 文档示例里 `>>>` 后面是输入，下一行是显示的结果；交互窗口会自动显示表达式的值，脚本不会。
      example:
        from: py13.k2.e0
        text: |
          `round(number, ndigits=None)`：ndigits 有默认值，可以省略。`round(3.14159, 2)` 是 3.14，`round(3.14159)` 是 3；恰好在正中间时取偶数，`round(2.5)` 是 2。
    lesson: |
      用一个不熟的函数之前，先读它的文档。一条文档通常有三部分。

      **签名**，例如 `round(number, ndigits=None)`：

      - 括号里是参数的名字，按位置排列：第一个是 number，第二个是 ndigits。
      - 写了 `=` 的参数有**默认值**，调用时可以省略，省略时就用默认值；没有 `=` 的参数必须给。
      - 可以按位置给，`round(3.14159, 2)`；也可以写参数名，`round(3.14159, ndigits=2)`。

      **说明**：它返回什么，有没有例外。round 的说明大意是：把 number 舍入到小数点后 ndigits 位，返回舍入后的数；省略 ndigits 时，返回最接近的整数。还有一句容易漏掉：恰好在两个整数正中间时，取偶数的那一个，所以 `round(2.5)` 是 2，`round(3.5)` 是 4。

      **示例**：文档里的示例常写成交互形式。`>>>` 后面是输入的一行，下一行是 Python 显示的结果：

      ```text
      >>> round(3.14159, 2)
      3.14
      >>> round(3.14159)
      3
      >>> x = round(2.5)
      >>> x
      2
      ```

      交互窗口里，输入一个有值的表达式会**自动显示**它的值；赋值和 import 什么也不显示。脚本里不会自动显示，要用 print。本课的 WWPD 题（Python 会显示什么）就用这种形式：什么也不显示填 NOTHING，报错填 ERROR。

      最后分清**返回值**和**副作用**。返回值是函数交回来的结果，可以赋给名字，交给下一步。副作用是函数在交回结果之外做的事，例如在屏幕上显示、写入文件。print 的作用是显示，它交回的是 None：

      ```text
      >>> x = print("已保存")
      已保存
      >>> print(x)
      None
      ```

      “已保存”是 print 的副作用；x 得到的是返回值 None。所以要继续用一个结果，就把返回值赋给名字，而不是只把它显示出来。
    example:
      id: py13.k2.e0
      kind: [predict, explain]
      uses: [py04.k1, py04.k2]
      body: |
        round 的文档摘要：

        > **round(number, ndigits=None)**
        >
        > 把 number 舍入到小数点后 ndigits 位，返回舍入后的数。省略 ndigits 时，返回最接近的整数。恰好在两个整数正中间时，取偶数的那一个。
      slots:
        - id: omit
          type: choice
          prompt: 调用 round 时，哪个参数可以省略？
          options:
            - { id: number, content: number }
            - { id: ndigits, content: ndigits }
            - { id: none, content: 两个都必须给 }
          key: ndigits
        - id: wwpd
          type: table
          prompt: 在交互窗口里依次输入下面几行，Python 显示什么？什么也不显示填 NOTHING，报错填 ERROR。
          columns:
            - { id: input, header: 输入 }
            - { id: shown, header: 显示, input: { type: text, match: output, quick: [NOTHING, ERROR] } }
          rows:
            - { id: r1, cells: { input: "`>>> round(3.14159, 2)`", shown: "3.14" } }
            - { id: r2, cells: { input: "`>>> round(3.14159)`", shown: "3" } }
            - { id: r3, cells: { input: "`>>> round(2.5)`", shown: "2" } }
            - { id: r4, cells: { input: "`>>> round(7.46, ndigits=1)`", shown: "7.5" } }
      explanation: |
        签名里 ndigits 写了 `=None`，有默认值，**可以省略**；number 没有 `=`，必须给。

        | 输入 | 显示 | 读法 |
        |---|---|---|
        | `round(3.14159, 2)` | 3.14 | 第二个参数按位置给了 ndigits，保留两位 |
        | `round(3.14159)` | 3 | 省略 ndigits，返回最接近的整数 |
        | `round(2.5)` | 2 | 正中间取偶数，不是 3 |
        | `round(7.46, ndigits=1)` | 7.5 | 用参数名给 ndigits，保留一位 |

        `round(2.5)` 是 2，这一点只有读了说明才知道；按“四舍五入”的习惯会以为是 3。
      verify: |
        import inspect
        params = inspect.signature(round).parameters
        optional = [name for name, p in params.items() if p.default is not inspect.Parameter.empty]
        inputs = ["round(3.14159, 2)", "round(3.14159)", "round(2.5)", "round(7.46, ndigits=1)"]
        shown = repl("\n".join(inputs))
        answers = {
            "omit": optional[0] if len(optional) == 1 else "none",
            "wwpd": {f"r{i}": {"shown": text} for i, text in enumerate(shown, 1)},
        }
