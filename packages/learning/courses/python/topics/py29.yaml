id: py29
title: 拼两张表之前先检查键
status: complete
minutes: 20
summary: 用 pd.merge 按键把另一张表的列补上：分清 left 与 inner 留下哪些行，看出右表键重复造成的行数增长，用 validate 和 indicator 让关系错误和没配上的行显出来。
