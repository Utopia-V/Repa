  - id: py29.k2
    title: 一对多造成行数增长
    card:
      name: 一对多行数增长
      aliases: [一对多, 行数膨胀, 键重复]
      definition: 右表里同一个键有几行，左表这个键的每一行就配出几行；所以右表的键有重复时，拼出的结果比左表的行多。
      conditions:
        - left 的结果行数 = 左表每行配上的行数之和，一行也配不上的算 1；inner 配不上的不算。
        - 多出的行不报错，之后数样本、算平均会把同一个值重复算；拼之前用 duplicated 查右表的键。
      example:
        from: py29.k2.e0
        text: |
          sites 里 S_A 有南坡、西坡两行，`pd.merge(samples, sites, on="sample_id", how="left")` 得到 5 行：S_A 两行（signal 8 出现两次），S_B、S_C、S_D 各一行。
    lesson: |
      上一个知识点里，sites 每个样本只有一行。如果 sites 里 S_A 被记了两次，一次南坡、一次西坡，samples 的 S_A 会和这两行**都**配上：

      | 行索引 | sample_id | signal | site |
      |---:|---|---:|---|
      | 0 | S_A | 8 | 南坡 |
      | 1 | S_A | 8 | 西坡 |
      | 2 | S_B | 10 | 北坡 |
      | 3 | S_C | 13 | NaN |
      | 4 | S_D | 10 | NaN |

      规则是：左表的每一行，右表里有几行同样的键，就配出几行。一行也配不上时，left 仍留它一行（补 NaN），inner 不留。所以 left 结果的行数，是左表每行“配上几行，至少算 1”加起来：这里 2 + 1 + 1 + 1 = 5。

      多出来的行不会报错，看起来也很正常。可之后数样本、算平均，S_A 和它的 8 都会被算两次。所以拼之前，先用 [duplicated](repa:concept/py25.k2) 查右表的键有没有重复：

      ```python
      sites.duplicated(subset=["sample_id"], keep=False)
      ```

      有 True 就说明这个键在右表里不止一行。这时先弄清哪一行对、该怎样处理，再拼表。
    example:
      id: py29.k2.e0
      kind: [predict]
      uses: [py29.k1, py25.k1]
      data: [samples, sites_dup]
      body: |
        这次的 sites 里，S_A 被记了两次。阅读代码，回答下面的问题。

        ```python
        result = pd.merge(samples, sites, on="sample_id", how="left")
        ```
      slots:
        - id: nrows
          type: text
          format: integer
          prompt: "`result` 有几行？"
          key: 5
        - id: counts
          type: table
          prompt: 每个样本在 `result` 里出现几次？
          columns:
            - { id: sid, header: sample_id }
            - { id: n, header: 出现次数, input: integer }
          rows:
            - { id: a, cells: { sid: S_A, n: 2 } }
            - { id: b, cells: { sid: S_B, n: 1 } }
            - { id: c, cells: { sid: S_C, n: 1 } }
            - { id: d, cells: { sid: S_D, n: 1 } }
      explanation: |
        **5** 行。S_A 在 sites 里有南坡、西坡两行，samples 的 S_A 配上了两行，所以出现 **2** 次，signal 8 也跟着出现两次。S_B 配上一行；S_C、S_D 配不上，left 仍各留一行，site 为 NaN。合起来 2 + 1 + 1 + 1 = 5。
      verify: |
        res = run()["result"]
        ids = list(res["sample_id"])
        answers = {
            "nrows": len(res),
            "counts": {sid[-1].lower(): {"n": ids.count(sid)} for sid in samples["sample_id"]},
        }
    practice:
