          ```
        slots:
          - id: key
            type: text
            prompt: sites 里哪个 sample_id 不止一行？
            key: S_A
          - id: reason
            type: choice
            prompt: 多出的一行是怎么来的？
            options:
              - id: extra
                content: sites 独有的 S_E 被加进了结果
                feedback: left 以左表为准，只在右表的键不会加进来。
              - id: nan
                content: 配不上的 S_C、S_D 被各算了两次
                feedback: 配不上的样本在 left 里只留一行。
              - id: dup
                content: S_A 在 sites 里有两行，samples 的 S_A 配上了两行
            key: dup
        explanation: |
          sites 里 **S_A** 有两行（南坡、西坡），samples 的 S_A 和两行都配上，结果多出一行。S_E 只在右表，不会进 left 的结果；S_C、S_D 配不上，各留一行。

          `len(result)` 数的是行数，不是样本数。右表的键有重复时，两者就不再相等。
        verify: |
          res = run()["result"]
          ids = list(res["sample_id"])
          dups = list(sites.loc[sites.duplicated(subset=["sample_id"], keep=False), "sample_id"].unique())
          holds = {
              "dup": len(dups) > 0 and all(ids.count(s) == list(sites["sample_id"]).count(s) for s in dups),
              "extra": "S_E" in ids,
              "nan": ids.count("S_C") > 1 or ids.count("S_D") > 1,
          }
          true = [reason for reason, ok in holds.items() if ok]
          answers = {"key": dups[0] if len(dups) == 1 else dups, "reason": true[0] if len(true) == 1 else true}
