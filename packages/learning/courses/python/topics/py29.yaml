        explanation: |
          逐个样本数配上几行：S_A 1 行，S_B 3 行，S_C、S_D 各 0 行。

          left 里配不上的也留一行：1 + 3 + 1 + 1 = **6**。inner 只算配上的：1 + 3 = **4**。两种写法都因为 S_B 重复而多出了行。
        verify: |
