notes: |
  范围：只用 pd.merge 的 on、how（left、inner）、validate、indicator，键都是一列、没有缺失。right、outer、多列键、suffixes、按索引连接都不在本节。pandas 的缺失键会互相配上，只在 k3 的讲解和概念卡里提醒一句，不出题。groupby、count 等汇总由 py26、py27 承担，这里的行数只用 len 和 shape 读。
  衔接：k2 用 py25 的 duplicated(subset=..., keep=False) 先查右表的键；k3 的未匹配行用 py17 的 `.loc[掩码, 列名列表]` 取出，题面里“布尔列 .sum() 数 True 的个数”就地说明。
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）。没有小改代码题；“选哪一行代码符合需求”的题由程序逐个运行选项核对。
  节奏（待试做校准）：开场与读表 2 分钟；k1 讲解及例题 3 分钟、练习 3 分钟；k2 讲解及例题 2 分钟、练习 3 分钟；k3 讲解及例题 3 分钟、练习 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。复习和测验题全部由程序核对：挑写法的题，另用把右表某一行复制一份的表逐个运行选项，检查是否在键重复时报错。只有练习 py29.k3.q3（把需求对应到三个参数）程序算不出，列在 manual。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始，前面题目里的 `result` 等变量都已清除。大多数题用两张表：表 samples 是四个样本的测量记录，`sample_id` 是样本编号，`signal` 是测量值（任意单位），左边是原行索引；表 sites 记下每个样本是在哪个采样点（`site`）取的。按 `sample_id` 把采样点补到 samples 上，就是这一节要读的“拼表”。NaN 表示缺失值。
wrapup: |
  向同事或 AI 提拼表的需求时，可以这样说：“按 sample_id 把 sites 的 site 补到 samples 上：samples 每一行都保留，配不上的留空；sites 里每个 sample_id 最多一行，重复就报错；配不上的样本单独列出来。结果的行数应当等于 samples 的行数。”

  对应的代码是 `how="left"`、`validate="many_to_one"`、`indicator=True`。拿到别人的拼表代码，先看 how 留下谁，再问右表的键是不是唯一，最后比一比结果和左表的行数。
