      - id: py29.k2.q2
        kind: [debug]
        uses: [py29.k1, py25.k2]
        data: [samples, sites_dup]
        body: |
          同事拼完表后，用下面的代码数样本数，屏幕显示 5，可是 samples 里只有 4 个样本。

          ```python
