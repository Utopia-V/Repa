  - id: py29.k3
    title: validate 与 indicator 暴露关系错误和未匹配项
    card:
      name: validate 与 indicator
      aliases: [validate, indicator, _merge, MergeError]
      definition: validate="many_to_one" 要求右表每个键最多一行，不满足就报 MergeError；indicator=True 加一列 _merge，标出每行是 both（配上了）还是 left_only（只在左表）。
      conditions:
        - validate 只查键有没有重复，不查配不配得上；没配上的要看 _merge 去数。
        - 两张表的键列都有缺失时，pandas 会让缺失的键互相配上；拼之前先用 isna 查键列。
      example:
        from: py29.k3.e0
        text: |
          ```python
          result = pd.merge(samples, sites, on="sample_id", how="left",
                            validate="many_to_one", indicator=True)
          ```
          sites 的键不重复，不报错；_merge 依次为 both、both、left_only、left_only，S_C、S_D 没配上。
    lesson: |
      行数变多不会报错，配不上的行也只是悄悄补 NaN。`pd.merge` 有两个参数，能把这两件事摆到明面上。

      **validate 写下两张表的键是什么关系。** `validate="many_to_one"` 的意思是“左边多、右边一”：左表里同一个键可以有好几行（比如同一个样本测了两次），右表里每个键最多一行。右表的键一旦重复，`pd.merge` 不再悄悄多出行，而是报错 `MergeError`，程序停在这一行。同样的读法，`"one_to_many"` 是“左边一、右边多”，`"one_to_one"` 要求两边的键都不重复。validate 只检查键有没有重复，不管配不配得上。

      **indicator 给每一行标出来历。** 加上 `indicator=True`，结果多出一列 `_merge`：`both` 是两边都有，`left_only` 是只在左表、没配上。（`right_only` 只出现在保留右表独有键的拼法里，left 和 inner 都不会有。）

      ```python
      result = pd.merge(samples, sites, on="sample_id", how="left",
                        validate="many_to_one", indicator=True)
      unmatched = result.loc[result["_merge"] == "left_only", ["sample_id"]]
      ```

      第二行用[布尔掩码](repa:concept/py17.k1)取出没配上的样本，交给负责人核对。

      还有一点要先查：如果两张表的键列都有缺失值，pandas 会让缺失的键互相配上，这和很多人的直觉不同。拼之前，先用 [isna](repa:concept/py19.k1) 看看键列有没有缺失。
    example:
      id: py29.k3.e0
      kind: [predict]
      uses: [py29.k1, py29.k2]
      data: [samples, sites]
      body: |
        阅读代码，说出运行的结果。

        ```python
        result = pd.merge(samples, sites, on="sample_id", how="left",
                          validate="many_to_one", indicator=True)
        ```
      slots:
        - id: error
          type: choice
          prompt: 这一行会报错吗？
          options:
            - { id: merge-error, content: 报 MergeError }
            - { id: "no", content: 不报错，正常得到 result }
          key: "no"
        - id: merge
          type: table
          prompt: 按结果的行顺序填写 `_merge` 列。
          columns:
            - { id: sid, header: sample_id }
            - id: merge
              header: _merge
              input:
                type: choice
                options:
                  - { id: both, label: both }
                  - { id: leftonly, label: left_only }
                  - { id: rightonly, label: right_only }
          rows:
            - { id: r0, cells: { sid: S_A, merge: both } }
            - { id: r1, cells: { sid: S_B, merge: both } }
            - { id: r2, cells: { sid: S_C, merge: leftonly } }
            - { id: r3, cells: { sid: S_D, merge: leftonly } }
        - id: unmatched
          type: text
          format: integer
          prompt: "`_merge` 为 left_only 的有几行？"
          key: 2
      explanation: |
        **不报错**：sites 里每个 sample_id 只有一行，符合“左边多、右边一”。

        `_merge` 依次为 **both、both、left_only、left_only**：S_A、S_B 在两张表里都有；S_C、S_D 只在 samples 里，没配上。所以 left_only 有 **2** 行。只在 sites 里的 S_E 不进 left 的结果，也就没有 right_only。
      verify: |
        r = run()
        res = r["result"]
        answers = {
            "error": "no" if r.error is None else "merge-error" if r.error == "MergeError" else r.error,
            "merge": {f"r{position}": {"merge": str(value).replace("_", "")} for position, value in enumerate(res["_merge"])},
            "unmatched": int((res["_merge"] == "left_only").sum()),
        }
    practice:
      - id: py29.k3.q1
        kind: [predict]
        uses: [py29.k2]
        data: [samples, sites_dup]
        body: |
          这次的 sites 里，S_A 被记了两次。

          ```python
          result = pd.merge(samples, sites, on="sample_id", how="left", validate="many_to_one")
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行这一行会怎样？
            options:
              - { id: five, content: 不报错，result 有 5 行 }
              - { id: error, content: 报 MergeError，没有得到 result }
              - id: four
                content: 不报错，result 有 4 行，重复的 S_A 只留一行
                feedback: validate 不会替你挑一行留下，它只检查，不满足就报错。
            key: error
          - id: without
            type: text
            format: integer
            prompt: 如果去掉 `validate="many_to_one"`，这一行不报错，result 有几行？
            key: 5
        explanation: |
          **报 MergeError**。`many_to_one` 要求右表每个 sample_id 最多一行，sites 里 S_A 有两行，不满足，程序停在这一行。

          去掉 validate，它就照常拼出 **5** 行，S_A 多出一行，而且不会提醒任何人。validate 的用处就在这里：把“右表每个键只有一行”这个前提写进代码，不满足时立刻停下。
        verify: |
          r = run()
          plain = run('result = pd.merge(samples, sites, on="sample_id", how="left")')
          outcome = "error" if r.error == "MergeError" else {5: "five", 4: "four"}.get(len(r["result"]), "other") if r.error is None else r.error
          answers = {"outcome": outcome, "without": len(plain["result"])}
      - id: py29.k3.q2
        kind: [predict]
        uses: [py17.k1, py17.k2, py29.k1]
        data: [samples, sites]
        body: |
          阅读代码，说出 `unmatched` 的样子。

          ```python
          result = pd.merge(samples, sites, on="sample_id", how="left", indicator=True)
          unmatched = result.loc[result["_merge"] == "left_only", ["sample_id"]]
          ```
        slots:
          - id: rows
            type: order
            partial: true
            prompt: "`unmatched` 里有哪些样本？按先后顺序排出 sample_id。"
            items:
              - { id: SA, content: S_A }
              - { id: SB, content: S_B }
              - { id: SC, content: S_C }
              - { id: SD, content: S_D }
              - { id: SE, content: S_E }
            key: [SC, SD]
          - id: index
            type: choice
            prompt: "`unmatched` 的行索引是"
            options:
              - { id: original, content: 22、4 }
              - { id: zeroone, content: 0、1 }
              - { id: twothree, content: 2、3 }
            key: twothree
        explanation: |
          `unmatched` 里是 **S_C、S_D**：它们在 sites 里找不到，`_merge` 为 left_only。

          行索引是 **2、3**。`result` 的行索引已经重新编号为 0 到 3，`.loc` 用掩码选行时保留的是 `result` 的标签，所以是 2、3；samples 原来的 22、4 在拼表时就没有带过来。
        verify: |
          u = run()["unmatched"]
          labels = tuple(int(label) for label in u.index)
          answers = {
              "rows": [s.replace("_", "") for s in u["sample_id"]],
              "index": {(22, 4): "original", (0, 1): "zeroone", (2, 3): "twothree"}.get(labels, "other"),
          }
      - id: py29.k3.q3
        kind: [specify]
        uses: [py12.k1, py25.k1]
        body: |
          负责人的要求是：“给每个样本补上采样点：samples 里的样本一个不能少，也不能因为 sites 记重了而多出行——sites 里同一个样本出现两次就立刻报错；配不上的样本要能单独列出来。”

          把它对应到 `pd.merge(samples, sites, on="sample_id", ...)` 的三个参数。
        slots:
          - id: how
            type: choice
            prompt: how
            options:
              - { id: inner, content: '`how="inner"`' }
              - { id: left, content: '`how="left"`' }
            key: left
          - id: validate
            type: choice
            prompt: validate
            options:
              - { id: none, content: 不写 validate }
              - { id: onemany, content: '`validate="one_to_many"`' }
              - { id: manyone, content: '`validate="many_to_one"`' }
            key: manyone
          - id: indicator
            type: choice
            prompt: indicator
            options:
              - { id: "yes", content: "`indicator=True`" }
              - { id: "no", content: 不写 indicator }
            key: "yes"
        explanation: |
          `how="left"`、`validate="many_to_one"`、`indicator=True`。

          “一个不能少”要 left，inner 会丢掉配不上的样本；“sites 记重了就报错”是右表每个键最多一行，也就是“左边多、右边一”，`one_to_many` 检查的是左表，方向反了，不写 validate 则只会悄悄多出行；“配不上的单独列出来”可以用 `_merge` 为 left_only 的行取出。
        manual: [how, validate, indicator]
    review:
      - id: py29.k3.r1
        kind: [explain]
        uses: [py29.k2, py25.k1]
        data: [plants_rep, plots]
        body: |
          plants 里同一株可以量好几次（P1 就有两行），plots 里每株只能登记一个地块。要让拼表在 plots 的 plant_id 有重复时报错、没有重复时照常运行，应该用哪一行？
        slots:
          - id: line
            type: choice
            options:
              - id: oneone
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="left", validate="one_to_one")
                  ```
                feedback: one_to_one 还要求 plants 的键不重复；P1 量了两次，现在就会报错。
              - id: none
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="left")
                  ```
                feedback: 不写 validate，plots 记重了也不会报错，只会悄悄多出行。
              - id: manyone
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="left", validate="many_to_one")
                  ```
              - id: onemany
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="left", validate="one_to_many")
                  ```
                feedback: one_to_many 要求的是 plants 的键不重复，方向反了；P1 量了两次，现在就会报错。
            key: manyone
        explanation: |
          用 `validate="many_to_one"`：左表 plants 里同一株可以有多行，右表 plots 里每株最多一行。现在的 plots 没有重复，照常运行；plots 一旦记重，就报 MergeError。

          `one_to_one` 和 `one_to_many` 都要求 plants 的键不重复，P1 有两行，现在就会报错；不写 validate 则永远不会报错。
        verify: |
          # 另造一份把第一行复制一次的 plots，检查每个写法在两种 plots 下的表现。
          dup = pd.concat([plots, plots.iloc[[0]]], ignore_index=True)
          fits = [option for option, code in OPTIONS["line"].items()
                  if run(code).error is None and run(code, plots=dup).error == "MergeError"]
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py29.k3.r2
        kind: [predict, explain]
        uses: [py29.k1, py19.k1]
        data: [plants, plots]
        body: |
          ```python
          result = pd.merge(plants, plots, on="plant_id", how="left", indicator=True)
          ```

          关于 `result`，下面哪些说法正确？选出所有正确的。
        slots:
          - id: claims
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: boththree, content: "`_merge` 为 both 的有 3 行" }
              - { id: p7right, content: "P7 那一行的 `_merge` 是 right_only" }
              - { id: noright, content: "`_merge` 列里没有 right_only" }
              - { id: leftnan, content: "`_merge` 为 left_only 的行，plot 都是 NaN" }
            key: [noright, leftnan]
        explanation: |
          正确的是“没有 right_only”和“left_only 的行，plot 都是 NaN”。left 以 plants 为准：P2、P4 配上了，是 both（2 行，不是 3 行）；P1、P3 没配上，是 left_only，plot 补 NaN。P7 只在 plots 里，根本不进结果，所以也没有 right_only 的行。每个选项的勾选状态分别计分。
        verify: |
          res = run()["result"]
          tag = res["_merge"].astype(str)
          holds = {
              "boththree": int((tag == "both").sum()) == 3,
              "p7right": bool(((res["plant_id"] == "P7") & (tag == "right_only")).any()),
              "noright": not bool((tag == "right_only").any()),
              "leftnan": bool((tag == "left_only").any()) and bool(res.loc[tag == "left_only", "plot"].isna().all()),
          }
          answers = {"claims": [claim for claim, ok in holds.items() if ok]}
    quiz:
      - id: py29.k3.x1
        kind: [predict]
        uses: [py29.k2, py25.k2]
        data: [bottles, labs_dup]
        body: |
          ```python
          result = pd.merge(bottles, labs, on="bottle_id", how="left", validate="many_to_one")
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行这一行会怎样？
            options:
              - { id: seven, content: 不报错，result 有 7 行 }
              - { id: four, content: 不报错，result 有 4 行 }
              - { id: error, content: 报 MergeError }
            key: error
          - id: culprits
            type: choice
            multiple: true
            prompt: labs 里哪些 bottle_id 不止一行？选出所有的。
            options:
              - { id: B1, content: B1 }
              - { id: B2, content: B2 }
              - { id: B3, content: B3 }
              - { id: B4, content: B4 }
            key: [B2, B4]
        explanation: |
          **报 MergeError**。labs 里 **B2** 有两行、**B4** 有三行，不满足右表每个键最多一行。没有 validate 时，这一行会悄悄拼出 7 行；有了它，错误在拼表这一步就暴露出来，要先弄清这两瓶水样到底送到了哪个实验室。
        verify: |
          r = run()
          outcome = "error" if r.error == "MergeError" else {7: "seven", 4: "four"}.get(len(r["result"]), "other") if r.error is None else r.error
          dups = labs.loc[labs.duplicated(subset=["bottle_id"], keep=False), "bottle_id"].unique()
          answers = {"outcome": outcome, "culprits": sorted(dups)}
      - id: py29.k3.x2
        kind: [specify]
        uses: [py12.k1, py29.k1, py29.k2]
        data: [survey, regions]
        body: |
          需求是：“给每份问卷补上地区：survey 里的问卷一份不能少，也不能因为 regions 登记重复而多出行——regions 里同一份问卷出现两次就报错；还要能数出有几份问卷没查到地区。”哪一种写法符合这条需求？
        slots:
          - id: line
            type: choice
            options:
              - id: plain
                content: |
                  ```python
                  result = pd.merge(survey, regions, on="resp_id", how="left",
                                    indicator=True)
                  ```
                feedback: 没写 validate，regions 记重了也不会报错，只会悄悄多出行。
              - id: onemany
                content: |
                  ```python
                  result = pd.merge(survey, regions, on="resp_id", how="left",
                                    validate="one_to_many", indicator=True)
                  ```
                feedback: one_to_many 检查的是 survey 的键，regions 记重了照样通过。
              - id: inner
                content: |
                  ```python
                  result = pd.merge(survey, regions, on="resp_id", how="inner",
                                    validate="many_to_one", indicator=True)
                  ```
                feedback: inner 会丢掉没查到地区的问卷。
              - id: right
                content: |
                  ```python
                  result = pd.merge(survey, regions, on="resp_id", how="left",
                                    validate="many_to_one", indicator=True)
                  ```
            key: right
        explanation: |
          符合的是 `how="left"`、`validate="many_to_one"`、`indicator=True` 那一种。left 让 survey 的问卷一份不少；`many_to_one` 要求 regions 每个 resp_id 最多一行，记重了就报错；`_merge` 为 left_only 的行就是没查到地区的问卷，这张表里是 R2、R5 两份。

          inner 会丢掉 R2、R5；不写 validate 或写成 `one_to_many`，regions 记重时都不会报错。
        verify: |
          # 逐个运行写法：现在的表上要保留全部问卷、标出没配上的；把 regions 的一行复制一份后要报 MergeError。
          dup = pd.concat([regions, regions.iloc[[0]]], ignore_index=True)
          ids = list(survey["resp_id"])
          missing = len([resp for resp in ids if resp not in list(regions["resp_id"])])
          fits = []
          for option, code in OPTIONS["line"].items():
              now = run(code)
              if now.error is not None:
                  continue
              res = now["result"]
              if list(res["resp_id"]) != ids or "_merge" not in res.columns:
                  continue
              if int((res["_merge"] == "left_only").sum()) != missing:
                  continue
              if run(code, regions=dup).error != "MergeError":
                  continue
              fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits}
