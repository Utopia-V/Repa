kps:
  - id: py29.k1
    title: left/inner join 怎样保留记录
    card:
      name: 按键拼表
      aliases: [merge, left join, inner join, 连接]
      definition: pd.merge(左表, 右表, on=键列, how=...) 按键列的值把右表的列配到左表的行上：how="left" 留下左表每一行，配不上的补 NaN；how="inner" 只留两张表都有的键。
      conditions:
        - 只在右表里出现的键，left 和 inner 都不会加进结果。
        - 结果的行顺序跟左表走，行索引重新编号为 0、1、2……，左表原来的行索引不保留。
      example:
        from: py29.k1.e0
        text: |
          ```python
          result = pd.merge(samples, sites, on="sample_id", how="left")
          ```
          samples 的 S_A、S_B、S_C、S_D 都留下；sites 里没有 S_C、S_D，它们的 site 是 NaN；只在 sites 里的 S_E 不出现。行索引变成 0、1、2、3。
    lesson: |
      想知道每个样本是在哪个采样点取的，就要按两张表都有的 `sample_id`，把 sites 的 `site` 配到 samples 的每一行上。这一列叫**键**：两边的值相同，就认为说的是同一个样本。

      ```python
      result = pd.merge(samples, sites, on="sample_id", how="left")
      ```

      `pd.merge` 的第一张表叫左表，第二张叫右表；`on` 写键列，`how` 决定留下哪些行：

      - `how="left"`：左表每一行都留下。右表里找不到的样本，补上的列是缺失值 NaN。
      - `how="inner"`：只留两张表都有的键，配不上的左表行被丢掉。

      上面这行代码的结果：

      | 行索引 | sample_id | signal | site |
      |---:|---|---:|---|
      | 0 | S_A | 8 | 南坡 |
      | 1 | S_B | 10 | 北坡 |
      | 2 | S_C | 13 | NaN |
      | 3 | S_D | 10 | NaN |

      换成 `how="inner"`，只剩 S_A、S_B 两行。只在 sites 里出现的 S_E，两种写法都不会加进来。

      还有两处要留意：行的顺序跟左表走，不跟右表；结果的行索引重新从 0 编号，samples 原来的 31、7、22、4 没有带过来。`samples.merge(sites, on="sample_id", how="left")` 是同一件事的另一种写法。
    example:
      id: py29.k1.e0
      kind: [predict]
      uses: [py14.k1, py19.k1]
      data: [samples, sites]
      body: |
        要给每个样本补上采样点，同事写了下面这行。阅读代码，说出 `result` 的样子。

        ```python
        result = pd.merge(samples, sites, on="sample_id", how="left")
        ```
      slots:
        - id: rows
          type: order
          partial: true
          prompt: "`result` 里依次是哪些样本？按结果的先后顺序排出 sample_id，结果里没有的不要放进来。"
          items:
            - { id: SA, content: S_A }
            - { id: SB, content: S_B }
            - { id: SC, content: S_C }
            - { id: SD, content: S_D }
            - { id: SE, content: S_E }
          key: [SA, SB, SC, SD]
        - id: site
          type: text
          prompt: 结果里 S_C 那一行的 site 是什么？
          quick: [NaN]
          key: "NaN"
        - id: index
          type: choice
          prompt: "`result` 的行索引依次是"
          options:
            - { id: original, content: 31、7、22、4 }
            - { id: renumbered, content: 0、1、2、3 }
            - { id: sorted, content: 4、7、22、31 }
          key: renumbered
      explanation: |
        | 行索引 | sample_id | signal | site |
        |---:|---|---:|---|
        | 0 | S_A | 8 | 南坡 |
        | 1 | S_B | 10 | 北坡 |
        | 2 | S_C | 13 | NaN |
        | 3 | S_D | 10 | NaN |

        `how="left"` 留下 samples 的**全部四行**，顺序和 samples 一样，不按 sites 的顺序。sites 里没有 S_C，它的 site 是 **NaN**；只在 sites 里的 S_E 不进结果。行索引重新编号为 **0、1、2、3**，原来的 31、7、22、4 没有带过来。
      verify: |
        res = run()["result"]
        c = res.loc[res["sample_id"] == "S_C", "site"]
        labels = list(res.index)
        answers = {
            "rows": [s.replace("_", "") for s in res["sample_id"]],
            "site": "NaN" if len(c) == 1 and pd.isna(c.iloc[0]) else list(c),
            "index": "renumbered" if labels == list(range(len(res))) else "original" if labels == list(samples.index) else labels,
        }
    practice:
      - id: py29.k1.q1
        kind: [predict]
        uses: [py14.k2]
        data: [samples, sites]
        body: |
          这次同事只想要两张表都有记录的样本。阅读代码，说出 `result` 的样子。

          ```python
          result = pd.merge(samples, sites, on="sample_id", how="inner")
          ```
        slots:
          - id: rows
            type: order
            partial: true
            prompt: 留下了哪些样本？按结果的先后顺序排出 sample_id。
            items:
              - { id: SA, content: S_A }
              - { id: SB, content: S_B }
              - { id: SC, content: S_C }
              - { id: SD, content: S_D }
              - { id: SE, content: S_E }
            key: [SA, SB]
          - id: nrows
            type: text
            format: integer
            prompt: "`result.shape` 的第一个数（行数）"
            key: 2
          - id: ncols
            type: text
            format: integer
            prompt: "`result.shape` 的第二个数（列数）"
            key: 3
        explanation: |
          只留 **S_A、S_B** 两行，顺序跟 samples 走（S_A 在前），不跟 sites（sites 里 S_B 在前）。S_C、S_D 在 sites 里找不到，inner 把它们丢掉；S_E 只在 sites 里，也不进结果。列是 sample_id、signal、site 三列，键列只出现一次，shape 为 **(2, 3)**。
        verify: |
          res = run()["result"]
          answers = {
              "rows": [s.replace("_", "") for s in res["sample_id"]],
              "nrows": res.shape[0],
              "ncols": res.shape[1],
          }
      - id: py29.k1.q2
        kind: [predict]
        uses: [py14.k1]
        data: [samples, sites]
        body: |
          同一对表，分别用两种写法拼接：

          ```python
          left_result = pd.merge(samples, sites, on="sample_id", how="left")
          inner_result = pd.merge(samples, sites, on="sample_id", how="inner")
          ```

          S_C 只在 samples 里，S_E 只在 sites 里。它们各自会不会出现在每种结果里？出现填 True，不出现填 False。
        slots:
          - id: presence
            type: table
            columns:
              - { id: way, header: 结果 }
              - { id: sc, header: S_C 出现吗, input: bool }
              - { id: se, header: S_E 出现吗, input: bool }
            rows:
              - { id: left, cells: { way: left_result, sc: true, se: false } }
              - { id: inner, cells: { way: inner_result, sc: false, se: false } }
        explanation: |
          | 结果 | S_C | S_E |
          |---|---|---|
          | left_result | True | False |
          | inner_result | False | False |

          left 保留左表每一行，所以 S_C 在（site 为 NaN）；inner 只留两边都有的键，S_C 被丢掉。S_E 只在右表，**两种写法都不会加进来**：left 和 inner 都以左表为准，不会多出左表没有的样本。
        verify: |
          r = run()
          answers = {"presence": {
              name: {
                  "sc": "S_C" in list(r[f"{name}_result"]["sample_id"]),
                  "se": "S_E" in list(r[f"{name}_result"]["sample_id"]),
              }
              for name in ["left", "inner"]
          }}
      - id: py29.k1.q3
        kind: [debug]
        uses: [py12.k1]
        data: [samples, sites]
        body: |
          需求是：“给每个样本补上采样点；samples 里的样本一个都不能少，查不到采样点的留空。”同事写的是：

          ```python
          result = pd.merge(samples, sites, on="sample_id", how="inner")
          ```

          结果只有 2 行。应该把这一行改成哪一种？
        slots:
          - id: fix
            type: choice
            options:
              - id: swap
                content: |
                  ```python
                  result = pd.merge(sites, samples, on="sample_id", how="inner")
                  ```
                feedback: 交换左右表，inner 仍然只留两边都有的键，S_C、S_D 还是没有。
              - id: left
                content: |
                  ```python
                  result = pd.merge(samples, sites, on="sample_id", how="left")
                  ```
              - id: sitesleft
                content: |
                  ```python
                  result = pd.merge(sites, samples, on="sample_id", how="left")
                  ```
                feedback: 这样 sites 成了左表，留下的是 sites 的每一行：S_E 进来了，S_C、S_D 还是没有。
            key: left
        explanation: |
          改成 `pd.merge(samples, sites, on="sample_id", how="left")`：samples 是左表，`how="left"` 让它的四行都留下，查不到采样点的 S_C、S_D 的 site 为 NaN。

          只交换两张表的位置没有用：inner 不管谁在左边，都只留两边都有的键；把 sites 放在左边再用 left，留下的就成了 sites 的每一行。
        verify: |
          need = list(samples["sample_id"])
          fits = []
          for option, code in OPTIONS["fix"].items():
              res = run(code)["result"]
              if list(res["sample_id"]) == need and list(res["signal"]) == list(samples["signal"]):
                  fits.append(option)
          answers = {"fix": fits[0] if len(fits) == 1 else fits}
    review:
      - id: py29.k1.r1
        kind: [predict, explain]
        uses: [py14.k1]
        data: [plants, plots, shown]
        body: |
          同事用下面某一行代码，从 plants 和 plots 得到了上面第三张表 result。
        slots:
          - id: line
            type: choice
            prompt: 是哪一行？
            options:
              - id: plotsfirst
                content: |
                  ```python
                  result = pd.merge(plots, plants, on="plant_id", how="inner")
                  ```
                feedback: plots 在左边时，行按 plots 的顺序排（P4 在 P2 前面），列也是 plot 在 height 前面。
              - id: left
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="left")
                  ```
                feedback: left 会留下 plants 的全部四株，P1、P3 的 plot 为 NaN。
              - id: inner
                content: |
                  ```python
                  result = pd.merge(plants, plots, on="plant_id", how="inner")
                  ```
            key: inner
          - id: other
            type: text
            format: integer
            prompt: 如果写成 `pd.merge(plants, plots, on="plant_id", how="left")`，result 有几行？
            key: 4
        explanation: |
          是 `pd.merge(plants, plots, on="plant_id", how="inner")`。result 只有 P2、P4：这两株在两张表里都有，P1、P3 在 plots 里找不到被丢掉，只在 plots 里的 P7 不进结果。行的顺序（P2 在前）和列的顺序（height 在 plot 前）都跟 plants 走，说明 plants 是左表。

          换成 left，plants 的 **4** 株都留下，P1、P3 的 plot 为 NaN。
        verify: |
          def same(res):
              return (list(res.columns) == list(shown.columns)
                      and res.astype(str).values.tolist() == shown.astype(str).values.tolist())
          fits = [option for option, code in OPTIONS["line"].items() if same(run(code)["result"])]
          left = run('result = pd.merge(plants, plots, on="plant_id", how="left")')["result"]
          answers = {"line": fits[0] if len(fits) == 1 else fits, "other": len(left)}
      - id: py29.k1.r2
        kind: [predict]
        uses: [py14.k1, py19.k1]
        data: [survey, regions]
        body: |
          阅读代码，按 `result` 的行顺序，写出每一行的 resp_id 和 region；没有值的写 NaN。

          ```python
          result = pd.merge(survey, regions, on="resp_id", how="left")
          ```
        slots:
          - id: nrows
            type: text
            format: integer
            prompt: "`result` 有几行？"
            key: 5
          - id: rows
            type: table
            columns:
              - { id: pos, header: 行索引 }
              - { id: resp, header: resp_id, input: text }
              - { id: region, header: region, input: { type: text, quick: [NaN] } }
            rows:
              - { id: r0, cells: { pos: "0", resp: R1, region: 华东 } }
              - { id: r1, cells: { pos: "1", resp: R2, region: "NaN" } }
              - { id: r2, cells: { pos: "2", resp: R3, region: 华北 } }
              - { id: r3, cells: { pos: "3", resp: R4, region: 西南 } }
              - { id: r4, cells: { pos: "4", resp: R5, region: "NaN" } }
        explanation: |
          | 行索引 | resp_id | score | region |
          |---:|---|---:|---|
          | 0 | R1 | 4 | 华东 |
          | 1 | R2 | 2 | NaN |
