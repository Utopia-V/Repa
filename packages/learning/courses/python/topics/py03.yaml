  - id: py03.k3
    title: None 表示没有值而不是零
    card:
      name: None
      aliases: [没有值, 缺省值, 空值]
      definition: None 是 Python 里表示“这里没有值”的特殊值，用来记没测、没记或还没算出来的数据；它不是 0，也不是空文字 ""。
      conditions:
        - 0 是测到了零，"" 是一段空文字，None 是没有值，三者不能互相代替。
        - None 不能参与计算：None + 1 会报 TypeError。
        - str(None) 是四个字母的文字 "None"，并不是空的。
      example:
        from: py03.k3.e0
        text: |
          ```python
          plate_a = 0
          plate_b = None
          print(plate_a + 5)
          print(plate_b)
          ```
          显示 5 和 None；再写 print(plate_b + 5) 会报 TypeError。
    lesson: |
      记录数据时，“测到 0”和“没测”是两回事。数平板上的菌落：一块板一个菌落也没长，记 0；另一块板被污染了没有数，就不该记 0，否则算平均时会把结果拉低。Python 用一个专门的值 `None` 表示“这里没有值”：

      ```python
      plate_a = 0      # 数过了，确实是 0 个
      plate_b = None   # 没有数，没有值
      ```

      `None` 不加引号，首字母大写。它和另外两个“看起来像空”的值不同：

      | 值 | 类型 | 意思 |
      |---|---|---|
      | `0` | 整数 | 测到了零 |
      | `""` | 文字 | 一段空文字，里面没有字 |
      | `None` | 特殊值 | 没有值 |

      `print(plate_b)` 会显示 None。`None` 不能参与计算：`plate_b + 1` 会报 TypeError，程序停下。这是好事：缺了数据时程序停下来提醒你，比悄悄当成 0、算出一个错的结果好。

      `str(None)` 得到的是四个字母的文字 "None"，不是空文字；把它拼进报告，报告里就会出现 None 这几个字母。
    example:
      id: py03.k3.e0
      kind: [predict]
      uses: [py01.k1]
      body: |
        两块平板：`plate_a` 数过了，一个菌落也没长；`plate_b` 被污染了，没有数。

        ```python
        plate_a = 0
        plate_b = None
        print(plate_a + 5)
        print(plate_b)
        ```
      slots:
        - id: first
          type: text
          format: integer
          prompt: 第一行显示什么？
          key: 5
        - id: second
          type: text
          match: output
          prompt: 第二行显示什么？
          key: None
        - id: extra
          type: choice
          prompt: 如果在末尾再加一行 `print(plate_b + 5)`，会怎样？
          options:
            - { id: none, content: 显示 None }
            - { id: five, content: 显示 5 }
            - { id: error, content: 报错停下（TypeError） }
          key: error
      explanation: |
        第一行显示 **5**：0 是一个真正的数，0 + 5 = 5。第二行显示 **None**：print 把“没有值”显示成 None。

        `None` 不能参与计算，`print(plate_b + 5)` 会报 TypeError。没数的板不会被悄悄当成 0 算进去。
      verify: |
        lines = run().lines()
        extra = run(CODE + "\nprint(plate_b + 5)")
        shown = {"5": "five", "None": "none"}
        answers = {
            "first": int(lines[0]),
            "second": lines[1],
            "extra": "error" if extra.error == "TypeError" else shown.get(extra.lines()[-1], "other"),
        }
