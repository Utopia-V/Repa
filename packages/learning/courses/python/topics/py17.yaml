        data: [T]
        body: |
          需求是：

          > 保留 signal 至少达到 `limit` 的行，只输出 sample_id 一列，结果仍是一张表。保留原行顺序和原索引，不改变 `df`。`limit` 或原表的测量值变化时，代码仍按这一规则工作。

