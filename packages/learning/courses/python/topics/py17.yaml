        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              mask = df["signal"] > limit
              result = df.loc[mask, ["sample_id", "signal"]]
            solution: |
              mask = df["signal"] >= limit
              result = df.loc[mask, ["sample_id"]]
            accepts:
              - result = df.loc[df["signal"] >= limit, ["sample_id"]]
              - result = df[df["signal"] >= limit][["sample_id"]]
            rejects:
              - code: |
                  mask = df["signal"] >= limit
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 只改了比较符，仍多输出 signal 列
              - code: |
                  mask = df["signal"] > limit
                  result = df.loc[mask, ["sample_id"]]
                why: 只删了列，仍漏掉恰好等于阈值的行
              - code: result = df.loc[df["signal"] >= 10, ["sample_id"]]
                why: 把阈值写死成 10
              - code: result = df.loc[df["signal"] >= limit, "sample_id"]
                why: 列名没有写成列表，结果成了一列（Series）
              - code: result = df.loc[df["signal"] >= limit, ["sample_id"]].reset_index(drop=True)
                why: 把索引重新编号成 0、1、2
              - code: |
                  df = df[df["signal"] >= limit]
                  result = df[["sample_id"]]
                why: 把 df 换成了筛选后的表
              - code: result = df.loc[df["signal"] >= limit, ["sample_id"]].sort_values("sample_id")
                why: 按 sample_id 重新排了序
            tests:
              - name: 基本情况与等号边界
                setup: limit = 10
                expect:
                  result: 'pd.DataFrame({"sample_id": ["S_B", "S_C", "S_D"]}, index=[7, 22, 4])'
                  df: df
              - name: 没有符合条件的行
                hidden: true
                setup: limit = 14
                expect:
                  result: 'pd.DataFrame(columns=["sample_id"])'
                  df: df
              - name: 换一个阈值
                hidden: true
                setup: limit = 8
                expect:
                  result: 'pd.DataFrame({"sample_id": ["S_A", "S_B", "S_C", "S_D"]}, index=[31, 7, 22, 4])'
                  df: df
              - name: 换一张索引不按大小排列的表
                hidden: true
                data: [T2]
                setup: limit = 12
                expect:
                  result: 'pd.DataFrame({"sample_id": ["X_B", "X_C"]}, index=[2, 60])'
                  df: df
              - name: 换一张编号不按顺序排列的表
                hidden: true
                data: [T3]
                setup: limit = 10
                expect:
                  result: 'pd.DataFrame({"sample_id": ["Z_C", "Z_E", "Z_B"]}, index=[8, 15, 3])'
                  df: df
        explanation: |
          要改两处：比较符改成 `>=`，才包含恰好等于 `limit` 的行；列名列表只留 `["sample_id"]`，结果才只有一列且仍是表。

          ```python
          mask = df["signal"] >= limit
          result = df.loc[mask, ["sample_id"]]
          ```

          直接写成 `result = df.loc[df["signal"] >= limit, ["sample_id"]]` 也对。本例结果的索引是 7、22、4，shape 为 (3, 1)。判分时还会换阈值、换一张表运行你的代码，检查结果的类型、形状、行列顺序、全部值，以及 `df` 没有被改变。
