id: py17
title: 先算条件，再留下需要的行
status: complete
minutes: 20
summary: 用单列比较得到布尔掩码，再用 df.loc[掩码, 列名列表] 留下需要的行和列，并读出结果的形状。
prerequisites: [py16, py08]
encompassings:
  - {topic: py16, weight: 0.5}
  - {topic: py08, weight: 0.5}
sources:
  - source: think-python
    where: 第 5 章（比较与条件）
    url: https://allendowney.github.io/ThinkPython/chap05.html
    use: reference
  - source: pydata-book
    where: 第 5 章 §5.2
    url: https://wesmckinney.com/book/pandas-basics
    use: reference
  - source: pandas-docs
    where: 入门教程：子集与筛选
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/03_subset_data.html
    use: reference
notes: |
  范围：只用单列条件。函数定义、字典构造、缺失值处理、多条件组合都不在本节。py14 的 DataFrame、Series、shape 由 py16 的先修路径承接。
  原稿 py17.k2 要学生逐格写出结果表，第一版交互词汇的 table 不能让学生增删行，按交互协议报告 5.2 节改成：用两个 order 小问分别问留下哪些行、哪些列及其顺序，再问 shape，并补一问某一格的值。
  节奏（待试做校准）：开场与读表 2 分钟；k1 讲解及例题 3 分钟、三道练习 3 分钟；k2 讲解及例题 3 分钟、两道读码题 3 分钟、小改代码题 4 分钟；收束 2 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始，前面题目里的 `mask`、`result` 等变量都已清除。大多数题用表 T：`sample_id` 是样本编号，`signal` 是一次测量的值（任意单位），`group` 是实验组标签；左边的行索引是原表的行标签，不是从小到大的序号；筛选以后各行带着自己的标签走，所以这一节叫它“原行索引”。题目里的“达标”只是人为约定的筛选规则，不代表科研结论。
wrapup: |
  向同事或 AI 提需求时，可以直接说：“在原表中保留 signal 至少达到 limit 的行，包括恰好等于阈值的行；输出 sample_id 一列，仍然是表，保留原行顺序和原索引。”

  拿到代码后，先看比较符是否包含等号，再看 `.loc` 逗号后面的列名是否符合要求，最后找出原表中恰好等于阈值的行，核对它有没有留下。
data:
  T:
    kind: dataframe
    name: df
    caption: 表 T
    index: [31, 7, 22, 4]
    indexHeader: 原行索引
    columns:
      sample_id: [S_A, S_B, S_C, S_D]
      signal: [8, 10, 13, 10]
      group: [control, drug, drug, control]
  T2:
    kind: dataframe
    name: df
    caption: 另一张同结构的表
    index: [90, 2, 60, 11]
    indexHeader: 原行索引
    columns:
      sample_id: [X_A, X_B, X_C, X_D]
      signal: [5, 12, 12, 9]
      group: [control, drug, drug, control]
  T3:
    kind: dataframe
    name: df
    caption: 第三张同结构的表
    index: [8, 40, 15, 3, 27]
    indexHeader: 原行索引
    columns:
      sample_id: [Z_C, Z_A, Z_E, Z_B, Z_D]
      signal: [14, 9, 10, 12, 7]
      group: [drug, control, drug, control, drug]
  soil:
    kind: dataframe
    name: soil
    caption: 表 soil：四个采样点的土层深度（厘米）
    index: [5, 12, 3, 8]
    indexHeader: 原行索引
    columns:
      site: [北坡, 南坡, 东坡, 西坡]
      depth: [30, 25, 35, 30]
kps:
  - id: py17.k1
    keyPrerequisites: [py16, py08]
    title: 单列比较生成逐行布尔掩码
    card:
      name: 布尔掩码
      aliases: [mask, 掩码, 逐行比较]
      definition: 对一列做比较时，pandas 逐行判断，得到一列与原表行一一对应的 True/False，叫布尔掩码。
      conditions:
        - 掩码只标记哪些行符合条件，这一步还没有从表里去掉任何行。
        - 掩码保留原来的行索引；>= 包含等号，> 不包含。
      example:
        from: py17.k1.e0
        text: |
          ```python
          mask = df["signal"] >= 10
          ```
          表 T 的 signal 依次为 8、10、13、10，mask 依次为 False、True、True、True。
    lesson: |
      先看条件作用在哪一列。`df["signal"]` 取出 signal 这一列；把这一列与 10 比较时，pandas 对每一行分别做同样的比较，所以结果是一列 True/False。它的长度仍然是 4，索引也和原来的列一一对应。

      | 原行索引 | signal | `df["signal"] >= 10` |
      |---:|---:|---|
      | 31 | 8 | False |
      | 7 | 10 | True |
      | 22 | 13 | True |
      | 4 | 10 | True |

      这列结果叫**布尔掩码**。它告诉你哪些行符合条件，但这一步还没有把任何行从 `df` 里去掉：`df` 仍然是原来的四行表。把结果赋给 `mask`，只是给这列 True/False 起了个名字。

      比较符决定边界上的行：`>=` 包含等号，`>` 不包含；`==` 是比较是否相等，`=` 是赋值。
    example:
      id: py17.k1.e0
      kind: [predict]
      data: [T]
      body: |
        我们约定 signal 至少为 10 的样本符合筛选条件。阅读代码，按原行索引填写 `mask` 的值，并写出现在 `df` 有几行。

        ```python
        mask = df["signal"] >= 10
        ```
      slots:
        - id: mask
          type: table
          label: mask 的值
          columns:
            - { id: index, header: 原行索引 }
            - { id: signal, header: signal }
            - { id: mask, header: mask, input: bool }
          rows:
            - { id: r31, cells: { index: "31", signal: "8", mask: false } }
            - { id: r7, cells: { index: "7", signal: "10", mask: true } }
            - { id: r22, cells: { index: "22", signal: "13", mask: true } }
            - { id: r4, cells: { index: "4", signal: "10", mask: true } }
        - id: rows
          type: text
          format: integer
          prompt: 运行这一行之后，`df` 有几行？
          key: 4
      explanation: |
        `mask` 依次为 **False、True、True、True**。索引 7 和 4 的测量值恰好是 10，`>=` 包含等号，所以都是 True。

        `mask` 是一列布尔值（布尔 Series），共 4 个值；`df` 没有变，仍有 **4** 行。
      verify: |
        r = run()
        answers = {
            "mask": {f"r{label}": {"mask": value} for label, value in r["mask"].items()},
            "rows": len(r["df"]),
        }
    practice:
      - id: py17.k1.q1
        kind: [predict]
        data: [T]
        body: |
          阅读代码，按原行索引填写 `mask` 的值。不要填写筛选后的样本编号。

          ```python
          mask = df["signal"] > 10
          ```
        slots:
          - id: mask
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: signal, header: signal }
              - { id: mask, header: mask, input: bool }
            rows:
              - { id: r31, cells: { index: "31", signal: "8", mask: false } }
              - { id: r7, cells: { index: "7", signal: "10", mask: false } }
              - { id: r22, cells: { index: "22", signal: "13", mask: true } }
              - { id: r4, cells: { index: "4", signal: "10", mask: false } }
        explanation: |
          依次为 **False、False、True、False**。恰好等于 10 的两行不满足“严格大于 10”：`>` 不包含等号。
        verify: |
          r = run()
          answers = {"mask": {f"r{label}": {"mask": value} for label, value in r["mask"].items()}}
      - id: py17.k1.q2
        kind: [predict]
        data: [T]
        body: |
          这次要标记的是测量值恰好为 10 的行。阅读代码，按原行索引填写 `mask` 的值。

          ```python
          mask = df["signal"] == 10
          ```
        slots:
          - id: mask
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: signal, header: signal }
              - { id: mask, header: mask, input: bool }
            rows:
              - { id: r31, cells: { index: "31", signal: "8", mask: false } }
              - { id: r7, cells: { index: "7", signal: "10", mask: true } }
              - { id: r22, cells: { index: "22", signal: "13", mask: false } }
              - { id: r4, cells: { index: "4", signal: "10", mask: true } }
        explanation: |
          依次为 **False、True、False、True**。`==` 逐行比较是否相等；索引 22 的值虽然更大，但不等于 10，所以是 False。
        verify: |
          r = run()
          answers = {"mask": {f"r{label}": {"mask": value} for label, value in r["mask"].items()}}
      - id: py17.k1.q3
        kind: [explain]
        data: [T]
        body: |
          有人把下面这行代码解释为“得到 signal 小于 10 的样本表”。请用五个字段给出准确的解释。

          ```python
          mask = df["signal"] < 10
          ```
        slots:
          - id: column
            type: choice
            prompt: 被比较的列
            options:
              - { id: group, content: group }
              - { id: signal, content: signal }
              - { id: sample_id, content: sample_id }
            key: signal
          - id: object
            type: choice
            prompt: mask 是什么
            options:
              - { id: bool_series, content: 一列布尔值（布尔 Series） }
              - { id: dataframe, content: 筛选后的表（DataFrame） }
              - { id: bool, content: 单个 True 或 False }
            key: bool_series
          - id: count
            type: choice
            prompt: mask 里有几个值
            options:
              - { id: "1", content: "1" }
              - { id: "3", content: "3" }
              - { id: "4", content: "4" }
            key: "4"
          - id: meaning
            type: choice
            prompt: 某一行的 True 表示什么
            options:
              - { id: removed, content: 这一行已经从原表删除 }
              - { id: at_least, content: 这一行的 signal 至少为 10 }
              - { id: below, content: 这一行的 signal 小于 10 }
            key: below
          - id: rows
            type: choice
            prompt: 运行之后 df 有几行
            options:
              - { id: "1", content: "1" }
              - { id: "3", content: "3" }
              - { id: "4", content: "4" }
            key: "4"
        explanation: |
          signal；一列布尔值；4 个值；True 表示这一行的 signal 小于 10；df 仍有 4 行。

          连起来说：取出 signal 列，对每一行判断是否小于 10，把四个判断结果保存为 mask；True 标出符合条件的行，df 仍是原来的四行表。“得到样本表”说错了两处：这一步得到的不是表，也没有去掉任何行。
        verify: |
          r = run()
          mask = r["mask"]
          answers = {
              "object": "bool_series" if isinstance(mask, pd.Series) and mask.dtype == bool else "other",
              "count": len(mask),
              "rows": len(r["df"]),
          }
        manual: [column, meaning]
      - id: py17.k1.q4
        kind: [trace]
        body: |
          掩码逐行比较，保留原来的行标签。写出比较产生的列表以及掩码的索引。

          ```python
          table = pd.DataFrame({"score": [8, 10, 7]}, index=[30, 10, 20])
          mask = table["score"] >= 8
          print(mask.tolist())
          print(mask.index.tolist())
          ```
        slots:
          - {id: values, type: text, match: output, prompt: 掩码值, key: "[True, True, False]"}
          - {id: labels, type: text, match: output, prompt: 掩码索引, key: "[30, 10, 20]"}
        explanation: "8 和 10 满足 >= 8，7 不满足；比较不会排序或重编号，因此掩码仍带有原来的 30、10、20。"
        verify: |
          lines = run().lines()
          answers = {"values": lines[0], "labels": lines[1]}
      - id: py17.k1.q5
        kind: [debug]
        body: |
          比较只生成掩码，并没有把原数值列改成布尔列。读出原列与比较结果。

          ```python
          table = pd.DataFrame({"value": [0, 5]})
          mask = table["value"] > 0
          print(table["value"].tolist())
          print(mask.tolist())
          ```
        slots:
          - {id: original, type: text, match: output, prompt: 原列, key: "[0, 5]"}
          - {id: mask, type: text, match: output, prompt: 掩码, key: "[False, True]"}
        explanation: "> 0 返回一列布尔判断；原表中的 0、5 保持原样。要筛选行还要把这个掩码交给选行操作。"
        verify: |
          lines = run().lines()
          answers = {"original": lines[0], "mask": lines[1]}
    review:
      - id: py17.k1.r1
        kind: [predict]
        data: [soil]
        body: |
          阅读代码，按原行索引填写 `mask` 的值。

          ```python
          mask = soil["depth"] >= 30
          ```
        slots:
          - id: mask
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: depth, header: depth }
              - { id: mask, header: mask, input: bool }
            rows:
              - { id: r5, cells: { index: "5", depth: "30", mask: true } }
              - { id: r12, cells: { index: "12", depth: "25", mask: false } }
              - { id: r3, cells: { index: "3", depth: "35", mask: true } }
              - { id: r8, cells: { index: "8", depth: "30", mask: true } }
        explanation: |
          依次为 **True、False、True、True**。深度恰好为 30 的两行也满足“至少 30”。
        verify: |
          r = run()
          answers = {"mask": {f"r{label}": {"mask": value} for label, value in r["mask"].items()}}
      - id: py17.k1.r2
        kind: [predict, explain]
        data: [T2]
        body: |
          同事对题面里这张表（变量名 `df`）的 signal 列做了一次比较，把结果存进 `mask`，打印出来是：

          ```text
          90    False
          2      True
          60     True
          11    False
          Name: signal, dtype: bool
          ```

          他没有写代码。
        slots:
          - id: line
            type: choice
            prompt: 这一行最可能是哪一种写法？
            options:
              - id: ge12
                content: |
                  ```python
                  mask = df["signal"] >= 12
                  ```
              - id: gt12
                content: |
                  ```python
                  mask = df["signal"] > 12
                  ```
                feedback: 结果会全是 False，因为 signal 最大是 12，不大于 12。
              - id: ge9
                content: |
                  ```python
                  mask = df["signal"] >= 9
                  ```
                feedback: signal 为 9 的那一行（原行索引 11）也会是 True。
              - id: eq9
                content: |
                  ```python
                  mask = df["signal"] == 9
                  ```
                feedback: 只有 signal 恰好为 9 的那一行是 True。
            key: ge12
          - id: edge
            type: choice
            multiple: true
            prompt: 在这张表里，哪几行能分出 `>= 12` 和 `> 12`（也就是在两种写法下结果不同）？选出所有。
            options:
              - { id: r90, content: 原行索引 90（signal 为 5） }
              - { id: r2, content: 原行索引 2（signal 为 12） }
              - { id: r60, content: 原行索引 60（signal 为 12） }
              - { id: r11, content: 原行索引 11（signal 为 9） }
            key: [r2, r60]
        explanation: |
          True 的两行 signal 都是 12，False 的两行是 5 和 9，所以留下的是“至少 12”：`df["signal"] >= 12`。`> 12` 一行也留不下，`>= 9` 会连 signal 为 9 的那行也标 True，`== 9` 只标 signal 为 9 的那行。

          `>=` 和 `>` 只在恰好等于阈值的行上不同，这里就是 signal 为 12 的两行（原行索引 2 和 60）。别的行离 12 很远或没有恰好等于 12，两种写法给出同样的结果。
        verify: |
          target = [False, True, True, False]
          fits = []
          for option, code in OPTIONS["line"].items():
              r = run(code)
              if r.error is None and list(r["mask"]) == target:
                  fits.append(option)
          differ = (df["signal"] >= 12) != (df["signal"] > 12)
          answers = {"line": fits[0] if len(fits) == 1 else fits,
                     "edge": [f"r{label}" for label in df.index[differ]]}
    quiz:
      - id: py17.k1.x1
        kind: [predict]
        data: [T3]
        body: |
          阅读代码。

          ```python
          mask = df["signal"] >= 10
          ```
        slots:
          - id: true_rows
            type: order
            partial: true
            prompt: "`mask` 里为 True 的是哪几行？按表里的先后顺序，排出它们的原行索引。"
            items:
              - { id: "8", content: "8" }
              - { id: "40", content: "40" }
              - { id: "15", content: "15" }
              - { id: "3", content: "3" }
              - { id: "27", content: "27" }
            key: ["8", "15", "3"]
          - id: size
            type: text
            format: integer
            prompt: "`mask` 里一共有几个值？"
            key: 5
          - id: rows
            type: text
            format: integer
            prompt: 运行之后，`df` 有几行？
            key: 5
        explanation: |
          题面里的表，signal 依次是 14、9、10、12、7，原行索引依次是 8、40、15、3、27。“至少 10”（含 10）的是 14、10、12，对应原行索引 **8、15、3**，其他两行是 False。

          `mask` 对每一行各有一个值，所以有 **5** 个；它只是标记，没有把任何行从 `df` 里去掉，`df` 仍是 **5** 行。
        verify: |
          r = run()
          mask = r["mask"]
          answers = {
              "true_rows": [str(label) for label in mask.index[mask]],
              "size": len(mask),
              "rows": len(r["df"]),
          }
      - id: py17.k1.x2
        kind: [explain]
        data: [T]
        body: |
          运行下面这行代码之后，哪一句说法正确？

          ```python
          mask = df["signal"] >= 13
          ```
        slots:
          - id: claim
            type: choice
            options:
              - id: table
                content: mask 是只剩下索引 22 那一行的表
                feedback: 比较得到的是一列 True/False，还没有用它去选行。
              - id: shrunk
                content: df 现在只剩 1 行
                feedback: 计算掩码不会改变 df。
              - id: single
                content: mask 只有 1 个值
                feedback: 比较是逐行做的，有几行就有几个值。
              - id: series
                content: mask 有 4 个值，只有索引 22 那一个为 True；df 仍有 4 行
            key: series
        explanation: |
          “mask 有 4 个值，只有索引 22 那一个为 True；df 仍有 4 行”这一句正确。掩码逐行给出 True/False，共 4 个值，只有 signal 为 13 的索引 22 满足条件；计算掩码不会从 df 中去掉任何行，也还不是一张表。
        verify: |
          r = run()
          mask, df = r["mask"], r["df"]
          # 逐句核对每个说法，成立的必须恰好一句。
          holds = {
              "table": isinstance(mask, pd.DataFrame),
              "series": isinstance(mask, pd.Series) and len(mask) == 4 and list(mask[mask].index) == [22] and len(df) == 4,
              "shrunk": len(df) == 1,
              "single": len(mask) == 1,
          }
          true = [claim for claim, ok in holds.items() if ok]
          answers = {"claim": true[0] if len(true) == 1 else true}

      - id: py17.k1.x3
        kind:
          - trace
        body: |
          比较相等产生逐行布尔值，重复的值分别在各自的位置得到 True。

          ```python
          values = pd.Series([4, 2, 4], index=[9, 3, 7])
          mask = values == 4
          print(mask.tolist())
          print(mask.index.tolist())
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '[True, False, True]'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '[9, 3, 7]'
        explanation: 第一、第三项都等于 4；比较仍保留全部三个位置和原索引，不会自动筛掉 False。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py17.k1.x4
        kind:
          - trace
        body: |
          严格阈值与包含等号的阈值对边界行有不同判断，但掩码长度不变。

          ```python
          values = pd.Series([5, 6, 7])
          print((values > 6).tolist())
          print((values >= 6).tolist())
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '[False, False, True]'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '[False, True, True]'
