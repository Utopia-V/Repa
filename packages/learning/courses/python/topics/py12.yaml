id: py12
title: 把“处理一下”变成可核对的要求
status: complete
minutes: 20
summary: 把一句含糊的数据处理要求说成别人能照做、能核对的规则，并用边界例子检查它。
prerequisites: []
sources:
  - source: think-python
    where: 第 4 章（函数与接口：输入和输出的约定）
    url: https://allendowney.github.io/ThinkPython/chap04.html
    use: reference
  - source: think-python
    where: 第 6 章（增量开发：小步核对）
    url: https://allendowney.github.io/ThinkPython/chap06.html
    use: reference
  - source: swc-python
    where: 第 11 节：调试
    url: https://swcarpentry.github.io/python-novice-inflammation/11-debugging.html
    use: reference
notes: |
  范围：不依赖 Python 语法。输入是一张能直接读的小表；本节不实现筛选算法，不讲统计检验。题中的阈值都是题设约定，不是研究结论。
  材料只提供接口与小步核对的思想，把它们转成数据处理要求是本课自拟的内容，需要试用检验。
  节奏（待试做校准）：目标 1 分钟；k1 讲解与例题 3 分钟、练习 5 分钟；k2 讲解与例题 3 分钟、练习 6 分钟；收束 2 分钟。开放题可以口述。
  把自然语言要求填成字段的题程序算不出答案，列在 manual 里，复习和测验题由 course:confirm 让模型独立再解核对；边界例子的结果由程序独立算出。
intro: |
  这一节不写 Python。你会看到一些小表，任务是把一句含糊的要求，说成别人拿到同一张表就能照做、结果也能核对的规则。

  题目里的阈值都是题目自己的约定，不是科研结论。
wrapup: |
  当你把“多一点”“正常”“处理一下”改成可以检查的规则时，你在帮双方少猜一步。遇到还没定下的统计口径，能问出问题本身就够了，不必替研究者作科学判断。
