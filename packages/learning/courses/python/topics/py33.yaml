    quiz:
      - id: py33.k2.x1
        kind: [modify]
        uses: [py27.k1, py27.k2, py23.k1]
        data: [growth]
        body: |
          需求：

          > 每天测了两次 OD，先按天求平均，再画平均 OD 随天数变化的折线；横轴是天数，从小到大。

          画图那一行已经写好，不用改：

          ```python
          summary.plot.line(ylabel="平均 OD")
          ```

          作答框里准备数据的那一行没有求平均，同一天的两次读数都会画成点。请改它，让 `summary` 是每天一个平均值、索引是天数。不要改动 `growth`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              summary = growth.set_index("day")["od"]
            solution: |
              summary = growth.groupby("day")["od"].mean()
            accepts:
              - summary = growth.groupby("day")["od"].mean().sort_index()
              - summary = growth.groupby("day")["od"].agg("mean")
            rejects:
              - code: summary = growth.groupby("day")["od"].mean().sort_values()
                why: 按平均值排了序，横轴上的天数不再从小到大
              - code: summary = growth.groupby("day")["od"].sum()
                why: 求的是每天两次读数的总和
              - code: summary = growth.groupby("day")["od"].max()
                why: 取了每天较大的一次，不是平均
              - code: summary = growth.sort_values("day")
                why: 只排了序，没有按天聚合
            tests:
              - name: 表 growth
                expect:
                  summary: 'pd.Series({1: 0.11, 2: 0.40, 3: 0.30}, name="od")'
                  growth: growth
              - name: 换一批读数
                hidden: true
                data: [growth2]
                expect:
                  summary: 'pd.Series({1: 0.09, 2: 0.23, 3: 0.35, 4: 0.52}, name="od")'
                  growth: growth
        explanation: |
          ```python
          summary = growth.groupby("day")["od"].mean()
          ```

          按 day 分组求平均，每天只剩一个数；groupby 的结果按天数从小到大排好，直接画 Series 时横轴就是这个索引，折线从第 1 天连到第 3 天。本例三天的平均依次是 0.11、0.40、0.30。

          再按平均值排序会把第 3 天排到第 2 天前面，折线就乱了；求总和或取最大值都不是需求里的平均。判分时还会换一批读数运行你的代码。
