kps:
  - id: py33.k1
    title: 按比较、趋势或关系选 bar/line/scatter
    card:
      name: 图的种类
      aliases: [bar, line, scatter, 柱状图, 折线图, 散点图]
      definition: 按要回答的问题选图：比较几个组的一个数用柱状图 bar，看一个量随有序的 x（如时间）变化用折线图 line，看两个数值量有没有关系用散点图 scatter。
      conditions:
        - 折线会把相邻的点连起来，暗示它们之间有先后；没有先后的组别不要用折线连。
        - 散点图每一行画一个点，横轴、纵轴各用一列数。
      example:
        from: py33.k1.e0
        text: |
          问“control 组和 drug 组的平均 signal 谁高”，是在比较两个组：先按组求平均，再画柱状图，每组一根柱，比高低。
    lesson: |
      画图之前先问一句：这张图要回答什么问题？常见的问题有三类，各对应一种图：

      | 要回答的问题 | 图 | pandas 写法 |
      |---|---|---|
      | 几个组的某个数谁高谁低（比较） | 柱状图 bar | `summary.plot.bar()` |
      | 一个量随时间或其他有先后的 x 怎样变化（趋势） | 折线图 line | `daily.plot.line(x="day", y="count")` |
      | 两个数值量之间有没有关系（关系） | 散点图 scatter | `field.plot.scatter(x="depth", y="moisture")` |

      三点区别：

      - **柱状图**每个组一根柱，柱的高度就是那个组的数。比较组别时，通常先按组聚合（[每组一行](repa:concept/py27.k2)），再画。
      - **折线图**把相邻的点用线连起来。线本身在说“从这个点到下一个点发生了变化”，所以横轴要有先后，例如第几天、第几小时。几个采样点、几个处理组之间没有先后，用线连起来会让人读出并不存在的“趋势”。
      - **散点图**表里每一行画一个点：横坐标取 `x=` 那一列，纵坐标取 `y=` 那一列。点的整体走向回答“一个大，另一个是不是也大”。
    example:
      id: py33.k1.e0
      kind: [explain]
      uses: [py27.k2]
      data: [trial]
      body: |
        要回答的问题：control 组和 drug 组的平均 signal 谁高？同事已经按组算好了平均值：

        ```python
        summary = trial.groupby("group")["signal"].mean()
        ```
      slots:
        - id: chart
          type: choice
          prompt: 用哪种图回答这个问题？
          options:
            - id: line
              content: 折线图：把两组的平均值连成一条线
            - id: bar
              content: 柱状图：每组一根柱，比较高低
            - id: scatter
              content: 散点图：每个样本一个点，横轴、纵轴各用一列数
          key: bar
        - id: count
          type: text
          format: integer
          prompt: "`summary` 里有几个数？"
          key: 2
      explanation: |
        这是在**比较两个组**，用**柱状图**：`summary.plot.bar()` 每组一根柱，柱高是组平均，一眼就能比出高低。

        `summary` 是按组聚合后的结果，每组一个数，共 **2** 个，所以柱状图上有 2 根柱。折线会把 control 和 drug 连起来，好像两组之间有先后变化；散点图用来看两个数值量的关系，这里只有一个数要比较。
      verify: |
        summary = run()["summary"]
        answers = {"count": len(summary)}
      manual: [chart]
    practice:
      - id: py33.k1.q1
        kind: [explain]
        uses: [py27.k2]
        data: [soil]
        body: |
          要回答的问题：北坡、南坡、东坡三个采样点，平均采样深度谁深谁浅？`summary` 已经算好：

          ```python
          summary = soil.groupby("site")["depth_cm"].mean()
          ```
        slots:
          - id: code
            type: choice
            prompt: 用哪一行画图？
            options:
              - id: scatter
                content: |
                  ```python
                  soil.plot.scatter(x="depth_cm", y="moisture")
                  ```
                feedback: 散点图看的是深度和湿度两个量的关系，不是三个采样点的比较。
              - id: line
                content: |
                  ```python
                  summary.plot.line()
                  ```
                feedback: 三个采样点之间没有先后，用线连起来像是在说深度从一个点“变”到另一个点。
              - id: bar
                content: |
                  ```python
                  summary.plot.bar()
                  ```
            key: bar
        explanation: |
          用 `summary.plot.bar()`：三个采样点各一根柱，柱高是平均深度，比较深浅。

          折线把三个采样点连起来，读的人会以为深度沿着某个方向在变化，可采样点之间并没有先后；散点图画的是每份土样的深度和湿度，回答的是另一个问题。
        manual: [code]
      - id: py33.k1.q2
        kind: [predict]
        data: [field]
        body: |
          要回答的问题：采样越深，土壤是不是越干？同事画了散点图：

          ```python
          field.plot.scatter(x="depth", y="moisture")
          ```
        slots:
          - id: points
            type: text
            format: integer
            prompt: 图上有几个点？
            key: 5
          - id: sc_x
            type: text
            format: integer
            prompt: 样本 S_C 那个点的横坐标是多少？
            key: 15
          - id: sc_y
            type: text
            format: integer
            prompt: 样本 S_C 那个点的纵坐标是多少？
            key: 28
        explanation: |
          表有 5 行，散点图每行画一个点，共 **5** 个点。横坐标取 `x="depth"`，纵坐标取 `y="moisture"`，所以 S_C 的点在横坐标 **15**、纵坐标 **28** 的位置。

          把五个点看一遍：深度越大的点，湿度越低，点从左上往右下排。散点图就是用这种整体走向回答“两个量有没有关系”。
        verify: |
          plotted = run("data = " + BLOCKS[0].split(".plot")[0])["data"]
          row = plotted.loc[plotted["sample_id"] == "S_C"].iloc[0]
          answers = {"points": len(plotted), "sc_x": row["depth"], "sc_y": row["moisture"]}
      - id: py33.k1.q3
        kind: [explain]
        data: [plants]
        body: |
          同事画了下面这张图，却在报告里写：“这张图显示株高随时间增长。”

          ```python
          plants.plot.scatter(x="root_mm", y="height_cm")
          ```
        slots:
          - id: question
            type: choice
            prompt: 这张图实际回答的是哪个问题？
            options:
              - id: groups
                content: 不同处理组的平均株高谁高
              - id: relation
                content: 根长和株高有没有关系
              - id: time
                content: 株高怎样随时间变化
                feedback: 表里四株植物是同一天测的，没有时间这一列。
            key: relation
          - id: points
            type: text
            format: integer
            prompt: 图上有几个点？
            key: 4
        explanation: |
          这是散点图，横轴是根长 root_mm，纵轴是株高 height_cm，每株植物一个点，共 **4** 个点。它回答的是**根长和株高有没有关系**。

          表里四株植物是同一天测的，没有时间；要看株高随时间的变化，需要同一株植物在不同日子的记录，画折线图。图里也没有处理组，比不出组间高低。
        verify: |
          plotted = run("data = " + BLOCKS[0].split(".plot")[0])["data"]
          answers = {"points": len(plotted)}
        manual: [question]
    review:
      - id: py33.k1.r1
        kind: [explain]
        data: [incubator]
        body: |
          要回答的问题：A 号培养箱这 8 天里，温度是怎样变化的？表 incubator 每天一行。
        slots:
          - id: chart
            type: choice
            prompt: 哪一种图回答这个问题？
            options:
              - id: scatter
                content: 散点图：横轴是 temp，纵轴是 humidity
              - id: line
                content: 折线图：横轴是 day，从第 1 天到第 8 天；纵轴是 temp
              - id: bar
                content: 柱状图：只有一根柱，高度是 8 天的平均 temp
            key: line
        explanation: |
          “这 8 天里怎样变化”问的是**随时间的趋势**：用折线图，横轴是按先后排好的 day，纵轴是 temp，相邻两天用线连起来，升降一目了然。

          温度对湿度的散点图回答的是“温度高时湿度是不是也高”；一根平均值的柱把 8 天压成一个数，看不出变化。
        manual: [chart]
      - id: py33.k1.r2
        kind: [explain]
        body: |
          下面哪个问题最适合用散点图回答？
        slots:
          - id: question
            type: choice
            options:
              - id: count
                content: 三个采样点各收到了多少份样本
              - id: od
                content: 一份培养液在 12 小时里 OD 读数怎样变化
              - id: leaves
                content: 植株的叶片数和株高有没有关系
              - id: diff
                content: drug 组的平均 signal 比 control 组高多少
            key: leaves
        explanation: |
          “叶片数和株高有没有关系”最适合散点图：每株植物一个点，横轴叶片数、纵轴株高，看点的整体走向。

          各采样点的样本数和两组平均 signal 的差，都是在比较几个组，用柱状图；12 小时里 OD 的变化是随时间的趋势，用折线图。
        manual: [question]
    quiz:
      - id: py33.k1.x1
        kind: [explain]
        body: |
          为每个问题选一种图。
        slots:
          - id: charts
            type: table
            columns:
              - id: question
                header: 要回答的问题
              - id: chart
                header: 图
                input:
                  type: choice
                  options:
                    - { id: bar, label: 柱状图 bar }
                    - { id: line, label: 折线图 line }
                    - { id: scatter, label: 散点图 scatter }
            rows:
              - id: moisture
                cells: { question: 四个采样点的平均土壤湿度谁高谁低, chart: bar }
              - id: relation
                cells: { question: 每份样本的 signal 和它的采样深度有没有关系, chart: scatter }
              - id: hours
                cells: { question: 同一份培养液在 0、2、4、6 小时的 OD 怎样变化, chart: line }
        explanation: |
          | 要回答的问题 | 图 |
          |---|---|
          | 四个采样点的平均土壤湿度谁高谁低 | 柱状图：比较几个组 |
          | 每份样本的 signal 和它的采样深度有没有关系 | 散点图：两个数值量的关系 |
          | 同一份培养液在 0、2、4、6 小时的 OD 怎样变化 | 折线图：随时间的趋势 |

          采样点之间没有先后，不用折线连；0、2、4、6 小时有先后，用折线把相邻时间点连起来。
        manual: [charts]
      - id: py33.k1.x2
        kind: [explain]
        body: |
          下面哪些问题适合用折线图回答？选出全部。
        slots:
          - id: questions
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - id: groups
                content: control 组和 drug 组各有几只小鼠
              - id: week
                content: 一周 7 天里每天的最高气温怎样变化
              - id: protein
                content: 每份样本的蛋白含量和吸光度有没有关系
              - id: minutes
                content: 一份样本在第 0、10、20、30 分钟的温度怎样变化
            key: [week, minutes]
        explanation: |
          适合折线图的是**一周 7 天的最高气温**和**第 0、10、20、30 分钟的温度**：横轴是有先后的时间，问的是怎样变化。

          两组各有几只小鼠是比较组别，用柱状图；蛋白含量和吸光度的关系是两个数值量的关系，用散点图。每个选项的勾选状态分别计分。
        manual: [questions]

  - id: py33.k2
    title: 从代码核对横轴、纵轴、单位和是否先聚合
    card:
      name: 读画图代码
      aliases: [横轴, 纵轴, 先聚合, ylabel]
      definition: "`.plot` 前面的对象就是被画的数据：它有几行就有几根柱或几个点；横轴是 x 指定的列或 Series 的索引，按行的顺序排列，纵轴是 y 列或 Series 的值。"
      conditions:
        - 整张表直接画柱状图是每条记录一根柱；要每组一根，先 groupby 聚合。
        - 折线按行的顺序连点，x 没排好要先 sort_values；ylabel 只是文字，不会换算单位。
      example:
        from: py33.k2.e0
        text: |
          `trial.plot.bar(x="group", y="signal")` 画 5 根柱，每个样本一根；`trial.groupby("group")["signal"].mean().plot.bar()` 画 2 根柱，每组一根，drug 那根高 12.0。
    lesson: |
      读一行画图代码，按顺序问四件事。

      **1. 画的是哪份数据？** 看 `.plot` 前面的那个对象。它有几行，图上就有几根柱或几个点。

      ```python
      trial.plot.bar(x="group", y="signal")                 # 整张表：每个样本一根柱
      trial.groupby("group")["signal"].mean().plot.bar()     # 先聚合：每组一根柱
      ```

      第一行没有聚合，表有 5 行就画 5 根柱，横轴上 control、drug 会重复出现；要比较组平均，必须先像第二行那样按组聚合（[每组一行](repa:concept/py27.k2)）。

      **2. 横轴是什么，按什么顺序？** 给了 `x="day"`，横轴就是 day 这一列；直接画一个 Series（例如聚合结果）时，横轴是它的索引。点和柱按数据里**行的顺序**排列，画图不会替你排序。折线把相邻两行的点连起来，day 没排好，线就会来回折，所以要先[排序](repa:concept/py23.k1)：`daily.sort_values("day").plot.line(x="day", y="count")`。

      **3. 纵轴是什么？** `y=` 指定的列，或者 Series 本身的值。

      **4. 单位对不对？** `ylabel="平均深度（cm）"` 只是写在纵轴旁边的文字，不会换算数值。列是厘米、标签写米，图就差了 100 倍；数值除以了 100，标签也要跟着改。

      查一个画图参数时，可以像读文档那样找它的名字和含义：`x` 是横轴用的列名，`y` 是纵轴用的列名，`ylabel` 是纵轴旁边的文字。
    example:
      id: py33.k2.e0
      kind: [predict]
      uses: [py27.k2]
      data: [trial]
      body: |
        需求：比较 control 和 drug 两组的平均 signal。同事写了两种画法。

        第一种：

        ```python
        trial.plot.bar(x="group", y="signal")
        ```

        第二种：

        ```python
        trial.groupby("group")["signal"].mean().plot.bar()
        ```
      slots:
        - id: bars_first
          type: text
          format: integer
          prompt: 第一种画出几根柱？
          key: 5
        - id: bars_second
          type: text
          format: integer
          prompt: 第二种画出几根柱？
          key: 2
        - id: drug
          type: text
          format: number
          prompt: 第二种里，drug 那根柱有多高？
          key: 12
      explanation: |
        第一种画 **5** 根柱：它直接画整张表，每个样本一根，横轴依次是 control、drug、control、drug、drug，组名重复出现，比不出组平均。

        第二种先按 group 求平均，得到每组一个数，画 **2** 根柱。drug 组是 13、11、12，平均 **12.0**；control 组是 8、10，平均 9.0。符合需求的是第二种。
      verify: |
        def plotted(line):
            # .plot 前面的部分就是被画的数据；只运行这一部分，不调用画图。
            return run("data = " + line.split(".plot")[0])["data"]
        first, second = plotted(BLOCKS[0]), plotted(BLOCKS[1])
        answers = {"bars_first": len(first), "bars_second": len(second), "drug": second["drug"]}
