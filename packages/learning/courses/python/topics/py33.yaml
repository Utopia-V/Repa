            options:
              - id: drop_division
                content: 去掉 `/ 10`，标签不动
              - id: keep
                content: 都不用改
              - id: label
                content: 把纵轴标签改成“平均根长（cm）”，`/ 10` 保留
            key: label
        explanation: |
          按 treatment 聚合后有 low、high 两组，**2** 根柱。high 组根长 66、70、62 毫米，平均 66.0，除以 10 得到 **6.6**，单位已经是厘米。

          数换成了厘米，标签却还写着毫米，读的人会以为根只有 6.6 毫米长。需求要厘米，所以**保留 `/ 10`，把标签改成“平均根长（cm）”**。去掉 `/ 10` 能让数和“mm”对上，但不符合“纵轴用厘米”的需求。
        verify: |
          summary = run(BLOCKS[0])["summary"]
          answers = {"bars": len(summary), "high": summary["high"]}
