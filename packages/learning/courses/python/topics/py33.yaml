      - id: py33.k2.q3
        kind: [modify]
        uses: [py27.k1, py27.k2, py23.k1]
        data: [trial]
        body: |
          需求：

          > 比较各组的平均 signal，每组一根柱，柱从高到低排列。

          画图那一行已经写好，不用改：

          ```python
          summary.plot.bar(ylabel="平均 signal")
          ```

          作答框里是同事准备数据的那一行，它没有按组求平均。请改它，让 `summary` 是每组一个平均值（索引是组名），并且从高到低排好。不要改动 `trial`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              summary = trial[["group", "signal"]]
            solution: |
              summary = trial.groupby("group")["signal"].mean().sort_values(ascending=False)
            accepts:
              - |
                means = trial.groupby("group")["signal"].mean()
                summary = means.sort_values(ascending=False)
              - summary = trial.groupby("group")["signal"].agg("mean").sort_values(ascending=False)
            rejects:
              - code: summary = trial.groupby("group")["signal"].mean()
                why: 没有排序，柱按组名顺序排列
              - code: summary = trial.groupby("group")["signal"].mean().sort_values()
                why: 从低到高排了
              - code: summary = trial.groupby("group")["signal"].sum().sort_values(ascending=False)
                why: 求的是总和，不是平均
              - code: summary = trial.sort_values("signal", ascending=False)
                why: 只排了序，没有按组聚合，仍是每个样本一根柱
            tests:
              - name: 表 trial
                expect:
                  summary: 'pd.Series({"drug": 12.0, "control": 9.0}, name="signal")'
                  trial: trial
              - name: 换一张有三个组、各组样本数不同的表
                hidden: true
                data: [trial3]
                expect:
                  summary: 'pd.Series({"drug": 13.0, "placebo": 10.0, "control": 9.0}, name="signal")'
                  trial: trial
        explanation: |
          ```python
          summary = trial.groupby("group")["signal"].mean().sort_values(ascending=False)
          ```

          先按 group 求平均，每组得到一个数，柱状图才是每组一根柱；再用 `sort_values(ascending=False)` 从高到低排，柱就按这个顺序从左到右排列。本例 drug 平均 12.0 在前，control 平均 9.0 在后。

          只求平均不排序，柱会按组名的顺序排；求总和会让样本多的组显得更高。判分时还会换一张有三个组、各组样本数不同的表运行你的代码。
