              - id: zigzag
                content: 在横轴上来回折返
            key: zigzag
        explanation: |
          折线按表里行的顺序连点：第 3 天 → 第 1 天 → 第 4 天 → 第 2 天。横轴上先往左、再往右、又往左，**来回折返**，读的人很难看出变化。

          画图不会替你排序。先按 day 排好再画：`daily.sort_values("day").plot.line(x="day", y="count")`，线就从第 1 天一路连到第 4 天。
        verify: |
          plotted = run("data = " + BLOCKS[0].split(".plot")[0])["data"]
          days = list(plotted["day"])
