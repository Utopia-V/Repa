sources:
  - source: pydata-book
    where: 第 9 章 §9.2（用 pandas 画图）
    url: https://wesmckinney.com/book/plotting-and-visualization
    use: reference
  - source: pandas-docs
    where: 入门教程：绘图
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/04_plotting.html
    use: reference
notes: |
  范围：只读 pandas 自带的三种画法 `.plot.bar()`、`.plot.line()`、`.plot.scatter(x=, y=)`，以及 `x=`、`y=`、`ylabel=` 三个参数；不讲 matplotlib、颜色、图例、子图和完整的样式 API。题目给出已经写好的 2～3 行代码，学生读出图上会有什么，不要求从空白写画图代码。
  判分运行时里没有 matplotlib，画图那一行运行不了。所以题面把准备数据的代码和画图代码分开写；verify 只运行 `.plot` 前面的部分，从被画的那份数据算出几根柱、几个点、横轴顺序和柱高。代码题只让学生改画图之前的 `summary = ...` 一行，画图那一行在题面里写明“已写好，不用改”，测试只检查 `summary`。
  按问题选图（k1）是语义判断，复习和测验里的这些选择题列进 manual，由 course:confirm 让模型独立再解核对；k2 的单位一问同样列进 manual，其余作答位由程序算出。题型建议原为：解释代码（S/O）、找错（P）、小改代码（T）。
  groupby 按组名排序；中文组名的排序不直观（东坡、北坡、南坡），所以题目不问中文组名的先后。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 4 分钟、两道读码题 3 分钟、小改代码题 3 分钟；收束 2 分钟。
  取材：Python for Data Analysis 第 9 章与 pandas 绘图教程只作画法的参照；问题、小表和题目为本课自拟，沿用 py12、py17 的 sample_id、signal、group、site、depth 情境。
intro: |
  AI 给的分析脚本里，最后常常是一两行画图代码。这一节不看图片本身，而是练习在运行之前，从代码读出图上会有什么：画的是哪份数据，横轴、纵轴各是什么，有几根柱或几个点。

  宿主已经准备好 pandas 和题目里的表。每道题都从题面给出的表重新开始。
wrapup: |
  拿到一张图或一段画图代码，先问它想回答什么：比较几个组、看随时间的变化，还是看两个量的关系，再看图的种类是否对得上。

  然后读 `.plot` 前面的那份数据：它有几行，图上就有几根柱或几个点；横轴按行的顺序排，纵轴标签上的单位要和数一致。向 AI 提要求时，可以直接说：“按 group 求平均 signal，每组一根柱，从高到低排列，纵轴标签写明单位。”
