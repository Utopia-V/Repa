id: py40
title: 读懂自己定义的函数
status: complete
minutes: 20
summary: 分清 def 定义与调用两次动作；读出形参接收了哪个实参、return 交回什么；顺着中间量追到函数的结果。
prerequisites: [py04, py10]
encompassings:
  - {topic: py04, weight: 0.5}
  - {topic: py10, weight: 0.5}
sources:
  - source: think-python
    where: 第 3 章
    url: https://allendowney.github.io/ThinkPython/chap03.html
    use: reference
  - source: think-python
    where: 第 6 章
    url: https://allendowney.github.io/ThinkPython/chap06.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.8
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
notes: |
  范围：先修只到 py04（调用现成函数、位置与关键字参数、把返回结果交给下一步）和 py10（if/elif/else、缩进、各路径后的变量）。函数体里只用数、简单字符串、比较和 if/elif/else；不用列表、字符串方法、循环和 pandas。程序仍按短脚本从上往下运行，不用交互解释器或 notebook 末行自动显示的规则。默认参数、局部与外部同名、没有 return 得到 None 的细节留给 py41；本节只在 k2 里点到“只 print 不 return 时调用处拿到 None”，承接 py04.k3。
  情境沿用前面的测量数据：net_signal(raw, blank) 减本底、label(signal, limit) 判“达标”，py41、py42 接着用这两个函数。“达标”只是题目约定的规则。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 2 分钟、练习 4 分钟（含一道改代码题）；收束 1 分钟。
  讲解、例子和题目为本课自拟。所有答案都由 verify 用程序算出：输出用 run()，形参接收的值用 sys.settrace 在调用时读出，函数体内的中间量把函数体去掉缩进后用 trace() 逐行追踪；没有 manual 作答位。
intro: |
  前面你调用过别人写好的函数，例如 `int("12")`、`round(2.567, 1)`：给它输入，拿回一个结果。AI 写的分析代码里，常常还会自己定义函数，把几步计算包成一个名字。

  这一节练三件事：分清“定义”和“调用”；读出每个输入交给了哪个名字、最后交回了什么；顺着函数里的中间量，找到结果是怎样算出来的。
wrapup: |
  读一个自己定义的函数，可以按这个顺序：先找到调用它的那一行，确定每个形参接收了哪个值；再像读普通程序一样逐行追踪函数体；最后看 return 后面写的是谁，那才是调用处拿到的结果。

  向 AI 提问时也可以这样说：“这个函数的输入是什么、交回的是哪个值？中间哪一步减了本底？”
kps:
  - id: py40.k1
    keyPrerequisites: [py04]
    title: def 定义与调用是两次不同动作
    card:
      name: 定义与调用
      aliases: [def, 函数定义, 调用函数]
      definition: "`def` 只记下函数名和它的做法，缩进的几行这时不运行；写 `名字()` 调用时才运行一遍，调用几次就运行几次。"
      conditions:
        - 函数要先定义、后调用；调用写在 def 之前会报 NameError。
        - 函数体里的 print 在调用时才显示，和外面的 print 按实际运行顺序交错。
      example:
        from: py40.k1.e0
        text: |
          ```python
          def show_start():
              print("开始测量")

          print("准备样本")
          show_start()
          show_start()
          ```
          def 那两行不显示任何东西；先显示“准备样本”，两次调用各显示一次“开始测量”。
    lesson: |
      除了调用别人写好的函数，也可以自己定义一个：

      ```python
      def show_start():
          print("开始测量")
      ```

      `def 名字():` 这一行，加上下面缩进的几行（叫**函数体**），合起来是一次**定义**。Python 只记下“`show_start` 这个名字代表这几行做法”，这时缩进的几行**一行也不运行**，屏幕上什么也不显示。

      要让做法真正运行，得**调用**它：写 `show_start()`，带上括号。每调用一次，函数体就从头运行一遍；调用两次，就运行两遍。

      读一段含 `def` 的程序，仍然从上往下按顺序走：

      1. 走到 `def`，只记下名字，跳过缩进的部分；
      2. 走到调用的那一行，转进函数里，把函数体运行完，再回到调用处，接着往下走。

      函数要先定义、后调用。调用写在 `def` 前面时，Python 走到那一行还不认识这个名字，会报 NameError（意思是“不认识这个名字”），和使用还没赋值的名字一样。
    example:
      id: py40.k1.e0
      kind: [predict, trace]
      uses: [py01.k2, py04.k1]
      body: |
        阅读下面的程序。

        ```python startLine=1
        def show_start():
            print("开始测量")

        print("准备样本")
        show_start()
        show_start()
        ```
      slots:
        - id: before
          type: choice
          prompt: 刚运行完第 1–2 行（def 那两行）时，屏幕上显示了什么？
          options:
            - { id: nothing, content: 什么也没有显示 }
            - { id: start, content: 显示了一次“开始测量” }
          key: nothing
        - id: lines
          type: table
          label: 输出
          prompt: 按先后顺序选出整个程序显示的每一行。
          columns:
            - { id: line, header: 输出的第几行 }
            - id: shown
              header: 显示
              input: { type: choice, options: [{ id: prep, label: 准备样本 }, { id: start, label: 开始测量 }] }
          rows:
            - { id: l1, cells: { line: 第 1 行, shown: prep } }
            - { id: l2, cells: { line: 第 2 行, shown: start } }
            - { id: l3, cells: { line: 第 3 行, shown: start } }
        - id: runs
          type: text
          format: integer
          prompt: 函数体 `print("开始测量")` 一共运行了几次？
          key: 2
      explanation: |
        第 1–2 行只是定义，**什么也不显示**。第 4 行显示“准备样本”；第 5 行调用一次，转进函数显示“开始测量”；第 6 行再调用一次，又显示一次。

        所以输出依次是 **准备样本、开始测量、开始测量**，函数体运行了 **2** 次：调用几次，就运行几次。
      verify: |
        import sys
        calls = []
        def watch(frame, event, arg):
            if event == "call" and frame.f_code.co_name == "show_start":
                calls.append(1)
        sys.settrace(watch)
        try:
            r = run()
        finally:
            sys.settrace(None)
        labels = {"准备样本": "prep", "开始测量": "start"}
        after_def = run("\n".join(CODE.splitlines()[:2]))
        answers = {
            "before": "nothing" if after_def.out == "" else "start",
            "lines": {f"l{i}": {"shown": labels[line]} for i, line in enumerate(r.lines(), 1)},
            "runs": len(calls),
        }
    practice:
      - id: py40.k1.q1
        kind: [predict]
        uses: [py04.k1]
        body: |
          ```python startLine=1
          def warn():
              print("信号偏低，请复测")

          print("检查结束")
          ```
        slots:
          - id: count
            type: text
            format: integer
            prompt: 屏幕上一共显示几行？
            key: 1
            feedback:
              - when: 2
                message: 第 1–2 行只定义了 warn，程序里没有一行写 `warn()`。
          - id: runs
            type: text
            format: integer
            prompt: warn 的函数体运行了几次？
            key: 0
        explanation: |
          只显示 **1** 行“检查结束”。程序定义了 warn，却没有任何一行调用它，所以函数体运行了 **0** 次，“信号偏低，请复测”一次也不显示。
        verify: |
          import sys
          calls = []
          def watch(frame, event, arg):
              if event == "call" and frame.f_code.co_name == "warn":
                  calls.append(1)
          sys.settrace(watch)
          try:
              r = run()
          finally:
              sys.settrace(None)
          answers = {"count": len(r.lines()), "runs": len(calls)}
      - id: py40.k1.q2
        kind: [debug, predict]
        uses: [py04.k1]
        body: |
          同事想先显示“开始”，再显示“报告已生成”。

          ```python startLine=1
          print("开始")
          report()

          def report():
              print("报告已生成")
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行这段程序会怎样？
            options:
              - { id: ok, content: 先显示“开始”，再显示“报告已生成” }
              - { id: reversed, content: 先显示“报告已生成”，再显示“开始” }
              - id: error
                content: 显示“开始”之后，在第 2 行报 NameError
              - { id: silent, content: 什么也不显示，直接报错 }
            key: error
          - id: fix
            type: choice
            prompt: 怎样改，才能先显示“开始”、再显示“报告已生成”？
            options:
              - id: noparen
                content: 把第 2 行的 `report()` 改成 `report`，去掉括号
                feedback: 去掉括号也要先认识 report 这个名字，第 2 行照样报 NameError；而且不带括号就不是调用。
              - id: delete
                content: 删掉第 2 行
                feedback: 删掉以后程序里没有调用 report，“报告已生成”一次也不显示。
              - id: move
                content: 把第 4–5 行的定义移到第 1 行之前
            key: move
        explanation: |
          第 1 行先显示“开始”；第 2 行要调用 report，可这时第 4 行的 def 还没运行，Python 不认识这个名字，于是**在第 2 行报 NameError**，程序停下。

          把定义移到最前面：先定义、再调用，就会依次显示“开始”和“报告已生成”。删掉第 2 行就没有调用了；只去掉括号，第 2 行仍然要用到这个还不认识的名字。
        verify: |
          lines = CODE.splitlines()
          r = run()
          outcomes = {
              "ok": r.error is None and r.out == "开始\n报告已生成\n",
              "reversed": r.out.startswith("报告已生成"),
              "error": r.error == "NameError" and r.out == "开始\n",
              "silent": r.error is not None and r.out == "",
          }
          programs = {
              "noparen": "\n".join([lines[0], "report"] + lines[3:]),
              "delete": "\n".join([lines[0]] + lines[3:]),
              "move": "\n".join(lines[3:] + lines[:2]),
          }
          fixes = [name for name, code in programs.items()
                   if run(code).error is None and run(code).out == "开始\n报告已生成\n"]
          true = [name for name, ok in outcomes.items() if ok]
          answers = {"outcome": true[0] if len(true) == 1 else true, "fix": fixes[0] if len(fixes) == 1 else fixes}
      - id: py40.k1.q3
        kind: [trace, predict]
        uses: [py01.k2, py04.k1]
        body: |
          一个函数里也可以调用另一个函数。

          ```python startLine=1
          def weigh():
              print("称重")

          def record():
              print("记录")
              weigh()

          record()
          print("换下一份")
          weigh()
          ```
        slots:
          - id: lines
            type: table
            prompt: 按先后顺序选出程序显示的每一行。
            columns:
              - { id: line, header: 输出的第几行 }
              - id: shown
                header: 显示
                input: { type: choice, options: [{ id: weigh, label: 称重 }, { id: record, label: 记录 }, { id: next, label: 换下一份 }] }
            rows:
              - { id: l1, cells: { line: 第 1 行, shown: record } }
              - { id: l2, cells: { line: 第 2 行, shown: weigh } }
              - { id: l3, cells: { line: 第 3 行, shown: next } }
              - { id: l4, cells: { line: 第 4 行, shown: weigh } }
          - id: runs
            type: text
            format: integer
            prompt: weigh 的函数体一共运行了几次？
            key: 2
        explanation: |
          输出依次是 **记录、称重、换下一份、称重**。

          第 8 行调用 record：先显示“记录”，接着 record 的第二行调用 weigh，显示“称重”，然后回到第 8 行之后。第 9 行显示“换下一份”，第 10 行再调用一次 weigh。weigh 一共被调用 **2** 次：一次在 record 里面，一次在第 10 行。
        verify: |
          import sys
          calls = []
          def watch(frame, event, arg):
              if event == "call" and frame.f_code.co_name == "weigh":
                  calls.append(1)
          sys.settrace(watch)
          try:
              r = run()
          finally:
              sys.settrace(None)
          labels = {"称重": "weigh", "记录": "record", "换下一份": "next"}
          answers = {
              "lines": {f"l{i}": {"shown": labels[line]} for i, line in enumerate(r.lines(), 1)},
              "runs": len(calls),
          }
    review:
      - id: py40.k1.r1
        kind: [modify]
        uses: [py04.k1]
        body: |
          把下面的代码块排成一段程序：先显示“开始”，再把 measure 的做法运行两遍，每遍显示一次“测量”。每一块都要用上，并排好缩进。
        slots:
          - id: program
            type: order
            indent: 1
            items:
              - { id: call1, code: measure() }
              - { id: start, code: print("开始") }
              - { id: body, code: print("测量") }
              - { id: call2, code: measure() }
              - { id: def, code: "def measure():" }
            key: [def, body, start, call1, call2]
            alternatives:
              - [start, def, body, call1, call2]
            indents: { def: 0, body: 1, start: 0, call1: 0, call2: 0 }
            tests:
              - name: 依次显示开始、测量、测量
                stdout: |
                  开始
                  测量
                  测量
        explanation: |
          `print("测量")` 要缩进在 `def measure():` 下面，作为函数体；两次 `measure()` 不缩进，要放在定义之后。`print("开始")` 放在两次调用之前，放在定义的前面或后面都可以，因为定义本身不显示任何东西。

          ```python
          def measure():
              print("测量")

          print("开始")
          measure()
          measure()
          ```
      - id: py40.k1.r2
        kind: [trace]
        uses: [py01.k2, py04.k1]
        body: |
          ```python startLine=1
          def done():
              print("记录完成")

          total = 3
          done()
          total = total + 1
          done()
          ```
        slots:
          - id: early
            type: text
            format: integer
            prompt: 第 4 行运行完时，屏幕上已经显示了几次“记录完成”？
            key: 0
            feedback:
              - when: 1
                message: 第 1–2 行只是定义，“记录完成”要等第 5 行调用时才第一次显示。
          - id: total
            type: text
            format: integer
            prompt: 整个程序一共显示几次“记录完成”？
            key: 2
        explanation: |
          第 4 行运行完时显示了 **0** 次：前两行只是定义 done，第 4 行只给 total 赋值。第 5 行和第 7 行各调用一次，所以一共显示 **2** 次。
        verify: |
          first_four = "\n".join(CODE.splitlines()[:4])
          answers = {
              "early": run(first_four).lines().count("记录完成"),
              "total": run().lines().count("记录完成"),
          }
    quiz:
      - id: py40.k1.x1
        kind: [predict, debug]
        uses: [py04.k1]
        body: |
          哪一段程序会依次显示“开始”“测量”“结束”三行？
        slots:
          - id: program
            type: choice
            options:
              - id: never
                content: |
                  ```python
                  print("开始")
                  def measure():
                      print("测量")
                  print("结束")
                  ```
              - id: early
                content: |
                  ```python
                  print("开始")
                  measure()
                  def measure():
                      print("测量")
                  print("结束")
                  ```
              - id: right
                content: |
                  ```python
                  def measure():
                      print("测量")
                  print("开始")
                  measure()
                  print("结束")
                  ```
              - id: first
                content: |
                  ```python
                  def measure():
                      print("测量")
                  measure()
                  print("开始")
                  print("结束")
                  ```
            key: right
        explanation: |
          先定义 measure、再显示“开始”、然后调用、最后显示“结束”的那一段是对的。

          只定义不调用的那一段，“测量”一次也不显示；在 def 之前调用的那一段，第 2 行报 NameError；先调用再显示“开始”的那一段，顺序成了测量、开始、结束。
        verify: |
          fits = [option for option, code in OPTIONS["program"].items()
                  if run(code).error is None and run(code).lines() == ["开始", "测量", "结束"]]
          answers = {"program": fits[0] if len(fits) == 1 else fits}
      - id: py40.k1.x2
        kind: [trace]
        uses: [py01.k2, py04.k1]
        body: |
          填写运行到每一处时，屏幕上**一共**已经显示了几行。

          ```python startLine=1
          def check():
              print("检查")
              print("通过")

          print("开始")
          check()
          check()
          ```
        slots:
          - id: shown
            type: table
            columns:
              - { id: at, header: 运行完 }
              - { id: count, header: 已显示的行数, input: integer }
            rows:
              - { id: d, cells: { at: 第 1–3 行（定义）, count: 0 } }
              - { id: l5, cells: { at: 第 5 行, count: 1 } }
              - { id: l6, cells: { at: 第 6 行, count: 3 } }
              - { id: l7, cells: { at: 第 7 行, count: 5 } }
        explanation: |
          定义不显示任何东西，所以第 1–3 行运行完是 **0** 行。第 5 行显示“开始”，共 **1** 行；第 6 行调用 check，函数体的两行 print 各显示一行，共 **3** 行；第 7 行再调用一次，共 **5** 行。
        verify: |
          lines = CODE.splitlines()
          count = lambda n: len(run("\n".join(lines[:n])).lines())
          answers = {"shown": {"d": {"count": count(3)}, "l5": {"count": count(5)}, "l6": {"count": count(6)}, "l7": {"count": count(7)}}}

  - id: py40.k2
    keyPrerequisites: [py04, py10]
    title: 形参接收实参，return 把值交回
    card:
      name: 参数与返回值
      aliases: [形参, 实参, return, 返回值]
      definition: 调用时，形参按位置或按名字接收实参；return 把一个值交回调用处，并结束这次调用。
      conditions:
        - 按位置给实参只看顺序：net_signal(3, 12) 里 raw 是 3，blank 是 12。
        - 只 print 不 return 时，调用处拿到的是 None，不能接着计算。
      example:
        from: py40.k2.e0
        text: |
          ```python
          def net_signal(raw, blank):
              return raw - blank

          a = net_signal(12, 3)
          b = net_signal(blank=2, raw=7)
          ```
          第一次调用 raw 为 12、blank 为 3，交回 9；第二次按名字给，raw 为 7、blank 为 2，交回 5。
    lesson: |
      函数常常需要输入。写在 `def` 后面括号里的名字叫**形参**，调用时写在括号里的值叫**实参**：

      ```python
      def net_signal(raw, blank):
          return raw - blank
      ```

      调用 `net_signal(12, 3)` 时，形参先按位置接收实参：`raw` 指向 12，`blank` 指向 3，就像函数一开始先做了 `raw = 12`、`blank = 3`。也可以按名字给，`net_signal(blank=3, raw=12)` 的结果一样。按位置给时只看顺序：`net_signal(3, 12)` 会让 `raw` 指向 3。

      `return 值` 把这个值**交回**调用的地方，整个调用就被这个值取代。`x = net_signal(12, 3) + 1` 先算出 `net_signal(12, 3)` 是 9，再算 9 + 1。

      `return` 同时结束这次调用，它后面的行不再运行。函数里有 if/elif/else 时，走到哪条路径上的 `return`，就交回哪个值：

      ```python
      def label(signal, limit):
          if signal >= limit:
              return "达标"
          else:
              return "未达标"
      ```

      只 `print` 不 `return` 的函数，会把结果显示在屏幕上，但调用处拿到的是 None（表示没有值），不能接着算。要把结果交给下一步，就要 `return`。
