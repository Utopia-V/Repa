      explanation: |
        进入函数时 raw 是 14、blank 是 2、factor 是 3。第 2 行算出 net = 14 - 2 = **12**；第 3 行用 net 算出 scaled = 12 × 3 = **36**；第 4 行交回 scaled，所以 result 是 **36**。

        倒着看也一样：result 来自 scaled，scaled 来自 net 和 factor，net 来自 raw 和 blank。
