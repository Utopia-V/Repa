  - id: py40.k3
    keyPrerequisites: [py01, py04]
    title: 局部中间量如何流向结果
    card:
      name: 函数里的中间量
      aliases: [局部变量, 中间结果]
      definition: 函数体里算出的中间量只在这一次调用里存在；只有 return 后面的那个值被交回，其余的调用结束就丢掉。
      conditions:
        - 从 return 倒着追：交回的名字在哪一行算出、用了哪些名字，一直追到形参。
        - 中间量算对了却没有被交回，调用处仍然拿不到它。
      example:
        from: py40.k3.e0
        text: |
          ```python
          def corrected(raw, blank, factor):
              net = raw - blank
              scaled = net * factor
              return scaled
          ```
          corrected(14, 2, 3)：net 是 12，scaled 是 36，交回 36。
    lesson: |
      函数里常常不是一步算完，而是先算出几个**中间量**：

      ```python
      def corrected(raw, blank, factor):
          net = raw - blank
          scaled = net * factor
          return scaled
      ```

      读一次调用，比如 `corrected(14, 2, 3)`，就像读一段普通程序：先写下形参接收的值，再逐行记状态表。

      | 运行到 | raw | blank | factor | net | scaled |
      |---|---:|---:|---:|---:|---:|
      | 刚进入函数 | 14 | 2 | 3 | 尚未定义 | 尚未定义 |
      | 第 2 行 | 14 | 2 | 3 | 12 | 尚未定义 |
      | 第 3 行 | 14 | 2 | 3 | 12 | 36 |

      第 4 行交回 scaled，也就是 36。

      结果是哪一个，只看 return 后面写的是谁。中间量只活在这一次调用里：调用结束，`net`、`scaled` 就不在了，调用处只拿到交回的那个值。

      读 AI 写的函数时，可以从 return 倒着查：交回的名字在哪一行算出 → 那一行用了哪些名字 → 那些名字又从哪里来……一直追到形参。漏掉的一步（例如没减本底）、用错的名字（例如用了 `raw` 而不是 `net`），都会在这条链上露出来。
    example:
      id: py40.k3.e0
      kind: [trace]
      uses: [py01.k2, py04.k1]
      body: |
        填写调用 `corrected(14, 2, 3)` 时，函数体第 2、3 行运行完后 `net` 和 `scaled` 的值，还没有赋值的填“尚未定义”。

        ```python startLine=1
        def corrected(raw, blank, factor):
            net = raw - blank
            scaled = net * factor
            return scaled

        result = corrected(14, 2, 3)
        ```
      slots:
        - id: trace
          type: table
          columns:
            - { id: line, header: 运行到 }
            - id: net
              header: net
              input: { type: text, format: integer, quick: [尚未定义] }
            - id: scaled
              header: scaled
              input: { type: text, format: integer, quick: [尚未定义] }
          rows:
            - { id: l2, cells: { line: 第 2 行, net: 12, scaled: 尚未定义 } }
            - { id: l3, cells: { line: 第 3 行, net: 12, scaled: 36 } }
        - id: result
          type: text
          format: integer
          prompt: 第 6 行运行完，result 是多少？
