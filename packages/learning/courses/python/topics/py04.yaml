id: py04
title: 读懂一次函数调用
status: complete
minutes: 20
summary: 读懂 名字(实参)：实参按位置或按名字交给函数，调用处换成返回值；后面还要用的结果要存进名字，print 只负责显示。
prerequisites:
  - topic: py03
    key: true
    weight: 0.67
    covers: [py03.k1, py03.k2]
sources:
  - source: think-python
    where: 第 2 章 §2.7
    url: https://allendowney.github.io/ThinkPython/chap02.html
    use: reference
  - source: think-python
    where: 第 6 章 §6.1–6.2
    url: https://allendowney.github.io/ThinkPython/chap06.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.9.2
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
  - source: python-docs
    where: 标准库：内置函数（abs、len、max、min、print、round）
    url: https://docs.python.org/3.12/library/functions.html
    use: reference
notes: |
  范围：只读调用内置函数 abs、len、max、min、round、print，以及 py03 用过的 int、float、str。max、min 在这里接几个单独的数，放进列表的用法留给 py07；len 只用于文字，列表的 len 在 py06。不讲定义函数（py40）、import（py13）、点号方法调用（py05）。round 只用保留几位小数的普通情况，例子避开 .5 边界和二进制尾数，参数名只用 ndigits。print 的关键字参数讲 sep，end 只在讲解里提一句，不出题。
  py03.k3 的 None 在 k3 里重新用到（print 交回 None），先修的 covers 目前只写了 py03.k1、k2，是否补上 py03.k3 待维护者决定。
  建议题型与判分：追踪变量（P）、解释代码（S/O）、小改代码（T）。解释代码一律做成可由程序核对的结构化选择，复习和测验里没有 manual 作答位。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 2 分钟、练习 4 分钟；收束 1 分钟。
  讲解、例题和题目为本课自拟。
intro: |
  在 py03 里你已经写过 `int("12")`、`str(7)` 这样的式子。这一节把这种写法看清楚：它叫**函数调用**，AI 写的代码里到处都会遇到它。

  程序仍然当作一段短脚本，从第一行往下运行，只有 `print` 才在屏幕上显示东西。
wrapup: |
  读一次调用，问三件事：调用的是哪个函数；交给它的实参是什么，按位置还是按名字；它交回的返回值去了哪里，是存进了名字、接着参与计算，还是只显示出来就没了。

  读 AI 写的代码时，后面要用的值如果只在 `print` 里出现过，多半就是没有存下来。
kps:
  - id: py04.k1
    title: 函数名、实参和返回结果
    card:
      name: 函数调用
      aliases: [调用, 实参, 返回值]
      definition: "`名字(实参)` 把括号里的值交给这个函数，函数算出一个结果交回来，叫返回值；这次调用在式子里就换成返回值。"
      conditions:
        - 括号里先算好再交给函数；调用套着调用时，从最里面一层往外算。
        - 换成返回值以后，这一行照常往下算，例如 `abs(-4) + 1` 先得 4，再得 5。
      example:
        from: py04.k1.e0
        text: |
          ```python
          low = min(12, 7, 9)
          high = max(12, 7, 9)
          spread = high - low
          print(spread)
          ```
          两次调用分别交回 7 和 12，spread 是 12 - 7 = 5，最后显示 5。
    lesson: |
      `abs(-4)` 是一次**函数调用**：`abs` 是函数名，括号里的 `-4` 是交给函数的值，叫**实参**。函数算完交回一个值，叫**返回值**；`abs` 交回去掉负号以后的数，也就是 4。

      读到一次调用，就把它换成返回值，再接着读这一行：

      | 调用 | 返回值 | 做了什么 |
      |---|---|---|
      | `abs(-4)` | 4 | 绝对值 |
      | `max(3, 9, 5)` | 9 | 几个数里最大的 |
      | `min(3, 9, 5)` | 3 | 几个数里最小的 |
      | `len("sample")` | 6 | 文字有几个字符 |
      | `round(3.14159, 2)` | 3.14 | 保留两位小数 |
      | `int("12")` | 12 | py03 里的[转换](repa:concept/py03.k2)，也是一次调用 |

      所以 `total = abs(-4) + 1` 先把 `abs(-4)` 换成 4，再算 4 + 1，`total` 指向 5。有几个实参时用逗号隔开。

      实参也可以是一个式子，或者另一次调用。Python 先把括号里算好，再交给函数：`max(2 + 5, 6)` 先算出 7，结果是 7；`abs(min(-3, 2))` 先算里面的 `min(-3, 2)` 得 -3，再算 `abs(-3)` 得 3。
    example:
      id: py04.k1.e0
      kind: [trace, predict]
      body: |
        同一份样本测了三次，读数分别是 12、7、9。阅读下面的程序。

        ```python
        low = min(12, 7, 9)
        high = max(12, 7, 9)
        spread = high - low
        print(spread)
        ```
      slots:
        - id: low
          type: text
          format: integer
          label: low
          prompt: "`low` 指向多少？"
          key: 7
        - id: high
          type: text
          format: integer
          label: high
          prompt: "`high` 指向多少？"
          key: 12
        - id: output
          type: text
          format: integer
          prompt: 程序最后显示什么？
          key: 5
      explanation: |
        `low` 是 **7**，`high` 是 **12**，最后显示 **5**。第 1 行的 `min(12, 7, 9)` 交回三个数里最小的 7，这一行就相当于 `low = 7`；第 2 行同理得到 12。第 3 行只是普通的减法，12 - 7 = 5。
      verify: |
        r = run()
        answers = {"low": r["low"], "high": r["high"], "output": int(r.out)}
    practice:
      - id: py04.k1.q1
        kind: [predict]
        body: |
          ```python
          print(abs(3 - 8) + 1)
          ```
        slots:
          - id: output
            type: text
            format: integer
            prompt: 显示什么？
            key: 6
            feedback:
              - when: -4
                message: 括号里的 3 - 8 得 -5，`abs` 交回的是去掉负号的 5，再加 1。
        explanation: |
          显示 **6**。先算括号里的 `3 - 8` 得 -5；`abs(-5)` 交回 5；这次调用换成 5 以后，再算 5 + 1。
        verify: |
          answers = {"output": int(run().out)}
      - id: py04.k1.q2
        kind: [trace]
        body: |
          ```python
          size = max(len("ctrl"), len("drug_a"))
          ```

          这一行里一共有三次调用。按 Python 计算的先后，填写每次调用的返回值。
        slots:
          - id: calls
            type: table
            columns:
              - id: call
                header: 调用
              - id: value
                header: 返回值
                input: integer
            rows:
              - id: c1
                cells: { call: 'len("ctrl")', value: 4 }
              - id: c2
                cells: { call: 'len("drug_a")', value: 6 }
              - id: c3
                cells: { call: 'max(4, 6)', value: 6 }
        explanation: |
          先算 `max` 括号里的两个实参：`len("ctrl")` 交回 **4**，`len("drug_a")` 交回 **6**（下划线也算一个字符）。两个实参都算好了，才调用 `max(4, 6)`，交回 **6**，`size` 指向 6。
        verify: |
          answers = {"calls": {
              "c1": {"value": run('v = len("ctrl")')["v"]},
              "c2": {"value": run('v = len("drug_a")')["v"]},
              "c3": {"value": run()["size"]},
          }}
      - id: py04.k1.q3
        kind: [explain]
        uses: [py03.k2]
        body: |
          ```python
          reading = int("15") + 5
          ```

          逐项说出这一行里的调用。
        slots:
          - id: name
            type: choice
            prompt: 调用的函数名是
            options:
              - { id: reading, content: "`reading`" }
              - { id: text, content: '`"15"`' }
              - { id: int, content: "`int`" }
            key: int
          - id: argument
            type: choice
            prompt: 交给函数的实参是
            options:
              - { id: text, content: '`"15"`，一段文字' }
              - { id: five, content: "`5`" }
              - { id: reading, content: "`reading`" }
            key: text
          - id: returned
            type: text
            format: integer
            prompt: 这次调用的返回值
            key: 15
          - id: reading
            type: text
            format: integer
            prompt: 运行之后 `reading` 指向
            key: 20
        explanation: |
          函数名是 **int**，实参是文字 **"15"**，返回值是整数 **15**；调用处换成 15 以后再加 5，`reading` 指向 **20**。`+ 5` 不在 `int` 的括号里，不是交给 `int` 的实参。
        verify: |
          import ast
          call = next(node for node in ast.walk(ast.parse(CODE)) if isinstance(node, ast.Call))
          # 选项与它们代表的源码写法；从语法树里读出函数名和实参，再找对应的选项。
          names = {"reading": "reading", "text": "'15'", "int": "int"}
          arguments = {"text": "'15'", "five": "5", "reading": "reading"}
          name = [option for option, source in names.items() if source == ast.unparse(call.func)]
          argument = [option for option, source in arguments.items() if [source] == [ast.unparse(a) for a in call.args]]
          answers = {
              "name": name[0] if len(name) == 1 else name,
              "argument": argument[0] if len(argument) == 1 else argument,
              "returned": run("v = " + ast.unparse(call))["v"],
              "reading": run()["reading"],
          }
    review:
      - id: py04.k1.r1
        kind: [explain]
        uses: [py03.k1, py03.k2]
        body: |
          样本编号是 `S_017`。哪一行让 `n` 指向这个编号有几个字符？
        slots:
          - id: line
            type: choice
            options:
              - id: bare
                content: |
                  ```python
                  n = len(S_017)
                  ```
                feedback: 没有引号时，`S_017` 被当成一个名字，而这个名字没有赋过值。
              - id: length
                content: |
                  ```python
                  n = len("S_017")
                  ```
              - id: copy
                content: |
                  ```python
                  n = "S_017"
                  ```
                feedback: 这一行没有调用任何函数，`n` 指向的是编号本身。
              - id: convert
                content: |
                  ```python
                  n = int("S_017")
                  ```
                feedback: "`int` 把文字转成整数，`S_017` 不是一个整数的写法，会报错。"
            key: length
        explanation: |
          `n = len("S_017")` 正确：`len` 交回文字的字符个数 5。去掉引号，`S_017` 就成了一个没有赋值的名字，会报错；`n = "S_017"` 没有调用，`n` 指向编号本身；`int("S_017")` 也会报错，因为这段文字不是整数。
        verify: |
          # 逐个运行选项，留下不报错、并且 n 恰好是 S_017 字符个数的那一行。
          fits = [option for option, code in OPTIONS["line"].items()
                  if run(code).error is None and run(code).vars.get("n") == len("S_017")]
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py04.k1.r2
        kind: [trace]
        body: |
          上午 20 度，下午 26 度。下面先算温差，再取温差和两个参考值里最大的一个。

          ```python startLine=1
          gap = abs(20 - 26)
          worst = max(gap, 4, 9)
          print(worst * 2)
          ```
        slots:
          - id: trace
            type: table
            prompt: 填写每行执行后 `gap` 与 `worst` 的值，还没有赋值的填“尚未定义”。
            columns:
              - id: line
                header: 执行到
              - id: gap
                header: gap
                input: { type: text, format: integer, quick: [尚未定义] }
              - id: worst
                header: worst
                input: { type: text, format: integer, quick: [尚未定义] }
            rows:
              - id: l1
                cells: { line: 第 1 行, gap: 6, worst: 尚未定义 }
              - id: l2
                cells: { line: 第 2 行, gap: 6, worst: 9 }
          - id: output
            type: text
            format: integer
            prompt: 第 3 行显示什么？
            key: 18
        explanation: |
          第 1 行：`20 - 26` 得 -6，`abs` 交回 **6**。第 2 行：`max(6, 4, 9)` 交回三个数里最大的 **9**，不是第一个实参 6。第 3 行显示 9 × 2 = **18**。
        verify: |
          names = ["gap", "worst"]
          states = trace(names=names)[:2]
          answers = {
              "trace": {f"l{i}": {name: state.get(name, "尚未定义") for name in names} for i, state in enumerate(states, 1)},
              "output": int(run().out),
          }
    quiz:
      - id: py04.k1.x1
        kind: [trace, predict]
        body: |
          ```python
          print(max(abs(-7), 5) - min(4, 9))
          ```
        slots:
          - id: inner
            type: text
            format: integer
            prompt: "`abs(-7)` 交回"
            key: 7
          - id: largest
            type: text
            format: integer
            prompt: "`max(abs(-7), 5)` 交回"
            key: 7
          - id: smallest
            type: text
            format: integer
            prompt: "`min(4, 9)` 交回"
            key: 4
          - id: output
            type: text
            format: integer
            prompt: 最后显示
            key: 3
        explanation: |
          从里往外算：`abs(-7)` 交回 **7**；于是 `max(7, 5)` 交回 **7**；`min(4, 9)` 交回 **4**；最后 7 - 4，显示 **3**。
        verify: |
          answers = {
              "inner": run("v = abs(-7)")["v"],
              "largest": run("v = max(abs(-7), 5)")["v"],
              "smallest": run("v = min(4, 9)")["v"],
              "output": int(run().out),
          }
      - id: py04.k1.x2
        kind: [explain]
        body: |
          运行下面这一行之后，哪一句说法正确？

          ```python
          size = len("sample")
          ```
        slots:
          - id: claim
            type: choice
            options:
              - id: shown
                content: 屏幕上显示了 6
                feedback: 赋值和调用都不会显示东西，要显示得用 print。
              - id: text
                content: "`size` 指向文字 sample"
                feedback: 等号右边的调用先被换成返回值，`size` 指向的是返回值。
              - id: function
                content: "`size` 指向 `len` 这个函数"
                feedback: 函数名后面有括号，就是调用了它；`size` 得到的是调用的结果。
              - id: correct
                content: "`len` 交回 6，`size` 指向 6，屏幕上什么也不显示"
            key: correct
        explanation: |
          “`len` 交回 6，`size` 指向 6，屏幕上什么也不显示”这一句正确。`len("sample")` 交回 sample 的字符个数 6，等号让 `size` 指向这个返回值；整行没有 `print`，所以什么也不显示。
        verify: |
          r = run()
          # 逐句核对每个说法，成立的必须恰好一句。
          holds = {
              "shown": r.out.strip() == "6",
              "text": r["size"] == "sample",
              "correct": r["size"] == 6 and r.out == "",
              "function": callable(r["size"]),
          }
          true = [claim for claim, ok in holds.items() if ok]
          answers = {"claim": true[0] if len(true) == 1 else true}

  - id: py04.k2
    title: 位置参数与关键字参数
    card:
      name: 关键字参数
      aliases: [位置参数, 参数名, sep]
      definition: 实参可以按位置交给函数，第几个位置代表什么由函数规定；也可以写成 名字=值，指明交给哪一个参数，这叫关键字参数。
      conditions:
        - 位置调换，含义就变了：`round(2.468, 2)` 里的 2 是保留几位小数。
        - 关键字参数写在位置参数后面；没写的参数用函数自带的缺省值，例如 print 的 sep 缺省是一个空格。
      example:
        from: py04.k2.e0
        text: |
          ```python
          print(round(3.14159, 3))
          print(round(3.14159, ndigits=1))
          print("S1", "S2", sep=",")
          ```
          依次显示 3.142、3.1 和 S1,S2。
    lesson: |
      `round(2.468, 2)` 交给 `round` 两个实参：第一个位置是要处理的数，第二个位置是保留几位小数，结果是 2.47。这样按先后位置交给函数的实参叫**位置参数**。每个位置代表什么由函数规定，调换了就是另一个意思：`round(2, 2.468)` 是要把 2 保留“2.468 位”小数，会报错。

      也可以写明交给哪一个参数：`round(2.468, ndigits=2)`。`ndigits` 是 `round` 第二个参数的名字（number of digits，位数）。这种 `名字=值` 的写法叫**关键字参数**，读代码的人不用记位置，也知道这个 2 是什么。

      没写的参数用函数自带的缺省值：`round(2.468)` 不给位数，就取整，结果是整数 2。

      `print` 可以一次显示几个值，它有个关键字参数 `sep`，规定这几个值之间放什么，缺省是一个空格：

      | 写法 | 显示 |
      |---|---|
      | `print("A", "B")` | A B |
      | `print("A", "B", sep="-")` | A-B |
      | `print(1, 2, sep="")` | 12 |

      另一个关键字参数 `end` 规定显示完以后放什么，缺省是换行，所以每个 `print` 各占一行。

      关键字参数要写在位置参数的后面，`round(ndigits=2, 2.468)` 这种写法 Python 不接受。
    example:
      id: py04.k2.e0
      kind: [predict]
      body: |
        ```python
        print(round(3.14159, 3))
        print(round(3.14159, ndigits=1))
        print("S1", "S2", sep=",")
        ```
      slots:
        - id: line1
          type: text
          match: output
          prompt: 第一行显示
          key: "3.142"
        - id: line2
          type: text
          match: output
          prompt: 第二行显示
          key: "3.1"
        - id: line3
          type: text
          match: output
          prompt: 第三行显示
          key: "S1,S2"
      explanation: |
        依次显示 **3.142**、**3.1**、**S1,S2**。第一行按位置给出位数 3；第二行用关键字参数 `ndigits=1` 写明保留一位；第三行 `sep=","` 让两个值之间放一个逗号，不再是缺省的空格。
      verify: |
        lines = run().lines()
        answers = {"line1": lines[0], "line2": lines[1], "line3": lines[2]}
    practice:
      - id: py04.k2.q1
        kind: [predict]
        body: |
          ```python
          print("drug", "A")
          print("drug", "A", sep="_")
          print(10, 20, 30, sep="")
          ```
        slots:
          - id: line1
            type: text
            match: output
            prompt: 第一行显示
            key: "drug A"
          - id: line2
            type: text
            match: output
            prompt: 第二行显示
            key: "drug_A"
          - id: line3
            type: text
            match: output
            prompt: 第三行显示
            key: "102030"
            feedback:
              - when: "10 20 30"
                message: "`sep=\"\"` 让几个值之间什么也不放，连空格也没有。"
        explanation: |
          依次显示 **drug A**、**drug_A**、**102030**。没写 `sep` 时，几个值之间放一个空格；`sep="_"` 放下划线；`sep=""` 是一段空文字，值与值之间什么也不放。
        verify: |
          lines = run().lines()
          answers = {"line1": lines[0], "line2": lines[1], "line3": lines[2]}
      - id: py04.k2.q2
        kind: [debug]
        body: |
          要让 `x` 指向 2.718 保留一位小数的结果 2.7。下面哪些写法能做到？选出所有能做到的。
        slots:
          - id: forms
            type: choice
            multiple: true
            options:
              - id: positional
                content: |
                  ```python
                  x = round(2.718, 1)
                  ```
              - id: swapped
                content: |
                  ```python
                  x = round(1, 2.718)
                  ```
                feedback: 第一个位置是要处理的数，第二个位置是位数；调换后会报错。
              - id: keyword
                content: |
                  ```python
                  x = round(2.718, ndigits=1)
                  ```
              - id: keyword_first
                content: |
                  ```python
                  x = round(ndigits=1, 2.718)
                  ```
                feedback: 关键字参数要写在位置参数后面，这样写 Python 不接受。
              - id: no_digits
                content: |
                  ```python
                  x = round(2.718)
                  ```
                feedback: 不给位数时 round 取整，得到 3。
            key: [positional, keyword]
        explanation: |
