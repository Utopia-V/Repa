  - id: py04.k3
    title: 把返回结果交给下一步而不是只显示
    card:
      name: 接住返回值
      aliases: [保存结果, print 的返回值]
      definition: 调用交回的值，要存进一个名字或直接放进下一步的式子，后面才用得上；单独一行的调用既不显示也不保存，print 只负责显示，交回的是 None。
      conditions:
        - 单独一行 `round(x, 1)` 不会改变 x；要保留，写 `x = round(x, 1)` 或存进新名字。
        - "`result = print(5)` 会显示 5，但 result 指向 None，之后拿它计算会报错。"
      example:
        from: py04.k3.e0
        text: |
          ```python
          dose = 2.468
          round(dose, 1)
          print(dose)
          dose = round(dose, 1)
          print(dose)
          ```
          第 2 行算出 2.5 却没有存下，第一次显示 2.468；第 4 行把结果存回 dose，第二次显示 2.5。
    lesson: |
      一次调用交回返回值以后，这个值去了哪里，要看调用写在哪里：

      ```python startLine=1
      value = 2.468
      round(value, 1)
      rounded = round(value, 1)
      print(round(value, 1))
      ```

      - 第 2 行：算出了 2.5，但没有存进任何名字，也不显示，随即丢掉。它**不会**把 `value` 改成 2.5，`value` 仍是 2.468。
      - 第 3 行：返回值存进 `rounded`，后面的代码可以接着用。
      - 第 4 行：返回值交给 `print` 显示在屏幕上；显示完同样没有存下来。

      `print` 是把值显示出来，它自己交回的是 [None](repa:concept/py03.k3)。所以 `result = print(5)` 会显示 5，但之后 `result` 是 None，`result + 1` 会报错。

      AI 写的代码里常见这种情况：上一步只用 `print` 显示了一个结果，下一步却想用它。看到后面要用的值，先找它有没有被存进名字。
    example:
      id: py04.k3.e0
      kind: [trace, predict]
      body: |
        ```python startLine=1
        dose = 2.468
        round(dose, 1)
        print(dose)
        dose = round(dose, 1)
        print(dose)
        ```
      slots:
        - id: first
          type: text
          match: output
          prompt: 第一次显示什么？
          key: "2.468"
        - id: second
          type: text
          match: output
          prompt: 第二次显示什么？
          key: "2.5"
        - id: line2
          type: choice
          prompt: 第 2 行做了什么？
          options:
            - id: lost
              content: 算出 2.5，但没有存下也没有显示，dose 不变
            - id: changed
              content: 把 dose 改成了 2.5
            - id: shown
              content: 在屏幕上显示了 2.5
          key: lost
      explanation: |
        第一次显示 **2.468**，第二次显示 **2.5**。第 2 行的 `round(dose, 1)` 算出了 2.5，可是它单独一行，既没有存进名字，也没有交给 `print`，算完就丢了，`dose` 仍是 2.468。第 4 行把同样的返回值存回 `dose`，之后 `dose` 才是 2.5。
      verify: |
        lines = run().lines()
        states = trace(names=["dose"])
        # 第 2 行执行前后 dose 是否相同；第 2 行单独运行时是否有输出。
        unchanged = states[1]["dose"] == states[0]["dose"]
        silent = run("dose = 2.468\nround(dose, 1)").out == ""
        answers = {
            "first": lines[0],
            "second": lines[1],
            "line2": "lost" if unchanged and silent else ("changed" if not unchanged else "shown"),
        }
