id: py25
title: 一条记录是否重复，取决于什么
status: complete
minutes: 20
summary: 先按“一行代表什么”定出业务键，再用 duplicated/drop_duplicates 的 subset 和 keep 标出或去掉重复，分清录了两遍和数值冲突。
prerequisites: [py14, py12]
encompassings:
  - {topic: py14, weight: 0.5}
  - {topic: py12, weight: 0}
sources:
  - source: pydata-book
    where: 第 7 章 §7.2（去除重复）
    url: https://wesmckinney.com/book/data-cleaning
    use: reference
  - source: pandas-docs
    where: API：DataFrame.duplicated
    url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.duplicated.html
    use: reference
  - source: pandas-docs
    where: API：DataFrame.drop_duplicates
    url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
    use: reference
notes: |
  范围：本节的先修路径里没有比较运算（py08）、`df["列"]` 取列（py16）和掩码筛选（py17），所以只用 duplicated、drop_duplicates 两个方法、关键字参数、列名列表、len 和行索引；True/False 就地读作“是不是前面某行的重复”。不讲按条件筛出重复行、不讲排序后再去重，冲突怎样裁决只要求说清“交人核对”。
  建议题型与判分：预测输出（P）、小改代码（T）、写清需求（S/O）。k1 用一张表把“整行相同”“业务键相同而值不同”“同一样本不同天”三种情况摆在一起；k2 讲 keep 的三种取值和 drop_duplicates，含一道小改代码题和一道写清需求题。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、三道练习 4 分钟；k2 讲解与例题 3 分钟、三道练习 6 分钟（含小改代码）；收束 2 分钟。
  小表、讲解和题目为本课自拟。
  模型核对：复习和测验里只有 py25.k1.x2 的 key（按“一行代表什么”选业务键）程序算不出，列进 manual；练习里的业务键选择和“标出还是去掉”也是 manual，不强制核对。其余作答位由 verify 或测试核对。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。每道题都从题面给出的表重新开始，前面题目里的变量都已清除。

  大多数题用表 M：`sample_id` 是样本编号，`day` 是第几天测的，`signal` 是一次测量的值（任意单位）。约定每个样本每天只测一次；表里行的先后就是录入的先后。左边的原行索引是原表的行标签，不是从小到大的序号。

  代码结果里的 True/False 读作“是/否”。`len(表)` 是这张表的行数。
wrapup: |
  向同事或 AI 提去重需求时，可以直接说：“表的一行代表某个样本某一天的一次测量，按 sample_id 和 day 判断是不是同一条记录。同一样本同一天出现不止一次的，先全部列出来给我核对，不要自动挑一条留下。”

  拿到去重代码后，先看 `subset` 里写的是不是业务键，再看 `keep` 留的是哪一次，最后数一数结果少了几行、少的是不是你预期的那几行。
