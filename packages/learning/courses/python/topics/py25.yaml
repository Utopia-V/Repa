kps:
  - id: py25.k1
    keyPrerequisites: [py14]
    title: 业务键与整行重复的区别
    card:
      name: 业务键
      aliases: [整行重复, 同一条记录]
      definition: 按“一行代表什么”，能认出同一条记录的那几列叫业务键；业务键相同才是同一条记录，整行完全相同只是其中一种情况。
      conditions:
        - 不写 subset 的 duplicated() 只认整行完全相同；业务键相同、测量值不同的冲突行，它认不出来。
        - 当前这张表里碰巧不重复的列，不一定是业务键；业务键来自一行代表什么，而不是来自这次的数据。
        - 冲突不能让程序悄悄留一条，要按事先定好的规则处理，或去问负责数据的人。
      example:
        from: py25.k1.e0
        text: |
          ```python
          full = df.duplicated()
          by_key = df.duplicated(subset=["sample_id", "day"])
          ```
          表 M 里，`full` 只标出与索引 31 整行相同的索引 4；`by_key` 还标出了索引 15：它和索引 7 是 S_B 同一天的测量，signal 却一个是 10、一个是 11，这是冲突。
    lesson: |
      说“去重”之前，先问一行代表什么。表 M 的一行是“一个样本在某一天的一次测量”，并且约定每个样本每天只测一次。所以要认出“同一条记录”，看的是 sample_id 和 day 两列合起来：这两列都相同，说的就是同一个样本同一天的那次测量。这样一组列叫**业务键**。

      按业务键看表 M，有三种情况：

      | 原行索引 | sample_id | day | signal | 和前面的行比 |
      |---:|---|---:|---:|---|
      | 31 | S_A | 1 | 8 | 第一次出现 |
      | 7 | S_B | 1 | 10 | 第一次出现 |
      | 22 | S_A | 2 | 9 | 同一个样本的第 2 天：不是重复 |
      | 4 | S_A | 1 | 8 | 与 31 整行相同：多半是录了两遍 |
      | 15 | S_B | 1 | 11 | 与 7 业务键相同、signal 不同：**冲突** |

      整行相同的两行，去掉一行不丢信息。冲突不一样：10 和 11 至少有一个不对，留哪个是业务上的决定，要按事先说好的规则处理，或者去问负责数据的人，不能让程序悄悄留下一条。

      pandas 用 `duplicated` 方法标出重复。它对每一行回答：“这一行是不是和前面某一行重复？”结果是一列 True/False，与原表的行一一对应，索引不变；第一次出现的那行是 False，后面重复的是 True。

      ```python
      full = df.duplicated()
      by_key = df.duplicated(subset=["sample_id", "day"])
      ```

      不写 `subset` 时，每一列都相同才算重复，所以 `full` 只标出索引 4，认不出冲突的索引 15。`subset=` 后面写一个列名列表，就只比较这几列：`by_key` 把 4 和 15 都标了出来。

      还要注意：某几列在**这张表里**碰巧没有重复，不等于它们是业务键。比如某张表的 signal 恰好各不相同，下一批数据里两个样本完全可能测出同一个值。业务键来自“一行代表什么”，不来自这一次的数据。
    example:
      id: py25.k1.e0
      kind: [predict]
      data: [M]
      body: |
        阅读代码，按原行索引填写 `full` 和 `by_key` 的值，再回答索引 15 属于哪种情况。

        ```python
        full = df.duplicated()
        by_key = df.duplicated(subset=["sample_id", "day"])
        ```
      slots:
        - id: marks
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: sample_id, header: sample_id }
            - { id: day, header: day }
            - { id: signal, header: signal }
            - { id: full, header: full, input: bool }
            - { id: by_key, header: by_key, input: bool }
          rows:
            - { id: r31, cells: { index: "31", sample_id: S_A, day: "1", signal: "8", full: false, by_key: false } }
            - { id: r7, cells: { index: "7", sample_id: S_B, day: "1", signal: "10", full: false, by_key: false } }
            - { id: r22, cells: { index: "22", sample_id: S_A, day: "2", signal: "9", full: false, by_key: false } }
            - { id: r4, cells: { index: "4", sample_id: S_A, day: "1", signal: "8", full: true, by_key: true } }
            - { id: r15, cells: { index: "15", sample_id: S_B, day: "1", signal: "11", full: false, by_key: true } }
        - id: kind
          type: choice
          prompt: 索引 15 被 `by_key` 标成 True，`full` 却是 False。它和前面的索引 7 是什么关系？
          options:
            - id: double
              content: 两行整行相同，录了两遍
              feedback: 两行的 signal 一个是 10、一个是 11，并不完全相同。
            - id: conflict
              content: 同一个样本同一天的测量，signal 不同，是冲突
            - id: other_day
              content: 同一个样本不同天的测量，不是重复
              feedback: 两行的 day 都是 1。
          key: conflict
      explanation: |
        | 原行索引 | full | by_key |
        |---:|---|---|
        | 31 | False | False |
        | 7 | False | False |
        | 22 | False | False |
        | 4 | **True** | **True** |
        | 15 | False | **True** |

        索引 4 与 31 每一列都相同，两种写法都标出它。索引 15 与 7 的 sample_id、day 相同，signal 不同：整行比较时它不算重复，按业务键比较时它是同一条记录的第二次出现，所以是**冲突**。索引 22 是 S_A 的第 2 天，按业务键也不重复。第一次出现的行（31、7）都是 False。
      verify: |
        r = run()
        full, by_key = r["full"], r["by_key"]
        rows = list(zip(df.index, df["sample_id"], df["day"], df["signal"]))
        # 找出索引 15 之前与它业务键相同的行，再看测量值是否相同。
        position = [label for label, *_ in rows].index(15)
        _, sample, day, signal = rows[position]
        same_key = [row for row in rows[:position] if (row[1], row[2]) == (sample, day)]
        kind = "other_day" if not same_key else "double" if any(row[3] == signal for row in same_key) else "conflict"
        answers = {
            "marks": {f"r{label}": {"full": full[label], "by_key": by_key[label]} for label in df.index},
            "kind": kind,
        }
    practice:
      - id: py25.k1.q1
        kind: [predict, explain]
        uses: [py14.k1, py06.k1]
        data: [M]
        body: |
          有人只按样本编号去找重复。阅读代码，按原行索引填写 `marks` 的值，再判断这样做是否合适。

          ```python
          marks = df.duplicated(subset=["sample_id"])
          ```
        slots:
          - id: marks
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: sample_id, header: sample_id }
              - { id: day, header: day }
              - { id: marks, header: marks, input: bool }
            rows:
              - { id: r31, cells: { index: "31", sample_id: S_A, day: "1", marks: false } }
              - { id: r7, cells: { index: "7", sample_id: S_B, day: "1", marks: false } }
              - { id: r22, cells: { index: "22", sample_id: S_A, day: "2", marks: true } }
              - { id: r4, cells: { index: "4", sample_id: S_A, day: "1", marks: true } }
              - { id: r15, cells: { index: "15", sample_id: S_B, day: "1", marks: true } }
          - id: fit
            type: choice
            prompt: 表 M 的一行代表某个样本某一天的一次测量。只按 sample_id 找重复，合适吗？
            options:
              - id: too_wide
                content: 不合适：索引 22 是 S_A 第 2 天的正常测量，也被当成了重复
              - id: fits
                content: 合适：同一个样本只应该有一行
                feedback: 每个样本每天测一次，同一个样本可以有好几天的记录。
            key: too_wide
        explanation: |
          依次为 **False、False、True、True、True**。只比较 sample_id 时，S_A 第二、三次出现（22、4）和 S_B 第二次出现（15）都是 True。

          这**不合适**：索引 22 是 S_A 第 2 天的测量，按“一行代表某样本某天”它是一条新记录，却被当成了重复。只看 sample_id 认重复的范围太宽了，业务键要包括 day。
        verify: |
          marks = run()["marks"]
          rows = list(zip(df.index, df["sample_id"], df["day"]))
          # 被标出的行里，若有一行的 (sample_id, day) 此前没出现过，就是把新记录当成了重复。
          wrongly = [label for position, (label, sample, day) in enumerate(rows)
                     if marks[label] and (sample, day) not in [(s, d) for _, s, d in rows[:position]]]
          answers = {
              "marks": {f"r{label}": {"marks": value} for label, value in marks.items()},
              "fit": "too_wide" if wrongly else "fits",
          }
      - id: py25.k1.q2
        kind: [predict]
        uses: [py14.k1]
        data: [M2]
        body: |
          这份记录也约定每个样本每天只测一次，行的先后就是录入的先后。从上往下看，按 sample_id 和 day 判断，给每一行选一种情况。
        slots:
          - id: kinds
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: sample_id, header: sample_id }
              - { id: day, header: day }
              - { id: signal, header: signal }
              - id: kind
                header: 情况
                input:
                  type: choice
                  options:
                    - { id: new, label: 新记录（这个样本这一天第一次出现） }
                    - { id: double, label: 与前面某行整行相同 }
                    - { id: conflict, label: 与前面某行业务键相同、signal 不同 }
            rows:
              - { id: r12, cells: { index: "12", sample_id: S_C, day: "1", signal: "7", kind: new } }
              - { id: r3, cells: { index: "3", sample_id: S_D, day: "1", signal: "12", kind: new } }
              - { id: r40, cells: { index: "40", sample_id: S_C, day: "1", signal: "7", kind: double } }
              - { id: r8, cells: { index: "8", sample_id: S_D, day: "2", signal: "12", kind: new } }
              - { id: r21, cells: { index: "21", sample_id: S_C, day: "2", signal: "6", kind: new } }
              - { id: r5, cells: { index: "5", sample_id: S_D, day: "1", signal: "13", kind: conflict } }
        explanation: |
          | 原行索引 | 情况 |
          |---:|---|
          | 12 | 新记录 |
          | 3 | 新记录 |
          | 40 | 与 12 整行相同 |
          | 8 | 新记录 |
          | 21 | 新记录 |
          | 5 | 与 3 业务键相同、signal 不同（冲突） |

          容易看错的是索引 8：它的 sample_id 和 signal 都与索引 3 一样，但 day 是 2，是 S_D 第 2 天的测量，属于新记录。测量值碰巧相同不说明是同一条记录。
        verify: |
          rows = list(zip(df.index, df["sample_id"], df["day"], df["signal"]))
          kinds = {}
          for position, (label, sample, day, signal) in enumerate(rows):
              before = rows[:position]
              if any(row[1:] == (sample, day, signal) for row in before):
                  kind = "double"
              elif any(row[1:3] == (sample, day) for row in before):
                  kind = "conflict"
              else:
                  kind = "new"
              kinds[f"r{label}"] = {"kind": kind}
          answers = {"kinds": kinds}
      - id: py25.k1.q3
        kind: [specify]
        data: [mice]
        body: |
          表 mice 的一行代表“一只小鼠在某一周的一次称重”，约定每只小鼠每周称一次。

          “按 `subset` 里的列找不出重复”意思是：`mice.duplicated(subset=…)` 每一行都是 False。
        slots:
          - id: unique
            type: choice
            multiple: true
            prompt: 在**这张表**里，按下面哪些列组合找，都找不出重复？选出所有符合的。
            options:
              - { id: id_only, content: "`mouse_id`" }
              - { id: week_only, content: "`week`" }
              - { id: weight_only, content: "`weight`" }
              - { id: id_week, content: "`mouse_id` 和 `week`" }
            key: [weight_only, id_week]
          - id: key
            type: choice
            prompt: 按一行代表什么，哪一组才是这张表的业务键？
            options:
              - { id: id_only, content: "`mouse_id`" }
              - { id: week_only, content: "`week`" }
              - { id: weight_only, content: "`weight`" }
              - { id: id_week, content: "`mouse_id` 和 `week`" }
            key: id_week
        explanation: |
          在这张表里，**weight** 一列和 **mouse_id 加 week** 都找不出重复；mouse_id、week 单独看都有重复。

          但业务键是 **mouse_id 和 week**：一行代表“某只小鼠某一周”，这两列合起来才说明是哪一次称重。weight 碰巧各不相同，再称一周，两只小鼠完全可能一样重；拿它当业务键，会把同一只小鼠同一周录了两次、体重又不同的冲突当成两条不同的记录。
        verify: |
          columns = {"id_only": ["mouse_id"], "week_only": ["week"], "weight_only": ["weight"], "id_week": ["mouse_id", "week"]}
          # 一组列的取值组合个数等于行数，就说明按这组列找不出重复。
          unique = [option for option, names in columns.items()
                    if len(set(zip(*[list(mice[name]) for name in names]))) == len(mice)]
          answers = {"unique": unique}
        manual: [key]
    review:
      - id: py25.k1.r1
        kind: [predict]
        uses: [py14.k1, py06.k1]
        data: [plots]
        body: |
          表 plots 的一行代表“一个采样点在某一年的一次株高测量”，约定每个采样点每年只测一次。

          ```python
          full = plots.duplicated()
          by_key = plots.duplicated(subset=["site", "year"])
          ```
        slots:
          - id: full_true
            type: text
            format: integer
            prompt: "`full` 里有几个 True？"
            key: 0
          - id: key_true
            type: text
            format: integer
            prompt: "`by_key` 里有几个 True？"
            key: 1
          - id: row
            type: choice
            prompt: "`by_key` 标为 True 的是哪一行（原行索引）？"
            options:
              - { id: "5", content: "5" }
              - { id: "12", content: "12" }
              - { id: "3", content: "3" }
              - { id: "8", content: "8" }
              - { id: "20", content: "20" }
            key: "8"
          - id: relation
            type: choice
            prompt: 这一行和前面与它业务键相同的那一行是什么关系？
            options:
              - { id: other_year, content: 同一个采样点的不同年份，不是重复 }
              - { id: double, content: 整行相同，录了两遍 }
              - { id: conflict, content: 同一个采样点同一年，株高不同，是冲突 }
            key: conflict
        explanation: |
          `full` 有 **0** 个 True：五行里没有两行每一列都相同。`by_key` 有 **1** 个 True，是索引 **8**：它和索引 5 都是北坡 2024 年，株高一个 31、一个 35，是**冲突**。

          索引 20 和 12 的株高都是 28，但年份不同，是两条不同的记录，两种写法都不标它。
        verify: |
          r = run()
          full, by_key = r["full"], r["by_key"]
          flagged = [label for label in plots.index if by_key[label]]
          rows = list(zip(plots.index, plots["site"], plots["year"], plots["height"]))
          labels = [row[0] for row in rows]
          relation = []
          for label in flagged:
              position = labels.index(label)
              _, site, year, height = rows[position]
              same_key = [row for row in rows[:position] if row[1:3] == (site, year)]
              relation.append("double" if any(row[3] == height for row in same_key) else "conflict")
          answers = {
              "full_true": sum(bool(full[label]) for label in plots.index),
              "key_true": len(flagged),
              "row": str(flagged[0]) if len(flagged) == 1 else flagged,
              "relation": relation[0] if len(relation) == 1 else relation,
          }
