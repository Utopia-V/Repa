  - id: py25.k2
    keyPrerequisites: [py14]
    title: duplicated/drop_duplicates 的 subset、keep 规则
    card:
      name: keep 规则
      aliases: [drop_duplicates, 去重, keep=False]
      definition: duplicated 按 subset 里的列认重复，keep 决定哪一次不算重复："first" 留第一次，"last" 留最后一次，False 一次都不留；drop_duplicates 去掉标为 True 的行。
      conditions:
        - drop_duplicates 返回新表，保留原顺序和原索引；不赋值给原来的名字，df 不变。
        - “第一次”“最后一次”按表里行的先后算；行的先后就是录入先后时，keep="last" 才是“留最后录入的”。
        - keep=False 把出现不止一次的每一行都标出来，适合把冲突全部找出来交人核对。
      example:
        from: py25.k2.e0
        text: |
          ```python
          result = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
          ```
          表 M 里，S_A 第 1 天留下最后录入的索引 4，S_B 第 1 天留下索引 15，加上 S_A 第 2 天的索引 22：结果是 22、4、15 三行，df 仍是 5 行。
    lesson: |
      `duplicated` 还有一个关键字参数 `keep`，决定一组重复里**哪一次不算重复**。表 M 按业务键 `["sample_id", "day"]` 看，S_A 第 1 天出现在 31、4，S_B 第 1 天出现在 7、15：

      | 原行索引 | `keep="first"`（缺省） | `keep="last"` | `keep=False` |
      |---:|---|---|---|
      | 31 | False | True | True |
      | 7 | False | True | True |
      | 22 | False | False | False |
      | 4 | True | False | True |
      | 15 | True | False | True |

      - `"first"`：第一次出现的不算重复，后面的标 True。不写 `keep` 就是这一种。
      - `"last"`：最后一次出现的不算重复，前面的标 True。
      - `False`（不加引号）：一次都不留，凡是出现不止一次的全部标 True。想把冲突全部找出来交人核对，用它。

      “第一次”“最后一次”按表里行的先后算。只有行的先后就是录入的先后时，`keep="last"` 才等于“留最后录入的那条”。

      `drop_duplicates` 接受同样的 `subset` 和 `keep`，去掉会被标为 True 的行，留下其余的行：

      ```python
      result = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
      ```

      结果留下 22、4、15 三行。留下的行保持原表里的先后和原索引，不会重新编号；结果是一张新表，要赋给一个名字，`df` 自己不变，仍是 5 行。结果的行数等于原表行数减去被标为 True 的行数。
    example:
      id: py25.k2.e0
      kind: [predict]
      data: [M]
      body: |
        负责人说：同一个样本同一天出现不止一次时，留最后录入的那一条。阅读代码，说出 `result` 的样子。

        ```python
        result = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
        ```
      slots:
        - id: rows
          type: order
          partial: true
          prompt: "`result` 留下了哪些行？按结果里的先后顺序排出原行索引，没留下的不要放进来。"
          items:
            - { id: "31", content: "31" }
            - { id: "7", content: "7" }
            - { id: "22", content: "22" }
            - { id: "4", content: "4" }
            - { id: "15", content: "15" }
          key: ["22", "4", "15"]
        - id: nrows
          type: text
          format: integer
          prompt: "`len(result)` 是多少？"
          key: 3
        - id: cell
          type: text
          format: integer
          prompt: 结果里 S_B 第 1 天那一行的 signal 是多少？
          key: 11
        - id: df_rows
          type: text
          format: integer
          prompt: 运行之后，`len(df)` 是多少？
          key: 5
      explanation: |
        | 原行索引 | sample_id | day | signal |
        |---:|---|---:|---:|
        | 22 | S_A | 2 | 9 |
        | 4 | S_A | 1 | 8 |
        | 15 | S_B | 1 | 11 |

        S_A 第 1 天出现在 31、4，留最后的 **4**；S_B 第 1 天出现在 7、15，留最后的 **15**；S_A 第 2 天只有 22，照样留下。结果按原表的先后排成 **22、4、15**，共 **3** 行，索引不重新编号；S_B 第 1 天留下的 signal 是 **11**。

        `drop_duplicates` 返回新表，`df` 仍是 **5** 行。注意 keep="last" 只是按事先定好的规则挑了一条：10 和 11 哪个对，规则本身并不知道。
      verify: |
        r = run()
        result = r["result"]
        position = [(s, d) for s, d in zip(result["sample_id"], result["day"])].index(("S_B", 1))
        answers = {
            "rows": [str(label) for label in result.index],
            "nrows": len(result),
            "cell": list(result["signal"])[position],
            "df_rows": len(r["df"]),
        }
