        explanation: |
          `subset=["sample_id", "day"]`，`keep=False`，标出 **4** 行：31、7、4、15。

          keep=False 才会把第一次出现的那行也标出来，负责人才能看到同一组的全部候选值；"first" 或 "last" 都会让其中一行显得“没有问题”。标出来之后交给负责人的是这些行本身：去掉它们会让 S_A、S_B 第 1 天的数据整个消失，挑 signal 较大的则是替负责人做了决定。

          31 和 4 整行相同，也会被列出来，核对时一眼就能看出它们只是录了两遍。
        verify: |
          # 按需求独立算出要列出的行：(sample_id, day) 出现不止一次的每一行。
          keys = list(zip(df["sample_id"], df["day"]))
          target = [label for label, key in zip(df.index, keys) if keys.count(key) > 1]
          def flagged(subset, keep):
              marks = df.duplicated(subset=subset, keep=keep)
              return [label for label in df.index if marks[label]]
          subsets = {"all": None, "key": ["sample_id", "day"], "id": ["sample_id"]}
          keeps = {"first": "first", "last": "last", "none": False}
          fit_subset = [option for option, names in subsets.items() if flagged(names, False) == target]
          fit_keep = [option for option, keep in keeps.items() if flagged(["sample_id", "day"], keep) == target]
          answers = {
              "subset": fit_subset[0] if len(fit_subset) == 1 else fit_subset,
              "keep": fit_keep[0] if len(fit_keep) == 1 else fit_keep,
              "count": len(target),
          }
        manual: [action]
