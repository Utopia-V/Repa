      - id: py25.k2.q2
        kind: [modify]
        uses: [py04.k2, py06.k1]
        data: [M]
        body: |
          需求是：

          > 每个样本每天只留一条记录：同一个 sample_id 和 day 出现不止一次时，留最后录入的那一条（行的先后就是录入的先后）。保留原顺序和原索引，不改变 `df`。

          同事写的代码在作答框里。请改动它并提交，最终结果变量仍叫 `result`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              result = df.drop_duplicates()
            solution: |
              result = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
            accepts:
              - result = df.drop_duplicates(subset=["day", "sample_id"], keep="last")
              - result = df.drop_duplicates(["sample_id", "day"], keep="last")
            rejects:
              - code: result = df.drop_duplicates(subset=["sample_id", "day"])
                why: 没写 keep，留下的是第一次录入的那条
              - code: result = df.drop_duplicates(keep="last")
                why: 没写 subset，只去掉了整行相同的行，冲突还在
              - code: result = df.drop_duplicates(subset=["sample_id"], keep="last")
                why: 只按 sample_id 去重，同一个样本不同天的记录也被去掉了
              - code: result = df.drop_duplicates(subset=["sample_id", "day"], keep=False)
                why: keep=False 把有重复的记录全部去掉了
              - code: result = df.drop_duplicates(subset=["sample_id", "day"], keep="last", ignore_index=True)
                why: 把索引重新编号成 0、1、2
              - code: |
                  df = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
                  result = df
                why: 把 df 换成了去重后的表
            tests:
              - name: 表 M
                expect:
                  result: df.loc[[22, 4, 15]]
                  df: df
              - name: 换一张有整行重复和冲突的表
                hidden: true
                data: [M2]
                expect:
                  result: df.loc[[40, 8, 21, 5]]
                  df: df
              - name: 换一张没有重复的表
                hidden: true
                data: [M3]
                expect:
                  result: df
                  df: df
        explanation: |
          ```python
          result = df.drop_duplicates(subset=["sample_id", "day"], keep="last")
          ```

          要补两处：`subset=["sample_id", "day"]` 按业务键认同一条记录，不写的话只去掉整行相同的行，S_B 第 1 天的两个值都会留下；`keep="last"` 留最后录入的那条，不写就留第一条。本例结果是索引 22、4、15 三行。判分时还会换两张表运行你的代码，并检查 `df` 没有被改变。
      - id: py25.k2.q3
        kind: [specify]
        data: [M]
        body: |
          负责人看到表 M 后说：

          > S_B 第 1 天录了两个不同的值，我不知道哪个对。凡是同一个样本同一天出现不止一次的记录，全部列出来给我核对，我来决定留哪条。

