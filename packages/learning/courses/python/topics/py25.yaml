          `b` 用 keep=False：出现不止一次的业务键，每一行都去掉，12、40、3、5 全没了，只剩 **8、21**。S_C 和 S_D 的第 1 天在 `b` 里一条记录都不剩，所以 keep=False 适合用 `duplicated` 把冲突找出来看，直接拿去 `drop_duplicates` 会把这两天的数据整个丢掉。
