      - id: py25.k2.x2
        kind: [modify]
        uses: [py04.k2, py06.k1]
        data: [plates]
        body: |
          需求是：

          > 标出 plate 和 well 相同、出现不止一次的**每一行**（包括第一次出现的那行），结果是一列 True/False，与 plates 的行一一对应，索引不变。不改变 `plates`。

          作答框里的代码不符合需求。请改动它并提交，最终结果变量仍叫 `flags`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              flags = plates.duplicated()
            solution: |
              flags = plates.duplicated(subset=["plate", "well"], keep=False)
            accepts:
              - flags = plates.duplicated(["plate", "well"], keep=False)
              - flags = plates.duplicated(subset=["well", "plate"], keep=False)
            rejects:
              - code: flags = plates.duplicated(subset=["plate", "well"])
                why: 缺省 keep="first"，第一次出现的那行没有标出来
              - code: flags = plates.duplicated(keep=False)
                why: 没写 subset，只标出整行相同的行，漏了冲突
              - code: flags = plates.duplicated(subset=["plate"], keep=False)
                why: 只按 plate 比较，同一块板的不同孔也被标出来
              - code: flags = plates.duplicated(subset=["plate", "well"], keep="last")
                why: keep="last" 标的是前面的，最后一次出现的没有标出来
              - code: flags = plates.drop_duplicates(subset=["plate", "well"], keep=False)
                why: 得到的是去掉这些行之后的表，不是标记
            tests:
              - name: 表 plates
                expect:
                  flags: pd.Series([True, False, True, True, True, False], index=[3, 8, 1, 6, 10, 4])
                  plates: plates
              - name: 换一张只有冲突、没有整行重复的表
                hidden: true
                data: [plates2]
                expect:
                  flags: pd.Series([True, True, False, False], index=[7, 2, 5, 9])
                  plates: plates
        explanation: |
          ```python
          flags = plates.duplicated(subset=["plate", "well"], keep=False)
          ```

          `subset=["plate", "well"]` 按业务键比较，才能认出 P2 的 A1 这种读数不同的冲突；`keep=False` 让第一次出现的那行也标 True。本例标出 3、1、6、10 四行。判分时还会换一张只有冲突、没有整行重复的表运行你的代码。

