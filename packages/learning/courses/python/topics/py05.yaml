          ```
        slots:
          - id: value
            type: text
            match: output
            prompt: 这段代码运行后，`clean` 是什么？写成带引号的形式，引号里的字符照实写。
            key: "'_Drug_A_'"
          - id: fix
            type: choice
            prompt: 把第 2 行换成哪一行，对 `" Drug A "` 和 `"  High Dose "` 这样的组名都能得到想要的结果？
            options:
              - id: no_space
                content: |
                  ```python
                  clean = raw.replace(" ", "").strip()
                  ```
              - id: strip_only
                content: |
                  ```python
                  clean = raw.strip()
                  ```
              - id: swapped
                content: |
                  ```python
