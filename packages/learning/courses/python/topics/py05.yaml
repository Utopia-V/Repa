        explanation: |
          只有 `label = label.lower()` 和 `label = label.upper()` 两行：等号左边是 `label`，它才改为指向新文字。单独一行的 `label.lower()` 把结果丢掉了；`clean = label.upper()` 把结果交给了 `clean`；`print(...)` 只显示一次。这三行之后 `label` 都还是 `'Ctrl 01'`。
        verify: |
