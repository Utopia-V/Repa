        explanation: |
          显示 **ctrl-01**。第 2 行的 `code.upper()` 得到一段新文字 `'CTRL-01'`，但这一行没有把它赋给任何名字，结果丢掉了；`code` 仍然指向原来的 `'ctrl-01'`。
        verify: |
          answers = {"output": run().lines()[0]}
      - id: py05.k1.q2
        kind: [predict]
        uses: [py04.k3]
        body: |
          哪一段程序运行完以后，`label` 本身指向 `'drug a'`？
        slots:
          - id: program
            type: choice
            options:
              - id: alone
                content: |
                  ```python
                  label = "Drug A"
                  label.lower()
                  ```
                feedback: "`label.lower()` 单独一行，算出的结果没有留下。"
              - id: other
                content: |
                  ```python
                  label = "Drug A"
                  small = label.lower()
                  ```
                feedback: 小写的文字存进了 `small`，`label` 没有变。
              - id: assigned
                content: |
                  ```python
                  label = "Drug A"
                  label = label.lower()
                  ```
              - id: shown
                content: |
                  ```python
                  label = "Drug A"
                  print(label.lower())
                  ```
                feedback: print 只把结果显示出来，`label` 没有变。
            key: assigned
        explanation: |
          写成 `label = label.lower()` 的那一段：先算右边得到 `'drug a'`，再让 `label` 改为指向它。另外三段里，`'drug a'` 要么没有留下，要么存进了别的名字，要么只是显示了一次，`label` 都还是 `'Drug A'`。
        verify: |
          fits = [option for option, code in OPTIONS["program"].items() if run(code).vars.get("label") == "drug a"]
          answers = {"program": fits[0] if len(fits) == 1 else fits}
      - id: py05.k1.q3
        kind: [modify]
        uses: [py04.k3]
        body: |
          宿主已经给 `label` 赋了一个样本标签，例如 `'  S_07 '`。后面的代码都直接用 `label`，所以需要 `label` **本身**变成去掉两端空格的文字。作答框里的代码没有做到，请改好它。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              label.strip()
            solution: |
              label = label.strip()
            rejects:
              - code: clean = label.strip()
                why: 结果存进了新名字，label 本身没有变
              - code: print(label.strip())
                why: 只显示了一次结果，label 没有变
              - code: label = "S_07"
                why: 照着例子写死了一个标签
              - code: label = label.replace(" ", "")
                why: 把中间的空格也删掉了
            tests:
              - name: 两端有空格的标签
                setup: label = "  S_07 "
                expect:
                  label: '"S_07"'
              - name: 另一个标签
                hidden: true
                setup: label = " ctrl-02  "
                expect:
                  label: '"ctrl-02"'
              - name: 中间也有空格的标签
                hidden: true
                setup: label = " Drug A "
                expect:
                  label: '"Drug A"'
              - name: 本来就没有多余空格
                hidden: true
                setup: label = "S_10"
                expect:
                  label: '"S_10"'
        explanation: |
          ```python
          label = label.strip()
          ```

          `label.strip()` 单独一行时，算出的新文字没有留下。写成赋值，先算右边，再让 `label` 改为指向新文字。存进 `clean` 这样的新名字，`label` 本身仍然不变，后面用 `label` 的代码拿到的还是带空格的标签。
    review:
      - id: py05.k1.r1
        kind: [trace]
        uses: [py04.k3, py01.k2]
        body: |
          按运行顺序填写第 2–4 行执行后 `site` 和 `title` 的值，写成带引号的形式，例如 `'North Slope'`。第 1 行执行后，`site` 是 `'North Slope'`。

          ```python startLine=1
          site = "North Slope"
          title = site.upper()
          site.lower()
          site = title
          ```
        slots:
          - id: trace
            type: table
            columns:
              - id: line
                header: 执行到
              - id: site
                header: site
                input: { type: text, match: output }
              - id: title
                header: title
                input: { type: text, match: output }
            rows:
              - id: l2
                cells:
                  line: 第 2 行
                  site: "'North Slope'"
                  title: "'NORTH SLOPE'"
              - id: l3
                cells:
                  line: 第 3 行
                  site: "'North Slope'"
                  title: "'NORTH SLOPE'"
              - id: l4
                cells:
                  line: 第 4 行
                  site: "'NORTH SLOPE'"
                  title: "'NORTH SLOPE'"
        explanation: |
          | 执行到 | site | title |
          |---|---|---|
          | 第 2 行 | `'North Slope'` | `'NORTH SLOPE'` |
          | 第 3 行 | `'North Slope'` | `'NORTH SLOPE'` |
          | 第 4 行 | `'NORTH SLOPE'` | `'NORTH SLOPE'` |

          第 2 行的大写结果交给了 `title`，`site` 不变。第 3 行算出的 `'north slope'` 没有赋给任何名字，什么也没改。第 4 行让 `site` 指向 `title` 的值，`site` 这才变成大写。
        verify: |
          names = ["site", "title"]
          states = trace(names=names)
          answers = {"trace": {f"l{i}": {name: states[i - 1][name] for name in names} for i in (2, 3, 4)}}
      - id: py05.k1.r2
        kind: [debug, predict]
        uses: [py04.k3, py03.k1]
        body: |
          同事想让 `sample_id` 去掉两端的空格，用方括号把它包起来打印，应当显示 `[S-12]`。

          ```python startLine=1
          sample_id = " S-12 "
          sample_id.strip()
          print("[" + sample_id + "]")
          ```
        slots:
          - id: output
            type: text
            match: text
            prompt: 这段程序实际显示什么？方括号里的空格照实写。
            key: "[ S-12 ]"
          - id: fix
            type: choice
            prompt: 把第 2 行换成哪一行，就会显示 `[S-12]`？
            options:
              - id: shown
                content: |
                  ```python
                  print(sample_id.strip())
                  ```
              - id: assigned
                content: |
                  ```python
                  sample_id = sample_id.strip()
                  ```
              - id: other
                content: |
                  ```python
                  clean = sample_id.strip()
                  ```
            key: assigned
        explanation: |
          实际显示 **[ S-12 ]**，两端的空格还在：第 2 行算出的新文字没有赋给任何名字，`sample_id` 没有变。

          改成 `sample_id = sample_id.strip()` 才会显示 `[S-12]`。只 print 一次，会多显示一行 `S-12`，第 3 行照样带空格；存进 `clean`，第 3 行用的 `sample_id` 也还是旧的。
        verify: |
          lines = CODE.splitlines()
          def shows(line):
              result = run("\n".join([lines[0], line, lines[2]]))
              return result.error is None and result.out.strip() == "[S-12]"
          fits = [option for option, code in OPTIONS["fix"].items() if shows(code)]
