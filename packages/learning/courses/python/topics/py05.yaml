          label = raw.strip().lower().replace(" ", "-")
          ```

          原来的代码先做 `replace`，两端的空格先变成了连字符，得到 `'-high-dose-'`，后面的 `strip()` 已经去不掉。把 `strip()` 挪到 `replace` 前面就对了；`lower()` 放在哪一步都可以。判分时还会换两个组名运行。
