          换成 `clean = raw.strip().replace(" ", "_")`，先去两端再换中间，得到 `'Drug_A'`。`replace(" ", "")` 把空格删掉，得到 `'DrugA'`；只用 `strip()`，中间的空格没换；`replace("_", " ")` 把两个参数写反了，找的是下划线，结果仍是 `'Drug A'`。
