      - id: py05.k3.q2
        kind: [modify]
        body: |
          组名要统一成：去掉两端的空格、字母全大写、中间的空格换成下划线，例如 `" drug a "` 变成 `'DRUG_A'`。下面四行分步做这件事，顺序被打乱了，把它们排成能得到正确结果的程序，每一行都要用上。宿主已经给 `raw` 赋了值。
        slots:
          - id: lines
            type: order
            items:
              - { id: upper, code: label = label.upper() }
              - { id: replace, code: 'label = label.replace(" ", "_")' }
              - { id: start, code: label = raw }
              - { id: strip, code: label = label.strip() }
            key: [start, strip, upper, replace]
            alternatives:
              - [start, upper, strip, replace]
              - [start, strip, replace, upper]
            tests:
              - name: 两端有空格的组名
                setup: raw = " drug a "
                expect:
                  label: '"DRUG_A"'
              - name: 另一个组名
                hidden: true
                setup: raw = "  ctrl 01 "
                expect:
                  label: '"CTRL_01"'
        explanation: |
          一种正确的顺序：

          ```python
          label = raw
          label = label.strip()
          label = label.upper()
          label = label.replace(" ", "_")
          ```

          `label = raw` 必须在最前面，后面几行才有 `label` 可用。关键是 `strip` 要排在 `replace` 前面：先换空格，两端的空格就成了下划线，再也去不掉。改大写放在哪一步都可以，它不影响空格。判分时会把你排好的程序换几个组名运行。
      - id: py05.k3.q3
        kind: [modify]
        body: |
          需求：把记录里的剂量组名 `raw` 统一成小写、去掉两端的空格、中间的空格换成连字符，存进 `label`。例如 `" High Dose "` 要得到 `'high-dose'`。

