id: py05
title: 清理一段文字
status: complete
minutes: 20
summary: 读懂 strip、lower、replace 这类点号方法：它们得到新文字、不改原来的名字；调用链从左往右，每一步接着上一步的结果。
prerequisites:
  - topic: py04
    key: true
    weight: 0.67
    covers: [py04.k1, py04.k3]
  - topic: py03
    key: true
    weight: 0.33
    covers: [py03.k1]
sources:
  - source: think-python
    where: 第 8 章
    url: https://allendowney.github.io/ThinkPython/chap08.html
    use: reference
  - source: pydata-book
    where: 第 7 章 §7.4（字符串）
    url: https://wesmckinney.com/book/data-cleaning
    use: reference
  - source: python-docs
    where: 教程第 3 章 §3.1.2
    url: https://docs.python.org/3.12/tutorial/introduction.html
    use: reference
  - source: python-docs
    where: 标准库：内置类型，字符串方法（strip、lower、upper、replace）
    url: https://docs.python.org/3.12/library/stdtypes.html#string-methods
    use: reference
notes: |
  范围：用到 py03 的文字（str）和 + 拼接、py04 的调用与返回结果（含 len）。点号方法调用在本节第一次出现，只讲 strip()、lower()、upper()、replace(旧, 新) 四个方法，strip 不带参数。不讲索引与切片（py06）、split 和 count（py47）、pandas 的 str 方法（py24）、f-string。
  判分：match: output 和 match: text 都会去掉首尾空白，所以凡是要比较两端空格的作答位，都让学生写带引号的 Python 文字（match: output 按字面量比较，空格个数也比较）；print 显示的结果用 print("[" + label + "]") 把两端包起来，按逐字比较。
  建议题型与判分：预测输出（P）、追踪变量（P）、小改代码（T）。k3 的 Parsons 题按测试判，接受 strip 在 replace 之前的几种顺序。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  讲解、例题和题目为本课自拟。
intro: |
  实验记录里的样本标签和组名常常写得不统一：两端多了空格，大小写不一致，连字符和空格混用。这一节读懂清理文字的三个常用工具 `strip`、`lower`、`replace`：每一步得到什么，原来的名字有没有变。

  有些题要你写出一段文字的值。这时照 Python 的写法加上引号，例如 `'drug_a'`；引号之间的空格也是文字的一部分，要照实写。用 `print` 显示出来的结果不带引号，照屏幕上的样子写。
wrapup: |
  清理文字时记住三件事：方法得到的是一段新文字，要赋给名字才留得住；`strip` 只管两端，`lower` 只管字母，`replace` 换掉每一处并且区分大小写；调用链从左往右，每一步接着上一步的结果。

  读 AI 写的清理代码时，可以把一长串调用拆开，逐步写下得到的文字，再和你想要的结果对一对。
kps:
  - id: py05.k1
    title: 字符串不可原位改写
    card:
      name: 方法得到新文字
      aliases: [字符串不可变, 方法调用]
      definition: "`label.strip()` 这类方法不会改动原来的文字，而是另外得到一段新文字；不把结果赋给名字，它就丢掉了。"
      conditions:
        - "`label.strip()` 单独一行时，`label` 不变，算出的结果也没有留下。"
        - "要保留结果，写 `label = label.strip()`，或存进新名字，如 `clean = label.strip()`。"
      example:
        from: py05.k1.e0
        text: |
          ```python
          label = " Drug A "
          clean = label.strip()
          label.upper()
          label = label.strip()
          ```
          第 2 行让 clean 指向 'Drug A'，label 不变；第 3 行算出的大写文字没有赋给任何名字，丢掉了；第 4 行之后 label 才变成 'Drug A'。
    lesson: |
      实验记录里的标签常带多余的空格，比如 `" Drug A "`。Python 的[文字（str）](repa:concept/py03.k1)带着一组清理用的工具，写在文字后面，用点号接上：

      ```python
      clean = label.strip()
      ```

      `label.strip()` 叫**方法调用**：点号前是要处理的文字，点号后是方法名和括号。它和[函数调用](repa:concept/py04.k1)一样会算出一个结果：`strip()` 得到去掉两端空格的文字，`lower()` 得到字母全变小写的文字，`upper()` 得到字母全变大写的文字。

      要紧的是：这些方法**不改动原来的文字**，而是另外得到一段新文字，原来的名字仍然指向旧的那一段。

      | 执行到 | label | clean |
      |---|---|---|
      | `label = "  Ctrl "` | `'  Ctrl '` | 尚未定义 |
      | `label.lower()` | `'  Ctrl '` | 尚未定义 |
      | `clean = label.strip()` | `'  Ctrl '` | `'Ctrl'` |
      | `label = label.strip()` | `'Ctrl'` | `'Ctrl'` |

      第 2 行算出了 `'  ctrl '`，却没有交给任何名字，结果就丢了，和[返回结果没有接住](repa:concept/py04.k3)一样。要保留结果，就把它赋给名字：存进新名字 `clean`，或者写 `label = label.strip()`，先算右边得到新文字，再让 `label` 改为指向它。

      表里文字的值都带着引号：引号之间的内容就是这段文字，两端的空格也算在内。
    example:
      id: py05.k1.e0
      kind: [trace]
      uses: [py04.k3]
      body: |
        一个样本的组名录成了 `" Drug A "`，两端各多了一个空格。按运行顺序填写每行执行后 `label` 和 `clean` 的值，写成带引号的形式，例如 `'Drug A'`，引号里的空格照实写。

        ```python startLine=1
        label = " Drug A "
        clean = label.strip()
        label.upper()
        label = label.strip()
        ```
      slots:
        - id: trace
          type: table
          label: 状态表
          columns:
            - id: line
              header: 执行到
            - id: label
              header: label
              input: { type: text, match: output }
            - id: clean
              header: clean
              input: { type: text, match: output }
          rows:
            - id: l1
              cells:
                line: 第 1 行
                label: "' Drug A '"
                clean: { value: 尚未定义 }
            - id: l2
              cells:
                line: 第 2 行
                label: "' Drug A '"
                clean: "'Drug A'"
            - id: l3
              cells:
                line: 第 3 行
                label: "' Drug A '"
                clean: "'Drug A'"
            - id: l4
              cells:
                line: 第 4 行
                label: "'Drug A'"
                clean: "'Drug A'"
        - id: kept
          type: choice
          prompt: 第 3 行算出的 `' DRUG A '` 存到了哪里？
          options:
            - { id: label, content: 存进了 `label`，label 变成大写 }
            - { id: nowhere, content: 没有赋给任何名字，丢掉了 }
            - { id: clean, content: 存进了 `clean` }
          key: nowhere
      explanation: |
        | 执行到 | label | clean |
        |---|---|---|
        | 第 1 行 | `' Drug A '` | 尚未定义 |
        | 第 2 行 | `' Drug A '` | `'Drug A'` |
        | 第 3 行 | `' Drug A '` | `'Drug A'` |
        | 第 4 行 | `'Drug A'` | `'Drug A'` |

        第 2 行的 `strip()` 得到一段新文字 `'Drug A'`，交给了 `clean`，`label` 没有变。第 3 行算出了 `' DRUG A '`，但这一行没有等号，结果**没有赋给任何名字，丢掉了**。直到第 4 行写成 `label = label.strip()`，`label` 才改为指向去掉空格的新文字。
      verify: |
        names = ["label", "clean"]
        states = trace(names=names)
        # 第 3 行前后，两个名字都没变，说明第 3 行算出的结果没有存进任何名字。
        changed = [name for name in names if states[2].get(name) != states[1].get(name)]
        answers = {
            "trace": {f"l{i}": {name: state[name] for name in names if name in state} for i, state in enumerate(states, 1)},
            "kept": changed[0] if len(changed) == 1 else "nowhere" if not changed else changed,
        }
    practice:
      - id: py05.k1.q1
        kind: [predict]
        uses: [py04.k3]
        body: |
          ```python
          code = "ctrl-01"
          code.upper()
          print(code)
          ```
        slots:
