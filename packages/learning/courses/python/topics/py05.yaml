          print("[" + b + "]")
          ```
        slots:
          - id: line1
            type: text
            match: text
            prompt: 第一行显示
            key: "[Ctrl_01]"
          - id: line2
            type: text
            match: text
            prompt: 第二行显示
            key: "[_Ctrl_01_]"
            feedback:
              - when: "[Ctrl_01]"
