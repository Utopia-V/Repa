            accepts:
              - label = raw.lower().strip().replace(" ", "-")
              - label = raw.strip().replace(" ", "-").lower()
              - |
                trimmed = raw.strip()
                lowered = trimmed.lower()
                label = lowered.replace(" ", "-")
            rejects:
              - code: label = raw.strip().lower()
                why: 没有把中间的空格换成连字符
              - code: label = raw.lower().replace(" ", "-")
                why: 没有去掉两端的空格，两端变成了连字符
              - code: raw.strip().lower().replace(" ", "-")
