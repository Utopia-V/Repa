  - id: py05.k3
    title: 点号方法调用与调用链从左到右
    card:
      name: 调用链
      aliases: [方法链, 点号调用]
      definition: "`raw.strip().lower()` 从左往右算：先对 raw 调用 strip()，再对得到的新文字调用 lower()；每个点号前面都是上一步的结果。"
      conditions:
        - "顺序会改变结果：先 `replace(\" \", \"_\")` 再 `strip()`，两端的空格已成下划线，strip 去不掉。"
        - 调用链也不改原来的名字，最后的结果要赋给名字才留得住。
      example:
        from: py05.k3.e0
        text: |
          ```python
          raw = " Ctrl 01 "
          label = raw.strip().lower().replace(" ", "-")
          ```
          依次得到 'Ctrl 01'、'ctrl 01'、'ctrl-01'；raw 仍是 ' Ctrl 01 '。
    lesson: |
      点号后面还可以接着点下去：

      ```python
      raw = " Drug A "
      label = raw.strip().lower().replace(" ", "_")
      ```

      这一串叫**调用链**，从左往右读：先对 `raw` 调用 `strip()`，得到一段新文字；再对这段新文字调用 `lower()`；再对结果调用 `replace`。每个点号前面，都是上一步得到的文字。

      | 读到 | 得到 |
      |---|---|
      | `raw` | `' Drug A '` |
      | `.strip()` | `'Drug A'` |
      | `.lower()` | `'drug a'` |
      | `.replace(" ", "_")` | `'drug_a'` |

      它和分成三行写是一回事：

      ```python
      step1 = raw.strip()
      step2 = step1.lower()
      label = step2.replace(" ", "_")
      ```

      顺序会改变结果。把 `replace` 放到 `strip` 前面，`raw.replace(" ", "_").strip()` 先把两端的空格也换成了下划线，得到 `'_Drug_A_'`，之后的 `strip()` 已经没有空格可去。

      和单个方法一样，调用链也不改动 `raw`，最后的结果要赋给名字才留得住。读 AI 写的一长串调用时，照上面的表一步步写下得到的文字，就不容易看漏。
    example:
      id: py05.k3.e0
      kind: [trace]
      body: |
        按调用链从左往右的顺序，写出每一步得到的文字，再写出运行完以后 `raw` 的值。都写成带引号的形式，引号里的空格照实写。

        ```python
        raw = " Ctrl 01 "
        label = raw.strip().lower().replace(" ", "-")
        ```
      slots:
        - id: steps
          type: table
          columns:
            - id: step
              header: 读到
            - id: value
              header: 得到
              input: { type: text, match: output }
          rows:
            - id: s1
              cells:
                step: raw.strip()
                value: "'Ctrl 01'"
            - id: s2
              cells:
                step: 再 .lower()
                value: "'ctrl 01'"
            - id: s3
              cells:
                step: '再 .replace(" ", "-")'
                value: "'ctrl-01'"
        - id: raw
          type: text
          match: output
          prompt: 运行完以后，`raw` 是什么？
          key: "' Ctrl 01 '"
      explanation: |
        | 读到 | 得到 |
        |---|---|
        | `raw.strip()` | `'Ctrl 01'` |
        | 再 `.lower()` | `'ctrl 01'` |
        | 再 `.replace(" ", "-")` | `'ctrl-01'` |

        每一步都作用在上一步的结果上：`lower()` 收到的是已经去掉两端空格的 `'Ctrl 01'`，`replace` 收到的是 `'ctrl 01'`，只剩中间一个空格可换。最后的 `'ctrl-01'` 交给了 `label`；`raw` 没有被赋值，仍是 `' Ctrl 01 '`。
      verify: |
        chains = {"s1": "raw.strip()", "s2": "raw.strip().lower()", "s3": 'raw.strip().lower().replace(" ", "-")'}
        answers = {
            "steps": {row: {"value": run(CODE + "\nresult = " + chain)["result"]} for row, chain in chains.items()},
            "raw": run()["raw"],
        }
    practice:
      - id: py05.k3.q1
        kind: [predict]
        uses: [py03.k1]
        body: |
          ```python
          raw = " Ctrl 01 "
          a = raw.strip().replace(" ", "_")
          b = raw.replace(" ", "_").strip()
