        explanation: |
          先显示 **[Ctrl_01]**，再显示 **[_Ctrl_01_]**。`a` 先去掉两端空格，再换中间的空格；`b` 先把三个空格都换成下划线，得到 `'_Ctrl_01_'`，这时两端已经没有空格，`strip()` 什么也没去掉。
        verify: |
