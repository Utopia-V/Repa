  - id: py05.k2
    title: strip/lower/replace 的结果
    card:
      name: strip/lower/replace
      aliases: [去空格, 改小写, 替换]
      definition: "`strip()` 去掉两端的空白，`lower()` 把字母改成小写，`replace(旧, 新)` 把每一处“旧”换成“新”；三者都得到新文字。"
      conditions:
        - "`strip()` 不动中间的空格；`lower()` 只改字母，数字和符号不变。"
        - "`replace` 区分大小写，换掉所有出现的地方；找不到“旧”时原样返回，不报错。"
      example:
        from: py05.k2.e0
        text: |
          raw 为 `' Drug A-1 '`：`raw.strip()` 得 `'Drug A-1'`，`raw.lower()` 得 `' drug a-1 '`，`raw.replace("-", "_")` 得 `' Drug A_1 '`；`raw.replace("a", "o")` 找不到小写的 a，原样得到 `' Drug A-1 '`。
    lesson: |
      三个最常用的清理方法，各管一件事：

      | 写法 | 做什么 | `"  Ctrl B-2 "` 得到 |
      |---|---|---|
      | `.strip()` | 去掉**两端**的空格（换行等空白也算） | `'Ctrl B-2'` |
      | `.lower()` | 把**字母**改成小写，数字和符号不变；`.upper()` 改成大写 | `'  ctrl b-2 '` |
      | `.replace("-", "_")` | 把**每一处** `-` 换成 `_` | `'  Ctrl B_2 '` |

      容易看错的几处：

      - `strip()` 只管两端，中间的空格不动：`" control group ".strip()` 得到 `'control group'`。要去掉所有空格，用 `replace(" ", "")`，把空格换成空文字。
      - `replace(旧, 新)` 括号里先写要找的，再写换成什么。它区分大小写：`"Ctrl".replace("ctrl", "c")` 找不到小写的 ctrl，原样得到 `'Ctrl'`，也不报错。
      - 三个方法都[得到新文字](repa:concept/py05.k1)，原来的名字不变。

      用 print 显示文字时，两端的空格看不出来。题目里常写 `print("[" + label + "]")`，用方括号把文字包起来：显示 `[ Ctrl ]`，就说明两端各有一个空格。
    example:
      id: py05.k2.e0
      kind: [predict]
      body: |
        先运行下面一行。表里每个写法都单独作用在这个 `raw` 上，填出各自得到的文字，写成带引号的形式，例如 `'Drug'`，引号里的空格照实写。

        ```python
        raw = " Drug A-1 "
        ```
      slots:
        - id: values
          type: table
          columns:
            - id: expr
              header: 写法
            - id: value
              header: 得到的文字
              input: { type: text, match: output }
          rows:
            - id: strip
              cells:
                expr: raw.strip()
                value: "'Drug A-1'"
            - id: lower
              cells:
                expr: raw.lower()
                value: "' drug a-1 '"
            - id: dash
              cells:
                expr: 'raw.replace("-", "_")'
                value: "' Drug A_1 '"
            - id: case
              cells:
                expr: 'raw.replace("a", "o")'
                value: "' Drug A-1 '"
      explanation: |
