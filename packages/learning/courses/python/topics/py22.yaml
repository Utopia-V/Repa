id: py22
title: 明确改的是原表还是新结果
status: complete
minutes: 20
summary: 用一次 df.loc[行, 列] = 值 改原表里选中的格；分清别名、派生结果和 copy：在 pandas 3 里，改派生结果不会改到原表。
