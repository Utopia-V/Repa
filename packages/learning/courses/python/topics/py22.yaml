kps:
  - id: py22.k1
    title: 单次 loc 赋值表达修改目标
    card:
      name: loc 赋值
      aliases: [修改原表, 链式赋值]
      definition: df.loc[掩码, 列名] = 值 把原表里选中行、选中列的格改成新值，其余的格不动；行和列要写在同一对方括号里。
      conditions:
        - 链式赋值 df[掩码]["列"] = 值 先得到一张新表再改它，原表不变；pandas 3 只给一条警告，不报错。
        - 列名还不存在时，选中的行得到新值，其余行是 NaN。
      example:
        from: py22.k1.e0
        text: |
          ```python
          df.loc[df["signal"] < 0, "signal"] = 0
          ```
          表 T 的 signal 从 8、-1、13、-3 变成 8、0、13、0，df 自己被改了。
    lesson: |
      要改原表里的格，用一次 `.loc` 赋值，把**行**和**列**都写在同一对方括号里：

      ```python
      df.loc[df["signal"] < 0, "signal"] = 0
      ```

      读作：在 df 里，signal 小于 0 的那些行、signal 这一列，改成 0。逗号前选行，和[用掩码筛选](repa:concept/py17.k2)时一样；逗号后是要改的列；等号右边是新值。只有选中的格被改，其他格不动，被改的是 df 自己。

      | 原行索引 | signal（改之前） | signal（改之后） |
      |---:|---:|---:|
      | 31 | 8 | 8 |
      | 7 | -1 | 0 |
      | 22 | 13 | 13 |
      | 4 | -3 | 0 |

      逗号后写一个还没有的列名，就是给选中的行写一列新值：`df.loc[df["signal"] < 0, "flag"] = "below"` 让索引 7、4 的 flag 是 below，其余行的 flag 是 NaN。

      常见的错误写法是分两步选：

      ```python
      df[df["signal"] < 0]["signal"] = 0
      ```

      `df[df["signal"] < 0]` 先得到一张**新表**（筛选结果），后面的 `["signal"] = 0` 改的是这张新表。新表用完就没了，df 一格也没变。pandas 3 会给出一条 ChainedAssignmentError 警告，但程序照常往下运行，很容易漏看。`df["signal"][df["signal"] < 0] = 0` 也是两步，同样改不到 df。

      规则只有一条：要改原表，写一次 `df.loc[行, 列] = 值`。
    example:
      id: py22.k1.e0
      kind: [trace]
      data: [T]
      body: |
        阅读代码，按原行索引填写运行后 df 的 signal。

        ```python
        df.loc[df["signal"] < 0, "signal"] = 0
        ```
      slots:
        - id: signal
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: before, header: signal（运行前） }
            - { id: after, header: signal（运行后）, input: integer }
          rows:
            - { id: r31, cells: { index: "31", before: "8", after: 8 } }
            - { id: r7, cells: { index: "7", before: "-1", after: 0 } }
            - { id: r22, cells: { index: "22", before: "13", after: 13 } }
            - { id: r4, cells: { index: "4", before: "-3", after: 0 } }
        - id: changed
          type: choice
          prompt: 运行后，df 自己变了吗？
          options:
            - { id: "yes", content: 变了，选中的两格改成了 0 }
            - { id: "no", content: 没变，改的是一张新表 }
          key: "yes"
      explanation: |
        运行后 signal 依次为 **8、0、13、0**。逗号前的掩码选中 signal 小于 0 的索引 7、4，逗号后选 signal 列，这两格改成 0；其余的格不动。这是一次 `.loc` 赋值，被改的是 **df 自己**。
      verify: |
        after = run()["df"]
        answers = {
            "signal": {f"r{label}": {"after": value} for label, value in after["signal"].items()},
            "changed": "no" if after.equals(df) else "yes",
        }
    practice:
      - id: py22.k1.q1
        kind: [debug]
        uses: [py17.k1, py17.k2]
        data: [T]
        body: |
          同事想把负的读数改成 0，写了下面这行。运行时只出现一条警告，没有报错。

          ```python
          df[df["signal"] < 0]["signal"] = 0
          ```
        slots:
          - id: after
            type: table
            prompt: 运行后，df 的 signal 是多少？
            columns:
              - { id: index, header: 原行索引 }
              - { id: signal, header: signal（运行后）, input: integer }
            rows:
              - { id: r31, cells: { index: "31", signal: 8 } }
              - { id: r7, cells: { index: "7", signal: -1 } }
              - { id: r22, cells: { index: "22", signal: 13 } }
              - { id: r4, cells: { index: "4", signal: -3 } }
          - id: fix
            type: choice
            prompt: 应改成哪一行？
            options:
              - id: loc
                content: |
                  ```python
                  df.loc[df["signal"] < 0, "signal"] = 0
                  ```
              - id: col_first
                content: |
                  ```python
                  df["signal"][df["signal"] < 0] = 0
                  ```
                feedback: 这还是分两步：先取出 signal 这一列，再改取出的那一列，df 不变。
              - id: rows_only
                content: |
                  ```python
                  df.loc[df["signal"] < 0] = 0
                  ```
                feedback: 逗号后没写列名，会把选中行的每一列都改成 0；文字列放不下数，这里会报 TypeError。
            key: loc
        explanation: |
          df 一格也没变，仍是 **8、-1、13、-3**。`df[df["signal"] < 0]` 先得到一张新表，`["signal"] = 0` 改的是这张新表，用完就没了。

          改成一次 **`df.loc[df["signal"] < 0, "signal"] = 0`**，行和列写在同一对方括号里，才改到 df。先取出 signal 列再改，同样是两步；不写列名会去改整行。
        verify: |
          import warnings
          with warnings.catch_warnings():
              warnings.simplefilter("ignore")
              after = run()["df"]
              wanted = [0 if value < 0 else value for value in df["signal"]]
              fits = []
              for option, line in OPTIONS["fix"].items():
                  attempt = run(line)
                  if attempt.error is None and list(attempt["df"]["signal"]) == wanted and attempt["df"]["sample_id"].equals(df["sample_id"]):
                      fits.append(option)
          answers = {"after": {f"r{label}": {"signal": value} for label, value in after["signal"].items()}, "fix": fits[0] if len(fits) == 1 else fits}
      - id: py22.k1.q2
        kind: [trace]
        uses: [py17.k1]
        data: [T]
        body: |
          阅读代码，按原行索引填写运行后新列 `flag` 的值。没有值的填 `NaN`。

          ```python
          df.loc[df["signal"] < 0, "flag"] = "below"
          ```
        slots:
          - id: flag
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: signal, header: signal }
              - { id: flag, header: flag, input: { type: text, quick: [NaN] } }
            rows:
              - { id: r31, cells: { index: "31", signal: "8", flag: NaN } }
              - { id: r7, cells: { index: "7", signal: "-1", flag: below } }
              - { id: r22, cells: { index: "22", signal: "13", flag: NaN } }
              - { id: r4, cells: { index: "4", signal: "-3", flag: below } }
          - id: ncols
            type: text
            format: integer
            prompt: 运行后 df 有几列？
            key: 4
        explanation: |
          flag 依次为 **NaN、below、NaN、below**。flag 原来不存在，这一行给 df 加了一列：选中的行写进 below，没选中的行没有值，是 NaN。df 原有 3 列，现在 **4** 列。
        verify: |
          after = run()["df"]
          answers = {
              "flag": {f"r{label}": {"flag": "NaN" if pd.isna(value) else value} for label, value in after["flag"].items()},
              "ncols": after.shape[1],
          }
      - id: py22.k1.q3
        kind: [modify]
        uses: [py17.k1, py17.k2]
        data: [T]
        body: |
          需求是：

          > 直接修改 df：signal 超过 `limit` 的读数一律改成 `limit`，其他格保持不变。

          同事写的代码在作答框里，运行后 df 没有任何变化。请改动它并提交。宿主另外提供了 `limit`，本例为 10。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              df[df["signal"] > limit]["signal"] = limit
            solution: |
              df.loc[df["signal"] > limit, "signal"] = limit
            accepts:
              - df.loc[df["signal"] > limit, ["signal"]] = limit
              - df["signal"] = df["signal"].clip(upper=limit)
            rejects:
              - code: df["signal"][df["signal"] > limit] = limit
                why: 仍是分两步，改的是取出的那一列
              - code: df.loc[df["signal"] > limit] = limit
                why: 没写列名，去改整行
              - code: df = df.loc[df["signal"] <= limit]
                why: 把超过的行删掉了，而不是改成 limit
              - code: df["signal"] = limit
                why: 把每一行都改成了 limit
              - code: df.loc[df["signal"] > 10, "signal"] = 10
                why: 把 limit 写死成 10
            tests:
              - name: 表 T，limit 为 10
                setup: limit = 10
                expect:
                  df: 'pd.DataFrame({"sample_id": ["S_A", "S_B", "S_C", "S_D"], "signal": [8, -1, 10, -3], "group": ["low", "control", "high", "low"]}, index=[31, 7, 22, 4])'
              - name: 换一张表和阈值
                hidden: true
                data: [T2]
                setup: limit = 6
                expect:
                  df: 'pd.DataFrame({"sample_id": ["X_A", "X_B", "X_C", "X_D", "X_E"], "signal": [-2, 6, 5, -7, 6], "group": ["high", "control", "low", "high", "low"]}, index=[90, 2, 60, 11, 45])'
        explanation: |
          ```python
          df.loc[df["signal"] > limit, "signal"] = limit
          ```

          原来的写法先筛出一张新表，再改新表，df 不变。改成一次 `.loc` 赋值：逗号前选出超过 limit 的行，逗号后是 signal 列。本例只有索引 22 的 13 改成 10。判分时还会换一张表、换阈值运行，检查整张 df。
    review:
      - id: py22.k1.r1
        kind: [trace]
        uses: [py17.k1]
        data: [soil]
        body: |
          复测发现东坡的深度记错了。阅读代码，按原行索引填写运行后的 depth。

          ```python
          soil.loc[soil["site"] == "东坡", "depth"] = 32
          ```
        slots:
          - id: depth
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: site, header: site }
              - { id: depth, header: depth（运行后）, input: integer }
            rows:
              - { id: r5, cells: { index: "5", site: 北坡, depth: 30 } }
              - { id: r12, cells: { index: "12", site: 南坡, depth: 25 } }
              - { id: r3, cells: { index: "3", site: 东坡, depth: 32 } }
              - { id: r8, cells: { index: "8", site: 西坡, depth: 30 } }
        explanation: |
          depth 依次为 **30、25、32、30**。只有 site 为东坡的索引 3 被选中，它的 depth 从 35 改成 32；其他格不动。
        verify: |
          after = run()["soil"]
          answers = {"depth": {f"r{label}": {"depth": value} for label, value in after["depth"].items()}}
      - id: py22.k1.r2
        kind: [debug]
        uses: [py17.k1, py17.k2]
        data: [wells]
        body: |
          要把 wells 里计数低于 100 的孔改成 100。下面每一行单独运行，哪几行会真的改到 wells？选出所有会改到的。
        slots:
          - id: works
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: loc, content: "`wells.loc[wells[\"count\"] < 100, \"count\"] = 100`" }
              - { id: filter_first, content: "`wells[wells[\"count\"] < 100][\"count\"] = 100`" }
              - { id: column_first, content: "`wells[\"count\"][wells[\"count\"] < 100] = 100`" }
              - { id: loc_then, content: "`wells.loc[wells[\"count\"] < 100][\"count\"] = 100`" }
            key: [loc]
        explanation: |
          只有**行和列写在同一个 `.loc[...]` 里**的那一行会改到 wells。其余三行都是分两步：先得到一张新表或一列（哪怕第一步用的也是 `.loc`），再改它，wells 不变。

          每个选项的勾选状态分别计分。
        verify: |
          import warnings
          codes = {
              "loc": 'wells.loc[wells["count"] < 100, "count"] = 100',
              "filter_first": 'wells[wells["count"] < 100]["count"] = 100',
              "column_first": 'wells["count"][wells["count"] < 100] = 100',
              "loc_then": 'wells.loc[wells["count"] < 100]["count"] = 100',
          }
          works = []
          with warnings.catch_warnings():
              warnings.simplefilter("ignore")
              for option, code in codes.items():
                  attempt = run(code)
                  if attempt.error is None and not attempt["wells"].equals(wells):
                      works.append(option)
          answers = {"works": works}
    quiz:
      - id: py22.k1.x1
        kind: [modify]
        uses: [py17.k1, py17.k2]
        data: [wells]
        body: |
          需求是：

          > 直接修改 wells：p2 板上的孔，status 一律改成 `recheck`；其他孔的 status 和其他列都保持原样。

          同事写的代码在作答框里，运行后 wells 没有变化。请改动它并提交。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              p2 = wells[wells["plate"] == "p2"]
              p2["status"] = "recheck"
            solution: |
              wells.loc[wells["plate"] == "p2", "status"] = "recheck"
            rejects:
              - code: |
                  p2 = wells.loc[wells["plate"] == "p2"]
                  p2.loc[:, "status"] = "recheck"
                why: 改的仍是筛选出来的新表
              - code: wells["status"] = "recheck"
                why: 把每个孔都改成了 recheck
              - code: wells.loc[wells["plate"] == "p2"] = "recheck"
                why: 没写列名，把整行都改成了 recheck
              - code: wells = wells.loc[wells["plate"] == "p2"]
                why: 只剩 p2 板的孔，status 也没改
            tests:
              - name: 表 wells
                expect:
                  wells: 'pd.DataFrame({"well": ["A1", "A2", "B1", "B2", "C1"], "count": [120, 95, 150, 80, 110], "plate": ["p1", "p1", "p2", "p2", "p3"], "status": ["ok", "ok", "recheck", "recheck", "ok"]}, index=[3, 11, 6, 9, 14])'
              - name: 换一块板的记录
                hidden: true
                data: [wells2]
                expect:
                  wells: 'pd.DataFrame({"well": ["D1", "D2", "E1", "E2"], "count": [60, 140, 90, 100], "plate": ["p3", "p2", "p2", "p1"], "status": ["ok", "recheck", "recheck", "ok"]}, index=[7, 2, 13, 5])'
        explanation: |
          ```python
          wells.loc[wells["plate"] == "p2", "status"] = "recheck"
          ```

          原来的代码先筛出 p2 板的孔，存成新表 `p2`，再改 `p2`；wells 不变。要改 wells，就在 wells 上写一次 `.loc` 赋值，逗号前选 p2 板的行，逗号后是 status 列。判分时还会换一块板的记录运行，检查整张表。
      - id: py22.k1.x2
        kind: [predict]
        uses: [py17.k1]
        data: [temps]
        body: |
          阅读代码，写出两行输出。

          ```python
          temps[temps["temp"] < 0]["temp"] = 0
          print(temps["temp"].min())
          temps.loc[temps["temp"] < 0, "temp"] = 0
          print(temps["temp"].min())
          ```
        slots:
          - id: first
            type: text
            match: output
            prompt: 第一行输出
            key: "-2.5"
            feedback:
              - when: "0.0"
