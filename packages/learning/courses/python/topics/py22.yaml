notes: |
  建议题型与判分：追踪变量（P）、找错（P）、小改代码（T）。
  Python for Data Analysis 第 3 版不是按 pandas 3 写的：pandas 3 的 Copy-on-Write 使派生对象的修改不再回写原对象，链式赋值也不能更新原表。本节用 .loc 单次赋值讲清修改目标，不沿用旧的 view/copy 说法；行为以课程运行时为准。
