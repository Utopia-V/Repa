    where: 用户指南：Copy-on-Write
    url: https://pandas.pydata.org/docs/user_guide/copy_on_write.html
    use: reference
  - source: pydata-book
    where: 第 5 章 §5.1–5.2（按 3.0 勘正）
    url: https://wesmckinney.com/book/pandas-basics
