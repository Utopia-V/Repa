      - id: py22.k2.x2
        kind: [modify]
        uses: [py01.k1, py17.k1, py17.k2]
        data: [wells]
        body: |
          需求是：

          > 得到一张新表 `clean`：计数低于 100 的孔，count 改成 100；其他格保持原样。原表 wells 不能改。

          同事写的代码在作答框里，clean 是对的，却把 wells 也改了。请改动它并提交。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              clean = wells
              clean.loc[clean["count"] < 100, "count"] = 100
            solution: |
              clean = wells.copy()
              clean.loc[clean["count"] < 100, "count"] = 100
            accepts:
              - |
                clean = wells.copy()
                clean["count"] = clean["count"].clip(lower=100)
            rejects:
              - code: |
                  wells.loc[wells["count"] < 100, "count"] = 100
                  clean = wells
                why: 先改了 wells
              - code: |
                  clean = wells.copy()
                  clean[clean["count"] < 100]["count"] = 100
                why: 链式赋值，clean 没有改
              - code: clean = wells.loc[wells["count"] >= 100]
                why: 把计数低于 100 的孔删掉了，而不是改成 100
            tests:
              - name: 表 wells
                expect:
                  clean: 'pd.DataFrame({"well": ["A1", "A2", "B1", "B2", "C1"], "count": [120, 100, 150, 100, 110], "plate": ["p1", "p1", "p2", "p2", "p3"], "status": ["ok", "ok", "ok", "ok", "ok"]}, index=[3, 11, 6, 9, 14])'
                  wells: wells
              - name: 换一块板的记录
                hidden: true
                data: [wells2]
                expect:
                  clean: 'pd.DataFrame({"well": ["D1", "D2", "E1", "E2"], "count": [100, 140, 100, 100], "plate": ["p3", "p2", "p2", "p1"], "status": ["ok", "ok", "hold", "ok"]}, index=[7, 2, 13, 5])'
                  wells: wells
        explanation: |
          ```python
          clean = wells.copy()
          clean.loc[clean["count"] < 100, "count"] = 100
          ```

          `clean = wells` 只是给 wells 多起一个名字，改 clean 就是改 wells。用 `copy()` 先复制出一份独立的表，再在它上面做一次 `.loc` 赋值。判分时会检查 clean 的每一格，并确认 wells 没有被改；还会换一块板的记录运行。
