notes: |
  建议题型与判分：追踪变量（P）、找错（P）、小改代码（T）。
  Python for Data Analysis 第 3 版不是按 pandas 3 写的：pandas 3 的 Copy-on-Write 使派生对象的修改不再回写原对象，链式赋值也不能更新原表。本节用 .loc 单次赋值讲清修改目标，不沿用旧的 view/copy 说法；行为以课程运行时为准。
  范围：df.loc[掩码, 列名] = 值 改选中的格（含给选中的行写一列新列）；链式赋值不生效；别名（b = df）、派生结果（筛选结果、取出的一列、方法返回的新表）和 df.copy() 的区别；名字改指向派生结果以后不再影响原表。不讲 inplace、where/mask、clip（clip 只出现在小改代码题的等价写法里）。py18 不是先修，只用单个条件。
  课程运行时里，链式赋值会给出 ChainedAssignmentError 警告但不报错，原表不变；题目只问原表变没变，不问警告的原文。给整行赋数（df.loc[掩码] = 10）会因为文字列放不下数而报 TypeError，只作为错误写法出现。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、三道练习 5 分钟；k2 讲解与例题 4 分钟、三道练习 5 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  前几节的代码大多是从原表算出新的结果：筛选出的行、新加的列。这一节要改原表里已有的格，例如把扣除本底后成了负数的读数改成 0。关键是说清楚：改的是哪张表的哪些格。

  宿主已经导入了 pandas（`pd`）并准备好数据表；每道题都从题面给出的表重新开始。大多数题用表 T：`signal` 是扣除本底以后的读数，可能是负数。题里常用 `.min()` 取出一列的最小值，用来看还有没有负数。
wrapup: |
  要改原表，就写一次 `df.loc[行, 列] = 值`，行和列都写在同一对方括号里。要一份可以随便改、又不影响原表的表，就写 `df.copy()`，让读代码的人一眼看出来。

  向 AI 提需求时，说清“直接改原表”还是“得到一张新表、原表不动”。拿到代码后，找出每一处修改：它改的是 df 本身，还是某个筛选结果或副本；`b = df` 这样的一行，意味着之后改 b 就是在改 df。
