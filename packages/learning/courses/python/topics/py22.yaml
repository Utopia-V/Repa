      explanation: |
        - `df.loc[7, "signal"]` 是 **0**：alias 就是 df，第 3 行通过 alias 改的就是 df。
        - `df.loc[31, "signal"]` 是 **8**：sub 是筛选出来的派生结果，第 4 行改 sub 不会改到 df。
