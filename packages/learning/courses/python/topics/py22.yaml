  - id: py22.k2
    title: 区分别名、派生结果与显式 copy，按 pandas 3 CoW 理解
    card:
      name: 别名与副本
      aliases: [copy, 别名, Copy-on-Write]
      definition: b = df 只是给同一张表多起一个名字，改 b 就是改 df；筛选结果、取出的一列等派生结果在 pandas 3 里与原表互不影响；df.copy() 明确得到一份独立的表。
      conditions:
        - 名字改指向派生结果以后（t = t.loc[...]），再改 t 就不会影响原表。
        - 旧教程里 view、copy、SettingWithCopyWarning 的说法不适用于 pandas 3。
      example:
        from: py22.k2.e0
        text: |
          ```python
          alias = df
          sub = df.loc[df["signal"] > 0, ["sample_id", "signal"]]
          alias.loc[7, "signal"] = 0
          sub.loc[31, "signal"] = 99
          ```
          df 的索引 7 变成 0（alias 就是 df），索引 31 仍是 8（sub 是派生结果）。
    lesson: |
      [赋值](repa:concept/py01.k1)是让名字指向一个值。写 `b = df`，并没有复制出第二张表，只是同一张表多了一个名字 b，叫作**别名**。之后通过 b 改（`b.loc[...] = ...`、`b["new"] = ...`），df 也跟着变，因为它们本来就是同一张表。

      由 df 算出来的东西，例如筛选结果 `df.loc[df["signal"] > 0]`、取出的一列 `df["signal"]`、`df.dropna()` 的结果，是**派生结果**。在 pandas 3 里，派生结果和原表互不影响：改派生结果不会改到 df，之后改 df 也不会改到已经得到的派生结果。pandas 在背后用一种叫 Copy-on-Write（写时复制）的办法省内存，但你看到的效果就是彼此独立。

      | 写法 | 和 df 的关系 | 改它会改到 df 吗 |
      |---|---|---|
      | `b = df` | 同一张表的另一个名字 | 会 |
      | `sub = df.loc[掩码]`、`col = df["signal"]` | 派生结果 | 不会 |
      | `c = df.copy()` | 明确复制出的独立表 | 不会 |

      既然派生结果已经独立，为什么还要 `copy()`？想要“一份可以随便改、又不影响原表的表”时，`b = df` 是错的写法，`b = df.copy()` 才对；写出 `copy()` 也让读代码的人一眼看出这是副本。

      还有一种情形要留心：

      ```python
      t = df
      t = t.loc[t["signal"] > 0]
      ```

      第一行 t 是 df 的别名；第二行让 t 改指向一个派生结果。从这时起，t 和 df 已经是两张表，再改 t 不会影响 df。

      旧教程和旧版 pandas 讲过“视图（view）”“副本（copy）”和 SettingWithCopyWarning，那套说法不适用于 pandas 3。判断时只问三件事：这个名字是不是 df 的别名；它是不是由 df 算出来的；有没有写 `copy()`。
    example:
      id: py22.k2.e0
      kind: [trace]
      data: [T]
      body: |
        阅读代码，写出四行全部运行后的几个值。

        ```python startLine=1
        alias = df
        sub = df.loc[df["signal"] > 0, ["sample_id", "signal"]]
        alias.loc[7, "signal"] = 0
        sub.loc[31, "signal"] = 99
        ```
