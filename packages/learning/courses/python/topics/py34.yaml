      - id: py34.k2.r2
        kind: [explain]
        data: [tubes]
        body: |
          同事导出后读回来，发现编号变成了 7、8、12，于是说：“导出把编号前面的 0 弄丢了，文件坏了。”

          ```python
          tubes.to_csv("tubes.csv", index=False)
          back = pd.read_csv("tubes.csv")
          print(back["tube_id"].tolist())
          ```
        slots:
          - id: line
            type: text
            match: text
            prompt: 文件 tubes.csv 的第二行原样是什么？
            key: "007,5"
          - id: cause
            type: choice
            prompt: 编号变成 7、8、12 的原因是什么？
            options:
              - id: export
                content: to_csv 写文件时去掉了前导零
              - id: read
                content: 文件里还是 007，读回时没写 dtype，pandas 把这一列读成了整数
              - id: excel
                content: 文件要用 utf-8-sig 编码才能保留前导零
            key: read
        explanation: |
          文件第二行是 **`007,5`**，导出没有问题。编号变成 7、8、12，是因为**读回时没写 dtype**，pandas 把全是数字的一列读成了整数。核对时写 `pd.read_csv("tubes.csv", dtype={"tube_id": "str"})`，读回来就是 007、008、012。编码管的是文字怎样存，和前导零无关。
        verify: |
          r = run()
          lines = open("tubes.csv", encoding="utf-8").read().splitlines()
          file_has_zeros = lines[1].split(",")[0] == "007"
          read_as_numbers = r["back"]["tube_id"].tolist() == [7, 8, 12]
          answers = {"line": lines[1], "cause": "read" if file_has_zeros and read_as_numbers else "export"}
    quiz:
      - id: py34.k2.x1
        kind: [specify, debug]
        data: [final]
        body: |
          需求是“每个样本一行，共 4 个样本（S01、S02、S03、S04），列为 sample_id、signal”。导出后读回来：

          ```python
          final.to_csv("final.csv", index=False)
          back = pd.read_csv("final.csv")
          ```

          在这两行后面再加一行 `print(...)` 做核对，条件成立显示 True，不成立显示 False。下面哪几行在这份文件上会显示 False，也就是能发现它不符合需求？选出所有能发现的。
        slots:
          - id: checks
            type: choice
            multiple: true
            options:
              - id: rows
                content: |
                  ```python
                  print(len(back) == 4)
                  ```
                feedback: 文件正好有 4 行，这一行显示 True，发现不了问题。
              - id: unique
                content: |
                  ```python
                  print(back["sample_id"].is_unique)
                  ```
              - id: columns
                content: |
                  ```python
                  print(list(back.columns) == ["sample_id", "signal"])
                  ```
                feedback: 列名没有问题，这一行显示 True，发现不了问题。
              - id: ids
                content: |
                  ```python
                  print(list(back["sample_id"]) == ["S01", "S02", "S03", "S04"])
                  ```
              - id: width
                content: |
                  ```python
                  print(len(back.columns) == 2)
                  ```
                feedback: 正好两列，这一行显示 True，发现不了问题。
            key: [unique, ids]
        explanation: |
          这份文件 4 行、两列、列名也对，但 S03 出现了两次、S04 没有，一多一少，行数恰好抵消。

          - 查行数、查列名、查列数，三项都显示 True，看不出问题。
          - `is_unique` 显示 False：S03 重复了。
          - 把读回来的编号和应有的四个编号比较，读回来的是 S01、S02、S03、S03，对不上，也显示 False。

          行数对了不代表没问题。键（编号）要单独查：有没有重复，该有的是不是都在。
        verify: |
          fits = []
          for option, code in OPTIONS["checks"].items():
              r = run(BLOCKS[0] + "\n" + code)
              if r.error is None and r.lines()[-1] == "False":
                  fits.append(option)
