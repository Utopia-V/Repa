kps:
  - id: py34.k1
    keyPrerequisites: [py15]
    title: to_csv 的列顺序、index=False 与编码
    card:
      name: to_csv 导出
      aliases: [导出 CSV, index=False, utf-8-sig]
      definition: df.to_csv("文件名.csv") 把表写成逗号分隔的文字文件；默认把行索引也写成第一列，index=False 不写；列按表里的顺序写出。
      conditions:
        - 要换列的顺序或只要几列，先选列：df[["site", "depth"]].to_csv(...)。
        - 含中文、要用 Excel 双击打开的文件，加 encoding="utf-8-sig"，否则常常显示成乱码。
      example:
        from: py34.k1.e0
        text: |
          ```python
          kept.to_csv("kept.csv")
          ```
          文件第一行是 `,sample_id,signal`：开头多出一列没有列名的行索引，下面每行以 7、22、4 开头。
    lesson: |
      `kept.to_csv("kept.csv")` 把表 `kept` 写成一个文字文件：第一行是列名，下面每行一条记录，格子之间用逗号隔开。

      默认情况下，**行索引也会被写进去**，成为第一列。这一列没有列名，所以第一行以逗号开头：

      ```
      ,sample_id,signal
      7,S_B,10
      22,S_C,13
      4,S_D,10
      ```

      同事用 Excel 打开，会看到最左边多了一列没有标题的 7、22、4。行索引对对方没有意义时，写 `index=False`，文件就只有表里的列。

      列按表里现在的顺序写出。需求要求别的顺序，或者只要其中几列，先选列再导出：`kept[["signal", "sample_id"]].to_csv("out.csv", index=False)`。

      还有编码。文件里有中文、对方要用 Excel 双击打开时，写 `encoding="utf-8-sig"`。它会在文件最开头写一个看不见的标记，Excel 靠它认出这是 UTF-8 文字；不写的话，中文常常显示成乱码。pandas 读回时，有没有这个标记都能读对。
    example:
      id: py34.k1.e0
      kind: [predict]
      data: [kept]
      body: |
        阅读代码，说出写出的文件 `kept.csv` 里有什么。

        ```python
        kept.to_csv("kept.csv")
        ```
      slots:
        - id: header
          type: text
          match: text
          prompt: 文件的第一行原样是什么？
          key: ",sample_id,signal"
        - id: second
          type: text
          match: text
          prompt: 文件的第二行原样是什么？
          key: "7,S_B,10"
        - id: ncols
          type: text
          format: integer
          prompt: 用 Excel 打开，一共有几列？
          key: 3
      explanation: |
        第一行是 **`,sample_id,signal`**，第二行是 **`7,S_B,10`**，用 Excel 打开有 **3** 列。没写 `index=False`，行索引 7、22、4 也被写成了第一列；这一列在表里没有列名，所以第一行以一个逗号开头。

        要是写成 `kept.to_csv("kept.csv", index=False)`，第一行就是 `sample_id,signal`，只有两列。
      verify: |
        r = run()
        lines = open("kept.csv", encoding="utf-8").read().splitlines()
        answers = {"header": lines[0], "second": lines[1], "ncols": len(lines[0].split(","))}
    practice:
      - id: py34.k1.q1
        kind: [predict]
        data: [kept]
        body: |
          阅读代码，说出写出的文件 `kept_q1.csv` 里有什么。

          ```python
          kept.to_csv("kept_q1.csv", index=False)
          ```
        slots:
          - id: header
            type: text
            match: text
            prompt: 文件的第一行原样是什么？
            key: "sample_id,signal"
            feedback:
              - when: ",sample_id,signal"
                message: 写了 index=False，行索引不会写进文件，第一行不再以逗号开头。
          - id: nlines
            type: text
            format: integer
            prompt: 文件一共有几行（列名那一行也算）？
            key: 4
          - id: second
            type: text
            match: text
            prompt: 文件的第二行原样是什么？
            key: "S_B,10"
        explanation: |
          第一行是 **`sample_id,signal`**，一共 **4** 行（1 行列名加 3 行记录），第二行是 **`S_B,10`**。`index=False` 让行索引 7、22、4 不进文件。
        verify: |
          run()
          lines = open("kept_q1.csv", encoding="utf-8").read().splitlines()
          answers = {"header": lines[0], "nlines": len(lines), "second": lines[1]}
      - id: py34.k1.q2
        kind: [modify]
        data: [kept]
        body: |
          需求是：导出 `out.csv`，**signal 在前、sample_id 在后**，不要行索引，行的顺序不变。哪一行代码符合需求？
        slots:
          - id: line
            type: choice
            options:
              - id: plain
                content: |
                  ```python
                  kept.to_csv("out.csv", index=False)
                  ```
                feedback: 列按表里原来的顺序写出，sample_id 仍在前。
              - id: index
                content: |
                  ```python
                  kept[["signal", "sample_id"]].to_csv("out.csv")
                  ```
                feedback: 列的顺序对了，但没写 index=False，行索引成了第一列。
              - id: right
                content: |
                  ```python
                  kept[["signal", "sample_id"]].to_csv("out.csv", index=False)
                  ```
              - id: sorted
                content: |
                  ```python
                  kept.sort_values("signal").to_csv("out.csv", index=False)
                  ```
                feedback: sort_values 调换的是行的顺序，不是列的顺序。
            key: right
        explanation: |
          `kept[["signal", "sample_id"]].to_csv("out.csv", index=False)`：先按需求的顺序选出两列，再不带行索引写出。直接导出 `kept` 时列的顺序没变；忘了 `index=False` 会多出行索引那一列；排序改的是行的先后，列的顺序不变。
        verify: |
          # 按需求独立写出期望的文件内容：先 signal 后 sample_id，没有行索引，行序不变。
          expected = ["signal,sample_id"] + [f"{s},{i}" for i, s in zip(kept["sample_id"], kept["signal"])]
          fits = []
          for option, code in OPTIONS["line"].items():
              result = run(code)
              if result.error is None and open("out.csv", encoding="utf-8").read().splitlines() == expected:
                  fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py34.k1.q3
        kind: [specify]
        data: [sites]
        body: |
          表 sites 要导出成 `sites.csv`，发给一位用 Windows 的同事，他会双击用 Excel 打开。他只要 site 和 depth 两列（site 在前），不要行索引。哪一行代码符合要求？
        slots:
          - id: line
            type: choice
            options:
              - id: no_bom
                content: |
                  ```python
                  sites[["site", "depth"]].to_csv("sites.csv", index=False)
                  ```
                feedback: 没写 encoding="utf-8-sig"，Excel 双击打开时“北坡”这些中文常常显示成乱码。
              - id: right
                content: |
                  ```python
                  sites[["site", "depth"]].to_csv("sites.csv", index=False, encoding="utf-8-sig")
                  ```
              - id: with_index
                content: |
                  ```python
                  sites[["site", "depth"]].to_csv("sites.csv", encoding="utf-8-sig")
                  ```
                feedback: 没写 index=False，行索引 5、12、3 成了第一列。
              - id: order
                content: |
                  ```python
                  sites.to_csv("sites.csv", index=False, encoding="utf-8-sig")
                  ```
                feedback: 表里 depth 在前，直接导出时列的顺序不符合要求。
            key: right
        explanation: |
          `sites[["site", "depth"]].to_csv("sites.csv", index=False, encoding="utf-8-sig")` 三处都符合：先选列定下 site 在前，`index=False` 不写行索引，`encoding="utf-8-sig"` 在文件开头写入标记，让 Excel 认出中文。其他几行各少了一处。
        verify: |
          BOM = b"\xef\xbb\xbf"
          fits = []
          for option, code in OPTIONS["line"].items():
              result = run(code)
              raw = open("sites.csv", "rb").read()
              header = raw.decode("utf-8-sig").splitlines()[0]
              if result.error is None and raw.startswith(BOM) and header == "site,depth":
                  fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits}
    review:
      - id: py34.k1.r1
        kind: [modify]
        data: [summary]
        body: |
          需求是：把 summary 导出成 `summary_r1.csv`，只要 group 和 mean_signal 两列（group 在前），不要行索引，编码用 utf-8-sig。从下面的代码块里选出需要的，排成程序；用不到的不要放进来。
        slots:
          - id: lines
            type: order
            partial: true
            items:
              - { id: write_index, code: 'out.to_csv("summary_r1.csv", encoding="utf-8-sig")' }
              - { id: pick_wrong, code: 'out = summary[["mean_signal", "group"]]' }
              - { id: write, code: 'out.to_csv("summary_r1.csv", index=False, encoding="utf-8-sig")' }
              - { id: pick, code: 'out = summary[["group", "mean_signal"]]' }
              - { id: write_all, code: 'summary.to_csv("summary_r1.csv", index=False, encoding="utf-8-sig")' }
            key: [pick, write]
            tests:
              - name: 文件内容符合需求
                setup: |
                  import os
                  if os.path.exists("summary_r1.csv"):
                      os.remove("summary_r1.csv")
                expect:
                  open("summary_r1.csv", encoding="utf-8").read(): '"﻿group,mean_signal\ncontrol,9.5\ndrug,11.5\n"'
                  summary: summary
        explanation: |
          先 `out = summary[["group", "mean_signal"]]` 选出两列并定下顺序，再 `out.to_csv("summary_r1.csv", index=False, encoding="utf-8-sig")` 写出。文件内容是一行列名 `group,mean_signal` 加两行记录，开头有 utf-8-sig 的标记。直接导出 `summary` 会多出 n 列；少了 `index=False` 会多出行索引列。
      - id: py34.k1.r2
        kind: [predict]
        data: [soil]
        body: |
          下面三行各写出一个文件。分别写出每个文件的第一行。

          ```python startLine=1
          soil.to_csv("a.csv")
          soil[["depth", "site"]].to_csv("b.csv", index=False)
          soil[["site"]].to_csv("c.csv")
          ```
        slots:
          - id: headers
            type: table
            columns:
              - { id: line, header: 代码 }
              - { id: file, header: 文件 }
              - { id: header, header: 文件的第一行, input: { type: text, match: text } }
            rows:
              - { id: a, cells: { line: 第 1 行, file: a.csv, header: ",site,depth" } }
              - { id: b, cells: { line: 第 2 行, file: b.csv, header: "depth,site" } }
              - { id: c, cells: { line: 第 3 行, file: c.csv, header: ",site" } }
        explanation: |
          - `a.csv`：**`,site,depth`**。没写 `index=False`，行索引成了没有列名的第一列。
          - `b.csv`：**`depth,site`**。先选列定下了 depth 在前，`index=False` 不写行索引。
          - `c.csv`：**`,site`**。只选了 site 一列，但仍带着行索引。
        verify: |
          answers = {"headers": {}}
          for line, name in zip(CODE.splitlines(), ["a", "b", "c"]):
              run(line)
              answers["headers"][name] = {"header": open(f"{name}.csv", encoding="utf-8").read().splitlines()[0]}
    quiz:
      - id: py34.k1.x1
        kind: [modify]
        data: [report]
        body: |
          需求是：

          > 把 report 导出成 `report.csv`，只要 group 和 mean_signal 两列（group 在前），不要行索引；同事会用 Excel 打开，组名是中文，编码用 utf-8-sig。

          作答框里的代码不符合需求，请改动它并提交。判分时会读出文件的全部内容核对，还会换一张表运行你的代码。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              report.to_csv("report.csv")
            solution: |
              report[["group", "mean_signal"]].to_csv("report.csv", index=False, encoding="utf-8-sig")
            accepts:
              - |
                out = report[["group", "mean_signal"]]
                out.to_csv("report.csv", encoding="utf-8-sig", index=False)
            rejects:
              - code: report[["group", "mean_signal"]].to_csv("report.csv", index=False)
                why: 没写 utf-8-sig，Excel 打开中文可能乱码
              - code: report[["group", "mean_signal"]].to_csv("report.csv", encoding="utf-8-sig")
                why: 行索引写进了文件
              - code: report.to_csv("report.csv", index=False, encoding="utf-8-sig")
                why: 多导出了 n 列
              - code: report[["mean_signal", "group"]].to_csv("report.csv", index=False, encoding="utf-8-sig")
                why: 列的顺序反了
            tests:
              - name: 表 report
                setup: |
                  import os
                  if os.path.exists("report.csv"):
                      os.remove("report.csv")
                expect:
                  open("report.csv", "rb").read(3): 'b"\xef\xbb\xbf"'
                  open("report.csv", encoding="utf-8-sig").read(): '"group,mean_signal\n对照,8.5\n处理,12.5\n"'
                  report: report
              - name: 换一张索引不按顺序的表
                hidden: true
                data: [report2]
                setup: |
                  import os
                  if os.path.exists("report.csv"):
                      os.remove("report.csv")
                expect:
                  open("report.csv", "rb").read(3): 'b"\xef\xbb\xbf"'
                  open("report.csv", encoding="utf-8-sig").read(): '"group,mean_signal\n高剂量,13.5\n对照,8.0\n低剂量,10.5\n"'
        explanation: |
          ```python
