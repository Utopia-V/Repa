  - id: py34.k2
    keyPrerequisites: [py15, py25]
    title: 输出后按需求核对行数、键和数值
    card:
      name: 导出后核对
      aliases: [读回核对, 前导零, is_unique]
      definition: 导出后把文件读回来，按需求核对：行数是否等于应有的条数，业务键有没有重复，挑一两个能手算的值看对不对。
      conditions:
        - '编号列读回时写 dtype={"sample_id": "str"}，否则 "001" 会被读成数字 1，看起来像文件错了。'
        - 行数对了不代表没问题：可能一条重复、另一条缺了，键也要查。
      example:
        from: py34.k2.e0
        text: |
          ```python
          back = pd.read_csv("per_sample.csv", dtype={"sample_id": "str"})
          ```
          读回 3 行，sample_id 没有重复，第一个编号仍是 001；不写 dtype 时会读成 1。
    lesson: |
      代码运行完、文件写出来了，还不等于交付完成。把文件读回来，照着需求核对三样：

      1. **行数**：需求说“每个样本一行，共 3 个样本”，`len(back)` 就应该是 3。
      2. **键**：样本编号这样的业务键不能重复。`back["sample_id"].is_unique` 在这一列没有重复值时是 True，有重复时是 False。
      3. **数值**：挑一两个能手算的值看一看，例如某个样本的 signal。取一列的第一个值，可以写 `back["sample_id"].iloc[0]`。

      行数对了也别急着放心：一个样本重复、另一个样本缺了，行数照样对得上，所以键要单独查。

      读回时要按需求的口径读。编号 `001` 在文件里写得好好的，但 `pd.read_csv` 默认把这一列读成数字 1，前导零就没了，看起来像是文件出了错。读回时写 `dtype={"sample_id": "str"}`，编号才按文字读进来，和需求里的写法一致。
    example:
      id: py34.k2.e0
      kind: [predict]
      data: [per_sample]
      body: |
        需求是“每个样本一行，共 3 个样本，编号保留前导零”。阅读导出和核对的代码。

        ```python
        per_sample.to_csv("per_sample.csv", index=False)
        back = pd.read_csv("per_sample.csv", dtype={"sample_id": "str"})
        n_rows = len(back)
        unique = back["sample_id"].is_unique
        first = back["sample_id"].iloc[0]
        ```
      slots:
        - id: n_rows
          type: text
          format: integer
          prompt: "`n_rows` 是多少？"
          key: 3
        - id: unique
          type: choice
          prompt: "`unique` 是什么？"
          options:
            - { id: "True", content: "True" }
            - { id: "False", content: "False" }
          key: "True"
        - id: first
          type: text
          match: text
          prompt: "`first` 是什么？"
          key: "001"
        - id: plain
          type: text
          match: output
          prompt: '如果第二行不写 `dtype={"sample_id": "str"}`，`first` 用 print 显示出来是什么？'
          key: "1"
      explanation: |
        `n_rows` 是 **3**，`unique` 是 **True**，`first` 是 **001**：按文字读回，前导零还在。

        不写 dtype 时，pandas 看这一列都是数字，就读成整数，`first` 显示为 **1**。文件里写的仍是 `001`，变的是读法。
      verify: |
        r = run()
        plain = run(CODE.replace(', dtype={"sample_id": "str"}', "") + "\nprint(first)")
        answers = {"n_rows": r["n_rows"], "unique": str(bool(r["unique"])), "first": r["first"], "plain": plain.lines()[0]}
    practice:
      - id: py34.k2.q1
        kind: [predict]
        data: [plots]
        body: |
          阅读代码。

          ```python
          plots.to_csv("plots_q1.csv", index=False)
          back = pd.read_csv("plots_q1.csv")
          print(back["plot_id"].tolist())
          ```
        slots:
          - id: output
            type: text
            match: output
            prompt: 程序显示什么？
            key: "[7, 12, 100]"
            feedback:
              - when: "['007', '012', '100']"
                message: 读回时没有写 dtype，pandas 把这一列读成了整数。
          - id: file
            type: choice
            prompt: 文件 plots_q1.csv 里，第一块样地的编号写的是什么？
            options:
              - { id: zeros, content: "`007`" }
              - { id: seven, content: "`7`" }
            key: zeros
        explanation: |
          显示 **`[7, 12, 100]`**。文件里写的是 **`007`**，前导零是在读回时丢的：不写 `dtype`，pandas 把全是数字的一列读成整数。要保留编号的原样，读回时写 `dtype={"plot_id": "str"}`。
        verify: |
          r = run()
          second_line = open("plots_q1.csv", encoding="utf-8").read().splitlines()[1]
          answers = {"output": r.lines()[0], "file": "zeros" if second_line.split(",")[0] == "007" else "seven"}
      - id: py34.k2.q2
        kind: [predict, debug]
        data: [merged]
        body: |
          需求是“每个样本一行，共 3 个样本（S_A、S_B、S_C）”。拼表以后导出，再读回来核对。

          ```python
          merged.to_csv("merged.csv", index=False)
          back = pd.read_csv("merged.csv")
          n_rows = len(back)
          unique = back["sample_id"].is_unique
          ```
        slots:
          - id: n_rows
            type: text
            format: integer
            prompt: "`n_rows` 是多少？"
            key: 4
          - id: unique
            type: choice
            prompt: "`unique` 是什么？"
            options:
              - { id: "False", content: "False" }
              - { id: "True", content: "True" }
            key: "False"
          - id: dup
            type: text
            match: text
            prompt: 哪个 sample_id 出现了不止一次？
            key: S_B
          - id: ok
            type: choice
            prompt: 这个文件符合需求吗？
            options:
              - { id: "yes", content: 符合，文件能读回来就行 }
              - { id: "no", content: 不符合，行数和键都不对 }
            key: "no"
        explanation: |
          `n_rows` 是 **4**，`unique` 是 **False**：**S_B** 出现了两次，两行的 signal 还不一样（10 和 11）。需求是每个样本一行、共 3 行，所以**不符合**，要回头查拼表那一步为什么多出一行，而不是随手删掉一行。
        verify: |
          r = run()
          back = r["back"]
          counts = back["sample_id"].value_counts()
          dups = list(counts[counts > 1].index)
          ok = len(back) == 3 and back["sample_id"].is_unique
          answers = {"n_rows": r["n_rows"], "unique": str(bool(r["unique"])), "dup": dups[0] if len(dups) == 1 else dups, "ok": "yes" if ok else "no"}
      - id: py34.k2.q3
        kind: [modify]
        data: [checked]
        body: |
          文件 `export.csv` 已经导出好了，内容就是上面这张表。核对的代码只写了第一行，请补全另外两行：

          - `n_rows`：读回来的行数；
          - `ids_unique`：sample_id 这一列没有重复值时为 True，有重复时为 False。

          判分时还会换几份文件运行你的代码。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
              n_rows = ...
              ids_unique = ...
            solution: |
              back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
              n_rows = len(back)
              ids_unique = back["sample_id"].is_unique
            accepts:
              - |
                back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
                n_rows = back.shape[0]
                ids_unique = not back["sample_id"].duplicated().any()
            rejects:
              - code: |
                  back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
                  n_rows = len(back)
                  ids_unique = True
                why: 没有真正检查，直接写 True
              - code: |
                  back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
                  n_rows = 3
                  ids_unique = back["sample_id"].is_unique
                why: 照着这份文件把行数写死
              - code: |
                  back = pd.read_csv("export.csv", dtype={"sample_id": "str"})
                  n_rows = len(back.columns)
                  ids_unique = back["sample_id"].is_unique
                why: 数成了列数
            tests:
              - name: 文件 export.csv
                setup: export.to_csv("export.csv", index=False)
                expect:
                  n_rows: "3"
                  ids_unique: "True"
              - name: 有重复编号的文件
                hidden: true
                data: [checked2]
                setup: export.to_csv("export.csv", index=False)
                expect:
                  n_rows: "4"
                  ids_unique: "False"
              - name: 只有两行的文件
                hidden: true
                data: [checked3]
                setup: export.to_csv("export.csv", index=False)
                expect:
                  n_rows: "2"
                  ids_unique: "True"
                  back["sample_id"].tolist(): '["010", "100"]'
        explanation: |
          ```python
          n_rows = len(back)
          ids_unique = back["sample_id"].is_unique
          ```

          `len(back)` 是读回来的行数；`.is_unique` 直接回答“这一列有没有重复”。两个值都从读回来的表算出，换一份文件照样能用；照着这份文件写死 3 或 True，换一份有重复的文件就查不出问题了。
    review:
