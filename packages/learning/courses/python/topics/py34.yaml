id: py34
title: 导出的是结果，也是约定
status: complete
minutes: 20
summary: 读懂 to_csv 写出的文件里有什么：行索引列、列的顺序和编码；导出后把文件读回来，按需求核对行数、键和数值。
prerequisites: [py15, py12, py25]
encompassings:
  - {topic: py15, weight: 0.5}
  - {topic: py12, weight: 0}
  - {topic: py25, weight: 0.5}
sources:
  - source: pydata-book
    where: 第 6 章 §6.1
    url: https://wesmckinney.com/book/accessing-data
    use: reference
  - source: pandas-docs
    where: 入门教程：表格读写
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/02_read_write.html
    use: reference
notes: |
  范围：只用 to_csv 的文件名、index、encoding 三个参数，列的顺序通过先选列来定；读回只用 read_csv 加 dtype={"列名": "str"}（py15.k2 已讲）。核对只用 len、list(columns) 和 Series.is_unique 这几种短写法，is_unique 在讲解里就地说明；按条件选行（py17）不是本 topic 的先修，没有用。不讲路径（py43）、分隔符和其他编码。
  “Excel 双击打开不带 BOM 的 UTF-8 文件常显示乱码，utf-8-sig 能避免”是常见的经验，取决于 Excel 版本和系统设置；课里只说“常常”，判分只考 utf-8-sig 会在文件开头写入标记这件确定的事。
  运行时行为（Pyodide 里核对过）：to_csv 写进内存文件系统，同一 topic 的任务之间文件会留着，所以每道题用不同的文件名，测试的 setup 先删掉旧文件；read_csv 读带 BOM 的文件时列名不受影响。题目代码的命名空间里没有 pd，用不显示的 python 夹具 import pandas as pd 补上。
  建议题型与判分：找错（P）、小改代码（T）、写清需求（S/O）。复习和测验的答案都由 verify 或测试算出，没有 manual。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 5 分钟；k2 讲解与例题 3 分钟、练习 6 分钟；收束 2 分钟。
  取材：to_csv、read_csv 的参数参照 pandas 入门教程与 Python for Data Analysis 第 6 章，小表、讲解和题目为本课自拟。
intro: |
  宿主已经准备好 pandas 和数据表。题目里写出的文件放在一个临时的文件夹里，写完可以马上读回来看。读回来的一列常用 `.tolist()` 变成列表，一眼就能看清每个值。

  导出的 CSV 会交给同事、导入别的软件，或者用 Excel 打开。文件里有哪些列、按什么顺序、第一列是什么，都由导出的那一行代码决定；对方拿到文件时不会看到你的代码，只会看到这些约定的结果。
wrapup: |
  向同事或 AI 提导出的需求时，可以这样说：“导出 site_depth.csv：只要 site 和 mean_depth 两列，按这个顺序；不写行索引；编码用 utf-8-sig，方便用 Excel 打开；每个采样点一行，共 4 行，site 不重复。”

  导出以后，把文件读回来核对：行数对不对，键有没有重复，挑一两个能手算的值看一看。编号列按文字读回，别让读法吃掉前导零。
