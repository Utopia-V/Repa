      - id: py34.k2.x2
        kind: [modify]
        data: [batch]
        body: |
          文件 `batch.csv` 已经导出好了，内容就是上面这张表。需求是：编号保留前导零，signal 照常是整数。

          作答框里的核对代码读回时丢了前导零，请改动它并提交，变量名不变。判分时还会换一份文件运行你的代码。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              back = pd.read_csv("batch.csv")
              ids = back["sample_id"].tolist()
              n_rows = len(back)
            solution: |
              back = pd.read_csv("batch.csv", dtype={"sample_id": "str"})
              ids = back["sample_id"].tolist()
              n_rows = len(back)
            rejects:
              - code: |
                  back = pd.read_csv("batch.csv")
                  ids = back["sample_id"].astype(str).tolist()
                  n_rows = len(back)
                why: 读成整数以后再转回文字，前导零已经没了
              - code: |
                  back = pd.read_csv("batch.csv", dtype=str)
                  ids = back["sample_id"].tolist()
                  n_rows = len(back)
                why: 把所有列都读成文字，signal 也成了文字
            tests:
              - name: 文件 batch.csv
                setup: batch.to_csv("batch.csv", index=False)
                expect:
                  ids: '["007", "012", "100"]'
                  back["signal"].tolist(): "[8, 10, 13]"
                  n_rows: "3"
              - name: 换一份文件
                hidden: true
                data: [batch2]
                setup: batch.to_csv("batch.csv", index=False)
                expect:
                  ids: '["0001", "0420"]'
                  back["signal"].tolist(): "[4, 9]"
                  n_rows: "2"
        explanation: |
          ```python
          back = pd.read_csv("batch.csv", dtype={"sample_id": "str"})
          ```

          只给 sample_id 这一列指定按文字读，编号就保留 `007` 的原样，signal 仍按整数读。先读成整数再 `astype(str)` 已经晚了，得到的是 `"7"`；`dtype=str` 把所有列都读成文字，signal 也成了 `"8"`。
