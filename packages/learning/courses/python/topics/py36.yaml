notes: |
  范围：for、if/else、比较、列表和 append，外加 copy() 与 list() 两种复制写法。不用 range、enumerate、zip（py38）和推导式（py39）；小改代码题接受推导式写法，但讲解不提。k1 的变量名和情境（signals、kept、阈值 10）有意保持朴素，py39 会把同样的循环和列表推导式对照。k2 回应 py01 卡片里“列表另有情况”的伏笔；pandas 表的别名与 Copy-on-Write 在 py22，本节不提。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 6 分钟（含一道小改代码）；k2 讲解与例题 3 分钟、练习 4 分钟；收束 2 分钟。
  题型：追踪表、预测输出、找错、Parsons、小改代码（骨架和改错各一）。原稿建议的“解释代码”做成可由程序核对的选择题：别名题用 is 判断两个名字是否指向同一个列表，找错题把每种改法套到题面代码上运行。
  例题、练习的情境与数据为本课自拟。
intro: |
  上一节的循环对每个元素做同样的事。这一节在循环里加一个 `if`：逐个检查，满足条件的收进一个新列表。AI 写的数据处理代码里，这是最常见的样子之一。

  后半节看一个和“收集”紧挨着的坑：两个名字可能指向同一个列表，改一个，另一个也跟着变。
wrapup: |
  读“逐个检查并收集”的循环，按顺序找四处：空列表在哪里建（应在循环前）；每轮检查什么条件；`append` 是否缩进在 `if` 下面；结果在哪里显示。结果总是按原列表的顺序排列。

  看到 `backup = data` 这类写法，先问一句：这是同一个列表的另一个名字，还是一份独立的副本？要副本就写 `data.copy()`。
