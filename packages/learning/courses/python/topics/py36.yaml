              - id: copy
                content: "`backup = raw` 复制了一份，但 print 显示的其实是 `raw`"
            key: same
        explanation: |
          显示 **[5, 7, 9, -1]**。`backup = raw` 只让 `backup` 也指向同一个列表，`raw.append(-1)` 改的就是这个列表，所以从 `backup` 看也多了 -1。这样留下的不是备份；要备份应写 `backup = raw.copy()`。
        verify: |
