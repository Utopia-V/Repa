id: py06
title: 列表：位置和一段范围
status: complete
minutes: 20
summary: 读懂列表：len 数出有几个元素，位置从 0 开始取出一个，切片包含起点、不包含终点取出一段。
prerequisites: [py03, py04]
encompassings:
  - {topic: py03, weight: 0.5}
  - {topic: py04, weight: 0.5}
sources:
  - source: think-python
    where: 第 9 章
    url: https://allendowney.github.io/ThinkPython/chap09.html
    use: reference
  - source: python-docs
    where: 教程第 3 章 §3.1.3
    url: https://docs.python.org/3.12/tutorial/introduction.html
    use: reference
notes: |
  范围：用到 py03 的整数与文字、py04 的函数调用（len 返回一个数）。只讲建立列表、len、按单个位置取值和切片。append 与原位修改留给 py36；列表的 + 和 *、sum/min/max 留给 py07；for 循环留给 py35；pandas 按位置取行和切片（iloc）留给 py16，本节统一说“位置（下标）”便于衔接。切片的步长、文字的索引与切片都不讲。越界只问会报错（ERROR），IndexError 的读法留给 py11。
  题型：预测输出（P）、找错（P）、小改代码（T）；复习和测验另用了多选、拼程序（Parsons）和只按位置计数的题。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 2 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 3 分钟、练习 4 分钟（含一道小改代码）；收束 1 分钟。
  讲解、例题和题目为本课自拟。
intro: |
  这一节读**列表**：一组按顺序排好的值，比如一次实验先后记下的几次读数。会练三件事：一共有几个、第几个是什么、取出其中一段。

  程序照旧当作短脚本从上往下运行，只有 `print` 才显示。题目问“显示什么”时，如果程序在那一行报错停下，就填 ERROR。
wrapup: |
  读到方括号，先分清三种写法：`[12, 15, 9]` 是写下一个列表；`readings[2]` 是按位置取出一个元素，位置从 0 开始数；`readings[1:3]` 是取出一段，包含起点、不包含终点，结果仍是列表。

  AI 写的代码里出现 `[0]`、`[-1]`、`[:3]` 时，先数清它取的是第几个、到哪里为止，再对照你的要求。
kps:
  - id: py06.k1
    keyPrerequisites: [py03, py04]
    title: 有序列表与 len
    card:
      name: 列表
      aliases: [list, len]
      definition: 方括号里用逗号隔开的一组值，按写入的顺序保存；len(列表) 返回其中有几个元素。
      conditions:
        - len 数的是元素个数：一个元素是一段文字，也只算 1 个；重复的值各算一个。
        - 空列表 [] 的 len 是 0；print 一个列表时，里面的文字带引号显示。
      example:
        from: py06.k1.e0
        text: |
          ```python
          readings = [12, 15, 9, 20]
          ids = ["S01", "S02", "S03"]
          print(len(readings))
          print(ids)
          ```
          显示 4 和 `['S01', 'S02', 'S03']`。
    lesson: |
      一次实验常常有好几次读数。与其起四个名字，不如把它们放进一个**列表**：

      ```python
      readings = [12, 15, 9, 20]
      ids = ["S01", "S02", "S03"]
      ```

      方括号括起来，元素之间用逗号隔开。列表按写入的顺序保存元素：不会自动排序，也不会合并重复的值。元素可以是数，也可以是[文字](repa:concept/py03.k1)。

      `len(列表)` 是一次[函数调用](repa:concept/py04.k1)，返回列表里有几个元素：`len(readings)` 是 4。它数的是元素，不是字符：`["S01", "S02", "S03"]` 有 3 个元素，每个编号自己有几个字符不影响。空列表 `[]` 的 len 是 0。

      `print` 一个列表时，会显示方括号和逗号，里面的文字带引号：`print(ids)` 显示 `['S01', 'S02', 'S03']`（代码里写的是双引号，显示成单引号，意思一样）。而 `print("S01")` 只显示 `S01`，不带引号。
    example:
      id: py06.k1.e0
      kind: [predict]
      uses: [py04.k1, py03.k1]
      body: |
        一次实验记下了四次读数和三个样本编号。阅读下面的程序。

        ```python
        readings = [12, 15, 9, 20]
        ids = ["S01", "S02", "S03"]
        print(len(readings))
        print(ids)
        ```
      slots:
        - id: count
          type: text
          format: integer
          prompt: 第一行显示哪个整数？
          key: 4
        - id: shown
          type: text
          match: output
          prompt: 第二行显示什么？照屏幕上的样子写。
          key: "['S01', 'S02', 'S03']"
      explanation: |
        第一行显示 **4**：`readings` 里有 12、15、9、20 四个元素。

        第二行显示 **['S01', 'S02', 'S03']**。print 一个列表时，会连同方括号、逗号一起显示，里面的文字带上引号，表示它们是文字；代码里写双引号，显示成单引号，是同一个意思。
      verify: |
        lines = run().lines()
        answers = {"count": int(lines[0]), "shown": lines[1]}
    practice:
      - id: py06.k1.q1
        kind: [predict]
        uses: [py04.k1, py03.k1]
        body: |
          ```python
          groups = ["control", "drug"]
          print(len(groups))
          print(len("control"))
          ```
        slots:
          - id: first
            type: text
            format: integer
            prompt: 第一行显示
            key: 2
            feedback:
              - when: 11
                message: len 用在列表上，数的是元素个数；两个组名是 2 个元素，不是把字母加起来。
          - id: second
            type: text
            format: integer
            prompt: 第二行显示
            key: 7
        explanation: |
          先显示 **2**，再显示 **7**。`groups` 是一个有两个元素的列表，len 数的是元素个数；`"control"` 本身是一段文字，len 用在文字上数的是字符，c-o-n-t-r-o-l 共 7 个。
        verify: |
          lines = run().lines()
          answers = {"first": int(lines[0]), "second": int(lines[1])}
      - id: py06.k1.q2
        kind: [predict]
        uses: [py04.k1, py03.k1]
        body: |
          ```python
          groups = ["drug", "control", "drug"]
          print(groups)
          print(len(groups))
          ```
        slots:
          - id: shown
            type: text
            match: output
            prompt: 第一行显示什么？
            key: "['drug', 'control', 'drug']"
            feedback:
              - when: "['control', 'drug', 'drug']"
                message: 列表按写入的顺序保存，不会自动排序。
              - when: "['drug', 'control']"
                message: 重复的值不会被合并，两个 drug 都还在。
          - id: count
            type: text
            format: integer
            prompt: 第二行显示
            key: 3
            feedback:
              - when: 2
                message: 两个 drug 是两个元素，各算一个。
        explanation: |
          显示 **['drug', 'control', 'drug']** 和 **3**。列表照写入的顺序保存三个元素，不排序，也不把两个 drug 合成一个；len 数到 3 个。
        verify: |
          lines = run().lines()
          answers = {"shown": lines[0], "count": int(lines[1])}
      - id: py06.k1.q3
        kind: [predict]
        uses: [py04.k1, py03.k1]
        body: |
          ```python
          a = []
          b = [0]
          c = ["", ""]
          d = ["12 15 9"]
          ```

          填写这四个列表各自的 len。
        slots:
          - id: sizes
            type: table
            columns:
              - id: name
                header: 列表
              - id: size
                header: len
                input: integer
            rows:
              - { id: a, cells: { name: "a", size: 0 } }
              - { id: b, cells: { name: "b", size: 1 } }
              - { id: c, cells: { name: "c", size: 2 } }
              - { id: d, cells: { name: "d", size: 1 } }
        explanation: |
          依次是 **0、1、2、1**。

          - `a` 是空列表，没有元素。
          - `b` 有一个元素 0。0 也是一个值，同样算一个。
          - `c` 有两个元素，都是空文字 `""`；元素里没有字符，也照样各算一个。
          - `d` 只有一个元素：引号把 `12 15 9` 整段括成了一段文字。要存三个读数，应写成 `[12, 15, 9]`。
        verify: |
          r = run()
          answers = {"sizes": {name: {"size": len(r[name])} for name in ["a", "b", "c", "d"]}}
      - id: py06.k1.q4
        uses: [py04.k1]
        kind: [debug]
        body: |
          列表里可以存重复的值。下面两行分别显示多少？len 数的是位置数，不是不同值的种类数。

          ```python
          print(len(["A", "A", "B"]))
          print(len([]))
          ```
        slots:
          - {id: repeated, type: text, format: integer, prompt: 第一行, key: 3}
          - {id: empty, type: text, format: integer, prompt: 第二行, key: 0}
        explanation: "第一个列表有三个位置，两个 A 仍分别占一个位置；空列表没有位置，所以长度是 0。"
        verify: |
          lines = run().lines()
          answers = {"repeated": int(lines[0]), "empty": int(lines[1])}
      - id: py06.k1.q5
        uses: [py04.k1, py03.k1]
        kind: [trace]
        body: |
          下面分别是一个含逗号的字符串、一个含该字符串的列表和三个元素的列表。写出三次 len 的结果。

          ```python
          print(len("A,B"))
          print(len(["A,B"]))
          print(len(["A", ",", "B"]))
          ```
        slots:
          - {id: string, type: text, format: integer, prompt: 第一行, key: 3}
          - {id: one, type: text, format: integer, prompt: 第二行, key: 1}
          - {id: three, type: text, format: integer, prompt: 第三行, key: 3}
        explanation: "文字里的逗号是一个字符；放在引号里面时，它不是列表的分隔符。因此 [\"A,B\"] 只有一个列表元素，第三行的列表才有三个元素。"
        verify: |
          lines = run().lines()
          answers = {"string": int(lines[0]), "one": int(lines[1]), "three": int(lines[2])}
    review:
      - id: py06.k1.r1
        kind: [predict]
        uses: [py04.k1, py03.k1]
        body: |
          三个采样点分别是北坡、南坡、东坡。下面哪一段程序会显示 3？
        slots:
          - id: program
            type: choice
            options:
              - id: joined
