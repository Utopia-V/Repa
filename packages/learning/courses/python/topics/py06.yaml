        explanation: |
          `ids = ["S01", "S02", "S03"]` 正确：每个编号各自加引号，用逗号隔开，放在方括号里，共 3 个元素。把三个编号写在一对引号里只有 1 个元素；不加引号会报错；不加方括号得到的是一段文字，len 为 11。
        verify: |
          def fits(code):
