    quiz:
      - id: py06.k1.x1
        kind: [explain]
        uses: [py03.k1, py04.k1]
        body: |
          要把三个样本编号 S01、S02、S03 存成一个列表 `ids`，让 `len(ids)` 是 3。哪一行写对了？
        slots:
          - id: line
            type: choice
            options:
              - id: one_text
                content: |
                  ```python
                  ids = ["S01, S02, S03"]
                  ```
                feedback: 整段放在一对引号里，列表只有 1 个元素。
              - id: no_quotes
                content: |
                  ```python
                  ids = [S01, S02, S03]
                  ```
                feedback: 编号是文字，要加引号；不加引号时 Python 把 S01 当成名字去找，会报错。
              - id: correct
                content: |
                  ```python
                  ids = ["S01", "S02", "S03"]
                  ```
              - id: plain
                content: |
                  ```python
                  ids = "S01 S02 S03"
                  ```
                feedback: 没有方括号，这是一整段文字，len 数的是 11 个字符。
