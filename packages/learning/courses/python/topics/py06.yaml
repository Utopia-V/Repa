      - id: py06.k1.x2
        kind: [debug, modify]
        uses: [py04.k1, py03.k1]
        body: |
          同事想把四次读数 12、15、9、20 存成列表，再数出有几个。可是运行后 `count` 是 1。

          请改动作答框里的代码：让 `readings` 是含这四个整数读数的列表（顺序不变），`count` 用 len 数出来，等于 4。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              readings = ["12, 15, 9, 20"]
              count = len(readings)
            solution: |
              readings = [12, 15, 9, 20]
              count = len(readings)
            rejects:
              - code: |
                  readings = ["12", "15", "9", "20"]
                  count = len(readings)
                why: 四个读数存成了文字，不是整数
              - code: |
                  readings = ["12, 15, 9, 20"]
                  count = 4
                why: 只把 count 写死成 4，列表仍只有一个元素
              - code: |
                  readings = [20, 15, 12, 9]
                  count = len(readings)
                why: 改动了读数的顺序
            tests:
              - name: 列表和个数
                expect:
                  readings: "[12, 15, 9, 20]"
                  count: "4"
        explanation: |
          ```python
          readings = [12, 15, 9, 20]
          count = len(readings)
          ```

          原来的列表只有一个元素：一整段文字 `"12, 15, 9, 20"`。把四个读数分别写成元素、不加引号，它们才是四个整数，len 才数到 4。
      - id: py06.k1.x3
        uses: [py04.k1]
        kind:
          - trace
        body: |
          列表中的文字长度不同，列表自身仍按元素个数计长。

          ```python
          print(len(["long-name", "x"]))
          print(len(["long-name"]))
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '2'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '1'
        explanation: 第一份列表有两个元素，第二份有一个。元素包含多少字符不会改变它各占一个列表位置的事实。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
  - id: py06.k2
    keyPrerequisites: [py03]
    title: 从 0 开始的索引和 -1
    card:
      name: 索引
      aliases: [下标, 位置]
      definition: 列表名[位置] 取出一个元素；位置从 0 开始数，第 n 个元素的位置是 n - 1，-1 是最后一个。
      conditions:
        - 位置超出范围会报错（IndexError）：4 个元素时，能用的位置是 0 到 3，或 -1 到 -4。
        - 取出的是元素本身，不是列表：readings[0] 是 12，不是 [12]。
      example:
        from: py06.k2.e0
        text: |
          ```python
          readings = [12, 15, 9, 20]
          print(readings[0])
          print(readings[2])
          print(readings[-1])
          ```
          依次显示 12、9、20：位置 2 是第 3 个，-1 是最后一个。
    lesson: |
      在列表名后面加方括号和位置，取出其中一个元素，例如 `readings[0]`。位置（也叫下标）**从 0 开始数**：

      | 位置 | 0 | 1 | 2 | 3 |
      |---|---:|---:|---:|---:|
      | 元素 | 12 | 15 | 9 | 20 |
      | 负数位置 | -4 | -3 | -2 | -1 |

      所以第 1 个是 `readings[0]`，第 n 个是 `readings[n - 1]`。负数从末尾倒着数：`readings[-1]` 是最后一个，`readings[-2]` 是倒数第二个。列表变长或变短时，`[-1]` 始终是最后一个；同样的意思也可以写成 `readings[len(readings) - 1]`。

      有 4 个元素时，能用的位置只有 0 到 3（或 -1 到 -4）。写 `readings[4]` 会让程序报错（IndexError）停下：位置 4 已经是“第 5 个”了。

      取出来的是元素本身：`readings[0]` 是数 12，不是只含一个元素的列表。

      这里的位置就是编程里常说的“索引”（index）。后面读数据表时，会遇到另一个也叫“索引”的东西：表的**行索引**。它是每一行的标签，不一定从 0 开始，和这里的“第几个”不是一回事，到时再分清。
    example:
      id: py06.k2.e0
      kind: [predict]
      body: |
        ```python
        readings = [12, 15, 9, 20]
        print(readings[0])
        print(readings[2])
        print(readings[-1])
        ```
      slots:
        - id: first
          type: text
          format: integer
          prompt: 第一行显示
          key: 12
        - id: second
          type: text
          format: integer
          prompt: 第二行显示
          key: 9
        - id: third
          type: text
          format: integer
          prompt: 第三行显示
          key: 20
      explanation: |
        依次显示 **12、9、20**。位置从 0 开始：`[0]` 是第 1 个 12，`[2]` 是第 3 个 9（不是第 2 个 15）；`[-1]` 从末尾数，是最后一个 20。
      verify: |
        lines = run().lines()
        answers = {"first": int(lines[0]), "second": int(lines[1]), "third": int(lines[2])}
    practice:
      - id: py06.k2.q1
        kind: [predict]
        body: |
          ```python
          readings = [12, 15, 9, 20]
          ```

          填写每一行代码显示什么。每一行都单独从上面的 `readings` 出发运行；如果会报错，填 ERROR。
        slots:
          - id: shown
            type: table
            columns:
              - id: code
                header: 代码
