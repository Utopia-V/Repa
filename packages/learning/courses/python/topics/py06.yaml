      - id: py06.k1.r3
        uses: [py04.k1]
        kind:
          - trace
        body: |
          空列表与包含一个空字符串的列表，长度并不相同。

          ```python
          print(len([]))
          print(len([""]))
          print(len(["", ""]))
          ```
        slots:
