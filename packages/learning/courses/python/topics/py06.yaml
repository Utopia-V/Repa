  - id: py06.k3
    keyPrerequisites: []
    title: 切片左闭右开
    card:
      name: 切片
      aliases: [slice, 左闭右开]
      definition: 列表名[起点:终点] 取出从起点开始、到终点之前为止的一段，结果是一个新列表，有“终点 - 起点”个元素。
      conditions:
        - 包含起点、不包含终点；省略起点就从头开始，省略终点就取到末尾。
        - 只取到一个元素也是列表（[9]，不是 9）；起点、终点超出范围不报错，只取到实际有的部分。
      example:
        from: py06.k3.e0
        text: |
          ```python
          readings = [12, 15, 9, 20]
          print(readings[1:3])
          ```
          取位置 1、2，不取位置 3，显示 [15, 9]。
    lesson: |
      方括号里写成 `起点:终点`，取出的是一段，叫**切片**。它包含起点、不包含终点（常说“左闭右开”），所以切片里有 `终点 - 起点` 个元素。

      以 `readings = [12, 15, 9, 20]` 为例：

      | 写法 | 取到的位置 | 结果 |
      |---|---|---|
      | `readings[1:3]` | 1、2 | `[15, 9]` |
      | `readings[:2]` | 0、1 | `[12, 15]` |
      | `readings[2:]` | 2、3 | `[9, 20]` |
      | `readings[-2:]` | 倒数第二个到末尾 | `[9, 20]` |

      省略起点表示从头开始，省略终点表示一直取到末尾。“前 3 个”就写 `[:3]`，“最后两个”就写 `[-2:]`。

      切片的结果总是列表：`readings[2:3]` 是 `[9]`，而[按位置取出](repa:concept/py06.k2)的 `readings[2]` 是 9。起点或终点超出范围时切片不报错，只取到实际存在的部分：`readings[2:10]` 是 `[9, 20]`。起点等于终点时什么也取不到，得到空列表 `[]`。切片是新列表，原来的 `readings` 不变。
    example:
      id: py06.k3.e0
      kind: [predict]
      body: |
        ```python
        readings = [12, 15, 9, 20]
        print(readings[1:3])
        print(readings[:2])
        print(readings[-2:])
        ```
      slots:
        - id: first
          type: text
          match: output
          prompt: 第一行显示
          key: "[15, 9]"
        - id: second
          type: text
          match: output
          prompt: 第二行显示
          key: "[12, 15]"
        - id: third
          type: text
          match: output
          prompt: 第三行显示
          key: "[9, 20]"
      explanation: |
        - `[1:3]` 取位置 1、2，不取 3，显示 **[15, 9]**，共 3 - 1 = 2 个。
        - `[:2]` 从头开始，取位置 0、1，显示 **[12, 15]**，也就是前两个。
        - `[-2:]` 从倒数第二个取到末尾，显示 **[9, 20]**，也就是最后两个。
      verify: |
        lines = run().lines()
        answers = {"first": lines[0], "second": lines[1], "third": lines[2]}
