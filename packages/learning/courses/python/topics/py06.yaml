            type: text
            format: integer
            prompt: 第三行显示
            key: 3
        explanation: |
          依次显示 **0**、**['low', 'high', 'low']**、**3**。第 2 行执行时 `labels` 还是空列表，len 为 0；第 3 行让 `labels` 改指向一个三元素的列表，照写入顺序显示，两个 low 各算一个。
        verify: |
