                  ```python
                  sites = ["北坡 南坡 东坡"]
                  print(len(sites))
                  ```
              - id: text
                content: |
                  ```python
                  sites = "北坡南坡东坡"
                  print(len(sites))
                  ```
              - id: list
                content: |
                  ```python
                  sites = ["北坡", "南坡", "东坡"]
                  print(len(sites))
                  ```
              - id: extra
                content: |
                  ```python
                  sites = ["北坡", "南坡", "东坡", ""]
                  print(len(sites))
                  ```
            key: list
        explanation: |
          把三个名字分别写成三个元素的那一段显示 3。三个名字写在同一对引号里，列表只有 1 个元素；不加方括号写成一段文字，len 数的是 6 个字；末尾多了一个空文字 `""`，它也算一个元素，共 4 个。
        verify: |
          shows_three = [option for option, code in OPTIONS["program"].items() if run(code).out.strip() == "3"]
          answers = {"program": shows_three[0] if len(shows_three) == 1 else shows_three}
      - id: py06.k1.r2
        kind: [trace, predict]
        uses: [py01.k2, py04.k1, py03.k1]
        body: |
          ```python startLine=1
          labels = []
          print(len(labels))
          labels = ["low", "high", "low"]
          print(labels)
          print(len(labels))
