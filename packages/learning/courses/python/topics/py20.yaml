      - id: py20.k2.q2
        kind: [specify]
        uses: [py12.k1]
        body: |
          转换 dose 列时，坏值清单是：`"1,5"`、`"未测"`、`"约2"`。负责人看了清单后说：

          > “1,5”是用逗号写的小数，改成 1.5 再转；“未测”就是没有数；“约2”是估计值，不能当测量用。转不了的都别参加计算，最后把失败的个数和原值列给我。

          把每个坏值的处理填进表里，再回答要不要报告。
        slots:
          - id: rules
            type: table
            columns:
              - { id: value, header: 坏值 }
              - id: action
                header: 怎样处理
                input:
                  type: choice
                  options:
                    - { id: fix, label: 修正后再转 }
                    - { id: missing, label: 记为缺失 }
            rows:
              - { id: comma, cells: { value: '"1,5"', action: fix } }
              - { id: untested, cells: { value: '"未测"', action: missing } }
              - { id: approx, cells: { value: '"约2"', action: missing } }
          - id: report
            type: choice
            prompt: 要不要报告转换失败的个数和原值？
            options:
              - { id: "no", content: 不用，缺失不参加计算就够了 }
              - { id: "yes", content: 要 }
            key: "yes"
        explanation: |
          “1,5”**修正后再转**；“未测”和“约2”**记为缺失**；**要**报告失败的个数和原值。

          “约2”能读出一个 2，但负责人说估计值不能当测量用，所以和“未测”一样记为缺失。这种判断来自业务，不能由 coerce 或写代码的人替对方决定。
        manual: [rules, report]
      - id: py20.k2.q3
        kind: [specify]
        uses: [py12.k1]
        body: |
          同事给你一张表，说：“count 列有些格写得乱七八糟，你把它转成数再求和。”

          请写一句完整的需求，让 AI 照着做时不会悄悄丢掉数据。题目没有告诉你哪些坏值能修正，需求里可以写成“交给负责人确认”。
        slots:
          - id: requirement
            type: text
            lines: 5
            rubric:
              - id: convert
                label: 转换的列与失败时的去向
                guide: 说明把 count 转成数，转不了的值记为缺失（或先停下来），并且不参加求和。
              - id: report
                label: 报告失败的个数和原值
                guide: 要求在结果里列出转换失败的个数和这些原值。
              - id: decide
                label: 修正规则由谁决定
                guide: 说明能修正的坏值按负责人确认的规则处理，或者先列出来请负责人确认；自己替对方决定修正方式不算。
        explanation: |
          一种写法：**把 count 转成数，转不了的记为缺失，不参加求和；在结果里报告转换失败的个数和每个原值；其中能修正的（例如带千分位逗号的数）先列给负责人确认，确认后再按规则修正。**

          三点各算一项。只写“把 count 转成数再求和”的需求，和直接用 coerce 一样，会把坏值悄悄丢掉。
    review:
      - id: py20.k2.r1
        kind: [trace]
        uses: [py19.k1]
        data: [plates]
        body: |
          阅读代码，回答下面的问题。

