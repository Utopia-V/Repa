  - id: py20.k2
    title: 保留坏值计数并把处理规则写进需求
    card:
      name: 坏值清单
      aliases: [转换失败, 坏值计数]
      definition: 转换后新增的缺失就是转换失败的值；先数出个数、列出原值，再按需求决定哪些修正、哪些记为缺失。
      conditions:
        - 失败个数 = 转换后的缺失数 − 转换前的缺失数。
        - 有的坏值能按规则修正（例如把小数逗号改成点），有的只能记为缺失，这要由需求方决定。
      example:
        from: py20.k2.e0
        text: |
          ```python
          num = pd.to_numeric(df["weight"], errors="coerce")
          bad = df["weight"].loc[num.isna()].dropna()
          ```
          表 D 转换前缺 1 个、转换后缺 3 个，失败 2 个：“未称”和“10,2”。
    lesson: |
      coerce 不会告诉你丢了什么，那就自己数。转换后多出来的缺失，就是转换失败的值：

      ```python
      num = pd.to_numeric(df["weight"], errors="coerce")
      before = df["weight"].isna().sum()
      after = num.isna().sum()
      bad = df["weight"].loc[num.isna()].dropna()
      ```

      - `before` 是 1：S_C 原本就空着；`after` 是 3。两者相减，**转换失败 2 个**。
      - `df["weight"].loc[num.isna()]` 取出转换后成了缺失的那些**原值**，再用 `dropna()` 去掉原本就空着的，剩下的就是**坏值清单**：“未称”“10,2”。

      有了清单，才能作出有根据的决定：“10,2”多半是用逗号写的小数 10.2，可以先把逗号换成点再转；“未称”确实没有数，只能记为缺失。哪些能修、怎样修，是需求方的决定，不是 coerce 替你做的。

      把这些写进需求，别人照做时就不会悄悄丢数据：

      > 把 weight 转成数：写成小数逗号的，先把逗号改成点；其余转不了的记为缺失，不参加计算；在结果里报告转换失败的个数和原值。

      拿到 AI 写的转换代码时，也按这三件事核对：失败的值去了哪里；有没有数出来；有没有列出原值给人看。
    example:
      id: py20.k2.e0
      kind: [trace]
      data: [D]
      body: |
        阅读代码，回答下面的问题。

        ```python
        num = pd.to_numeric(df["weight"], errors="coerce")
        before = df["weight"].isna().sum()
        after = num.isna().sum()
        bad = df["weight"].loc[num.isna()].dropna()
        ```
      slots:
        - id: before
          type: text
          format: integer
          prompt: "`before` 是多少？"
          key: 1
        - id: after
          type: text
          format: integer
          prompt: "`after` 是多少？"
          key: 3
        - id: failed
          type: text
          format: integer
          prompt: 转换失败了几个值？
          key: 2
        - id: bad
          type: order
          partial: true
          prompt: "`bad` 里有哪些原值？按先后顺序排列。"
          items:
            - { id: a, content: "`\"12.5\"`" }
            - { id: b, content: "`\"8\"`" }
            - { id: c, content: "`\"未称\"`" }
            - { id: d, content: "`\"10,2\"`" }
            - { id: e, content: "`\" 9.5 \"`" }
          key: [c, d]
      explanation: |
        `before` 是 **1**（S_C），`after` 是 **3**，转换失败 **2** 个。`bad` 依次是 **“未称”“10,2”**：先取出转换后成了缺失的原值（NaN、“未称”“10,2”），再用 `dropna()` 去掉原本就空着的 NaN。

        看到清单，就能和需求方商量：“10,2”可以改成 10.2 再转，“未称”记为缺失。
      verify: |
        r = run()
        ids = {"12.5": "a", "8": "b", "未称": "c", "10,2": "d", " 9.5 ": "e"}
        answers = {
            "before": int(r["before"]),
            "after": int(r["after"]),
            "failed": int(r["after"] - r["before"]),
            "bad": [ids[value] for value in r["bad"]],
        }
    practice:
      - id: py20.k2.q1
        kind: [predict]
        uses: [py19.k1, py19.k3]
        data: [D2]
        body: |
          阅读代码，写出两行输出。

