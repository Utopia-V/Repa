kps:
  - id: py20.k1
    title: to_numeric 的失败与 errors="coerce"
    card:
      name: to_numeric 转数字
      aliases: [to_numeric, coerce, 文字转数字]
      definition: pd.to_numeric(列) 把一列文字逐个转成数；有一个转不了就报 ValueError，加 errors="coerce" 则把转不了的变成 NaN。
      conditions:
        - 前后的空格不影响；“未称”“10,2”“1,200”这类写法转不了。
        - coerce 不会提示丢了哪些值，转换前后要数一数缺失。
        - 旧代码里的 errors="ignore" 在 pandas 3 里会报 ValueError。
      example:
        from: py20.k1.e0
        text: |
          ```python
          num = pd.to_numeric(df["weight"], errors="coerce")
          ```
          表 D 的 weight 依次为 "12.5"、"8"、NaN、"未称"、"10,2"、" 9.5 "，num 依次为 12.5、8.0、NaN、NaN、NaN、9.5。
    lesson: |
      表 D 的 weight 看起来是一列重量，但有人写了“未称”，还有一格写成了“10,2”，所以整列读进来是**文字**。文字不能直接相加：`"12.5" + "8"` 得到 `"12.58"`，是把两段字接起来。要计算，先转成数。

      学过的 `float("12.5")` 一次转一个值；`pd.to_numeric` 是整列版，逐个把文字转成数：

      ```python
      num = pd.to_numeric(df["weight"])
      ```

      这一行会报错：`ValueError: Unable to parse string "未称" at position 3`。信息里写明了第一个转不了的值是“未称”，它在第 3 个位置（从 0 数起，和原行索引无关）。整列转换要么全部成功，要么一个也不转。

      加上 `errors="coerce"`，转不了的值变成 NaN，其余照常转换：

      ```python
      num = pd.to_numeric(df["weight"], errors="coerce")
      ```

      | 原行索引 | weight（文字） | num |
      |---:|---|---:|
      | 31 | `"12.5"` | 12.5 |
      | 7 | `"8"` | 8.0 |
      | 22 | NaN | NaN |
      | 4 | `"未称"` | NaN |
      | 18 | `"10,2"` | NaN |
      | 9 | `" 9.5 "` | 9.5 |

      前后的空格不影响转换；“未称”是字，“10,2”用逗号当小数点，都转不了。结果是一列浮点数，原本空着的 S_C 仍是 NaN。

      coerce 很安静：它不提示任何东西。“10,2”本来是一次真实的称重，现在和“未称”一样成了 NaN。所以用 coerce 之后，一定要看看丢了什么，这是下一个知识点。

      另外两种常见写法：`df["weight"].astype(float)` 和 `float()` 一样，遇到转不了的值就报错；旧代码里的 `errors="ignore"` 在 pandas 3 里已经去掉了，会报 ValueError。
    example:
      id: py20.k1.e0
      kind: [trace]
      data: [D]
      body: |
        阅读代码，按原行索引填写 `num` 的值。转成缺失的格填 `NaN`。

        ```python
        num = pd.to_numeric(df["weight"], errors="coerce")
        ```
      slots:
        - id: num
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: weight, header: weight（文字） }
            - { id: num, header: num, input: { type: text, format: number, quick: [NaN] } }
          rows:
            - { id: r31, cells: { index: "31", weight: '"12.5"', num: 12.5 } }
            - { id: r7, cells: { index: "7", weight: '"8"', num: 8 } }
            - { id: r22, cells: { index: "22", weight: NaN, num: NaN } }
            - { id: r4, cells: { index: "4", weight: '"未称"', num: NaN } }
            - { id: r18, cells: { index: "18", weight: '"10,2"', num: NaN } }
            - { id: r9, cells: { index: "9", weight: '" 9.5 "', num: 9.5 } }
        - id: dtype
          type: choice
          prompt: "`num` 是什么类型？"
          options:
            - { id: str, content: 文字（str） }
            - { id: float, content: 浮点（float64） }
            - { id: int, content: 整数（int64） }
          key: float
      explanation: |
        `num` 依次为 **12.5、8.0、NaN、NaN、NaN、9.5**，类型是**浮点（float64）**。

        “8”转成 8.0：这一列有缺失，整列存成浮点。“ 9.5 ”前后的空格不影响。索引 22 原本就空着，仍是 NaN；“未称”和“10,2”转不了，被 coerce 变成了 NaN。
      verify: |
        num = run()["num"]
        answers = {
            "num": {f"r{label}": {"num": "NaN" if pd.isna(value) else value} for label, value in num.items()},
            "dtype": {"f": "float", "i": "int"}.get(num.dtype.kind, "str"),
        }
    practice:
      - id: py20.k1.q1
        kind: [debug]
        uses: [py11.k2, py16.k2]
        data: [D]
        body: |
          阅读代码。

          ```python
          num = pd.to_numeric(df["weight"])
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行这一行会怎样？
            options:
              - { id: nan, content: 转不了的值变成 NaN，其余转成数 }
              - { id: error, content: 报 ValueError，num 没有得到值 }
              - { id: text, content: 不报错，num 仍是原来的文字 }
            key: error
          - id: value
            type: choice
            prompt: 报错信息里点名的是哪个值？
            options:
              - { id: v12, content: "`\"12.5\"`" }
              - { id: vnone, content: S_C 的 NaN }
              - { id: vunk, content: "`\"未称\"`" }
              - { id: vcomma, content: "`\"10,2\"`" }
            key: vunk
          - id: position
            type: text
            format: integer
            prompt: 信息里说它在第几个位置（position 后面的数）？
            key: 3
        explanation: |
          报 **ValueError**：`Unable to parse string "未称" at position 3`。不加 coerce 时，遇到第一个转不了的值就停下，整列一个也不转。

          点名的是 **“未称”**，它是第一个转不了的值；“10,2”排在它后面，还没轮到。position 是 **3**：从 0 数起的位置（依次是 "12.5"、"8"、NaN、"未称"），不是原行索引 4。原本空着的 S_C 不算转换失败。
        verify: |
          r = run()
          names = {"v12": "12.5", "vnone": "nan", "vunk": "未称", "vcomma": "10,2"}
          named = [option for option, text in names.items() if f'"{text}"' in (r.message or "")]
          position = int(r.message.rsplit("position", 1)[1].strip())
          answers = {
              "outcome": "error" if r.error == "ValueError" else "other",
              "value": named[0] if len(named) == 1 else named,
              "position": position,
          }
      - id: py20.k1.q2
        kind: [predict]
        uses: [py03.k2]
        body: |
          下面每个文字单独放进一列，再用 `pd.to_numeric(..., errors="coerce")` 转换。哪些能转成数（不是 NaN）？选出所有能转的。
        slots:
          - id: ok
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: dec, content: "`\"3.5\"`" }
              - { id: spaced, content: "`\" 42 \"`（前后各有一个空格）" }
              - { id: thousands, content: "`\"1,200\"`" }
              - { id: unit, content: "`\"12mg\"`" }
              - { id: negative, content: "`\"-7\"`" }
              - { id: na_text, content: "`\"N/A\"`" }
            key: [dec, spaced, negative]
        explanation: |
          **"3.5"、" 42 "、"-7"** 能转：前后的空格和负号都没问题。

          "1,200" 里的逗号、"12mg" 里的单位、"N/A" 这几个字，都让它转不了，coerce 会把它们变成 NaN。其中 "1,200" 和 "12mg" 本来是有意义的数，如果直接 coerce，就丢了真实的值。
        verify: |
          values = {"dec": "3.5", "spaced": " 42 ", "thousands": "1,200", "unit": "12mg", "negative": "-7", "na_text": "N/A"}
          answers = {"ok": [option for option, text in values.items()
                            if pd.to_numeric(pd.Series([text]), errors="coerce").notna().iloc[0]]}
      - id: py20.k1.q3
        kind: [modify, debug]
        uses: [py11.k2]
        data: [D]
        body: |
          需求是：

          > 把 weight 转成数，转不了的当作缺失、不计入；算出总重量 `total`。不改变 `df`。

          作答框里是从一篇旧教程抄来的代码，在课程的 pandas 版本里一运行就报 ValueError。请改动它并提交，最终结果变量仍叫 `total`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              num = pd.to_numeric(df["weight"], errors="ignore")
              total = num.sum()
            solution: |
              num = pd.to_numeric(df["weight"], errors="coerce")
              total = num.sum()
            accepts:
              - total = pd.to_numeric(df["weight"], errors="coerce").sum()
              - total = pd.to_numeric(df["weight"], errors="coerce").fillna(0).sum()
            rejects:
              - code: |
                  num = pd.to_numeric(df["weight"])
                  total = num.sum()
                why: 不加 coerce，遇到转不了的值就报错
              - code: |
                  num = df["weight"].astype(float)
                  total = num.sum()
                why: astype(float) 遇到转不了的值同样报错
              - code: total = df["weight"].sum()
                why: 文字直接求和，得到的是首尾相接的一串字
              - code: total = 30.0
                why: 照着这张表写死了结果
            tests:
              - name: 表 D
                expect:
                  total: "30.0"
                  df: df
              - name: 换一份记录
                hidden: true
                data: [D2]
                expect:
                  total: "7.5"
                  df: df
              - name: 每格都能转换的记录
                hidden: true
                data: [D3]
                expect:
                  total: "6.5"
                  df: df
        explanation: |
          ```python
          num = pd.to_numeric(df["weight"], errors="coerce")
          total = num.sum()
          ```

          `errors="ignore"` 是旧版 pandas 的写法，pandas 3 已经去掉了它，传进去就报 ValueError。按需求“转不了的当作缺失”，应改成 `errors="coerce"`。求和时缺失不计入，本例总重量是 12.5 + 8 + 9.5 = 30.0。判分时还会换两份记录运行。
    review:
      - id: py20.k1.r1
        kind: [trace]
        uses: [py19.k1]
        data: [readings]
        body: |
          阅读代码，按原行索引填写 `t` 的值。转成缺失的格填 `NaN`。

          ```python
          t = pd.to_numeric(readings["temp"], errors="coerce")
          ```
        slots:
          - id: t
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: temp, header: temp（文字） }
              - { id: t, header: t, input: { type: text, format: number, quick: [NaN] } }
            rows:
              - { id: r1, cells: { index: "1", temp: '"21.5"', t: 21.5 } }
              - { id: r2, cells: { index: "2", temp: '"-"', t: NaN } }
              - { id: r3, cells: { index: "3", temp: '"19"', t: 19 } }
              - { id: r4, cells: { index: "4", temp: '"error"', t: NaN } }
              - { id: r5, cells: { index: "5", temp: '"20.0"', t: 20 } }
          - id: missing
            type: text
            format: integer
            prompt: "`t.isna().sum()` 是多少？"
            key: 2
        explanation: |
          `t` 依次为 **21.5、NaN、19.0、NaN、20.0**，有 **2** 个缺失。单独一个减号和“error”都不是数，被 coerce 变成 NaN；“19”和“20.0”都转成浮点。
        verify: |
          t = run()["t"]
          answers = {
              "t": {f"r{label}": {"t": "NaN" if pd.isna(value) else value} for label, value in t.items()},
              "missing": int(t.isna().sum()),
          }
      - id: py20.k1.r2
        kind: [debug]
        uses: [py11.k2, py03.k2]
        body: |
          宿主先运行了这一行：

          ```python
          s = pd.Series(["5", "n.d.", "7"])
          ```

          下面每一行都单独接在它后面运行。哪几行会报错？选出所有会报错的。
        slots:
          - id: errors
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: plain, content: "`num = pd.to_numeric(s)`" }
              - { id: coerce, content: "`num = pd.to_numeric(s, errors=\"coerce\")`" }
              - { id: astype, content: "`num = s.astype(float)`" }
              - { id: ignore, content: "`num = pd.to_numeric(s, errors=\"ignore\")`" }
            key: [plain, astype, ignore]
