        explanation: |
          第一行 **2**：转换后缺 3 个，转换前缺 1 个（X_D），失败 2 个。第二行 **['n/a', '2,5']**：转换后成了缺失的原值是 “n/a”、NaN、“2,5”，`dropna()` 去掉原本就空着的那个。

          “2,5”多半是小数 2.5，值得问一句要不要修正；“n/a”是没有数。
