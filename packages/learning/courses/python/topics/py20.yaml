id: py20
title: 把文字转成数字时怎样处理坏值
status: complete
minutes: 20
summary: 用 pd.to_numeric 把文字列转成数；读懂转换失败的报错，用 errors="coerce" 把坏值变成缺失，并数清、列出坏值，把处理规则写进需求。
prerequisites:
  - topic: py19
    key: true
    weight: 0.67
    covers: [py19.k1, py19.k3]
  - topic: py03
    key: true
    weight: 0.33
    covers: [py03.k1, py03.k2]
  - topic: py11
    key: false
    weight: 0.50
    covers: [py11.k2]
sources:
  - source: pandas-docs
    where: API：pandas.to_numeric
    url: https://pandas.pydata.org/docs/reference/api/pandas.to_numeric.html
    use: reference
  - source: pydata-book
    where: 第 7 章 §7.1（转坏值后的缺失处理）
    url: https://wesmckinney.com/book/data-cleaning
    use: reference
notes: |
  建议题型与判分：追踪变量（P）、小改代码（T）、写清需求（S/O）。
  范围：只讲 pd.to_numeric 的默认行为（报错）和 errors="coerce"，以及转换前后数缺失、列出坏值。不讲用 str.replace 修正坏值的代码（py05、py24），修正只作为需求里的规则出现；不建新列（py21 不是先修），转换结果存成单独的名字。py18 不是先修，坏值清单用 loc[掩码] 再 dropna 取出，不用 &。
  pandas 3 已经去掉 errors="ignore"，传入时报 ValueError；AI 或旧教程的代码里常见，讲解点一句，复习题里出现一次。
  课程运行时里，前后带空格的数字能转换，空串会直接转成 NaN（不算失败）；为了不把“空串算不算失败”带进本节，表里的空格都写成缺失（None）。
  文字列在 pandas 的表格显示里看不出引号和首尾空格，主表用 python 夹具自己画表，每格加引号。
  k2 的规则判断题在复习和测验各有一道列进 manual，由 course:confirm 核对；其余由程序核对。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、三道练习 5 分钟；k2 讲解与例题 4 分钟、三道练习 5 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  从表格软件或仪器导出的数据，常有一列“看起来是数，其实是文字”：有人在格子里写了“未称”，有人把 10.2 写成了“10,2”。这一节学怎样把这样的列转成数，又不让写坏的值悄悄消失。

  宿主已经导入了 pandas（`pd`）和 NumPy（`np`），并准备好数据表；每道题都从题面给出的表重新开始。有的题用 `pd.Series([…])` 直接造出一列值，方括号里是各格的内容；`.mean()` 求一列的平均值。
wrapup: |
  把文字列转成数时，先不加 `errors="coerce"` 试一次：报错信息会告诉你第一个转不了的值。决定用 coerce 以后，转换前后各数一次缺失，把多出来的那些原值列出来，交给需求方决定哪些能修正、哪些记为缺失。

  向同事或 AI 提需求时，可以这样说：“把 weight 转成数；写成小数逗号的先把逗号改成点；其余转不了的记为缺失，不参加计算；在结果里报告转换失败的个数和原值。”
