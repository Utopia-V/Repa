      - id: py20.k2.r2
        kind: [specify]
        uses: [py12.k1]
        body: |
          负责人确认的规则是：“把 od 转成数；转不了的记为缺失，不参加计算；在结果里报告转换失败的个数和原值。”下面哪一种做法与它完全一致？
