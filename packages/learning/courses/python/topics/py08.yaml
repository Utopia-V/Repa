    quiz:
      - id: py08.k2.x1
        kind: [specify]
        body: |
          同事写了 `keep = depth < 30`，你怀疑应该是 `keep = depth <= 30`。你打算拿一组 depth 值，把两种写法各运行一遍，看结果有没有不同。
        slots:
          - id: group
            type: choice
            prompt: 用哪一组值，才能看出两种写法的差别？
            options:
              - { id: low, content: 10、20 }
              - { id: around, content: 29、30、31 }
              - { id: spread, content: 25、35 }
              - { id: high, content: 40、50 }
            key: around
          - id: value
            type: text
            format: integer
            prompt: 这一组里，哪个值让两种写法的结果不同？
            key: 30
        explanation: |
          用 **29、30、31** 这一组，起作用的是 **30**：`depth < 30` 得 False，`depth <= 30` 得 True。其他几组里没有恰好等于 30 的值，两种写法给出的结果完全一样，看不出差别。
        verify: |
          groups = {"low": [10, 20], "around": [29, 30, 31], "spread": [25, 35], "high": [40, 50]}
          def differs(depth):
              return run("keep = depth < 30", depth=depth)["keep"] != run("keep = depth <= 30", depth=depth)["keep"]
          fits = [name for name, values in groups.items() if any(differs(depth) for depth in values)]
          values = [depth for depth in groups[fits[0]] if differs(depth)] if len(fits) == 1 else fits
          answers = {"group": fits[0] if len(fits) == 1 else fits, "value": values[0] if len(values) == 1 else values}
