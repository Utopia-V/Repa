      - id: py08.k2.q3
        kind: [modify]
        uses: [py01.k1]
        body: |
          需求是：

          > signal **至少达到** limit 的样本算达标，`passed` 存下 True 或 False。limit 换成别的值时，代码仍按这条规则工作。

          同事写的代码在作答框里。宿主已经给 `signal` 和 `limit` 赋好了值。请改正它并提交，结果仍存在 `passed` 里。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              passed = signal > limit
            solution: |
              passed = signal >= limit
            accepts:
              - passed = limit <= signal
            rejects:
              - code: passed = signal >= 10
                why: 把阈值写死成 10
              - code: passed = signal == limit
                why: 只有恰好等于阈值才算达标
              - code: passed = signal <= limit
                why: 方向反了
              - code: print(signal >= limit)
                why: 只显示了结果，没有存进 passed
            tests:
              - name: 恰好等于阈值
                setup: |
                  signal = 10
                  limit = 10
                expect:
                  passed: "True"
              - name: 高于阈值
                hidden: true
                setup: |
                  signal = 12
                  limit = 10
                expect:
                  passed: "True"
              - name: 低于阈值
                hidden: true
                setup: |
                  signal = 9
                  limit = 10
                expect:
                  passed: "False"
              - name: 换一个阈值，恰好相等
                hidden: true
                setup: |
                  signal = 15
                  limit = 15
                expect:
                  passed: "True"
              - name: 换一个阈值，低于它
                hidden: true
                setup: |
                  signal = 14
                  limit = 15
                expect:
                  passed: "False"
        explanation: |
          ```python
          passed = signal >= limit
          ```

          “至少达到”包含恰好等于 limit 的情况，要用 `>=`。写成 `limit <= signal` 意思相同，也对。判分时会换几组 signal 和 limit 运行你的代码，其中一定有恰好等于阈值的一组。
