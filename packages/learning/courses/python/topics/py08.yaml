id: py08
title: 比较得到 True 或 False
status: complete
minutes: 20
summary: 读懂比较：==、!=、<、>、<=、>= 得到 True 或 False；把“至少”“超过”这类说法落实成比较符，并用恰好等于阈值的值检查。
prerequisites:
  - topic: py03
    key: true
    weight: 0.33
    covers: [py03.k1]
  - topic: py02
    key: false
    weight: 0.33
    covers: [py02.k1]
sources:
  - source: think-python
    where: 第 5 章 条件部分
    url: https://allendowney.github.io/ThinkPython/chap05.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.1
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
  - source: python-docs
    where: 教程第 5 章 §5.7
    url: https://docs.python.org/3.12/tutorial/datastructures.html
    use: reference
notes: |
  范围：只比较两个单独的值（整数、小数、文字），结果存进名字或用 print 显示。and/or/not 在 py09，if 在 py10，整列比较得到布尔掩码在 py17；浮点数相等的坑（0.1 + 0.2 == 0.3）和 is 不在本节。py12（不写代码的需求课）讲过同样的边界思想，但它不是本 topic 的先修，这里用 Python 的写法重新讲一遍，不引用它的概念。
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）。把日常说法对应到比较符的作答位程序算不出答案，列在 manual 里，复习和测验里的这类作答位由 course:confirm 让模型独立再解核对；其余答案由 verify 独立算出，小改代码题按测试判。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 5 分钟；k2 讲解与例题 3 分钟、练习 5 分钟；收束 2 分钟。
  讲解、例题和题目为本课自拟。
intro: |
  这一节读的是“比较”：拿两个值比一比，结果只有两种，`True`（成立）或 `False`（不成立）。

  后面按条件做事、从表格里挑出符合要求的行，都从这一步开始。程序仍当作一段短脚本，从第一行往下运行，只有 `print` 才在屏幕上显示。
wrapup: |
  读到一个比较，先认比较符：两个等号 `==` 才是比较，带等号的 `>=`、`<=` 包含阈值本身。

  提需求时，把“至少”“超过”说清楚恰好等于阈值算不算；拿到代码后，用一个恰好等于阈值的值试一下，看结果是不是你要的。
kps:
  - id: py08.k1
    title: ==、!=、大小比较的结果
    card:
      name: 比较
      aliases: [比较符, 布尔值, True/False]
      definition: 用 ==、!=、<、>、<=、>= 比较两个值，结果是 True（成立）或 False（不成立）；这个结果也是一个值，可以存进名字，也可以用 print 显示。
      conditions:
        - "`=` 是赋值，`==` 才是比较两边是否相等。"
        - 两边有算式时，先算完算式再比较。
        - 数和文字不相等：`10 == "10"` 是 False；文字和数比大小会报 TypeError。
      example:
        from: py08.k1.e0
        text: |
          ```python
          signal = 12
          limit = 10
          passed = signal >= limit
          print(passed)
          ```
          第 3 行先算出比较的结果 True，再让 `passed` 指向它；最后显示 True。
    lesson: |
      比较两个值时，结果只有两种：`True`（成立）或 `False`（不成立）。

      | 写法 | 读作 | 例子 | 结果 |
      |---|---|---|---|
      | `==` | 等于 | `10 == 10` | True |
      | `!=` | 不等于 | `10 != 12` | True |
      | `>` | 大于 | `9 > 10` | False |
      | `<` | 小于 | `9 < 10` | True |
      | `>=` | 大于或等于 | `10 >= 10` | True |
      | `<=` | 小于或等于 | `12 <= 10` | False |

      True 和 False 也是值，可以像数一样存进名字。`passed = signal >= limit` 仍按[赋值](repa:concept/py01.k1)来读：先算右边的比较，得到 True 或 False，再让 `passed` 指向它。`print(passed)` 就显示 True 或 False。

      三处容易读错：

      - 一个等号 `=` 是赋值，两个等号 `==` 才是比较。
      - 两边有算式时，先把算式算完再比较：`4 + 6 >= 10` 先得到 10，再比较，结果是 True。
      - 值的类别会影响比较（见[三类值](repa:concept/py03.k1)）：数 10 和文字 `"10"` 不相等，`10 == "10"` 是 False；拿文字和数比大小，例如 `"10" < 9`，会报 TypeError。文字比较区分大小写，`"Drug" == "drug"` 是 False。整数和小数按数值比，`3 == 3.0` 是 True。
    example:
      id: py08.k1.e0
      kind: [predict]
      uses: [py01.k1]
      body: |
        阅读程序，写出两行输出，再说说 `passed` 指向的是什么。

        ```python startLine=1
        signal = 12
        limit = 10
        passed = signal >= limit
        print(passed)
        print(signal == limit)
        ```
      slots:
        - id: line1
          type: text
          match: output
          prompt: 第一行输出
          key: "True"
        - id: line2
          type: text
          match: output
          prompt: 第二行输出
          key: "False"
        - id: kind
          type: choice
          prompt: 第 3 行执行后，`passed` 指向什么？
          options:
            - { id: number, content: 数字 12 }
            - { id: truth, content: 比较的结果 True }
            - { id: text, content: "文字 `\"signal >= limit\"`" }
          key: truth
      explanation: |
        依次显示 **True**、**False**。

        第 3 行先算右边：12 大于或等于 10，成立，得到 True；再让 `passed` 指向这个 True。它存的是比较的结果，不是 12，也不是那段写法本身。第 5 行比较 12 和 10 是否相等，不相等，显示 False。
      verify: |
        r = run()
        lines = r.lines()
        kinds = {bool: "truth", int: "number", str: "text"}
        answers = {"line1": lines[0], "line2": lines[1], "kind": kinds[type(r["passed"])]}
    practice:
      - id: py08.k1.q1
        kind: [predict]
        uses: [py02.k1, py03.k1]
        body: |
          下面每一行都是一个比较。逐行写出它的结果是 True 还是 False。

          ```python startLine=1
          7 != 7
          5 + 5 == 10
          "drug" == "Drug"
          3 == 3.0
          12 <= 9
          ```
        slots:
          - id: results
            type: table
            columns:
              - { id: line, header: 比较 }
              - { id: value, header: 结果, input: bool }
            rows:
              - { id: l1, cells: { line: 第 1 行, value: false } }
              - { id: l2, cells: { line: 第 2 行, value: true } }
              - { id: l3, cells: { line: 第 3 行, value: false } }
              - { id: l4, cells: { line: 第 4 行, value: true } }
              - { id: l5, cells: { line: 第 5 行, value: false } }
        explanation: |
          依次为 **False、True、False、True、False**。

          - 第 1 行：7 等于 7，所以“不等于”不成立。
          - 第 2 行：先算 5 + 5 得 10，再比较，成立。
          - 第 3 行：大小写不同的两段文字不相等。
          - 第 4 行：整数 3 和小数 3.0 按数值比较，相等。
          - 第 5 行：12 不小于或等于 9。
        verify: |
          shown = {"True": True, "False": False}
          answers = {"results": {f"l{i}": {"value": shown[text]} for i, text in enumerate(repl(), 1)}}
      - id: py08.k1.q2
        kind: [debug, predict]
        uses: [py01.k1]
        body: |
          下面的程序想显示“signal 是否等于 limit”，应当显示 True 或 False。

          ```python startLine=1
          signal = 12
          limit = 10
          signal = limit
          print(signal)
          ```
        slots:
          - id: output
            type: text
            format: integer
            prompt: 程序实际显示什么？
            key: 10
          - id: fix
            type: choice
            prompt: 把第 3、4 行换成下面哪一行，才能显示 signal 是否等于 limit？
            options:
              - id: keyword
                content: |
                  ```python
                  print(signal = limit)
                  ```
                feedback: 括号里的 `signal = limit` 不是比较；这一行运行时会报错。
              - id: always
                content: |
                  ```python
                  print(limit == limit)
                  ```
                feedback: limit 总是等于它自己，这一行无论 signal 是多少都显示 True。
              - id: compare
                content: |
                  ```python
                  print(signal == limit)
                  ```
            key: compare
        explanation: |
          实际显示 **10**。第 3 行只有一个等号，是赋值：它让 `signal` 改为指向 limit 的值 10，没有做任何比较，第 4 行显示的就是这个 10。

          要比较，写两个等号：`print(signal == limit)`，这里显示 False。`print(signal = limit)` 会报错；`print(limit == limit)` 永远显示 True，和 signal 无关。
        verify: |
          r = run()
          fits = []
          for option, code in OPTIONS["fix"].items():
              # 用两组值试：一组不相等、一组相等，显示的都要是 signal == limit 的结果。
              ok = True
              for signal, limit in [(12, 10), (10, 10)]:
                  attempt = run(f"signal = {signal}\nlimit = {limit}\n" + code)
                  if attempt.error is not None or attempt.out.strip() != str(signal == limit):
                      ok = False
              if ok:
                  fits.append(option)
          answers = {"output": int(r.out), "fix": fits[0] if len(fits) == 1 else fits}
      - id: py08.k1.q3
        kind: [predict]
        uses: [py03.k1, py03.k2]
        body: |
          `count` 是数，`label` 是从表单里读进来的文字。

          ```python startLine=1
          count = 10
          label = "10"
          print(count == label)
          print(count != label)
          print(count == int(label))
          ```
        slots:
          - id: line1
            type: text
            match: output
            prompt: 第一行输出
            key: "False"
            feedback:
              - when: "True"
                message: label 有引号，是文字；数 10 和文字 "10" 不相等。
          - id: line2
            type: text
            match: output
            prompt: 第二行输出
            key: "True"
          - id: line3
            type: text
            match: output
            prompt: 第三行输出
            key: "True"
          - id: extra
            type: choice
            prompt: 如果在最后再加一行 `print(label < 9)`，这一行会怎样？
            options:
              - { id: "true", content: 显示 True }
              - { id: error, content: 报错 }
              - { id: "false", content: 显示 False }
            key: error
        explanation: |
          依次显示 **False、True、True**。

          `label` 指向的是文字 `"10"`，它和数 10 不相等，所以 `==` 得 False、`!=` 得 True。`int(label)` 先把文字转成数 10，再比较就相等了。

          拿文字和数比大小（`label < 9`）会报 TypeError：Python 不替你决定按数还是按文字比较。
        verify: |
          r = run()
          lines = r.lines()
          extra = run(CODE + "\nprint(label < 9)")
          answers = {
              "line1": lines[0],
              "line2": lines[1],
              "line3": lines[2],
              "extra": "error" if extra.error else extra.lines()[-1].lower(),
          }
    review:
      - id: py08.k1.r1
        kind: [debug]
        uses: [py01.k1]
        body: |
          `signal` 和 `limit` 已经有值。要让 `same` 存下“signal 是否恰好等于 limit”的结果（True 或 False），并且不改变 `signal` 和 `limit`，应当写哪一行？
        slots:
          - id: line
            type: choice
            options:
              - id: chain
                content: |
                  ```python
                  same = signal = limit
                  ```
              - id: opposite
                content: |
                  ```python
                  same = signal != limit
                  ```
              - id: undefined
                content: |
                  ```python
                  same == signal == limit
                  ```
              - id: store
                content: |
                  ```python
                  same = signal == limit
                  ```
            key: store
        explanation: |
          `same = signal == limit` 正确：先算右边的比较，得到 True 或 False，再让 `same` 指向它。

          `same = signal = limit` 里没有比较，它让 `same` 和 `signal` 都指向 limit 的值，还改掉了 signal；`same == signal == limit` 开头就用到还没有值的 `same`，会报错；`same = signal != limit` 存下的是“不相等”，正好相反。
        verify: |
          fits = []
          for option, code in OPTIONS["line"].items():
              ok = True
              for signal, limit in [(12, 10), (10, 10)]:
                  attempt = run(code, signal=signal, limit=limit)
                  if attempt.error or attempt.vars.get("same") is not (signal == limit) or attempt["signal"] != signal:
                      ok = False
              if ok:
                  fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py08.k1.r2
        kind: [predict]
        uses: [py03.k1]
        body: |
          写出三个 `print` 各显示什么。如果某一行会报错，那一格填 ERROR。

          ```python startLine=1
          site = "North"
          depth = 30
          print(site == "north")
          print(depth != 30)
          print(depth >= "25")
          ```
        slots:
          - id: first
            type: text
            match: output
            prompt: 第 3 行显示
            key: "False"
          - id: second
            type: text
            match: output
            prompt: 第 4 行显示
            key: "False"
          - id: third
            type: text
            match: output
            prompt: 第 5 行显示
            key: ERROR
        explanation: |
          依次是 **False、False、ERROR**。

          第 3 行：`"North"` 和 `"north"` 大小写不同，不相等。第 4 行：depth 就是 30，“不等于 30”不成立。第 5 行：`"25"` 带引号，是文字，拿数和文字比大小会报 TypeError。
        verify: |
          shown = repl()
          answers = {"first": shown[2], "second": shown[3], "third": shown[4]}
    quiz:
      - id: py08.k1.x1
        kind: [trace]
        uses: [py01.k2]
        body: |
          填写第 2–4 行各自执行后 `dose_mg` 与 `ok` 的值。

          ```python startLine=1
          dose_mg = 5
          ok = dose_mg <= 4
          dose_mg = dose_mg - 1
          ok = dose_mg <= 4
          ```
        slots:
          - id: trace
            type: table
            columns:
              - { id: line, header: 执行到 }
              - { id: dose_mg, header: dose_mg, input: integer }
              - { id: ok, header: ok, input: bool }
            rows:
              - { id: l2, cells: { line: 第 2 行, dose_mg: 5, ok: false } }
              - { id: l3, cells: { line: 第 3 行, dose_mg: 4, ok: false } }
              - { id: l4, cells: { line: 第 4 行, dose_mg: 4, ok: true } }
        explanation: |
          | 执行到 | dose_mg | ok |
          |---|---:|---|
          | 第 2 行 | 5 | False |
          | 第 3 行 | 4 | False |
          | 第 4 行 | 4 | True |

          `ok` 存的是比较那一刻的结果。第 3 行把 dose_mg 改成 4 时，`ok` 不会跟着重新比较，仍是第 2 行算出的 False；第 4 行再比较一次，才变成 True。
        verify: |
          states = trace(names=["dose_mg", "ok"])
          answers = {"trace": {f"l{i}": {"dose_mg": state["dose_mg"], "ok": state["ok"]} for i, state in enumerate(states, 1) if i >= 2}}
      - id: py08.k1.x2
        kind: [debug, predict]
        uses: [py03.k1, py03.k2]
        body: |
          `reading` 是从仪器导出的文字。

          ```python startLine=1
          reading = "15"
          limit = 12
          high = reading > limit
          ```
        slots:
          - id: what
            type: choice
            prompt: 运行这三行会怎样？
            options:
              - { id: "true", content: "`high` 是 True" }
              - { id: "false", content: "`high` 是 False" }
              - { id: error, content: 第 3 行报错 }
            key: error
          - id: fix
            type: choice
            prompt: 要按数的大小比较，第 3 行应改成哪一句？
            options:
              - id: quoted
                content: |
                  ```python
                  high = "reading" > limit
                  ```
              - id: number
                content: |
                  ```python
                  high = int(reading) > limit
                  ```
              - id: text
                content: |
                  ```python
                  high = reading > str(limit)
                  ```
                feedback: 两边都成了文字，比的是字符的先后，不是数的大小。例如 "9" > "12" 也会得到 True。
            key: number
        explanation: |
          第 3 行**报错**（TypeError）：`reading` 是文字 `"15"`，文字和数不能比大小。

          改成 `high = int(reading) > limit`：先把文字转成数 15，再和 12 比，得到 True。`reading > str(limit)` 不报错，但两边都是文字，比的是字符先后，换成 `"9"` 时也会得到 True；`"reading" > limit` 把名字写成了文字，同样报错。
        verify: |
          first = run()
          what = "error" if first.error == "TypeError" else str(first["high"]).lower()
          fits = []
          for option, code in OPTIONS["fix"].items():
              ok = True
              for reading in ["15", "9", "12"]:
                  attempt = run(code, reading=reading, limit=12)
                  if attempt.error or attempt["high"] is not (int(reading) > 12):
                      ok = False
              if ok:
                  fits.append(option)
          answers = {"what": what, "fix": fits[0] if len(fits) == 1 else fits}

  - id: py08.k2
    title: 阈值含不含等号与边界例子
    card:
      name: 阈值边界
      aliases: [边界例子, 含不含等号]
      definition: 把“至少”“超过”“不超过”“低于”分别写成 >=、>、<=、<；恰好等于阈值的值，是唯一能分出含不含等号的检查例子。
      conditions:
        - 至少、不低于 → >=；超过、大于 → >；不超过、最多 → <=；低于、少于 → <。
        - 检查一个比较写得对不对时，一定要试一个恰好等于阈值的值。
      example:
        from: py08.k2.e0
        text: |
          limit 为 10 时，signal 为 9 或 12，`>=` 和 `>` 结果相同；只有 signal 恰好为 10 时，`signal >= limit` 得 True，`signal > limit` 得 False。
    lesson: |
      需求里的阈值常用日常说法给出。写成代码时，要选对比较符，区别全在“恰好等于阈值算不算”：

      | 需求里的说法 | 写法（阈值为 10） | 恰好等于 10 时 |
      |---|---|---|
      | 至少 10、不低于 10 | `signal >= 10` | True |
      | 超过 10、大于 10 | `signal > 10` | False |
      | 不超过 10、最多 10 | `signal <= 10` | True |
      | 低于 10、少于 10 | `signal < 10` | False |

      `>=` 和 `>` 只在一处不同：值恰好等于阈值时。signal 为 9 或 12，两种写法结果一样；只有 signal 为 10，`>=` 得 True，`>` 得 False。所以检查一个比较时，除了一个明显高于、一个明显低于阈值的值，一定再试一个**恰好等于阈值**的值。

      阈值常放在一个名字里，例如 `limit = 10`，比较写成 `signal >= limit`。换一次分析只改 `limit`，比较那一行不用动。
    example:
      id: py08.k2.e0
      kind: [predict, specify]
      body: |
        约定：signal **至少**为 limit 的样本算达标。下面这段代码分别用 signal 为 9、10、12 运行：

        ```python
        limit = 10
        passed = signal >= limit
        ```

        另一位同事把第 2 行写成了 `passed = signal > limit`。
      slots:
        - id: table
          type: table
          prompt: 填写两种写法下 `passed` 的值。
          columns:
            - { id: signal, header: signal }
            - { id: ge, header: "signal >= limit", input: bool }
            - { id: gt, header: "signal > limit", input: bool }
          rows:
            - { id: s9, cells: { signal: "9", ge: false, gt: false } }
            - { id: s10, cells: { signal: "10", ge: true, gt: false } }
            - { id: s12, cells: { signal: "12", ge: true, gt: true } }
        - id: which
          type: choice
          prompt: 哪个 signal 值让两种写法给出不同的结果？
          options:
            - { id: v9, content: "9" }
            - { id: v10, content: "10" }
            - { id: v12, content: "12" }
          key: v10
        - id: right
          type: choice
          prompt: 按“至少为 limit”的约定，哪种写法对？
          options:
            - { id: gt, content: "`signal > limit`" }
            - { id: ge, content: "`signal >= limit`" }
          key: ge
      explanation: |
        | signal | `>=` | `>` |
        |---:|---|---|
        | 9 | False | False |
        | 10 | True | False |
        | 12 | True | True |

        只有 **10** 让两种写法不同。“至少为 10”包含 10 本身，所以 **`signal >= limit`** 对。只用 9 和 12 检查，两种写法看起来一样好，漏掉等号的错误就查不出来。
      verify: |
        rows = {}
        for value in (9, 10, 12):
            rows[f"s{value}"] = {
                "ge": run(CODE, signal=value)["passed"],
                "gt": run(CODE.replace(">=", ">"), signal=value)["passed"],
            }
        differ = [value for value in (9, 10, 12) if rows[f"s{value}"]["ge"] != rows[f"s{value}"]["gt"]]
        answers = {"table": rows, "which": f"v{differ[0]}" if len(differ) == 1 else differ}
      manual: [right]
