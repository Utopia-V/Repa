id: py11
title: 报错告诉你停在了哪里
status: complete
minutes: 20
summary: 分清语法错误（一行都不运行）和运行时异常（停在出错的那一行）；从错误类型和指向的行出发，找出造成问题的值和它是在哪一行定下的。
prerequisites:
  - topic: py03
    key: true
    weight: 0.67
    covers: [py03.k1, py03.k2]
  - topic: py06
    key: false
    weight: 0.33
    covers: [py06.k2]
sources:
  - source: think-python
    where: 第 2 章 §2.9
    url: https://allendowney.github.io/ThinkPython/chap02.html
    use: reference
  - source: python-docs
    where: 教程第 8 章 §8.1–8.2
    url: https://docs.python.org/3.12/tutorial/errors.html
    use: reference
notes: |
  建议题型与判分：找错（P）、解释代码（S/O）、小改代码（T）。
  范围：只读报错，不讲 try/except；报错都来自单个脚本 clean.py 的顶层代码，没有函数调用形成的多层 traceback。用到的类型：SyntaxError、NameError、TypeError、ValueError、ZeroDivisionError，以及 py06 先修带来的 IndexError（只在 k1.x2、k2.x2 出现，标了 uses）。不用 if（py10 不是先修），所以不出 IndentationError。
  题面里的 traceback 是在课程运行时（Python 3.14.2）里实际运行这些代码得到的，按直接运行脚本的样子去掉了运行器自己的那一层；语法错误没有 “Traceback” 那一行，这和真实运行脚本一致。题目只问类型、行号和原因，不考说明文字，因为不同版本的说明会变（例如 3.14 的 NameError 会加 “Did you mean”）。
  核对程序里的 stop_line 用 compile 和 traceback 独立求出程序停下的行；ran 用 sys.settrace 记下实际执行到的行。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 4 分钟、练习 6 分钟；收束 2 分钟。
  情境与数据为本课自拟。
intro: |
  程序出错时，Python 会停下来，显示一段报错。这一节练习读它：是哪一种错、停在了哪一行、问题可能出在哪里。

  题里的程序都当作一个名为 clean.py 的脚本，从第一行往下运行。报错按课程使用的 Python 3.14 的样子给出；别的版本里说明文字可能稍有不同，但错误类型和行号的读法一样。题目只问类型、行号和原因，不要求背说明文字。
wrapup: |
  看到报错，先读最后一行的错误类型，再看它指向第几行，然后回到代码里，找出那一行用到的值是在哪里定下的。语法错误一行都不运行；运行时异常停在出错的那一行，之前的行已经做完了。

  把报错交给 AI 或同事时，带上完整的报错和它指向的那几行代码，比只说“程序报错了”有用得多。
kps:
  - id: py11.k1
    title: 区分语法错误与运行时异常
    card:
      name: 语法错误与运行时异常
      aliases: [SyntaxError, 异常, 报错]
      definition: 语法错误是 Python 读不懂这段代码，一行都不运行；运行时异常是代码读得懂，运行到某一行出了问题，停在那一行，之前的行已经执行过。
      conditions:
        - 看报错最后一行冒号前的类型名：SyntaxError 是语法错误；NameError、TypeError、ValueError 等是运行时异常。
        - 运行时异常之前的 print 已经显示出来了；语法错误时，连第 1 行的 print 也不会显示。
      example:
        from: py11.k1.e0
        text: |
          ```python
          print("开始核对")
          count = 3
          label = "样本数：" + count
          ```
          第 3 行把文字和整数相加，报 TypeError，是运行时异常：第 1 行已经显示了“开始核对”，第 3 行之后的代码不再运行。
    lesson: |
      Python 运行一个程序分两步：先把整段代码**读一遍**，确认写法合规；读懂了，才从第一行开始**逐行运行**。两步各有一种报错。

      **语法错误**：写法不合规，例如括号没有配对、引号没有收尾。Python 在第一步就停下，**一行都不运行**，所以即使第 1 行是 print，也什么都不显示。报错指向 Python 发现读不下去的位置：

      ```text
        File "clean.py", line 3
          total = (count + 2
                  ^
      SyntaxError: '(' was never closed
      ```

      **运行时异常**：写法没有问题，运行到某一行时出了状况，例如把文字和数字相加、用了还没有赋值的名字。这一行之前的代码**已经执行**，它们的 print 已经显示出来；**程序停在出错的这一行**，后面的行不再运行：

      ```text
      Traceback (most recent call last):
        File "clean.py", line 3, in <module>
          label = "样本数：" + count
                  ~~~~~~~~~~~^~~~~~~
      TypeError: can only concatenate str (not "int") to str
      ```

      两种报错都先看**最后一行**：冒号前面是错误类型，后面是说明。类型是 SyntaxError 的是语法错误；NameError、TypeError、ValueError、ZeroDivisionError 这些都是运行时异常。`line 3` 是报错指向的行号。
    example:
      id: py11.k1.e0
      kind: [debug, predict]
      uses: [py03.k1]
      body: |
        运行 clean.py，最后出现了下面的报错。

        ```python startLine=1
        print("开始核对")
        count = 3
        label = "样本数：" + count
        print(label)
        print("核对结束")
        ```

        ```text
        Traceback (most recent call last):
          File "clean.py", line 3, in <module>
            label = "样本数：" + count
                    ~~~~~~~~~~~^~~~~~~
        TypeError: can only concatenate str (not "int") to str
        ```
      slots:
        - id: kind
          type: choice
          prompt: 这是哪一种报错？
          options:
            - { id: syntax, content: 语法错误：Python 读不懂这段代码 }
            - { id: runtime, content: 运行时异常：运行到某一行时出了问题 }
          key: runtime
        - id: shown
          type: order
          partial: true
          prompt: 报错出现之前，屏幕上显示了哪些内容？按显示的先后排列，没有显示的不要放进来。
          items:
            - { id: start, content: 开始核对 }
            - { id: label, content: 样本数：3 }
            - { id: end, content: 核对结束 }
          key: [start]
        - id: after
          type: choice
          prompt: 第 4、5 行执行了吗？
          options:
            - { id: both, content: 都执行了 }
            - { id: neither, content: 都没有执行 }
            - { id: last, content: 只执行了第 5 行 }
          key: neither
      explanation: |
        最后一行的类型是 TypeError，是**运行时异常**：代码读得懂，运行到第 3 行时，文字 `"样本数："` 和整数 `count` 不能直接相加。

        运行时异常之前的行已经执行，所以第 1 行的“**开始核对**”已经显示出来了；程序停在第 3 行，第 4、5 行**都没有执行**，“样本数：3”和“核对结束”都不会出现。
      verify: |
        import sys
        def ran(code=CODE):
            lines = set()
            def tracer(frame, event, arg):
                if frame.f_code.co_filename == "<ran>" and event == "line":
                    lines.add(frame.f_lineno)
                return tracer
            sys.settrace(tracer)
            try:
                exec(compile(code, "<ran>", "exec"), {})
            except Exception:
                pass
            finally:
                sys.settrace(None)
            return lines
        r = run()
        ids = {"开始核对": "start", "样本数：3": "label", "核对结束": "end"}
        executed = ran()
        after = {(True, True): "both", (False, False): "neither", (False, True): "last"}.get((4 in executed, 5 in executed), "other")
        answers = {
            "kind": "syntax" if r.error == "SyntaxError" else "runtime",
            "shown": [ids[line] for line in r.lines()],
            "after": after,
        }
    practice:
