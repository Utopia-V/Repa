              - { id: l3, cells: { line: 第 3 行, shown: true } }
              - { id: l5, cells: { line: 第 5 行, shown: false } }
              - { id: l6, cells: { line: 第 6 行, shown: false } }
          - id: stop
            type: text
            format: integer
            prompt: 程序停在第几行？
            key: 4
        explanation: |
          第 4 行除以 0，报 ZeroDivisionError，是运行时异常，程序停在第 **4** 行。之前的第 3 行已经执行，“开始计算”**显示了**；第 5、6 行在出错的行之后，**都没有显示**。
        verify: |
          import sys, traceback
          def ran(code=CODE):
              lines = set()
              def tracer(frame, event, arg):
                  if frame.f_code.co_filename == "<ran>" and event == "line":
                      lines.add(frame.f_lineno)
                  return tracer
              sys.settrace(tracer)
              try:
                  exec(compile(code, "<ran>", "exec"), {})
              except Exception:
                  pass
              finally:
                  sys.settrace(None)
              return lines
          def stop_line(code=CODE):
              try:
                  exec(compile(code, "<q>", "exec"), {})
              except SyntaxError as error:
                  return error.lineno
              except Exception as error:
                  return [frame.lineno for frame in traceback.extract_tb(error.__traceback__) if frame.filename == "<q>"][-1]
              return None
          stop = stop_line()
          executed = ran()
          # 一行 print 显示出来，要它执行到了，而且不是出错停下的那一行。
          answers = {"shown": {f"l{n}": {"shown": n in executed and n != stop} for n in (3, 5, 6)}, "stop": stop}
      - id: py11.k1.r2
        kind: [explain]
        uses: [py03.k2]
        body: |
          运行 clean.py，出现了下面的报错。

          ```python startLine=1
          print("开始")
          width = 4
          height = 3
          area = width * height
          print("面积是" + str(area)
          print("结束")
          ```

          ```text
            File "clean.py", line 5
              print("面积是" + str(area)
                   ^
          SyntaxError: '(' was never closed
          ```
        slots:
          - id: claims
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            prompt: 下面哪些说法正确？选出所有正确的。
            options:
              - { id: printed, content: 报错之前，屏幕上先显示了“开始” }
              - { id: none_ran, content: 第 1–4 行一行都没有运行 }
              - { id: syntax, content: 这是语法错误，第 5 行的括号没有配对 }
              - { id: runtime, content: 这是运行时异常，程序运行到第 5 行时停下 }
            key: [none_ran, syntax]
        explanation: |
          正确的是“**第 1–4 行一行都没有运行**”和“**这是语法错误，第 5 行的括号没有配对**”。

          最后一行是 SyntaxError：Python 在读代码时发现第 5 行的左括号没有对应的右括号，读不下去，于是一行都没有运行。第 1 行虽然写得没错，“开始”也不会显示。它不是运行到第 5 行才停下的。
        verify: |
          import sys
          def ran(code=CODE):
              lines = set()
              def tracer(frame, event, arg):
                  if frame.f_code.co_filename == "<ran>" and event == "line":
                      lines.add(frame.f_lineno)
                  return tracer
              sys.settrace(tracer)
              try:
                  exec(compile(code, "<ran>", "exec"), {})
              except Exception:
                  pass
              finally:
                  sys.settrace(None)
              return lines
          r = run()
          try:
              compile(CODE, "<q>", "exec")
              syntax_line = None
          except SyntaxError as error:
              syntax_line = error.lineno
          executed = ran()
          holds = {
              "printed": r.out.startswith("开始"),
              "none_ran": not any(n in executed for n in (1, 2, 3, 4)),
              "syntax": r.error == "SyntaxError" and syntax_line == 5,
              "runtime": r.error not in (None, "SyntaxError"),
          }
          answers = {"claims": [claim for claim, ok in holds.items() if ok]}
    quiz:
      - id: py11.k1.x1
        kind: [debug, predict]
        uses: [py03.k1, py03.k2]
        body: |
          下面五段代码各自单独保存成一个文件运行，第 1 行都是 `print("开始")`，第 2 行都有问题。

          代码 1：

