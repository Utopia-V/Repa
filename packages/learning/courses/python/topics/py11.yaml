        explanation: |
          | 代码 | 报错 | 哪一种 |
          |---|---|---|
          | 1 | ZeroDivisionError：除数是 0 | 运行时异常 |
          | 2 | SyntaxError：文字少了收尾的引号 | 语法错误 |
          | 3 | NameError：`sample_count` 还没有赋值 | 运行时异常 |
          | 4 | SyntaxError：括号没有配对 | 语法错误 |

          判断的办法：写法本身合不合规？代码 1 和代码 3 写法都没问题，Python 读得懂，是运行时才发现除数为 0、名字不存在。代码 2 和代码 4 缺了引号或括号，Python 读都读不下去。
        verify: |
          def kind(code):
              try:
                  compile(code, "<q>", "exec")
              except SyntaxError:
                  return "syntax"
              return "runtime" if run(code).error is not None else "no error"
          answers = {"kinds": {f"c{i}": {"kind": kind(code)} for i, code in enumerate(BLOCKS, 1)}}
      - id: py11.k1.q3
        kind: [predict]
        uses: [py03.k2]
        body: |
          ```python startLine=1
          print("第一步：读入")
          raw = "12.5"
          print("第二步：转换")
          value = int(raw)
          print("第三步：完成")
          print(value)
          ```

          提示：`int()` 只认得整数的写法，`int("12.5")` 会报 ValueError。
        slots:
          - id: count
            type: text
            format: integer
            prompt: 报错之前，屏幕上一共显示了几行？
            key: 2
          - id: stop
            type: text
            format: integer
            prompt: 程序停在第几行？
            key: 4
        explanation: |
          显示了 **2** 行：“第一步：读入”和“第二步：转换”。这是运行时异常，第 1–3 行正常执行；第 **4** 行的 `int("12.5")` 报 ValueError，程序停在这里，第 5、6 行不再运行。
        verify: |
          import traceback
          def stop_line(code=CODE):
              try:
                  exec(compile(code, "<q>", "exec"), {})
              except SyntaxError as error:
                  return error.lineno
              except Exception as error:
                  return [frame.lineno for frame in traceback.extract_tb(error.__traceback__) if frame.filename == "<q>"][-1]
              return None
          answers = {"count": len(run().lines()), "stop": stop_line()}
    review:
      - id: py11.k1.r1
        kind: [predict]
        body: |
          ```python startLine=1
          total = 24
          groups = 0
          print("开始计算")
          per_group = total / groups
          print("每组的份数：")
          print(per_group)
          ```
        slots:
          - id: shown
            type: table
            prompt: 运行这段代码，下面三行 print 各自的内容显示出来了吗？
            columns:
              - { id: line, header: 行 }
              - { id: shown, header: 显示了吗, input: bool }
