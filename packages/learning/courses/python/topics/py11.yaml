      - id: py11.k2.r2
        kind: [explain]
        uses: [py03.k1, py03.k2]
        body: |
          下面是四段报错的最后一行。为每一段选出最可能的原因，每个原因只对应一段。

          报错 1：

          ```text
          NameError: name 'Signal' is not defined. Did you mean: 'signal'?
          ```

          报错 2：

          ```text
          TypeError: can only concatenate str (not "int") to str
          ```

          报错 3：

          ```text
          ValueError: invalid literal for int() with base 10: 'abc'
          ```

          报错 4：

          ```text
          ZeroDivisionError: division by zero
          ```
        slots:
          - id: causes
            type: table
            columns:
              - { id: error, header: 报错 }
              - id: cause
                header: 最可能的原因
                input:
                  type: choice
                  options:
                    - { id: case, label: 名字的大小写写错了 }
                    - { id: mix, label: 把文字和整数直接相加 }
                    - { id: content, label: 要转成整数的文字不是整数的写法 }
                    - { id: divisor, label: 除数算出来是 0 }
            rows:
              - { id: e1, cells: { error: 报错 1, cause: case } }
              - { id: e2, cells: { error: 报错 2, cause: mix } }
              - { id: e3, cells: { error: 报错 3, cause: content } }
              - { id: e4, cells: { error: 报错 4, cause: divisor } }
        explanation: |
          - 报错 1：NameError 是名字不存在；“Did you mean: 'signal'?”提示有一个只差大小写的名字，原因是**大小写写错了**。
          - 报错 2：TypeError 是类型不对，说明里说只能把文字和文字接起来，原因是**把文字和整数直接相加**。
          - 报错 3：ValueError 是内容不认得，`int()` 收到的 `'abc'` 不是整数的写法。
          - 报错 4：ZeroDivisionError 就是**除数为 0**。
        verify: |
          # 每个原因写一段会造成它的代码，运行后看报错的类型和说明开头，与四段报错逐一对应。
          examples = {
              "case": ("signal = 3", "print(Signal)"),
              "mix": ("count = 3", 'label = "第" + count'),
              "content": ('raw = "abc"', "n = int(raw)"),
              "divisor": ("count = 0", "mean = 12 / count"),
          }
          shown = {
              "e1": "NameError: name 'Signal' is not defined",
              "e2": 'TypeError: can only concatenate str (not "int") to str',
              "e3": "ValueError: invalid literal for int() with base 10: 'abc'",
              "e4": "ZeroDivisionError: division by zero",
          }
          produced = {}
          for cause, (setup, line) in examples.items():
              r = run(setup + "\n" + line)
              produced[cause] = f"{r.error}: {r.message}"
          answers = {"causes": {
              row: {"cause": [cause for cause, text in produced.items() if text.startswith(expected)][0]}
              for row, expected in shown.items()
          }}
