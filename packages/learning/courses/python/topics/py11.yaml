              - { id: read_first, content: Python 先读整段代码，读不懂就一行都不运行 }
              - { id: line1_bad, content: 第 1 行本身也写错了 }
              - { id: stops_at_3, content: 程序运行到第 3 行才停下 }
            key: read_first
        explanation: |
          **什么也没有显示。** 最后一行是 SyntaxError：第 3 行的文字少了收尾的引号，Python 在读代码这一步就停下了，一行都没有运行，所以第 1 行写得没错，也不会显示“开始核对”。

          对比例题：那里是运行时异常，第 1 行已经运行，“开始核对”显示出来了。
        verify: |
          r = run()
          first = run(CODE.splitlines()[0])
          # 第 1 行单独运行没有问题；整段代码却连它也没显示，说明在运行任何一行之前就停下了。
          answers = {
              "shown": "nothing" if r.out == "" else "start" if r.lines() == ["开始核对"] else "two",
              "why": "read_first" if r.error == "SyntaxError" and r.out == "" and first.error is None and first.out.strip() == "开始核对" else "other",
          }
