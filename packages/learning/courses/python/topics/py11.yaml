        slots:
          - id: count
            type: text
            format: integer
            prompt: 运行这段代码，报错之前屏幕上一共显示了几行？
            key: 3
          - id: last
            type: text
            match: text
            prompt: 报错之前显示的最后一行是什么？
            key: 第四个：
          - id: stop
            type: text
            format: integer
            prompt: 程序停在第几行？
            key: 5
        explanation: |
          列表只有位置 0、1、2，`signals[3]` 超出范围，第 **5** 行报 IndexError，这是运行时异常。之前的第 2–4 行已经执行，显示了“第一个：”“8”“第四个：”共 **3** 行，最后一行是“**第四个：**”；“读完了”不会显示。
        verify: |
          import traceback
          def stop_line(code=CODE):
              try:
                  exec(compile(code, "<q>", "exec"), {})
              except SyntaxError as error:
                  return error.lineno
              except Exception as error:
                  return [frame.lineno for frame in traceback.extract_tb(error.__traceback__) if frame.filename == "<q>"][-1]
              return None
          lines = run().lines()
          answers = {"count": len(lines), "last": lines[-1], "stop": stop_line()}

  - id: py11.k2
    title: 从异常类型和指向的行缩小原因
    card:
      name: 读报错
      aliases: [traceback, 报错信息, 异常类型]
      definition: 先读最后一行的错误类型，再看它指向的行和这一行用到的值；程序停下的行不一定是要改的行，造成问题的值可能在更早的行就定下了。
      conditions:
        - NameError 看拼写和这个名字之前有没有赋值；TypeError 看值的类型；ValueError 看值的写法；ZeroDivisionError 看除数从哪里来。
        - 修改要针对原因：在出错的行上硬改一个值让它不报错，可能得到错误的结果。
      example:
        from: py11.k2.q1
        text: |
          ```python
          used = 5
          left = total - used
          total = 12
          ```
          报错指向第 2 行的 NameError：用到 total 时它还没有赋值。要改的是顺序，把 `total = 12` 移到前面，而不是在第 2 行前面随便给 total 一个值。
    lesson: |
      一段报错从下往上读最快。

      **1. 最后一行：错误类型和说明。** 类型告诉你是哪一类问题：

      | 类型 | 意思 | 先去看 |
      |---|---|---|
      | NameError | 这个名字还不存在 | 拼写（大小写也算）；用到它之前有没有赋过值 |
      | TypeError | 这种类型的值不能这样用 | 这一行里各个值是什么类型，例如文字和整数直接相加，或者值是 None |
      | ValueError | 类型对了，但内容不认得 | 值的写法，例如 `int("12.5")`、`float("12,5")` |
      | ZeroDivisionError | 除数是 0 | 除数是从哪里算出来的 |
      | IndexError | 位置超出了列表的范围 | 列表有几项，位置从 0 开始数 |

      **2. 上面的 `File "clean.py", line 5`：程序停在第几行。** 下面一行是那一行代码，`^` 和 `~` 标出出问题的那一段。

      **3. 回到代码里**：找出这一行用到了哪些值，再往上找它们是在哪一行定下的。

      ```text
      Traceback (most recent call last):
        File "clean.py", line 5, in <module>
          per_sample = total / usable
                       ~~~~~~^~~~~~~~
      ZeroDivisionError: division by zero
      ```

      这个报错指向第 5 行，但第 5 行本身写得没错：问题是 `usable` 是 0。要往上看 usable 是怎样算出 0 的，也许是第 4 行的减法，也许是更早的数据。**程序停下的行，不一定是要改的行。**

      改的时候要针对原因。在出错的行前面随手加一个 `usable = 1`，报错没了，结果却是错的。

      以后读 AI 或别人写的代码，报错可能有很多层，夹着库里的文件。办法一样：最后一行看类型，再在报错里找到你自己的文件名和那一行。
    example:
      id: py11.k2.e0
      kind: [debug, explain]
      uses: [py03.k1, py03.k2]
      body: |
        运行 clean.py，出现了下面的报错。

        ```python startLine=1
        count = 3
        label = "样本数：" + count
        print(label)
        ```

        ```text
        Traceback (most recent call last):
          File "clean.py", line 2, in <module>
            label = "样本数：" + count
                    ~~~~~~~~~~~^~~~~~~
        TypeError: can only concatenate str (not "int") to str
        ```
      slots:
        - id: cause
          type: choice
          prompt: 问题出在哪里？
          options:
            - { id: undefined, content: "`count` 这个名字还没有赋值" }
            - { id: number, content: "`count` 是整数，不能直接和文字相加" }
            - { id: label, content: 文字“样本数：”写错了 }
          key: number
        - id: fix
          type: choice
          prompt: 要显示“样本数：3”，第 2 行应改成哪一种？
          options:
            - id: quoted
              content: |
                ```python
                label = "样本数：" + "count"
                ```
            - id: to_int
              content: |
                ```python
                label = "样本数：" + int(count)
                ```
            - id: to_str
              content: |
                ```python
                label = "样本数：" + str(count)
                ```
          key: to_str
      explanation: |
        最后一行是 TypeError：这一行里有一个值的类型不对。第 2 行用到两个值，`"样本数："` 是文字，`count` 是第 1 行赋的整数 3；文字只能和文字相加，所以问题是 **count 是整数**。

        改法是先把 count 转成文字：`"样本数：" + str(count)`，得到“样本数：3”。写成 `"count"` 会接上字母 count 本身，显示“样本数：count”；`int(count)` 还是整数，报同样的错。
      verify: |
        r = run()
        # 出错时 count 是整数，而这一行另一边是文字。
        cause = "number" if r.error == "TypeError" and isinstance(r["count"], int) else "other"
        lines = CODE.splitlines()
        fits = [option for option, line in OPTIONS["fix"].items()
                if run("\n".join([lines[0], line, lines[2]])).out.strip() == "样本数：3"]
        answers = {"cause": cause, "fix": fits[0] if len(fits) == 1 else fits}
    practice:
      - id: py11.k2.q1
        kind: [debug]
        body: |
          运行 clean.py，出现了下面的报错。程序原本应显示 7。

          ```python startLine=1
          used = 5
          left = total - used
          total = 12
          print(left)
          ```

          ```text
          Traceback (most recent call last):
            File "clean.py", line 2, in <module>
              left = total - used
                     ^^^^^
          NameError: name 'total' is not defined
          ```
        slots:
          - id: cause
            type: choice
            prompt: 问题出在哪里？
            options:
              - { id: typo, content: "`total` 拼错了" }
              - { id: not_yet, content: 第 2 行用到 `total` 时，它还没有被赋值 }
              - { id: minus, content: 整数不能做减法 }
            key: not_yet
          - id: fix
            type: choice
            prompt: 怎样改，程序才会显示 7？
            options:
              - { id: zero, content: 在第 2 行前面加一行 `total = 0` }
              - { id: move, content: 把第 3 行 `total = 12` 移到第 2 行前面 }
              - { id: rename, content: 把第 2 行的 `total` 改成 `used` }
            key: move
        explanation: |
          NameError 说 `total` 还不存在。拼写没有问题，第 3 行确实给 total 赋了值，但程序从上往下运行，第 2 行**用到 total 时，第 3 行还没有执行**。

          要改的是顺序：**把 `total = 12` 移到第 2 行前面**，left 就是 12 - 5 = 7。在第 2 行前面加 `total = 0` 也不会报错，但 left 成了 -5；把 total 改成 used 得到 0。两种都只是让报错消失，结果是错的。
        verify: |
          lines = CODE.splitlines()
          # 第 2 行之前 total 有没有值：只运行第 1 行，看 total 是否存在；再确认后面确实给 total 赋了值。
          before = run(lines[0])
          later = run("\n".join(lines[2:3]))
          cause = "not_yet" if "total" not in before.vars and "total" in later.vars and run().error == "NameError" else "other"
          changes = {
              "zero": [lines[0], "total = 0", *lines[1:]],
              "move": [lines[2], lines[0], lines[1], lines[3]],
              "rename": [lines[0], lines[1].replace("total", "used"), *lines[2:]],
          }
          fits = [option for option, program in changes.items() if run("\n".join(program)).out.strip() == "7"]
          answers = {"cause": cause, "fix": fits[0] if len(fits) == 1 else fits}
      - id: py11.k2.q2
        kind: [debug, explain]
        uses: [py03.k2]
        body: |
          从一份表格里抄来的读数是 `"12,5"`。运行 clean.py，出现了下面的报错。

          ```python startLine=1
          raw = "12,5"
          value = float(raw)
          doubled = value * 2
          print(doubled)
          ```

          ```text
          Traceback (most recent call last):
            File "clean.py", line 2, in <module>
              value = float(raw)
          ValueError: could not convert string to float: '12,5'
          ```
        slots:
          - id: cause
            type: choice
            prompt: 问题出在哪里？
            options:
              - { id: text, content: raw 是文字，文字都不能转成小数 }
              - { id: comma, content: 小数点写成了逗号，float 认不出这种写法 }
              - { id: multiply, content: 第 3 行的乘法写错了 }
            key: comma
          - id: fixed
            type: text
            match: output
            prompt: 如果把第 1 行改成 `raw = "12.5"`，第 4 行显示什么？
            key: "25.0"
            feedback:
              - when: "25"
                message: value 是 float 转出来的小数，乘 2 以后仍是小数，显示 25.0。
        explanation: |
          ValueError 说明类型没问题（float 本来就是把文字转成小数），但**内容的写法认不出来**：`"12,5"` 用逗号当小数点，Python 只认 `"12.5"` 这种写法。文字并不是都不能转，`float("12.5")` 就可以；报错停在第 2 行，第 3 行根本没有运行。

          改成 `"12.5"` 以后，value 是 12.5，doubled 是 **25.0**。真实数据里，这类问题要先弄清整列读数是怎样写的，再决定怎样转换，而不是改一个值了事。
        verify: |
          r = run()
          # 同样是文字，用小数点写的能转，用逗号写的不能：问题在写法，不在类型。
          dot_ok = run('value = float("12.5")').error is None
          cause = "comma" if r.error == "ValueError" and dot_ok and "," in r["raw"] else "other"
          answers = {"cause": cause, "fixed": run(CODE.replace('"12,5"', '"12.5"')).lines()[-1]}
      - id: py11.k2.q3
        kind: [modify]
        uses: [py03.k2]
        body: |
          宿主事先给 `count` 赋了一个文字形式的整数，例如 `"12"`，它是从文件里读来的。要求：显示加上 3 份以后的总数，例如 count 为 `"12"` 时显示 15。

          作答框里的代码运行时报 TypeError：

          ```text
          Traceback (most recent call last):
            File "clean.py", line 1, in <module>
              total = count + 3
                      ~~~~~~^~~
          TypeError: can only concatenate str (not "int") to str
          ```

          改动代码，让它符合要求。不要自己给 count 赋值。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              total = count + 3
              print(total)
            solution: |
              total = int(count) + 3
              print(total)
            accepts:
              - |
                count = int(count)
                total = count + 3
                print(total)
              - print(int(count) + 3)
            rejects:
              - code: |
                  total = count + "3"
                  print(total)
                why: 把 3 也写成文字，得到的是拼接出的“123”
              - code: |
                  total = 15
                  print(total)
                why: 照着例子写死了结果
              - code: |
                  total = float(count) + 3
                  print(total)
                why: 转成了小数，显示 15.0
            tests:
              - name: count 为 "12"
                setup: count = "12"
                stdout: "15"
              - name: count 为 "40"
                hidden: true
                setup: count = "40"
                stdout: "43"
        explanation: |
          TypeError 说文字和整数不能直接相加：count 虽然看起来是 12，其实是文字 `"12"`。先用 `int(count)` 把它转成整数，再加 3：

          ```python
          total = int(count) + 3
          print(total)
          ```

          写成 `count + "3"` 不会报错，但得到的是两段文字接起来的“123”。判分时还会换一个 count 运行你的代码。
    review:
      - id: py11.k2.r1
        kind: [debug, trace]
        body: |
          运行 clean.py，出现了下面的报错。

          ```python startLine=1
          total = 24
          samples = 3
          failed = 3
          usable = samples - failed
          per_sample = total / usable
          print(per_sample)
          ```

          ```text
