        lines = CODE.splitlines()
        ends = [node.end_lineno for node in ast.parse(CODE).body]
        failing = [end for end in ends if run("\n".join(lines[:end])).error is not None]
        r = run()
        actual = run(CODE.split("assert")[0] + "result = label(10, 10)")["result"]
        def spec(signal, limit):
            return "达标" if signal >= limit else "未达标"
        edits = {"expect": (7, 'assert label(10, 10) == "未达标"'), "condition": (1, "    if signal >= limit:"), "always": (3, '    return "达标"')}
        fixes = []
        for option, (index, text) in edits.items():
            changed = "\n".join(lines[:index] + [text] + lines[index + 1:])
            result = run(changed + "\nchecks = [label(s, l) for s, l in ((12, 10), (8, 10), (10, 10), (3, 3))]")
            if result.error is None and result["checks"] == [spec(s, l) for s, l in ((12, 10), (8, 10), (10, 10), (3, 3))]:
                fixes.append(option)
        answers = {
            "line": failing[0],
            "shown": "yes" if "全部通过" in r.lines() else "no",
