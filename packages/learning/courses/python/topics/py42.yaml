id: py42
title: 用小例子检查一个函数
status: complete
minutes: 20
summary: 把一条要求写成正常、边界、空输入三类“调用 → 期望”的测试，再用 assert 逐条核对，从第一条失败的断言定位差异。
prerequisites:
  - topic: py40
    key: true
    weight: 0.33
    covers: [py40.k2]
  - topic: py12
    key: true
    weight: 0.50
    covers: [py12.k1, py12.k2]
  - topic: py11
    key: false
    weight: 0.50
    covers: [py11.k2]
sources:
  - source: think-python
    where: 第 6 章 增量开发
    url: https://allendowney.github.io/ThinkPython/chap06.html
    use: reference
