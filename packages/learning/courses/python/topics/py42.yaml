                      elif depth < 29:
                          return "中层"
                      return "深层"

                  assert layer(5) == "表层"
                  assert layer(10) == "中层", "10 厘米算中层"
                  assert layer(30) == "深层", "30 厘米算深层"
                why: 把第二个阈值改成了 29，30 是对了，29 却成了深层
            tests:
              - name: 两个边界
                doctest: |
                  >>> layer(10)
                  '中层'
                  >>> layer(30)
                  '深层'
              - name: 边界两侧
                hidden: true
                doctest: |
                  >>> layer(9)
                  '表层'
                  >>> layer(29)
                  '中层'
                  >>> layer(31)
                  '深层'
                  >>> layer(0)
                  '表层'
        explanation: |
          两个阈值都要“及以上”归到下一层，所以比较要用不含等号的 `<`：

          ```python
          def layer(depth):
              if depth < 10:
                  return "表层"
              elif depth < 30:
                  return "中层"
              return "深层"
          ```

          第 9 行的断言先失败，提示 10 厘米被判成了表层；只改第一个比较，第 10 行又会失败，提示 30 厘米被判成了中层。按失败的断言一条条定位，直到全部通过。判分时还会检查 9、29、31 这些紧挨着边界的值。
