          一条 assert 失败，程序就停在那一行，后面的行不再运行；报的是 AssertionError，不是 ValueError。正因为 -O 会跳过它，assert 只用来练习和自查，不拿来检查正式输入的数据。每个选项的勾选状态分别计分。
