      - id: py42.k2.q3
        kind: [modify]
        uses: [py40.k2, py10.k1, py03.k3]
        body: |
          要求：`mean_signal(total, n)` 交回 n 份样本的平均信号 total / n；没有样本（n 为 0）时交回 None。

          作答框里是现在的函数和三条测试。运行时第三条测试没有通过：调用 `mean_signal(0, 0)` 时就报了 ZeroDivisionError，还没走到比较。请改函数，让三条测试全部通过；测试本身不要改。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 12
            starter: |
              def mean_signal(total, n):
                  return total / n

              assert mean_signal(30, 3) == 10
              assert mean_signal(7, 2) == 3.5
              assert mean_signal(0, 0) is None, "没有样本时交回 None"
            solution: |
              def mean_signal(total, n):
                  if n == 0:
                      return None
                  return total / n

              assert mean_signal(30, 3) == 10
              assert mean_signal(7, 2) == 3.5
              assert mean_signal(0, 0) is None, "没有样本时交回 None"
            rejects:
              - code: |
                  def mean_signal(total, n):
                      if total == 0:
                          return None
                      return total / n

                  assert mean_signal(30, 3) == 10
                  assert mean_signal(7, 2) == 3.5
                  assert mean_signal(0, 0) is None, "没有样本时交回 None"
                why: 把“总信号为 0”当成了“没有样本”
              - code: |
                  def mean_signal(total, n):
                      if n == 0:
                          return 0
                      return total / n

                  assert mean_signal(30, 3) == 10
                  assert mean_signal(7, 2) == 3.5
                  assert mean_signal(0, 0) == 0
                why: 改了测试去迁就函数，没有样本时交回 0
              - code: |
                  def mean_signal(total, n):
                      return total / n

                  assert mean_signal(30, 3) == 10
                  assert mean_signal(7, 2) == 3.5
                why: 删掉了失败的测试，函数没改
            tests:
              - name: 作答里的三条断言全部通过
                expect:
                  mean_signal(30, 3): "10.0"
              - name: 没有样本
                hidden: true
                doctest: |
                  >>> mean_signal(5, 0) is None
                  True
              - name: 总信号为 0 但有样本
                hidden: true
                doctest: |
                  >>> mean_signal(0, 5)
                  0.0
                  >>> mean_signal(9, 4)
                  2.25
        explanation: |
          在除法之前先处理空输入：

          ```python
          def mean_signal(total, n):
              if n == 0:
                  return None
              return total / n
          ```

          判断的是 n（有没有样本），不是 total：四份样本总信号为 0 时，平均值是 0.0，不是 None。删掉失败的测试、或把期望改成 0，都只是让报错消失，函数仍不符合要求。判分时还会单独调用 `mean_signal(5, 0)` 和 `mean_signal(0, 5)`。
