notes: |
  范围：先修是 py40（形参与 return）、py12（正常、边界、无结果例子）和 py11（异常类型与报错的行）。py41 不是本节的先修，所以题里的函数不用默认参数，也不依赖“没有 return 得到 None”；空输入交回 None 都是要求里明写的。函数体只用数、比较和 if/elif/else，不用循环、列表和 pandas。判断是不是 None 写 `is None`，在 k2 讲解里就地说明。
  沿用 py40 的 label(signal, limit)，新增 mean_signal(total, n)：“n 份样本的平均信号，没有样本（n 为 0）时交回 None”。“正常、边界、空输入”三类测试和 `assert 函数(输入) == 期望` 的写法，py46 会接着用。
  assert 只用于练习和自查：python -O 会跳过断言，不把它当作检查正式输入数据的手段，讲解里明说。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 5 分钟；k2 讲解与例题 4 分钟、练习 5 分钟（含一道改代码题）；收束 1 分钟。
  讲解、例子和题目为本课自拟。期望结果都由 verify 按要求另写一份实现算出，再与题里的函数对照；py42.k1.q2 问“要求没写空输入时下一步做什么”，是练习题，列在 manual 里。复习和测验题没有 manual 作答位。
intro: |
  前面读懂了函数怎样接收输入、交回结果。这一节反过来：拿到一个函数，不管是自己写的、同事写的还是 AI 写的，怎样用几个小例子检查它符不符合要求。

  在“把‘处理一下’变成可核对的要求”那一节，你用正常、边界和没有结果的例子检查过一条筛选规则。这里把同样的例子写成可以反复运行的测试。
wrapup: |
  检查一个函数，先从要求里推出几条“调用 → 期望”：正常值各一个、恰好等于阈值的边界、没有数据的空输入。再把它们写成 assert，一运行就知道哪一条没通过。

  拿 AI 写的函数时，也可以直接要求：“请附上覆盖正常、边界和空输入的 assert 测试，期望结果按我的要求写，不要照着函数的输出抄。”
kps:
  - id: py42.k1
    title: 正常、边界和空输入转成测试
    card:
      name: 三类测试
      aliases: [测试例子, 正常、边界、空输入]
      definition: 把要求写成“调用 → 期望结果”的测试：正常值各一个、恰好等于阈值的边界值、没有数据的空输入；期望从要求推出，不从函数的输出抄。
      conditions:
        - 一组测试要让常见的错误写法至少失败一条；只有普通值时，查不出 >= 写成 > 的错误。
        - 要求没写空输入怎样处理时，先问清楚，不要按函数现在的行为补上期望。
      example:
        from: py42.k1.e0
        text: |
          要求“signal 大于或等于 limit 记为达标”：label(12, 10) 期望“达标”、label(8, 10) 期望“未达标”是正常；label(10, 10) 期望“达标”是边界。mean_signal(0, 0) 期望 None 是空输入。
    lesson: |
      一条**测试**就是一次调用，加上**按要求算出的**期望结果。要求是“signal 大于或等于 limit 记为达标，否则未达标”时：

      | 测试 | 调用 | 期望 |
      |---|---|---|
      | 正常（应达标） | `label(12, 10)` | "达标" |
      | 正常（不达标） | `label(8, 10)` | "未达标" |
      | 边界 | `label(10, 10)` | "达标" |

      期望要从要求里推出来，而不是先运行函数、再把它交回的东西抄成期望：那样函数错了，测试也跟着错。

      挑例子和检查筛选规则时一样：

      1. **正常**：明显该达标、明显不达标的普通值，各一个；
      2. **边界**：恰好等于阈值的值。把 `>=` 写成 `>`，只有这一条测试会失败；
      3. **空输入**：没有数据时的情况。例如 `mean_signal(total, n)` 算 n 份样本的平均信号，要求写明“没有样本（n 为 0）时交回 None”，就要有一条 `mean_signal(0, 0)` 期望 None 的测试。要求里没写空输入怎样处理时，先去问清楚，再写这条测试。

      一组测试好不好，看它能不能分出常见的错误写法：拿错误写法去跑，至少要有一条失败。只有 `label(12, 10)` 和 `label(8, 10)` 两条时，`>=` 和 `>` 都能全部通过，这组测试就查不出等号的问题。
    example:
      id: py42.k1.e0
      kind: [specify]
      uses: [py12.k2, py40.k2]
      body: |
        两条要求：

        - `label(signal, limit)`：signal 大于或等于 limit 时交回 "达标"，否则交回 "未达标"。
        - `mean_signal(total, n)`：交回 n 份样本的平均信号 total / n；没有样本（n 为 0）时交回 None。

        为下面四条测试填上期望结果，并说出每条属于哪一类。
      slots:
        - id: tests
          type: table
          columns:
            - { id: call, header: 调用 }
            - id: expect
              header: 期望
              input: { type: choice, options: [{ id: pass, label: 达标 }, { id: fail, label: 未达标 }, { id: none, label: None }] }
            - id: kind
              header: 类别
              input: { type: choice, options: [{ id: normal, label: 正常 }, { id: boundary, label: 边界 }, { id: empty, label: 空输入 }] }
          rows:
            - { id: t1, cells: { call: "label(12, 10)", expect: pass, kind: normal } }
            - { id: t2, cells: { call: "label(8, 10)", expect: fail, kind: normal } }
            - { id: t3, cells: { call: "label(10, 10)", expect: pass, kind: boundary } }
            - { id: t4, cells: { call: "mean_signal(0, 0)", expect: none, kind: empty } }
      explanation: |
        | 调用 | 期望 | 类别 |
        |---|---|---|
        | `label(12, 10)` | 达标 | 正常 |
        | `label(8, 10)` | 未达标 | 正常 |
        | `label(10, 10)` | 达标 | 边界：恰好等于阈值，“大于或等于”包含它 |
        | `mean_signal(0, 0)` | None | 空输入：要求明写没有样本时交回 None |

        这四条期望都是从要求读出来的，题目里根本没有给函数的代码，也不需要。
      verify: |
        # 按要求另写一份实现，算出期望；类别按输入与要求的关系判断。
        def spec_label(signal, limit):
            return "达标" if signal >= limit else "未达标"
        def spec_mean(total, n):
            return None if n == 0 else total / n
        ids = {"达标": "pass", "未达标": "fail", None: "none"}
        label_rows = {"t1": (12, 10), "t2": (8, 10), "t3": (10, 10)}
        rows = {row: {"expect": ids[spec_label(*args)], "kind": "boundary" if args[0] == args[1] else "normal"}
                for row, args in label_rows.items()}
        total, n = 0, 0
        rows["t4"] = {"expect": ids[spec_mean(total, n)], "kind": "empty" if n == 0 else "normal"}
        answers = {"tests": rows}
    practice:
      - id: py42.k1.q1
        kind: [debug]
        uses: [py12.k2, py08.k2]
        body: |
          要求：signal 大于或等于 limit 时交回 "达标"，否则交回 "未达标"。有人写成了：

          ```python
          def label(signal, limit):
              if signal > limit:
                  return "达标"
              return "未达标"
          ```

          用下面四条测试去检查它，哪些测试会失败？选出所有会失败的。
        slots:
          - id: failing
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: t1, content: "`label(12, 10)` 期望 \"达标\"" }
              - { id: t2, content: "`label(10, 10)` 期望 \"达标\"" }
              - { id: t3, content: "`label(9, 10)` 期望 \"未达标\"" }
              - { id: t4, content: "`label(20, 20)` 期望 \"达标\"" }
            key: [t2, t4]
        explanation: |
          **`label(10, 10)`** 和 **`label(20, 20)`** 会失败：它们恰好等于阈值，要求说算达标，`>` 却把它们判成未达标。另外两条是普通值，`>` 和 `>=` 给出的结果一样，查不出这个错误。每个选项的勾选状态分别计分。
        verify: |
          def spec(signal, limit):
              return "达标" if signal >= limit else "未达标"
          tests = {"t1": (12, 10), "t2": (10, 10), "t3": (9, 10), "t4": (20, 20)}
          failing = []
          for test, args in tests.items():
              got = run(CODE + f"\nresult = label{args}")["result"]
              if got != spec(*args):
                  failing.append(test)
          answers = {"failing": failing}
      - id: py42.k1.q2
        kind: [specify]
        uses: [py12.k1, py12.k2]
        body: |
          同事给你的要求只有一句：“`mean_signal(total, n)` 交回 n 份样本的平均信号 total / n。”你在写测试。
        slots:
          - id: normal
            type: text
            format: number
            prompt: 按这句要求，`mean_signal(30, 4)` 的期望是多少？
            key: 7.5
          - id: empty
            type: choice
            prompt: 空输入 `mean_signal(0, 0)` 的期望该怎样写？
            options:
              - id: zero
                content: 写期望 0，没有样本就当平均值是 0
                feedback: 平均值 0 和“没有样本”是两回事，要求没有授权你这样定。
              - id: current
                content: 先运行函数，它报什么错就把什么当期望
                feedback: 这是在照着函数现在的行为写测试，函数错了测试也跟着错。
              - id: ask
                content: 先问清楚：没有样本时交回什么（例如 None），确认后再写这条测试
              - id: skip
                content: 不写这条测试，反正很少遇到
            key: ask
        explanation: |
          `mean_signal(30, 4)` 期望 **7.5**。

          空输入的期望要求里没写，应当**先问清楚**再写。自己定成 0，等于替对方补了一条规则；照函数现在报的错写，测试就失去了检查的意义；不写这条，最容易出问题的地方就没人看。
        verify: |
          answers = {"normal": 30 / 4}
        manual: [empty]
      - id: py42.k1.q3
        kind: [specify]
        uses: [py12.k2, py08.k2]
        body: |
          `label(signal, limit)` 的要求不变：signal 大于或等于 limit 时交回 "达标"。现在阈值 limit 取 15。

          请构造一条测试，让正确的写法（`>=`）通过、错误的写法（`>`）失败：填 signal 的值和这条测试的期望。
        slots:
          - id: signal
            type: text
            format: integer
            prompt: signal 取多少？
            key: 15
          - id: expect
            type: choice
            prompt: 这条测试的期望
            options:
              - { id: pass, content: 达标 }
              - { id: fail, content: 未达标 }
            key: pass
        explanation: |
          signal 取 **15**，期望 **达标**。只有恰好等于阈值时，`>=` 和 `>` 结果不同：正确写法交回达标，错误写法交回未达标，测试就会失败。取 16、14 这样的值，两种写法结果一样，查不出问题。
        verify: |
          values = [v for v in range(-100, 101) if (v >= 15) != (v > 15)]
          value = values[0] if len(values) == 1 else values
          answers = {"signal": value, "expect": "pass" if value >= 15 else "fail"}
    review:
      - id: py42.k1.r1
        kind: [specify, debug]
        uses: [py12.k2]
        body: |
          要求：`is_deep(depth)` 在深度**超过** 30 厘米时交回 True，恰好 30 不算，交回 False。

          担心有人把它写成了 `return depth >= 30`。哪一组测试能查出这个错误？
        slots:
          - id: tests
            type: choice
            options:
              - id: far
                content: "`is_deep(35)` 期望 True；`is_deep(10)` 期望 False"
              - id: above
                content: "`is_deep(40)` 期望 True；`is_deep(31)` 期望 True"
              - id: boundary
                content: "`is_deep(30)` 期望 False；`is_deep(35)` 期望 True"
              - id: below
                content: "`is_deep(29)` 期望 False；`is_deep(20)` 期望 False"
            key: boundary
        explanation: |
          含有 **`is_deep(30)` 期望 False** 的那一组。错误写法 `depth >= 30` 会把 30 判成 True，这条测试失败。其余几组都只有离 30 远的值或 31、29 这样的普通值，`>=` 和 `>` 结果一样，全部通过，查不出问题。
        verify: |
          def spec(depth):
              return depth > 30
          def wrong(depth):
              return depth >= 30
          groups = {"far": [(35, True), (10, False)], "above": [(40, True), (31, True)],
                    "boundary": [(30, False), (35, True)], "below": [(29, False), (20, False)]}
          # 每组的期望都按要求写对；能查出错误的组，要让错误写法至少失败一条。
          assert all(spec(depth) == expect for group in groups.values() for depth, expect in group)
          fits = [name for name, group in groups.items() if any(wrong(depth) != expect for depth, expect in group)]
          answers = {"tests": fits[0] if len(fits) == 1 else fits}
      - id: py42.k1.r2
        kind: [specify]
        uses: [py12.k2, py03.k3]
        body: |
          要求：`rate(count, minutes)` 交回每分钟的次数 count / minutes；没有观察时间（minutes 为 0）时交回 None。

          按要求填写下面每条测试的期望（写成 Python 显示的样子，例如 2.0 或 None），并说出类别。
        slots:
          - id: tests
            type: table
            columns:
              - { id: call, header: 调用 }
              - id: expect
                header: 期望
                input: { type: text, match: output, quick: [None] }
              - id: kind
                header: 类别
                input: { type: choice, options: [{ id: normal, label: 正常 }, { id: empty, label: 空输入 }] }
            rows:
              - { id: t1, cells: { call: "rate(30, 10)", expect: "3.0", kind: normal } }
              - { id: t2, cells: { call: "rate(0, 5)", expect: "0.0", kind: normal } }
              - { id: t3, cells: { call: "rate(5, 0)", expect: None, kind: empty } }
        explanation: |
          - `rate(30, 10)`：30 / 10 = **3.0**，正常。
          - `rate(0, 5)`：观察了 5 分钟，一次也没有，每分钟 **0.0** 次。这是正常的结果，不是空输入。
          - `rate(5, 0)`：没有观察时间，要求说交回 **None**，这是空输入。

          “计数为 0”和“没有观察时间”要分开：前者有确定的答案 0.0，后者要按要求交回 None。
        verify: |
          def spec(count, minutes):
              return None if minutes == 0 else count / minutes
          rows = {"t1": (30, 10), "t2": (0, 5), "t3": (5, 0)}
          answers = {"tests": {row: {"expect": spec(*args), "kind": "empty" if args[1] == 0 else "normal"} for row, args in rows.items()}}
    quiz:
      - id: py42.k1.x1
        kind: [specify]
        uses: [py12.k2, py09.k1]
        body: |
          要求：`in_range(value, low, high)` 在 value 介于 low 和 high 之间时交回 True，**两端都算**；否则交回 False。

          按要求填写每条测试的期望，并说出它是正常还是边界测试。
        slots:
          - id: tests
            type: table
            columns:
              - { id: call, header: 调用 }
              - { id: expect, header: 期望, input: bool }
              - id: kind
                header: 类别
                input: { type: choice, options: [{ id: normal, label: 正常 }, { id: boundary, label: 边界 }] }
            rows:
              - { id: t1, cells: { call: "in_range(5, 5, 10)", expect: true, kind: boundary } }
              - { id: t2, cells: { call: "in_range(7, 5, 10)", expect: true, kind: normal } }
              - { id: t3, cells: { call: "in_range(10, 5, 10)", expect: true, kind: boundary } }
              - { id: t4, cells: { call: "in_range(11, 5, 10)", expect: false, kind: normal } }
        explanation: |
          5 和 10 恰好落在两端，“两端都算”，期望 **True**，它们是**边界**测试：把 `<=` 写成 `<` 的错误，只有它们能查出来。7 在中间，期望 True；11 在外面，期望 False，都是普通的**正常**测试。这个要求有两个端点，所以要两条边界测试。
        verify: |
          def spec(value, low, high):
              return low <= value <= high
          rows = {"t1": (5, 5, 10), "t2": (7, 5, 10), "t3": (10, 5, 10), "t4": (11, 5, 10)}
          answers = {"tests": {row: {"expect": spec(*args), "kind": "boundary" if args[0] in (args[1], args[2]) else "normal"}
                               for row, args in rows.items()}}
      - id: py42.k1.x2
        kind: [debug]
        uses: [py12.k2, py40.k2]
        body: |
          要求：`mean_signal(total, n)` 交回 n 份样本的平均信号 total / n；没有样本（n 为 0）时交回 None。两个人分别写了：

          ```python
          def mean_a(total, n):
              return total / n

          def mean_b(total, n):
              if total == 0:
                  return None
              return total / n
          ```

          对每条测试，填写两个实现能不能通过（交回的值等于期望才算通过，报错算不通过）。
        slots:
          - id: results
            type: table
            columns:
              - { id: test, header: 测试 }
              - { id: a, header: 甲（mean_a）通过, input: bool }
              - { id: b, header: 乙（mean_b）通过, input: bool }
            rows:
              - { id: t1, cells: { test: "调用 (30, 3)，期望 10.0", a: true, b: true } }
              - { id: t2, cells: { test: "调用 (0, 4)，期望 0.0", a: true, b: false } }
              - { id: t3, cells: { test: "调用 (0, 0)，期望 None", a: false, b: true } }
        explanation: |
          - (30, 3)：两个都交回 10.0，都通过。
          - (0, 4)：四份样本的总信号是 0，平均就是 0.0。甲交回 0.0，通过；乙看到 total 为 0 就交回 None，**不通过**。
          - (0, 0)：甲算 0 / 0 报 ZeroDivisionError，**不通过**；乙交回 None，通过。

          甲漏了空输入，乙把“总信号为 0”错当成了“没有样本”。只用正常测试，两个都看不出问题；正常值 0.0 和空输入各有一条测试，才把两种错误都查出来。
        verify: |
          tests = {"t1": ((30, 3), 10.0), "t2": ((0, 4), 0.0), "t3": ((0, 0), None)}
          def passes(name, args, expect):
              r = run(CODE + f"\nresult = {name}{args}")
              if r.error is not None:
                  return False
              return r["result"] is None if expect is None else r["result"] == expect
          answers = {"results": {row: {"a": passes("mean_a", args, expect), "b": passes("mean_b", args, expect)}
                                 for row, (args, expect) in tests.items()}}

  - id: py42.k2
    title: assert 表达期望并在失败时定位差异
    card:
      name: assert 断言
      aliases: [AssertionError, 断言]
      definition: "`assert 条件` 在条件为 True 时什么也不做；为 False 时报 AssertionError 并停在这一行，逗号后的说明一起显示。"
      conditions:
        - 第一条失败的 assert 就让程序停下，它前面的都通过了，后面的不再运行。
        - assert 用于练习和自查；python -O 会跳过它，不拿它检查正式输入的数据。
      example:
        from: py42.k2.e0
        text: |
          ```python
          assert label(12, 10) == "达标"
          assert label(8, 10) == "未达标"
          assert label(10, 10) == "达标", "等于阈值也算达标"
          ```
          函数把 >= 写成了 >，前两条通过，第三条报 AssertionError，并显示“等于阈值也算达标”。
    lesson: |
      测试表写好了，可以让 Python 替你逐条核对。`assert 条件` 的意思是“我断定这个条件成立”：

      ```python
      assert label(12, 10) == "达标"
      ```

      - 条件为 True：什么也不发生，不显示任何东西，程序接着往下走；
      - 条件为 False：报 **AssertionError**，程序停在这一行，后面的行都不运行。

      一条测试写成一行 `assert 调用 == 期望`。期望是 None 时写 `assert mean_signal(0, 0) is None`：判断一个值是不是 None，习惯用 `is None`。

      逗号后面可以加一句说明，失败时随错误一起显示，告诉读的人这一条在查什么：

      ```python
      assert label(10, 10) == "达标", "等于阈值也算达标"
      ```

      失败时这样定位：

      1. 看报错指向哪一行，就知道哪一条测试没通过；它前面的 assert 都通过了。
      2. 单独运行那一行里的调用，例如 `print(label(10, 10))`，看函数实际交回了什么，和期望对比。
      3. 回到函数里，追是哪条路径、哪个中间量出了问题。也可能是测试的期望写错了：拿要求再核对一遍，不要改测试去迁就函数。

      assert 适合练习和自查。用 `python -O` 运行时，Python 会跳过所有 assert；所以不要拿它检查正式输入的数据是否合格，那要用一直会运行的检查。
    example:
      id: py42.k2.e0
      kind: [debug, predict]
      uses: [py11.k2, py40.k2]
      body: |
        要求：signal 大于或等于 limit 时交回 "达标"，否则交回 "未达标"。

        ```python startLine=1
        def label(signal, limit):
            if signal > limit:
                return "达标"
            return "未达标"

        assert label(12, 10) == "达标"
        assert label(8, 10) == "未达标"
        assert label(10, 10) == "达标", "等于阈值也算达标"
        print("全部通过")
        ```
      slots:
        - id: line
          type: text
          format: integer
          prompt: 程序停在第几行？
          key: 8
        - id: shown
          type: choice
          prompt: 会显示“全部通过”吗？
          options:
            - { id: "yes", content: 会 }
            - { id: "no", content: 不会 }
          key: "no"
        - id: actual
          type: choice
          prompt: "`label(10, 10)` 实际交回什么？"
          options:
            - { id: pass, content: 达标 }
            - { id: fail, content: 未达标 }
          key: fail
        - id: fix
          type: choice
          prompt: 按要求，应该改哪里？
          options:
            - id: expect
              content: 把第 8 行的期望改成 "未达标"
              feedback: 这是改测试去迁就函数；要求明说等于阈值算达标。
            - id: condition
              content: 把第 2 行改成 `if signal >= limit:`
            - id: always
              content: 把第 4 行改成 `return "达标"`
              feedback: 那样什么都算达标，第 7 行的测试就会失败。
          key: condition
      explanation: |
        第 6、7 行的 assert 条件成立，什么也不显示。第 **8** 行失败：`label(10, 10)` 实际交回 **未达标**，不等于期望的“达标”，于是报 AssertionError，并显示说明“等于阈值也算达标”。程序停在这里，“全部通过”**不会**显示。

        对照要求，错的是函数：第 2 行的 `>` 不包含等号，应改成 `>=`。改测试的期望是迁就函数；让第 4 行也交回“达标”会让不达标的样本也算达标。
      verify: |
