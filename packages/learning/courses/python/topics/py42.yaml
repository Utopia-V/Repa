    where: 语言参考：assert 语句（§7.3）
    url: https://docs.python.org/3.12/reference/simple_stmts.html#the-assert-statement
    use: reference
  - source: swc-python
    where: 第 10 节：防御性编程（断言）
    url: https://swcarpentry.github.io/python-novice-inflammation/10-defensive.html
    use: reference
