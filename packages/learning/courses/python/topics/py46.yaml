id: py46
title: 把数据处理拆成可核对的步骤
status: complete
minutes: 20
summary: 把一段数据处理读成读入、校验、变换、汇总、输出几步，说清每一步拿到什么、交出什么；结果不对时逐步比对中间结果，找到第一个偏离需求的步骤。
