notes: |
  范围：k1 讲一条“读入→校验→变换→汇总→输出”的流程里每一步的输入和输出（哪张表、哪些列、几行），步骤之间用 assert 检查交接的结果，以及把一步写成函数时只用参数、用 return 交出结果。k2 讲按需求在小表上手算每一步应有的中间结果，与代码的中间结果逐步比对，找出第一个分歧的步骤并只改那一步。
  先修祖先里没有多条件筛选（py18）、新列运算（py21）、排序（py23）和 merge（py29），本节只用单列条件，不排序、不算新列、不连接表。检查点只用 len、count、数值列的 sum 和 assert。分组汇总的组名在索引里，所以导出汇总表时保留索引，讲解里就地说明，与 py34 导出逐行表时写 index=False 的情况区分。groupby 结果按组名排序，中文组名按编码顺序排，题目不问中文组名的先后。
  按原稿约束：用预先给出的 8～15 行以内的有效代码、最多两张各 4～6 行的小表，每次聚焦一种需求偏差；综合题按知识点拆成例题和短练习，不变成从空白写完整分析项目的大作业。k2 里各题聚焦的偏差：例题为去重没写 subset，练习为阈值少了等号、分组丢掉缺失的组、计数漏掉缺失值，复习为 dropna 没写 subset、该留最后一次却留了第一次，测验为阈值少了等号（换成小改代码）、去重用错了列。“分歧从哪一行开始”的答案分别落在第 1、2 行，避免学生学到“总是第一行”。
  “哪一行属于哪一步”按这一行调用的函数归类：read_csv 为读入，assert 为校验，groupby 为汇总，to_csv 为输出，其余为变换；verify 按这条规则算出。“哪一处修改能让结果符合需求”的选项由 verify 逐个代入运行。本节没有需要模型核对的作答位。
  读文件的题用 python 夹具每次重写文件，并删掉上一次留下的输出文件（同一个 topic 的核对共用一个内存文件系统）。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 5 分钟；k2 讲解与例题 4 分钟、练习 5 分钟；收束 1 分钟。
  小表、流程和题目为本课自拟。
intro: |
  这一节把前面学过的读表、校验、去重、去掉缺失、筛选、分组汇总和导出连成一条流程。你不用从空白写分析，要练的是两件事：说出每一步拿到什么、交出什么；结果不对时，找出是哪一步偏离了需求。

  每道题都从题面给出的文件或表重新开始，宿主已经准备好 pandas（`pd`）。题目里的阈值和“达标”都是题目约定，不是科研结论。
wrapup: |
  向同事或 AI 提需求时，可以按步骤说：从哪个文件读入；读入后先检查什么；怎样去重、去掉什么；按哪一列分组、算什么；结果写到哪个文件。

  拿到代码后，按同样的步骤逐个看中间结果：几行、留下了哪些编号。在小表上按需求手算一遍，第一个对不上的地方就是要改的那一步；只改那一步，再从头核对。
