  - topic: py34
    key: true
    weight: 0.50
    covers: [py34.k1]
  - topic: py28
    key: true
    weight: 1.00
    covers: [py28.k1, py28.k2]
  - topic: py42
    key: true
    weight: 1.00
    covers: [py42.k1, py42.k2]
