kps:
  - id: py46.k1
    title: 读入→校验→变换→汇总→输出的接口
    card:
      name: 步骤的接口
      aliases: [处理流程, 中间结果, 检查点]
      definition: 把一段数据处理分成读入、校验、变换、汇总、输出几步，每一步说清拿到哪张表、交出哪张表（哪些列、几行）；下一步只用上一步交出的结果。
      conditions:
        - 中间结果各起一个名字，才能逐步查看和核对。
        - 步骤之间的 assert 检查交接的结果是否符合约定；条件不成立时程序在这一行停下，报 AssertionError。
        - 把一步写成函数时，只用参数拿输入，用 return 交出结果，这一步才能换一批数据照样用。
      example:
        from: py46.k1.e0
        text: |
          ```python
          first = raw.drop_duplicates(subset=["sample_id"])
          measured = first.dropna(subset=["signal"])
          ```
          变换这一步拿到读入的 6 行：每个编号留第一次，剩 5 行；再去掉 signal 缺失的，剩 4 行。
    lesson: |
      一段数据处理代码读起来常常是一长串。把它拆成几步，每一步只回答一个问题：

      | 步骤 | 做什么 | 交出什么 |
      |---|---|---|
      | 读入 | 从文件得到一张表 | 原始表，行数等于文件里的数据行数 |
      | 校验 | 检查表是否符合约定，不改表 | 不交出新表；不符合就停下 |
      | 变换 | 去重、去掉缺失、筛选 | 一张更干净或更小的表 |
      | 汇总 | 按组计数、求平均 | 每组一行的汇总表 |
      | 输出 | 把结果写进文件 | 一个文件 |

      读每一步时，问三件事：它拿到的是哪张表，交出的是哪张表，交出的表有哪些列、几行。下一步只应该用上一步交出的结果。中间结果各有名字，例如 `first`、`measured`，你随时可以看它有几行、留下了哪些编号。

      步骤之间可以放检查点。[assert](repa:concept/py42.k2) 后面写一个应当成立的条件：成立时什么也不发生；不成立时程序在这一行停下，报 AssertionError。数据处理里常用的检查点：

      ```python
      assert raw["sample_id"].count() == len(raw)
      assert summary["n"].sum() == len(measured)
      ```

      第一行说“sample_id 的非缺失个数等于行数”，也就是编号没有缺失；第二行说“各组的 n 加起来等于参加统计的行数”，如果有行在分组时被漏掉，程序会在这里停下。

      把一步写成函数，接口就更清楚：参数是这一步拿到的表，`return` 交出的是这一步的结果。函数里只用参数，不去拿外面的 `raw`，这一步才能换一批数据照样用。

      汇总表每组一行，组名在索引里。导出汇总表时要保留索引，组名才会写进文件；导出逐行的表时才常写 `index=False`。
    example:
      id: py46.k1.e0
      kind: [explain, trace]
      uses: [py15.k1, py15.k2, py19.k3, py25.k2, py28.k1, py34.k1, py42.k2]
      data: [plate_file]
      body: |
        需求是：每个样本只留第一次测量；signal 缺失的样本不参加统计；按组数出样本数 n，并求平均 signal；结果写进 summary.csv。

        ```python startLine=1
        raw = pd.read_csv("plate.csv", dtype={"sample_id": "str"})
        assert raw["sample_id"].count() == len(raw)
        first = raw.drop_duplicates(subset=["sample_id"])
        measured = first.dropna(subset=["signal"])
        summary = measured.groupby("group").agg(n=("sample_id", "count"), mean_signal=("signal", "mean"))
        assert summary["n"].sum() == len(measured)
        summary.to_csv("summary.csv")
        ```

        填写每一行属于哪一步。会交出一张表的行，再写出这张表有几行。
      slots:
        - id: steps
          type: table
          columns:
            - { id: line, header: 行 }
            - id: step
              header: 属于哪一步
              input:
                type: choice
                options:
                  - { id: read, label: 读入 }
                  - { id: check, label: 校验 }
                  - { id: transform, label: 变换 }
                  - { id: summarize, label: 汇总 }
                  - { id: output, label: 输出 }
            - { id: rows, header: 交出的表有几行, input: integer }
          rows:
            - { id: l1, cells: { line: 第 1 行, step: read, rows: 6 } }
            - { id: l2, cells: { line: 第 2 行, step: check, rows: { value: "—" } } }
            - { id: l3, cells: { line: 第 3 行, step: transform, rows: 5 } }
            - { id: l4, cells: { line: 第 4 行, step: transform, rows: 4 } }
            - { id: l5, cells: { line: 第 5 行, step: summarize, rows: 2 } }
            - { id: l6, cells: { line: 第 6 行, step: check, rows: { value: "—" } } }
            - { id: l7, cells: { line: 第 7 行, step: output, rows: { value: "—" } } }
      explanation: |
        | 行 | 步骤 | 交出 |
        |---|---|---|
        | 第 1 行 | 读入 | `raw`，6 行，和文件的 6 行数据一样 |
        | 第 2 行 | 校验 | 编号没有缺失，什么也不发生 |
        | 第 3 行 | 变换 | `first`，5 行：002 只留第一次 |
        | 第 4 行 | 变换 | `measured`，4 行：003 的 signal 缺失，去掉 |
        | 第 5 行 | 汇总 | `summary`，2 行：control 和 drug 各一行 |
        | 第 6 行 | 校验 | n 是 2 和 2，加起来 4，等于 `measured` 的行数 |
        | 第 7 行 | 输出 | 写出 summary.csv，组名在索引里，所以保留索引 |

        每一步都只用上一步交出的表：第 4 行用的是 `first`，不是 `raw`。中间结果都有名字，核对时可以逐个看它们的行数。
      verify: |
        r = run()
        def step(line):
            if "read_csv" in line:
                return "read"
            if line.startswith("assert"):
                return "check"
            if "groupby" in line:
                return "summarize"
            if "to_csv" in line:
                return "output"
            return "transform"
        tables = {"l1": "raw", "l3": "first", "l4": "measured", "l5": "summary"}
        rows = {}
        for i, line in enumerate(CODE.splitlines(), 1):
            cells = {"step": step(line)}
            if f"l{i}" in tables:
                cells["rows"] = len(r[tables[f"l{i}"]])
            rows[f"l{i}"] = cells
        answers = {"steps": rows}
    practice:
      - id: py46.k1.q1
        kind: [explain, trace]
        uses: [py19.k3, py25.k2, py40.k2]
        data: [R]
        body: |
          同事把变换这一步写成了函数：

          ```python
          def clean(table):
              first = table.drop_duplicates(subset=["sample_id"])
              return first.dropna(subset=["signal"])

          measured = clean(raw)
          ```
        slots:
          - id: input
            type: choice
            prompt: "`clean` 这一步拿到的是什么？"
            options:
              - id: global
                content: 外面的变量 `first`
                feedback: "`first` 是函数里面算出的中间结果，不是输入。"
              - id: param
                content: 参数 `table`；这次调用时它就是 `raw`
              - id: file
                content: 直接从 plate.csv 读进来的内容
            key: param
          - id: output
            type: choice
            prompt: "`clean` 交出什么？"
            options:
              - id: printed
                content: 什么也不交出，只是把结果显示在屏幕上
              - id: modified
                content: 什么也不交出，只是把 `raw` 改成了去重后的表
              - id: table
                content: 一张去重并去掉 signal 缺失之后的新表
            key: table
          - id: rows
            type: text
            format: integer
            prompt: "`measured` 有几行？"
            key: 4
          - id: raw_rows
            type: text
            format: integer
            prompt: 调用之后，`raw` 有几行？
            key: 6
            feedback:
              - when: 4
                message: "`clean` 交出的是一张新表，`raw` 本身没有变。"
        explanation: |
          `clean` 的输入是参数 `table`，调用 `clean(raw)` 时它就是 `raw`；`return` 交出一张新表：002 只留第一次（5 行），再去掉 signal 缺失的 003，剩 **4** 行。`raw` 没有被改，仍是 **6** 行。

          换一批数据时写 `clean(另一张表)` 就行，这一步不依赖外面的名字。
        verify: |
          r = run()
          clean = r["clean"]
          # 换一张只有前两行的表，结果跟着变，说明输入来自参数。
          depends = len(clean(raw.iloc[:2])) != len(clean(raw))
          measured = r["measured"]
          answers = {
              "input": "param" if depends else "global",
              "output": "table" if isinstance(measured, pd.DataFrame) and len(r["raw"]) == 6 else "other",
              "rows": len(measured),
              "raw_rows": len(r["raw"]),
          }
      - id: py46.k1.q2
        kind: [predict, debug]
        uses: [py11.k2, py26.k1, py42.k2]
        data: [M]
        body: |
          读入的表里有一行没有编号。阅读代码。

          ```python startLine=1
          assert raw["sample_id"].count() == len(raw)
          first = raw.drop_duplicates(subset=["sample_id"])
          print(len(first))
          ```
        slots:
          - id: stops
            type: choice
            prompt: 程序运行到哪里？
            options:
              - { id: l1, content: 在第 1 行停下 }
              - { id: l2, content: 在第 2 行停下 }
              - { id: l3, content: 在第 3 行停下 }
              - { id: none, content: 不会停下，显示 4 }
            key: l1
          - id: error
            type: text
            prompt: 报的是什么异常？写出异常类型。
            key: AssertionError
        explanation: |
          在**第 1 行**停下，报 **AssertionError**。`raw["sample_id"].count()` 只数非缺失的编号，是 3；`len(raw)` 是 4。两边不相等，检查点不成立，后面的去重和显示都不会运行。

          这正是检查点的用处：编号缺失的表不该悄悄进入去重和汇总，在读入后马上停下，比最后对着汇总表猜原因省事。
        verify: |
          lines = CODE.splitlines()
          stopped = None
          error = None
          for i in range(1, len(lines) + 1):
              result = run("\n".join(lines[:i]))
              if result.error is not None:
                  stopped, error = f"l{i}", result.error
                  break
          answers = {"stops": stopped or "none", "error": error}
      - id: py46.k1.q3
        kind: [modify]
        uses: [py19.k3, py25.k2, py40.k2]
        data: [R]
        body: |
          需求是：

          > 把变换这一步写成函数 `clean(table)`：输入一张样本表 `table`，每个 sample_id 只留第一次测量；第一次测量的 signal 缺失的样本，不参加统计。返回新表，不改输入的表。

          作答框里的函数在表 raw 上结果是对的，可换一张表调用就不对了。找出原因，改好并提交。
        slots:
          - id: code
            type: code
            language: python
