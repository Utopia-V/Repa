          |---|---:|---:|
          | measured 的行数 | 4 | 2 |
          | deep 的行数 | 3 | 1 |
          | summary 的行数 | 3 | 1 |

          第一个对不上的是 `measured`。`dropna()` 没写 subset，只要一行里有任何缺失就去掉：P1、P4 只是没有备注，也被去掉了，只剩 P2、P5。改成 `plots.dropna(subset=["depth"])`，只按 depth 去掉 P3；之后 P1、P4、P5 达到 30，三个坡各一个。改阈值或分组那一行都碰不到真正的原因。
