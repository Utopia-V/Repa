  - id: py46.k2
    title: 从一个中间结果定位需求与代码的分歧
    card:
      name: 定位分歧
      aliases: [逐步核对, 第一个对不上的步骤]
      definition: 结果不符合需求时，按需求在小表上手算每一步应有的中间结果，与代码每一步实际的结果比对；第一个对不上的步骤就是要改的地方。
      conditions:
        - 第一个对不上的步骤之后，后面的结果都会跟着错；只改那一步，再从头核对。
        - 小表要能暴露分歧：有重复测量、有缺失、有恰好等于阈值的值。
      example:
        from: py46.k2.e0
        text: |
          需求要每个编号只留第一次，代码写 `raw.drop_duplicates()` 没写 subset：按需求去重后应剩 5 行，代码实际仍是 6 行，分歧从去重这一步开始。
    lesson: |
      最后的汇总表看着不对时，先别整段重写。拿需求在小表上手算每一步应当交出什么，再看代码每一步实际交出了什么，逐步比对。比如一段四步的代码，比对下来是这样：

      | 步骤 | 按需求应当 | 代码实际 |
      |---|---:|---:|
      | 读入后 | 6 行 | 6 行 |
      | 去掉缺失后 | 5 行 | 5 行 |
      | 筛选后 | 3 行 | 2 行 |
      | 汇总后 drug 组的 n | 2 | 1 |

      第一个对不上的是筛选，分歧就在那一步。它后面的步骤即使代码没错，也会因为拿到了错的输入而跟着错；所以要找“第一个”，而不是“最显眼的那个”。

      前面学过的几种常见分歧：

      - 去重：需求说“同一个编号只留第一次”，代码写 `drop_duplicates()` 没写 subset，只去掉整行完全相同的行；
      - 去掉缺失：需求只说 signal 缺失的不要，代码写 `dropna()` 没写 subset，别的列缺失的行也被去掉；
      - 阈值：需求说“至少 10”，代码写 `> 10`，恰好为 10 的行被丢掉；
      - 分组：groupby 默认不把分组列缺失的行放进任何组，这些行在汇总时悄悄消失；
      - 计数：`("signal", "count")` 只数有值的 signal，需求要的若是“每组有几个样本”，缺失的也要算。

      找到分歧后只改那一步，再从头跑一遍，逐步核对。
    example:
      id: py46.k2.e0
      kind: [trace, debug]
      uses: [py19.k3, py25.k1, py25.k2, py28.k1]
      data: [R]
