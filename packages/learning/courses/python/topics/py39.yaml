id: py39
title: 把一行推导式展开来看
status: complete
minutes: 20
summary: 读懂列表推导式里的取元素、条件和结果三部分，并能在推导式和 for、if、append 的循环之间来回改写。
prerequisites: [py36]
encompassings:
  - {topic: py36, weight: 0.5}
sources:
  - source: think-python
    where: 第 18 章（列表推导式）
    url: https://allendowney.github.io/ThinkPython/chap18.html
    use: reference
  - source: python-docs
    where: 教程第 5 章 §5.1.3（列表推导式）
    url: https://docs.python.org/3.12/tutorial/datastructures.html
    use: reference
notes: |
  范围：只讲一个 for、最多一个 if 的列表推导式，以及它与 py36 的“空列表 + for + if + append”循环的等价改写。if 写在 for 前面的条件表达式（a if 条件 else b）、多个 for、字典和集合推导式都不在本节，只在 k2 讲解里提一句前者是另一回事。py38 的解包在推导式里不用，所以 py38 不列为先修。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 4 分钟、练习 6 分钟；收束 2 分钟。
  题型：预测输出、逐元素追踪表、指认三部分（verify 用 ast 从题面代码里取出取元素的列表、条件和结果表达式，再与选项里的代码比对）、Parsons（带缩进、按测试判）、骨架代码加测试。代码题的初始代码用 ___ 留空，原样提交会因 NameError 不过测试。
  例题、练习的情境与数据为本课自拟；signals 与阈值 10 沿用 py17、py36 的约定。
intro: |
  前面读过“逐个检查并收集”的循环：先建一个空列表，逐个取出元素，满足条件的用 `append` 放进去。AI 写代码时，常把这四行压成一行，叫**列表推导式**。

  这一节把一行推导式拆开来读：从哪个列表取、条件是什么、放进结果的是什么；再练习在推导式和循环之间来回改写。程序仍当作从上往下运行的短脚本。
wrapup: |
  读到 `[… for … in … if …]`，先看中间的 for 从哪个列表取，再看末尾的 if 留下谁，最后回到最前面，看放进结果的是什么。拿不准时，就把它展开成空列表、for、if、append 四行，逐轮追踪。

  请 AI 解释一段推导式时，也可以要它“展开成普通的 for 循环再写一遍”，两种写法的结果应当完全一样。
data:
  counts:
    kind: python
    code: |
      counts = [4, 0, 7, 2]
    display: |
      准备代码：

      ```python
      counts = [4, 0, 7, 2]
      ```
kps:
  - id: py39.k1
    keyPrerequisites: [py36]
    title: 列表推导式中的取元素、条件和结果
    card:
      name: 列表推导式
      aliases: [推导式, list comprehension]
      definition: "`[表达式 for v in 列表 if 条件]` 从列表里逐个取出 v，条件为 True 的才算出表达式，按原顺序放进一个新列表。"
      conditions:
        - 按“中间、末尾、开头”的顺序读：先看 for 从哪个列表取，再看 if 留下谁，最后看最前面放进结果的是什么。
        - 没有 if 时每个元素都进结果；一个都不满足时得到空列表 []。
      example:
        from: py39.k1.e0
        text: |
          ```python
          signals = [8, 12, 10, 7, 15]
          doubled = [v * 2 for v in signals if v >= 10]
          ```
          从 signals 逐个取 v，留下 v >= 10 的 12、10、15，各乘 2，doubled 是 [24, 20, 30]。
    lesson: |
      “逐个检查并收集”的循环这样收集 signal 至少为 10 的读数：

      ```python
      signals = [8, 12, 10, 7, 15]
      kept = []
      for v in signals:
          if v >= 10:
              kept.append(v)
      ```

      同样的事可以写成一行**列表推导式**：

      ```python
      kept = [v for v in signals if v >= 10]
      ```

      两种写法得到同一个 `kept`：`[12, 10, 15]`。方括号里有三部分，按“中间、末尾、开头”的顺序读最顺：

      | 部分 | 写法 | 意思 |
      |---|---|---|
      | 取元素 | `for v in signals` | 从 signals 里逐个取出元素，每次叫 v |
      | 条件 | `if v >= 10` | 只有条件为 True 的元素才往下走 |
      | 结果 | 最前面的 `v` | 放进新列表的东西 |

      最前面的部分不一定是 `v` 本身，也可以是用 v 算出来的值。仍用这个 `signals`：

      - `[v * 2 for v in signals if v >= 10]` 得到 `[24, 20, 30]`：先筛，再把留下的各乘 2；
      - `[v * 2 for v in signals]` 没有 if，每个都进结果，得到 `[16, 24, 20, 14, 30]`；
      - `[v for v in signals if v > 20]` 一个都不满足，得到空列表 `[]`。

      结果里的元素保持原列表中的先后顺序，长度可能比原列表短，但不会更长。
    example:
      id: py39.k1.e0
      kind: [explain, predict]
      uses: [py35.k1]
      body: |
        ```python
        signals = [8, 12, 10, 7, 15]
        doubled = [v * 2 for v in signals if v >= 10]
        print(doubled)
        ```
      slots:
        - id: source
          type: choice
          prompt: 从哪个列表逐个取元素？
          options:
            - id: doubled
              content: |
                ```python
                doubled
                ```
            - id: signals
              content: |
                ```python
                signals
                ```
            - id: v
              content: |
                ```python
                v
                ```
          key: signals
        - id: condition
          type: choice
          prompt: 条件是哪一部分？
          options:
            - id: expr
              content: |
                ```python
                v * 2
                ```
            - id: loop
              content: |
                ```python
                for v in signals
                ```
            - id: test
              content: |
                ```python
                v >= 10
                ```
          key: test
        - id: result
          type: choice
          prompt: 放进结果的是哪一部分？
          options:
            - id: value
              content: |
                ```python
                v
                ```
            - id: doubled_value
              content: |
                ```python
                v * 2
                ```
            - id: test
              content: |
                ```python
                v >= 10
                ```
          key: doubled_value
        - id: output
          type: text
          match: output
          prompt: 程序显示什么？
          key: "[24, 20, 30]"
      explanation: |
        从 **signals** 里逐个取 v；条件是 **v >= 10**；放进结果的是 **v * 2**。

        逐个看：8 和 7 不满足条件，跳过；12、10、15 满足，各乘 2 得到 24、20、30。显示 **[24, 20, 30]**，顺序和原列表一致。`doubled` 是最后接住新列表的名字，不是取元素的来源。
      verify: |
        import ast
        comp = next(node for node in ast.walk(ast.parse(CODE)) if isinstance(node, ast.ListComp))
        loop = comp.generators[0]
        parts = {"source": ast.unparse(loop.iter), "condition": ast.unparse(loop.ifs[0]), "result": ast.unparse(comp.elt)}
        answers = {"output": run().lines()[0]}
        for slot, text in parts.items():
            fits = [option for option, code in OPTIONS[slot].items() if code.strip() == text]
            answers[slot] = fits[0] if len(fits) == 1 else fits
