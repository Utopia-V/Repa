  - id: py39.k2
    keyPrerequisites: [py36]
    title: 与显式 for/if 的等价关系
    card:
      name: 推导式展开
      aliases: [改写成循环]
      definition: "`new = [表达式 for v in 列表 if 条件]` 等价于先写 `new = []`，再在 `for v in 列表:` 里、`if 条件:` 成立时 `new.append(表达式)`。"
      conditions:
        - 展开时三部分各就各位：for 行照抄 for 部分，if 行照抄条件，append 的括号里写最前面的表达式。
        - 推导式总是建一个新列表，原列表不变；`a if 条件 else b` 写在 for 前面时是给每个元素二选一，不是筛选。
      example:
        from: py39.k2.e0
        text: |
          `kept = [v * 2 for v in signals if v >= 10]` 展开成：
          ```python
          kept = []
          for v in signals:
              if v >= 10:
                  kept.append(v * 2)
          ```
    lesson: |
      推导式和“逐个检查并收集”的循环可以一一对上：

      ```python
      kept = []
      for v in signals:
          if v >= 10:
              kept.append(v * 2)
      ```

      ```python
      kept = [v * 2 for v in signals if v >= 10]
      ```

      | 循环里的 | 推导式里的 |
      |---|---|
      | `kept = []`，先建空列表 | 外面的一对方括号 |
      | `for v in signals:` | 中间的 `for v in signals` |
      | `if v >= 10:` | 末尾的 `if v >= 10` |
      | `kept.append(v * 2)` 括号里的 `v * 2` | 最前面的 `v * 2` |

      **把推导式展开成循环**：先写 `名字 = []`；再把 for 部分照抄成一行，末尾加冒号；if 部分照抄成下一行，缩进一层、加冒号；最后一行再缩进一层，写 `名字.append(最前面的表达式)`。没有 if 的推导式，就少掉 if 那一行，append 只缩进一层。

      **把循环改写成推导式**：反过来，从 append 的括号里取出表达式放在最前面，后面接 for 部分和 if 部分。只有“空列表、for、可选的 if、append”这种形状的循环能这样改。

      两种写法的结果完全一样：都按原顺序收集、都建一个新列表，原来的 `signals` 不变。

      另外，AI 写的代码里有时会出现 `[a if 条件 else b for v in 列表]`，if 写在 for **前面**、还带 else。那是给每个元素二选一，结果和原列表一样长，不会去掉元素，和本节的筛选不是一回事，这里不展开。
    example:
      id: py39.k2.e0
      kind: [modify]
      uses: [py36.k1, py10.k2]
      body: |
        把下面这行推导式展开成循环：把需要的代码块排好，并设好缩进。有的块用不上。宿主已经准备好列表 `signals`。

        ```python
        kept = [v * 2 for v in signals if v >= 10]
        ```
      slots:
        - id: program
          type: order
          partial: true
          indent: 2
          items:
            - { id: append_plain, code: kept.append(v) }
            - { id: loop, code: "for v in signals:" }
            - { id: test_gt, code: "if v > 10:" }
            - { id: start, code: "kept = []" }
            - { id: append_double, code: kept.append(v * 2) }
            - { id: test, code: "if v >= 10:" }
          key: [start, loop, test, append_double]
          indents: { start: 0, loop: 0, test: 1, test_gt: 1, append_double: 2, append_plain: 2 }
          tests:
            - name: 表里有恰好等于 10 的值
              setup: signals = [8, 12, 10, 7, 15]
              expect:
                kept: "[24, 20, 30]"
                signals: "[8, 12, 10, 7, 15]"
            - name: 换一组值
              hidden: true
              setup: signals = [12, 9, 10, 30]
              expect:
                kept: "[24, 20, 60]"
      explanation: |
        ```python
        kept = []
        for v in signals:
            if v >= 10:
                kept.append(v * 2)
        ```

