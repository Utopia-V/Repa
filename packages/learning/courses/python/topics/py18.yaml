      - id: py18.k2.x2
        kind: [specify, explain]
        uses: [py17.k1, py09.k2]
        data: [soil]
        body: |
          需求是：“site 为北坡或南坡，并且 pH 低于 6.0”。
        slots:
          - id: line
            type: choice
            prompt: 哪一种写法符合这个需求？
            options:
              - id: bare
                content: |
                  ```python
                  mask = soil["site"].isin(["北坡", "南坡"]) & soil["ph"] < 6.0
                  ```
              - id: priority
                content: |
                  ```python
                  mask = (soil["site"] == "北坡") | (soil["site"] == "南坡") & (soil["ph"] < 6.0)
                  ```
              - id: right
                content: |
                  ```python
                  mask = soil["site"].isin(["北坡", "南坡"]) & (soil["ph"] < 6.0)
                  ```
              - id: either
                content: |
                  ```python
                  mask = soil["site"].isin(["北坡", "南坡"]) | (soil["ph"] < 6.0)
                  ```
            key: right
          - id: count
            type: text
            format: integer
            prompt: 按这个需求，表 soil 里有几行符合？
            key: 1
        explanation: |
          **`soil["site"].isin(["北坡", "南坡"]) & (soil["ph"] < 6.0)`** 符合需求，只有 P2（南坡，pH 5.8）**1** 行。

          比较不加括号的写法不报错，却先算了 `isin(...) & soil["ph"]`，结果每行都是 True；第二种写法里 `&` 先于 `|` 算，北坡的 P1 不论 pH 都会被留下；用 `|` 的写法把“并且”写成了“或者”。
        verify: |
          wanted = [label for label, row in soil.iterrows() if row["site"] in ("北坡", "南坡") and row["ph"] < 6.0]
          fits = []
          for option, line in OPTIONS["line"].items():
              r = run(line)
              if r.error is None and list(r["mask"][r["mask"]].index) == wanted:
                  fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits, "count": len(wanted)}
