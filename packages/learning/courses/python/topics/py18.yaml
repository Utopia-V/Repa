                  df: df
        explanation: |
          ```python
          mask = df["group"].isin(["low", "high"]) & (df["signal"] >= limit)
          result = df.loc[mask, ["sample_id", "signal"]]
          ```

          原代码缺括号，先算了 `"low" | df["group"]` 这类没有意义的组合，所以报错。用 `isin` 写“属于 low 或 high”，再给阈值比较加括号，用 `&` 连起来。也可以写成 `((df["group"] == "low") | (df["group"] == "high")) & (df["signal"] >= limit)`：外面那层括号让 `|` 先算，不能省。

