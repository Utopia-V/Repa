id: py18
title: 筛选多个条件
status: complete
minutes: 20
summary: 用 &、|、~ 把两列布尔掩码逐行组合；每个比较各加括号，用 isin 表示“属于这几个值之一”。
prerequisites:
  - topic: py17
    key: true
    weight: 1.00
    covers: [py17.k1, py17.k2]
  - topic: py09
    key: true
    weight: 1.00
    covers: [py09.k1, py09.k2]
sources:
  - source: pydata-book
    where: 第 5 章 §5.2
    url: https://wesmckinney.com/book/pandas-basics
    use: reference
  - source: pandas-docs
    where: 入门教程：子集与筛选
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/03_subset_data.html
    use: reference
notes: |
  建议题型与判分：预测输出（P）、找错（P）、小改代码（T）。
  范围：接着 py17 的单列掩码和 py09 的单值 and/or/not，只讲两三个条件的逐行组合。不讲 query、between、where，也不讲缺失值参与比较（py19）。
  k1 的代码尽量先把每个条件存成一个名字（high、treated），避开运算顺序；k2 再讲为什么直接写在一行里要给每个比较加括号。缺括号时有的写法报错，有的不报错却算出别的结果（例如 ~df["signal"] >= 10 全为 False），两种都要见到。
  “属于 low 或 high”与“不是 control”只在表里没有别的组时相同，讲解里点明，小改代码题用含 vehicle 组的表检查。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、三道练习 4 分钟；k2 讲解与例题 4 分钟、两道读码题 3 分钟、小改代码题 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  上一节用一个条件留下行，这一节把两个条件接起来：“signal 至少 10，并且不是对照组”“低剂量组或高剂量组”。

  宿主已经准备好 pandas 和数据表，每道题都从题面给出的表重新开始。大多数题用表 T：`sample_id` 是样本编号，`signal` 是测量值（任意单位），`group` 是实验组：`control` 对照、`low` 低剂量、`high` 高剂量。左边的原行索引是行标签。题目里的筛选规则都是人为约定，不代表科研结论。
wrapup: |
  向同事或 AI 提多条件的要求时，说清是“同时满足”还是“满足其一”，属于哪几个组就把组名逐个列出来，例如：“保留 group 为 low 或 high、并且 signal 至少为 10 的行”。

  拿到代码后，先看“并且”是不是写成了 `&`、“或者”是不是 `|`；再看每个比较是否各有一对括号；最后用一行恰好只满足一个条件的数据，核对它有没有被错误地留下。
