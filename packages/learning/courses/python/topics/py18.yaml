      - id: py18.k2.q3
        kind: [modify]
        uses: [py17.k2, py09.k2]
        data: [T]
        body: |
          需求是：

          > 保留 group 为 low 或 high、并且 signal 至少达到 `limit` 的行，依次输出 sample_id 和 signal 两列，保留原行顺序和原索引，不改变 `df`。

          同事写的代码在作答框里，运行时报错。请改动它并提交，最终结果变量仍叫 `result`。宿主另外提供了 `limit`，本例为 10，换一次分析可以取别的值。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              mask = df["group"] == "low" | df["group"] == "high" & df["signal"] >= limit
              result = df.loc[mask, ["sample_id", "signal"]]
            solution: |
              mask = df["group"].isin(["low", "high"]) & (df["signal"] >= limit)
              result = df.loc[mask, ["sample_id", "signal"]]
            accepts:
              - |
                mask = ((df["group"] == "low") | (df["group"] == "high")) & (df["signal"] >= limit)
                result = df.loc[mask, ["sample_id", "signal"]]
              - result = df[df["group"].isin(["high", "low"]) & (df["signal"] >= limit)][["sample_id", "signal"]]
            rejects:
              - code: |
                  mask = (df["group"] == "low") | (df["group"] == "high") & (df["signal"] >= limit)
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: "& 先于 | 算，低剂量组的行不论 signal 多少都留下"
              - code: |
                  mask = df["group"].isin(["low", "high"]) | (df["signal"] >= limit)
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 把“并且”写成了 |
              - code: |
                  mask = df["group"].isin(["low", "high"]) & (df["signal"] > limit)
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 漏掉恰好等于 limit 的行
              - code: |
                  mask = df["group"].isin(["low", "high"]) & df["signal"] >= limit
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 比较没加括号，不报错却算出全为 False 的掩码
              - code: |
                  mask = ~df["group"].isin(["control"]) & (df["signal"] >= limit)
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 写成“不是 control”，表里有别的组时会多留下
              - code: |
                  mask = df["group"].isin(["low", "high"]) & (df["signal"] >= 10)
                  result = df.loc[mask, ["sample_id", "signal"]]
                why: 把阈值写死成 10
            tests:
              - name: 表 T，limit 为 10
