    where: 第 8 章 §8.2（沿轴连接）
    url: https://wesmckinney.com/book/data-wrangling
    use: reference
  - source: pandas-docs
    where: 入门教程：多表组合（concat 部分）
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/08_combine_dataframes.html
    use: reference
notes: |
  范围：只讲沿行叠加（pd.concat 的缺省方向）。axis=1 左右并排只作为错误选项出现；keys 参数、多层索引和按键拼表（py29 的 merge）不在本节。新列用 assign 就地说明（返回多了一列的新表，原表不变），不讲 .loc 赋值（py22）。去重不在本节（py25）。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、三道练习 5 分钟；k2 讲解与例题 3 分钟、两道读码题 3 分钟、小改代码题 4 分钟；收束 1 分钟。k2.q3 的开放题可以口述。
  小表、讲解和题目为本课自拟。复习和测验题全部由程序或测试核对，没有交给模型核对的作答位。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始。这一节的表大多是同一项测量分几批记下的：`sample_id` 是样本编号，`signal` 是一次测量的值（任意单位）。每张表左边的行索引是这张表自己的行标签，读入时都从 0 开始编号，所以不同的表会有相同的行索引。
wrapup: |
  把几批记录叠成一张表时，可以这样提要求：“把 a、b 两批按这个顺序上下叠起来；列名必须一致，不一致就先停下来告诉我；叠之前给每批加一列 batch 记下来源；结果的行索引从 0 重新编号。”

  拿到结果后先核对三件事：行数是不是各批之和，列是不是没有多出来，有没有意外的 NaN。
