      - id: py30.k2.q2
        kind: [modify]
        uses: [py06.k1, py14.k1]
        data: [A, B]
        body: |
          需求是：

          > 把 a、b 两批按这个顺序上下叠起来，行索引从 0 重新编号；加一列 batch，a 的行写 "A"，b 的行写 "B"。不改变 a、b。

          作答框里的代码只做了第一步。请改动它并提交，结果仍叫 `result`。`a.assign(batch="A")` 返回一张多了 batch 列的新表，a 不变。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              result = pd.concat([a, b])
            solution: |
              result = pd.concat([a.assign(batch="A"), b.assign(batch="B")], ignore_index=True)
            accepts:
              - |
                first = a.assign(batch="A")
                second = b.assign(batch="B")
                result = pd.concat([first, second], ignore_index=True)
            rejects:
              - code: result = pd.concat([a.assign(batch="A"), b.assign(batch="B")])
                why: 没有重新编号，行索引仍是 0、1、0、1、2
              - code: result = pd.concat([a, b], ignore_index=True)
                why: 只重新编号，没有来源列
              - code: result = pd.concat([a.assign(batch="B"), b.assign(batch="A")], ignore_index=True)
                why: 两批的来源写反了
              - code: result = pd.concat([b.assign(batch="B"), a.assign(batch="A")], ignore_index=True)
                why: 两批的先后颠倒了
              - code: result = pd.concat([a, b], ignore_index=True).assign(batch="A")
                why: 叠完再加列，所有行都成了 "A"
              - code: |
                  a = a.assign(batch="A")
                  b = b.assign(batch="B")
                  result = pd.concat([a, b], ignore_index=True)
                why: 把 a、b 换成了加过列的表
            tests:
              - name: 两批测量
                expect:
                  result: 'pd.DataFrame({"sample_id": ["S_A", "S_B", "S_C", "S_D", "S_E"], "signal": [8, 10, 13, 10, 9], "batch": ["A", "A", "B", "B", "B"]})'
                  a: a
                  b: b
              - name: 换两批行数不同的表
                hidden: true
                data: [A2, B2]
                expect:
                  result: 'pd.DataFrame({"sample_id": ["S_K", "S_L", "S_M", "S_N"], "signal": [5, 12, 7, 9], "batch": ["A", "A", "A", "B"]})'
                  a: a
                  b: b
        explanation: |
          ```python
          result = pd.concat([a.assign(batch="A"), b.assign(batch="B")], ignore_index=True)
          ```

          叠之前给每批加上来源列，叠的时候加 `ignore_index=True` 重新编号。结果 5 行 3 列，行索引 0 到 4，batch 列依次是 A、A、B、B、B。先叠再 `.assign(batch="A")` 会让所有行都写成 A；写成 `a = a.assign(...)` 则改掉了原来的 a。判分时还会换两批行数不同的表来运行你的代码。
      - id: py30.k2.q3
        kind: [specify]
        body: |
          同事说：“把三个站点的测量文件叠成一张表给我。”你打开文件发现：三个文件都没有记录站点的列，各自的行索引都从 0 开始；其中一个文件把测量值的列名写成了 `Signal`，另外两个写的是 `signal`。

          请写一段可核对的要求，说清：① 叠起来以后怎样知道每行来自哪个站点；② 结果的行索引怎样处理；③ 列名不一致时怎么办。
        slots:
