id: py30
title: 把同结构的多份记录叠起来
status: complete
minutes: 20
summary: 用 pd.concat 把几批同结构的记录上下叠成一张表：行数相加、列按列名对齐；看懂默认保留的重复行索引，用 ignore_index 重新编号，并在叠之前加一列来源。
