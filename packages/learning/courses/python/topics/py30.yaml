                guide: 要求叠之前给每个文件加一列站点（写明列名和取值），而不是靠行索引或行的先后去猜。
              - id: index
                label: 行索引
                guide: 写明结果从 0 重新编号（或说明保留原索引的理由与用法），不能留着重复的行索引却按索引取行。
              - id: columns
                label: 列名不一致
                guide: 写明先把 Signal 统一成 signal（或停下来确认哪个是对的）再叠，叠完核对列数没有变多、signal 列没有意外的缺失；不能接受多出一列。
        explanation: |
          一种写法：**叠之前给每个文件加一列 station，分别写站点名；把测量值的列名统一成 signal 再叠；叠的时候从 0 重新编号行索引。叠完核对：行数等于三个文件之和，列只有原来的几列加 station，signal 列没有新出现的缺失。**

          列名的统一也可以写成“遇到不一致先停下来问我”，关键是不能让测量值被拆进两列。
