kps:
  - id: py30.k1
    title: concat 沿行叠加并按列名对齐
    card:
      name: 上下叠加
      aliases: [concat, 纵向合并, 叠表]
      definition: pd.concat([a, b]) 把列表里的表按顺序上下接起来：行数相加，列按列名配对，不按列的位置。
      conditions:
        - 列名只要差一点（大小写、拼写），就会成为两列，各自缺的地方是 NaN。
        - 列表里排在前面的表，它的行在上面；结果的列沿用第一张表的先后。
      example:
        from: py30.k1.e0
        text: |
          ```python
          result = pd.concat([a, b])
          ```
          a 的 2 行在上、b 的 3 行在下，共 5 行；列仍是 sample_id、signal 两列。
    lesson: |
      同一项测量分几批记下，每批一张表，列都一样。要把它们放进一张表，写：

      ```python
      result = pd.concat([a, b])
      ```

      方括号里是一个列表，`concat` 按[列表的顺序](repa:concept/py06.k1)把这些表上下接起来：a 的行在上，b 的行在下。行数相加，a 有 2 行、b 有 3 行，结果有 5 行。

      列是**按列名**配对的，不看列在表里排第几。表 c 的列是 signal 在前、sample_id 在后，叠到 a 下面时，它的编号仍进 sample_id 列，测量值仍进 signal 列；结果的列沿用第一张表的先后。

      反过来，列名只要差一点，pandas 就把它们当成两列。表 d 把测量值写成了 `Signal`（大写 S），`pd.concat([a, d])` 会得到 sample_id、signal、Signal 三列：a 的行在 Signal 列是 NaN，d 的行在 signal 列是 NaN。原来的整数也因为混进了 NaN 变成了小数（8.0）。

      所以叠完先核对：行数是不是各表之和，列是不是没有多出来，有没有意外的[缺失](repa:concept/py19.k1)。
    example:
      id: py30.k1.e0
      kind: [predict]
      uses: [py06.k1, py14.k1, py14.k2]
      data: [A, B]
      body: |
        两批测量要放进一张表。阅读代码，说出 `result` 的样子。

        ```python
        result = pd.concat([a, b])
        ```
      slots:
        - id: rows
          type: order
          prompt: 按 `result` 里从上到下的顺序，排出各行的 sample_id。
          items:
            - { id: S_C, content: S_C }
            - { id: S_A, content: S_A }
            - { id: S_E, content: S_E }
            - { id: S_B, content: S_B }
            - { id: S_D, content: S_D }
          key: [S_A, S_B, S_C, S_D, S_E]
        - id: nrows
          type: text
          format: integer
          prompt: "`result.shape` 的第一个数（行数）"
          key: 5
        - id: ncols
          type: text
          format: integer
          prompt: "`result.shape` 的第二个数（列数）"
          key: 2
      explanation: |
        a 的两行 **S_A、S_B** 在上，b 的三行 **S_C、S_D、S_E** 接在下面，各表内部的先后不变。行数 2 + 3 = **5**；两张表的列名相同，按名字配对后仍是 **2** 列，shape 为 (5, 2)。
      verify: |
        result = run()["result"]
        answers = {
            "rows": list(result["sample_id"]),
            "nrows": result.shape[0],
            "ncols": result.shape[1],
        }
    practice:
      - id: py30.k1.q1
        kind: [predict]
        uses: [py06.k1, py14.k2]
        data: [A, B]
        body: |
          这次把 b 写在列表的前面。

          ```python
          result = pd.concat([b, a])
          ```
        slots:
          - id: rows
            type: order
            prompt: 按从上到下的顺序，排出各行的 sample_id。
            items:
              - { id: S_A, content: S_A }
              - { id: S_B, content: S_B }
              - { id: S_C, content: S_C }
              - { id: S_D, content: S_D }
              - { id: S_E, content: S_E }
            key: [S_C, S_D, S_E, S_A, S_B]
          - id: nrows
            type: text
            format: integer
            prompt: 行数
            key: 5
        explanation: |
          依次是 **S_C、S_D、S_E、S_A、S_B**，共 **5** 行。列表里谁在前，谁的行就在上面；concat 不会按编号或测量值重新排序。
        verify: |
          result = run()["result"]
          answers = {"rows": list(result["sample_id"]), "nrows": len(result)}
      - id: py30.k1.q2
        kind: [predict, explain]
        uses: [py14.k1, py16.k1]
        data: [A, C]
        body: |
          表 c 的两列先后与 a 不同。阅读代码，说出 `result` 的样子。

          ```python
          result = pd.concat([a, c])
          ```
        slots:
          - id: columns
            type: order
            prompt: "`result` 的列从左到右是哪几列？"
            items:
              - { id: signal, content: "`signal`" }
              - { id: sample_id, content: "`sample_id`" }
            key: [sample_id, signal]
          - id: cell
            type: text
            format: integer
            prompt: "`result` 里 sample_id 为 S_F 的那一行，signal 是多少？"
            key: 7
          - id: why
            type: choice
            prompt: 为什么 c 的编号没有跑进 signal 列？
            options:
              - id: name
                content: concat 按列名配对，不看列排在第几
              - id: sorted
                content: concat 先把每张表的列按字母排好再叠
              - id: luck
                content: 这只是碰巧，换一张表就会错位
            key: name
        explanation: |
          列仍是 **sample_id、signal**，沿用第一张表 a 的先后。S_F 那一行的 signal 是 **7**：concat 按列名配对，c 里叫 signal 的那一列进 signal 列，叫 sample_id 的进 sample_id 列，与它们在 c 里排第几无关。
        verify: |
          result = run()["result"]
          by_id = dict(zip(result["sample_id"], result["signal"]))
          # c 的列序与 a 相反；如果按位置拼，S_F 的测量值就不会是 c 里与它同行的 signal。
          aligned = all(by_id[sample] == value for sample, value in zip(c["sample_id"], c["signal"]))
          answers = {
              "columns": list(result.columns),
              "cell": by_id["S_F"],
              "why": "name" if aligned and list(result.columns) == list(a.columns) else "luck",
          }
      - id: py30.k1.q3
        kind: [predict, debug]
        uses: [py14.k2, py19.k1]
        data: [A, D]
        body: |
          表 d 把测量值的列名写成了 `Signal`。屏幕上依次显示什么？

          ```python
          result = pd.concat([a, d])
          print(result.shape)
          print(result["signal"].isna().sum())
          ```
        slots:
          - id: shape
            type: text
            match: output
            prompt: 第一行
            key: (4, 3)
            feedback:
              - when: (4, 2)
                message: signal 和 Signal 名字不同，concat 把它们当成两列。
          - id: missing
            type: text
            match: output
            prompt: 第二行
            key: "2"
          - id: sign
            type: choice
            prompt: 下面哪个现象最能提醒你列名没有对上？
            options:
              - id: extra
                content: 列数比每批表多了一列，而且 signal 列里出现了 NaN
              - id: rows
                content: 行数等于两批的行数之和
              - id: order
                content: d 的行排在 a 的行下面
            key: extra
        explanation: |
          第一行显示 **(4, 3)**：行数 2 + 2 = 4 是对的，但列多了一列 `Signal`。第二行显示 **2**：d 的两行在 signal 列没有值。

          行数相加、d 的行在下面都是正常现象；**多出一列、signal 列出现了原本没有的 NaN**，才说明列名没对上。修正的办法是先把列名统一，再叠。
        verify: |
          r = run()
          lines = r.lines()
          result = r["result"]
          each = {len(a.columns), len(d.columns)}
          answers = {
              "shape": lines[0],
              "missing": lines[1],
              "sign": "extra" if result.shape[1] > max(each) and result["signal"].isna().any() else "other",
          }
    review:
      - id: py30.k1.r1
        kind: [predict, explain]
        uses: [py14.k1, py14.k2, py19.k1]
        data: [spring, autumn]
        body: |
          春季和秋季的记录要放进一张表。判断下面每句关于 `both` 的话对不对。

          ```python
          both = pd.concat([spring, autumn])
          ```
        slots:
          - id: claims
            type: table
            columns:
              - { id: claim, header: 说法 }
              - { id: ok, header: 对吗, input: bool }
            rows:
              - { id: c1, cells: { claim: both 有 5 行, ok: true } }
              - { id: c2, cells: { claim: both 最左边的一列是 depth, ok: false } }
              - { id: c3, cells: { claim: 秋季的 28 和 33 都在 depth 列里, ok: true } }
              - { id: c4, cells: { claim: both 里有缺失值（NaN）, ok: false } }
        explanation: |
          第 1、3 句对，第 2、4 句错。行数 3 + 2 = 5；列沿用第一张表 spring 的先后，最左边是 site；两张表的列名完全相同，只是先后不同，按列名配对后秋季的深度进了 depth 列，也就没有产生缺失值。
        verify: |
          both = run()["both"]
          answers = {"claims": {
              "c1": {"ok": len(both) == 5},
              "c2": {"ok": both.columns[0] == "depth"},
              "c3": {"ok": all(value in list(both["depth"]) for value in autumn["depth"])},
              "c4": {"ok": bool(both.isna().any().any())},
          }}
      - id: py30.k1.r2
        kind: [predict, debug]
        uses: [py19.k1]
        data: [north, south_typo]
        body: |
          南站的问卷把年龄一列写成了 `Age`。叠起来以后，每一列各有几个缺失值？

          ```python
          result = pd.concat([north, south])
          ```
        slots:
          - id: missing
            type: table
            columns:
              - { id: column, header: 列 }
              - { id: n, header: "`result[列].isna().sum()`", input: integer }
            rows:
              - { id: respondent, cells: { column: respondent, n: 0 } }
              - { id: age, cells: { column: age, n: 2 } }
              - { id: Age, cells: { column: Age, n: 3 } }
        explanation: |
          respondent 两站都有，没有缺失，为 **0**；age 只有北站有，南站的 2 行在这里是 NaN，为 **2**；Age 只有南站有，北站的 3 行在这里是 NaN，为 **3**。一个人的年龄被拆进了两列，任何一列单独拿去计算都会少掉一部分人。
        verify: |
          result = run()["result"]
          answers = {"missing": {column: {"n": result[column].isna().sum()} for column in result.columns}}
    quiz:
      - id: py30.k1.x1
        kind: [predict]
        uses: [py06.k1, py14.k2]
        data: [jan, feb]
        body: |
          要把二月的浊度记录接在一月的下面，得到一张 6 行 2 列的表。哪一行代码做到了？
        slots:
          - id: code
            type: choice
            options:
              - id: side
                content: |
                  ```python
                  result = pd.concat([jan, feb], axis=1)
                  ```
              - id: reversed
                content: |
                  ```python
                  result = pd.concat([feb, jan])
                  ```
              - id: right
                content: |
                  ```python
                  result = pd.concat([jan, feb])
                  ```
              - id: no_list
                content: |
                  ```python
                  result = pd.concat(jan, feb)
                  ```
            key: right
        explanation: |
          `pd.concat([jan, feb])`：一月 3 行在上，二月 3 行在下，6 行 2 列。把 feb 写在前面，二月的行就跑到了上面；`axis=1` 是左右并排，得到 3 行 4 列；不写方括号时 concat 拿不到“一组表”，会报错。
        verify: |
          def fits(code):
              r = run(code)
              if r.error is not None:
                  return False
              result = r["result"]
              return (result.shape == (6, 2)
                      and list(result["point"]) == list(jan["point"]) + list(feb["point"])
                      and list(result["ntu"]) == list(jan["ntu"]) + list(feb["ntu"]))
          good = [option for option, code in OPTIONS["code"].items() if fits(code)]
          answers = {"code": good[0] if len(good) == 1 else good}
      - id: py30.k1.x2
        kind: [predict]
        uses: [py14.k1, py19.k1]
        data: [plot_a, plot_b]
        body: |
          乙地块的表多记了一列备注 `note`。阅读代码，说出 `result` 的样子。没有值的格子填 NaN。

          ```python
          result = pd.concat([plot_a, plot_b])
          ```
        slots:
          - id: columns
            type: order
            prompt: "`result` 的列从左到右是哪几列？"
            items:
              - { id: note, content: "`note`" }
              - { id: height, content: "`height`" }
              - { id: plant_id, content: "`plant_id`" }
            key: [plant_id, height, note]
          - id: first_note
            type: text
            prompt: "`result` 第一行（A1）的 note 是什么？"
            quick: [NaN]
            key: NaN
          - id: missing
            type: text
            format: integer
            prompt: "`result[\"note\"].isna().sum()` 是多少？"
            key: 3
        explanation: |
          列是 **plant_id、height、note**：前两列沿用 plot_a 的先后，plot_b 多出的 note 接在后面。甲地块没有备注，A1 那一行的 note 是 **NaN**；甲地块的 3 行都缺 note，所以缺失个数是 **3**。height 两张表都有，不受影响。
        verify: |
          result = run()["result"]
          first = result["note"].iloc[0]
          answers = {
              "columns": list(result.columns),
              "first_note": "NaN" if first != first else first,
              "missing": result["note"].isna().sum(),
          }

  - id: py30.k2
    title: ignore_index 与来源列的用途
    card:
      name: 来源列
      aliases: [ignore_index, 重新编号, batch 列]
      definition: concat 默认保留各表原来的行索引，可能重复；ignore_index=True 从 0 重新编号，但原索引也丢了。要知道每行来自哪一批，叠之前给每张表加一列来源。
      conditions:
        - 行索引重复时，result.loc[0] 会取到不止一行。
        - 重新编号以后，只有来源列还能说明一行来自哪张表。
      example:
        from: py30.k2.e0
        text: |
          `pd.concat([a, b])` 的行索引是 0、1、0、1、2；加 `ignore_index=True` 后是 0、1、2、3、4。
    lesson: |
      concat 默认把每张表原来的行索引一起带过来。a 的行索引是 0、1，b 的是 0、1、2，叠起来就是 **0、1、0、1、2**：同一个标签出现了两次。这时 `result.loc[0]` 按[标签](repa:concept/py16.k2)取行，会取到两行，一行来自 a，一行来自 b。

      加上 `ignore_index=True`，结果的行索引从 0 重新编号为 0、1、2、3、4，不再重复：

      ```python
      result = pd.concat([a, b], ignore_index=True)
      ```

      但重新编号也把原来的索引丢了。无论编不编号，表里都没有哪一列写着“这一行来自哪一批”。要能追溯来源，叠之前给每张表加一列：

      ```python
      result = pd.concat([a.assign(batch="A"), b.assign(batch="B")], ignore_index=True)
      ```

      `a.assign(batch="A")` 返回一张多了 batch 列的新表，这一列每行都是 "A"；a 本身不变。这样叠完以后，行索引不重复，每一行也都带着自己的来源。如果文件里本来就有记录来源的列，就不必再加，但要先确认它确实存在、写得对。
