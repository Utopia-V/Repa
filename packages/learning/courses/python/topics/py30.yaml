  - topic: py14
    key: true
    weight: 0.67
    covers: [py14.k1, py14.k2]
  - topic: py19
    key: true
    weight: 0.33
    covers: [py19.k1]
  - topic: py06
    key: false
    weight: 0.33
    covers: [py06.k1]
sources:
