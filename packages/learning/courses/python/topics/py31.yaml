      - id: py31.k2.q3
        kind: [debug]
        uses: [py14.k3]
        data: [Wg]
        body: |
          要求是：“排成长表，每行一个测量，列为 sample_id、group、day、signal。”同事写了：

          ```python
          long = wide.melt(id_vars=["sample_id"], var_name="day", value_name="signal")
          ```
        slots:
          - id: got
            type: text
            format: integer
            prompt: 这段代码得到几行？
            key: 6
          - id: problem
            type: choice
            prompt: 问题出在哪里？
