                content: 行的顺序不对，应该按 sample_id 排
              - id: names
                content: var_name 和 value_name 写反了
            key: group
          - id: fix
            type: choice
            prompt: 哪一行代码符合要求？
            options:
              - id: both
                content: |
                  ```python
                  long = wide.melt(id_vars=["sample_id", "group"], var_name="day", value_name="signal")
                  ```
              - id: drop
                content: |
                  ```python
                  long = wide.melt(id_vars=["sample_id"], value_vars=["day1", "day2"], var_name="day", value_name="signal")
                  ```
              - id: group_only
                content: |
                  ```python
                  long = wide.melt(id_vars=["group"], var_name="day", value_name="signal")
                  ```
            key: both
        explanation: |
          得到 **6** 行而不是 4 行：**group 没放进 id_vars**，于是 day 列里多出了“group”，signal 列里混进了 control、drug 这样的文字。把 group 也放进 id_vars，`id_vars=["sample_id", "group"]`，就得到 4 行、四列。只写 value_vars 而不放 group，结果里就没有 group 列了；只放 group，sample_id 又被拆了进来。
        verify: |
          r = run()
          long = r["long"]
          days = [column for column in wide.columns if column not in ("sample_id", "group")]
          expected = [[sample, group, day, value]
                       for day in days
                       for sample, group, value in zip(wide["sample_id"], wide["group"], wide[day])]
          def fits(code):
              result = run(code)["long"]
              return list(result.columns) == ["sample_id", "group", "day", "signal"] and result.values.tolist() == expected
          ok = [option for option, code in OPTIONS["fix"].items() if fits(code)]
          answers = {"got": len(long), "problem": "group" if "group" in set(long["day"]) else "other", "fix": ok[0] if len(ok) == 1 else ok}
