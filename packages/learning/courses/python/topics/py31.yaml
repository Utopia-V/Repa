      - id: py31.k3.q2
        kind: [predict]
        uses: [py16.k2, py26.k2]
        data: [Ldup]
        body: |
          同一张长表，改用 pivot_table。

          ```python
          a = long.pivot_table(index="sample_id", columns="day", values="signal")
          b = long.pivot_table(index="sample_id", columns="day", values="signal", aggfunc="first")
          ```
        slots:
          - id: a
            type: text
            format: number
            prompt: "`a.loc[\"S_B\", \"day1\"]` 是多少？"
            key: 12
          - id: b
            type: text
            format: number
            prompt: "`b.loc[\"S_B\", \"day1\"]` 是多少？"
            key: 10
          - id: used
            type: text
            format: integer
            prompt: "`a` 里 S_B、day1 那一格是由几个测量算出来的？"
            key: 2
        explanation: |
          `a` 默认取平均：(10 + 14) / 2 = **12.0**；`b` 只留先出现的那一条，是 **10**。这一格由 **2** 个测量得来，而宽表上看不出这一点：12.0 看起来和别的格子一样，像是一次测到的值。
        verify: |
          r = run()
          values = [signal for sample, day, signal in zip(long["sample_id"], long["day"], long["signal"]) if (sample, day) == ("S_B", "day1")]
          assert r["a"].loc["S_B", "day1"] == sum(values) / len(values) and r["b"].loc["S_B", "day1"] == values[0]
          answers = {"a": r["a"].loc["S_B", "day1"], "b": r["b"].loc["S_B", "day1"], "used": len(values)}
      - id: py31.k3.q3
        kind: [specify]
        body: |
          同事说：“把长表转成宽表给我，每个样本一行、每天一列。”你检查后发现 S_B 第 1 天测了两次，一次 10、一次 14。

          请写一段可核对的要求或回复，说清：① 宽表的行、列和格子分别是什么；② 发现的重复是什么；③ 重复怎样处理由谁定、按什么规则。
