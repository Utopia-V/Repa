id: py31
title: 长表和宽表只是同一批观测的不同排法
status: complete
minutes: 20
summary: 认出标识列、变量列和值列；读懂 melt 把几列测量拆成多行，pivot 把长表变回宽表，并知道键组合重复时怎样处理是一项要写明的决定。
prerequisites:
  - topic: py25
    key: true
    weight: 0.50
    covers: [py25.k1, py25.k2]
  - topic: py27
    key: false
    weight: 1.00
    covers: [py27.k1]
sources:
  - source: pydata-book
    where: 第 8 章 §8.3（长宽格式的变形）
    url: https://wesmckinney.com/book/data-wrangling
    use: reference
  - source: pandas-docs
    where: 入门教程：长宽变形
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/07_reshape_table_layout.html
    use: reference
  - source: pandas-docs
    where: 用户指南：变形与透视表（melt、pivot、pivot_table）
    url: https://pandas.pydata.org/docs/user_guide/reshaping.html
    use: reference
notes: |
  范围：只有一个标识列（或一个标识列加一个随行带着的文字列）、一个变量、一个值列。melt 只用 id_vars、value_vars、var_name、value_name；pivot 只用 index、columns、values；pivot_table 只讲默认取平均和 aggfunc="first"，不讲多层列、fill_value、margins，也不讲 stack/unstack。行和列按标签排序、melt 后行标签从 0 重编，都在讲解里点明。组名、列名用字母或英文，避免中文排序干扰。
  k1 的“角色”判断容易全靠语义：例题和练习里允许 manual，复习和测验尽量用测量个数、键组合是否唯一、把长表填回宽表这类能由程序算出的问法。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
  模型核对：复习和测验里 py31.k1.x2 的 roles（给长表的三列认角色）和 py31.k3.x2 的 next（重复测量交人核对时下一步做什么）程序算不出，列进 manual；同题的其余作答位由 verify 核对。练习和例题里的 manual 不强制核对。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。每道题都从题面给出的表重新开始，前面题目里的变量都已清除。

  这一节常用两张表。表 W 是**宽表**：`sample_id` 是样本编号，`day1`、`day2` 分别是第 1 天、第 2 天测到的 signal（任意单位）。表 L 是**长表**：同样的测量，每行一个，`day` 写第几天，`signal` 是测到的值。左边的行标签是表的原行索引。
wrapup: |
  拿到一张表，先说出三种列：谁（标识列）、什么条件（变量列，可能藏在列名里）、测到的数（值列）。宽变长、长变宽前后，测量个数应当不变。

  向同事或 AI 提变形需求时，可以说：“把宽表排成长表，每行一个样本一天的测量，列依次为 sample_id、day、signal。转回宽表前，先按 sample_id 和 day 检查重复；同一样本同一天有两个不同的数时，列出来给我核对，不要默认取平均。”
