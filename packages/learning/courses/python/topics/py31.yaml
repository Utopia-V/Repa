  - id: py31.k3
    title: pivot 要求键组合唯一，聚合是另一项决定
    card:
      name: pivot 与聚合
      aliases: [长变宽, pivot_table]
      definition: pivot 把长表变回宽表：index 的值成为行，columns 的值成为列，values 填进格子；它要求每个（行, 列）组合只出现一次。
      conditions:
        - 组合重复时 pivot 报 ValueError；pivot_table 不报错，默认对重复的值取平均。
        - 重复了取平均、取第一条还是先查清，是统计上的决定，要在需求里写明。
      example:
        from: py31.k3.e0
        text: |
          ```python
          wide = long.pivot(index="sample_id", columns="day", values="signal")
          ```
          表 L 变回宽表：行是 S_A、S_B、S_C，列是 day1、day2，按标签排好序。
    lesson: |
      长表变宽表用 `pivot`：

      ```python
      wide = long.pivot(index="sample_id", columns="day", values="signal")
      ```

      `index` 那一列的值成为行标签，`columns` 那一列的值成为列名，`values` 那一列的数填进格子。行和列都**按标签排好序**，与长表里行的先后无关：表 L 里 S_C 先出现，结果里仍是 S_A、S_B、S_C。

      每一格只能放一个数，所以 pivot 要求每个（sample_id, day）组合只出现一次。同一样本同一天有两行时，pivot 报 **ValueError**（Index contains duplicate entries, cannot reshape）。这个报错是在提醒你：数据和“每个样本每天一个测量”的约定不符，先用 [duplicated](repa:concept/py25.k2) 找出是哪几行。

      `pivot_table` 写法相同，但遇到重复不报错，而是**默认取平均**；写 `aggfunc="first"` 则只留先出现的一条。取平均、取第一条，还是先交人核对，是对数据的一项决定，和[分组聚合](repa:concept/py27.k1)选 mean 还是 max 一样，要在需求里写明，不能让默认值替你决定。
