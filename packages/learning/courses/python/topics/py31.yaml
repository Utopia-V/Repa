kps:
  - id: py31.k1
    title: 辨认标识列、变量列和值列
    card:
      name: 长表与宽表
      aliases: [标识列, 变量列, 值列]
      definition: 一个测量值靠标识列（测的是谁）和变量列（在什么条件下测的）来定位；宽表把变量藏在列名里，长表把它单独放成一列，每行一个测量。
      conditions:
        - 两种排法的测量个数相同：宽表行数 × 测量列数 = 长表行数。
        - 长表里，标识列加变量列应当唯一，它们就是长表的业务键。
      example:
        from: py31.k1.e0
        text: |
          表 W（3 个样本 × day1、day2 两列）排成长表是 6 行：sample_id 是标识列，day 是变量列（原来藏在列名里），signal 是值列。
    lesson: |
      同一批测量可以有两种排法。表 W 是**宽表**，每个样本一行、每天一列：

      | sample_id | day1 | day2 |
      |---|---:|---:|
      | S_A | 8 | 9 |
      | S_B | 10 | 12 |
      | S_C | 13 | 11 |

      排成**长表**，每个测量一行：

      | sample_id | day | signal |
      |---|---|---:|
      | S_A | day1 | 8 |
      | S_B | day1 | 10 |
      | S_C | day1 | 13 |
      | S_A | day2 | 9 |
      | S_B | day2 | 12 |
      | S_C | day2 | 11 |

      两张表记的是同样的 6 个测量（3 个样本 × 2 天）。读任何一种排法，都先认出三种列：

      - **标识列**：测的是谁。这里是 sample_id。
      - **变量列**：这个数是在什么条件下测的，这里是“第几天”。宽表里它没有单独成列，而是藏在列名 day1、day2 里；长表里它是 day 这一列。
      - **值列**：测到的数。宽表里分散在 day1、day2 两列，长表里集中在 signal 一列。

      两条核对办法：测量个数不变，宽表行数 × 测量列数 = 长表行数，3 × 2 = 6；长表里标识列加变量列合起来应当唯一，它们就是长表的[业务键](repa:concept/py25.k1)。同一个样本同一天出现两行，说明有重复测量，要先弄清楚。

      哪种排法更好，看下一步做什么：宽表便于人眼对照同一样本的两天；长表便于[按组汇总](repa:concept/py27.k1)，例如 `long.groupby("day")["signal"].mean()` 一行算出每天的平均。
    example:
      id: py31.k1.e0
      kind: [explain, predict]
      uses: [py25.k1]
      data: [W]
      body: |
        表 W 是宽表。现在要把它排成长表：每行一个测量，列为 sample_id、day、signal。
      slots:
        - id: rows
          type: text
          format: integer
          prompt: 长表有几行？
          key: 6
        - id: where
          type: choice
          prompt: 在宽表里，“第几天”这个信息写在哪里？
          options:
            - { id: names, content: 写在列名 day1、day2 里 }
            - { id: sample, content: 写在 sample_id 列里 }
            - { id: index, content: 写在原行索引 31、7、22 里 }
          key: names
        - id: key
          type: choice
          multiple: true
          prompt: 长表里，哪几列合起来应当唯一（每种组合只出现一次）？
          options:
            - { id: sample_id, content: sample_id }
            - { id: day, content: day }
            - { id: signal, content: signal }
          key: [sample_id, day]
        - id: lookup
          type: text
          format: integer
          prompt: 长表里 sample_id 为 S_B、day 为 day2 的那一行，signal 是多少？
          key: 12
      explanation: |
        长表有 **6** 行：3 个样本 × 2 天，每个测量一行。“第几天”在宽表里**写在列名 day1、day2 里**，排成长表后成了 day 列的值。长表里 **sample_id 和 day** 合起来认出一个测量，应当唯一；signal 是测到的数，不同测量完全可能相同，不能拿来认记录。S_B 第 2 天的值在宽表 S_B 那一行的 day2 列，是 **12**。
      verify: |
        value_columns = [column for column in wide.columns if column != "sample_id"]
        records = [(sample, column, value) for sample, values in zip(wide["sample_id"], wide[value_columns].values.tolist())
                   for column, value in zip(value_columns, values)]
        lookup = [value for sample, column, value in records if (sample, column) == ("S_B", "day2")]
        answers = {"rows": len(records), "lookup": lookup[0] if len(lookup) == 1 else lookup}
      manual: [where, key]
    practice:
      - id: py31.k1.q1
        kind: [predict]
        uses: [py14.k2]
        data: [heights]
        body: |
          把表 heights 排成长表：每行一个采样点一年的株高，列为 site、year、height。
        slots:
          - id: measurements
            type: text
            format: integer
            prompt: 宽表里一共记了几个株高？
            key: 12
          - id: rows
            type: text
            format: integer
            prompt: 长表有几行？
            key: 12
          - id: columns
            type: text
            format: integer
            prompt: 长表有几列？
            key: 3
          - id: lookup
            type: text
            format: integer
            prompt: 长表里 site 为东坡、year 为 y2024 的那一行，height 是多少？
            key: 36
        explanation: |
          4 个采样点 × 3 年 = **12** 个株高，长表就有 **12** 行；列只有 site、year、height **3** 列，原来的 y2023、y2024、y2025 三个列名成了 year 列的值。东坡 y2024 那一格是 **36**。
        verify: |
          years = [column for column in heights.columns if column != "site"]
          records = [(site, year, value) for site, values in zip(heights["site"], heights[years].values.tolist())
                     for year, value in zip(years, values)]
          long = pd.DataFrame(records, columns=["site", "year", "height"])
          lookup = long.loc[(long["site"] == "东坡") & (long["year"] == "y2024"), "height"]
          answers = {"measurements": int(heights[years].size), "rows": long.shape[0], "columns": long.shape[1], "lookup": lookup.iloc[0]}
      - id: py31.k1.q2
        kind: [explain]
        data: [trees]
        body: |
          表 trees 是一张长表。给它的每一列认出角色，再想想排成宽表（每棵树一行）的样子。
        slots:
          - id: roles
            type: table
            columns:
              - { id: column, header: 列 }
              - id: role
                header: 角色
                input:
                  type: choice
                  options:
                    - { id: id, label: 标识列 }
                    - { id: variable, label: 变量列 }
                    - { id: value, label: 值列 }
            rows:
              - { id: tree_id, cells: { column: tree_id, role: id } }
              - { id: season, cells: { column: season, role: variable } }
              - { id: girth_cm, cells: { column: girth_cm, role: value } }
          - id: wide_rows
            type: text
            format: integer
            prompt: 排成宽表（每棵树一行、每个季节一列）后有几行？
            key: 2
          - id: wide_values
            type: text
            format: integer
            prompt: 宽表里有几列周长？
            key: 2
        explanation: |
          tree_id 说明测的是哪棵树，是**标识列**；season 说明在哪个季节测的，是**变量列**；girth_cm 是测到的周长，是**值列**。排成宽表时每棵树一行，T1、T2 共 **2** 行；每个季节一列，spring、autumn 共 **2** 列周长。
        verify: |
          answers = {"wide_rows": trees["tree_id"].nunique(), "wide_values": trees["season"].nunique()}
        manual: [roles]
      - id: py31.k1.q3
        kind: [debug]
        uses: [py25.k1, py25.k2]
        data: [Ldup]
        body: |
          约定每个样本每天只测一次。检查这张长表是否符合约定。
        slots:
          - id: ok
            type: choice
            prompt: 符合约定吗？
            options:
              - { id: "yes", content: 符合，每个样本每天只有一行 }
              - { id: "no", content: 不符合，有样本同一天出现了不止一行 }
            key: "no"
          - id: which
            type: choice
            prompt: 哪一个组合出现了不止一次？
            options:
              - { id: S_A-day1, content: S_A 的 day1 }
              - { id: S_B-day1, content: S_B 的 day1 }
              - { id: S_B-day2, content: S_B 的 day2 }
              - { id: S_C-day2, content: S_C 的 day2 }
            key: S_B-day1
          - id: marked
            type: text
            format: integer
            prompt: "`long.duplicated(subset=[\"sample_id\", \"day\"], keep=False)` 里有几个 True？"
            key: 2
        explanation: |
          **不符合**。**S_B 的 day1** 出现了两行，signal 一个是 10、一个是 14：同一样本同一天的两个不同的数，是冲突。按 sample_id 和 day 用 `keep=False` 标重复时，这两行都标 True，共 **2** 个。
        verify: |
          marked = long.duplicated(subset=["sample_id", "day"], keep=False)
          combos = sorted({f"{sample}-{day}" for sample, day, flag in zip(long["sample_id"], long["day"], marked) if flag})
          answers = {"ok": "no" if marked.any() else "yes", "which": combos[0] if len(combos) == 1 else combos, "marked": int(marked.sum())}
    review:
      - id: py31.k1.r1
        kind: [predict, explain]
        uses: [py25.k1]
        data: [soil]
        body: |
          把表 soil 排成长表：每行是一个采样点在一个季节的一次深度测量，列为 site、season、depth。
        slots:
          - id: rows
            type: text
            format: integer
            prompt: 长表有几行？
            key: 6
          - id: pair
            type: choice
            prompt: 按“一行是一个采样点在一个季节的一次测量”这个约定，长表的业务键是哪两列？
            options:
              - { id: site_depth, content: site 和 depth }
              - { id: site_season, content: site 和 season }
              - { id: season_depth, content: season 和 depth }
            key: site_season
        explanation: |
          3 个采样点 × 2 个季节，长表 **6** 行。

          业务键由“一行代表什么”决定，不看这一批数据里哪些列碰巧不重复。一行代表“一个采样点在一个季节的一次测量”，所以能认出这一行的是**测的是谁**（site）和**什么条件下测的**（season）；depth 是测到的值，是这一行的内容，不是用来认记录的。

          用值来认记录靠不住：不同采样点、不同季节完全可能测到同样的深度。这批数据里就有：东坡春、秋两季都是 30 厘米，site 和 depth 的组合“东坡、30”出现两次；春季北坡、东坡都是 30，season 和 depth 的组合“spring、30”也出现两次。换一批数据，这两个组合碰巧不重复也说明不了什么，业务键仍然是 site 和 season。
        verify: |
          seasons = [column for column in soil.columns if column != "site"]
          records = [(site, season, value) for site, values in zip(soil["site"], soil[seasons].values.tolist())
                     for season, value in zip(seasons, values)]
          long = pd.DataFrame(records, columns=["site", "season", "depth"])
          pairs = {"site_depth": ["site", "depth"], "site_season": ["site", "season"], "season_depth": ["season", "depth"]}
          # 业务键 = 标识列加变量列，也就是除了测到的值（depth）以外的两列；它们合起来也应当没有重复。
          keys = [pair for pair, columns in pairs.items() if "depth" not in columns and not long.duplicated(subset=columns).any()]
          answers = {"rows": len(long), "pair": keys[0] if len(keys) == 1 else keys}
      - id: py31.k1.r2
        kind: [explain]
        data: [survey]
        body: |
          把表 survey 排成长表：每行是一位受访者一轮的作答，列为 respondent、wave、score。判断每句话对不对。
        slots:
          - id: claims
            type: table
            columns:
              - { id: claim, header: 说法 }
              - { id: ok, header: 对吗, input: bool }
            rows:
              - { id: c1, cells: { claim: 长表有 8 行, ok: true } }
              - { id: c2, cells: { claim: 长表的行数和宽表一样多, ok: false } }
