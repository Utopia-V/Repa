  - id: py31.k2
    title: melt 从多列变多行
    card:
      name: melt
      aliases: [宽变长, 多列变多行]
      definition: melt 把几列测量拆成多行：id_vars 的列原样带着，value_vars 里每一列的每个值各成一行，原来的列名写进 var_name 那一列，值写进 value_name 那一列。
      conditions:
        - 行数 = 原行数 × value_vars 的列数；先排完第一个被拆的列，再排下一个。
        - 结果的行标签从 0 重新编号；不写 value_vars 时，id_vars 以外的列全部被拆。
      example:
        from: py31.k2.e0
        text: |
          ```python
          long = wide.melt(id_vars=["sample_id"], value_vars=["day1", "day2"], var_name="day", value_name="signal")
          ```
          表 W 的 3 行变成 6 行：先是 day1 的三行，再是 day2 的三行。
    lesson: |
      宽表变长表用 `melt`：

      ```python
      long = wide.melt(id_vars=["sample_id"], value_vars=["day1", "day2"], var_name="day", value_name="signal")
      ```

      | 参数 | 意思 | 这里 |
      |---|---|---|
      | `id_vars` | 原样带着、不拆的列（标识列） | sample_id |
      | `value_vars` | 要拆成多行的测量列 | day1、day2 |
      | `var_name` | 新的变量列叫什么，里面放原来的列名 | day |
      | `value_name` | 新的值列叫什么，里面放原来格子里的数 | signal |

      结果有 3 × 2 = 6 行。行的先后是：先把 day1 这一列从上到下拆完（S_A、S_B、S_C），再拆 day2。day 列里的值就是原来的列名文字 `"day1"`、`"day2"`。结果的行标签从 0 重新编号，原行索引 31、7、22 不保留。

      两个省略要留意：不写 `var_name`、`value_name` 时，新列叫 `variable` 和 `value`；不写 `value_vars` 时，id_vars 以外的列**全部**被拆。表里还有别的列（比如组别）却忘了放进 id_vars，它也会被当成一种“测量”拆进来。
    example:
      id: py31.k2.e0
      kind: [predict]
      uses: [py14.k1]
      data: [W]
      body: |
        阅读代码，说出 `long` 的样子。

        ```python
        long = wide.melt(id_vars=["sample_id"], value_vars=["day1", "day2"], var_name="day", value_name="signal")
        ```
      slots:
        - id: nrows
          type: text
          format: integer
          prompt: "`long` 有几行？"
          key: 6
        - id: columns
          type: order
          partial: true
          prompt: "`long` 有哪些列？按顺序排列，不属于它的不要放进来。"
          items:
            - { id: signal, content: "`signal`" }
            - { id: variable, content: "`variable`" }
            - { id: sample_id, content: "`sample_id`" }
            - { id: day, content: "`day`" }
            - { id: day1, content: "`day1`" }
          key: [sample_id, day, signal]
        - id: sample
          type: text
          prompt: 行标签为 3 的那一行，sample_id 是什么？
          key: S_A
        - id: day
          type: text
          prompt: 这一行的 day 是什么？
          key: day2
        - id: signal
          type: text
          format: integer
          prompt: 这一行的 signal 是多少？
          key: 9
      explanation: |
        | 行标签 | sample_id | day | signal |
        |---:|---|---|---:|
        | 0 | S_A | day1 | 8 |
        | 1 | S_B | day1 | 10 |
        | 2 | S_C | day1 | 13 |
        | 3 | S_A | day2 | 9 |
        | 4 | S_B | day2 | 12 |
        | 5 | S_C | day2 | 11 |

        共 **6** 行，列依次是 **sample_id、day、signal**。先拆完 day1 的三行（标签 0–2），再拆 day2，所以行标签 3 是 **S_A** 的 **day2**，signal 为 **9**。
      verify: |
        long = run()["long"]
        answers = {
            "nrows": len(long),
            "columns": list(long.columns),
            "sample": long.loc[3, "sample_id"],
            "day": long.loc[3, "day"],
            "signal": long.loc[3, "signal"],
        }
