        explanation: |
          一种回复：**“宽表按 sample_id 分行、按 day 分列，格子是 signal。转换前我发现 S_B 第 1 天有两条记录，signal 分别是 10 和 14。这两次哪个对，或者要不要取平均、平均时是否注明用了 2 次测量，请你定一下；确认之前我先不合并。”**

          关键是让“重复怎么处理”成为一项明确的决定，而不是被 pivot_table 的默认平均悄悄做掉。
