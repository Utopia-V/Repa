id: py23
title: 排序后，位置不再等于原来的标签
status: complete
minutes: 20
summary: 用 sort_values 按一列或多列排序，并列时写明次要排序键或稳定排序；排序后分清位置和标签，按需求决定 reset_index 还是保留原索引。
