      explanation: |
        - `a` 是 **S_C**：`iloc[0]` 按位置取排在最前的一行，signal 20。
        - `b` 是 **S_A**：`loc[0]` 按标签取原行索引为 0 的行，它的 signal 是 12，排在第三。
