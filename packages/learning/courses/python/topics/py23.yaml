kps:
  - id: py23.k1
    title: 按一列或多列排序及并列顺序
    card:
      name: 排序与并列
      aliases: [sort_values, 次要排序键, 稳定排序]
      definition: df.sort_values(列) 得到按这一列排好的新表，整行连同行索引一起移动；并列行的先后要由次要排序键或 kind="stable" 写明。
      conditions:
        - 默认排序不保证并列行谁先谁后，碰巧的顺序不能当成结果。
        - 多列排序写 sort_values(["signal", "sample_id"], ascending=[False, True])：先按第一列，相同再按第二列。
        - 业务要求“同值保持原来的先后”时，用单列的 kind="stable"。
      example:
        from: py23.k1.e0
        text: |
          ```python
          result = df.sort_values(["signal", "sample_id"], ascending=[False, True])
          ```
          表 T 排成 18、22、7、4、31：signal 同为 10 的 S_B、S_D 按 sample_id 排，S_B 在前。
    lesson: |
      `df.sort_values("signal")` 按 signal 从小到大排好，得到一张**新表**；df 本身不变，要用结果就存进一个名字。从大到小写 `ascending=False`。排序时整行一起移动，行索引跟着各自的行走：

      | 原行索引 | sample_id | signal |
      |---:|---|---:|
      | 31 | S_A | 8 |
      | 7 | S_B | 10 |
      | 4 | S_D | 10 |
      | 22 | S_C | 13 |
      | 18 | S_E | 15 |

      S_B 和 S_D 的 signal 都是 10，叫作**并列**。pandas 默认的排序**不保证**并列的行谁先谁后，这一次的顺序可能只是碰巧。结果要能复核，就要在需求和代码里写明并列时怎么办，有两种办法：

      1. **次要排序键**：`df.sort_values(["signal", "sample_id"])` 先按 signal 排，signal 相同再按 sample_id 排。两列方向不同时，给 `ascending` 一个同样长的列表：`ascending=[False, True]` 表示 signal 从大到小、sample_id 从小到大。
      2. **保持原来的先后**：如果业务上要求“同值按录入顺序”，用稳定排序 `df.sort_values("signal", kind="stable")`，它保证并列的行保持原表里的先后。

      所以一条排序需求要说全：按哪一列、什么方向；并列时按哪一列、什么方向，或者保持原来的先后。只说“按 signal 排一下”，并列的那几行就留给了运气。
    example:
      id: py23.k1.e0
      kind: [predict]
      data: [T]
      body: |
        需求是“按 signal 从高到低排；signal 相同的，按 sample_id 从小到大”。阅读代码，说出 `result` 的样子。

        ```python
        result = df.sort_values(["signal", "sample_id"], ascending=[False, True])
        ```
      slots:
        - id: rows
          type: order
          prompt: 按 `result` 里的先后顺序排出原行索引。
          items:
            - { id: "31", content: "31" }
            - { id: "7", content: "7" }
            - { id: "22", content: "22" }
            - { id: "4", content: "4" }
            - { id: "18", content: "18" }
          key: ["18", "22", "7", "4", "31"]
        - id: unchanged
          type: choice
          prompt: 运行后，df 本身的行顺序怎样了？
          options:
            - { id: sorted, content: 也排好了 }
            - { id: same, content: 没变，排好的是新表 result }
          key: same
      explanation: |
        顺序是 **18、22、7、4、31**。signal 从高到低是 15、13、10、10、8；并列的两个 10 再按 sample_id 从小到大，S_B（索引 7）在 S_D（索引 4）前面。行索引跟着各自的行走。

        df 本身**没变**：sort_values 得到的是新表，存进了 result。
      verify: |
        r = run()
        answers = {
            "rows": [str(label) for label in r["result"].index],
            "unchanged": "same" if r["df"].equals(df) else "sorted",
        }
    practice:
      - id: py23.k1.q1
        kind: [predict, explain]
        uses: [py12.k2]
        data: [T]
        body: |
          阅读代码。

          ```python
          result = df.sort_values("signal")
          ```
        slots:
          - id: first
            type: choice
            prompt: "`result` 最前面一行的原行索引是？"
            options:
              - { id: "31", content: "31" }
              - { id: "7", content: "7" }
              - { id: "18", content: "18" }
            key: "31"
          - id: last
            type: choice
            prompt: 最后一行的原行索引是？
            options:
              - { id: "31", content: "31" }
              - { id: "22", content: "22" }
              - { id: "18", content: "18" }
            key: "18"
          - id: tie
            type: choice
            prompt: 索引 7 和 4 谁排在前面？
            options:
              - { id: "7", content: 一定是 7，因为它在原表里更靠前 }
              - { id: "4", content: 一定是 4，因为 4 比 7 小 }
              - { id: unspecified, content: 不一定：它们的 signal 并列，默认排序不保证谁先谁后 }
            key: unspecified
        explanation: |
          最前面是 **31**（signal 8），最后是 **18**（signal 15）。

          索引 7 和 4 的 signal 都是 10，是并列；默认排序**不保证**它们谁先谁后。即使这一次 7 在前，也只是碰巧。要固定顺序，就加次要排序键，或者在需要保持原顺序时用 `kind="stable"`。
        verify: |
          result = run()["result"]
          ties = df.loc[[7, 4], "signal"]
          answers = {
              "first": str(result.index[0]),
              "last": str(result.index[-1]),
              # 两行的值相同，默认排序对它们的先后没有约定。
              "tie": "unspecified" if ties.iloc[0] == ties.iloc[1] else str(result.index[1]),
          }
      - id: py23.k1.q2
        kind: [debug]
        uses: [py12.k1]
        data: [T]
        body: |
          需求是“按 signal 从高到低排；signal 相同的，按 sample_id 从小到大（S_A 在前）”。同事写了下面这行。

          ```python
          result = df.sort_values(["signal", "sample_id"], ascending=False)
          ```
        slots:
          - id: rows
            type: order
            prompt: 这行代码得到的 `result`，原行索引依次是？
            items:
              - { id: "31", content: "31" }
              - { id: "7", content: "7" }
              - { id: "22", content: "22" }
              - { id: "4", content: "4" }
              - { id: "18", content: "18" }
            key: ["18", "22", "4", "7", "31"]
          - id: fix
            type: choice
            prompt: 应改成哪一行？
            options:
              - id: list
                content: |
                  ```python
                  result = df.sort_values(["signal", "sample_id"], ascending=[False, True])
                  ```
              - id: swap
                content: |
                  ```python
                  result = df.sort_values(["sample_id", "signal"], ascending=[True, False])
                  ```
                feedback: 列的先后决定先按谁排；这样会先按 sample_id 排，signal 几乎不起作用。
              - id: asc
                content: |
                  ```python
                  result = df.sort_values(["signal", "sample_id"])
                  ```
                feedback: 两列都成了从小到大，signal 的方向反了。
            key: list
        explanation: |
          这行得到 **18、22、4、7、31**：`ascending=False` 让两列都从大到小，并列的 S_D（索引 4）排到了 S_B（索引 7）前面。

          两列方向不同，要给 `ascending` 一个列表：**`ascending=[False, True]`**，与列名列表一一对应。
        verify: |
          result = run()["result"]
          # 按需求独立排一遍：signal 从高到低，相同时 sample_id 从小到大。
          wanted = [label for label, row in sorted(df.iterrows(), key=lambda item: (-item[1]["signal"], item[1]["sample_id"]))]
          fits = [option for option, line in OPTIONS["fix"].items() if list(run(line)["result"].index) == wanted]
          answers = {"rows": [str(label) for label in result.index], "fix": fits[0] if len(fits) == 1 else fits}
      - id: py23.k1.q3
        kind: [predict, explain]
        data: [T]
        body: |
          负责人要求：按 signal 从低到高排；signal 相同的，保持原表里的先后。阅读代码。

          ```python
          result = df.sort_values("signal", kind="stable")
          ```
        slots:
          - id: rows
            type: order
            prompt: 按 `result` 里的先后顺序排出原行索引。
            items:
              - { id: "31", content: "31" }
              - { id: "7", content: "7" }
              - { id: "22", content: "22" }
              - { id: "4", content: "4" }
              - { id: "18", content: "18" }
            key: ["31", "7", "4", "22", "18"]
          - id: why
            type: choice
            prompt: 索引 7 为什么排在索引 4 前面？
            options:
              - { id: label, content: 因为 7 这个标签比 4 小 }
              - { id: stable, content: 因为两行 signal 并列，稳定排序保持了原表里 7 在 4 前面的先后 }
              - { id: chance, content: 碰巧如此，下次运行可能不同 }
            key: stable
        explanation: |
          顺序是 **31、7、4、22、18**。并列的两个 10 里，原表中 S_B（索引 7）排在 S_D（索引 4）前面；`kind="stable"` 是**稳定排序**，保证并列的行保持原来的先后，所以 7 在 4 前面。这不是碰巧，也和标签的大小无关：标签 7 其实比 4 大。
        verify: |
          result = run()["result"]
          # Python 的 sorted 是稳定排序，用它独立排一遍对照。
          wanted = [label for label, value in sorted(df["signal"].items(), key=lambda item: item[1])]
          assert list(result.index) == wanted
          original = list(df.index)
          why = "stable" if original.index(7) < original.index(4) and df.loc[7, "signal"] == df.loc[4, "signal"] and 7 > 4 else "other"
          answers = {"rows": [str(label) for label in result.index], "why": why}
    review:
      - id: py23.k1.r1
        kind: [predict]
        data: [soil]
        body: |
          阅读代码，说出 `result` 的样子。

          ```python
          result = soil.sort_values(["depth", "plot"], ascending=[False, True])
          ```
        slots:
          - id: rows
            type: order
            prompt: 按 `result` 里的先后顺序排出原行索引。
            items:
              - { id: "5", content: "5" }
              - { id: "12", content: "12" }
              - { id: "3", content: "3" }
              - { id: "8", content: "8" }
              - { id: "20", content: "20" }
            key: ["20", "3", "5", "8", "12"]
          - id: third
            type: text
            prompt: 排在第 3 位的是哪个样地（plot）？
            key: P1
        explanation: |
          顺序是 **20、3、5、8、12**：深度 40、35、30、30、25。P1 和 P4 的深度都是 30，再按 plot 从小到大，P1 在前，所以第 3 位是 **P1**。
        verify: |
          result = run()["result"]
          answers = {"rows": [str(label) for label in result.index], "third": result.iloc[2]["plot"]}
      - id: py23.k1.r2
        kind: [specify]
        uses: [py12.k1]
        body: |
          负责人说：“把孔按细胞数从多到少排；细胞数一样的，按孔号（well）从小到大。”把这条要求填成下面四个字段。
        slots:
          - id: column
            type: choice
            prompt: 先按哪一列排
            options:
              - { id: well, content: well }
              - { id: count, content: count }
            key: count
          - id: direction
            type: choice
            prompt: 这一列的方向
            options:
              - { id: asc, content: 从小到大 }
              - { id: desc, content: 从大到小 }
            key: desc
          - id: tie
            type: choice
            prompt: 并列时按哪一列排
            options:
              - { id: well, content: well }
              - { id: count, content: count }
              - { id: none, content: 不用管 }
            key: well
          - id: tie_direction
            type: choice
            prompt: 并列时那一列的方向
            options:
              - { id: asc, content: 从小到大 }
              - { id: desc, content: 从大到小 }
            key: asc
        explanation: |
          先按 **count**、**从大到小**；并列时按 **well**、**从小到大**。对应的代码是 `wells.sort_values(["count", "well"], ascending=[False, True])`。“不用管”会把并列的先后留给运气。
        manual: [column, direction, tie, tie_direction]
    quiz:
      - id: py23.k1.x1
        kind: [debug, specify]
        uses: [py12.k1]
        data: [wells]
        body: |
          需求是“按细胞数从多到少排；细胞数一样的，按孔号 well 从小到大”。
        slots:
          - id: line
            type: choice
            prompt: 哪一行符合需求？
            options:
              - id: both_desc
                content: |
                  ```python
                  result = wells.sort_values(["count", "well"], ascending=False)
                  ```
              - id: right
                content: |
                  ```python
                  result = wells.sort_values(["count", "well"], ascending=[False, True])
                  ```
              - id: swapped
                content: |
                  ```python
                  result = wells.sort_values(["well", "count"], ascending=[True, False])
                  ```
              - id: both_asc
                content: |
                  ```python
                  result = wells.sort_values(["count", "well"])
                  ```
            key: right
          - id: second
            type: text
            prompt: 按需求排好以后，排第 2 的是哪个孔（well）？
            key: B1
        explanation: |
          **`ascending=[False, True]`** 那一行符合需求。A1 和 B1 的细胞数都是 120，并列时按 well 从小到大，A1 第一、**B1** 第二。

          两列都从大到小会把 B1 排到 A1 前面；把 well 写在前面会先按孔号排；都从小到大则细胞数的方向反了。
        verify: |
          wanted = [label for label, row in sorted(wells.iterrows(), key=lambda item: (-item[1]["count"], item[1]["well"]))]
          fits = [option for option, line in OPTIONS["line"].items() if list(run(line)["result"].index) == wanted]
          answers = {"line": fits[0] if len(fits) == 1 else fits, "second": wells.loc[wanted[1], "well"]}
      - id: py23.k1.x2
        kind: [specify]
        uses: [py12.k1, py12.k2]
        body: |
          同事说：“把样本按 signal 从高到低排一下发我。”你看了数据，有几个样本的 signal 一样。他没有说这些样本谁先谁后。下一步最合适的是哪一句？
        slots:
          - id: next
            type: choice
            options:
              - id: a
                content: “好的，直接用默认的排序发给你。”
              - id: b
                content: “signal 一样的样本，按什么排？比如按 sample_id，还是保持原表里的先后？”
              - id: c
                content: “我把 signal 一样的样本删掉了，免得顺序不确定。”
              - id: d
                content: “我按 signal 从低到高排好了。”
            key: b
        explanation: |
          应当先**追问并列时怎么排**：按哪一列，还是保持原来的先后。默认排序不保证并列的先后，直接发出去，下次再跑可能不同；删掉并列的样本改变了数据；从低到高与要求相反。
        manual: [next]

  - id: py23.k2
    title: reset_index 与保留原索引的取舍
    card:
      name: 排序后的位置与标签
      aliases: [reset_index, iloc, 原行索引]
      definition: 排序后行带着原标签换了位置；iloc 按位置取（排第几），loc 按标签取；reset_index(drop=True) 重新编号为 0、1、2……，reset_index() 把原标签存成一列。
      conditions:
        - 行索引从 0 开始的表，排序前位置和标签恰好相同，排序后不再相同。
        - 还要回原表追查某一行时保留原标签；交出排名表、不需要原行号时才 drop。
      example:
        from: py23.k2.e0
        text: |
          表 R 按 signal 从高到低排序后，`ranked.iloc[0]` 是 S_C（排第一），`ranked.loc[0]` 是 S_A（原行索引为 0，排第三）。
    lesson: |
      排序以后，行带着原来的标签换了位置：**位置**（排第几）和**标签**（原行索引）不再一致。刚从文件读进来的表，行索引通常是 0、1、2……，排序前位置和标签恰好相等，最容易混用。

      ```python
      ranked = df.sort_values("signal", ascending=False)
      ```

      | 位置 | 原行索引 | sample_id | signal |
      |---:|---:|---|---:|
      | 0 | 2 | S_C | 20 |
      | 1 | 4 | S_E | 16 |
      | 2 | 0 | S_A | 12 |
      | 3 | 3 | S_D | 9 |
      | 4 | 1 | S_B | 5 |

      [loc 和 iloc](repa:concept/py16.k2) 在这里分得很清楚：`ranked.iloc[0]` 按位置取，得到排第一的 S_C；`ranked.loc[0]` 按标签取，得到原行索引为 0 的 S_A，它排在第三。要“排名第一”，用 `iloc`。同样，`ranked.head(3)` 取的是排在最前的 3 行。

      想让标签重新和位置一致，用 `reset_index`：

      - `ranked.reset_index(drop=True)`：重新编号为 0、1、2……，原来的行索引**丢掉**；
      - `ranked.reset_index()`：同样重新编号，但把原来的行索引**存成一列**，列名是 `index`。

      该选哪一种？原行索引是回到原始表找到这一行的线索。之后还要和原表对照、追查某个样本，就保留它：不重新编号，或者用 `reset_index()` 存成一列。要交出一张从 0 开始编号的排名表、不再需要原行号，才用 `reset_index(drop=True)`。需求里要写明是哪一种。
