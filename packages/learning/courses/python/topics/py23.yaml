notes: |
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）。
  先要求写出明确的次要排序键；业务需要同值保持原顺序时，再用单列稳定排序讲解，不让默认排序的偶然结果进入标准答案。
  落实：凡是问完整顺序的题，要么没有并列，要么写了能分开并列的次要排序键，要么用 kind="stable"。课程运行时里默认排序在这些小表上恰好与稳定排序结果相同，所以“默认排序保证不了并列顺序”这一点不能靠运行核对：练习里的那一问由 verify 检查“确有并列”推出，测验里的追问题列进 manual。
  范围：sort_values（单列、多列、ascending 列表、kind="stable"）、iloc 与 loc 在排序后的差别、reset_index 与 reset_index(drop=True)、head 与排序的先后。不讲 sort_index、rank、nlargest（nlargest 只出现在小改代码题的等价写法里）。py22 不是先修，只说“排序得到一张新表，df 不变”。
  k2 的表用 0 开始的默认行索引，模拟刚从 CSV 读进来的表：排序前位置和标签恰好一致，排序后不再一致。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、三道练习 5 分钟；k2 讲解与例题 4 分钟、三道练习 5 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  排序看起来最简单：从大到小排一下。但两个样本数值相同时谁在前？排好以后说“第一行”，指的是排在最前面的那行，还是原来编号为 0 的那行？这一节把这两件事说清楚。

  宿主已经导入了 pandas（`pd`）并准备好数据表；每道题都从题面给出的表重新开始。
wrapup: |
  向同事或 AI 提排序需求时，说全四件事：按哪一列、什么方向；并列时按哪一列、什么方向，或者保持原来的先后；结果要不要重新编号。例如：“按 signal 从高到低，signal 相同的按 sample_id 从小到大；输出时重新编号为 0、1、2……，不保留原行号。”

  读排序后的代码，看到 `.loc[0]` 要停一下：它取的是标签为 0 的那一行，不一定排在最前面。
