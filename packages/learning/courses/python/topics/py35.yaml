      - id: py35.k2.q2
        kind: [debug]
        body: |
          下面的程序想在处理完全部样本之后，**只显示一次**最后处理的样本编号。它却显示了三行。

          ```python startLine=1
          labels = ["S_A", "S_B", "S_C"]
          for label in labels:
              last = label
              print(last)
          ```
        slots:
          - id: fix
            type: choice
            prompt: 怎样改才符合要求？
            options:
              - id: drop3
                content: 删掉第 3 行
                feedback: 删掉以后 last 从来没有被赋值，第 4 行用它会报错。
              - id: dedent3
                content: 第 3 行去掉缩进，和 for 对齐
                feedback: 这样 for 下面第一行就没有缩进，循环体断开了，程序会报错。
              - id: dedent4
                content: 第 4 行去掉缩进，和 for 对齐
