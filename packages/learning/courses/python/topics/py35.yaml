            - { id: l1, cells: { line: 第 1 行, value: 4 } }
            - { id: l2, cells: { line: 第 2 行, value: 6 } }
            - { id: l3, cells: { line: 第 3 行, value: 3 } }
      explanation: |
        循环体执行 **3** 遍，依次显示 **4、6、3**。

        | 第几轮 | n | 显示 |
        |---|---:|---:|
        | 1 | 3 | 4 |
        | 2 | 5 | 6 |
        | 3 | 2 | 3 |

        `n` 按列表顺序依次指向 3、5、2，每指向一个就执行一遍 `print(n + 1)`。输出的顺序跟着列表走，所以最后一行是 3，不会自动从小到大排好。
      verify: |
        lines = run().lines()
        answers = {"times": len(lines), "lines": {f"l{i}": {"value": int(line)} for i, line in enumerate(lines, 1)}}
