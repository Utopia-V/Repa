        body: |
          AI 写了一段程序，说是算出三个读数的总和。

          ```python
          signals = [9, 12, 10]
          total = signals[0]
          for v in signals:
              total = total + v
          print(total)
          ```
        slots:
          - id: output
            type: text
            format: integer
            prompt: 程序显示什么？
            key: 40
            feedback:
              - when: 31
                message: 31 是三个读数的和；再看 total 的起点是多少，循环又从哪个元素开始加。
          - id: why
            type: choice
            prompt: 结果和三个读数的和差在哪里？
            options:
              - id: right
                content: 没有差别，结果就是总和
              - id: missing
                content: 少加了最后一个读数
              - id: double
                content: 第一个读数被算了两次
            key: double
        explanation: |
          显示 **40**，比真正的总和 31 多出 9。起点已经是第一个读数 9，循环又从第一个元素开始，把 9 再加了一次，所以第一个读数被算了两次。起点写成 0 就对了。
        verify: |
          r = run()
          shown = int(r.out)
          expected = sum(r["signals"])
          extra = shown - expected
          why = "right" if extra == 0 else "double" if extra == r["signals"][0] else "missing" if extra == -r["signals"][-1] else "other"
          answers = {"output": shown, "why": why}
