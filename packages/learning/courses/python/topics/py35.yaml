          列表是 `[3, 4, 5]`、`print(v * 3)` 缩进在循环里的那一段：三轮分别显示 9、12、15。列表倒过来写的那段先显示 15；`print` 没有缩进的那段，for 下面缺了循环体，会报错；列表本身写成 9、12、15 的那段又乘了一次 3。
        verify: |
          fits = []
          for option, code in OPTIONS["program"].items():
              r = run(code)
              if r.error is None and r.lines() == ["9", "12", "15"]:
