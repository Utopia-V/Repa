kps:
  - id: py35.k1
    keyPrerequisites: [py06]
    title: for 逐个取得列表元素
    card:
      name: for 循环
      aliases: [循环, 循环体, 循环变量]
      definition: "`for v in values:` 按列表顺序让 v 依次指向每个元素；每指向一个，就把下面缩进的循环体从上到下执行一遍。"
      conditions:
        - 列表有几个元素，循环体就执行几遍，顺序就是列表里的顺序；空列表一遍也不执行。
        - 循环体是 for 那一行（末尾有冒号）下面缩进的几行；一轮把这几行全部执行完，才轮到下一个元素。
      example:
        from: py35.k1.e0
        text: |
          ```python
          counts = [3, 5, 2]
          for n in counts:
              print(n + 1)
          ```
          n 依次指向 3、5、2，循环体执行 3 遍，依次显示 4、6、3。
    lesson: |
      同一件事要对列表里的每个元素都做一遍，就写一个 `for` 循环：

      ```python
      signals = [8, 10, 13]
      for v in signals:
          print(v * 2)
      ```

      这样读：`for v in signals:` 先让名字 `v` 指向列表的第一个元素 8，执行一遍下面缩进的那一行；再让 `v` 指向 10，又执行一遍；最后指向 13，再执行一遍。列表里没有下一个元素了，循环结束，程序接着往下走。

      | 第几轮 | v | 显示 |
      |---|---:|---:|
      | 1 | 8 | 16 |
      | 2 | 10 | 20 |
      | 3 | 13 | 26 |

      读的时候看清三件事：

      - **哪几行在循环里。** `for` 那一行末尾有冒号，下面**缩进**（通常是 4 个空格）的几行叫循环体。每一轮把循环体从上到下全部执行完，才轮到下一个元素。没有缩进的行不属于循环。
      - **执行几遍、什么顺序。** 列表有几个元素，循环体就执行几遍；顺序就是列表里的顺序，不会自动排序。列表是空的，就一遍也不执行。
      - **`v` 只是一个名字。** 每一轮开始时，它被赋值为当前这个元素，就像写了一句 `v = 8`。写成 `x`、`s` 效果完全一样。
    example:
      id: py35.k1.e0
      kind: [predict]
      body: |
        `counts` 是三批样本各自的份数。阅读下面的程序。

        ```python
