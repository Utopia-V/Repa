  - id: py35.k2
    keyPrerequisites: [py01, py02]
    title: 循环内外的变量状态
    card:
      name: 循环后的名字
      aliases: [循环内外, 循环结束后]
      definition: 循环结束后，循环变量和循环体里赋值的名字都还在，指向最后一轮留下的值；缩进在循环体里的行每轮执行一次，退回到 for 那一层的行在循环结束后只执行一次。
      conditions:
        - 判断一行在不在循环里只看缩进：和循环体对齐的在循环里，和 for 对齐的在循环后。
        - 列表是空的时，循环体里的赋值一次也没有发生，名字保持循环前的样子。
      example:
        from: py35.k2.e0
        text: |
          ```python
          counts = [3, 5, 2]
          for n in counts:
              scaled = n * 10
          print(scaled)
          ```
          print 没有缩进，循环结束后只执行一次，显示最后一轮的 20。
    lesson: |
      循环结束以后，循环里用过的名字并不会消失。

      ```python
      signals = [8, 10, 13]
      for v in signals:
          doubled = v * 2
      print(v)
      print(doubled)
      ```

      `for` 下面只有 `doubled = v * 2` 一行缩进，它是循环体，执行 3 遍；后面两行 `print` 没有缩进，在循环结束后各执行一次。那时 `v` 还指向最后一个元素 13，`doubled` 是最后一轮算出的 26，所以显示 13 和 26。前两轮的 16、20 被后来的赋值替换掉了，和[重新赋值](repa:concept/py01.k2)一样。

      同样一行 `print(doubled)`，缩进与否结果完全不同：

      | 写法 | 执行几次 | 显示 |
      |---|---|---|
      | 缩进在循环体里 | 每轮一次，共 3 次 | 16、20、26 |
      | 不缩进，写在循环后 | 循环结束后 1 次 | 26 |

      所以读循环时，先找出循环体到哪一行为止：缩进退回到和 `for` 对齐的第一行，就是循环之后的代码。
    example:
      id: py35.k2.e0
      kind: [predict]
      body: |
        两段程序只差最后一行的缩进。

        程序甲：

        ```python
        counts = [3, 5, 2]
        for n in counts:
            scaled = n * 10
            print(scaled)
        ```

        程序乙：

        ```python
        counts = [3, 5, 2]
        for n in counts:
            scaled = n * 10
        print(scaled)
        ```
      slots:
        - id: first
          type: text
          format: integer
          prompt: 程序甲显示几行？
          key: 3
        - id: second
          type: text
          format: integer
          prompt: 程序乙显示几行？
          key: 1
        - id: shown
          type: text
          format: integer
          prompt: 程序乙显示的那个数是多少？
          key: 20
      explanation: |
        程序甲的 `print` 缩进在循环体里，每轮显示一次，共 **3** 行：30、50、20。程序乙的 `print` 和 `for` 对齐，在循环结束后只执行 **1** 次；那时 `scaled` 是最后一轮算出的 **20**。
      verify: |
        first = run(BLOCKS[0]).lines()
        second = run(BLOCKS[1]).lines()
        answers = {"first": len(first), "second": len(second), "shown": int(second[0])}
