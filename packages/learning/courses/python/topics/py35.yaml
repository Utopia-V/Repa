  - id: py35.k3
    keyPrerequisites: [py01]
    title: 初始化与累计值的位置
    card:
      name: 累计值
      aliases: [累加, 计数, 初始化]
      definition: 在循环前给累计的名字一个起点（如 total = 0），循环体每轮用 total = total + v 把当前元素加进去；循环结束后，它才是全部元素的累计结果。
      conditions:
        - 起点写进循环体，每轮都会被设回起点，最后只剩最后一轮的值。
        - 加法从 0 起，乘法从 1 起；只要最终结果时，print 写在循环后。
      example:
        from: py35.k3.e0
        text: |
          ```python
          counts = [4, 6, 5]
          total = 0
          for c in counts:
              total = total + c
          print(total)
          ```
          total 依次是 0、4、10、15，循环后显示 15。
    lesson: |
      想把一个列表里的数加起来，常见的写法是：

      ```python
      signals = [8, 10, 13]
      total = 0
      for v in signals:
          total = total + v
      print(total)
      ```

      `total = 0` 在循环**前**执行一次，给累计一个起点；循环体每一轮用 `total` 现在的值加上当前的 `v`，再让 `total` 指向新结果；循环结束后 `print` 执行一次。按轮次记状态表：

      | 执行到 | v | total |
      |---|---:|---:|
      | 循环前 | 尚未定义 | 0 |
      | 第 1 轮后 | 8 | 8 |
      | 第 2 轮后 | 10 | 18 |
      | 第 3 轮后 | 13 | 31 |

      显示 31。每一轮的 `total + v` 用的都是上一轮留下的 `total`，这就是“累计”。数个数也是同一个写法：先 `count = 0`，每轮 `count = count + 1`。

      最常见的两处错位：

      - 把 `total = 0` 缩进到循环体里：每一轮先被设回 0，再加上当前的 `v`，最后只剩最后一个元素 13。
      - 把 `print(total)` 缩进到循环体里：每一轮都显示一次中间值 8、18、31，而不是只显示最终结果。

      起点也要想一想：加法从 0 开始；乘法从 1 开始，从 0 开始乘多少次都是 0。
    example:
      id: py35.k3.e0
      kind: [trace]
      body: |
        `counts` 是三批样本各自的份数，程序算出一共多少份。按执行顺序填写状态表，再写出显示的结果。

        ```python
        counts = [4, 6, 5]
        total = 0
        for c in counts:
            total = total + c
        print(total)
        ```
      slots:
        - id: trace
          type: table
          label: 状态表
          columns:
            - { id: step, header: 执行到 }
            - { id: c, header: c, input: integer }
            - { id: total, header: total, input: integer }
          rows:
            - { id: before, cells: { step: 循环前, c: { value: 尚未定义 }, total: 0 } }
            - { id: r1, cells: { step: 第 1 轮后, c: 4, total: 4 } }
            - { id: r2, cells: { step: 第 2 轮后, c: 6, total: 10 } }
            - { id: r3, cells: { step: 第 3 轮后, c: 5, total: 15 } }
        - id: output
          type: text
          format: integer
          prompt: 最后显示什么？
          key: 15
      explanation: |
        | 执行到 | c | total |
        |---|---:|---:|
        | 循环前 | 尚未定义 | 0 |
        | 第 1 轮后 | 4 | 4 |
        | 第 2 轮后 | 6 | 10 |
        | 第 3 轮后 | 5 | 15 |

        最后显示 **15**。`total = 0` 只在循环前执行一次；每一轮都用上一轮留下的 `total` 加上当前的 `c`。`print` 在循环后，只显示最终结果。
      verify: |
        import ast
        before = trace(names=["total"])[1]["total"]
        tree = ast.parse(CODE)
        loop = next(node for node in tree.body if isinstance(node, ast.For))
        loop.body.append(ast.parse("_log.append((c, total))").body[0])
        log = run(ast.unparse(tree), _log=[])["_log"]
        rows = {"before": {"total": before}}
        rows.update({f"r{i}": {"c": c, "total": total} for i, (c, total) in enumerate(log, 1)})
        answers = {"trace": rows, "output": int(run().out)}
