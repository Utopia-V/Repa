        ```
      slots:
        - id: times
          type: text
          format: integer
          prompt: 循环体 `print(n + 1)` 一共执行几遍？
          key: 3
        - id: lines
          type: table
          prompt: 按先后顺序写出显示的每一行。
          columns:
            - { id: line, header: 输出 }
