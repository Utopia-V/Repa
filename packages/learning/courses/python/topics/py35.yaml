id: py35
title: 循环：同一句指令轮流处理谁
status: complete
minutes: 20
summary: 读懂 for 循环：列表有几个元素，循环体就按顺序执行几遍；分清循环里和循环后的名字，读出累计的结果。
prerequisites: [py06, py01, py02]
encompassings:
  - {topic: py06, weight: 0.5}
  - {topic: py01, weight: 0.5}
  - {topic: py02, weight: 0.5}
sources:
  - source: think-python
    where: 第 7 章
    url: https://allendowney.github.io/ThinkPython/chap07.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.2–4.3
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
notes: |
  范围：只用列表、整数、文字、名字、加减乘和 print。不出现 if（py10 不是本节先修，按条件收集留给 py36），不用 range、enumerate、zip（py38）和推导式（py39）。for 那一行的冒号和缩进在 k1 里就地讲清，不以 py10 为前提。程序都当作从上往下运行的短脚本，用 print 看结果（py01 的约定）。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 2 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 4 分钟；收束 1 分钟。三个知识点都有练习，20 分钟偏紧，试做后可能把 k3 的 Parsons 挪进复习。
  题型：预测输出、追踪变量（按轮次的状态表）、找错，k3 各有一道 Parsons。逐轮的状态由 verify 在循环体末尾插入一行记录、实际运行算出；找错题的改法由 verify 把每种改法套到题面代码上运行，挑出结果符合要求的那一种。
  例题、练习的情境与数据为本课自拟。
intro: |
  前面读的代码，每一行只执行一次。这一节读 `for` 循环：几行代码对列表里的每个元素各执行一遍。

  程序仍当作一段从上往下运行的短脚本，`print` 显示那一刻的值。读循环时最有用的，还是前面用过的那张状态表，只是这次按“第几轮”来记。
wrapup: |
  读一个 for 循环，先回答三个问题：它轮流处理的是哪个列表；每一轮循环体做什么；哪些行缩进在循环里，哪些行在循环之后。

  看到累计的写法，再查两处：起点是不是写在循环前，结果是不是在循环后才显示。请 AI 写这类代码时，也可以直接这样说：“先把 total 设为 0，对列表里每个值加一次，循环结束后只显示一次总和。”
