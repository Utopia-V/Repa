            options:
              - { id: order, content: wrong 先 replace 时那一格还是两个空格，不等于 ""，没被换掉 }
              - { id: replace, content: replace 只能用在 strip 之后，否则不起作用 }
              - { id: random, content: 两次运行的结果本来就可能不同 }
            key: order
        explanation: |
          第一行 **1**，第二行 **2**。`wrong` 先 replace：那时索引 18 的格是两个空格，不等于 `""`，没被换掉；strip 之后它成了空串，仍不是缺失。`right` 先 strip，那一格先变成 `""`，再被换成 NaN。

          replace 本身在哪里都能用，只是它换的是“此刻整格等于空串”的格，所以要排在 strip 后面。
        verify: |
