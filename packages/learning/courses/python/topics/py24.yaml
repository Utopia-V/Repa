id: py24
title: 清理整列文字但保留编号含义
status: complete
minutes: 20
summary: 用 .str.strip()、.str.lower() 逐格清理一整列文字；清理后为空的格按需求处理成缺失；编号列只做约定好的清理，不转成数、不改大小写。
prerequisites:
  - topic: py05
    key: true
    weight: 0.67
    covers: [py05.k2, py05.k3]
  - topic: py19
    key: true
    weight: 0.67
    covers: [py19.k1, py19.k2, py19.k3]
  - topic: py15
    key: false
    weight: 0.33
    covers: [py15.k2]
sources:
  - source: pydata-book
    where: 第 7 章 §7.4
    url: https://wesmckinney.com/book/data-cleaning
    use: reference
  - source: pandas-docs
    where: 入门教程：文本列
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/10_text_data.html
    use: reference
notes: |
  建议题型与判分：预测输出（P）、小改代码（T）、写清需求（S/O）。
  范围：.str.strip、.str.lower 及其链式写法；清理后的空串用 列.replace("", np.nan) 换成缺失（整格替换，与 .str.replace 改一格里的部分文字区分）；编号列不转数、不改大小写，用 nunique 检查清理前后不同编号的个数。不讲 .str.replace 的正则、.str.contains、.str.split（py47）。
  py21、py22 不是先修：“赋回一列”（df["group"] = ...）在 k1 讲解里就地说明。
  空串和首尾空格在表格显示里看不出来，题面一律用 python 夹具自己画表，文字格加引号；作答时空串填 ""，缺失填 NaN，两者都给快捷按钮。
  k3.r2 用 python 夹具在沙箱的内存文件系统里写一个小 CSV，再用 read_csv 读，接上 py15 的 dtype={"sample_id": "str"}。
  “清理后为空算不算缺失”“编号能不能改大小写”属于业务规则，复习和测验各有题列进 manual，由 course:confirm 核对；其余由程序核对。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  手工录入的文字列常有多余的空格、大小写不统一的写法：" Low"、"HIGH "、"low" 其实是同两个组，比较和计数时却会被当成不同的组。这一节学怎样一次清理整列，同时不把空白和编号处理坏。

  宿主已经导入了 pandas（`pd`）和 NumPy（`np`），并准备好数据表；每道题都从题面给出的表重新开始。题面里的文字格都加了引号，好看清首尾的空格；`""` 是空串，`NaN` 是缺失。
wrapup: |
  向同事或 AI 提清理要求时，按列说清楚：哪些列去首尾空白、统一大小写；清理后为空的格算不算缺失、要不要报告个数；编号列只去首尾空白，不转成数、不改大小写。

  拿到代码后，看每一步有没有 `.str`、顺序是不是先 strip 再处理空串；对编号列，清理前后各数一次 `nunique()`，个数变了就要问为什么。
