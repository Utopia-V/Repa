kps:
  - id: py24.k1
    title: str.strip/str.lower 的逐元素作用
    card:
      name: .str 逐格清理
      aliases: [str.strip, str.lower, 清理文字列]
      definition: 列.str.strip()、列.str.lower() 把字符串方法逐格用到一整列上，得到一列新的结果；缺失的格仍是缺失。
      conditions:
        - 少了 .str 会报 AttributeError；链式写法的每一步都要带 .str。
        - strip 只去掉首尾的空白，中间的空格不动。
        - 结果是新的一列，要保留就赋回：df["group"] = df["group"].str.strip()。
      example:
        from: py24.k1.e0
        text: |
          ```python
          clean = df["group"].str.strip().str.lower()
          ```
          表 G 的 " Low"、"HIGH " 变成 "low"、"high"；两个空格的格变成空串 ""，缺失的格仍是 NaN。
    lesson: |
      学过对一段文字用 [strip、lower](repa:concept/py05.k2)：`" Low".strip()` 得到 `"Low"`。表里的一列有很多格，要逐格做同样的事，就在列后面加 `.str`：

      ```python
      clean = df["group"].str.strip().str.lower()
      ```

      [调用链从左往右](repa:concept/py05.k3)：先 `.str.strip()` 去掉每格首尾的空白，再 `.str.lower()` 变成小写。每一步都要带 `.str`。

      | 原行索引 | group | `.str.strip()` | 再 `.str.lower()` |
      |---:|---|---|---|
      | 31 | `" Low"` | `"Low"` | `"low"` |
      | 7 | `"HIGH "` | `"HIGH"` | `"high"` |
      | 22 | `"control"` | `"control"` | `"control"` |
      | 4 | `"low"` | `"low"` | `"low"` |
      | 18 | `"  "` | `""` | `""` |
      | 9 | NaN | NaN | NaN |

      缺失的格不会报错，仍是 NaN。只有两个空格的那一格成了空串 `""`，下一个知识点专门讲它。

      为什么要清理？`df["group"] == "low"` 只找到索引 4 一行：`" Low"` 多了一个空格、大小写也不同，在比较、计数、分组时都会被当成另一个组。清理以后，低剂量组有两行。

      常见的错误：

      - 少了 `.str`：`df["group"].strip()` 报 `AttributeError`，因为一整列本身没有 strip，要经过 `.str` 才能逐格用字符串方法。`df["group"].str.strip().lower()` 第二步少了 `.str`，也一样报错。
      - 用 `.str.replace(" ", "")` 去空格：它会把中间的空格也删掉，`"high dose "` 变成 `"highdose"`。strip 只去首尾。

      `clean` 是一列新的值，df 没有变。要换掉原来的列，就把结果赋回去：

      ```python
      df["group"] = df["group"].str.strip().str.lower()
      ```

      等号左边写列名，意思是把这一列换成右边算出的新列。
    example:
      id: py24.k1.e0
      kind: [predict]
      data: [G]
      body: |
        阅读代码，按原行索引填写 `clean` 的值。空串填 `""`，缺失填 `NaN`。

        ```python
        clean = df["group"].str.strip().str.lower()
        ```
      slots:
        - id: clean
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: raw, header: group }
            - { id: clean, header: clean, input: { type: text, quick: [NaN, '""'] } }
          rows:
            - { id: r31, cells: { index: "31", raw: '" Low"', clean: low } }
            - { id: r7, cells: { index: "7", raw: '"HIGH "', clean: high } }
            - { id: r22, cells: { index: "22", raw: '"control"', clean: control } }
            - { id: r4, cells: { index: "4", raw: '"low"', clean: low } }
            - { id: r18, cells: { index: "18", raw: '"  "', clean: '""' } }
            - { id: r9, cells: { index: "9", raw: NaN, clean: NaN } }
      explanation: |
        依次为 **low、high、control、low、""、NaN**。每一格先去首尾空白、再变小写。两个空格去掉以后什么也不剩，成了空串；缺失的格仍是缺失，不报错。
      verify: |
        def shown(value):
            return "NaN" if pd.isna(value) else ('""' if value == "" else value)
        clean = run()["clean"]
        answers = {"clean": {f"r{label}": {"clean": shown(value)} for label, value in clean.items()}}
    practice:
      - id: py24.k1.q1
        kind: [debug]
        uses: [py05.k3]
        data: [G]
        body: |
          需求是把 group 去掉首尾空白并统一成小写。同事写了下面这行。

          ```python
          clean = df["group"].strip().lower()
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行这一行会怎样？
            options:
              - { id: ok, content: 得到清理好的一列 }
              - { id: attr, content: 报 AttributeError：一整列没有 strip 方法 }
              - { id: first, content: 只清理了第一格 }
            key: attr
          - id: fix
            type: choice
            prompt: 应改成哪一行？
            options:
              - id: right
                content: |
                  ```python
                  clean = df["group"].str.strip().str.lower()
                  ```
              - id: half
                content: |
                  ```python
                  clean = df["group"].str.strip().lower()
                  ```
                feedback: 第二步也要带 .str，否则同样报 AttributeError。
              - id: replace
                content: |
                  ```python
                  clean = df["group"].str.replace(" ", "").str.lower()
                  ```
                feedback: 这会把中间的空格也删掉，例如 "high dose" 变成 "highdose"。
            key: right
        explanation: |
          这一行报 **AttributeError**：`df["group"]` 是一整列，它本身没有 strip 方法。要逐格用字符串方法，每一步都写 `.str`：**`df["group"].str.strip().str.lower()`**。

          第二步漏了 `.str` 同样报错；用 `.str.replace(" ", "")` 会把中间的空格也删掉，不只是首尾。
        verify: |
          r = run()
          other = pd.DataFrame({"group": ["high dose ", " Control", None]})
          def wanted(table):
              return [value.strip().lower() if isinstance(value, str) else None for value in table["group"]]
          def same(result, table):
              return [None if pd.isna(value) else value for value in result] == wanted(table)
          fits = []
          for option, line in OPTIONS["fix"].items():
              # 在原表和一张有中间空格的表上，都要只去首尾空白并变小写。
              runs = [run(line, df=table) for table in (df, other)]
              if all(attempt.error is None and same(attempt["clean"], table) for attempt, table in zip(runs, (df, other))):
                  fits.append(option)
          answers = {"outcome": "attr" if r.error == "AttributeError" else "other", "fix": fits[0] if len(fits) == 1 else fits}
      - id: py24.k1.q2
        kind: [predict]
        uses: [py17.k1, py19.k1]
        data: [G]
        body: |
          阅读代码，写出两行输出。

          ```python
          print((df["group"] == "low").sum())
          clean = df["group"].str.strip().str.lower()
          print((clean == "low").sum())
          ```
        slots:
          - id: before
            type: text
            format: integer
            prompt: 第一行输出
            key: 1
          - id: after
            type: text
            format: integer
            prompt: 第二行输出
            key: 2
        explanation: |
          第一行 **1**：清理之前，只有索引 4 的格恰好是 "low"，" Low" 多了空格、首字母大写，不相等。第二行 **2**：清理之后，" Low" 也成了 "low"。

          不清理就去筛选或计数，同一个组会被拆成几份。
        verify: |
          lines = run().lines()
          answers = {"before": int(lines[0]), "after": int(lines[1])}
      - id: py24.k1.q3
        kind: [modify]
        uses: [py05.k2, py05.k3]
        data: [G]
        body: |
          需求是：

          > 直接把 df 的 group 列换成清理后的值：去掉每格首尾的空白，统一成小写。中间的空格保留，缺失的格保持缺失，其他列不变。

          同事写的代码在作答框里。请改动它并提交。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              df["group"] = df["group"].str.lower()
            solution: |
              df["group"] = df["group"].str.strip().str.lower()
            accepts:
              - df["group"] = df["group"].str.lower().str.strip()
            rejects:
              - code: df["group"] = df["group"].str.strip()
                why: 没有统一成小写
              - code: df["group"].str.strip().str.lower()
                why: 算出了结果却没有赋回，df 没变
              - code: df["group"] = df["group"].str.replace(" ", "").str.lower()
                why: 把中间的空格也删掉了
            tests:
              - name: 表 G
                expect:
