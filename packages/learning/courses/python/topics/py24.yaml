            key: keep
        explanation: |
          索引 0 成了 **7**，不同编号只剩 **3** 个：“007”和“7”并成了一个。

          编号应当**保持文字**，最多去掉首尾空白。改成浮点照样丢前导零；转成数再补成三位，会把本来是“7”的样本改成“007”，和真正的“007”撞在一起。
        verify: |
          after = run()["df"]["sample_id"]
          # 两种改写都在“007”和“7”这两个不同的编号上检查：只有保持文字能让它们仍然不同。
          pair = pd.Series(["007", "7"])
          float_same = pair.astype(float).nunique() == 1
          zfill_same = pd.to_numeric(pair).astype(str).str.zfill(3).nunique() == 1
          keep_same = pair.str.strip().nunique() == 1
          better = [name for name, merged in {"keep": keep_same, "float": float_same, "zfill": zfill_same}.items() if not merged]
          answers = {"first": int(after[0]), "count": int(after.nunique()), "better": better[0] if len(better) == 1 else better}
