  - id: py24.k3
    title: 编号列不要任意转数值或改写
    card:
      name: 编号保持原样
      aliases: [编号, sample_id, 前导零, nunique]
      definition: 编号是名字，不是数量；清理时只做需求约定的改动（通常只去首尾空白），不转成数、不改大小写、不补零也不去零。
      conditions:
        - 转成数会去掉前导零："007" 和 "7" 成了同一个 7，带字母的编号成了缺失或报错。
        - 改大小写可能把本来不同的编号并成一个；清理前后各数一次 nunique()。
        - '从文件读入时用 dtype={"sample_id": "str"}，编号就保持文字。'
      example:
        from: py24.k3.e0
        text: |
          表 ids 有 5 个不同的编号；`pd.to_numeric` 以后成了 7、12、70、7、NaN，只剩 3 个不同的值。
    lesson: |
      sample_id 这样的编号看起来像数，其实是**名字**：没有人拿它加减，“007”和“7”可能是两个不同的样本。清理文字列时，编号列要格外小心。

      ```python
      n = pd.to_numeric(ids["sample_id"], errors="coerce")
      ```

      | 原行索引 | sample_id | n |
      |---:|---|---:|
      | 0 | `"007"` | 7.0 |
      | 1 | `"012"` | 12.0 |
      | 2 | `"070"` | 70.0 |
      | 3 | `"7"` | 7.0 |
      | 4 | `"S-12"` | NaN |

      前导零没了，“007”和“7”成了同一个数，“S-12”成了缺失。`astype(int)` 遇到“S-12”会报错；编号全是数字时它不报错，但同样丢掉前导零。

      改大小写也会出事：`.str.lower()` 把“M-01”和“m-01”变成同一个编号。如果它们本来是两只不同的小鼠，就被悄悄并成了一只。

      检查的办法是清理前后各数一次**不同编号的个数**。`列.nunique()` 给出一列里有多少个不同的值（不算缺失）：表 ids 原来 5 个，转成数以后只剩 3 个，说明有编号被并掉或丢了。

      所以对编号列：

      - 只做需求约定的清理，通常是去掉首尾空白 `.str.strip()`；
      - 不转成数、不改大小写、不补零也不去零，除非需求方明确说可以，例如确认“p01 和 P01 是同一个样地”；
      - 从文件读入时，用 [dtype={"sample_id": "str"}](repa:concept/py15.k2) 让编号保持文字，前导零就不会丢。
    example:
      id: py24.k3.e0
      kind: [predict]
      data: [ids]
      body: |
        阅读代码，按原行索引填写 `n` 的值（缺失填 `NaN`），再写出两个 nunique 的结果。

        ```python
        n = pd.to_numeric(ids["sample_id"], errors="coerce")
        before = ids["sample_id"].nunique()
        after = n.nunique()
        ```
      slots:
        - id: n
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: raw, header: sample_id }
            - { id: n, header: n, input: { type: text, format: number, quick: [NaN] } }
          rows:
            - { id: r0, cells: { index: "0", raw: '"007"', n: 7 } }
            - { id: r1, cells: { index: "1", raw: '"012"', n: 12 } }
            - { id: r2, cells: { index: "2", raw: '"070"', n: 70 } }
            - { id: r3, cells: { index: "3", raw: '"7"', n: 7 } }
            - { id: r4, cells: { index: "4", raw: '"S-12"', n: NaN } }
        - id: before
          type: text
          format: integer
          prompt: "`before` 是多少？"
          key: 5
        - id: after
          type: text
          format: integer
          prompt: "`after` 是多少？"
          key: 3
      explanation: |
        `n` 依次为 **7.0、12.0、70.0、7.0、NaN**。`before` 是 **5**，`after` 是 **3**：“007”和“7”成了同一个 7，“S-12”成了缺失（nunique 不算缺失）。五个不同的样本，转成数以后只认得出三个。
      verify: |
        r = run()
        answers = {
            "n": {f"r{label}": {"n": "NaN" if pd.isna(value) else value} for label, value in r["n"].items()},
            "before": int(r["before"]),
            "after": int(r["after"]),
        }
