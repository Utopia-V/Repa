              "numeric": "t = pd.to_numeric(s)",
              "integer": "t = s.astype(int)",
              "lower": "t = s.str.lower()",
          }
          merged = []
          for option, code in codes.items():
              attempt = run('s = pd.Series(["007", "7"])\n' + code)
              if attempt.error is None and attempt["t"].iloc[0] == attempt["t"].iloc[1]:
