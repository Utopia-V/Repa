  - id: py24.k2
    title: 空串与缺失分别处理
    card:
      name: 空串转缺失
      aliases: [空串, 空白格, replace]
      definition: strip 以后只剩空白的格成了空串 ""，它不是缺失；需求把它当作缺失时，用 列.replace("", np.nan) 把整格等于空串的换成 NaN。
      conditions:
        - 先 strip 再 replace：只有空格的格要先变成 ""，才会被换掉。
        - 列.replace 换整格，.str.replace 改一格里的部分文字，两者不同。
        - 空白算不算缺失、“N/A”这类文字怎么办，按业务规则写进需求。
      example:
        from: py24.k2.e0
        text: |
          表 G 的 group strip 以后有 1 个缺失、1 个空串；`replace("", np.nan)` 以后缺失变成 2 个。
    lesson: |
      清理 group 以后，原来只有两个空格的那一格成了空串 `""`。[空串不是缺失](repa:concept/py19.k2)：`isna()` 判它为 False，要用 `(clean == "").sum()` 才数得到。

      这一格多半是录入时漏填了。按需求要把它当作缺失时，把整格等于空串的换成 NaN：

      ```python
      clean = df["group"].str.strip().str.lower()
      clean = clean.replace("", np.nan)
      ```

      `列.replace(旧值, 新值)` 换的是**整格**等于旧值的格；学过的 `.str.replace` 改的是一格里的**一部分**文字。这里要的是前一种。

      顺序要对：**先 strip，再 replace**。写反成 `df["group"].replace("", np.nan).str.strip()`，replace 的时候那一格还是两个空格，不等于 `""`，没有被换掉；strip 之后它又成了空串。

      换不换、换成什么，是[业务规则](repa:concept/py19.k3)：录入漏填的当作缺失；有的表里空白就表示“没有”，那就不该换。手打的“N/A”“无”是文字，replace("", ...) 不会动它们，要不要处理也得另行约定。写需求时说清：清理后为空的格怎样处理，要不要报告个数。
    example:
      id: py24.k2.e0
      kind: [trace]
      data: [G]
      body: |
        阅读代码，写出 a、b、c 的值。

        ```python startLine=1
        clean = df["group"].str.strip()
        a = clean.isna().sum()
        b = (clean == "").sum()
        clean = clean.replace("", np.nan)
        c = clean.isna().sum()
        ```
      slots:
        - id: a
          type: text
          format: integer
          prompt: "`a` 是多少？"
          key: 1
        - id: b
          type: text
          format: integer
          prompt: "`b` 是多少？"
          key: 1
        - id: c
          type: text
          format: integer
          prompt: "`c` 是多少？"
          key: 2
      explanation: |
        `a` 是 **1**：strip 以后只有索引 9 原本就缺失。`b` 是 **1**：索引 18 的两个空格成了空串，它不是缺失，`isna()` 不算它。`c` 是 **2**：第 4 行把整格等于空串的换成 NaN，缺失变成了 2 个。
      verify: |
        r = run()
        answers = {"a": int(r["a"]), "b": int(r["b"]), "c": int(r["c"])}
    practice:
      - id: py24.k2.q1
        kind: [predict, explain]
        uses: [py19.k1]
        data: [G]
        body: |
          阅读代码，写出两行输出。

          ```python
