      - id: py24.k2.r2
        kind: [specify]
        uses: [py19.k3, py12.k1]
        body: |
          负责人确认的规则是：“备注去掉首尾的空白；清理后为空的当作缺失；手写的‘无’保留原样。”下面哪一种做法与它完全一致？
