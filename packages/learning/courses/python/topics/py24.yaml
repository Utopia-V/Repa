              - { id: integer, content: "`t = s.astype(int)`" }
              - { id: lower, content: "`t = s.str.lower()`" }
            key: [numeric, integer]
        explanation: |
          **`pd.to_numeric`** 和 **`astype(int)`** 会让两个编号都成为 7，前导零丢了。strip 和 lower 对这两个编号不起作用，它们仍然不同。

          每个选项的勾选状态分别计分。
        verify: |
          codes = {
