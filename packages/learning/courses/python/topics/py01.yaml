id: py01
title: 给数据起名，再按顺序读
status: complete
minutes: 20
summary: 读懂赋值：先算右边再起名；逐行追踪名字的值，读出 print 显示什么。
prerequisites: []
sources:
  - source: think-python
    where: 第 2 章 §2.1–2.2、§2.5–2.6
    url: https://allendowney.github.io/ThinkPython/chap02.html
    use: reference
  - source: python-docs
    where: 教程第 3 章 §3.1.1
    url: https://docs.python.org/3.12/tutorial/introduction.html
    use: reference
notes: |
  范围：无 Python 先修，会日常整数加减即可。只使用整数、名字、=、加减和 print；print(x) 先理解为“显示 x 现在的值”，函数调用在 py04 展开。程序作为短脚本从上往下运行，不用 notebook 末行自动显示的规则。列表的共享与原位修改留到 py22、py36。
  节奏（待试做校准）：目标与 print 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 3 分钟、练习 6 分钟；收束 3 分钟。
  例题、练习的情境与数据为本课自拟。
intro: |
  这一节先练看懂几行代码，不要求你从空白写出来。

  下面的程序都当作一段短脚本，从第一行往下逐行运行。`print(x)` 暂时理解为“在屏幕上显示 x 现在的值”，它的完整含义在后面讲函数调用时再展开。
wrapup: |
  读到一行赋值，先算右边，再让左边的名字指向结果；读一段代码，就按运行顺序记下每个名字此刻的值。

  试着用这两步说出一段代码在做什么，再看看这一节的两张概念卡。
kps:
  - id: py01.k1
    keyPrerequisites: []
    title: 名字指向当前的值，赋值先算右边
    card:
      name: 赋值
      aliases: [变量, 名字]
      definition: "`=` 先算出右边的值，再让左边的名字指向这个值；赋值本身不在屏幕上显示任何东西。"
      conditions:
        - "`=` 是一个动作，不是在问两边是否相等。"
        - 名字要先赋值才能使用；想看它现在的值，用 print。
      example:
        from: py01.k1.e0
        text: |
          ```python
          samples = 6
          reserve = 2
          usable = samples - reserve
          print(usable)
          ```
          第三行先算 6 - 2 得到 4，再让 `usable` 指向 4；最后一行显示 4。
    lesson: |
      一段程序从第一行开始往下运行。像 `samples = 6` 这样的一行叫**赋值**：Python 先算出等号右边的值，再让左边的名字指向这个值。之后在别处写 `samples`，读到的就是它现在指向的值。

      赋值是一个动作，不是在问“两边是否相等”。读到 `usable = samples - reserve` 时，分两步读：

      1. 先算右边：取 `samples` 现在的值和 `reserve` 现在的值，相减。
      2. 再起名：让 `usable` 指向算出来的结果。

      赋值本身不会在屏幕上显示任何东西。想看某个名字现在的值，就用 `print(名字)`。
    example:
      id: py01.k1.e0
      kind: [predict, explain]
      body: |
        一次收到 6 份样本，其中预留 2 份。阅读下面的程序。

        ```python
        samples = 6
        reserve = 2
        usable = samples - reserve
        print(usable)
        ```
      slots:
        - id: output
          type: text
          format: integer
          prompt: 程序最后显示哪个整数？
          key: 4
        - id: source
          type: choice
          prompt: "`usable` 的值是怎样来的？"
          options:
            - id: computed
              content: "`samples` 减 `reserve` 算出的结果"
            - id: literal
              content: 程序里直接写下的数字 4
            - id: printed
              content: "`print` 算出来的"
          key: computed
      explanation: |
        答案是 **4**。第三行先取 `samples` 的 6 和 `reserve` 的 2，算出 4，再让名字 `usable` 指向 4。前两行只是赋值，没有显示任何数字；最后一行的 `print` 才把 `usable` 现在的值显示出来。
      verify: |
        r = run()
        answers = {"output": int(r.out)}
      manual: [source]
    practice:
      - id: py01.k1.q1
        kind: [predict]
        body: |
          ```python
          total = 9
          used = 4
          remaining = total - used
          print(remaining)
          ```
        slots:
          - id: output
            type: text
            format: integer
            prompt: 程序最后显示哪个整数？
            key: 5
            feedback:
              - when: 13
                message: 第三行是 `total - used`，用的是减号。
        explanation: |
          答案是 **5**。第三行先算 9 - 4 得到 5，再让 `remaining` 指向 5；`print` 显示的就是这个值。
        verify: |
          answers = {"output": int(run().out)}
      - id: py01.k1.q2
        kind: [trace]
        body: |
          ```python
          reading = 3
          doubled = reading + reading
          ```

          这两行里没有 `print`，屏幕上什么也不显示，但两个名字都已经有了值。
        slots:
          - id: reading
            type: text
            format: integer
            label: reading
            prompt: 执行完两行后，`reading` 是多少？
            key: 3
          - id: doubled
            type: text
            format: integer
            label: doubled
            prompt: 执行完两行后，`doubled` 是多少？
            key: 6
        explanation: |
          `reading` 是 **3**，`doubled` 是 **6**。第二行先取 `reading` 的值 3，算出 3 + 3 = 6，再让 `doubled` 指向 6；`reading` 自己没有改变。
        verify: |
          r = run()
          answers = {"reading": r["reading"], "doubled": r["doubled"]}
      - id: py01.k1.q3
        kind: [explain]
        body: |
          `raw` 表示一批样本的总数，每批都固定预留 2 份，`raw` 至少为 2。哪一行能写出“剩下多少份”？
        slots:
          - id: line
            type: choice
            options:
              - id: plus
                content: |
                  ```python
                  clean = raw + 2
                  ```
                feedback: 预留的 2 份要从总数里去掉，不是加上。
              - id: minus
                content: |
                  ```python
                  clean = raw - 2
                  ```
              - id: fixed
                content: |
                  ```python
                  clean = 6
                  ```
                feedback: 6 只碰巧适合 raw 为 8 的那一批；换一批样本就不对了。
            key: minus
        explanation: |
          `clean = raw - 2` 正确：raw 为 8 时得到 6，换成 raw 为 10 时得到 8。`raw + 2` 多加了预留的份数；`clean = 6` 只碰巧适合 raw 为 8 的那一批。
        verify: |
          # 每个选项分别用两批不同的 raw 运行，始终等于 raw - 2 的才符合要求；符合的必须恰好一行。
          fits = [option for option, code in OPTIONS["line"].items()
                  if all(run(code, raw=raw)["clean"] == raw - 2 for raw in (8, 10))]
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py01.k1.q4
        kind: [debug]
        body: |
          只读下面两行。这段程序能得到 available 的值吗？

          ```python
          available = incoming - held
          incoming = 8
          ```
        slots:
          - id: result
            type: choice
            options:
              - {id: later, content: 能，Python 会先到下面找 incoming 的值}
              - {id: missing, content: 不能，右边用到的名字还没有赋值}
              - {id: zero, content: 能，没有赋值的名字默认是 0}
            key: missing
        explanation: "读第一行时就要计算右边；incoming 和 held 都没有值，程序会在这里停止，不会先去执行第二行。名字不会自动获得 0。"
        verify: |
          answers = {"result": "missing" if run().error == "NameError" else "later"}
      - id: py01.k1.q5
        kind: [modify]
        body: |
          三张指令卡要组成一段显示可用座位数的程序。每张卡都用一次，先准备数据，再计算，最后显示。
        slots:
          - id: lines
            type: order
            items:
              - {id: show, code: print(free)}
              - {id: seats, code: seats = 12}
              - {id: free, code: free = seats - 3}
            key: [seats, free, show]
        explanation: "计算 free 前必须先给 seats 赋值；print 也只能放在 free 得到值之后。因此顺序是准备 12 个座位、扣除 3 个、显示 9。"
        verify: |
          import itertools
          blocks = {"show": "print(free)", "seats": "seats = 12", "free": "free = seats - 3"}
          fits = [list(order) for order in itertools.permutations(blocks)
                  if run("\n".join(blocks[key] for key in order)).out == "9\n"]
          assert len(fits) == 1
          answers = {"lines": fits[0]}
      - id: py01.k1.q6
        kind: [trace]
        body: |
          这段脚本完成后，填写两个名字的值和屏幕显示的行数。不要把赋值当成显示。

          ```python
          received = 11
          packed = received - 4
          ```
        slots:
          - {id: received, type: text, format: integer, prompt: received 的值, key: 11}
          - {id: packed, type: text, format: integer, prompt: packed 的值, key: 7}
          - {id: lines, type: text, format: integer, prompt: 屏幕显示几行？, key: 0}
        explanation: "received 得到 11，packed 得到 11 - 4 的结果 7。两行都是赋值，没有 print，所以显示 0 行。"
        verify: |
          r = run()
          answers = {"received": r["received"], "packed": r["packed"], "lines": len(r.lines())}
    review:
      - id: py01.k1.r1
        kind: [modify]
        body: |
          下面四行代码的顺序被打乱了。把它们排成一段能显示剩余份数的程序，每一行都要用上。
        slots:
          - id: lines
            type: order
            items:
              - { id: show, code: print(left) }
              - { id: left, code: left = total - used }
              - { id: total, code: total = 9 }
              - { id: used, code: used = 4 }
            key: [total, used, left, show]
            alternatives:
              - [used, total, left, show]
            tests:
              - name: 显示剩余份数
                stdout: "5"
                expect:
                  left: "5"
        explanation: |
          先给 `total` 和 `used` 赋值（这两行谁先都可以），再算 `left`，最后 `print`。如果把算 `left` 或 `print` 的那一行放在前面，用到的名字还没有值，程序会报错。
      - id: py01.k1.r2
        kind: [predict, explain]
        body: |
          有人说：“第 2 行 `y = x + 1` 把 `x` 改成了 4。”

          ```python startLine=1
          x = 3
          y = x + 1
          print(x)
          ```
        slots:
          - id: output
            type: text
            format: integer
            prompt: 程序显示什么？
            key: 3
          - id: claim
            type: choice
            prompt: 这个说法对吗？
            options:
              - id: unchanged
                content: 不对，第 2 行只给 `y` 赋值，`x` 还是 3
              - id: changed
                content: 对，第 2 行把 `x` 改成了 4
            key: unchanged
        explanation: |
          显示 **3**。第 2 行先用 `x` 的值算出 4，再让 `y` 指向 4；等号左边是 `y`，`x` 没有被重新赋值。
        verify: |
          r = run()
          answers = {"output": int(r.out), "claim": "unchanged" if r["x"] == 3 else "changed"}
      - id: py01.k1.r3
        kind:
          - trace
        body: |
          会议室已到 7 人，又到 2 人；计算赋值后并不自动显示。分别读出两次 print。

          ```python
          arrived = 7
          late = 2
          total = arrived + late
          print(arrived)
          print(total)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '7'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '9'
        explanation: total 保存加法结果 9，原来的 arrived 仍是 7；只有两条 print 会显示内容。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py01.k1.r4
        kind:
          - trace
        body: |
          一批包裹要扣除破损件。按依赖顺序阅读，填写扣除量与可用量。

          ```python
          all_items = 15
          broken = 3
          usable = all_items - broken
          print(broken)
          print(usable)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '3'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '12'
        explanation: 先准备总量与破损量，再计算 15 - 3；计算结果交给 usable，不会反过来改变 broken。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py01.k1.r5
        kind:
          - trace
        body: |
          最后一行试图读取另一个名字。填写停止前显示的行数。

          ```python
          first = 4
          second = first + 1
          print(unassigned)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '0'
        explanation: 名字 unassigned 没有赋值，程序会在 print 求值时停止，之前两次赋值也没有显示。
        verify: |
          r = run()
          values = [as_shown(str(len(r.lines())))]
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py01.k1.r6
        kind:
          - trace
        body: |
          右边必须先求值。第一条 print 位于成功赋值之后，第二条位于失败赋值之后；实际显示哪些内容？只填写已经显示的一行。

          ```python
          total = 12
          ready = total - 4
          print(ready)
          unknown = missing + 1
          print(unknown)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '8'
        explanation: ready 成功得到 8 并显示；下一次赋值要先读 missing，却找不到这个名字，因此不会再显示 unknown。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py01.k1.r7
        kind: [modify]
        body: |
          这段程序显示剩余份数。现在把名字 incoming 改成 received，其他含义保持不变。哪一段改名后的代码仍能正常显示相同的结果？

          ```python
          incoming = 9
          spare = incoming - 4
          print(spare)
          ```
        slots:
          - id: program
            type: choice
            options:
              - id: all
                content: |
                  ```python
                  received = 9
                  spare = received - 4
                  print(spare)
                  ```
              - id: left_only
                content: |
                  ```python
                  received = 9
                  spare = incoming - 4
                  print(spare)
                  ```
              - id: too_late
                content: |
                  ```python
                  spare = received - 4
                  received = 9
                  print(spare)
                  ```
            key: all
        explanation: |
          赋值左边改成 received 后，后面读取同一个数的地方也要使用 received。只改第一行会留下未赋值的 incoming；先算 spare 再赋 received，则读取 received 时还没有值。完整改名的那一段仍显示 5。
        verify: |
          expected = run().out
          fits = []
          for option, code in OPTIONS["program"].items():
              result = run(code)
              if result.error is None and result.out == expected:
                  fits.append(option)
          answers = {"program": fits[0] if len(fits) == 1 else fits}
    quiz:
      - id: py01.k1.x1
        kind: [predict]
        body: |
          哪一段程序会显示 10？
        slots:
          - id: program
            type: choice
            options:
              - id: early
                content: |
                  ```python
                  b = 6
                  print(a + b)
                  a = 4
                  ```
              - id: backwards
                content: |
                  ```python
                  a + b = 10
                  print(a)
                  ```
              - id: assigned
                content: |
                  ```python
                  a = 4
                  b = 6
                  print(a + b)
                  ```
            key: assigned
        explanation: |
          先给 `a`、`b` 赋值、再把它们相加的那一段会显示 10。在 `a` 还没有值时就用它的那一段会报错；把算式 `a + b` 写在等号左边的那一段不是合法的赋值，等号左边要写名字。
        verify: |
          shows_ten = [option for option, code in OPTIONS["program"].items()
                       if run(code).error is None and run(code).out.strip() == "10"]
          answers = {"program": shows_ten[0] if len(shows_ten) == 1 else shows_ten}
      - id: py01.k1.x2
        kind: [explain]
        body: |
          前两行是 `total = 10` 和 `used = 4`。要让 `left` 指向 6，第三行应写成哪一种？
        slots:
          - id: line
            type: choice
            options:
              - id: correct
                content: |
                  ```python
                  left = total - used
                  ```
              - id: swapped
                content: |
                  ```python
                  left = used - total
                  ```
              - id: backwards
                content: |
                  ```python
                  total - used = left
                  ```
            key: correct
        explanation: |
          `left = total - used`：先算右边的 10 - 4，再让 `left` 指向 6。`used - total` 得到 -6；把算式写在等号左边不是合法的赋值。
        verify: |
          prelude = "total = 10\nused = 4\n"
          fits = [option for option, line in OPTIONS["line"].items() if run(prelude + line).vars.get("left") == 6]
          answers = {"line": fits[0] if len(fits) == 1 else fits}

      - id: py01.k1.x3
        kind:
          - trace
        body: |
          一次交接只准备值但不显示它。填写屏幕显示的行数，不填写内存中的数值。

          ```python
          supplied = 8
          held = 1
          available = supplied - held
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '0'
        explanation: 三行都是赋值，没有 print，因此显示零行。名字已有值不等于屏幕上已有内容。
        verify: |
          r = run()
          values = [as_shown(str(len(r.lines())))]
          answers = {f"v{i}": value for i, value in enumerate(values)}
      - id: py01.k1.x4
        kind:
          - trace
        body: |
          右边引用的名字与接收结果的名字不是同一个动作。对照原份数与分配后的份数。

          ```python
          original = 14
          allocated = original - 6
          print(original)
          print(allocated)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '14'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '8'
        explanation: 赋值先计算 14 - 6，再把 8 交给 allocated；original 的值仍是 14。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
  - id: py01.k2
    keyPrerequisites: []
    title: 逐行追踪重新赋值，读出 print 的结果
    card:
      name: 重新赋值
      aliases: [追踪, 状态表]
      definition: 同一个名字可以再次赋值，之后读到的是新值；先前用它算出并存进别的名字的值不会跟着重算。
      conditions:
        - 每一行读到的是那一刻的值；按运行顺序记下各个名字的值，比凭印象可靠。
        - 这里说的是整数这类值；列表等可以原地修改的对象另有情况，后面的课再讲。
      example:
        from: py01.k2.e0
        text: |
          ```python
          count = 4
          saved = count
          count = count + 1
          print(saved)
          print(count)
          ```
          第 3 行用旧的 count（4）算出 5，再让 count 指向 5；saved 仍是第 2 行存下的 4。输出依次为 4、5。
    lesson: |
      同一个名字可以被赋值不止一次。`n = n + 2` 这样的行，也照“先算右边，再起名”来读：先用 `n` 现在的值算出结果，再让 `n` 改为指向新结果。

      读一段代码时，可以边读边记一张小状态表：每执行一行，写下各个名字此刻的值。

      | 执行到 | n |
      |---|---:|
      | `n = 3` | 3 |
      | `n = n + 2` | 5 |

      有两处容易读错：

      - 一个名字改指向新的值以后，先前用它算出来、已经存进别的名字里的值，不会跟着重算。
      - `print` 写在哪一行，就显示那一刻的值；同一个名字在不同位置 `print`，可能显示不同的数。
    example:
      id: py01.k2.e0
      kind: [trace, predict]
      body: |
        按运行顺序填写每行执行后 `count` 与 `saved` 的值，再写出两行输出。还没有赋值的名字填“尚未定义”。

        ```python startLine=1
        count = 4
        saved = count
        count = count + 1
        print(saved)
        print(count)
        ```
      slots:
        - id: trace
          type: table
          label: 状态表
