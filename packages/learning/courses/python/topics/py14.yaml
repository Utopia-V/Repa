id: py14
title: 一张数据表里有什么
status: complete
minutes: 20
summary: 认出 DataFrame 的行、列、行索引和取出的一列 Series；用 shape 看大小、head 看样子；读出每列的类型，并说清一行代表什么。
prerequisites: [py06, py13, py03]
encompassings:
  - {topic: py06, weight: 0.5}
  - {topic: py13, weight: 0}
  - {topic: py03, weight: 0.5}
sources:
  - source: pydata-book
    where: 第 5 章 §5.1
    url: https://wesmckinney.com/book/pandas-basics
    use: reference
  - source: pandas-docs
    where: 入门教程：表格数据
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/01_table_oriented.html
    use: reference
notes: |
  建议题型与判分：预测输出（P）、解释代码（S/O）、写清需求（S/O）。
  范围：宿主已经运行 import pandas as pd 并准备好小表，不出现 pd.DataFrame({...}) 构造（避免提前用到字典）。只读表、取单列 df["列名"]、len、list(df.columns)、list(df.index)、shape、head、dtypes；df[["列"]]、loc、iloc 留给 py16。dtype 只讲 int64、float64、str、bool 四种，缺失值让列变成浮点留给 py19。
  pandas 3 的文字列 dtype 显示为 str；它的 repr 是 <StringDtype(...)>，不好读，所以题目问 df.dtypes 里显示的名字（str(dtype)），不让学生写 repr。
  表 T 与 py17 的表 T 相同（行索引 31、7、22、4 不按大小），让 py16、py17 接着用同一张表；本节把左边那列叫“行索引”。
  WWPD 题的 >>> 约定在 py13.k2 引入，但 py14 只以 py13.k1 为先修，所以 intro 里再说明一次。
  “一行代表什么”的题用“哪几列合起来能唯一确定一行”让程序核对（用 duplicated 检查），文字选项只是这个判断的说法。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 2 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 4 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  这一节开始读数据表。宿主已经运行了 `import pandas as pd`，并把题目用到的表准备好，题面最前面会显示这张表；你直接读表和代码，不需要写导入或构造数据的代码。每道题都从题面的表重新开始。

  有些题用交互窗口的形式：`>>>` 后面是输入的一行，你填写 Python 显示的内容。交互窗口会自动显示表达式的值；赋值什么也不显示，填 NOTHING；报错填 ERROR。
wrapup: |
  拿到一张表，先回答四个问题：有哪些列，列名怎样拼写；有多少行、多少列（shape）；前几行长什么样（head）；每列是什么类型，一行代表什么。

  这四件事说清了，再向同事或 AI 提要求，例如“表 visits 一行是一个样本某一天的一次称重，sample_id 是文字编号”，对方就不会把称重次数当成样本数。
