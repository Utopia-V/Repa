  - id: py14.k3
    keyPrerequisites: [py03]
    title: 每列 dtype 与样本单位
    card:
      name: dtype 与样本单位
      aliases: [dtype, 列类型, 样本单位, 一行代表什么]
      definition: 每列有一个类型（dtype），常见的是 int64 整数、float64 小数、str 文字、bool 真假；样本单位是一行代表的那个东西，例如一个样本，或者一个样本的一次测量。
      conditions:
        - 编号这类“像数的名字”应当是 str；而存成 str 的数字不能直接拿来算。
        - 同一个编号出现在好几行时，一行是一次测量而不是一个样本；数样本要数不同的编号，不是数行。
      example:
        from: py14.k3.e0
        text: |
          表 visits 的 sample_id 是 str，day 是 int64，weight 是 float64，passed 是 bool。001 出现在两行，一行是“一个样本某一天的一次称重”：5 行，3 个样本。
    lesson: |
      一列里的值是同一种类型，pandas 把它叫做这一列的 **dtype**。`print(visits.dtypes)` 列出表 visits 每列的类型：

      ```text
      sample_id        str
      day            int64
      weight       float64
      passed          bool
      dtype: object
      ```

      最后一行 `dtype: object` 说的是这份清单本身，不用管。

      | dtype | 意思 | visits 里的例子 |
      |---|---|---|
      | int64 | 整数 | day：1、3 |
      | float64 | 小数 | weight：2.5、3.0 |
      | str | 文字 | sample_id："001" |
      | bool | True 或 False | passed |

      类型决定了这一列能怎样用。数值列可以加减、比较大小；文字列不行，[文字 "12" 和整数 12 是两回事](repa:concept/py03.k1)。所以要留意两种情况：

      - **编号**这类“看起来像数、其实是名字”的列应当是 str，否则 001 会变成 1，001 和 01 也分不开了。读入文件时怎样保住它，后面讲读 CSV 时再说。
      - **存成 str 的数字**，例如一列 "12"、"9"、"30"，看起来是数，却不能直接加减。

      另一件要先弄清的事是**样本单位**：一行代表什么？表 visits 里，001 出现了两行，day 不同。所以它的一行是“一个样本在某一天的一次称重”，不是一个样本：表有 5 行，样本只有 3 个。问“有几个样本”时数不同的编号；问“称了几次”时才数行。

      判断一行代表什么，可以看**哪几列合起来才能唯一确定一行**：visits 里单看 sample_id 有重复，sample_id 加上 day 就没有重复了，一行就是“某个样本、某一天”。这里是从这张表的数据看出来的；一行到底代表什么，最后要由数据是怎样记录的来定，后面讲去重时会再回到这一点。
    example:
      id: py14.k3.e0
      kind: [explain]
      data: [visits]
      body: |
        读题面最前面的表 visits，回答下面的问题。
      slots:
        - id: dtypes
          type: table
          prompt: "`visits.dtypes` 里，每列显示的类型是什么？"
          columns:
            - { id: column, header: 列 }
            - id: dtype
              header: dtype
              input:
                type: choice
                options:
                  - { id: int64, label: int64 }
                  - { id: float64, label: float64 }
                  - { id: str, label: str }
                  - { id: bool, label: bool }
          rows:
            - { id: sample_id, cells: { column: sample_id, dtype: str } }
            - { id: day, cells: { column: day, dtype: int64 } }
            - { id: weight, cells: { column: weight, dtype: float64 } }
            - { id: passed, cells: { column: passed, dtype: bool } }
        - id: unit
          type: choice
          prompt: 表 visits 的一行代表什么？
          options:
            - { id: sample, content: 一个样本 }
            - { id: weighing, content: 一个样本在某一天的一次称重 }
            - { id: day, content: 某一天的全部称重 }
          key: weighing
        - id: samples
          type: text
          format: integer
          prompt: 表里一共有几个不同的样本？
          key: 3
      explanation: |
        sample_id 是编号，存成文字 **str**（所以 001 前面的零还在）；day 是整数 **int64**；weight 有小数，是 **float64**；passed 只有 True 和 False，是 **bool**。

        001 和 002 各出现了两次，day 不同：sample_id 加上 day 才能确定一行，一行是**一个样本在某一天的一次称重**。表有 5 行，不同的样本只有 001、002、003 这 **3** 个。
      verify: |
        unique_by = lambda columns: not visits.duplicated(subset=columns).any()
        unit = "weighing" if not unique_by(["sample_id"]) and unique_by(["sample_id", "day"]) else "sample" if unique_by(["sample_id"]) else "day"
        answers = {
            "dtypes": {column: {"dtype": str(visits[column].dtype)} for column in visits.columns},
            "unit": unit,
            "samples": visits["sample_id"].nunique(),
        }
    practice:
      - id: py14.k3.q1
        kind: [predict]
        uses: [py03.k1]
        data: [lab]
        body: |
          表 lab 里，count 和 note 两列看起来一样。
        slots:
          - id: note_dtype
            type: choice
            prompt: "`lab.dtypes` 里，note 显示的类型是什么？"
            options:
              - { id: int64, content: int64 }
              - { id: str, content: str }
              - { id: float64, content: float64 }
            key: str
          - id: plus_count
            type: text
            format: integer
            prompt: "`lab[\"count\"] + 3` 得到的一列里，第一个值是多少？"
            key: 15
          - id: plus_note
            type: choice
            prompt: "`lab[\"note\"] + 3` 会怎样？"
            options:
              - { id: numbers, content: 得到 15、12、33 }
              - { id: error, content: 报错（TypeError），文字不能和整数相加 }
              - { id: text, content: 得到文字 "123"、"93"、"303" }
            key: error
        explanation: |
          表里显示的样子一样，类型却不同：count 是 int64，note 存的是文字，dtype 是 **str**。

          整列加 3 是逐个值做的：`lab["count"] + 3` 得到 15、12、33，第一个是 **15**。`lab["note"] + 3` 是文字加整数，**报 TypeError**。（如果写成 `+ "3"`，文字会被接起来，得到 "123" 这样的结果，也不是想要的数。）
        verify: |
          note = run('result = lab["note"] + 3')
          answers = {
              "note_dtype": str(lab["note"].dtype),
              "plus_count": (lab["count"] + 3).iloc[0],
              "plus_note": "error" if note.error == "TypeError" else "other",
          }
      - id: py14.k3.q2
        kind: [explain]
        data: [water]
        body: |
          读题面最前面的表 water，回答下面的问题。
        slots:
          - id: key
            type: choice
            prompt: 哪两列合起来能唯一确定一行？
            options:
              - { id: site_date, content: site 和 date }
              - { id: site_ph, content: site 和 ph }
              - { id: site_only, content: 只要 site 就够了 }
            key: site_date
          - id: unit
            type: choice
            prompt: 一行代表什么？
            options:
              - { id: site, content: 一个采样点 }
              - { id: visit, content: 一个采样点在某一天的一次测量 }
              - { id: date, content: 某一天的全部测量 }
            key: visit
          - id: sites
            type: text
            format: integer
            prompt: 一共有几个不同的采样点？
            key: 3
        explanation: |
          每个采样点出现两次，日期不同，所以只看 site 有重复；site 和 date 合起来，每行都不一样。一行是**一个采样点在某一天的一次测量**，表有 6 行，采样点只有 S1、S2、S3 这 **3** 个。

          site 和 ph 不行：S1 两次测得的都是 7.1。ph 是测出来的值，本来就可能相同，不能用来标识一行。
        verify: |
          unique_by = lambda columns: not water.duplicated(subset=columns).any()
          options = {"site_date": ["site", "date"], "site_ph": ["site", "ph"], "site_only": ["site"]}
          fits = [option for option, columns in options.items() if unique_by(columns)]
          key = fits[0] if len(fits) == 1 else fits
          answers = {
              "key": key,
              "unit": "visit" if key == "site_date" else "site",
              "sites": water["site"].nunique(),
          }
      - id: py14.k3.q3
        kind: [explain]
        data: [ids_a, ids_b]
        body: |
          原始记录里的编号是 001、002、010。两个人分别整理成了表 a 和表 b。
        slots:
          - id: keeps
            type: choice
            prompt: 哪张表保留了原来的编号？
            options:
              - { id: a, content: 表 a }
              - { id: b, content: 表 b }
            key: b
          - id: a_dtype
            type: choice
            prompt: 表 a 的 sample_id 是什么类型？
            options:
              - { id: int64, content: int64 }
              - { id: str, content: str }
            key: int64
        explanation: |
          **表 b** 的 sample_id 是文字（str），001、002、010 原样保留。表 a 把编号当成了整数（**int64**），前面的零没了，变成 1、2、10。编号是名字，不是拿来计算的数，应当存成文字；否则 001 和 01 这样的编号就分不开了。
        verify: |
          original = ["001", "002", "010"]
          keeps = [name for name, table in (("a", a), ("b", b)) if list(table["sample_id"]) == original]
          answers = {"keeps": keeps[0] if len(keeps) == 1 else keeps, "a_dtype": str(a["sample_id"].dtype)}
      - id: py14.k3.q4
        kind: [trace]
        body: |
          编号应保留前导零，数量用于计算。只根据这两个独立 Series 的实际 dtype，填写 dtype 的文字形式。

          ```python
          codes = pd.Series(["001", "002"])
          counts = pd.Series([1, 2])
          print(str(codes.dtype))
          print(str(counts.dtype))
          ```
        slots:
          - {id: codes, type: text, match: text, prompt: 编号列 dtype, key: str}
          - {id: counts, type: text, match: text, prompt: 数量列 dtype, key: int64}
        explanation: "锁定的 pandas 3 中，文字列默认 dtype 为 str；整数数量列是 int64。长得像数字的编号仍可保留为文字，避免丢失前导零。"
        verify: |
          lines = run().lines()
          answers = {"codes": str(lines[0]), "counts": str(lines[1])}
      - id: py14.k3.q5
        kind: [debug]
        body: |
          只看前两行，两列似乎都像整数。实际 dtype 是否也相同？填写显示结果。

          ```python
          whole = pd.Series([1, 2, 3])
          mixed = pd.Series([1, 2, 3.5])
          print(str(whole.dtype))
          print(str(mixed.dtype))
          ```
        slots:
          - {id: whole, type: text, match: text, prompt: 第一列 dtype, key: int64}
          - {id: mixed, type: text, match: text, prompt: 第二列 dtype, key: float64}
        explanation: "dtype 描述整列，不只描述预览的头两项。mixed 含有 3.5，因此整列使用 float64，不能凭前两项推断它是整数列。"
        verify: |
          lines = run().lines()
          answers = {"whole": str(lines[0]), "mixed": str(lines[1])}
