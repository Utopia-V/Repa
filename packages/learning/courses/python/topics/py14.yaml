  - id: py14.k2
    keyPrerequisites: [py04, py06]
    title: shape 与 head 分别告诉你什么
    card:
      name: shape 与 head
      aliases: [shape, head, 行数, 列数]
      definition: "`df.shape` 是（行数, 列数）两个数，告诉你表有多大；`df.head(n)` 取出前 n 行（省略 n 时是 5 行）看看样子，不会改变 df。"
      conditions:
        - shape 不把行索引算作一列，后面不加括号；head 按表里现在的先后取前几行，不是取行索引最小的几行。
        - 表不足 n 行时，head(n) 给出全部行，不会报错。
      example:
        from: py14.k2.e0
        text: |
          表 M 有 7 行 3 列，`df.shape` 是 (7, 3)。`df.head(3)` 取出行索引为 12、3、25 的前三行；之后 df 仍有 7 行。
    lesson: |
      拿到一张表，先问两件事：它有多大？长什么样？

      **`df.shape` 回答“有多大”**：两个数，（行数, 列数）。行索引不算一列。shape 是表自带的一项信息，后面**不加括号**，写成 `df.shape()` 会报错。`df.shape[0]` 是行数，`df.shape[1]` 是列数；`len(df)` 也是行数。

      **`df.head(n)` 回答“长什么样”**：取出表里**前 n 行**，组成一张小表；n 省略时是 5。真实的数据可能有几千行，先看前几行，就能确认列名和值的样子对不对。有三点要注意：

      - “前 n 行”按表里现在的先后，不是按行索引的大小。表 M 的行索引是 12、3、25、8……，`head(3)` 取的是 12、3、25 这三行，不是 3、5、8。
      - head 只是取出来看，**df 本身一行都没有少**。想留着这几行，要把结果赋给一个新名字，例如 `top = df.head(3)`。
      - 表不足 n 行时，给出全部的行，不会报错。
    example:
      id: py14.k2.e0
      kind: [predict]
      data: [M]
      body: |
        `df` 是表 M。阅读代码。

        ```python
        print(df.shape)
        top = df.head(3)
        print(top.shape)
        print(len(df))
        ```
      slots:
        - id: nrows
          type: text
          format: integer
          prompt: "`df.shape` 的第一个数（行数）"
          key: 7
        - id: ncols
          type: text
          format: integer
          prompt: "`df.shape` 的第二个数（列数）"
          key: 3
        - id: top
          type: order
          partial: true
          prompt: "`top` 里有哪几行？按先后排出它们的行索引，没有的不要放进来。"
          items:
            - { id: "12", content: "12" }
            - { id: "3", content: "3" }
            - { id: "25", content: "25" }
            - { id: "8", content: "8" }
            - { id: "40", content: "40" }
            - { id: "17", content: "17" }
            - { id: "5", content: "5" }
          key: ["12", "3", "25"]
        - id: after
          type: text
          format: integer
          prompt: 最后一行显示的 `len(df)` 是多少？
          key: 7
      explanation: |
        表 M 有 7 行、3 列（sample_id、signal、group），`df.shape` 是 **(7, 3)**，行索引不算一列。

        `df.head(3)` 按表里的先后取前三行：行索引 **12、3、25**，所以 `top.shape` 是 (3, 3)。它不是取行索引最小的 3、5、8。head 不改变 df，最后 `len(df)` 仍是 **7**。
      verify: |
        r = run()
        top = r["top"]
        answers = {
            "nrows": r["df"].shape[0],
            "ncols": r["df"].shape[1],
            "top": [str(label) for label in top.index],
            "after": int(r.lines()[-1]),
        }
