kps:
  - id: py14.k1
    keyPrerequisites: [py06]
    title: DataFrame、Series、行列和索引
    card:
      name: DataFrame
      aliases: [数据表, 表, Series, 行索引]
      definition: DataFrame 是一张有列名和行索引的表；用 `df["列名"]` 取出其中一列，得到 Series，它带着和原表相同的行索引。
      conditions:
        - 左边的行索引是每一行的标签，不是表里的一列，也不一定是 0、1、2……
        - 方括号里的列名要和表里的完全一样，大小写和空格都算。
      example:
        from: py14.k1.e0
        text: |
          表 T 有 sample_id、signal、group 三列，四行的行索引是 31、7、22、4。`df["group"]` 是一列四个值的 Series，行索引仍是 31、7、22、4。
    lesson: |
      pandas 用 **DataFrame** 表示一张表。后面的代码默认已经 `import pandas as pd`。下面是表 T，宿主把它放在名字 `df` 里：

      | 行索引 | sample_id | signal | group |
      |---:|---|---:|---|
      | 31 | S_A | 8 | control |
      | 7 | S_B | 10 | drug |
      | 22 | S_C | 13 | drug |
      | 4 | S_D | 10 | control |

      - **列**：每列有一个列名，例如 `signal`。同一列放同一种量。
      - **行**：每行是一条记录，这里是一个样本。
      - **行索引**：最左边的 31、7、22、4 是每一行的**标签**。它不是表里的一列，也不一定从 0 开始、按大小排；表经过筛选或排序以后，原来的标签会跟着行走。

      取出一列，在方括号里写列名：`df["signal"]`。列名要带引号，大小写要和表里一致，写成 `df["Signal"]` 会报错。取出来的是 **Series**：一列值，带着和原表相同的行索引。用 print 显示它是这样的：

      ```text
      31     8
      7     10
      22    13
      4     10
      Name: signal, dtype: int64
      ```

      左边是行索引，右边是值，最后一行写着它来自哪一列（Name）和值的类型（dtype）。

      还有几个查看表的写法：`len(df)` 是行数；`list(df.columns)` 把列名排成一个列表；`list(df.index)` 把行索引排成一个列表。
    example:
      id: py14.k1.e0
      kind: [predict, explain]
      data: [T]
      body: |
        读题面最前面的表 T，回答下面的问题。
      slots:
        - id: rows
          type: text
          format: integer
          prompt: 表 T 有几行？
          key: 4
        - id: label
          type: text
          format: integer
          prompt: 样本 S_C 所在那一行的行索引是多少？
          key: 22
        - id: value
          type: text
          format: integer
          prompt: 行索引为 7 的那一行，signal 是多少？
          key: 10
        - id: column
          type: choice
          prompt: "`df[\"group\"]` 得到的是什么？"
          options:
            - { id: series, content: 一列值（Series），共 4 个，行索引仍是 31、7、22、4 }
            - { id: unique, content: group 列里出现过的组别：control 和 drug }
            - { id: first, content: 第一行的组别 control }
          key: series
      explanation: |
        表 T 有 **4** 行。S_C 在第三行，它的行索引是 **22**；行索引为 7 的是 S_B 那一行，signal 是 **10**。注意行索引是标签，不是第几行：7 在第二行。

        `df["group"]` 取出整列，是一个 **Series**，有 4 个值 control、drug、drug、control，行索引仍是 31、7、22、4。它不会去重，也不只取第一行。
      verify: |
        column = df["group"]
        is_series = isinstance(column, pd.Series) and len(column) == len(df) and list(column.index) == list(df.index)
        answers = {
            "rows": len(df),
            "label": df.index[df["sample_id"] == "S_C"][0],
            "value": df.loc[7, "signal"],
            "column": "series" if is_series else "other",
        }
    practice:
      - id: py14.k1.q1
        kind: [explain]
        data: [T]
        body: |
          表 T 里，下面四样东西各是什么？
        slots:
          - id: parts
            type: table
            columns:
              - { id: item, header: 表里的 }
              - id: part
                header: 它是
                input:
                  type: choice
                  options:
                    - { id: index, label: 行索引 }
                    - { id: column, label: 列名 }
                    - { id: value, label: 表里的一个值 }
            rows:
              - { id: i31, cells: { item: 最左边的 31, part: index } }
              - { id: isignal, cells: { item: 最上面的 signal, part: column } }
              - { id: isb, cells: { item: S_B, part: value } }
              - { id: icontrol, cells: { item: control, part: value } }
        explanation: |
          31 是**行索引**，标出第一行；signal 是**列名**；S_B 和 control 都是表里的**值**，分别在 sample_id 列和 group 列里。

          行索引不是表里的一列：`list(df.columns)` 里只有 sample_id、signal、group。
        verify: |
          def part(item):
              if item in list(df.index):
                  return "index"
              if item in list(df.columns):
                  return "column"
              if (df == item).any().any():
                  return "value"
              return "none"
          items = {"i31": 31, "isignal": "signal", "isb": "S_B", "icontrol": "control"}
          answers = {"parts": {row: {"part": part(item)} for row, item in items.items()}}
      - id: py14.k1.q2
        kind: [predict]
        uses: [py06.k1]
        data: [T]
        body: |
          在交互窗口里依次输入下面几行。`df` 是表 T。
        slots:
          - id: wwpd
            type: table
            prompt: Python 显示什么？什么也不显示填 NOTHING，报错填 ERROR。
            columns:
              - { id: input, header: 输入 }
              - { id: shown, header: 显示, input: { type: text, match: output, quick: [NOTHING, ERROR] } }
            rows:
              - { id: r1, cells: { input: "`>>> len(df)`", shown: "4" } }
              - { id: r2, cells: { input: "`>>> list(df.columns)`", shown: "['sample_id', 'signal', 'group']" } }
              - { id: r3, cells: { input: "`>>> list(df.index)`", shown: "[31, 7, 22, 4]" } }
              - { id: r4, cells: { input: "`>>> df[\"Signal\"]`", shown: ERROR } }
        explanation: |
          | 输入 | 显示 |
          |---|---|
          | `len(df)` | 4：表有 4 行 |
          | `list(df.columns)` | `['sample_id', 'signal', 'group']`：列名，按表里的顺序 |
          | `list(df.index)` | `[31, 7, 22, 4]`：行索引，按表里的顺序，不按大小 |
          | `df["Signal"]` | ERROR：列名是小写的 signal，大小写不同就找不到这一列 |
        verify: |
          inputs = ["len(df)", "list(df.columns)", "list(df.index)", 'df["Signal"]']
          shown = repl("\n".join(inputs))
          answers = {"wwpd": {f"r{i}": {"shown": text} for i, text in enumerate(shown, 1)}}
      - id: py14.k1.q3
        kind: [predict, explain]
        data: [soil]
        body: |
          ```python
          depths = soil["depth"]
          print(depths)
          ```

          显示的是：

          ```text
          5     30
          12    25
          3     35
          8     30
          Name: depth, dtype: int64
          ```
        slots:
          - id: count
            type: text
            format: integer
            prompt: "`depths` 里有几个值？"
            key: 4
          - id: left
            type: choice
            prompt: 左边的 5、12、3、8 是什么？
            options:
              - { id: index, content: 原表 soil 的行索引 }
              - { id: position, content: 每个值是第几个 }
              - { id: values, content: depth 列的另一部分值 }
            key: index
          - id: at3
            type: text
            format: integer
            prompt: 行索引为 3 的那个值是多少？
            key: 35
        explanation: |
          `soil["depth"]` 取出 depth 这一列，是一个 Series，有 **4** 个值。左边的 5、12、3、8 是**原表 soil 的行索引**，取出这一列时跟着带了过来；它们不是第几个的意思。行索引为 3 的是东坡那一行，值是 **35**。
        verify: |
          depths = run()["depths"]
          left = "index" if list(depths.index) == list(soil.index) else "other"
          answers = {"count": len(depths), "left": left, "at3": depths[3]}
      - id: py14.k1.q4
        kind: [trace]
        body: |
          表的行标签不是行号。直接读下面的数据，填写行标签与列标签的 Python 显示内容。

          ```python
          table = pd.DataFrame({"name": ["Li", "Wu"], "score": [8, 9]}, index=[20, 10])
          print(table.index.tolist())
          print(table.columns.tolist())
          ```
        slots:
          - {id: rows, type: text, match: output, prompt: 行标签, key: "[20, 10]"}
          - {id: columns, type: text, match: output, prompt: 列标签, key: "['name', 'score']"}
        explanation: "index 明确给出了按顺序排列的行标签 20、10；name、score 是列标签。行标签不要求从 0 开始，也不要求按数值排序。"
        verify: |
          lines = run().lines()
          answers = {"rows": lines[0], "columns": lines[1]}
      - id: py14.k1.q5
        kind: [debug]
        body: |
          同样读取 score 列，一层方括号与两层方括号得到的对象不同。填写类名。

          ```python
          table = pd.DataFrame({"score": [8, 9]})
          print(type(table["score"]).__name__)
          print(type(table[["score"]]).__name__)
          ```
        slots:
          - {id: series, type: text, match: text, prompt: 第一行, key: Series}
          - {id: frame, type: text, match: text, prompt: 第二行, key: DataFrame}
        explanation: "单个列名取出一维 Series；列名列表即使只有一项，也保留二维 DataFrame。这一题辨认对象的形状，后面的选列课还会继续使用它。"
        verify: |
          lines = run().lines()
          answers = {"series": str(lines[0]), "frame": str(lines[1])}
    review:
      - id: py14.k1.r1
        kind: [predict, explain]
        data: [field]
        body: |
          读题面最前面的表 field，回答下面的问题。
        slots:
          - id: rows
            type: text
            format: integer
            prompt: 表有几行？
            key: 3
          - id: cols
            type: text
            format: integer
            prompt: 表有几列（不算行索引）？
            key: 2
          - id: p2
            type: choice
            prompt: P2 是什么？
            options:
              - { id: value, content: crop 列里的一个值 }
              - { id: index, content: 一行的行索引 }
              - { id: column, content: 一个列名 }
            key: index
          - id: crop
            type: text
            match: text
            prompt: 行索引为 P3 的那一行，crop 是什么？
            key: 大豆
        explanation: |
          3 行、2 列（crop 和 yield_kg）。左边的 P1、P2、P3 是**行索引**，这里用文字作标签，不是 crop 列的值。行索引为 P3 的那一行，crop 是**大豆**。
        verify: |
          answers = {
              "rows": len(field),
              "cols": len(field.columns),
              "p2": "index" if "P2" in list(field.index) else "column" if "P2" in list(field.columns) else "value",
              "crop": field.loc["P3", "crop"],
          }
      - id: py14.k1.r2
        kind: [debug]
        data: [soil]
        body: |
          想取出 soil 表的 depth 这一列。下面哪几种写法能做到？选出所有可以的。
        slots:
          - id: ways
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - id: exact
                content: |
                  ```python
                  depths = soil["depth"]
                  ```
              - id: upper
                content: |
                  ```python
                  depths = soil["Depth"]
                  ```
              - id: bare
                content: |
                  ```python
                  depths = soil[depth]
                  ```
              - id: space
                content: |
                  ```python
                  depths = soil["depth "]
                  ```
            key: [exact]
        explanation: |
          只有 `soil["depth"]` 可以。列名要和表里的一模一样：`"Depth"` 大小写不同，`"depth "` 多了一个空格，都找不到这一列；不加引号的 `depth` 被当成一个名字，而这个名字没有赋过值，报 NameError。
        verify: |
          def gets_depth(code):
              r = run(code)
              return r.error is None and isinstance(r["depths"], pd.Series) and r["depths"].name == "depth"
          answers = {"ways": [option for option, code in OPTIONS["ways"].items() if gets_depth(code)]}
    quiz:
      - id: py14.k1.x1
        kind: [explain]
        data: [field]
        body: |
          同事看着表 field 说：“这张表的第一列是 P1、P2、P3。”
        slots:
          - id: claim
            type: choice
            prompt: 这句话对吗？
            options:
              - { id: right, content: 对，P1、P2、P3 就是第一列 }
              - { id: wrong, content: 不对，P1、P2、P3 是行索引，不是表里的列 }
            key: wrong
          - id: first
            type: text
            match: text
            prompt: 表里第一列的列名是什么？
            key: crop
        explanation: |
          **不对。** P1、P2、P3 显示在最左边，但它们是每一行的标签，也就是行索引；`list(field.columns)` 里只有 crop 和 yield_kg。表里的第一列是 **crop**。
        verify: |
          columns = list(field.columns)
          answers = {"claim": "wrong" if "P1" in list(field.index) and "P1" not in columns else "right", "first": columns[0]}
      - id: py14.k1.x2
        kind: [predict]
        uses: [py06.k1]
        data: [field]
        body: |
          表 field 已经准备好。下面每个表达式单独求值，得到的是什么东西？会报错的选“报错”。
        slots:
          - id: kinds
            type: table
            columns:
              - { id: expr, header: 表达式 }
              - id: kind
                header: 得到
                input:
                  type: choice
                  options:
                    - { id: table, label: 一张表（DataFrame） }
                    - { id: series, label: 一列（Series） }
                    - { id: number, label: 一个数 }
                    - { id: items, label: 一个列表 }
                    - { id: error, label: 报错 }
            rows:
              - { id: whole, cells: { expr: "`field`", kind: table } }
              - { id: column, cells: { expr: "`field[\"crop\"]`", kind: series } }
              - { id: size, cells: { expr: "`len(field)`", kind: number } }
              - { id: names, cells: { expr: "`list(field.columns)`", kind: items } }
              - { id: missing, cells: { expr: "`field[\"产量\"]`", kind: error } }
        explanation: |
          | 表达式 | 得到 | 为什么 |
          |---|---|---|
          | `field` | 一张表 | 整张表，有列名和行索引 |
          | `field["crop"]` | 一列（Series） | 用列名取出的一列，带着原表的行索引 P1、P2、P3 |
          | `len(field)` | 一个数 | 表有几行，这里是 3 |
          | `list(field.columns)` | 一个列表 | 把列名排成列表：`['crop', 'yield_kg']` |
          | `field["产量"]` | 报错 | 列名是 yield_kg，没有叫“产量”的列，KeyError |

          看到一个表达式，先想它交回的是哪种东西，再想下一步能对它做什么。
        verify: |
          def kind(expr):
              try:
                  value = eval(expr, {"field": field})
              except Exception:
                  return "error"
              if isinstance(value, pd.DataFrame):
                  return "table"
              if isinstance(value, pd.Series):
                  return "series"
              if isinstance(value, list):
                  return "items"
              return "number" if isinstance(value, int) else "other"
          exprs = {"whole": "field", "column": 'field["crop"]', "size": "len(field)", "names": "list(field.columns)", "missing": 'field["产量"]'}
          answers = {"kinds": {row: {"kind": kind(expr)} for row, expr in exprs.items()}}

