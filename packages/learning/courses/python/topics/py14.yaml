      - id: py14.k3.x2
        kind: [explain]
        data: [plots]
        body: |
          读题面最前面的表 plots：在几个样方里数了各种植物的株数，一行是“某个样方里某种植物的一次计数”。

          下面四件事，各要数出几个？
        slots:
          - id: counts
            type: table
            columns:
              - { id: what, header: 要数的 }
              - { id: n, header: 个数, input: integer }
            rows:
              - { id: rows, cells: { what: 表有几行, n: 6 } }
              - { id: plots, cells: { what: 一共调查了几个样方, n: 3 } }
              - { id: species, cells: { what: 一共记录到几种植物, n: 3 } }
              - { id: dandelion, cells: { what: 蒲公英出现在几个样方里, n: 2 } }
        explanation: |
          同一个样方（Q1）占了三行，同一种植物（蒲公英）占了两行，所以要数的东西不同，数法也不同：

          - 表有几行：**6**，每行是一次计数；
          - 样方个数：数 plot 列里**不同的**编号，Q1、Q2、Q3，**3** 个，不是 6；
          - 植物种数：数 species 列里不同的名字，蒲公英、车前草、狗尾草，**3** 种；
          - 蒲公英出现在几个样方里：只看 species 是蒲公英的两行，它们在 Q1 和 Q2，**2** 个样方。

          先想清楚一行代表什么，再决定数行，还是数某一列里不同的值。
        verify: |
          answers = {"counts": {
              "rows": {"n": len(plots)},
              "plots": {"n": plots["plot"].nunique()},
              "species": {"n": plots["species"].nunique()},
              "dandelion": {"n": plots.loc[plots["species"] == "蒲公英", "plot"].nunique()},
          }}
