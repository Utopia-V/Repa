    quiz:
      - id: py48.k3.x1
        kind: [modify]
        uses: [py25.k2, py29.k1, py28.k1]
        data: [SC, PP]
        body: |
          需求是：

          > 同一个受试者测了两次时，用最后一次的成绩；按 people 补上 cohort；按 cohort 求平均成绩 mean_score。

          核对时发现：A2 用的是第一次的 65，不是复测的 70。作答框里是 AI 的脚本，只改出错的那一处并提交，结果仍叫 `summary`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              latest = scores.drop_duplicates(subset=["pid"])
              merged = latest.merge(people, on="pid", how="left")
              summary = merged.groupby("cohort").agg(mean_score=("score", "mean"))
            solution: |
              latest = scores.drop_duplicates(subset=["pid"], keep="last")
              merged = latest.merge(people, on="pid", how="left")
              summary = merged.groupby("cohort").agg(mean_score=("score", "mean"))
            rejects:
              - code: |
                  latest = scores.drop_duplicates(keep="last")
                  merged = latest.merge(people, on="pid", how="left")
                  summary = merged.groupby("cohort").agg(mean_score=("score", "mean"))
                why: 没写 subset，A2 的两次成绩不同，两行都留下了
              - code: |
                  latest = scores.drop_duplicates(subset=["pid"], keep=False)
                  merged = latest.merge(people, on="pid", how="left")
                  summary = merged.groupby("cohort").agg(mean_score=("score", "mean"))
                why: keep=False 把测了两次的 A2 整个去掉了
            tests:
              - name: 表 scores 和 people
                expect:
                  summary: 'pd.DataFrame({"mean_score": [83.0, 63.5]}, index=["第一批", "第二批"])'
                  scores: scores
              - name: 换一组受试者
                hidden: true
                setup: |
                  import pandas as pd
                  scores = pd.DataFrame({"pid": ["B1", "B1", "B2", "B3", "B3"], "score": [60, 80, 75, 90, 70]})
                  people = pd.DataFrame({"pid": ["B1", "B2", "B3"], "cohort": ["第一批", "第二批", "第二批"]})
                expect:
                  summary: 'pd.DataFrame({"mean_score": [80.0, 72.5]}, index=["第一批", "第二批"])'
        explanation: |
          只改第 1 行，加上 `keep="last"`：

          ```python
          latest = scores.drop_duplicates(subset=["pid"], keep="last")
          ```

          变量名叫 latest，代码却留的是第一次，名字不能代替核对。改后第二批是 A2 的 70 和 A4 的 57，平均 63.5；第一批是 83.0。只写 `keep="last"` 不写 subset，A2 两行不完全相同，都会留下；`keep=False` 会把 A2 整个去掉。
      - id: py48.k3.x2
        kind: [specify, predict]
