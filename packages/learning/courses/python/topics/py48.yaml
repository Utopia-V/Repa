                  summary: 'pd.DataFrame({"n": [1, 1], "mean_signal": [10.0, 12.0]}, index=["北坡", "南坡"])'
        explanation: |
          只改第 3 行的比较符：

          ```python
          passed = merged.loc[merged["signal"] >= 10]
          ```

          其余三行不动。改后北坡是 001 和 003，n 为 2、平均 11.0；南坡是 004，n 为 1、平均 15.0。判分时还会换一组带小数的测量：“大于 9”会把 9.5 也算进去。删掉去重那一行虽然也“改了一处”，却把 002 的复测 11 带了进来，结果跟着变了。
      - id: py48.k3.q2
        kind: [modify]
        uses: [py29.k2, py40.k2, py42.k1]
        body: |
          合并之后，同事想加一个验收条件。AI 建议的是“合并后的表不是空的”，可这查不出右表编号重复让行数变多。

          把作答框里的函数改成：合并后的行数与合并前相同时返回 True，否则返回 False。以后这样用：`assert rows_kept(first, merged)`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              def rows_kept(before, after):
                  return len(after) > 0
            solution: |
              def rows_kept(before, after):
                  return len(after) == len(before)
            rejects:
              - code: |
                  def rows_kept(before, after):
                      return len(after) >= len(before)
                why: 行数变多时也返回 True
              - code: |
                  def rows_kept(before, after):
                      return len(after) <= len(before)
                why: 合并后少了行也返回 True
            tests:
              - name: 行数不变与右表编号重复
                setup: |
                  import pandas as pd
                  first = pd.DataFrame({"sample_id": ["001", "002", "003", "004"], "signal": [12, 9, 10, 15]})
                  sites = pd.DataFrame({"sample_id": ["001", "002", "003", "004"], "site": ["北坡", "南坡", "北坡", "南坡"]})
                  sites_dup = pd.DataFrame({"sample_id": ["001", "002", "003", "003", "004"], "site": ["北坡", "南坡", "北坡", "南坡", "南坡"]})
                  merged_ok = first.merge(sites, on="sample_id", how="left")
                  merged_dup = first.merge(sites_dup, on="sample_id", how="left")
                doctest: |
                  >>> rows_kept(first, merged_ok)
                  True
                  >>> rows_kept(first, merged_dup)
                  False
              - name: 合并后少了行
                hidden: true
                setup: |
                  import pandas as pd
                  first = pd.DataFrame({"sample_id": ["001", "002", "003", "004"], "signal": [12, 9, 10, 15]})
                  sites = pd.DataFrame({"sample_id": ["001", "002", "003"], "site": ["北坡", "南坡", "北坡"]})
                  merged_lost = first.merge(sites, on="sample_id", how="inner")
                doctest: |
                  >>> rows_kept(first, merged_lost)
                  False
        explanation: |
          ```python
          def rows_kept(before, after):
              return len(after) == len(before)
          ```

          “不是空的”在行数变多时照样成立，查不出编号重复。要比的是合并前后的行数：变多（右表编号重复）、变少（how="inner" 去掉了没登记的样本）都返回 False。写成 `>=` 或 `<=` 只能拦下其中一种。
      - id: py48.k3.q3
        kind: [specify]
        uses: [py42.k1]
        body: |
          你改好了脚本的合并那一行，准备回复 AI：“这样算改好了”。下面哪些能当验收条件？选出全部。
        slots:
          - id: conditions
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: looks, content: 汇总结果看起来合理 }
              - { id: rows, content: 合并后 merged 的行数等于 first 的行数 }
              - { id: style, content: 代码写得更规范、更简洁 }
              - { id: number, content: 在 004 没登记的那张反例表上，汇总表里有一行组名为缺失、n 为 1 }
              - { id: ai, content: AI 说它已经检查过了 }
            key: [rows, number]
        explanation: |
          “merged 的行数等于 first 的行数”和“在那张反例表上有一行组名为缺失、n 为 1”能当验收条件：前者能写成 `assert len(merged) == len(first)`，后者是一个明确的数，谁拿同一张表运行都能核对。

          “看起来合理”“写得更规范”没有标准，没法核对；“AI 说检查过了”是别人的结论，不是你能复验的条件。
        manual: [conditions]
    review:
      - id: py48.k3.r1
