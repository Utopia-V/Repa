notes: |
  建议题型与判分：解释代码（S/O）、找错（P）、小改代码（T）、写清需求（S/O）。
  自拟部分：自拟整合任务。
  用预先给出的 8～15 行有效代码、最多两张各 4～6 行的小表，每次聚焦一种需求偏差。综合题仍按知识点拆成例题和短练习，不变成从空白写完整分析项目的大作业。
