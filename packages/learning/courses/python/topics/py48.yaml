        data: [RD, PLM]
        body: |
          需求是：

          > 每个样点只用第一次测量；按 plots 补上 site，样点一个不少，没登记的单独算一组；按 site 数出样点个数 n。

          在 P4 没登记的反例上，汇总表里没有缺失的那一组。作答框里是 AI 的脚本，只改出错的那一处并提交，结果仍叫 `summary`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              first = readings.drop_duplicates(subset=["plot_id"])
              merged = first.merge(plots, on="plot_id", how="inner")
              summary = merged.groupby("site", dropna=False).agg(n=("plot_id", "count"))
            solution: |
              first = readings.drop_duplicates(subset=["plot_id"])
              merged = first.merge(plots, on="plot_id", how="left")
              summary = merged.groupby("site", dropna=False).agg(n=("plot_id", "count"))
            rejects:
              - code: |
                  first = readings.drop_duplicates(subset=["plot_id"])
                  merged = first.merge(plots, on="plot_id", how="right")
                  summary = merged.groupby("site", dropna=False).agg(n=("plot_id", "count"))
                why: right 保留的是 plots 的行，没登记的样点仍然不在
              - code: |
                  first = readings.drop_duplicates(subset=["plot_id"])
                  merged = first.merge(plots, on="plot_id", how="left")
                  summary = merged.groupby("site").agg(n=("plot_id", "count"))
                why: 改了合并，却把分组的 dropna=False 删了，缺失的组又丢了
            tests:
              - name: P4 没登记
                expect:
                  summary: 'pd.DataFrame({"n": [2, 1, 1]}, index=["北坡", "南坡", np.nan])'
