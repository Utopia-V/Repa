id: py48
title: 读懂一份 AI 给的分析脚本，并说清怎样改
status: complete
minutes: 20
summary: 把 AI 写的短脚本逐行对到需求里的规则和输入输出；用恰好等于阈值、键重复、键找不到、notebook 重跑这类小反例检查偏差；提出只改一处的修改，并写下能直接核对的验收条件。
prerequisites:
  - topic: py46
    key: true
    weight: 1.00
    covers: [py46.k1, py46.k2]
  - topic: py29
    key: true
    weight: 1.00
    covers: [py29.k1, py29.k2, py29.k3]
  - topic: py45
    key: true
    weight: 1.00
    covers: [py45.k1, py45.k2]
sources:
  - source: pydata-book
    where: 第 13 章 （情境参考）
    url: https://wesmckinney.com/book/data-analysis-examples
    use: reference
  - source: think-python
    where: 第 19 章
    url: https://allendowney.github.io/ThinkPython/chap19.html
    use: reference
notes: |
  范围：k1 把一份 AI 写的 4～10 行脚本逐行对到需求里的规则，并说出每一行拿到什么、交出什么（重点是 merge 这一行：两张输入表、配对列、how 保留谁的行、交出哪些列）；k2 在小反例上预测脚本的结果，与按需求手算的结果比对（恰好等于阈值、右表键重复、左表键在右表找不到、groupby 丢掉缺失的组、notebook 删掉单元格或改了没重跑）；k3 只改造成偏差的那一处，并写下能直接核对的验收条件（assert 或一个明确的数），用“原脚本上不成立、改好后成立”来挑验收条件。
  先修祖先里没有多条件筛选、新列运算和排序，本节同样只用单列条件、不排序。验收条件只用 len、count、数值列的 sum、loc 取一格和 merge 的 validate；indicator 只在讲解里提到。
  按原稿约束：用预先给出的 8～15 行以内的有效代码、最多两张各 4～6 行的小表，每次聚焦一种需求偏差；综合题按知识点拆成例题和短练习，不变成从空白写完整分析项目的大作业。
  情境：样本测量表 samples 与样本信息表 sites（练习），土层深度 readings 与样点表 plots、培养皿计数 counts 与处理表 dishes、受试者成绩 scores 与分批表 people（复习与测验）。中文组名按编码顺序排序：东坡、北坡、南坡；第一批、第二批。
  “规则对应哪一行”由 verify 按这一行调用的函数或比较符找出；“哪一句描述这一行”由 verify 换一张输入表运行、看行数是否保留来判断；“哪个修改符合需求”“哪个验收条件查得到偏差”都由 verify 逐个代入原脚本和改好的脚本运行。复习和测验题没有需要模型核对的作答位；练习 py48.k3.q3（哪些说法算得上验收条件）是语义判断，列为 manual，练习不要求模型核对。
  读文件和 notebook 的题用 python 夹具每次重写文件，并删掉上一次留下的输出文件（同一个 topic 的核对共用一个内存文件系统）。notebook 单元格按 py45 的写法，写成带“单元格 字母，编号 [k]”的独立代码块，verify 用 BLOCKS 按执行顺序或屏幕顺序拼出程序。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 2 分钟、练习 3 分钟。整节偏紧，试做时若超时，先把 k3 的练习留到下一次。
  小表、脚本和题目为本课自拟。
intro: |
  这一节是课程的收尾。你会读几份 AI 写的短分析脚本，做三件事：说出每一行对应需求里的哪条规则、拿到什么交出什么；用专门造的小反例检查它在边界上是不是还对；找到偏差后，只改一处，并写下改好以后怎样核对。

  脚本都不长，表也都很小。每道题从题面给出的文件或表重新开始。阈值和“达标”都是题目约定，不是科研结论。
wrapup: |
  拿到 AI 给的脚本，可以按这一节的顺序回它一段话：

  - 哪一行对应哪条规则，哪条规则找不到对应的行；
  - 在哪张小反例上它与需求不符：输入是什么，它给出什么，需求要什么；
  - 只改哪一处；
  - 改完用哪几条能直接检查的条件验收，例如“合并后行数等于样本表的行数”“在这张反例表上，北坡的 n 是 2”。

  这样的回复，AI 和同事都能照着改，你也能自己核对改得对不对。
