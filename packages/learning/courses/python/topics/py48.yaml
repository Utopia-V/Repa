                  ```
            key: [good3, drug]
        explanation: |
          first 是 01（52）、02（40）、03（45）、04（48）。原脚本用 `> 45`，03 恰好是 45 被丢掉，good 只有 01、04 两行，汇总表里只有 control。

          | 验收条件 | 原脚本 | 改好后 |
          |---|---|---|
          | merged 行数等于 first | 成立 | 成立 |
          | good 有 3 行 | 2 行，不成立 | 成立 |
          | n 加起来等于 good 的行数 | 成立 | 成立 |
          | drug 的 n 是 1 | 汇总表里没有 drug，停下 | 成立 |

          **good 有 3 行**和 **drug 的 n 是 1** 查得到这处偏差。另外两条两边都成立：它们检查的是合并和分组，和比较符无关。
