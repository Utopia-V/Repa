  - id: py48.k3
    title: 提出最小修改及可复验的验收条件
    card:
      name: 最小修改与验收
      aliases: [验收条件, 只改一处]
      definition: 找到偏差后，只改造成偏差的那一处；同时写下能直接核对的验收条件，例如“合并后行数等于样本表行数”或“在这张反例表上北坡的 n 是 2”，改完后逐条核对。
      conditions:
        - “看起来合理”“写得更规范”不是验收条件；验收条件要能写成 assert，或者是一个明确的数。
        - 好的验收条件在原来的脚本上不成立、在改好的脚本上成立；两边都成立的条件查不出这处偏差。
      example:
        from: py48.k3.e0
        text: |
          004 没登记采样点，汇总时丢了：只把分组那一行改成 `groupby("site", dropna=False)`；验收条件 `assert summary["n"].sum() == len(passed)` 在原脚本上不成立，改好后成立。
    lesson: |
      找到偏差以后，回复 AI 或同事时说清两件事：改哪里，怎样算改好了。

      **只改一处。** 偏差出在哪一步就改哪一步，其余代码不动。让 AI 整段重写，会带进新的变化，原来对的地方也得重新核对一遍。

      **验收条件要能直接检查。** 常见的几类：

      | 想确认的事 | 写法 |
      |---|---|
      | 合并没有让行数变多或变少 | `assert len(merged) == len(first)` |
      | 右表每个编号最多一行 | merge 里加 `validate="many_to_one"`，不满足时报 MergeError |
      | 每个样本都配上了信息 | `assert merged["site"].count() == len(merged)`，或加 `indicator=True` 看有没有 left_only |
      | 分组没有漏掉行 | `assert summary["n"].sum() == len(passed)` |
      | 在一张小表上的具体结果 | “在反例表上，北坡的 n 是 2，缺失的组 n 是 1” |

      “结果看起来合理”“代码更规范”“AI 说检查过了”都不是验收条件：别人没法照着核对。

      挑验收条件时，拿原来的脚本和改好的脚本各试一次。好的验收条件在原来的脚本上不成立（运行到它会停下），在改好的脚本上成立；两边都成立的条件，查不出这处偏差。
    example:
      id: py48.k3.e0
      kind: [modify, specify]
      uses: [py28.k2, py29.k1, py42.k2]
      data: [SA, STM]
      body: |
        需求是：每个样本只用第一次测量；补上采样点 site；signal 至少为 10 的算达标；按 site 数出达标样本数 n。没有采样点信息的样本单独算一组，不能丢。

        在 004 没登记的反例上，脚本把 004 丢了。

        ```python startLine=1
        first = samples.drop_duplicates(subset=["sample_id"])
        merged = first.merge(sites, on="sample_id", how="left")
        passed = merged.loc[merged["signal"] >= 10]
        summary = passed.groupby("site").agg(n=("sample_id", "count"))
        ```
      slots:
        - id: fix
          type: choice
          prompt: 只改一行，改成哪一种？
          options:
            - id: inner
              content: |
                ```python
                merged = first.merge(sites, on="sample_id", how="inner")
                ```
            - id: keep
              content: |
                ```python
                summary = passed.groupby("site", dropna=False).agg(n=("sample_id", "count"))
                ```
            - id: strict
              content: |
                ```python
                passed = merged.loc[merged["signal"] > 10]
                ```
          key: keep
        - id: checks
          type: choice
          multiple: true
          scoring: options
          prompt: 在这张反例表上，哪些验收条件在原脚本上不成立、改好后成立？选出全部。
          options:
            - id: sum
              content: |
                ```python
                assert summary["n"].sum() == len(passed)
                ```
            - id: rows
              content: |
                ```python
                assert len(merged) == len(first)
                ```
            - id: north
              content: |
                ```python
                assert summary.loc["北坡", "n"] == 2
                ```
            - id: groups
              content: |
                ```python
                assert len(summary) == 2
                ```
          key: [sum, groups]
      explanation: |
        改分组那一行：`groupby("site", dropna=False)`，site 缺失的 004 单独成一组。改成 inner 会在合并时就把 004 去掉，和需求正好相反；改比较符碰不到原因。

        四个验收条件在原脚本和改好的脚本上分别是：

        | 验收条件 | 原脚本 | 改好后 |
        |---|---|---|
        | n 加起来等于 passed 的行数 | 2 ≠ 3，不成立 | 3 = 3，成立 |
        | merged 行数等于 first | 成立 | 成立 |
        | 北坡的 n 是 2 | 成立 | 成立 |
        | 汇总表有 2 行 | 只有北坡 1 行，不成立 | 北坡和缺失组 2 行，成立 |

        中间两条两边都成立，查不出这处偏差；它们可以留着防别的问题，但不能用来验收这次修改。
      verify: |
        lines = CODE.splitlines()
        def patched(code):
            name = code.split(" = ")[0]
            return "\n".join(code if line.startswith(name + " = ") else line for line in lines)
        # 按需求实现一遍。
        first = samples.drop_duplicates(subset=["sample_id"])
        merged = first.merge(sites, on="sample_id", how="left")
        passed = merged.loc[merged["signal"] >= 10]
        need = passed.groupby("site", dropna=False).agg(n=("sample_id", "count"))
        fits = [option for option, code in OPTIONS["fix"].items() if run(patched(code))["summary"].equals(need)]
        original = run()
        fixed = run(patched(OPTIONS["fix"][fits[0]]))
        def holds(result, check):
            try:
                exec(check, {}, dict(result.vars))
                return True
            except Exception:
                return False
        good = [option for option, check in OPTIONS["checks"].items() if not holds(original, check) and holds(fixed, check)]
        answers = {"fix": fits[0] if len(fits) == 1 else fits, "checks": good}
