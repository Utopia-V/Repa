  - id: py48.k2
    title: 用边界和反例检查偏差
    card:
      name: 反例
      aliases: [小反例, 边界例子]
      definition: 专门造的一张小表，让脚本可能出错的地方真的出现；先按需求手算应有的结果，再预测脚本的结果，两者不同就找到了一处偏差。
      conditions:
        - 常用的反例：恰好等于阈值的值、右表编号重复、左表编号在右表里找不到、分组列缺失、notebook 重启后从头运行。
        - 反例上两者一致，只说明这一处没问题，不说明脚本处处都对。
      example:
        from: py48.k2.e0
        text: |
          sites 里 003 登记了两次：left merge 后 003 变成两行，merged 从 5 行变成 6 行，达标样本只有 3 个，汇总表的 n 却加起来是 4。
    lesson: |
      AI 的脚本在你手上那张表上跑出了看着合理的结果，不等于它照需求做了。在一张“正常”的表上，好几种写法常常碰巧给出一样的结果。要检查偏差，就造一张小表，让可能出错的地方真的出现：

      | 可能的偏差 | 反例里放什么 | 脚本出错时的样子 |
      |---|---|---|
      | 比较符多了或少了等号 | 恰好等于阈值的值 | 该留的没留，或不该留的留下了 |
      | 右表编号重复 | 同一个编号在右表登记两次 | merge 之后行数变多，同一个样本被算了两次 |
      | 左表编号在右表找不到 | 一个没登记的样本 | left merge 后补上的列是缺失，groupby 默认不把它放进任何组；inner merge 直接把它去掉 |
      | notebook 依赖了隐藏的状态 | 重启内核，从头运行全部单元格 | 报 NameError，或结果和屏幕上的代码对不上 |

      在反例上先按需求手算应有的结果，再预测脚本会给出什么。两者不同，就把三样一起写下来：输入是什么，脚本给出什么，需求要什么。这就是一份别人能照着复现的问题报告。
    example:
      id: py48.k2.e0
      kind: [predict, debug]
      uses: [py25.k2, py29.k2, py28.k1]
      data: [SA, STD]
      body: |
        需求是：每个样本只用第一次测量；补上采样点 site；signal 至少为 10 的算达标；按 site 数出达标样本数。每个样本只能算一次。

        这张 sites 表是一个反例：003 被登记了两次。

        ```python startLine=1
        first = samples.drop_duplicates(subset=["sample_id"])
        merged = first.merge(sites, on="sample_id", how="left")
        passed = merged.loc[merged["signal"] >= 10]
        summary = passed.groupby("site").agg(n=("sample_id", "count"))
        ```
      slots:
        - id: merged_rows
          type: text
          format: integer
          prompt: "`merged` 有几行？"
          key: 6
        - id: total
          type: text
          format: integer
          prompt: 汇总表里各组的 n 加起来是多少？
          key: 4
        - id: need
          type: text
          format: integer
          prompt: 实际达标的样本有几个？
          key: 3
        - id: cause
          type: choice
          prompt: 多出来的那一个是怎么来的？
          options:
            - id: dedupe
              content: 第 1 行没有去掉 003 的重复测量
            - id: dup
              content: 003 在 sites 里有两行，第 2 行把它配成了两行
            - id: threshold
              content: 第 3 行的 `>=` 多算了恰好为 10 的样本
          key: dup
      explanation: |
        first 有 5 行，每个样本一行。merge 时 003 在 sites 里能配上两行（北坡、南坡），于是 merged 里 003 也成了两行，共 **6** 行。达标的样本是 001、003、004，只有 **3** 个，但 003 的两行都达标，汇总表里北坡、南坡各算了它一次，n 加起来是 **4**。

        第 1 行没问题，003 在 samples 里只测了一次；`>=` 与“至少为 10”一致。问题出在右表编号重复。这时该做的不是在脚本里随便删一行 sites，而是把反例交回去：003 到底在哪个坡，要由登记数据的人确定。
      verify: |
        r = run()
        first, merged = r["first"], r["merged"]
        # 逐个核对三种说法。
        holds = {
            "dedupe": len(first) != len(samples.drop_duplicates(subset=["sample_id"])),
            "dup": len(merged) > len(first),
            "threshold": not r["passed"].equals(merged.loc[merged["signal"] >= 10]),
        }
        true = [cause for cause, ok in holds.items() if ok]
        answers = {
            "merged_rows": len(merged),
            "total": int(r["summary"]["n"].sum()),
            "need": r["passed"]["sample_id"].nunique(),
            "cause": true[0] if len(true) == 1 else true,
        }
    practice:
      - id: py48.k2.q1
        kind: [specify, predict]
        uses: [py08.k2, py17.k2, py42.k1]
        body: |
          需求是：signal **超过** 10 的样本算达标，恰好为 10 的不算。AI 的脚本里筛选这一行是：

          ```python
          passed = merged.loc[merged["signal"] >= 10]
          ```

          你想造一张三行的小表，看它会不会多留。
        slots:
          - id: table
            type: choice
            prompt: 哪一张小表能暴露这处偏差？
            options:
              - { id: a, content: signal 依次为 8、12、15 }
              - { id: b, content: signal 依次为 9、10、11 }
              - { id: c, content: signal 依次为 11、13、20 }
            key: b
          - id: script_count
            type: text
            format: integer
            prompt: 在你选的那张表上，脚本留下几行？
            key: 2
          - id: need_count
            type: text
            format: integer
            prompt: 按需求应当留下几行？
            key: 1
        explanation: |
          选 **9、10、11** 这一张：只有恰好等于 10 的值，在 `>= 10` 和“超过 10”下结果不同。脚本留下 10 和 11 两行（**2** 行），需求只要 11（**1** 行）。另外两张表里没有 10，两种写法结果一样，查不出问题。
        verify: |
          candidates = {"a": [8, 12, 15], "b": [9, 10, 11], "c": [11, 13, 20]}
          def script(values):
              return len(run(merged=pd.DataFrame({"signal": values}))["passed"])
          def need(values):
              return len([value for value in values if value > 10])
          reveal = [name for name, values in candidates.items() if script(values) != need(values)]
          chosen = candidates[reveal[0]]
          answers = {
              "table": reveal[0] if len(reveal) == 1 else reveal,
              "script_count": script(chosen),
              "need_count": need(chosen),
          }
