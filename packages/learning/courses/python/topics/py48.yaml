                  len(merged): "4"
        explanation: |
          只改合并那一行，`how="inner"` 改成 `how="left"`：

          ```python
          merged = first.merge(plots, on="plot_id", how="left")
          ```

          分组那一行已经写了 `dropna=False`，它没错，只是 inner 在它之前就把 P4 去掉了，缺失的组无从出现。改后 merged 是 4 行，汇总表是北坡 2、南坡 1、缺失 1。
      - id: py48.k3.r2
        kind: [specify, debug]
        uses: [py17.k2, py28.k1, py42.k2]
        data: [CT, DS]
        body: |
          需求是：每个培养皿只用第一次计数；按 dishes 补上 treatment；cells **至少为 45** 的算长得好；按 treatment 数出个数 n。AI 的脚本：

          ```python startLine=1
          first = counts.drop_duplicates(subset=["dish_id"])
          merged = first.merge(dishes, on="dish_id", how="left")
          good = merged.loc[merged["cells"] > 45]
          summary = good.groupby("treatment").agg(n=("dish_id", "count"))
          ```

          第 3 行要改成 `>= 45`。改之前先挑验收条件：在这张表上，哪些检查在原来的脚本上不成立（运行到它会停下，不论报什么错），在改好的脚本上成立？
        slots:
