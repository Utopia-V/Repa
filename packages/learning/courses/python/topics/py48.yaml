kps:
  - id: py48.k1
    title: 把每段代码对应到输入输出与业务规则
    card:
      name: 规则对到代码
      aliases: [读脚本, 代码与需求对照]
      definition: 读一份脚本时，把需求拆成一条条规则，逐条找出实现它的那一行，并说出这一行拿到哪张表、交出哪张表；找不到对应行、或只做了一部分的规则，就是要问清楚的地方。
      conditions:
        - 一行代码可能只做了规则的一部分，例如“用最后一次测量”写成了默认的 drop_duplicates，留的是第一次。
        - 读 merge 这一行要说全：两张输入表、按哪一列配对、how 保留谁的行、交出哪些列。
      example:
        from: py48.k1.e0
        text: |
          ```python
          first = samples.drop_duplicates(subset=["sample_id"])
          merged = first.merge(sites, on="sample_id", how="left")
          ```
          第一行对应“每个样本只用第一次测量”，6 行变 5 行；第二行对应“补上采样点”，拿到 first 和 sites，交出 5 行、多了 site 列的表。
    lesson: |
      AI 给的脚本往往一口气写完。读它的时候，先把你的需求拆成几条规则，再逐条去脚本里找实现它的那一行，像对答案一样。找的时候可以看这一行用了什么：

      | 需求里的说法 | 去找什么样的代码 | 核对什么 |
      |---|---|---|
      | 只用第一次 / 最后一次 | `drop_duplicates` | subset 是不是编号列，keep 是不是对 |
      | 补上另一张表的信息 | `merge` | on 是哪一列，how 保留谁的行 |
      | 至少 / 超过多少算达标 | `loc` 里的比较 | 比较符有没有等号 |
      | 按组数个数、求平均 | `groupby(...).agg(...)` | 分组列、计数列、缺失的组 |
      | 写进文件 | `to_csv` | 文件名、要不要索引 |

      每找到一行，再说出它拿到哪张表、交出哪张表、交出的表大概几行。对完以后看两种情况：

      - 需求里的某条规则找不到对应的行，或者那一行只做了一部分：脚本没做到它；
      - 脚本里有一行对应不到任何规则：问清它为什么在那里，它可能悄悄改了结果。

      merge 这一行最容易说漏。[合并](repa:concept/py29.k1)要说全四样：两张输入表各是什么；按哪一列配对；`how="left"` 保留左表的每一行（右表里找不到的，补上的列是缺失），`how="inner"` 只留两边都有的编号；交出的表有哪些列。
    example:
      id: py48.k1.e0
      kind: [explain, trace]
      uses: [py15.k2, py25.k2, py29.k1, py28.k1, py34.k1, py46.k1]
      data: [files]
      body: |
        你向 AI 提的需求是：

        > ① 每个样本只用第一次测量；② 按 sites.csv 给每个样本补上采样点 site；③ signal 至少为 10 的算达标；④ 按 site 数出达标样本数 n，并求平均 signal；⑤ 结果写进 site_summary.csv。

        AI 给的脚本：

        ```python startLine=1
        import pandas as pd

        samples = pd.read_csv("samples.csv", dtype={"sample_id": "str"})
        sites = pd.read_csv("sites.csv", dtype={"sample_id": "str"})

        first = samples.drop_duplicates(subset=["sample_id"])
        merged = first.merge(sites, on="sample_id", how="left")
        passed = merged.loc[merged["signal"] >= 10]
        summary = passed.groupby("site").agg(n=("sample_id", "count"), mean_signal=("signal", "mean"))
        summary.to_csv("site_summary.csv")
        ```
      slots:
        - id: rules
          type: table
          prompt: 每条规则由第几行实现？
          columns:
            - { id: rule, header: 规则 }
            - { id: line, header: 第几行, input: integer }
          rows:
            - { id: r1, cells: { rule: ① 只用第一次测量, line: 6 } }
            - { id: r2, cells: { rule: ② 补上采样点, line: 7 } }
            - { id: r3, cells: { rule: ③ 至少 10 算达标, line: 8 } }
            - { id: r4, cells: { rule: ④ 按 site 计数、求平均, line: 9 } }
            - { id: r5, cells: { rule: ⑤ 写进文件, line: 10 } }
        - id: merged_rows
          type: text
          format: integer
          prompt: "`merged` 有几行？"
          key: 5
        - id: passed_rows
          type: text
          format: integer
          prompt: "`passed` 有几行？"
          key: 3
      explanation: |
        | 规则 | 行 | 拿到 → 交出 |
        |---|---:|---|
        | ① 只用第一次测量 | 6 | samples 6 行 → first 5 行（002 留第一次的 9） |
        | ② 补上采样点 | 7 | first 和 sites → merged 5 行，多了 site 列 |
        | ③ 至少 10 算达标 | 8 | merged → passed 3 行（001、003、004） |
        | ④ 按 site 计数、求平均 | 9 | passed → summary，北坡、南坡各一行 |
        | ⑤ 写进文件 | 10 | summary → site_summary.csv |

        第 3、4 行是读入，需求里没单独写，但它们决定了 sample_id 按文字读（保留前导零）。`how="left"` 保留 first 的每一行，sites 里每个样本只登记了一次，所以 merged 仍是 **5** 行。003 的 signal 恰好是 10，`>=` 把它留下，passed 是 **3** 行。
      verify: |
        r = run()
        lines = CODE.splitlines()
        def find(token):
            hits = [i for i, line in enumerate(lines, 1) if token in line]
            return hits[0] if len(hits) == 1 else hits
        tokens = {"r1": "drop_duplicates", "r2": ".merge(", "r3": ">=", "r4": "groupby", "r5": "to_csv"}
        answers = {
            "rules": {row: {"line": find(token)} for row, token in tokens.items()},
            "merged_rows": len(r["merged"]),
            "passed_rows": len(r["passed"]),
        }
    practice:
      - id: py48.k1.q1
        kind: [explain, trace]
        uses: [py25.k2, py29.k1]
        data: [SA, ST]
        body: |
          只看脚本里去重和合并这两行：

          ```python startLine=1
          first = samples.drop_duplicates(subset=["sample_id"])
          merged = first.merge(sites, on="sample_id", how="left")
          ```
        slots:
          - id: inputs
            type: choice
            multiple: true
            scoring: options
            prompt: 第 2 行拿到哪几张表？选出全部。
            options:
              - { id: samples, content: "`samples`" }
              - { id: first, content: "`first`" }
              - { id: sites, content: "`sites`" }
              - { id: merged, content: "`merged`" }
            key: [first, sites]
          - id: keeps
            type: choice
            prompt: 第 2 行保留谁的行？
            options:
              - id: inner
                content: 只留 first 和 sites 里都有的编号
                feedback: 那是 how="inner"。
              - id: right
                content: sites 的每一行都留下
              - id: left
                content: first 的每一行都留下；在 sites 里找不到的，site 为缺失
            key: left
          - id: columns
            type: order
            partial: true
            prompt: "`merged` 有哪些列？按顺序排列。"
            items:
              - { id: sample_id, content: "`sample_id`" }
              - { id: signal, content: "`signal`" }
              - { id: site, content: "`site`" }
              - { id: merge_flag, content: "`_merge`" }
            key: [sample_id, signal, site]
          - id: rows
            type: text
            format: integer
            prompt: "`merged` 有几行？"
            key: 5
        explanation: |
          第 2 行拿到 **first** 和 **sites** 两张表（不是原来的 samples），按 sample_id 配对。`how="left"` 保留 first 的每一行，找不到采样点的样本 site 为缺失。交出的表列是 **sample_id、signal、site**：左表的列在前，补上的列在后；没写 `indicator=True`，所以没有 `_merge` 列。first 有 5 行，每个编号在 sites 里只有一行，merged 也是 **5** 行。
        verify: |
          import ast
          r = run()
          call = ast.parse(CODE.splitlines()[1]).body[0].value
          names = {node.id for node in ast.walk(call) if isinstance(node, ast.Name)}
          # 去掉 sites 的第一行再运行：first 的行都还在，就是保留左表的每一行。
          fewer = run(sites=sites.iloc[1:])
          answers = {
              "inputs": [name for name in ["samples", "first", "sites", "merged"] if name in names],
              "keeps": "left" if len(fewer["merged"]) == len(fewer["first"]) else "inner",
              "columns": list(r["merged"].columns),
              "rows": len(r["merged"]),
          }
      - id: py48.k1.q2
        kind: [explain, debug]
        uses: [py25.k2, py29.k1, py17.k2, py28.k1]
        data: [SA, ST]
        body: |
          这次的需求是：

          > ① 同一个样本测了两次时，用最后一次（复测）的结果；② 按 sites 给每个样本补上 site，样本一个不少；③ signal 至少为 10 的算达标；④ 按 site 数出达标样本数 n。

          AI 给的脚本：

          ```python startLine=1
          first = samples.drop_duplicates(subset=["sample_id"])
          merged = first.merge(sites, on="sample_id", how="left")
          passed = merged.loc[merged["signal"] >= 10]
          summary = passed.groupby("site").agg(n=("sample_id", "count"))
          ```
        slots:
          - id: rules
            type: table
            prompt: 第 n 行对应规则 n。这一行完全做到了这条规则吗？
            columns:
              - { id: rule, header: 规则 }
              - { id: done, header: 做到了吗, input: bool }
            rows:
              - { id: r1, cells: { rule: ① 用最后一次测量（第 1 行）, done: false } }
              - { id: r2, cells: { rule: ② 补上 site，样本一个不少（第 2 行）, done: true } }
              - { id: r3, cells: { rule: ③ 至少 10 算达标（第 3 行）, done: true } }
              - { id: r4, cells: { rule: ④ 按 site 计数（第 4 行）, done: true } }
          - id: south
            type: text
            format: integer
            prompt: 脚本算出的南坡 n 是多少？
            key: 1
          - id: south_need
            type: text
            format: integer
            prompt: 按需求，南坡的 n 应当是多少？
            key: 2
        explanation: |
          第 1 行只做了一半：`drop_duplicates(subset=["sample_id"])` 默认 `keep="first"`，002 留下的是第一次的 9，而需求要复测的 11。其余三行都按各自的规则做了。

          这一处让结果不同：脚本里 002 的 9 不达标，南坡只有 004，n 为 **1**；按需求 002 用 11，达标，南坡 n 应为 **2**。第 1 行要加上 `keep="last"`。
        verify: |
          r = run()
