  - id: py37.k3
    keyPrerequisites: [py06]
    title: in 检查键是否存在
    card:
      name: in 查键
      aliases: [in, 键是否存在]
      definition: "`键 in d` 得到 True 或 False，表示字典 d 里有没有这个键；它只看键，不看值。"
      conditions:
        - 值里有 8 时，`8 in d` 仍可能是 False；要查值，写 `8 in d.values()`。
        - 键要完全一样才算有：大小写、拼写不同就是 False。
      example:
        from: py37.k3.e0
        text: |
          ```python
          record = {"sample_id": "S_B", "signal": 10, "group": "drug"}
          print("signal" in record)
          print(10 in record)
          ```
          第一行显示 True；10 只是 signal 的值，不是键，第二行显示 False。
    lesson: |
      想知道一条记录里有没有某一项，写 `键 in 字典`，结果是 True 或 False：

      ```python
      record = {"sample_id": "S_B", "signal": 10, "group": "drug"}
      print("signal" in record)   # True
      print("depth" in record)    # False
      ```

      `in` 对字典**只查键**。10 和 "drug" 都是这条记录里的值，但 `10 in record`、`"drug" in record` 都是 False，因为没有叫 10 或 drug 的键。真要查值，写 `10 in record.values()`。

      对比一下：对列表，`in` 查的是元素，`8 in [8, 10]` 是 True；对字典，`in` 查的是键。

      `in` 只是查，不取值，也不会报错。键要一字不差：`"Signal" in record` 是 False。
    example:
      id: py37.k3.e0
      kind: [predict]
      body: |
        ```python
        record = {"sample_id": "S_B", "signal": 10, "group": "drug"}
        ```

        表里每个表达式都在这行之后求值。填写结果是 True 还是 False。
      slots:
        - id: result
          type: table
          columns:
            - id: expr
              header: 表达式
            - id: value
              header: 结果
              input: bool
          rows:
            - id: a
              cells: { expr: '"signal" in record', value: true }
            - id: b
              cells: { expr: '"depth" in record', value: false }
            - id: c
              cells: { expr: "10 in record", value: false }
            - id: d
              cells: { expr: '"drug" in record', value: false }
      explanation: |
        依次为 **True、False、False、False**。

        signal 是键，所以 True；depth 不是键，False。10 和 drug 虽然都出现在这条记录里，但它们是值，不是键，`in` 对字典只查键，所以也是 False。
      verify: |
        r = run()
        record = r["record"]
        answers = {"result": {
            "a": {"value": "signal" in record},
            "b": {"value": "depth" in record},
            "c": {"value": 10 in record},
