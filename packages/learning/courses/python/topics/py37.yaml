id: py37
title: 用字典描述一条记录
status: complete
minutes: 20
summary: 用字典把“列名 → 值”写成一条记录：按键取值而不是按位置，缺键时用 get 给默认值，用 in 查键是否存在。
prerequisites: [py06, py03]
encompassings:
  - {topic: py06, weight: 0.5}
  - {topic: py03, weight: 0.5}
sources:
  - source: think-python
    where: 第 10 章（字典）
    url: https://allendowney.github.io/ThinkPython/chap10.html
    use: reference
  - source: python-docs
    where: 教程第 5 章 §5.5
    url: https://docs.python.org/3.12/tutorial/datastructures.html
    use: reference
notes: |
  范围：纯 Python，不用 pandas。只用字典字面量、按键取值与赋值、len、get、in 和 print；不讲 if（py10 不是本节先修）、循环遍历字典、keys/items 和嵌套字典（py44 再用）。`.values()` 只在 k3 作为“要查值时这样写”顺带出现。报错只问类型（KeyError、NameError），不问整段信息。
  题型：预测输出（P）、找错（P）、解释代码（S，用代码选项由程序核对）、追踪表（P）。全部作答位由 verify 程序核对，没有 manual。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 2 分钟、练习 3 分钟；收束 2 分钟。
  取材：Think Python 第 10 章与 Python 教程 §5.5 只作字典语义的参照；记录、样本数据和题目为本课自拟，沿用 py12、py17 的 sample_id、signal、group、site、depth。
intro: |
  表里的一行，比如样本 S_A 的 signal 是 8、group 是 control，可以写成 Python 的**字典**：每一项是“名字 → 值”，名字叫**键**。AI 写的代码里，配置、一条记录、按编号查值，常常都是字典。

  这一节的程序都当作短脚本，从上往下运行。每道题都从题面给出的代码重新开始。
wrapup: |
  读到字典时，记住三件事：方括号里写的是键，不是位置；没把握有没有这个键时，`get` 给出默认值而不会报错，默认值要按需求选；`in` 只查键，不查值。

  看到 `record["signal"]`，可以读成“这条记录的 signal”；看到 `record.get("depth", 0)`，要问一句：缺了 depth 时当成 0，符合需求吗？
kps:
  - id: py37.k1
    keyPrerequisites: [py06]
    title: 键和值与位置索引的区别
    card:
      name: 字典
      aliases: [dict, 键, 值]
      definition: 字典把键对应到值，`d[键]` 按键取出对应的值；它不按位置编号，同一个键只对应一个值。
      conditions:
        - "`d[0]` 找的是键 0，不是“第一项”；没有这个键就报 KeyError。"
        - 给已有的键赋值是覆盖旧值，给新键赋值是添一项；len 数的是键的个数。
      example:
        from: py37.k1.e0
        text: |
          ```python
          record = {"sample_id": "S_A", "signal": 8, "group": "control"}
          print(record["group"])
          ```
          按键 group 取值，显示 control；`len(record)` 是 3，因为有三个键。
    lesson: |
      表里的一行可以写成字典：

      ```python
      record = {"sample_id": "S_A", "signal": 8, "group": "control"}
      ```

      花括号里每一项写成 `键: 值`，项与项之间用逗号隔开。这里的键是 `"sample_id"`、`"signal"`、`"group"`，就像表的列名；值是这一行在各列的内容。

      取值时在方括号里写**键**：`record["signal"]` 得到 8。这和列表不一样：列表用 0、1、-1 这样的[位置](repa:concept/py06.k2)取元素，字典不按位置编号。`record[0]` 的意思是“找键 0”，这条记录里没有键 0，程序就在这一行报 KeyError 停下。

      同一个键在字典里只有一个值：

      - `record["signal"] = 12` 给已有的键赋值，旧值 8 被换成 12，键的个数不变；
      - `record["depth"] = 30` 给新键赋值，字典多出一项；
      - `len(record)` 数的是键的个数。
    example:
      id: py37.k1.e0
      kind: [predict]
      body: |
        样本 S_A 的一条记录写成了字典。阅读程序。

        ```python
        record = {"sample_id": "S_A", "signal": 8, "group": "control"}
        print(record["group"])
        print(record["signal"] + 2)
        print(len(record))
        ```
      slots:
        - id: first
          type: text
          prompt: 第一行显示
          key: control
        - id: second
          type: text
          format: integer
          prompt: 第二行显示
          key: 10
        - id: third
          type: text
          format: integer
          prompt: 第三行显示
          key: 3
      explanation: |
        依次显示 **control**、**10**、**3**。

        `record["group"]` 按键 group 取出值 control；`record["signal"]` 取出 8，再加 2 得到 10；`len(record)` 数的是键的个数，这条记录有 sample_id、signal、group 三个键。print 显示文字时不带引号。
      verify: |
        lines = run().lines()
        answers = {"first": str(lines[0]), "second": int(lines[1]), "third": int(lines[2])}
    practice:
      - id: py37.k1.q1
        kind: [predict]
        body: |
          ```python
          record = {"site": "南坡", "depth": 25, "slope": 8}
          print(record["depth"])
          print(record["site"])
          print(record["depth"] - record["slope"])
          ```
        slots:
          - id: first
            type: text
            format: integer
            prompt: 第一行显示
            key: 25
          - id: second
            type: text
            prompt: 第二行显示
            key: 南坡
          - id: third
            type: text
            format: integer
            prompt: 第三行显示
            key: 17
        explanation: |
          依次显示 **25**、**南坡**、**17**。每次都按方括号里的键找到对应的值；第三行取出 25 和 8 再相减。字典写下各项的先后与取值无关，取值只看键。
        verify: |
          lines = run().lines()
          answers = {"first": int(lines[0]), "second": str(lines[1]), "third": int(lines[2])}
      - id: py37.k1.q2
        kind: [debug]
        body: |
          同事想显示这条记录的第一项，写了下面的程序，以为第 2 行会像列表那样取出第一个值。

          ```python startLine=1
          record = {"sample_id": "S_A", "signal": 8, "group": "control"}
          print(record[0])
          ```
        slots:
          - id: what
            type: choice
            prompt: 运行第 2 行会怎样？
            options:
              - id: first_value
                content: 显示 S_A
                feedback: 字典不按位置取值，方括号里的 0 被当成键。
              - id: keyerror
                content: 报 KeyError 停下：字典里没有 0 这个键
              - id: first_key
                content: 显示 sample_id
            key: keyerror
          - id: fix
            type: choice
            prompt: 第 2 行改成哪一行，才会显示 S_A？
            options:
              - id: one
                content: |
                  ```python
                  print(record[1])
                  ```
              - id: value
                content: |
                  ```python
                  print(record["S_A"])
                  ```
              - id: key
                content: |
                  ```python
                  print(record["sample_id"])
                  ```
            key: key
        explanation: |
          第 2 行**报 KeyError**。字典的方括号里写的是键，`record[0]` 是在找键 0；这条记录的键是 sample_id、signal、group，没有 0，所以报错停下。

          要取 S_A，写它的键：`print(record["sample_id"])`。`record[1]` 同样是在找键 1；`record["S_A"]` 把值当成了键，也会报 KeyError。
        verify: |
          r = run()
          shown = r.out.strip()
          what = "keyerror" if r.error == "KeyError" else {"S_A": "first_value", "sample_id": "first_key"}.get(shown, "other")
          prelude = BLOCKS[0].splitlines()[0] + "\n"
          fits = []
          for option, line in OPTIONS["fix"].items():
              result = run(prelude + line)
              if result.error is None and result.out.strip() == "S_A":
                  fits.append(option)
          answers = {"what": what, "fix": fits[0] if len(fits) == 1 else fits}
      - id: py37.k1.q3
        kind: [trace, predict]
        body: |
          ```python startLine=1
          record = {"sample_id": "S_B", "signal": 10}
          record["signal"] = 12
          record["group"] = "drug"
          print(len(record))
          print(record["signal"])
          ```
        slots:
          - id: second_line
            type: choice
            prompt: 第 2 行做了什么？
            options:
              - id: added
                content: 又加了一个叫 signal 的键，字典里现在有两个 signal
                feedback: 同一个键在字典里只有一个值，给已有的键赋值是覆盖。
              - id: replaced
                content: 把键 signal 的值从 10 换成 12，键的个数不变
            key: replaced
          - id: count
            type: text
            format: integer
            prompt: 第 4 行显示
            key: 3
          - id: value
            type: text
            format: integer
            prompt: 第 5 行显示
            key: 12
        explanation: |
          第 2 行给已有的键 signal 赋值，旧值 10 被**换成 12**，字典仍是两项；第 3 行给新键 group 赋值，字典多出一项。所以 `len(record)` 显示 **3**，`record["signal"]` 显示 **12**。
        verify: |
          states = trace(names=["record"])
          before, after = states[0]["record"], states[1]["record"]
          lines = run().lines()
          answers = {
              "second_line": "replaced" if len(after) == len(before) and after["signal"] != before["signal"] else "added",
              "count": int(lines[0]),
              "value": int(lines[1]),
          }
    review:
      - id: py37.k1.r1
        kind: [predict]
        body: |
          一个采样点的信息写成了字典：

          ```python
          site = {"site": "北坡", "depth": 30, "slope": 12}
          ```

          表里每一行代码都单独接在上面这行后面运行。填写 print 显示的内容；会报错的填 ERROR。
        slots:
          - id: shown
            type: table
            columns:
              - id: code
                header: 接着运行
              - id: out
                header: 显示
                input: { type: text, match: output, quick: [ERROR] }
            rows:
              - id: a
                cells: { code: 'print(site["depth"])', out: "30" }
              - id: b
                cells: { code: "print(site[0])", out: ERROR }
              - id: c
                cells: { code: "print(len(site))", out: "3" }
              - id: d
                cells: { code: 'print(site["site"])', out: 北坡 }
              - id: e
                cells: { code: "print(site[-1])", out: ERROR }
        explanation: |
          | 接着运行 | 显示 |
          |---|---|
          | `print(site["depth"])` | 30 |
          | `print(site[0])` | ERROR |
          | `print(len(site))` | 3 |
          | `print(site["site"])` | 北坡 |
          | `print(site[-1])` | ERROR |

          按键取值才行：`site["depth"]` 是 30，`site["site"]` 是 北坡。`site[0]` 和 `site[-1]` 是在找键 0 和键 -1，字典里没有这两个键，都报 KeyError；列表的“第一个”“最后一个”在字典里不成立。`len` 数的是三个键。
        verify: |
          lines = {
              "a": 'print(site["depth"])',
              "b": "print(site[0])",
              "c": "print(len(site))",
              "d": 'print(site["site"])',
              "e": "print(site[-1])",
          }
          # repl 逐条运行：print 那一条的显示内容，报错时为 ERROR。
          answers = {"shown": {row: {"out": repl(BLOCKS[0] + "\n" + line)[-1]} for row, line in lines.items()}}
      - id: py37.k1.r2
        kind: [predict]
        body: |
          这次字典的键是样本编号，值是每个样本的读数。

          ```python
          reading = {"S_A": 8, "S_B": 10}
          reading["S_A"] = 9
          reading["S_C"] = 7
          reading["S_A"] = reading["S_A"] + 1
          print(reading)
          print(len(reading))
          ```
        slots:
          - id: whole
            type: text
            match: output
            prompt: 第一行 print 显示的字典（照 Python 的写法填）
            key: "{'S_A': 10, 'S_B': 10, 'S_C': 7}"
          - id: count
            type: text
            format: integer
            prompt: 第二行显示
            key: 3
        explanation: |
          显示 **{'S_A': 10, 'S_B': 10, 'S_C': 7}** 和 **3**。

          S_A 先被覆盖成 9，最后一行赋值又用当时的 9 加 1 得到 10，自始至终只有一个键 S_A；S_C 是新键，添在后面。三个键，所以长度是 3。字典显示时按各键第一次加入的先后排列。
        verify: |
          lines = run().lines()
          answers = {"whole": lines[0], "count": int(lines[1])}
    quiz:
      - id: py37.k1.x1
        kind: [explain]
        body: |
          前一行是：

          ```python
          record = {"site": "南坡", "depth": 25}
          ```

          哪一行会显示 25？
        slots:
          - id: line
            type: choice
            options:
              - id: position
                content: |
                  ```python
                  print(record[1])
                  ```
              - id: last
                content: |
                  ```python
                  print(record[-1])
                  ```
              - id: key
                content: |
                  ```python
                  print(record["depth"])
                  ```
              - id: bare
                content: |
                  ```python
                  print(record[depth])
                  ```
            key: key
        explanation: |
          `print(record["depth"])` 显示 25：方括号里写键 `"depth"`。

          `record[1]` 和 `record[-1]` 把字典当成了列表，找的是键 1 和键 -1，都报 KeyError；`record[depth]` 少了引号，Python 把 depth 当成一个名字去找，这个名字没有赋过值，报 NameError。
        verify: |
          fits = []
          for option, line in OPTIONS["line"].items():
              result = run(BLOCKS[0] + "\n" + line)
              if result.error is None and result.out.strip() == "25":
                  fits.append(option)
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py37.k1.x2
        kind: [trace]
        body: |
          按运行顺序填写每行执行后 `len(row)` 和 `row` 里 signal 的值。还没有 signal 这个键时填“没有这个键”。

          ```python startLine=1
          row = {"sample_id": "S_D"}
          row["signal"] = 10
          row["signal"] = 13
          row["group"] = "control"
          ```
        slots:
          - id: trace
            type: table
            columns:
              - id: line
                header: 执行到
              - id: size
                header: len(row)
                input: integer
              - id: signal
                header: signal 的值
                input: { type: text, format: integer, quick: [没有这个键] }
            rows:
              - id: l1
                cells: { line: 第 1 行, size: 1, signal: 没有这个键 }
              - id: l2
                cells: { line: 第 2 行, size: 2, signal: 10 }
              - id: l3
                cells: { line: 第 3 行, size: 2, signal: 13 }
              - id: l4
                cells: { line: 第 4 行, size: 3, signal: 13 }
        explanation: |
          | 执行到 | len(row) | signal 的值 |
          |---|---:|---:|
          | 第 1 行 | 1 | 没有这个键 |
          | 第 2 行 | 2 | 10 |
          | 第 3 行 | 2 | 13 |
          | 第 4 行 | 3 | 13 |

          第 2 行给新键 signal 赋值，多出一项；第 3 行给已有的 signal 赋值，只是把 10 换成 13，长度不变；第 4 行又添了新键 group。
        verify: |
          states = trace(names=["row"])
          answers = {"trace": {
              f"l{i}": {"size": len(state["row"]), "signal": state["row"].get("signal", "没有这个键")}
              for i, state in enumerate(states, 1)
          }}

  - id: py37.k2
    keyPrerequisites: [py03]
    title: 索引取值与 get 默认值
    card:
      name: get 默认值
      aliases: [get, KeyError, 默认值]
      definition: "`d.get(键, 默认值)` 有这个键时取出它的值，没有时得到默认值（不写默认值就是 None），不报错，也不往字典里加键。"
      conditions:
        - "`d[键]` 遇到没有的键会报 KeyError 停下；get 不会。"
        - 默认值只在键不存在时才用；默认值要按需求选，缺失的测量写成 0 会被当成真的测到 0。
      example:
        from: py37.k2.e0
        text: |
          ```python
          record = {"sample_id": "S_A", "signal": 8}
          print(record.get("depth"))
          print(record.get("depth", 0))
          ```
          没有 depth 这个键：第一行显示 None，第二行显示 0；record 仍只有两个键。
    lesson: |
      用方括号取一个不存在的键，程序会报 **KeyError**，停在这一行，后面的代码都不再运行：

      ```python
      record = {"sample_id": "S_A", "signal": 8}
      print(record["depth"])   # KeyError，程序停下
      ```

      有的记录可能缺某一项时，用字典自带的 `get`：

      - `record.get("depth")`：有 depth 就取出它的值；没有就得到 [None](repa:concept/py03.k3)，不报错。
      - `record.get("depth", 0)`：没有 depth 时得到你给的默认值 0。

      两点要留意：

      1. 默认值只在**键不存在**时才用。键存在、值恰好是 None 时，get 照样取出 None。
      2. get 只是查，不会把键加进字典，`len(record)` 不变。

      默认值不是随手填的。缺了 depth 表示没测，写成 `get("depth", 0)` 就把“没测”当成了“测到 0”；需求里要说清缺失时怎样处理。
    example:
      id: py37.k2.e0
      kind: [predict]
      body: |
        ```python
        record = {"sample_id": "S_A", "signal": 8}
        print(record.get("signal"))
        print(record.get("depth"))
        print(record.get("depth", 0))
        print(len(record))
        ```
      slots:
        - id: line1
          type: text
          match: output
          prompt: 第一行显示
          key: "8"
        - id: line2
          type: text
          match: output
          prompt: 第二行显示
          key: None
        - id: line3
          type: text
          match: output
          prompt: 第三行显示
          key: "0"
        - id: line4
          type: text
          match: output
          prompt: 第四行显示
          key: "2"
      explanation: |
        依次显示 **8**、**None**、**0**、**2**。

        signal 这个键存在，get 取出 8；depth 不存在，不写默认值时得到 None，写了默认值 0 就得到 0。两次 get 都没有往字典里加 depth，所以长度仍是 2。
      verify: |
        lines = run().lines()
        answers = {"line1": lines[0], "line2": lines[1], "line3": lines[2], "line4": lines[3]}
    practice:
      - id: py37.k2.q1
        kind: [predict]
        body: |
          ```python
          record = {"sample_id": "S_C", "group": "drug"}
          print(record.get("group", "unknown"))
          print(record.get("signal", "unknown"))
          print(record.get("site"))
          ```
        slots:
          - id: line1
            type: text
            match: output
            prompt: 第一行显示
            key: drug
            feedback:
              - when: unknown
                message: group 这个键存在，get 取出它的值；默认值只在键不存在时才用。
          - id: line2
            type: text
            match: output
            prompt: 第二行显示
            key: unknown
          - id: line3
            type: text
            match: output
            prompt: 第三行显示
            key: None
        explanation: |
          依次显示 **drug**、**unknown**、**None**。group 存在，取出 drug，写了默认值也不用；signal 不存在，得到默认值 unknown；site 不存在、也没写默认值，得到 None。
        verify: |
          lines = run().lines()
          answers = {"line1": lines[0], "line2": lines[1], "line3": lines[2]}
      - id: py37.k2.q2
        kind: [debug]
        body: |
          ```python startLine=1
          record = {"sample_id": "S_A", "signal": 8}
          print(record["depth"])
          print("done")
          ```
        slots:
          - id: what
            type: choice
            prompt: 运行后屏幕上会出现什么？
            options:
              - id: none_done
                content: 先显示 None，再显示 done
                feedback: 方括号取不存在的键不会得到 None，而是报错。
              - id: error
                content: 第 2 行报 KeyError，done 不会显示
              - id: done_only
                content: 跳过第 2 行，只显示 done
            key: error
          - id: fix
            type: choice
            prompt: 第 2 行改成哪一行，程序就能显示 None 和 done？
            options:
              - id: get
                content: |
                  ```python
                  print(record.get("depth"))
                  ```
              - id: get_zero
                content: |
                  ```python
                  print(record.get("depth", 0))
                  ```
              - id: brackets
                content: |
                  ```python
                  print(record.get["depth"])
                  ```
            key: get
        explanation: |
