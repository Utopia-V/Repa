  - id: py41.k3
    keyPrerequisites: [py40, py03]
    title: Python 不自动返回最后一个表达式
    card:
      name: 没有 return 得到 None
      aliases: [None, 缺少 return]
      definition: Python 函数只交回 return 后面的值；运行到函数体末尾都没遇到 return，就交回 None，最后一行算出的值不会自动交回。
      conditions:
        - 错误常在后面才露面：拿 None 去计算会报 TypeError。
        - 有分支时逐条路径检查，每条路径都要有 return。
      example:
        from: py41.k3.e0
        text: |
          ```python
          def net(raw, blank):
              raw - blank

          value = net(10, 3)
          ```
          raw - blank 算出了 7，但没有 return，value 是 None。
    lesson: |
      有些工具会把函数最后一行算出的值当作结果交回；Python 不会。Python 的函数只交回 `return` 后面的值；运行到函数体末尾都没有遇到 `return`，就交回 **None**。

      ```python
      def net(raw, blank):
          raw - blank
      ```

      `raw - blank` 算出来了，可是没有交给任何人，算完就丢掉。`value = net(10, 3)` 让 value 指向 None。

      这类错误常常不在函数里露面，而是在后面：`value + 1` 报 TypeError，因为 None 不能做加法。看到报错信息里提到 NoneType，就回头找给这个名字赋值的那次调用，看函数有没有 return。

      函数里有分支时，要逐条路径检查：if/elif/else 里只要有一条路径没有 return，走到那条路径时就交回 None。只写 `print(...)` 也一样，显示出来不等于交回。
    example:
      id: py41.k3.e0
      kind: [predict, debug]
      body: |
        ```python startLine=1
        def net(raw, blank):
            raw - blank

        value = net(10, 3)
        print(value)
        ```
