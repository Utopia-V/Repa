id: py41
title: 函数的默认值和作用范围
status: complete
minutes: 20
summary: 读懂默认参数在省略时怎样补上；分清函数里的局部名字和外面的同名名字；记住没有 return 的函数交回 None。
prerequisites: [py40, py03]
encompassings:
  - {topic: py40, weight: 0.5}
  - {topic: py03, weight: 0.5}
sources:
  - source: think-python
    where: 第 3 章
    url: https://allendowney.github.io/ThinkPython/chap03.html
    use: reference
  - source: think-python
    where: 第 6 章
    url: https://allendowney.github.io/ThinkPython/chap06.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.9.1
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
  - source: python-docs
    where: 教程第 9 章 §9.2
    url: https://docs.python.org/3.12/tutorial/classes.html
    use: reference
notes: |
  范围：接着 py40 的 net_signal、label，只用数、简单字符串、比较和 if/elif/else，不用列表、循环和 pandas。默认值只讲不可变的数和字符串，不讲可变默认值的陷阱；作用范围只讲“函数里赋值的名字是局部的”和“没赋值的名字到外面找”，不讲 global、nonlocal 和嵌套函数。UnboundLocalError 只在一道找错题里出现，只问类型，改法是把值传进去、用 return 交回来。
  py41.k3 是 py40.k2 里“只 print 不 return 得到 None”的展开：缺 return 的路径、None 在后面才引起 TypeError。
  节奏（待试做校准）：开场 1 分钟；三个知识点各约 6 分钟（讲解与例题 2 分钟、练习 4 分钟）；收束 1 分钟。
  讲解、例子和题目为本课自拟。所有答案都由 verify 或测试用程序算出：形参实际接收的值用 sys.settrace 在调用时读出，改法选项逐个拼成程序运行；没有 manual 作答位。
intro: |
  上一节读了自己定义的函数。这一节看三处容易读错的地方：调用时少写了一个实参，函数用的是哪个值；函数里和外面有同名的名字，改的是谁；函数最后一行算出了值，却没有 return，调用处拿到什么。
wrapup: |
  读一次调用时，可以连着问三句：没写的实参用了哪个默认值？函数里赋值的名字是不是只在函数里？每条路径最后有没有 return？

  这三句也适合拿来问 AI：“这个参数省略时默认是多少？这个函数会不会改到外面的变量？哪条路径会交回 None？”
kps:
  - id: py41.k1
    keyPrerequisites: [py40, py04]
    title: 默认参数用于省略输入
    card:
      name: 默认参数
      aliases: [默认值, 省略参数]
      definition: 定义时写成“形参=值”，调用时省略这个实参就用默认值；给了实参（按位置或按名字），就用给的值。
      conditions:
        - 位置实参从左往右依次给形参：label(15) 里的 15 给的是 signal，不是 limit。
        - 带默认值的形参写在不带默认值的后面；不带默认值的形参调用时必须给。
      example:
        from: py41.k1.e0
        text: |
          ```python
          def label(signal, limit=10):
              if signal >= limit:
                  return "达标"
              return "未达标"
          ```
          label(10) 省略 limit，用默认值 10，交回“达标”；label(10, 12) 里 limit 是 12，交回“未达标”。
    lesson: |
      `label(signal, limit)` 每次都要写两个实参。如果大多数分析都用同一个阈值 10，可以在定义时给 limit 一个**默认值**：

      ```python
      def label(signal, limit=10):
          if signal >= limit:
              return "达标"
          return "未达标"
      ```

      调用时：

      - `label(12)`：只给了一个实参，它按位置交给 signal；limit 没有给，就用默认值 10。
      - `label(12, 15)`：第二个实参按位置交给 limit，默认值不用。
      - `label(12, limit=15)`：按名字给 limit，同样不用默认值。

      默认值只在省略时才用。没有默认值的形参必须给：`label()` 没给 signal，会报 TypeError。定义时，带默认值的形参要写在不带默认值的后面。

      读别人的调用时，先数实参：位置实参从左往右依次给形参，按名字给的对号入座，剩下没给的形参才用默认值。最容易读错的是只写一个数的调用：`label(15)` 里的 15 给的是 signal，阈值仍是默认的 10。
    example:
      id: py41.k1.e0
      kind: [trace, predict]
      body: |
        ```python startLine=1
        def label(signal, limit=10):
            if signal >= limit:
                return "达标"
            return "未达标"

        print(label(10))
        print(label(10, 12))
        print(label(signal=13, limit=12))
        ```
      slots:
        - id: calls
          type: table
          prompt: 填写每次调用时 limit 的值，以及显示的结果。
          columns:
            - { id: call, header: 调用 }
            - { id: limit, header: limit, input: integer }
            - id: result
              header: 显示
              input: { type: choice, options: [{ id: pass, label: 达标 }, { id: fail, label: 未达标 }] }
          rows:
            - { id: c6, cells: { call: 第 6 行, limit: 10, result: pass } }
            - { id: c7, cells: { call: 第 7 行, limit: 12, result: fail } }
            - { id: c8, cells: { call: 第 8 行, limit: 12, result: pass } }
      explanation: |
        | 调用 | signal | limit | 显示 |
        |---|---:|---:|---|
        | 第 6 行 | 10 | 10（默认值） | 达标 |
        | 第 7 行 | 10 | 12 | 未达标 |
        | 第 8 行 | 13 | 12 | 达标 |

        第 6 行只给了一个实参，limit 用默认值 10，10 >= 10 成立。第 7 行按位置给了 limit，默认值不用。第 8 行按名字给了两个形参，13 >= 12 成立。
      verify: |
        import sys
        seen = []
        def watch(frame, event, arg):
            if event == "call" and frame.f_code.co_name == "label":
                seen.append(dict(frame.f_locals))
        sys.settrace(watch)
        try:
            r = run()
        finally:
            sys.settrace(None)
        ids = {"达标": "pass", "未达标": "fail"}
        answers = {"calls": {f"c{row}": {"limit": call["limit"], "result": ids[line]}
                             for row, call, line in zip((6, 7, 8), seen, r.lines())}}
    practice:
      - id: py41.k1.q1
        kind: [predict]
        body: |
          `to_mm` 把长度换算成毫米，unit 省略时按厘米算。

          ```python
          def to_mm(value, unit="cm"):
              if unit == "cm":
                  return value * 10
              elif unit == "m":
                  return value * 1000
              return value
          ```
        slots:
          - id: results
            type: table
            prompt: 填写每次调用交回的数。
            columns:
              - { id: call, header: 调用 }
              - { id: result, header: 交回, input: integer }
            rows:
              - { id: c1, cells: { call: to_mm(3), result: 30 } }
              - { id: c2, cells: { call: 'to_mm(3, "m")', result: 3000 } }
              - { id: c3, cells: { call: 'to_mm(unit="mm", value=3)', result: 3 } }
              - { id: c4, cells: { call: 'to_mm(2, unit="cm")', result: 20 } }
        explanation: |
          依次是 **30、3000、3、20**。`to_mm(3)` 省略 unit，按默认的 "cm" 乘 10；`to_mm(3, "m")` 按位置给了 "m"；`to_mm(unit="mm", value=3)` 两个都按名字给，"mm" 不是 "cm" 也不是 "m"，走到最后原样交回 3；`to_mm(2, unit="cm")` 明写了默认值，结果和省略一样。
        verify: |
          r = run(CODE + '\nresults = [to_mm(3), to_mm(3, "m"), to_mm(unit="mm", value=3), to_mm(2, unit="cm")]')
          answers = {"results": {f"c{i}": {"result": value} for i, value in enumerate(r["results"], 1)}}
      - id: py41.k1.q2
        kind: [debug]
        body: |
          ```python
          def label(signal, limit=10):
              if signal >= limit:
                  return "达标"
              return "未达标"
          ```

          同事想用阈值 15 判断 signal 为 12 的样本，写成了 `label(15)`。
        slots:
          - id: result
            type: choice
            prompt: "`label(15)` 交回什么？"
            options:
              - { id: pass, content: 达标 }
              - { id: fail, content: 未达标 }
            key: pass
          - id: calls
            type: choice
            multiple: true
            prompt: 下面哪些写法才是“用阈值 15 判断 signal 为 12”？选出所有正确的。
            options:
              - { id: positional, content: "`label(12, 15)`" }
              - { id: swapped, content: "`label(15, 12)`" }
              - { id: limit_only, content: "`label(limit=15)`" }
              - { id: keyword, content: "`label(12, limit=15)`" }
            key: [positional, keyword]
        explanation: |
          `label(15)` 交回 **达标**：15 按位置给了 signal，limit 仍用默认值 10，15 >= 10。

          正确的写法是 **`label(12, 15)`** 和 **`label(12, limit=15)`**。`label(15, 12)` 把两个数给反了；`label(limit=15)` 没给 signal，会报 TypeError。
        verify: |
          import sys
          r = run(CODE + "\nresult = label(15)")
          calls = {"positional": "label(12, 15)", "swapped": "label(15, 12)", "limit_only": "label(limit=15)", "keyword": "label(12, limit=15)"}
          right = []
          for option, call in calls.items():
              seen = []
              def watch(frame, event, arg):
                  if event == "call" and frame.f_code.co_name == "label":
                      seen.append(dict(frame.f_locals))
              sys.settrace(watch)
              try:
                  outcome = run(CODE + "\n" + call)
              finally:
                  sys.settrace(None)
              if outcome.error is None and seen == [{"signal": 12, "limit": 15}]:
                  right.append(option)
          answers = {"result": "pass" if r["result"] == "达标" else "fail", "calls": right}
      - id: py41.k1.q3
        kind: [modify]
        body: |
          需求：大多数样本的本底是 0。希望调用 `net_signal` 时可以省略 blank，省略就按 0 算；给了 blank 就照常减去。

          作答框里是现在的函数，省略 blank 会报 TypeError。请改动它并提交。

          ```python
          >>> net_signal(12, 3)
          9
          >>> net_signal(12)
          12
          ```
        slots:
          - id: code
            type: code
            language: python
            maxLines: 5
            starter: |
              def net_signal(raw, blank):
                  return raw - blank
            solution: |
              def net_signal(raw, blank=0):
                  return raw - blank
            rejects:
              - code: |
                  def net_signal(raw, blank=3):
                      return raw - blank
                why: 默认值写成了 3，不是 0
              - code: |
                  def net_signal(blank=0, raw=0):
                      return raw - blank
                why: 把形参的顺序换了，位置实参给错了形参
              - code: |
                  def net_signal(raw=0, blank):
                      return raw - blank
                why: 带默认值的形参写在了不带默认值的前面，语法错误
            tests:
              - name: 需求给出的例子
                doctest: |
                  >>> net_signal(12, 3)
                  9
                  >>> net_signal(12)
                  12
              - name: 按名字给
                hidden: true
                doctest: |
                  >>> net_signal(raw=8)
                  8
                  >>> net_signal(5, blank=2)
                  3
        explanation: |
          只要给 blank 加上默认值 0：

          ```python
          def net_signal(raw, blank=0):
              return raw - blank
          ```

          形参的顺序不能变：调用 `net_signal(12, 3)` 时，12 仍要给 raw、3 给 blank。带默认值的形参要写在后面，写成 `def net_signal(raw=0, blank):` 是语法错误。
    review:
      - id: py41.k1.r1
        kind: [explain]
        body: |
          `per_hour` 把一段时间里的计数换算成每小时的次数，minutes 省略时按 60 分钟算。

          ```python
          def per_hour(count, minutes=60):
              return count * 60 // minutes
          ```

          下面哪些调用交回的结果和 `per_hour(30)` **一定相同**？选出所有的。
        slots:
          - id: same
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: explicit, content: "`per_hour(30, 60)`" }
              - { id: swapped, content: "`per_hour(60, 30)`" }
              - { id: keyword, content: "`per_hour(minutes=60, count=30)`" }
              - { id: half, content: "`per_hour(30, minutes=30)`" }
              - { id: count_only, content: "`per_hour(count=30)`" }
            key: [explicit, keyword, count_only]
        explanation: |
          `per_hour(30)` 里 count 是 30，minutes 用默认值 60。和它相同的是：**`per_hour(30, 60)`**（明写默认值）、**`per_hour(minutes=60, count=30)`**（按名字给，顺序无关）、**`per_hour(count=30)`**（同样省略 minutes）。

          `per_hour(60, 30)` 让 count 是 60、minutes 是 30，交回 120；`per_hour(30, minutes=30)` 改了 minutes，交回 60。它们交给函数的输入和 `per_hour(30)` 不同，结果也就不同。每个选项的勾选状态分别计分。
        verify: |
          import sys
          calls = {"explicit": "per_hour(30, 60)", "swapped": "per_hour(60, 30)", "keyword": "per_hour(minutes=60, count=30)",
                   "half": "per_hour(30, minutes=30)", "count_only": "per_hour(count=30)"}
          def inputs(call):
              seen = []
              def watch(frame, event, arg):
                  if event == "call" and frame.f_code.co_name == "per_hour":
                      seen.append(dict(frame.f_locals))
              sys.settrace(watch)
              try:
                  run(CODE + "\n" + call)
              finally:
                  sys.settrace(None)
              return seen
          base = inputs("per_hour(30)")
          answers = {"same": [option for option, call in calls.items() if inputs(call) == base]}
      - id: py41.k1.r2
        kind: [trace, predict]
        body: |
          ```python
          def mark(value, low=5, high=10):
              if value < low:
                  return "偏低"
              elif value > high:
                  return "偏高"
              return "正常"
          ```

          填写每次调用时 low、high 的值和交回的结果。
        slots:
          - id: calls
            type: table
            columns:
              - { id: call, header: 调用 }
              - { id: low, header: low, input: integer }
              - { id: high, header: high, input: integer }
              - id: result
                header: 交回
                input: { type: choice, options: [{ id: low, label: 偏低 }, { id: high, label: 偏高 }, { id: ok, label: 正常 }] }
            rows:
              - { id: c1, cells: { call: mark(7), low: 5, high: 10, result: ok } }
              - { id: c2, cells: { call: "mark(7, 8)", low: 8, high: 10, result: low } }
              - { id: c3, cells: { call: "mark(7, high=6)", low: 5, high: 6, result: high } }
              - { id: c4, cells: { call: "mark(4, low=3)", low: 3, high: 10, result: ok } }
        explanation: |
          - `mark(7)`：low、high 都用默认值 5 和 10，7 在中间，**正常**。
          - `mark(7, 8)`：第二个位置实参给 low，low 是 8，high 仍是 10；7 < 8，**偏低**。
          - `mark(7, high=6)`：low 用默认值 5，high 是 6；7 > 6，**偏高**。
          - `mark(4, low=3)`：low 是 3，high 用默认值 10；4 不低于 3 也不高于 10，**正常**。
        verify: |
          import sys
          ids = {"偏低": "low", "偏高": "high", "正常": "ok"}
          rows = {}
          for row, call in (("c1", "mark(7)"), ("c2", "mark(7, 8)"), ("c3", "mark(7, high=6)"), ("c4", "mark(4, low=3)")):
              seen = []
              def watch(frame, event, arg):
                  if event == "call" and frame.f_code.co_name == "mark":
                      seen.append(dict(frame.f_locals))
              sys.settrace(watch)
              try:
                  r = run(CODE + "\nresult = " + call)
              finally:
                  sys.settrace(None)
              rows[row] = {"low": seen[0]["low"], "high": seen[0]["high"], "result": ids[r["result"]]}
          answers = {"calls": rows}
    quiz:
      - id: py41.k1.x1
        kind: [trace, predict]
        body: |
          `deep` 判断一个采样点算不算深层：strict 为 True 时要求严格超过 limit，否则达到 limit 就算。

          ```python
          def deep(depth, limit=30, strict=False):
              if strict:
                  return depth > limit
              return depth >= limit
          ```
        slots:
          - id: calls
            type: table
            prompt: 填写每次调用时 limit 的值和交回的结果。
            columns:
              - { id: call, header: 调用 }
              - { id: limit, header: limit, input: integer }
              - { id: result, header: 交回, input: bool }
            rows:
              - { id: c1, cells: { call: deep(30), limit: 30, result: true } }
              - { id: c2, cells: { call: "deep(30, strict=True)", limit: 30, result: false } }
              - { id: c3, cells: { call: "deep(30, 35)", limit: 35, result: false } }
              - { id: c4, cells: { call: "deep(limit=25, depth=30)", limit: 25, result: true } }
        explanation: |
          - `deep(30)`：limit 30、strict False，30 >= 30，**True**。
          - `deep(30, strict=True)`：limit 仍是默认的 30，但要求严格超过，30 > 30 不成立，**False**。
          - `deep(30, 35)`：第二个位置实参给 limit，30 >= 35 不成立，**False**。
          - `deep(limit=25, depth=30)`：按名字给，30 >= 25，**True**。
        verify: |
          import sys
          rows = {}
          for row, call in (("c1", "deep(30)"), ("c2", "deep(30, strict=True)"), ("c3", "deep(30, 35)"), ("c4", "deep(limit=25, depth=30)")):
              seen = []
              def watch(frame, event, arg):
                  if event == "call" and frame.f_code.co_name == "deep":
                      seen.append(dict(frame.f_locals))
              sys.settrace(watch)
              try:
                  r = run(CODE + "\nresult = " + call)
              finally:
                  sys.settrace(None)
              rows[row] = {"limit": seen[0]["limit"], "result": r["result"]}
          answers = {"calls": rows}
      - id: py41.k1.x2
        kind: [debug]
        body: |
          函数体是 `return count / minutes`，要让下面三次调用都按注释工作：

          ```python
          per_minute(120)                   # minutes 省略时按 60 算，交回 2.0
          per_minute(30, 10)                # 交回 3.0
          per_minute(minutes=5, count=20)   # 交回 4.0
          ```

          函数的第一行应写成哪一种？
        slots:
          - id: header
            type: choice
            options:
              - { id: swapped, content: "`def per_minute(minutes, count=60):`" }
              - { id: no_default, content: "`def per_minute(count, minutes):`" }
              - { id: right, content: "`def per_minute(count, minutes=60):`" }
              - { id: default_first, content: "`def per_minute(minutes=60, count):`" }
            key: right
        explanation: |
          **`def per_minute(count, minutes=60):`**。第一个位置实参要给 count，minutes 省略时才用 60。

          把 minutes 写在前面时，`per_minute(120)` 会让 minutes 成为 120；不给 minutes 默认值，`per_minute(120)` 报 TypeError；带默认值的形参写在不带默认值的前面，是语法错误。
        verify: |
          checks = "results = [per_minute(120), per_minute(30, 10), per_minute(minutes=5, count=20)]"
          headers = {"swapped": "def per_minute(minutes, count=60):", "no_default": "def per_minute(count, minutes):",
                     "right": "def per_minute(count, minutes=60):", "default_first": "def per_minute(minutes=60, count):"}
          fits = []
          for option, header in headers.items():
              r = run(header + "\n    return count / minutes\n" + checks)
              if r.error is None and r["results"] == [2.0, 3.0, 4.0]:
                  fits.append(option)
          answers = {"header": fits[0] if len(fits) == 1 else fits}

  - id: py41.k2
    keyPrerequisites: [py40, py01]
    title: 局部名称与外部名称的区别
    card:
      name: 局部名字
      aliases: [局部变量, 作用范围]
      definition: 函数里赋值的名字（包括形参）只属于这一次调用，和外面同名的名字互不影响；函数里没赋值的名字才到外面去找。
      conditions:
        - 调用结束后局部名字就不在了，在外面用它会报 NameError。
        - 函数里只要给某个名字赋值，它在整个函数里都是局部的；先读后赋值会报 UnboundLocalError。
      example:
        from: py41.k2.e0
        text: |
          ```python
          limit = 10

          def label(signal):
              limit = 12
              ...
          ```
          函数里的 limit = 12 只属于这次调用，用 12 判断；调用之后外面的 limit 仍是 10。
    lesson: |
      函数里赋值的名字是**局部**的：它在这次调用里新建，调用结束就消失，和函数外面同名的名字互不相干。

      ```python
      limit = 10

      def label(signal):
          limit = 12
          if signal >= limit:
              return "达标"
          return "未达标"
      ```

      函数里的 `limit = 12` 新建了一个只属于这次调用的 limit，判断时用 12；外面的 limit 仍是 10。形参也是局部名字：调用时接收实参，调用结束就消失。

      函数里**没有赋值**的名字，会到外面去找：

      ```python
      blank = 2

      def net(raw):
          return raw - blank
      ```

      这里的 blank 读的是外面的 blank，而且是**调用那一刻**的值。外面后来改了 blank，下次调用就用新值。这样写容易出错，结果取决于调用之前外面发生过什么；更清楚的写法是把 blank 也写成形参，调用时传进来。

      两种常见的报错：

      - 在函数外面用函数里的局部名字：报 NameError，外面从来没有这个名字。
      - 函数里先读一个名字、后面又给它赋值，例如 `count = count + 1`：Python 认定它是局部名字，读的时候它还没有值，报 UnboundLocalError。想更新外面的值，就把值传进去，再用 return 交回来：`count = add_one(count)`。
