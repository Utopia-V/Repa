      - id: py41.k3.x2
        kind: [modify]
        body: |
          需求：`net_signal(raw, blank=0)` 交回减去本底后的值，不在屏幕上显示任何东西。

          作答框里的函数只把结果显示出来，调用处拿不到。请改动它并提交。

          ```python
          >>> net_signal(12, 2) * 2
          20
          >>> net_signal(5)
          5
          ```
        slots:
          - id: code
            type: code
            language: python
            maxLines: 6
            starter: |
              def net_signal(raw, blank=0):
                  net = raw - blank
                  print(net)
            solution: |
              def net_signal(raw, blank=0):
                  net = raw - blank
                  return net
            accepts:
              - |
                def net_signal(raw, blank=0):
                    return raw - blank
            rejects:
              - code: |
                  def net_signal(raw, blank=0):
                      net = raw - blank
                      print(net)
                      return net
                why: 交回了，但仍在屏幕上显示
              - code: |
                  def net_signal(raw, blank=0):
                      net = raw - blank
                      return print(net)
                why: 交回的是 print 的结果 None
              - code: |
                  def net_signal(raw, blank):
                      net = raw - blank
                      return net
                why: 去掉了 blank 的默认值
            tests:
              - name: 需求给出的例子
                doctest: |
                  >>> net_signal(12, 2) * 2
                  20
                  >>> net_signal(5)
                  5
              - name: 交回的值接着算
                hidden: true
                doctest: |
                  >>> net_signal(9, 4) + net_signal(3)
                  8
        explanation: |
          把 print 换成 return：

          ```python
          def net_signal(raw, blank=0):
              net = raw - blank
              return net
          ```

          既 print 又 return 会多显示一行，不符合“不在屏幕上显示”；`return print(net)` 交回的是 print 的结果 None。blank 的默认值 0 要保留，`net_signal(5)` 才能省略本底。
