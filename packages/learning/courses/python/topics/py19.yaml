kps:
  - id: py19.k1
    title: isna/notna 识别缺失而不靠 ==
    card:
      name: isna 找缺失
      aliases: [isna, notna, NaN, 缺失值]
      definition: 列.isna() 逐行判断这一格是否缺失，得到一列布尔掩码；列.notna() 正好相反，标出有值的行。
      conditions:
        - 不能用 == np.nan 找缺失：NaN 和任何值比较都不相等，连和它自己比也不相等。
        - 缺失的行在 >=、< 这类比较里都得到 False，两边的筛选都不会留下它。
        - 0 是测到了零，不是缺失。
      example:
        from: py19.k1.e0
        text: |
          ```python
          missing = df["signal"].isna()
          wrong = df["signal"] == np.nan
          ```
          表 M 里 `missing` 在 S_B、S_E 两行为 True，`wrong` 全是 False；S_C 的 0.0 不算缺失。
    lesson: |
      表 M 里，S_C 的 signal 是 0.0：仪器测了，读数是零。S_B 和 S_E 显示 `NaN`（Not a Number，“不是一个数”）：这一格**没有值**。0 和缺失意思完全不同，不能混为一谈。

      找缺失要用 `isna()`，它逐行判断这一格是不是缺失，得到一列[布尔掩码](repa:concept/py17.k1)；`notna()` 正好相反，标出有值的行：

      ```python
      missing = df["signal"].isna()
      result = df.loc[df["signal"].notna(), ["sample_id"]]
      ```

      | 原行索引 | signal | `isna()` | `notna()` |
      |---:|---:|---|---|
      | 31 | 8.0 | False | True |
      | 7 | NaN | True | False |
      | 22 | 0.0 | False | True |
      | 4 | 13.0 | False | True |
      | 18 | NaN | True | False |

      为什么不用 `df["signal"] == np.nan`？`np.nan` 是 NumPy 里表示缺失的值，但 NaN 有个特别的规定：它和任何值比较都不相等，连和它自己比也不相等。所以 `== np.nan` 每一行都是 False，一个缺失也找不出来；`!= np.nan` 则每一行都是 True。

      同样的规定还有一个后果：缺失的行在 `>=`、`<` 这些比较里都得到 False。`df["signal"] >= 10` 留不下 S_B，`df["signal"] < 10` 也留不下它。把表按“至少 10”和“低于 10”分成两份，两份加起来会少掉缺失的那几行。

      想知道缺了几个，可以写 `df["signal"].isna().sum()`：求和时 True 算 1、False 算 0，结果就是 True 的个数，这里是 2。
    example:
      id: py19.k1.e0
      kind: [predict]
      data: [M]
      body: |
        阅读代码，按原行索引填写 `missing` 和 `wrong` 的值，再写出缺失的个数。

        ```python
        missing = df["signal"].isna()
        wrong = df["signal"] == np.nan
        n = missing.sum()
        ```
      slots:
        - id: masks
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: signal, header: signal }
            - { id: missing, header: missing, input: bool }
            - { id: wrong, header: wrong, input: bool }
          rows:
            - { id: r31, cells: { index: "31", signal: "8.0", missing: false, wrong: false } }
            - { id: r7, cells: { index: "7", signal: "NaN", missing: true, wrong: false } }
            - { id: r22, cells: { index: "22", signal: "0.0", missing: false, wrong: false } }
            - { id: r4, cells: { index: "4", signal: "13.0", missing: false, wrong: false } }
            - { id: r18, cells: { index: "18", signal: "NaN", missing: true, wrong: false } }
        - id: n
          type: text
          format: integer
          prompt: "`n` 是多少？"
          key: 2
      explanation: |
        `missing` 依次为 **False、True、False、False、True**：只有显示 NaN 的索引 7 和 18 缺失，索引 22 的 0.0 是一个真实的读数。

        `wrong` **全是 False**：NaN 和任何值比较都不相等，连和 `np.nan` 自己比也不相等，所以 `== np.nan` 一个缺失也找不出来。

        `n` 是 **2**：求和时 True 算 1、False 算 0。
      verify: |
        r = run()
        answers = {
            "masks": {f"r{label}": {"missing": r["missing"][label], "wrong": r["wrong"][label]} for label in df.index},
            "n": int(r["n"]),
        }
    practice:
      - id: py19.k1.q1
        kind: [predict]
        uses: [py17.k2]
        data: [M]
        body: |
          阅读代码，说出 `result` 的样子。

          ```python
          result = df.loc[df["signal"].notna(), ["sample_id"]]
          ```
        slots:
          - id: rows
            type: order
            partial: true
            prompt: 留下了哪些行？按先后顺序排出原行索引。
            items:
              - { id: "31", content: "31" }
              - { id: "7", content: "7" }
              - { id: "22", content: "22" }
              - { id: "4", content: "4" }
              - { id: "18", content: "18" }
            key: ["31", "22", "4"]
          - id: nrows
            type: text
            format: integer
            prompt: "`result` 有几行？"
            key: 3
        explanation: |
          留下索引 **31、22、4**，共 **3** 行。`notna()` 标出有值的行；索引 22 的 signal 是 0.0，是一个真实的读数，也留下了。只有显示 NaN 的索引 7、18 被去掉。
        verify: |
          result = run()["result"]
          answers = {"rows": [str(label) for label in result.index], "nrows": len(result)}
      - id: py19.k1.q2
        kind: [predict, explain]
        uses: [py17.k1]
        data: [M]
        body: |
          阅读代码，按原行索引填写 `high` 和 `low` 的值。

          ```python
          high = df["signal"] >= 10
          low = df["signal"] < 10
          ```
        slots:
          - id: masks
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: signal, header: signal }
              - { id: high, header: high, input: bool }
              - { id: low, header: low, input: bool }
            rows:
              - { id: r31, cells: { index: "31", signal: "8.0", high: false, low: true } }
              - { id: r7, cells: { index: "7", signal: "NaN", high: false, low: false } }
              - { id: r22, cells: { index: "22", signal: "0.0", high: false, low: true } }
              - { id: r4, cells: { index: "4", signal: "13.0", high: true, low: false } }
              - { id: r18, cells: { index: "18", signal: "NaN", high: false, low: false } }
          - id: neither
            type: text
            format: integer
            prompt: 有几行的 `high` 和 `low` 都是 False？
            key: 2
        explanation: |
          | 原行索引 | signal | high | low |
          |---:|---:|---|---|
          | 31 | 8.0 | False | True |
          | 7 | NaN | **False** | **False** |
          | 22 | 0.0 | False | True |
          | 4 | 13.0 | True | False |
          | 18 | NaN | **False** | **False** |

          有 **2** 行两个都是 False，就是 signal 缺失的索引 7 和 18：缺失的值在任何比较里都得到 False。用“至少 10”和“低于 10”把表分成两份，这两行哪份都不在。
        verify: |
          r = run()
          high, low = r["high"], r["low"]
          answers = {
              "masks": {f"r{label}": {"high": high[label], "low": low[label]} for label in df.index},
              "neither": int((~high & ~low).sum()),
          }
      - id: py19.k1.q3
        kind: [debug]
        uses: [py17.k1]
        data: [M]
        body: |
          同事想数出 signal 缺了几个，写了下面这行，结果显示 0。

          ```python
          print((df["signal"] == np.nan).sum())
          ```
        slots:
          - id: fix
            type: choice
            prompt: 应改成哪一行？
            options:
              - id: none
                content: |
                  ```python
                  print((df["signal"] == None).sum())
                  ```
                feedback: 和 None 比较同样逐行得到 False，缺失找不出来。
              - id: zero
                content: |
                  ```python
                  print((df["signal"] == 0).sum())
                  ```
                feedback: 这数的是读数恰好为 0 的样本，0 不是缺失。
              - id: isna
                content: |
                  ```python
                  print(df["signal"].isna().sum())
                  ```
            key: isna
          - id: count
            type: text
            format: integer
            prompt: 改对以后显示几？
            key: 2
        explanation: |
          改成 **`df["signal"].isna().sum()`**，显示 **2**。

          NaN 和任何值比较都不相等，所以 `== np.nan` 每一行都是 False，求和得到 0。和 None 比较也一样找不出缺失；`== 0` 数的是 S_C 那样读数为 0 的样本，那是真实的测量。
        verify: |
          import math
          wanted = sum(1 for value in df["signal"] if isinstance(value, float) and math.isnan(value))
          fits = []
          for option, line in OPTIONS["fix"].items():
              r = run(line)
              if r.error is None and r.out.strip() == str(wanted):
                  fits.append(option)
          answers = {"fix": fits[0] if len(fits) == 1 else fits, "count": wanted}
    review:
      - id: py19.k1.r1
        kind: [predict]
        uses: [py17.k1]
        data: [birds]
        body: |
          阅读代码，写出两行输出。

          ```python
          print(birds["count"].isna().sum())
          print((birds["count"] == 0).sum())
          ```
        slots:
          - id: first
            type: text
            format: integer
            prompt: 第一行输出
            key: 2
          - id: second
            type: text
            format: integer
            prompt: 第二行输出
            key: 1
        explanation: |
          第一行 **2**：南坡和山顶的 count 缺失。第二行 **1**：只有东坡记下了 0 个巢，那是调查过、确实没有找到，不是缺失。两个数分开报告，才说得清“几个样地没调查”和“几个样地没有巢”。
        verify: |
          lines = run().lines()
          answers = {"first": int(lines[0]), "second": int(lines[1])}
      - id: py19.k1.r2
        kind: [predict, explain]
        uses: [py17.k1, py17.k2]
        data: [soil]
        body: |
          有人想把样地分成“偏酸”和“不偏酸”两组。

          ```python
          acid = soil.loc[soil["ph"] < 6.0, ["plot"]]
          other = soil.loc[soil["ph"] >= 6.0, ["plot"]]
          ```
        slots:
          - id: acid
            type: text
            format: integer
            prompt: "`acid` 有几行？"
            key: 1
          - id: other
            type: text
            format: integer
            prompt: "`other` 有几行？"
            key: 2
          - id: lost
            type: order
            partial: true
            prompt: 哪几行两组里都没有？按原行索引的先后顺序排出。
            items:
              - { id: "5", content: "5" }
              - { id: "12", content: "12" }
              - { id: "3", content: "3" }
              - { id: "8", content: "8" }
              - { id: "20", content: "20" }
            key: ["12", "20"]
        explanation: |
          `acid` 有 **1** 行（P3），`other` 有 **2** 行（P1、P4），加起来只有 3 行。pH 缺失的索引 **12、20** 在 `< 6.0` 和 `>= 6.0` 里都得到 False，哪组都不在。分组之前要先决定缺失的行算哪一类，或者单独列出来。
        verify: |
          r = run()
          acid, other = r["acid"], r["other"]
          lost = [str(label) for label in soil.index if label not in acid.index and label not in other.index]
          answers = {"acid": len(acid), "other": len(other), "lost": lost}
    quiz:
      - id: py19.k1.x1
        kind: [explain]
        uses: [py17.k1, py17.k2]
        data: [temps]
        body: |
          要只留下记录到了气温的气象站，气温缺失的站不要。下面哪些写法能做到？选出所有能做到的。
        slots:
          - id: ways
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: notna, content: "`temps.loc[temps[\"temp\"].notna()]`" }
              - { id: ne_nan, content: "`temps.loc[temps[\"temp\"] != np.nan]`" }
              - { id: positive, content: "`temps.loc[temps[\"temp\"] > 0]`" }
              - { id: isna_false, content: "`temps.loc[temps[\"temp\"].isna() == False]`" }
            key: [notna, isna_false]
        explanation: |
          **`notna()`** 和 **`isna() == False`** 都标出有值的行，留下 T1、T3、T4。

          `!= np.nan` 每一行都是 True（NaN 和谁都不相等），连缺失的 T2 也留下了；`> 0` 只留下 T4，把 -2.5 ℃ 和 0 ℃ 这两个真实的读数也去掉了。
        verify: |
          import math
          wanted = [label for label, value in temps["temp"].items() if not math.isnan(value)]
          codes = {
              "notna": 'result = temps.loc[temps["temp"].notna()]',
              "ne_nan": 'result = temps.loc[temps["temp"] != np.nan]',
              "positive": 'result = temps.loc[temps["temp"] > 0]',
              "isna_false": 'result = temps.loc[temps["temp"].isna() == False]',
          }
          ways = []
          for option, code in codes.items():
              r = run(code)
              if r.error is None and list(r["result"].index) == wanted:
                  ways.append(option)
          answers = {"ways": ways}
      - id: py19.k1.x2
        kind: [modify]
        uses: [py17.k1, py17.k2]
        data: [temps]
        body: |
          需求是：

          > 列出没有记录到气温的气象站，只输出 station 一列（结果仍是表），保留原行顺序和原索引，不改变 `temps`。

          同事写的代码在作答框里，运行后得到一张没有行的表。请改动它并提交，最终结果变量仍叫 `result`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              result = temps.loc[temps["temp"] == np.nan, ["station"]]
            solution: |
              result = temps.loc[temps["temp"].isna(), ["station"]]
            accepts:
              - result = temps.loc[temps["temp"].notna() == False, ["station"]]
            rejects:
              - code: result = temps.loc[temps["temp"] == None, ["station"]]
                why: 和 None 比较同样找不出缺失
              - code: result = temps.loc[temps["temp"] == 0, ["station"]]
                why: 把读数为 0 的站当成了缺失
              - code: result = temps.loc[temps["temp"].notna(), ["station"]]
                why: 留下的是有记录的站
              - code: result = temps.loc[temps["temp"].isna(), "station"]
                why: 列名没写成列表，结果成了一列（Series）
            tests:
              - name: 表 temps
                expect:
                  result: 'pd.DataFrame({"station": ["T2"]}, index=[2])'
                  temps: temps
              - name: 换一份有两个缺失的记录
                hidden: true
                data: [temps2]
                expect:
                  result: 'pd.DataFrame({"station": ["K1", "K3"]}, index=[10, 20])'
                  temps: temps
        explanation: |
          ```python
          result = temps.loc[temps["temp"].isna(), ["station"]]
          ```

          `== np.nan` 每一行都是 False，所以原来的代码一行也留不下。改用 `isna()` 标出缺失的行，留下 T2。和 None 比较一样找不出缺失；`== 0` 会把真的读到 0 ℃ 的 T3 当成缺失。判分时还会换一份有两个缺失的记录运行。

  - id: py19.k2
    title: 不同 dtype 下缺失表示可能不同
    card:
      name: 缺失的样子
      aliases: [NaN, None, NaT, 空串]
      definition: pandas 用 NaN、None、NaT（日期）、<NA> 等表示缺失，isna() 都认；整数列里有缺失时，整列会存成浮点。
      conditions:
        - 空串 ""、空格、手打的 NA、0、-999 这类记号不是缺失，isna() 判为 False。
        - 整数列有缺失时，3 会显示成 3.0，dtype 是 float64。
      example:
        from: py19.k2.e0
        text: |
          表 log 的 count 是 3.0、NaN、0.0、-999.0，note 是 ok、NaN、""、NA；`log.isna()` 只在 S_B 那一行为 True。
    lesson: |
      缺失在不同类型的列里，显示出来的样子不完全一样：

      | 列的内容 | 缺失显示为 |
      |---|---|
      | 数（float64） | `NaN` |
      | 文字（pandas 3 的 str 列） | `NaN` |
      | 混放各种对象的列（object） | 可能是 `None` |
      | 日期时间 | `NaT` |
      | 可以有缺失的整数（Int64） | `<NA>` |

      这些写法 `isna()` 都认得，都判为 True。

      整数列有一个容易让人困惑的地方：原始记录里的 3、（空）、0，读成表以后显示为 3.0、NaN、0.0。普通的整数列放不下缺失，pandas 就把整列存成浮点（dtype 为 float64；`df["列"].dtype` 可以查看一列的类型）。看到一列编号或计数突然带了 `.0`，先想想是不是有缺失。

      反过来，有些值**看起来**像“没有”，pandas 却不认为它们是缺失：

      - 空串 `""`：一段一个字也没有的文字，显示时是一格空白；
      - 一个空格 `" "`；
      - 手打的 `NA`、`N/A`、`无`：它们只是几个字；
      - 0，以及旧仪器用来表示“没读到”的 -999 这类记号：它们是数。

      对这些值，`isna()` 都是 False。它们算不算缺失、要不要改成缺失，是下一步要和需求方确认的事。
    example:
      id: py19.k2.e0
      kind: [predict]
      data: [log]
      body: |
        阅读代码，按原行索引填写 `log.isna()` 中 count 和 note 两列的值，再回答 count 列的类型。

        ```python
        flags = log.isna()
        ```
      slots:
        - id: flags
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: count, header: count, input: bool }
            - { id: note, header: note, input: bool }
          rows:
            - { id: r31, cells: { index: "31", count: false, note: false } }
            - { id: r7, cells: { index: "7", count: true, note: true } }
            - { id: r22, cells: { index: "22", count: false, note: false } }
            - { id: r4, cells: { index: "4", count: false, note: false } }
        - id: dtype
          type: choice
          prompt: "`log[\"count\"]` 是什么类型？"
          options:
            - { id: int, content: 整数（int64） }
            - { id: float, content: 浮点（float64） }
            - { id: str, content: 文字（str） }
          key: float
      explanation: |
        只有索引 7（S_B）那一行两格都是 **True**，其余都是 **False**。

        - 0.0 是一个数，-999.0 也是一个数，哪怕它原本是“没读到”的记号；
        - 空串 `""` 是一段没有字的文字，`NA` 是两个字母，都不是缺失。

        count 列是**浮点（float64）**：它有一个缺失，pandas 把整列存成浮点，所以 3 显示为 3.0。
      verify: |
        r = run()
        flags = r["flags"]
        answers = {
            "flags": {f"r{label}": {"count": flags.loc[label, "count"], "note": flags.loc[label, "note"]} for label in log.index},
            "dtype": {"f": "float", "i": "int"}.get(log["count"].dtype.kind, "str"),
        }
    practice:
      - id: py19.k2.q1
        kind: [predict]
        uses: [py14.k3, py16.k2]
        data: [birds]
        body: |
          表 birds 的原始调查表里，count 记的是整数 3、（空）、0、5、（空）。阅读代码，写出两行输出。

          ```python
          print(birds["count"].iloc[0])
          print(birds["count"].dtype)
          ```
        slots:
          - id: first
            type: text
            match: output
            prompt: 第一行输出
            key: "3.0"
            feedback:
              - when: "3"
                message: 这一列有缺失，pandas 把整列存成了浮点，3 显示为 3.0。
          - id: second
            type: text
            prompt: 第二行输出
            key: float64
        explanation: |
          第一行 **3.0**，第二行 **float64**。原始记录是整数，但这一列有两个缺失，普通的整数列放不下缺失，pandas 就把整列存成浮点。
        verify: |
          lines = run().lines()
          answers = {"first": lines[0], "second": str(lines[1])}
      - id: py19.k2.q2
        kind: [explain]
        uses: [py03.k3]
        body: |
          下面每个值单独放进一列，再对这一列用 `isna()`。哪些值会被判为缺失（True）？选出所有会的。
        slots:
          - id: missing
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - { id: none, content: "`None`" }
              - { id: nan, content: "`np.nan`" }
              - { id: empty, content: "`\"\"`（空串）" }
              - { id: na_text, content: "`\"NA\"`（两个字母）" }
              - { id: zero, content: "`0`" }
              - { id: code, content: "`-999`" }
            key: [none, nan]
        explanation: |
          只有 **`None`** 和 **`np.nan`** 是缺失。空串是一段没有字的文字，`"NA"` 是两个字母，0 和 -999 都是数；即使它们在某份记录里表示“没有”，`isna()` 也不会替你这样理解。
        verify: |
          values = {"none": None, "nan": np.nan, "empty": "", "na_text": "NA", "zero": 0, "code": -999}
          answers = {"missing": [option for option, value in values.items() if pd.Series([value], dtype=object).isna().iloc[0]]}
      - id: py19.k2.q3
        kind: [predict, explain]
        uses: [py17.k2]
        data: [log]
        body: |
          有人想找出“note 没有写内容”的样本，写了下面的代码。

          ```python
          result = log.loc[log["note"].isna(), ["sample_id"]]
          ```
        slots:
          - id: rows
            type: order
            partial: true
            prompt: "`result` 留下了哪些行？按先后顺序排出原行索引。"
            items:
              - { id: "31", content: "31" }
              - { id: "7", content: "7" }
              - { id: "22", content: "22" }
              - { id: "4", content: "4" }
            key: ["7"]
          - id: s_c
            type: choice
            prompt: S_C 的 note 是空串，它在结果里吗？
            options:
              - { id: "yes", content: 在，空串也是缺失 }
              - { id: "no", content: 不在，空串不是缺失 }
            key: "no"
        explanation: |
          只留下索引 **7**（S_B）。S_C 的 note 是空串，看起来什么也没写，但它是一段文字，`isna()` 判为 False，所以**不在**结果里。如果需求说的“没有写内容”也包括空串，就要在需求里写明，再另行处理。
        verify: |
          result = run()["result"]
          rows = [str(label) for label in result.index]
          answers = {"rows": rows, "s_c": "yes" if "S_C" in list(result["sample_id"]) else "no"}
    review:
      - id: py19.k2.r1
        kind: [predict]
        uses: [py14.k3]
        data: [plants]
        body: |
          阅读代码，写出两行输出。

          ```python
          print(plants["height"].dtype)
          print(plants["height"].sum())
