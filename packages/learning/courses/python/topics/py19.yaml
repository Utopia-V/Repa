      - id: py19.k3.x2
        kind: [specify, explain]
        uses: [py12.k1]
        data: [M]
        body: |
          需求是：“删除 signal 缺失的行，其他列有缺失的行照常保留。”
        slots:
          - id: line
            type: choice
            prompt: 哪一行代码符合这个需求？
            options:
              - id: all
                content: |
                  ```python
                  result = df.dropna()
                  ```
              - id: fill
                content: |
                  ```python
                  result = df.fillna(0)
                  ```
              - id: subset
                content: |
                  ```python
                  result = df.dropna(subset=["signal"])
                  ```
              - id: nonzero
                content: |
                  ```python
                  result = df.loc[df["signal"] != 0]
                  ```
            key: subset
          - id: nrows
            type: text
            format: integer
            prompt: 按需求处理后，表 M 剩几行？
            key: 3
        explanation: |
          **`df.dropna(subset=["signal"])`** 符合需求，剩 **3** 行（S_A、S_C、S_D）。

          `dropna()` 不写 subset，会因为 note 空着把 S_A、S_C 也删掉；`fillna(0)` 没有删任何行，还把缺失改成了 0；`!= 0` 删掉的是读数为 0 的 S_C，缺失的 S_B、S_E 反而留下了（NaN 和 0 不相等）。
        verify: |
          import math
          wanted = [label for label, value in df["signal"].items() if not math.isnan(value)]
          fits = []
