              - id: b
                content: 删除任何一列有缺失的样地，再算 depth 的平均，报告里写明有几个
              - id: c
                content: 只删除 depth 缺失的样地，用其余样地算 depth 的平均，并在报告里写明删去了几个
              - id: d
                content: 只删除 depth 缺失的样地，用其余样地算 depth 的平均
            key: c
        explanation: |
          “只删除 depth 缺失的样地，用其余样地算平均，并写明删去了几个”这一种与规则一致。

          记为 0 等于编了一个深度，平均会被拉低；“任何一列有缺失”会把 depth 完好、只是别的列空着的样地也删掉；最后一种漏了“报告有几个”。
