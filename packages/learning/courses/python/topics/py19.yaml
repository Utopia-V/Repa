notes: |
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）。
  范围：只讲识别缺失（isna/notna）、缺失参与比较的结果、整数列有缺失变浮点、哪些记号不是缺失，以及 dropna(subset=...)、fillna(0) 两种处理对结果的影响。不讲 sum/mean 跳过缺失的细节和全缺失风险（py26），不讲把空串、"NA" 之类清理成缺失（py24、py20），不讲多条件组合（py18 不是本节先修）。
  k1 的表 M 里 S_C 的 signal 是真实测得的 0.0，S_B、S_E 缺失；note 列也有缺失，用来展示 dropna() 不写 subset 会删掉测量完好的行。
  空串在 pandas 的表格显示里是一格空白，题面用 python 夹具自己画表，把空串写成 `""` 并说明。
  k3 的“该删、该填还是该保留”没有程序能算的答案，复习和测验各有一道列进 manual，由 course:confirm 核对；其余都由程序核对。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  真实的数据表里总有空着的格：仪器没给出读数、有人漏填、某一项不适用。这一节先学会准确地找出它们，再学会把“空着的格怎么办”说成一条明确的规则。

  宿主已经导入了 pandas（`pd`）和 NumPy（`np`），并准备好数据表；每道题都从题面给出的表重新开始。大多数题用表 M：`sample_id` 是样本编号，`signal` 是测量值，`note` 是备注。表里显示为 `NaN` 的格就是缺失。
wrapup: |
  读到 `NaN`，先问它为什么空着；读到 0、空白或 `NA` 这样的字，先问它是真实的值还是别人用来表示“没有”的记号。

  向同事或 AI 提需求时，可以这样说：“signal 缺失的样本不参加筛选和平均，在结果里报告有几个；note 缺失的行照常保留。”拿到代码后，检查找缺失用的是 `isna()` 而不是 `== np.nan`，`dropna` 有没有写 `subset`，`fillna` 填进去的值是不是需求里说的那个。
