id: py19
title: 缺失不等于零，也不等于空串
status: complete
minutes: 20
summary: 用 isna/notna 找出缺失值；认出 NaN、None 和“看起来像缺失”的记号的区别；删除、填补还是保留缺失，要按业务规则写进需求。
