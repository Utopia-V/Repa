  - id: py19.k3
    title: 删除、保留或填补需要业务规则
    card:
      name: 缺失处理规则
      aliases: [dropna, fillna, 缺失值处理]
      definition: 缺失是删掉（dropna）、填上（fillna）还是留着，会改变留下的行和算出的结果，要按缺失的原因写进需求。
      conditions:
        - dropna 不写 subset 时，任何一列有缺失的整行都会被删掉。
        - fillna(0) 等于把“没测到”当成“测得 0”，会改变筛选结果和平均值。
        - 这两种做法都得到新的结果，原表不变。
      example:
        from: py19.k3.e0
        text: |
          表 M 里 signal 低于 10 的原本是 S_A、S_C；`fillna(0)` 之后，缺失的 S_B、S_E 也被当成低信号样本留下。
    lesson: |
      空着的格怎么办，程序替你决定不了。常见的做法有三种，以表 M 为例：

      1. **删除。**`df.dropna(subset=["signal"])` 得到一张去掉 signal 缺失行的新表，留下 S_A、S_C、S_D。`subset` 写明看哪一列；不写时，任何一列有缺失的整行都会被删掉。表 M 的 note 也有缺失，`df.dropna()` 只剩下 S_D 一行，S_A、S_C 好好的测量也被删了。
      2. **填补。**`df["signal"].fillna(0)` 把缺失换成 0，等于说“没测到就是测得 0”。之后再筛“signal 低于 10”的样本，S_B、S_E 也会被当成低信号样本留下，平均值也会被拉低。
      3. **保留。**不删也不填，后面每一步说明怎样对待缺失，并报告缺了几个。

      这两个方法都返回新的结果，`df` 本身不变。

      选哪一种，取决于**为什么缺**。S_B 是仪器故障，读数根本不存在，填 0 就是编造了一个测量；有些检测里“低于检出限”会按约定记成 0 或某个固定值，那是研究者定下的规则。这些判断属于业务，不属于代码。

      所以[写需求](repa:concept/py12.k1)时，除了筛选条件，还要说清三件事：哪一列的缺失；删除、填补（填什么）还是保留；要不要报告受影响的行数。
    example:
      id: py19.k3.e0
      kind: [predict]
      data: [M]
      body: |
        阅读代码，比较两种处理方式。

        ```python
        low_raw = df.loc[df["signal"] < 10, ["sample_id"]]
        filled = df["signal"].fillna(0)
        low_filled = df.loc[filled < 10, ["sample_id"]]
        kept = df.dropna(subset=["signal"])
        ```
      slots:
        - id: raw
          type: order
          partial: true
          prompt: "`low_raw` 留下了哪些行？按先后顺序排出原行索引。"
          items:
            - { id: "31", content: "31" }
            - { id: "7", content: "7" }
            - { id: "22", content: "22" }
            - { id: "4", content: "4" }
            - { id: "18", content: "18" }
          key: ["31", "22"]
        - id: filled
          type: order
          partial: true
          prompt: "`low_filled` 留下了哪些行？按先后顺序排出原行索引。"
          items:
            - { id: "31", content: "31" }
            - { id: "7", content: "7" }
            - { id: "22", content: "22" }
            - { id: "4", content: "4" }
            - { id: "18", content: "18" }
          key: ["31", "7", "22", "18"]
        - id: kept
          type: text
          format: integer
          prompt: "`kept` 有几行？"
          key: 3
      explanation: |
        `low_raw` 留下 **31、22**：缺失的 S_B、S_E 在比较里得到 False，没有留下。

        `low_filled` 留下 **31、7、22、18**：缺失被填成 0 以后，S_B、S_E 就成了“signal 为 0”的样本，也被当成低信号留下了。这等于替仪器编了两个读数。

        `kept` 有 **3** 行：去掉 signal 缺失的 S_B、S_E，留下 S_A、S_C、S_D。哪一种对，要看需求方怎样看待这两个没有读数的样本。
      verify: |
        r = run()
        answers = {
            "raw": [str(label) for label in r["low_raw"].index],
            "filled": [str(label) for label in r["low_filled"].index],
            "kept": len(r["kept"]),
        }
    practice:
      - id: py19.k3.q1
        kind: [predict, explain]
        uses: [py14.k3]
        data: [M]
        body: |
          阅读代码，写出两行输出。

          ```python
          print(len(df.dropna()))
          print(len(df.dropna(subset=["signal"])))
          ```
        slots:
          - id: first
            type: text
            format: integer
            prompt: 第一行输出
            key: 1
          - id: second
            type: text
            format: integer
            prompt: 第二行输出
            key: 3
          - id: why
            type: choice
            prompt: 第一行为什么把 S_A 也删掉了？
            options:
              - { id: signal, content: S_A 的 signal 缺失 }
              - { id: note, content: S_A 的 note 缺失，不写 subset 时任何一列缺失都会删掉整行 }
              - { id: low, content: S_A 的 signal 太低 }
            key: note
        explanation: |
          第一行 **1**，第二行 **3**。`dropna()` 不写 `subset` 时，只要某一行有任何一列缺失就删掉整行：S_A、S_C 的 note 空着，S_B、S_E 的 signal 空着，只剩 S_D。S_A 的读数是好的，它被删掉只因为**备注没写**。

          写成 `dropna(subset=["signal"])`，只看 signal 这一列，留下 S_A、S_C、S_D。
        verify: |
          lines = run().lines()
          first_kept = run("kept = df.dropna()")["kept"]
          s_a = df.loc[31]
          reason = "note" if 31 not in first_kept.index and pd.notna(s_a["signal"]) and pd.isna(s_a["note"]) else "other"
          answers = {"first": int(lines[0]), "second": int(lines[1]), "why": reason}
      - id: py19.k3.q2
        kind: [specify]
        uses: [py12.k1]
        data: [M]
        body: |
          负责人看了表 M 以后说：“仪器故障和漏测的样本没有读数，不能当成 0，也不参加后面的筛选；S_C 的 0.0 是真实读数，要保留。备注空着不影响什么。最后告诉我去掉了几个样本。”把这条规则填成下面三个字段。
        slots:
          - id: column
            type: choice
            prompt: 按哪一列的缺失处理
            options:
              - { id: signal, content: 只看 signal }
              - { id: note, content: 只看 note }
              - { id: any, content: 任何一列缺失都算 }
            key: signal
          - id: action
            type: choice
            prompt: 缺失的行怎么办
            options:
              - { id: fill0, content: 把缺失填成 0，照常参加筛选 }
              - { id: drop, content: 删除这些行，不参加后面的筛选 }
              - { id: keep, content: 保留原样，不做处理 }
            key: drop
          - id: report
            type: choice
            prompt: 要不要报告受影响的行数
            options:
              - { id: "yes", content: 要，报告删掉了几个样本 }
              - { id: "no", content: 不用 }
            key: "yes"
        explanation: |
