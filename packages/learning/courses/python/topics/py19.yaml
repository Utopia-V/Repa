      - id: py19.k3.r2
        kind: [specify]
        uses: [py12.k1]
        body: |
          负责人确认的规则是：“depth 没有记录的样地不参加平均，但要在报告里写明有几个；其他列缺失不影响。”下面哪一种说法与它完全一致？
        slots:
