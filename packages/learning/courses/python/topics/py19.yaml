          有人要找出“鸟巢少于 3 个”的样地，比较两种处理缺失的方式。

          ```python
          a = birds.dropna(subset=["count"])
          rule_a = a.loc[a["count"] < 3, ["site"]]
          b = birds["count"].fillna(0)
