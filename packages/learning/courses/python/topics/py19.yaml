        explanation: |
          留下索引 **11、13、14、15**，只去掉 reason 为 NaN 的索引 12。空串、一个空格和手打的 `N/A` 都是文字，`notna()` 判为 True。要不要把它们也当成“没有填写”，得由需求说明。
