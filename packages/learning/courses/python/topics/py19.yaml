        slots:
          - id: first
            type: text
            prompt: 第一行输出
            key: float64
          - id: second
            type: text
            match: output
            prompt: 第二行输出
            key: "20.0"
            feedback:
              - when: "20"
                message: 这一列存成了浮点，求和的结果也是浮点，显示为 20.0。
        explanation: |
          第一行 **float64**：原始记录虽然是整数，但有一株没量，整列存成了浮点。第二行 **20.0**：两个有值的高度相加，结果也是浮点。
        verify: |
          lines = run().lines()
          answers = {"first": str(lines[0]), "second": lines[1]}
      - id: py19.k2.r2
        kind: [predict]
