                content: 平均高度 30.0 株，n = 4
              - id: n6
                content: 平均高度 30.0 厘米，n = 6
            key: full
        explanation: |
          “平均高度 30.0 厘米，n = 4，另有 2 株没量到”正确：120.0 厘米除以 4 株量到的幼苗。20.0 是除以全部 6 株的结果；30.0 配上 n = 6 说错了参与计算的株数；“30.0 株”把单位写成了个数。
        verify: |
          h = plants["height"]
          mean, n, missing = h.mean(), h.count(), h.isna().sum()
          # 每个说法写成（均值、单位是否为长度、n、缺失数）。
          claims = {"full": (30.0, True, 4, 2), "rows": (20.0, True, 6, None), "unit": (30.0, False, 4, None), "n6": (30.0, True, 6, None)}
          fits = [option for option, (value, unit_ok, claim_n, claim_missing) in claims.items()
                  if value == mean and unit_ok and claim_n == n and claim_missing == missing]
          answers = {"report": fits[0] if len(fits) == 1 else fits}
      - id: py26.k3.x2
        kind: [explain]
        uses: [py08.k1, py19.k1]
        data: [plants]
        body: |
          要求是：“在量到高度的幼苗中，高度至少 25 厘米的占多少？”哪一段代码符合要求？
        slots:
          - id: code
            type: choice
            options:
              - id: mean_all
                content: |
                  ```python
                  share = (plants["height"] >= 25).mean()
                  ```
              - id: by_len
                content: |
                  ```python
                  share = (plants["height"] >= 25).sum() / len(plants)
                  ```
              - id: by_count
                content: |
                  ```python
                  share = (plants["height"] >= 25).sum() / plants["height"].count()
                  ```
              - id: measured
                content: |
                  ```python
                  share = plants["height"].count() / len(plants)
                  ```
            key: by_count
        explanation: |
          分母用 `plants["height"].count()` 的那一段符合要求：3 株达到 25 厘米，除以量到高度的 4 株，得 0.75。直接对比较结果求 `mean()`，或者除以 `len(plants)`，分母都是全部 6 株，得 0.5；最后一段算的是“量到高度的幼苗占多少”，和 25 厘米无关。
        verify: |
          measured = [value for value in plants["height"].tolist() if value == value]
          target = sum(1 for value in measured if value >= 25) / len(measured)
          fits = [option for option, code in OPTIONS["code"].items() if abs(run(code)["share"] - target) < 1e-9]
          answers = {"code": fits[0] if len(fits) == 1 else fits}
