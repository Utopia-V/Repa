            options:
              - { id: p1, content: "`p1`" }
              - { id: p2, content: "`p2`" }
            key: p2
        explanation: |
          6.0 和 8.0 两个站点达到 5 mg/L。`p1` 的分母是全部 6 个站点，2 / 6 ≈ **0.33**；`p2` 的分母是测到浓度的 4 个站点，2 / 4 = **0.5**。要求写的是“在测到浓度的站点中”，应当报告 **`p2`**，并写明 n = 4。
