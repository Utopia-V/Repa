        data: [water]
        body: |
          负责人想知道浓度至少 5 mg/L 的站点占多少。

          ```python
          p1 = (water["conc"] >= 5).mean()
          p2 = (water["conc"] >= 5).sum() / water["conc"].count()
          ```
        slots:
          - id: p1
            type: text
            format: number
            tolerance: 0.01
            prompt: "`p1` 是多少？（保留两位小数）"
            key: 0.33
          - id: p2
