  - id: py26.k3
    keyPrerequisites: [py19, py02]
    title: 结果的单位与有效样本量
    card:
      name: 有效样本量
      aliases: [n, 分母, 单位]
      definition: 报告一个汇总值时，同时说清单位、实际参与计算的值有几个（有效样本量 n），以及有几个缺失。
      conditions:
        - 均值和原来那一列同单位；count 的单位是“个样本”，不是测量单位。
        - 比例要写明分母：是全部样本，还是测到值的样本。
      example:
        from: py26.k3.e0
        text: |
          表 N：“signal 均值 10.0（任意单位），n = 3，另有 2 个样本缺失。”
    lesson: |
      一个汇总值单独摆出来，别人没法核对。报告时把三样东西写在一起：

      1. **值和单位**：均值和原来那一列同单位，深度的均值还是厘米；count 的单位是“个样本”。
      2. **有效样本量 n**：实际参与计算的值有几个，也就是 count。
      3. **缺了几个**：行数减去 n。

      例如：“signal 均值 10.0（任意单位），n = 3，另有 2 个样本缺失。”

      **比例**最容易弄错分母。要算“signal 至少为 10 的样本占多少”，可能写成：

      ```python
      share = (df["signal"] >= 10).mean()
      ```

      比较得到一列 True/False，对它求 `mean()` 就是 True 所占的比例。但缺失的格子比较出来是 **False**，所以这里的分母是全部 5 行：1 / 5 = 0.2。如果要的是“在测到 signal 的样本中”的比例，分母应是 count：

      ```python
      share = (df["signal"] >= 10).sum() / df["signal"].count()
      ```

      得到 1 / 3，约 0.33。两种分母回答的是两个不同的问题，要求里要写明是哪一个。
    example:
      id: py26.k3.e0
      kind: [explain]
      uses: [py19.k1]
      data: [N]
      body: |
        要在报告里写表 N 的 signal 均值。下面哪句话写得正确、完整？
      slots:
        - id: report
          type: choice
          options:
            - id: rows
              content: signal 均值 6.0（任意单位），n = 5
            - id: n5
              content: signal 均值 10.0（任意单位），n = 5
            - id: full
              content: signal 均值 10.0（任意单位），n = 3，另有 2 个样本缺失
            - id: unit
              content: signal 均值 10.0 个样本，n = 3
          key: full
        - id: n
          type: text
          format: integer
          prompt: 这句报告里的 n 应当是几？
          key: 3
      explanation: |
        “signal 均值 10.0（任意单位），n = 3，另有 2 个样本缺失”正确。均值 10.0 来自 3 个测到的值，n 应是 **3**；写 n = 5 把没测到的也当作参与了计算，6.0 则是除错了分母。“10.0 个样本”把 count 的单位安到了均值上。
      verify: |
        mean, n, missing = df["signal"].mean(), df["signal"].count(), df["signal"].isna().sum()
        # 每个说法写成（均值、单位是否为测量单位、n、缺失数），逐个与算出的结果比较；缺失数没写的记 None。
        claims = {"rows": (6.0, True, 5, None), "n5": (10.0, True, 5, None), "full": (10.0, True, 3, 2), "unit": (10.0, False, 3, None)}
        fits = [option for option, (value, unit_ok, claim_n, claim_missing) in claims.items()
                if value == mean and unit_ok and claim_n == n and claim_missing == missing]
        answers = {"report": fits[0] if len(fits) == 1 else fits, "n": n}
    practice:
      - id: py26.k3.q1
        kind: [debug, predict]
        uses: [py08.k1, py19.k1]
        data: [N]
        body: |
          要求是：“在测到 signal 的样本中，signal 至少为 10 的占多少？”同事写了：

          ```python
          share = (df["signal"] >= 10).mean()
          ```
        slots:
          - id: got
            type: text
            format: number
            prompt: "`share` 是多少？"
            key: 0.2
          - id: denominator
            type: choice
            prompt: 这段代码的分母是什么？
            options:
              - { id: all, content: 全部 5 个样本 }
              - { id: measured, content: 测到 signal 的 3 个样本 }
            key: all
          - id: right
            type: text
            format: number
            tolerance: 0.01
            prompt: 按要求，比例应当是多少？（保留两位小数）
            key: 0.33
        explanation: |
          `share` 是 **0.2**。缺失的两个格子比较出来是 False，`mean()` 按全部 **5 个样本**算：只有索引 22 的 13.0 满足，1 / 5 = 0.2。要求问的是“在测到 signal 的样本中”，分母应是 count 3：1 / 3 ≈ **0.33**，写成 `(df["signal"] >= 10).sum() / df["signal"].count()`。
        verify: |
          share = run()["share"]
          measured = [value for value in df["signal"].tolist() if value == value]
          hits = sum(1 for value in measured if value >= 10)
          answers = {
              "got": share,
              "denominator": "all" if share == hits / len(df) else "measured",
              "right": round(hits / len(measured), 2),
          }
      - id: py26.k3.q2
        kind: [explain]
