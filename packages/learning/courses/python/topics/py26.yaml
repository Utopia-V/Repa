id: py26
title: 汇总前先数清分母
status: complete
minutes: 20
summary: 分清表的行数、一列有值的个数和缺失个数；读懂 sum、mean 默认跳过缺失，以及全缺失时的 0.0 和 NaN；报告汇总值时带上单位、有效样本量和比例的分母。
prerequisites: [py19, py07]
encompassings:
  - {topic: py19, weight: 0.5}
  - {topic: py07, weight: 0.5}
sources:
  - source: pydata-book
    where: 第 5 章 §5.3（汇总与描述统计）
    url: https://wesmckinney.com/book/pandas-basics
    use: reference
  - source: pandas-docs
    where: 入门教程：汇总统计
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/06_calculate_statistics.html
    use: reference
  - source: pandas-docs
    where: 用户指南：缺失值（计算时怎样处理缺失）
    url: https://pandas.pydata.org/docs/user_guide/missing_data.html
    use: reference
notes: |
  范围：只汇总一列，用 len、count、isna().sum()、sum、mean；需要分组时用 py17 的掩码先筛出一组，不用 groupby（py27 承担）。fillna 只作为“把缺失当 0”的对照出现，填补规则本身由 py19.k3 承担；sum 的 min_count 只在讲解里提一句，不出题。布尔列求 sum、mean 的含义在 k1、k3 讲解里就地说明。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 2 分钟、练习 4 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。k3.q2（单位）的两个作答位要靠语义判断，列在 manual 里；它是练习，不强制模型核对。复习和测验题全部由程序核对。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始。大多数题用表 N：`sample_id` 是样本编号，`group` 是实验组，`signal` 是一次测量的值（任意单位）；表里的 NaN 表示这个样本没有测到值，也就是缺失。左边的原行索引是原表的行标签。

  这一节只问一件事：算平均、算比例之前，先数清到底有几个数参与了计算。
wrapup: |
  报告一个汇总值时，把三样东西一起写上：值和它的单位、实际参与计算的个数 n、缺了几个。例如：“signal 均值 10.0（任意单位），n = 3，另有 2 个样本缺失。”

  向同事或 AI 提要求时，比例要写明分母：“在测到 signal 的样本中，signal 至少为 10 的比例”，而不是只说“达标比例”。拿到代码后，先打印 count，再看求和、平均和比例。
