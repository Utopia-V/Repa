kps:
  - id: py26.k1
    keyPrerequisites: [py19]
    title: 行数、count 和非缺失数的区别
    card:
      name: 行数与 count
      aliases: [count, 非缺失个数, len]
      definition: len(df) 数表有几行；df["列"].count() 只数这一列有值（非缺失）的格子；两者之差就是这一列缺失的个数。
      conditions:
        - count 按列各数各的：同一张表里，不同列的 count 可能不同。
        - 缺失个数用 isna().sum() 数；行数 = count + 缺失个数。
      example:
        from: py26.k1.e0
        text: |
          表 N 有 5 行；signal 列 count 为 3，isna().sum() 为 2，3 + 2 = 5。
    lesson: |
      算平均、算比例之前，先回答：一共有几个数参与计算？表 N 有 5 行，但 signal 列只有 3 个格子有值，另外 2 个是 NaN（缺失）。三种“数一数”说的是三件不同的事：

      | 写法 | 数的是什么 | 表 N 的结果 |
      |---|---|---:|
      | `len(df)` 或 `df.shape[0]` | 表有几行 | 5 |
      | `df["signal"].count()` | signal 这一列有值的格子 | 3 |
      | `df["signal"].isna().sum()` | signal 这一列缺失的格子 | 2 |

      `isna()` 逐行给出 True/False（[缺失判断](repa:concept/py19.k1)），对它求 `sum()` 时，True 当作 1、False 当作 0，加起来就是缺失的个数。`notna().sum()` 同理，结果和 `count()` 相同。

      `count` 按列各数各的：`df.count()` 会给出每一列有值的个数，同一张表里 sample_id 可能是 5，signal 只有 3。所以“表里有 5 个样本”不等于“5 个样本测到了 signal”。
    example:
      id: py26.k1.e0
      kind: [predict]
      uses: [py19.k1, py14.k2]
      data: [N]
      body: |
        阅读表 N，写出每个表达式的值。
      slots:
        - id: values
          type: table
          columns:
            - { id: expr, header: 表达式 }
            - { id: value, header: 值, input: integer }
          rows:
            - { id: rows, cells: { expr: "`len(df)`", value: 5 } }
            - { id: count, cells: { expr: "`df[\"signal\"].count()`", value: 3 } }
            - { id: missing, cells: { expr: "`df[\"signal\"].isna().sum()`", value: 2 } }
            - { id: ids, cells: { expr: "`df[\"sample_id\"].count()`", value: 5 } }
      explanation: |
        依次为 **5、3、2、5**。表有 5 行；signal 列有 3 个格子有值、2 个是 NaN，3 + 2 = 5。sample_id 列没有缺失，所以它的 count 是 5：count 只看括号前面那一列。
      verify: |
        answers = {"values": {
            "rows": {"value": len(df)},
            "count": {"value": df["signal"].count()},
            "missing": {"value": df["signal"].isna().sum()},
            "ids": {"value": df["sample_id"].count()},
        }}
    practice:
      - id: py26.k1.q1
        kind: [predict]
        uses: [py19.k1]
        data: [N]
        body: |
          屏幕上依次显示什么？

          ```python
          print(len(df))
          print(df["signal"].count())
          print(df["signal"].notna().sum())
          ```
        slots:
          - id: line1
            type: text
            format: integer
            prompt: 第一行
            key: 5
          - id: line2
            type: text
            format: integer
            prompt: 第二行
            key: 3
            feedback:
              - when: 5
                message: count 只数有值的格子，signal 有两个 NaN。
          - id: line3
            type: text
            format: integer
            prompt: 第三行
            key: 3
        explanation: |
          依次显示 **5、3、3**。`notna()` 在有值的行为 True，求和就是有值的个数，和 `count()` 一样；`len(df)` 数的是行，不管 signal 有没有值。
        verify: |
          lines = run().lines()
          answers = {"line1": int(lines[0]), "line2": int(lines[1]), "line3": int(lines[2])}
      - id: py26.k1.q2
        kind: [predict]
        uses: [py17.k1, py17.k2, py19.k1]
        data: [N]
        body: |
          先筛出 drug 组的 signal，再数一数。逗号后面只写一个列名时，得到的是一列（Series）。

          ```python
          drug = df.loc[df["group"] == "drug", "signal"]
          ```
        slots:
          - id: rows
            type: text
            format: integer
            prompt: "`len(drug)` 是多少？"
            key: 3
          - id: count
            type: text
            format: integer
            prompt: "`drug.count()` 是多少？"
            key: 1
          - id: claim
            type: choice
            prompt: 下面哪句话正确？
            options:
              - id: three
                content: drug 组有 3 个样本测到了 signal
                feedback: 3 是 drug 组的行数，其中两行 signal 是 NaN。
              - id: one
                content: drug 组有 3 个样本，其中只有 1 个测到了 signal
              - id: zero
                content: drug 组没有任何样本测到 signal
            key: one
        explanation: |
          drug 组有 **3** 行（索引 7、22、15），但只有索引 22 测到了值，count 为 **1**。所以正确的说法是“drug 组有 3 个样本，其中只有 1 个测到了 signal”。
        verify: |
          drug = run()["drug"]
          n_rows, n_count = len(drug), drug.count()
          holds = {"three": n_count == 3, "one": n_rows == 3 and n_count == 1, "zero": n_count == 0}
          true = [option for option, ok in holds.items() if ok]
          answers = {"rows": n_rows, "count": n_count, "claim": true[0] if len(true) == 1 else true}
      - id: py26.k1.q3
        kind: [predict]
        uses: [py19.k1]
        data: [N2]
        body: |
          `df.count()` 对每一列分别数有值的格子。写出这张表每一列的结果。
        slots:
          - id: counts
            type: table
            columns:
              - { id: column, header: 列 }
              - { id: count, header: "`df.count()` 里的值", input: integer }
            rows:
              - { id: sample_id, cells: { column: sample_id, count: 4 } }
              - { id: group, cells: { column: group, count: 4 } }
              - { id: signal, cells: { column: signal, count: 2 } }
        explanation: |
          sample_id 和 group 都没有缺失，各为 **4**；signal 有两个 NaN，为 **2**。同一张表，不同列的 count 不一样，所以说“有几个”时要说清是哪一列。
        verify: |
          counts = df.count()
          answers = {"counts": {column: {"count": counts[column]} for column in counts.index}}
    review:
      - id: py26.k1.r1
        kind: [predict, explain]
        uses: [py19.k1, py14.k2]
        data: [soil]
        body: |
          项目负责人想知道：一共有几个采样点，测到深度的有几个，没测到的有几个。
        slots:
          - id: total
            type: text
            format: integer
            prompt: 一共有几个采样点？
            key: 6
          - id: measured
            type: text
            format: integer
            prompt: 测到深度的有几个？
            key: 4
          - id: code
            type: choice
            prompt: 哪一行代码算出的是“测到深度的采样点个数”？
            options:
              - id: len
                content: |
                  ```python
                  n = len(soil)
                  ```
              - id: count
                content: |
                  ```python
                  n = soil["depth"].count()
                  ```
              - id: isna
                content: |
                  ```python
                  n = soil["depth"].isna().sum()
                  ```
              - id: site
                content: |
                  ```python
                  n = soil["site"].count()
                  ```
            key: count
        explanation: |
          一共 **6** 个采样点，测到深度的 **4** 个，另外 2 个没测到。`soil["depth"].count()` 只数 depth 有值的格子；`len(soil)` 和 `soil["site"].count()` 都是 6，数的是采样点；`isna().sum()` 数的是没测到的 2 个。
        verify: |
          measured = int(soil["depth"].notna().sum())
          fits = [option for option, code in OPTIONS["code"].items() if run(code)["n"] == measured]
          answers = {"total": soil.shape[0], "measured": measured, "code": fits[0] if len(fits) == 1 else fits}
      - id: py26.k1.r2
        kind: [explain]
        uses: [py19.k1]
        data: [survey]
        body: |
          判断下面每句话对不对。
        slots:
          - id: claims
            type: table
            columns:
              - { id: claim, header: 说法 }
              - { id: ok, header: 对吗, input: bool }
            rows:
              - { id: c1, cells: { claim: "`len(survey)` 是 5", ok: true } }
              - { id: c2, cells: { claim: "`survey[\"age\"].count()` 是 5", ok: false } }
              - { id: c3, cells: { claim: "`survey[\"city\"].count()` 比 `survey[\"age\"].count()` 大", ok: true } }
              - { id: c4, cells: { claim: "`survey[\"age\"].count()` 加上 `survey[\"age\"].isna().sum()` 等于 `len(survey)`", ok: true } }
        explanation: |
          第 1、3、4 句对，第 2 句错。表有 5 行；age 有 2 个没填，count 是 3；city 只有 1 个没填，count 是 4，比 age 的 3 大。任何一列的 count 加上它的缺失个数，都等于行数。
        verify: |
          age, city = survey["age"], survey["city"]
          answers = {"claims": {
              "c1": {"ok": len(survey) == 5},
              "c2": {"ok": age.count() == 5},
              "c3": {"ok": city.count() > age.count()},
              "c4": {"ok": age.count() + age.isna().sum() == len(survey)},
          }}
    quiz:
      - id: py26.k1.x1
        kind: [predict]
        uses: [py19.k1, py14.k2]
        data: [farm]
        body: |
          屏幕上依次显示什么？

          ```python
          print(farm.shape[0])
          print(farm["yield_kg"].count())
          print(farm.shape[0] - farm["yield_kg"].count())
          ```
        slots:
          - id: line1
            type: text
            format: integer
            prompt: 第一行
            key: 6
          - id: line2
            type: text
            format: integer
            prompt: 第二行
            key: 4
          - id: line3
            type: text
            format: integer
            prompt: 第三行
            key: 2
        explanation: |
          依次显示 **6、4、2**：6 块地，4 块有产量记录，相减得到没有记录的 2 块。
        verify: |
          lines = run().lines()
          answers = {"line1": int(lines[0]), "line2": int(lines[1]), "line3": int(lines[2])}
      - id: py26.k1.x2
        kind: [explain]
        uses: [py19.k1]
        data: [plants]
        body: |
          报告里要写“有高度测量值的幼苗数”。哪个表达式算出的是这个数？
        slots:
          - id: expr
            type: choice
            options:
              - id: isna
                content: |
                  ```python
                  plants["height"].isna().sum()
                  ```
              - id: len
                content: |
                  ```python
                  len(plants)
                  ```
              - id: count
                content: |
                  ```python
                  plants["height"].count()
                  ```
              - id: ncols
                content: |
                  ```python
                  plants.shape[1]
                  ```
            key: count
        explanation: |
          `plants["height"].count()`，结果是 4。`len(plants)` 是 6 株幼苗的总数；`isna().sum()` 是没量到的 2 株；`plants.shape[1]` 是列数 2，和测量值无关。
        verify: |
          measured = sum(1 for value in plants["height"].tolist() if value == value)  # NaN 不等于自己
          fits = [option for option, code in OPTIONS["expr"].items() if run("n = " + code)["n"] == measured]
          answers = {"expr": fits[0] if len(fits) == 1 else fits}

  - id: py26.k2
    keyPrerequisites: [py19, py07]
    title: sum/mean 的缺失处理与全缺失风险
    card:
      name: 跳过缺失
      aliases: [skipna, 均值的分母, 全缺失]
      definition: pandas 的 sum、mean 默认跳过缺失：sum 只加有值的格子，mean 用这个和除以 count，而不是除以行数。
      conditions:
        - 一列全是缺失时，sum 得 0.0、mean 得 NaN；0.0 看起来像真的测量结果，先看 count。
        - 用 fillna(0) 把缺失当成 0，会把均值拉低；能不能这样做是业务规则。
      example:
        from: py26.k2.e0
        text: |
          表 N 的 signal 为 8.0、NaN、13.0、9.0、NaN：sum 为 30.0，mean 为 30.0 / 3 = 10.0，而不是 30.0 / 5 = 6.0。
    lesson: |
      pandas 求和、求平均时，默认跳过缺失：

      - `df["signal"].sum()` 只把有值的格子加起来：8.0 + 13.0 + 9.0 = 30.0。
      - `df["signal"].mean()` 用这个和除以 **count**：30.0 / 3 = 10.0。

      自己写 `df["signal"].sum() / len(df)` 就错了：分母 5 里包括了两个没测到的样本，得到 6.0。把缺失先填成 0 再平均，`df["signal"].fillna(0).mean()`，也是 6.0：这等于说“没测到就是测到 0”。这样做对不对，要看[业务规则](repa:concept/py19.k3)，不能为了算得出数随手填。

      还有一个容易漏看的情况：**一列全是缺失**。这时 `count()` 是 0，`mean()` 是 NaN，而 `sum()` 是 **0.0**。0.0 看起来像一个真的结果，其实是“没有数可加”。所以看到总和为 0 时，先看 count。（pandas 另有 `sum(min_count=1)`，要求至少有 1 个值才求和，否则给 NaN；这里知道有这个开关就够了。）
    example:
      id: py26.k2.e0
      kind: [predict]
      uses: [py19.k1, py07.k2]
      data: [N]
      body: |
        阅读代码，写出三个名字的值。

        ```python
        total = df["signal"].sum()
        avg = df["signal"].mean()
        by_rows = total / len(df)
        ```
      slots:
        - id: total
          type: text
          format: number
          prompt: "`total`"
          key: 30
        - id: avg
          type: text
          format: number
          prompt: "`avg`"
          key: 10
        - id: by_rows
          type: text
          format: number
          prompt: "`by_rows`"
          key: 6
        - id: which
          type: choice
          prompt: 哪一个才是“测到的 signal 的平均值”？
          options:
            - { id: avg, content: "`avg`" }
            - { id: by_rows, content: "`by_rows`" }
          key: avg
      explanation: |
        `total` 是 **30.0**，只加了有值的 8.0、13.0、9.0；`avg` 是 **10.0**，等于 30.0 除以 count 3；`by_rows` 是 **6.0**，把两个没测到的样本也算进了分母。测到的 signal 的平均值是 `avg`。
      verify: |
        r = run()
        measured = [value for value in df["signal"].tolist() if value == value]
        own_mean = sum(measured) / len(measured)
        answers = {
            "total": r["total"],
            "avg": r["avg"],
            "by_rows": r["by_rows"],
            "which": "avg" if r["avg"] == own_mean and r["by_rows"] != own_mean else "by_rows",
        }
    practice:
      - id: py26.k2.q1
        kind: [predict]
        uses: [py17.k1, py17.k2, py19.k1]
        data: [N2]
        body: |
          这批记录里，drug 组的 signal 全都没测到。屏幕上依次显示什么？没有数字时 Python 显示 `nan`。

          ```python
