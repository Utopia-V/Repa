      - id: py26.k3.q3
        kind: [specify]
        body: |
          同事说：“帮我算一下 drug 组 signal 的平均值和达标比例（至少 10 算达标）。”表里有些样本没测到 signal。

          请写一段可核对的要求，说清：① 平均值用哪些值算；② 达标比例的分母是什么；③ 报告里除了这两个数还要附上什么。
        slots:
          - id: spec
            type: text
            lines: 6
            rubric:
              - id: mean
                label: 平均值用哪些值
                guide: 写明只用测到 signal 的样本（跳过缺失），或明确提出要不要把缺失按某种规则处理并请对方确认；不能默认把缺失当 0。
              - id: denominator
                label: 比例的分母
                guide: 写明分母是“drug 组测到 signal 的样本数”还是“drug 组全部样本数”，并说明等于 10 的算达标。
              - id: report
                label: 附上的信息
                guide: 要求附上有效样本量 n（参与计算的个数）和缺失个数，必要时附单位。
        explanation: |
          一种写法：**在 drug 组中，只用测到 signal 的样本：报告 signal 的平均值；再报告 signal 大于或等于 10 的样本占“drug 组测到 signal 的样本”的比例。两个数都附上参与计算的样本数 n 和 drug 组缺失的样本数。**

          如果你认为分母应当是 drug 组全部样本，也可以，但要写明，并说清没测到的样本按“未达标”计；关键是别人照做时不用猜分母。
    review:
      - id: py26.k3.r1
        kind: [debug]
