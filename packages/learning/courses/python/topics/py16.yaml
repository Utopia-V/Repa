id: py16
title: 取列、取行，先辨认用的是哪种索引
status: complete
minutes: 20
summary: 分清 df["列"] 和 df[["列", …]] 取出的形状；loc 按标签、iloc 按位置取行和值；同样写 2:4，loc 包含右端、iloc 不包含。
