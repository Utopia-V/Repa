notes: |
  建议题型与判分：预测输出（P）、找错（P）、解释代码（S/O）。
  loc 与 iloc 的差异先用唯一、已排序标签的小表讨论切片，不引入重复索引或非单调标签的特殊情况。
  范围：k1 只讲 df["列"] 与 df[["列", ...]]；k2 用 loc/iloc 取单个值和单行（单行得到 Series，只说“取到一行”，不展开它的结构）；k3 只切行，不切列。布尔掩码和 df.loc[掩码, 列名列表] 留给 py17。
  k2 沿用 py14、py17 的表 T（行索引 31、7、22、4，不按大小），让标签和位置明显分开；k3 按备注用唯一、排好序的标签：daily 的行索引是第几天，从 1 开始，所以标签和位置差 1；samples 用 S01 这样的文字标签。代码题的隐藏测试换一张标签起点不同的表，照着位置写死的答案过不了。
  NumPy 2 下，交互窗口显示 pandas 取出的单个整数是 np.int64(13) 而不是 13，所以取值题用文字格（按文字比较）问“值是多少”，不用 WWPD 的显示比较；WWPD 只问 shape、列名列表这类显示稳定的东西。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 2 分钟、练习 3 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  这一节从表里取出需要的列、行和值。宿主已经准备好 pandas 和数据表，题面最前面会显示要用的表；每道题都从题面的表重新开始。

  很多题用表 T。它左边的行索引是 31、7、22、4，是每一行的标签，不是从 0 开始的序号；这一节的关键就是分清“标签”和“第几个”。有些题用交互窗口的形式：`>>>` 后面是输入，什么也不显示填 NOTHING，报错填 ERROR。
wrapup: |
  读到取数据的代码，先认写法：`df["列"]` 是一列，`df[["列", …]]` 是一张表；`loc` 用标签和列名，`iloc` 用从 0 开始的位置；切片时 loc 包含右端，iloc 不包含。

  向 AI 描述要哪几行时，说清是“行索引为 22 的样本”还是“表里的第 3 行”，是“第 2 天到第 5 天，含第 5 天”还是“前 4 行”。这两种说法在表经过筛选、排序以后会指向不同的行。
