      - id: py16.k3.x2
        kind: [predict, debug]
        data: [samples]
        body: |
          需求：取出样本 S02 到 S04（含 S04）的记录。你和同事各写了一行，都在题面的表 samples（编号 S01 到 S05）上试过，取到的都是 S02、S03、S04：

          甲：

          ```python
          result = samples.loc["S02":"S04"]
          ```

          乙：

          ```python
          result = samples.iloc[1:4]
          ```

          下一批样本的表也叫 samples，但编号从 S02 开始：

          | 行索引 | signal | group |
          |---|---:|---|
          | S02 | 7 | drug |
          | S03 | 12 | control |
          | S04 | 9 | drug |
          | S05 | 15 | control |
          | S06 | 6 | drug |

          把这两行代码用在下一批上，各会取到哪几个样本？
        slots:
          - id: a
            type: order
            partial: true
            prompt: 甲取到的样本，按先后排列。
            items:
              - { id: S02, content: S02 }
              - { id: S03, content: S03 }
              - { id: S04, content: S04 }
              - { id: S05, content: S05 }
              - { id: S06, content: S06 }
            key: [S02, S03, S04]
          - id: b
            type: order
            partial: true
            prompt: 乙取到的样本，按先后排列。
            items:
              - { id: S02, content: S02 }
              - { id: S03, content: S03 }
              - { id: S04, content: S04 }
              - { id: S05, content: S05 }
              - { id: S06, content: S06 }
            key: [S03, S04, S05]
          - id: safe
            type: choice
            prompt: 要“按编号取 S02 到 S04”，换一批样本也不出错的是哪一行？
            options:
              - { id: a, content: 甲，用 loc 按编号取 }
              - { id: b, content: 乙，用 iloc 按位置取 }
            key: a
        explanation: |
          需求说的是编号，编号是行索引的标签，用 `loc`，右端 S04 也包含在内：甲换一批仍取到 **S02、S03、S04**。

          乙按位置取，位置 1 到 3（不含 4）。在第一批里位置 1 到 3 碰巧就是 S02 到 S04；下一批的位置 0 是 S02，位置 1 到 3 变成 **S03、S04、S05**：少了 S02，多了 S05。试一次得到想要的结果，不等于写法在换批次之后还对。
        verify: |
          batch = pd.DataFrame({"signal": [7, 12, 9, 15, 6], "group": ["drug", "control", "drug", "control", "drug"]},
                               index=["S02", "S03", "S04", "S05", "S06"])
          first = run(BLOCKS[0], samples=samples)["result"]
          second = run(BLOCKS[1], samples=samples)["result"]
          assert list(first.index) == list(second.index) == ["S02", "S03", "S04"]
          a = run(BLOCKS[0], samples=batch)["result"]
          b = run(BLOCKS[1], samples=batch)["result"]
          want = ["S02", "S03", "S04"]
          answers = {
              "a": list(a.index),
              "b": list(b.index),
              "safe": "a" if list(a.index) == want and list(b.index) != want else "b",
          }
