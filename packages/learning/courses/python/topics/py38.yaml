      - id: py38.k1.q2
        kind: [debug]
        body: |
          ```python startLine=1
          row = ("S_D", 10, "control")
          sid, signal = row
          print(sid)
          ```
        slots:
          - id: result
            type: choice
            prompt: 运行这段程序会怎样？
            options:
              - id: drops_extra
                content: 显示 S_D，多出来的 "control" 被丢掉
                feedback: 解包不会悄悄丢掉多出来的元素，个数对不上就报错。
              - id: shows_pair
                content: 显示 ('S_D', 10)
              - id: value_error
                content: 第 2 行报 ValueError，什么也不显示
              - id: name_error
                content: 第 3 行报 NameError，因为 sid 没有值
            key: value_error
          - id: fix
            type: choice
            prompt: 第 2 行改成哪一行，程序就能显示 S_D，并让 signal 指向 10？
            options:
              - id: first_only
                content: |
                  ```python
                  sid, signal = row[0]
                  ```
              - id: three_names
                content: |
                  ```python
                  sid, signal, group = row
                  ```
              - id: skip_middle
                content: |
                  ```python
                  sid, signal = row[0], row[2]
                  ```
            key: three_names
        explanation: |
          元组有 3 个元素，左边只写了 2 个名字，个数对不上，**第 2 行报 ValueError**，程序在这里停下，后面的 `print` 不会运行。

          改成 `sid, signal, group = row`，三个名字对三个元素就行了。`row[0]` 是一段文字 `"S_D"`，拆给两个名字也对不上，同样报错；`row[0], row[2]` 能运行，但 `signal` 拿到的是 `"control"`，不是 10。
        verify: |
          r = run()
          if r.error == "ValueError" and r.out == "":
              result = "value_error"
          elif r.error == "NameError":
              result = "name_error"
          elif r.error is None and r.out.strip() == "S_D":
              result = "drops_extra"
          else:
              result = "shows_pair"
          lines = CODE.splitlines()
          fits = []
          for option, code in OPTIONS["fix"].items():
              tried = run("\n".join([lines[0], code.strip(), lines[2]]))
              if tried.error is None and tried.out.strip() == "S_D" and tried.vars.get("signal") == 10:
                  fits.append(option)
          answers = {"result": result, "fix": fits[0] if len(fits) == 1 else fits}
