                cells: { line: 第 3 行, low: 8, high: 13 }
          - id: output
            type: text
            match: output
            prompt: 第 4 行显示什么？（两个数之间隔一个空格）
            key: "8 13"
        explanation: |
          | 执行到 | low | high |
          |---|---:|---:|
          | 第 1 行 | 13 | 尚未定义 |
          | 第 2 行 | 13 | 8 |
          | 第 3 行 | 8 | 13 |

          第 3 行先算出右边的元组 (8, 13)，用的是交换前的值，再依次交给 `low` 和 `high`，所以两个值互换了，第 4 行显示 **8 13**。
