  - id: py38.k3
    title: zip 配对并留意长度不同时的截断
    card:
      name: zip 配对
      aliases: [zip, 配对]
      definition: "`zip(甲, 乙)` 按位置把两个列表的元素配成一对对元组：第 0 个配第 0 个，第 1 个配第 1 个，依此类推。"
      conditions:
        - 两个列表长度不同时，配到短的那个用完就停，多出的元素被悄悄丢掉，不报错。
        - zip 只看位置，不看内容；两份列表的顺序对不上，配出来的就是错的。加 `strict=True` 时长度不同会报 ValueError。
      example:
        from: py38.k3.e0
        text: |
          ```python
          ids = ["S_A", "S_B", "S_C", "S_D"]
          signals = [8, 10, 13]
          pairs = list(zip(ids, signals))
          ```
          pairs 是 [('S_A', 8), ('S_B', 10), ('S_C', 13)]，S_D 没有配上，被丢掉了，程序也没有报错。
    lesson: |
      样本编号和测量值常常分放在两个列表里，位置一一对应。`zip` 把它们按位置配成对：

      ```python
      ids = ["S_A", "S_B", "S_C"]
      signals = [8, 10, 13]
      for sid, v in zip(ids, signals):
          print(sid, v)
      ```

      显示 `S_A 8`、`S_B 10`、`S_C 13`。每一轮 `zip` 给出一个元组（ids 的第 i 个, signals 的第 i 个），`sid, v` 再把它解包。想一次看到全部配对，可以写 `list(zip(ids, signals))`，得到 `[('S_A', 8), ('S_B', 10), ('S_C', 13)]`。

      读 `zip` 的代码时要留意两件事：

      1. **只按位置配，不看内容。** 如果 `signals` 是按测量先后记的，顺序和 `ids` 不一样，`zip` 照样一对一配上，配出来的就是错的。
      2. **长度不同时悄悄截断。** 两个列表一长一短时，配到短的那个用完就停，长的那个多出来的元素直接丢掉，程序不报错。4 个编号配 3 个值，只得到 3 对，第 4 个样本从结果里消失了。

      两份数据本该一样长时，可以写 `zip(ids, signals, strict=True)`：长度不同就报 `ValueError`，不让记录悄悄丢失。写在 `for` 里时，前面能配上的几对会先照常处理，走到短的一边用完时才报错。
    example:
      id: py38.k3.e0
      kind: [predict]
      body: |
        ```python startLine=1
        ids = ["S_A", "S_B", "S_C", "S_D"]
        signals = [8, 10, 13]
        pairs = list(zip(ids, signals))
        print(pairs)
        print(len(pairs))
        ```
