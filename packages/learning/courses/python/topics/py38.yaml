            prompt: 应该用哪一行？
            options:
              - id: swapped
                content: |
                  ```python
                  pairs = list(zip(signals, ids))
                  ```
              - id: strict
                content: |
                  ```python
                  pairs = list(zip(ids, signals, strict=True))
                  ```
              - id: plain
                content: |
                  ```python
                  pairs = list(zip(ids, signals))
                  ```
            key: strict
          - id: lost
            type: text
            format: integer
            prompt: 如果 `ids` 有 5 个、`signals` 有 4 个，用不加 strict 的那一行，`pairs` 里有几对？
            key: 4
        explanation: |
          用 `zip(ids, signals, strict=True)`：长度相同时照常配对，长度不同时报 ValueError。另外两行在长度不同时都悄悄截断，只是每对里的先后不同。

          不加 strict 时，5 个编号配 4 个值只得到 **4** 对，第 5 个样本不见了，也没有任何提示。
        verify: |
          equal = {"ids": ["S_A", "S_B"], "signals": [8, 10]}
          unequal = {"ids": ["S_A", "S_B", "S_C"], "signals": [8, 10]}
          fits = [option for option, code in OPTIONS["line"].items()
                  if run(code, **equal).error is None and run(code, **unequal).error == "ValueError"]
          answers = {"line": fits[0] if len(fits) == 1 else fits, "lost": len(list(zip(range(5), range(4))))}
