notes: |
  范围：纯 Python 短脚本，不用 pandas。只用元组的建立、按位置取值和解包，不讲元组的方法、单元素元组和嵌套解包；enumerate 只讲 start 参数；zip 只配两个列表，strict=True 只讲“长度不同时报 ValueError”。py10 的 if 不是本节先修，循环体里不用 if；追加元素的 append 在 py36，本节也不用。
  循环的说法沿用 py35：for 下面缩进的几行是循环体，每轮取出一个元素做一遍。print 里用逗号隔开几个值、显示时中间隔一个空格，在 k2 讲解里就地说明。
  zip 加 strict=True 写在 for 里时，会先处理完能配上的几对，走到短的一边用完时才报错；讲解里提一句，题目只在 x1 的第二问里用到“先显示能配上的几行”。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  情境沿用 py12、py17 的样本编号、signal、site、depth；例子、数据和题目为本课自拟。
intro: |
  一个样本常常同时带着几样信息：编号、测量值、组别。前面学过用 `for` 从列表里逐个取出元素，这一节看三件相关的事：

  - 怎样把几个值装在一起，再一次拆给几个名字（元组和解包）；
  - 循环时怎样同时知道“这是第几个”和“它的值”（`enumerate`）；
  - 编号和测量值分放在两个列表里时，怎样按位置把它们配成对（`zip`），以及两个列表不一样长时会发生什么。

  下面的程序都当作短脚本，从第一行往下运行。
wrapup: |
  读到 `a, b = ...`，先数左右两边的个数是否对得上；读到 `enumerate`，先看编号从 0 还是从 1 开始；读到 `zip`，先确认两个列表的顺序一一对应、长度相同。

  请 AI 写这类代码时，可以直接要求：“编号和测量值按位置一一对应，长度不同时报错，不要悄悄丢掉多出来的记录。”
data:
  reading:
    kind: python
    code: |
      reading = ("S_A", 8, "control")
    display: |
      准备代码：

      ```python
      reading = ("S_A", 8, "control")
      ```
kps:
  - id: py38.k1
    title: 元组及解包的数量对应
    card:
      name: 元组解包
      aliases: [元组, tuple, 解包]
      definition: 用逗号把几个值写在一起就是元组；`a, b = 元组` 按位置把元素依次交给左边的名字，名字的个数必须和元素的个数相同。
      conditions:
        - 左边的名字比元素多或少，都会报 ValueError，不会自动补上空值，也不会丢掉多余的元素。
        - "`a, b = b, a` 先算出右边的整个元组，再依次赋值，所以一行就能交换两个值。"
      example:
        from: py38.k1.e0
        text: |
          ```python
          record = ("S_B", 10)
          sid, value = record
          ```
          第 2 行让 sid 指向 "S_B"、value 指向 10，等同于 `sid = record[0]` 和 `value = record[1]` 两行。
    lesson: |
      一个样本的编号和测量值可以写在一起：

      ```python
      record = ("S_A", 8)
      ```

      圆括号里用逗号隔开的几个值叫**元组**（tuple）。它和列表一样按位置取值，`record[0]` 是 `"S_A"`，`record[1]` 是 8，`len(record)` 是 2。区别是元组建好以后不能改动里面的元素，这一节只读它，不改它。

      想把元组里的值分别交给几个名字，可以一行写完，这叫**解包**：

      ```python
      sid, value = record
      ```

      左边第一个名字拿第 0 个元素，第二个名字拿第 1 个元素，效果和 `sid = record[0]`、`value = record[1]` 两行相同。

      解包要求**个数对得上**：元组有 3 个元素，左边就要写 3 个名字。写少了或写多了，Python 都会报 `ValueError`，不会自己补一个空值，也不会悄悄丢掉多出来的元素。只写一个名字 `whole = record` 不算解包，`whole` 拿到的是整个元组。

      还记得用 `a = b`、`b = a` 交换两个值会失败吗？（见[重新赋值](repa:concept/py01.k2)）写成 `a, b = b, a` 就能交换：Python 先算出右边的元组（b 现在的值, a 现在的值），再依次交给 `a` 和 `b`，赋值时用的都是交换前的值。
    example:
      id: py38.k1.e0
      kind: [predict, explain]
      uses: [py06.k2, py01.k1]
      body: |
        阅读下面的程序。

        ```python startLine=1
        record = ("S_B", 10)
        sid, value = record
        print(sid)
        print(value + 1)
        ```
      slots:
        - id: first
          type: text
          prompt: 第一行显示什么？
          key: S_B
        - id: second
          type: text
          format: integer
          prompt: 第二行显示哪个整数？
          key: 11
        - id: same
          type: choice
          prompt: 第 2 行的效果和哪两行赋值相同？
          options:
            - id: swapped
              content: |
                ```python
                sid = record[1]
                value = record[0]
                ```
            - id: whole
              content: |
                ```python
                sid = record
                value = record
                ```
            - id: by_position
              content: |
                ```python
                sid = record[0]
                value = record[1]
                ```
          key: by_position
      explanation: |
        第一行显示 **S_B**，第二行显示 **11**。第 2 行按位置解包：`sid` 拿第 0 个元素 `"S_B"`，`value` 拿第 1 个元素 10，所以它和 `sid = record[0]`、`value = record[1]` 两行效果相同。第 4 行先算 10 + 1，再显示 11。

        把位置反过来，`sid` 会拿到 10；让两个名字都等于 `record`，它们拿到的都是整个元组，不是其中一个值。
      verify: |
        r = run()
        lines = r.lines()
        # 逐个运行选项，和解包的效果比较；用两个不同的元组，避免碰巧相同。
        fits = []
        for option, code in OPTIONS["same"].items():
            same = True
            for record in [("S_B", 10), ("X_Q", 3)]:
                unpacked = run("sid, value = record", record=record)
                tried = run(code, record=record)
                if tried.error or tried.vars.get("sid") != unpacked["sid"] or tried.vars.get("value") != unpacked["value"]:
                    same = False
            if same:
                fits.append(option)
        answers = {"first": lines[0], "second": int(lines[1]), "same": fits[0] if len(fits) == 1 else fits}
