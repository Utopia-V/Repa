  - id: py38.k2
    title: enumerate 给元素配位置
    card:
      name: enumerate
      aliases: [编号, 序号]
      definition: "`for i, v in enumerate(列表):` 每轮同时拿到位置 i 和元素 v；i 默认从 0 开始，写 `start=1` 才从 1 开始。"
      conditions:
        - start 只改变编号从几开始，不会跳过元素，也不改变取元素的顺序。
        - 报告里的“第 1 个”通常从 1 数；把默认从 0 起的编号直接写进报告，会差 1。
      example:
        from: py38.k2.e0
        text: |
          ```python
          ids = ["S_A", "S_B", "S_C"]
          for i, sid in enumerate(ids):
              print(i, sid)
          ```
          依次显示 0 S_A、1 S_B、2 S_C；写成 `enumerate(ids, start=1)` 才显示 1 S_A、2 S_B、3 S_C。
    lesson: |
      `for sid in ids:` 每轮只拿到一个元素。想同时知道它是第几个，用 `enumerate`：

      ```python
      ids = ["S_A", "S_B", "S_C"]
      for i, sid in enumerate(ids):
          print(i, sid)
      ```

      `print` 里用逗号隔开几个值时，会依次显示它们，中间隔一个空格。这段程序显示：

      | 第几轮 | i | sid | 显示 |
      |---|---:|---|---|
      | 1 | 0 | S_A | `0 S_A` |
      | 2 | 1 | S_B | `1 S_B` |
      | 3 | 2 | S_C | `2 S_C` |

      `enumerate` 每轮给出一个（位置, 元素）元组，`i, sid` 就是上一个知识点的解包。位置默认**从 0 开始**，和列表的索引一致，所以 `ids[i]` 就是这一轮的 `sid`。

      要写给人看的“第 1 个、第 2 个”，就写 `enumerate(ids, start=1)`，编号从 1 开始。`start` 只改编号，不会跳过 S_A：仍然是三轮，依次显示 `1 S_A`、`2 S_B`、`3 S_C`。

      常见的差 1 错误有两种：把从 0 起的编号当成“第几个”写进报告；或者编号改成从 1 起之后，又拿它当索引去取 `ids[i]`，取到的是下一个元素。
