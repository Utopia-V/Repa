        explanation: |
          第一行显示 **drug**，第二行显示 **10**。三个名字按位置拿值：`sid` 是 `"S_C"`，`signal` 是 13，`group` 是 `"drug"`；第 4 行算 13 - 3 得到 10。
        verify: |
