    review:
      - id: py38.k1.r1
        kind: [explain]
        uses: [py01.k2]
        body: |
          开始时 `first` 是 3，`second` 是 5。下面哪几段程序运行后，`first` 变成 5、`second` 变成 3？选出所有符合的。
        slots:
          - id: ways
            type: choice
            multiple: true
            scoring: options
            options:
              - id: one_line
                content: |
                  ```python
                  first, second = second, first
                  ```
              - id: two_lines
                content: |
                  ```python
                  first = second
                  second = first
                  ```
              - id: same_order
                content: |
                  ```python
                  first, second = first, second
                  ```
              - id: helper
                content: |
                  ```python
                  temp = first
                  first = second
                  second = temp
                  ```
            key: [one_line, helper]
        explanation: |
          一行写成 `first, second = second, first` 的能交换：右边先算出 (5, 3)，再依次交给两个名字。借助 `temp` 先存下旧的 `first`，再分三行赋值，也能交换。

          分两行写 `first = second`、`second = first` 不行：第一行之后 `first` 已经是 5，第二行读到的也是 5，两个名字都成了 5。`first, second = first, second` 右边的顺序没变，两个值原样不动。
        verify: |
          fits = []
