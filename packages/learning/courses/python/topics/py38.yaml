        第一行显示 **[('S_A', 8), ('S_B', 10), ('S_C', 13)]**，第二行显示 **3**。`signals` 只有 3 个值，配到第 3 对就停了；S_D 没有出现在结果里，也**没有报错**。`zip` 不会用 None 补齐短的一边。
