  - id: py43.k2
    title: with 管理文本文件及编码
    card:
      name: with 打开文件
      aliases: [open, encoding, 编码]
      definition: '用 with open(路径, encoding="utf-8") as f 打开文件，在下面缩进的几行里读写，离开缩进时文件自动关闭；encoding 说明文件里的字节按哪种编码变成文字。'
      conditions:
        - 读要写在 with 的缩进里；离开后再用 f 读会报 ValueError，但已经读出来的文字变量照样能用。
        - 编码要和文件保存时一致：按 UTF-8 读 GBK 文件会报 UnicodeDecodeError，用错的编码也可能不报错、只读出乱码。
      example:
        from: py43.k2.e0
        text: |
          ```python
          with open("notes/plate1.txt", encoding="utf-8") as f:
              text = f.read()
          print(text.strip())
          ```
          在缩进里读出整段文字，离开 with 后文件已关闭，text 仍可以用。
    lesson: |
      读一个文本文件，常见的写法是：

      ```python
      with open("notes/plate1.txt", encoding="utf-8") as f:
          text = f.read()
      print(text)
      ```

      - `open(...)` 打开文件，`as f` 给打开的文件起名叫 `f`。
      - `with` 那一行以冒号结尾，下面**缩进**的几行属于它。在这几行里，文件是打开的；离开缩进，文件就自动关上了。
      - `f.read()` 把整个文件读成一段文字（字符串）。读出来的 `text` 是普通的字符串，文件关了它也还在。

      离开缩进以后再写 `f.read()`，文件已经关了，会报 **ValueError**。

      **编码**说明文件里存的字节怎样变成文字。现在大多数文件用 UTF-8；但中文 Windows 上的旧版记事本、一些仪器软件或用 Excel 另存的 CSV，常常用 GBK。编码对不上时：

      - 按 UTF-8 读 GBK 文件，通常报 **UnicodeDecodeError**；
      - 按某些编码读，不报错，却读出一堆乱码，更难发现。

      不写 `encoding` 时，Python 用这台电脑的默认编码。在中文 Windows 上它常常不是 UTF-8，于是同一段代码换一台电脑可能读出不同的结果。所以读写文字文件时把 `encoding` 写清楚；遇到 UnicodeDecodeError，先问清文件是用什么编码保存的，再改成对应的 `encoding="gbk"` 之类。
    example:
      id: py43.k2.e0
      kind: [predict]
      uses: [py05.k2]
      data: [note_plate1]
      body: |
        阅读程序，写出它显示的内容。

        ```python
        with open("notes/plate1.txt", encoding="utf-8") as f:
            text = f.read()
        print(text.strip())
        ```

        如果把最后一行改成在缩进外面直接读文件：

        ```python
        with open("notes/plate1.txt", encoding="utf-8") as f:
            text = f.read()
        print(f.read())
        ```
      slots:
        - id: output
          type: text
          prompt: 第一段程序显示什么？
          key: 批次 P1，共 4 个样本
        - id: after
          type: choice
          prompt: 第二段程序的最后一行会怎样？
          options:
            - { id: same, content: 再显示一次同样的文字 }
            - { id: blank, content: 显示一个空行 }
            - { id: ValueError, content: 报 ValueError，文件已经关了 }
          key: ValueError
      explanation: |
        第一段显示 **批次 P1，共 4 个样本**。`f.read()` 在缩进里读出整行文字，`strip()` 去掉末尾的换行。

        第二段的最后一行在缩进外面，这时文件已经自动关上，`f.read()` 报 **ValueError**。要用文件内容，就在缩进里先读进一个名字（这里是 `text`），出来以后用这个名字。
      verify: |
        answers = {"output": run(BLOCKS[0]).lines()[0], "after": run(BLOCKS[1]).error}
