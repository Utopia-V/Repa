kps:
  - id: py43.k1
    title: Path 与相对路径的基准
    card:
      name: 相对路径
      aliases: [工作目录, Path]
      definition: 不以盘符或根目录开头的路径是相对路径；Python 从当前工作目录出发找它，而不是从脚本或 notebook 文件所在的位置。
      conditions:
        - notebook 的工作目录通常是它所在的文件夹；在命令行运行脚本时，是你输入命令时所在的文件夹。
        - Path("data") / "plate1.csv" 只是拼出一个路径；文件在不在，要用 .exists() 去查。
      example:
        from: py43.k1.e0
        text: |
          ```python
          p = Path("data") / "plate1.csv"
          ```
          p.name 是 plate1.csv，p.suffix 是 .csv；工作目录下的 data 文件夹里有这个文件时，p.exists() 为 True。
    lesson: |
      电脑上每个文件都有一条**路径**。从盘符写起的叫绝对路径，例如 `C:\Users\lin\project\data\plate1.csv`；像 `data/plate1.csv` 这样不从盘符写起的叫**相对路径**。

      相对路径要接在某个文件夹后面才完整。Python 接的是**当前工作目录**，而不是你的脚本或 notebook 文件放在哪里：

      - 在 notebook 里，工作目录通常就是这个 notebook 所在的文件夹；
      - 在命令行里运行脚本时，工作目录是你输入命令时所在的文件夹。脚本放在 `scripts` 子文件夹里，不会让路径从 `scripts` 算起。

      所以同一行 `open("data/plate1.csv")`，换一个工作目录运行，找的就是另一个文件，可能报 FileNotFoundError，也可能悄悄打开了另一份同名的旧文件。

      标准库 pathlib 里的 `Path` 用来拼路径和查看路径的各个部分：

      ```python
      from pathlib import Path
      p = Path("data") / "plate1.csv"
      ```

      `/` 在这里不是除法，而是把两段接成一条路径。`p.name` 是最后一段 `plate1.csv`，`p.suffix` 是扩展名 `.csv`，`p.parent` 是上一层 `data`。拼路径不会去检查文件在不在；要查，用 `p.exists()`，它从工作目录出发去找，得到 True 或 False。

      在 Windows 上 `print(p)` 显示的是 `data\plate1.csv`，课程的运行环境里显示 `data/plate1.csv`，意思一样。写代码时用 `/` 拼接就好，Windows 上也认。
    example:
      id: py43.k1.e0
      kind: [predict]
      uses: [py13.k1]
      data: [plates]
      body: |
        阅读程序，写出第 3–6 行各显示什么。

        ```python startLine=1
        from pathlib import Path
        p = Path("data") / "plate1.csv"
        print(p.name)
        print(p.suffix)
        print(p.exists())
        print((Path("data") / "plate3.csv").exists())
        ```
      slots:
        - id: output
          type: table
          label: 各行显示
          columns:
            - { id: line, header: 代码行 }
            - { id: shown, header: 显示, input: text }
          rows:
            - { id: l3, cells: { line: 第 3 行, shown: plate1.csv } }
            - { id: l4, cells: { line: 第 4 行, shown: .csv } }
            - { id: l5, cells: { line: 第 5 行, shown: "True" } }
            - { id: l6, cells: { line: 第 6 行, shown: "False" } }
        - id: where
          type: choice
          prompt: "`p.exists()` 去哪里找 `data` 文件夹？"
          options:
            - { id: cwd, content: 当前工作目录 }
            - { id: install, content: Python 程序安装的位置 }
            - { id: anywhere, content: 整台电脑上所有叫 data 的文件夹 }
          key: cwd
      explanation: |
        依次显示 **plate1.csv**、**.csv**、**True**、**False**。

        `p.name` 是路径的最后一段，`p.suffix` 是扩展名。`p.exists()` 从当前工作目录出发，去找 `data` 文件夹里的 `plate1.csv`，找到了，所以是 True；`plate3.csv` 不存在，第 6 行显示 False。第 2 行只是拼出路径，不会因为文件不存在而报错。
      verify: |
        lines = run().lines()
        answers = {"output": {f"l{number}": {"shown": text} for number, text in zip(range(3, 7), lines)}}
      manual: [where]
    practice:
      - id: py43.k1.q1
        kind: [predict]
        uses: [py13.k1]
        body: |
          林老师在 Windows 上打开 `C:\Users\lin\project\analysis.ipynb`，这个 notebook 的工作目录是 `C:\Users\lin\project`。下面这行代码指向哪个文件？

          ```python
          p = Path("data") / "plate1.csv"
          ```
        slots:
          - id: file
            type: choice
            options:
              - id: home
                content: '`C:\Users\lin\data\plate1.csv`'
              - id: flat
                content: '`C:\Users\lin\project\plate1.csv`'
                feedback: 中间还有一层 data 文件夹。
              - id: project
                content: '`C:\Users\lin\project\data\plate1.csv`'
              - id: drive
                content: '`C:\data\plate1.csv`'
                feedback: 相对路径接在工作目录后面，不是从盘符开始。
            key: project
        explanation: |
          指向 `C:\Users\lin\project\data\plate1.csv`：把相对路径 `data\plate1.csv` 接在工作目录 `C:\Users\lin\project` 后面。
        verify: |
          from pathlib import PureWindowsPath
          target = PureWindowsPath(r"C:\Users\lin\project") / "data" / "plate1.csv"
          candidates = {
              "home": PureWindowsPath(r"C:\Users\lin\data\plate1.csv"),
              "flat": PureWindowsPath(r"C:\Users\lin\project\plate1.csv"),
              "project": PureWindowsPath(r"C:\Users\lin\project\data\plate1.csv"),
              "drive": PureWindowsPath(r"C:\data\plate1.csv"),
          }
          fits = [option for option, path in candidates.items() if path == target]
          answers = {"file": fits[0] if len(fits) == 1 else fits}
      - id: py43.k1.q2
        kind: [debug]
        uses: [py13.k1, py11.k2]
        body: |
          林老师把 notebook 挪进了 `C:\Users\lin\project\notebooks\` 文件夹，工作目录也随之变成这个文件夹。数据没有动，仍在 `C:\Users\lin\project\data\plate1.csv`。原来能运行的代码现在出了问题：

          ```python startLine=1
          from pathlib import Path
          p = Path("data") / "plate1.csv"
          print(p.exists())
          f = open(p)
          ```

          `open(p)` 打开这个文件，下一个知识点再细讲。
        slots:
          - id: looked
            type: choice
            prompt: Python 现在去找的是哪个文件？
            options:
              - id: notebooks
                content: '`C:\Users\lin\project\notebooks\data\plate1.csv`'
              - id: project
                content: '`C:\Users\lin\project\data\plate1.csv`'
                feedback: 这是文件真正的位置，但工作目录已经变成 notebooks 文件夹了。
              - id: home
                content: '`C:\Users\lin\data\plate1.csv`'
            key: notebooks
          - id: exists
            type: choice
            prompt: 第 3 行显示什么？
            options:
              - { id: "True", content: "True" }
              - { id: "False", content: "False" }
            key: "False"
          - id: error
            type: text
            prompt: 第 4 行报的是哪种异常？写出异常类型的名字。
            key: FileNotFoundError
        explanation: |
          相对路径 `data\plate1.csv` 现在接在 `C:\Users\lin\project\notebooks` 后面，Python 去找 `C:\Users\lin\project\notebooks\data\plate1.csv`。那里没有这个文件，所以第 3 行显示 **False**，第 4 行报 **FileNotFoundError**。

          文件没有丢，变的是工作目录。可以把 notebook 放回原处，或者问清数据该放在哪里，再改路径。
        verify: |
          import shutil
          from pathlib import Path, PureWindowsPath
          # 在模拟目录里建出同样的结构：root 对应 C:\Users\lin。
          root = Path("sim_py43_k1_q2")
          shutil.rmtree(root, ignore_errors=True)
          (root / "project" / "data").mkdir(parents=True)
          (root / "project" / "notebooks").mkdir()
          (root / "project" / "data" / "plate1.csv").write_text("sample_id,signal\n", encoding="utf-8")
          relative = Path("data") / "plate1.csv"
          looked = root / "project" / "notebooks" / relative
          try:
              open(looked).close()
              error = None
          except Exception as caught:
              error = type(caught).__name__
          target = PureWindowsPath(r"C:\Users\lin\project\notebooks") / "data" / "plate1.csv"
          candidates = {
              "notebooks": PureWindowsPath(r"C:\Users\lin\project\notebooks\data\plate1.csv"),
              "project": PureWindowsPath(r"C:\Users\lin\project\data\plate1.csv"),
              "home": PureWindowsPath(r"C:\Users\lin\data\plate1.csv"),
          }
          fits = [option for option, path in candidates.items() if path == target]
          answers = {"looked": fits[0] if len(fits) == 1 else fits, "exists": looked.exists(), "error": error}
      - id: py43.k1.q3
        kind: [explain]
        uses: [py13.k1]
        data: [pathlib_ready]
        body: |
          要指向 `results` 文件夹里 `week2` 子文件夹中的 `depth.csv`。下面哪几行写对了？选出所有写对的。
        slots:
          - id: line
            type: choice
            multiple: true
            options:
              - id: slash
                content: |
                  ```python
                  p = Path("results") / "week2" / "depth.csv"
                  ```
              - id: strdiv
                content: |
                  ```python
                  p = Path("results" / "week2" / "depth.csv")
                  ```
                feedback: 括号里先算 "results" / "week2"，两段文字不能相除。
              - id: whole
                content: |
                  ```python
                  p = Path("results/week2/depth.csv")
                  ```
              - id: plus
                content: |
                  ```python
                  p = Path("results") + "week2" + "depth.csv"
                  ```
                feedback: 路径用 / 拼接，不能用 + 。
            key: [slash, whole]
