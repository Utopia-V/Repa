    review:
      - id: py43.k3.r1
        kind: [specify]
        data: [runlog]
        body: |
          `logs/runlog.txt` 里已经有三行记录。下面三种需求，各自该用哪种打开方式，也就是 `open("logs/runlog.txt", 打开方式, encoding="utf-8")` 里的第二个参数？
        slots:
          - id: modes
            type: table
            columns:
              - { id: need, header: 需求 }
              - id: mode
                header: 打开方式
                input:
                  type: choice
                  options:
                    - { id: r, label: "r（只读）" }
                    - { id: w, label: "w（写入）" }
                    - { id: a, label: "a（追加）" }
            rows:
              - { id: see, cells: { need: "只想读出里面写了什么，文件一个字也不能变", mode: r } }
              - { id: add, cells: { need: "把一行 run 4 接在末尾，原来的三行都要保留", mode: a } }
              - { id: replace, cells: { need: "整个换成只有 run 4 一行的新内容，旧内容不要了", mode: w } }
        explanation: |
          | 需求 | 打开方式 | 为什么 |
          |---|---|---|
          | 只读不改 | `"r"` | 只读，文件原样不动；用 `"w"` 或 `"a"` 打开就不能读了，而且 `"w"` 一打开就清空 |
          | 接在末尾 | `"a"` | 新内容接在原有内容后面；`"w"` 会先清空，只剩 run 4；`"r"` 不能写，会报错 |
          | 整个换掉 | `"w"` | 打开那一刻就清空，再写入新内容；`"a"` 会把 run 4 接在旧内容后面 |

          选的时候先问：旧内容要不要留。要留，就是读用 `"r"`、加东西用 `"a"`；不要了，才用 `"w"`。
        verify: |
          from pathlib import Path
          PATH = "logs/runlog.txt"

          def trial(mode, action):
              Path(PATH).write_text(RUNLOG, encoding="utf-8")
              try:
                  with open(PATH, mode, encoding="utf-8") as f:
                      if action == "read":
                          f.read()
                      else:
                          f.write("run 4\n")
              except Exception:
                  return None
              return Path(PATH).read_text(encoding="utf-8")

          GOALS = {
              "see": ("read", lambda now: now == RUNLOG),
              "add": ("write", lambda now: now == RUNLOG + "run 4\n"),
              "replace": ("write", lambda now: now == "run 4\n"),
          }
          modes = {}
          for row, (action, ok) in GOALS.items():
              fits = []
              for mode in ("r", "w", "a"):
                  now = trial(mode, action)
                  if now is not None and ok(now):
                      fits.append(mode)
              modes[row] = {"mode": fits[0] if len(fits) == 1 else fits}
          answers = {"modes": modes}
