    card:
      name: 打开方式 r/w/a
      aliases: [文件模式, 覆盖, 追加]
      definition: open 的第二个参数决定怎样用文件："r" 只读，文件必须已经存在；"w" 写入，打开那一刻就清空原有内容；"a" 追加，新内容接在末尾。
      conditions:
        - '"w" 一打开就清空，即使后面一个字也没写成；不要用 "w" 打开原始数据文件。'
        - 'write 不会自动换行，每行末尾要自己写 \n；"a" 的代码多运行一次，内容就多一份。'
      example:
        from: py43.k3.e0
        text: |
          records/log.txt 原有 P1。用 "a" 写入 P2 后有 P1、P2 两行；接着用 "w" 写入 P3，只剩 P3。
    lesson: |
      `open` 的第二个参数是**打开方式**，不写时是 `"r"`：

      | 打开方式 | 意思 | 文件不存在时 | 文件已存在时 |
      |---|---|---|---|
      | `"r"` | 只读 | 报 FileNotFoundError | 从头读 |
      | `"w"` | 写入 | 新建 | **打开那一刻就清空** |
      | `"a"` | 追加 | 新建 | 新内容接在末尾 |

      写文字用 `f.write(...)`：

      ```python
      with open("results/log.txt", "a", encoding="utf-8") as f:
          f.write("P2 done\n")
      ```

      `write` 不会自动换行，`\n` 表示换行，每行末尾要自己写上。

      最大的风险在 `"w"`：它在打开时就清空文件，哪怕紧接着的那行写入出了错、一个字也没写成，原来的内容也已经没了。所以：

      - 原始数据只用 `"r"` 读，结果写到另一个文件夹里的新文件；
      - 追加记录用 `"a"`，但要记得同一段代码运行两次，记录就多一份，在 notebook 里重复运行单元格时尤其容易发生。
