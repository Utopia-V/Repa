id: py43
title: 读写文件时，先确认对象和范围
status: complete
minutes: 20
summary: 读写文件前先确认三件事：相对路径从哪里算起，用什么编码读，打开方式会不会清空原有内容。
prerequisites:
  - topic: py13
    key: true
    weight: 0.50
    covers: [py13.k1]
  - topic: py05
    key: true
    weight: 0.33
    covers: [py05.k1, py05.k2, py05.k3]
  - topic: py11
    key: false
    weight: 0.50
    covers: [py11.k2]
sources:
  - source: think-python
    where: 第 13 章
    url: https://allendowney.github.io/ThinkPython/chap13.html
    use: reference
  - source: python-docs
    where: 教程第 7 章 §7.2
    url: https://docs.python.org/3.12/tutorial/inputoutput.html
    use: reference
  - source: python-docs
    where: 标准库：pathlib
    url: https://docs.python.org/3.12/library/pathlib.html
    use: reference
notes: |
  范围：只用 pathlib 的 Path 拼路径和 .name、.suffix、.parent、.exists()，open 加 with 读写整段文字，r/w/a 三种模式。不讲 if、循环、自定义函数、字典和 pandas（都不是本节的先修）；逐行读文件留给需要循环的地方。with 下面的缩进在本节就地说明。
  运行环境：课程运行时的文件系统是 POSIX 写法，工作目录是 /home/pyodide。讲到 Windows 时用 PureWindowsPath 在核对程序里推出完整路径，题面不让学生在代码里写反斜杠。每道读写文件的题都在自己的 python 夹具里把要用的目录删掉重建，因为同一 topic 的核对任务共用一个内存文件系统。
  “工作目录换了”这类题无法真的切换目录，核对程序在一个单独的模拟目录里建出同样的文件结构，再把相对路径接在模拟的工作目录后面判断能不能找到文件。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 3 分钟；收束 1 分钟。
  情境、文件内容和题目为本课自拟。复习和测验题全部由程序核对，没有 manual 作答位。
intro: |
  这一节的代码会真的读写文件。读文件出错，最常见的不是代码写错了，而是：找的不是你以为的那个文件，读的编码和保存时不一样，或者一打开就把原来的内容清掉了。

  课程的运行环境里，路径用 `/` 分隔；每道题开始前，题目用到的文件都会按题面重新准备好。你在 Windows 上看到的路径用反斜杠 `\`，道理完全相同。
wrapup: |
  读写文件之前，先回答三个问题：这个相对路径是从哪个文件夹算起的？文件是用什么编码保存的？这次打开会不会清空原来的内容？

  向同事或 AI 提要求时，可以直接写：“从工作目录下的 data/plate1.csv 读，编码 UTF-8；结果写到 results 文件夹里的新文件，不要以写入方式打开 data 里的任何文件。”
