          b 写成 `[20, 10]`、标签 `["y", "x"]` 的那一段：b 在 x 上是 10、在 y 上是 20，按标签相加得到 x 为 11、y 为 22。

          b 写成 `[10, 20]`、标签 `["y", "x"]` 时，x 上是 1 + 20 = 21；b 的标签是 x、z 时，y 和 z 配不上对，得到 NaN。看 Series 的值，要连同它的标签一起看。
        verify: |
