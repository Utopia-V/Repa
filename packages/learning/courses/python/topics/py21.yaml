    caption: 另一张同结构的表
    index: [90, 2, 60]
    indexHeader: 原行索引
    columns:
      sample_id: [X_A, X_B, X_C]
      mass_mg: [500, 1250, 3000]
      volume_ml: [25, 50, 100]
  runs:
    kind: dataframe
    name: runs
    caption: 表 runs：三次培养的时长（分钟）和细胞计数
    index: [3, 11, 6]
    indexHeader: 原行索引
    columns:
      run: [R1, R2, R3]
      duration_min: [90, 45, 150]
      cells: [1800, 1350, 6000]
  runs2:
    kind: dataframe
    name: runs
    caption: 另一份培养记录
    index: [5, 1, 9, 2]
    indexHeader: 原行索引
    columns:
      run: [Q1, Q2, Q3, Q4]
      duration_min: [60, 30, 135, 200]
      cells: [600, 900, 2700, 5000]
  field:
    kind: dataframe
    name: field
    caption: 表 field：三个样点的气温（华氏度 °F）
    index: [1, 2, 3]
