    quiz:
      - id: py21.k3.x1
        kind: [debug, predict]
        uses: [py14.k1]
        data: [runs]
        body: |
          表 runs 里 R1、R2、R3 三次培养的接种量依次是 500、300、450。同事想算每次培养的细胞计数除以接种量，把接种量存成 `seed`，并给它配了标签 0、1、2：

          ```python
          seed = pd.Series([500, 300, 450], index=[0, 1, 2])
          runs["rate"] = runs["cells"] / seed
          ```
        slots:
          - id: nan
            type: text
            format: integer
            prompt: 运行之后，`runs["rate"]` 里有几个 NaN？
            key: 3
          - id: cause
            type: choice
            prompt: 为什么会这样？
            options:
              - { id: labels, content: "`seed` 的标签 0、1、2 和 `runs` 的原行索引 3、11、6 一个也对不上，pandas 按标签配对，配不上的就是 NaN" }
              - { id: missing, content: 三个接种量里有缺失 }
              - { id: dtype, content: "`cells` 是整数，不能除以 `seed`" }
            key: labels
          - id: fix
            type: choice
            multiple: true
            prompt: 要让 R1 除以 500、R2 除以 300、R3 除以 450，第一行应改成哪几种？选出所有可以的。
            options:
              - id: labels
                content: |
                  ```python
                  seed = pd.Series([500, 300, 450], index=[3, 11, 6])
                  ```
              - id: same_index
                content: |
                  ```python
                  seed = pd.Series([500, 300, 450], index=runs.index)
                  ```
              - id: default
                content: |
                  ```python
                  seed = pd.Series([500, 300, 450])
                  ```
              - id: shuffled
                content: |
                  ```python
                  seed = pd.Series([500, 300, 450], index=[11, 3, 6])
                  ```
            key: [labels, same_index]
        explanation: |
          `runs` 的原行索引是 3、11、6，`seed` 的标签是 0、1、2，两边一个标签也对不上，三个格子都是 **NaN**。pandas 先按标签配对，位置在前不在前不起作用。

          让两边的标签对上就行：标签写成 3、11、6，或者直接用 `runs.index`，R1 用 500、R2 用 300、R3 用 450。不写 `index` 时标签默认是 0、1、2，和 `runs` 仍然对不上；写成 11、3、6 能对上，但配错了对象：原行索引 3 的 R1 会除以 300。
        verify: |
          r = run()
          expected = runs["cells"].to_numpy() / np.array([500, 300, 450])
          fits = []
          for option, code in OPTIONS["fix"].items():
              result = run(code + '\nruns["rate"] = runs["cells"] / seed')
              if result.error is None and np.array_equal(result["runs"]["rate"].to_numpy(), expected):
                  fits.append(option)
          answers = {
              "nan": int(r["runs"]["rate"].isna().sum()),
              "cause": "labels" if not set(r["seed"].index) & set(r["runs"].index) else "other",
              "fix": fits,
          }
      - id: py21.k3.x2
        kind: [explain]
        body: |
          哪一段代码得到的 `total` 在标签 x 上是 11、在标签 y 上是 22？
