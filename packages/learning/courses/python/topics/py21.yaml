  - id: py21.k3
    keyPrerequisites: [py14, py16]
    title: 两个 Series 运算按标签对齐而非一律按位置
    card:
      name: 按标签对齐
      aliases: [对齐, 标签对齐, alignment]
      definition: 两个 Series 相加、相除时，pandas 按行索引的标签配对，而不是按第几个配对；一边有、另一边没有的标签，结果是 NaN。
      conditions:
        - 同一张表里的两列标签一一对应，所以看起来像逐行运算。
        - 从别处来的 Series（取出的一部分、另一张表的列）参与运算或赋成新列时，先核对标签。
      example:
        from: py21.k3.e0
        text: |
          ```python
          a = pd.Series([10, 20], index=["x", "y"])
          b = pd.Series([1, 2], index=["y", "x"])
          total = a + b
          ```
          total 在 x 上是 10 + 2 = 12，在 y 上是 20 + 1 = 21，不是按位置得到的 11、22。
    lesson: |
      `pd.Series(值的列表, index=标签的列表)` 造出一列带标签的数。看两个各有 2 个值的 Series：

      ```python
      a = pd.Series([10, 20], index=["x", "y"])
      b = pd.Series([1, 2], index=["y", "x"])
      total = a + b
      ```

      | 标签 | a | b | a + b |
      |---|---:|---:|---:|
      | x | 10 | 2 | 12 |
      | y | 20 | 1 | 21 |

      pandas 先按**标签**配对：x 和 x 相加，y 和 y 相加。b 在第一个位置的是 y 的值 1，但它没有和 a 的第一个值相加。结果是 x 为 12、y 为 21，而不是按位置得到的 11、22。

      一边有、另一边没有的标签，配不上对，结果是 NaN：

      ```python
      c = pd.Series([5, 7], index=["y", "z"])
      ```

      `a + c` 在 x 和 z 上是 NaN（只有一边有值），在 y 上是 20 + 5 = 25。标签不完全相同时，结果包含两边全部的标签，还会按标签排好顺序。

      同一张表里的两列，行索引一模一样，所以 `df["mass_mg"] / df["volume_ml"]` 看起来就是逐行运算。要留神的是**从别处来的** Series：

      - 只取出一部分行，例如 `df.loc[[22, 31], "volume_ml"]`（逗号前的方括号里写行标签，这里是 22 和 31 两行），再和整列运算，其余行得到 NaN；
      - 把另一个 Series 赋成新列，`df["ref"] = ref`，pandas 按 df 的行索引去 ref 里找同名标签，找不到的行是 NaN，而不是按先后顺序填进去。
    example:
      id: py21.k3.e0
      kind: [predict]
      body: |
        阅读代码，按标签填写 `total` 的值。

        ```python
        a = pd.Series([10, 20], index=["x", "y"])
        b = pd.Series([1, 2], index=["y", "x"])
        total = a + b
        ```
      slots:
        - id: total
          type: table
          columns:
            - { id: label, header: 标签 }
            - { id: value, header: total, input: integer }
          rows:
            - { id: x, cells: { label: x, value: 12 } }
            - { id: "y", cells: { label: "y", value: 21 } }
        - id: rule
          type: choice
          prompt: pandas 是怎样把 a、b 的值配成对的？
          options:
            - { id: position, content: 按第几个配对：第一个和第一个、第二个和第二个 }
            - { id: label, content: 按标签配对：x 和 x、y 和 y }
          key: label
      explanation: |
        total 在 x 上是 **12**（10 + 2），在 y 上是 **21**（20 + 1）。pandas **按标签配对**：b 的第一个值 1 属于标签 y，所以和 a 的 20 相加。按位置相加会得到 11、22，那不是 pandas 的做法。
      verify: |
        r = run()
        total = r["total"]
        positional = [x + y for x, y in zip(r["a"], r["b"])]
        answers = {
            "total": {label: {"value": int(value)} for label, value in total.items()},
            "rule": "label" if list(total) != positional else "position",
        }
