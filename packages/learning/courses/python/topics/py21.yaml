    kind: dataframe
    name: soil
    caption: 表 soil：四个样地的土层深度（厘米）
    index: [5, 12, 3, 8]
    indexHeader: 原行索引
    columns:
      plot: [P1, P2, P3, P4]
      depth: [30, 25, 35, 30]
kps:
  - id: py21.k1
    keyPrerequisites: [py02, py16]
    title: 整列算术与单位转换
    card:
      name: 整列运算
      aliases: [新列, 衍生列, 单位换算]
      definition: df["新列"] = 整列算式：pandas 对每一行做同样的运算，得到一列与原表逐行对应的结果，赋给新列名就在表右边多出一列。
      conditions:
        - 列与数运算，每一行都和这个数算；列与列运算，同一行的两个值相算。
        - Python 的列表没有这种逐个运算：[1500, 820] * 2 是把列表重复两遍。
        - 换算后挑一行手算核对单位：毫克换成克是除以 1000，不是乘。
      example:
        from: py21.k1.e0
        text: |
          ```python
          df["mass_g"] = df["mass_mg"] / 1000
          df["conc"] = df["mass_mg"] / df["volume_ml"]
          ```
          S_A 的 mass_g 是 1500 ÷ 1000 = 1.5，conc 是 1500 ÷ 50 = 30.0（毫克每毫升）。
    lesson: |
      `df["mass_mg"]` 取出一列。对这一列做算术，pandas 会对**每一行**做同样的运算，得到一列新的结果：

      ```python
      df["mass_g"] = df["mass_mg"] / 1000
      ```

      等号左边写一个还没有的列名，结果就作为新列加在表的最右边。表 W 原来 3 列，现在 4 列；行数和行索引都不变。

      两列之间也可以运算，这时是**同一行**的两个值相算：

      ```python
      df["conc"] = df["mass_mg"] / df["volume_ml"]
      ```

      | 原行索引 | mass_mg | volume_ml | mass_g | conc |
      |---:|---:|---:|---:|---:|
      | 31 | 1500 | 50 | 1.5 | 30.0 |
      | 7 | 820 | 20 | 0.82 | 41.0 |
      | 22 | 2400 | 80 | 2.4 | 30.0 |
      | 4 | 960 | 40 | 0.96 | 24.0 |

      这种逐行运算是 pandas 列的本事。Python 的列表没有：`[1500, 820] * 2` 得到的是 `[1500, 820, 1500, 820]`，把列表重复了两遍。

      算式里的先后照常：先乘除后加减，括号里的先算。华氏度换成摄氏度要写 `(df["temp_f"] - 32) * 5 / 9`，括号不能省。

      换算单位最容易错在方向上：毫克换成克是**除以** 1000，分钟换成小时是**除以** 60。新列的名字带上单位，再挑一行手算一遍：S_A 是 1500 mg，1500 ÷ 1000 = 1.5 g，对得上。
    example:
      id: py21.k1.e0
      kind: [predict]
      data: [W]
      body: |
        阅读代码，按原行索引填写两列新列的值，再写出运行后 `df.shape` 的列数。

        ```python
        df["mass_g"] = df["mass_mg"] / 1000
        df["conc"] = df["mass_mg"] / df["volume_ml"]
        ```
      slots:
        - id: values
          type: table
          columns:
            - { id: index, header: 原行索引 }
            - { id: mass_mg, header: mass_mg }
            - { id: volume_ml, header: volume_ml }
            - { id: mass_g, header: mass_g, input: { type: text, format: number } }
            - { id: conc, header: conc, input: { type: text, format: number } }
          rows:
            - { id: r31, cells: { index: "31", mass_mg: "1500", volume_ml: "50", mass_g: 1.5, conc: 30 } }
            - { id: r7, cells: { index: "7", mass_mg: "820", volume_ml: "20", mass_g: 0.82, conc: 41 } }
            - { id: r22, cells: { index: "22", mass_mg: "2400", volume_ml: "80", mass_g: 2.4, conc: 30 } }
            - { id: r4, cells: { index: "4", mass_mg: "960", volume_ml: "40", mass_g: 0.96, conc: 24 } }
        - id: ncols
          type: text
          format: integer
          prompt: 运行后 `df` 有几列？
          key: 5
      explanation: |
        mass_g 依次为 **1.5、0.82、2.4、0.96**：每一行的 mass_mg 各除以 1000。conc 依次为 **30.0、41.0、30.0、24.0**：同一行的 mass_mg 除以 volume_ml，单位是毫克每毫升。

        原表 3 列，加了两列新列，共 **5** 列，行数不变。
      verify: |
        df_after = run()["df"]
        answers = {
            "values": {f"r{label}": {"mass_g": df_after.loc[label, "mass_g"], "conc": df_after.loc[label, "conc"]} for label in df_after.index},
            "ncols": df_after.shape[1],
        }
    practice:
      - id: py21.k1.q1
        kind: [debug]
        uses: [py02.k3]
        data: [W]
        body: |
          同事想把质量换成克，写了下面这行。

          ```python
          df["mass_g"] = df["mass_mg"] * 1000
          ```
        slots:
          - id: value
            type: text
            format: integer
            prompt: 运行后，S_A（索引 31）的 mass_g 是多少？
            key: 1500000
          - id: fix
            type: choice
            prompt: 应改成哪一行？
            options:
              - id: div
                content: |
                  ```python
                  df["mass_g"] = df["mass_mg"] / 1000
                  ```
              - id: floor
                content: |
                  ```python
                  df["mass_g"] = df["mass_mg"] // 1000
                  ```
                feedback: "`//` 是整除，820 mg 会变成 0 g。"
              - id: sub
                content: |
                  ```python
                  df["mass_g"] = df["mass_mg"] - 1000
                  ```
            key: div
        explanation: |
          S_A 的 mass_g 成了 **1500000**：乘以 1000 是把克换成毫克的方向，换反了。1 g = 1000 mg，所以毫克换成克要**除以** 1000：`df["mass_mg"] / 1000`，S_A 得到 1.5。

          `//` 是整除，S_B 的 820 mg 会变成 0；减去 1000 更不是换算。
        verify: |
          r = run()
          # 1 g = 1000 mg：逐行用定义换算，作为标准。
          wanted = [mg / 1000 for mg in df["mass_mg"]]
          fits = []
          for option, line in OPTIONS["fix"].items():
              attempt = run(line)
              if attempt.error is None and all(abs(x - y) < 1e-9 for x, y in zip(attempt["df"]["mass_g"], wanted)):
                  fits.append(option)
          answers = {"value": int(r["df"].loc[31, "mass_g"]), "fix": fits[0] if len(fits) == 1 else fits}
      - id: py21.k1.q2
        kind: [predict]
        uses: [py07.k1, py16.k1]
        data: [W]
        body: |
          阅读代码，写出两行输出。

          ```python
          values = [1500, 820]
          print(values * 2)
          print(list(df["mass_mg"] * 2))
          ```
        slots:
          - id: first
            type: text
            match: output
            prompt: 第一行输出
            key: "[1500, 820, 1500, 820]"
            feedback:
              - when: "[3000, 1640]"
                message: 列表乘以 2 是把列表重复两遍，不是每个数乘以 2。
          - id: second
            type: text
            match: output
            prompt: 第二行输出
            key: "[3000, 1640, 4800, 1920]"
        explanation: |
          第一行 **[1500, 820, 1500, 820]**：列表乘以 2 是把列表重复两遍。第二行 **[3000, 1640, 4800, 1920]**：pandas 的列乘以 2，是每一行各乘以 2；`list(...)` 只是把结果写成列表显示。

          同样写 `* 2`，对列表和对表的列意思不同。整列运算是 pandas 列才有的。
        verify: |
          lines = run().lines()
          answers = {"first": lines[0], "second": lines[1]}
      - id: py21.k1.q3
        kind: [modify]
        uses: [py02.k3]
        data: [runs]
        body: |
          需求是：

          > 在 runs 表里新增一列 `hours`，把 duration_min 换算成小时（可以带小数）。其他列保持不变。

          同事写的代码在作答框里。请改动它并提交。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              runs["hours"] = runs["duration_min"] * 60
            solution: |
              runs["hours"] = runs["duration_min"] / 60
            rejects:
              - code: runs["hours"] = runs["duration_min"] // 60
                why: 整除把 90 分钟算成 1 小时，丢了小数
              - code: runs["duration_min"] = runs["duration_min"] / 60
                why: 覆盖了原来的 duration_min，没有新增 hours
              - code: runs["hours"] = [1.5, 0.75, 2.5]
                why: 照着这张表写死了结果
            tests:
              - name: 表 runs
                expect:
                  runs: 'pd.DataFrame({"run": ["R1", "R2", "R3"], "duration_min": [90, 45, 150], "cells": [1800, 1350, 6000], "hours": [1.5, 0.75, 2.5]}, index=[3, 11, 6])'
              - name: 换一份记录
                hidden: true
                data: [runs2]
                expect:
                  runs: 'pd.DataFrame({"run": ["Q1", "Q2", "Q3", "Q4"], "duration_min": [60, 30, 135, 200], "cells": [600, 900, 2700, 5000], "hours": [1.0, 0.5, 2.25, 200 / 60]}, index=[5, 1, 9, 2])'
        explanation: |
          ```python
          runs["hours"] = runs["duration_min"] / 60
          ```

          1 小时 = 60 分钟，分钟换成小时要除以 60。乘以 60 是反方向；整除 `//` 会把 90 分钟算成 1 小时；直接给 duration_min 赋值会把原始记录换掉。本例 hours 依次为 1.5、0.75、2.5。判分时还会换一份记录运行，检查新列和原有的列。
    review:
      - id: py21.k1.r1
        kind: [trace]
        uses: [py02.k1]
        data: [field]
        body: |
          阅读代码，按原行索引填写 `temp_c` 的值。

          ```python
          field["temp_c"] = (field["temp_f"] - 32) * 5 / 9
          ```
        slots:
          - id: temp_c
            type: table
            columns:
              - { id: index, header: 原行索引 }
              - { id: temp_f, header: temp_f }
              - { id: temp_c, header: temp_c, input: { type: text, format: number } }
            rows:
              - { id: r1, cells: { index: "1", temp_f: "50", temp_c: 10 } }
              - { id: r2, cells: { index: "2", temp_f: "68", temp_c: 20 } }
              - { id: r3, cells: { index: "3", temp_f: "86", temp_c: 30 } }
        explanation: |
          `temp_c` 依次为 **10.0、20.0、30.0**。括号让每一行先减去 32，再乘以 5、除以 9：(50 − 32) × 5 ÷ 9 = 10。去掉括号就会先算 32 × 5 ÷ 9，结果完全不同。
        verify: |
          temp_c = run()["field"]["temp_c"]
          answers = {"temp_c": {f"r{label}": {"temp_c": value} for label, value in temp_c.items()}}
      - id: py21.k1.r2
        kind: [explain]
        uses: [py02.k3]
        data: [soil]
        body: |
          要新增一列 `depth_m`，把 depth（厘米）换算成米。哪一行正确？
        slots:
          - id: line
            type: choice
            options:
              - id: times
                content: |
                  ```python
                  soil["depth_m"] = soil["depth"] * 100
                  ```
              - id: div
                content: |
                  ```python
                  soil["depth_m"] = soil["depth"] / 100
                  ```
              - id: div1000
                content: |
                  ```python
                  soil["depth_m"] = soil["depth"] / 1000
                  ```
              - id: list
                content: |
                  ```python
                  soil["depth_m"] = [0.3, 0.25, 0.35, 0.3]
                  ```
            key: div
          - id: value
            type: text
            format: number
            prompt: 按正确的写法，P3（索引 3）的 depth_m 是多少？
            key: 0.35
        explanation: |
          **`soil["depth"] / 100`** 正确：1 米 = 100 厘米，厘米换成米除以 100。P3 的 35 厘米是 **0.35** 米。

          乘以 100 方向反了；除以 1000 是毫米换成米；直接写一个列表虽然在这张表上碰巧对，换一张表就错了，也看不出是怎样算的。
        verify: |
          wanted = [cm / 100 for cm in soil["depth"]]
          def matches(code, table):
              attempt = run(code, soil=table)
              return attempt.error is None and all(abs(x - y) < 1e-9 for x, y in zip(attempt["soil"]["depth_m"], [cm / 100 for cm in table["depth"]]))
          other = pd.DataFrame({"plot": ["Q1", "Q2", "Q3", "Q4"], "depth": [10, 50, 20, 40]}, index=[1, 2, 3, 4])
          # 在原表和另一张表上都要换算对，才算正确的写法。
          fits = [option for option, code in OPTIONS["line"].items() if matches(code, soil.copy()) and matches(code, other.copy())]
          answers = {"line": fits[0] if len(fits) == 1 else fits, "value": wanted[list(soil.index).index(3)]}
    quiz:
      - id: py21.k1.x1
        kind: [predict]
        uses: [py16.k2, py14.k2]
        data: [W]
        body: |
          阅读代码，写出两行输出。

          ```python
          df["mass_g"] = df["mass_mg"] / 1000
          df["half_g"] = df["mass_g"] / 2
          print(df.shape)
          print(df.loc[7, "half_g"])
          ```
        slots:
          - id: shape
            type: text
            match: output
            prompt: 第一行输出
            key: "(4, 5)"
          - id: value
            type: text
            match: output
            prompt: 第二行输出
            key: "0.41"
        explanation: |
          第一行 **(4, 5)**：行数不变，原有 3 列加上 mass_g、half_g 两列。第二行 **0.41**：索引 7 的 mass_mg 是 820，先换成 0.82 g，再除以 2。
        verify: |
          lines = run().lines()
          answers = {"shape": lines[0], "value": lines[1]}
      - id: py21.k1.x2
        kind: [modify]
        uses: [py02.k3]
        data: [W]
        body: |
          需求是：

          > 新增一列 `conc`，表示每毫升溶液里有多少毫克（mass_mg 除以 volume_ml）。其他列保持不变。

          同事写的代码在作答框里。请改动它并提交。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              df["conc"] = df["volume_ml"] / df["mass_mg"]
            solution: |
              df["conc"] = df["mass_mg"] / df["volume_ml"]
            rejects:
              - code: df["conc"] = df["mass_mg"] / 1000 / df["volume_ml"]
                why: 算成了每毫升多少克
              - code: df["conc"] = df["mass_mg"] // df["volume_ml"]
                why: 整除丢了小数
              - code: df["conc"] = [30.0, 41.0, 30.0, 24.0]
                why: 照着这张表写死了结果
            tests:
              - name: 表 W
                expect:
                  'df["conc"]': 'pd.Series([30.0, 41.0, 30.0, 24.0], index=[31, 7, 22, 4], name="conc")'
                  'df[["sample_id", "mass_mg", "volume_ml"]]': df
              - name: 换一张表
                hidden: true
                data: [W2]
                expect:
                  'df["conc"]': 'pd.Series([20.0, 25.0, 30.0], index=[90, 2, 60], name="conc")'
                  'df[["sample_id", "mass_mg", "volume_ml"]]': df
              - name: 浓度不是整数的表
                hidden: true
                data: [W2]
                setup: df["volume_ml"] = [40, 50, 120]
                expect:
                  'df["conc"]': 'pd.Series([12.5, 25.0, 25.0], index=[90, 2, 60], name="conc")'
        explanation: |
          ```python
          df["conc"] = df["mass_mg"] / df["volume_ml"]
          ```

          “每毫升有多少毫克”是毫克数除以毫升数，被除数和除数换了位置就成了“每毫克对应多少毫升”。本例 conc 依次为 30.0、41.0、30.0、24.0。判分时还会换一张表运行，检查 conc 和原有的列。

  - id: py21.k2
    keyPrerequisites: [py01, py02]
    title: 用中间列或分步赋值说明数据流
    card:
      name: 分步赋值
      aliases: [中间列, 数据流]
      definition: 把一个换算拆成几行，每行算出一列中间结果；每一列都在它那一行执行时算定，之后再改它依据的列，它不会跟着重算。
      conditions:
        - 覆盖原列（df["mass_mg"] = df["mass_mg"] - 100）会丢掉原始读数；想保留就存进新列。
        - 读代码时从上往下，记下每一列是在哪一行、用哪些列算出的。
      example:
        from: py21.k2.e0
        text: |
          ```python
          df["mass_g"] = df["mass_mg"] / 1000
          df["mass_mg"] = df["mass_mg"] - 100
          df["net_g"] = df["mass_mg"] / 1000
          ```
          S_A 的 mass_g 仍是 1.5，net_g 是 1.4：mass_g 在第 1 行就算定了。
    lesson: |
      复杂一点的换算，分几行写，每一行算出一列**中间列**，读的人可以一步一步核对：

      ```python
      df["mass_g"] = df["mass_mg"] / 1000
      df["volume_l"] = df["volume_ml"] / 1000
      df["conc_g_per_l"] = df["mass_g"] / df["volume_l"]
      ```

      每一行只做一件事，列名写着单位。核对时挑一行手算：S_A 是 1500 mg = 1.5 g，50 mL = 0.05 L，1.5 ÷ 0.05 = 30 g/L。一行写完 `df["mass_mg"] / 1000 / (df["volume_ml"] / 1000)` 结果相同，但算错时不好找是哪一步。

      和[重新赋值](repa:concept/py01.k2)一样，一列是在**那一行执行时**算出来的。之后再改它依据的列，它不会跟着重算：

      ```python startLine=1
      df["mass_g"] = df["mass_mg"] / 1000
      df["mass_mg"] = df["mass_mg"] - 100
      ```

      第 2 行想扣掉称量瓶的 100 mg。它执行之后 mass_mg 变了，mass_g 却还是第 1 行用扣除**之前**的数算的。要先扣除再换算，就要把两行的顺序对调。

      第 2 行还有一个问题：它用新值**覆盖**了 mass_mg，原始读数从表里消失了。想留着原始读数，就把扣除后的结果存进新列，例如 `df["net_mg"] = df["mass_mg"] - 100`。

      读别人的代码时，从上往下记下每一列是在哪一行、用哪些列算出来的，就能看清数据是怎样一步步流到结果里的。
    example:
      id: py21.k2.e0
      kind: [trace]
      data: [W]
      body: |
        按运行顺序，填写每行执行后**索引 31（S_A）**这一行的三列的值。还没有这一列时填“尚未定义”。

        ```python startLine=1
        df["mass_g"] = df["mass_mg"] / 1000
        df["mass_mg"] = df["mass_mg"] - 100
        df["net_g"] = df["mass_mg"] / 1000
        ```
      slots:
        - id: trace
          type: table
          columns:
            - { id: line, header: 执行到 }
            - { id: mass_mg, header: mass_mg, input: { type: text, format: number, quick: [尚未定义] } }
            - { id: mass_g, header: mass_g, input: { type: text, format: number, quick: [尚未定义] } }
            - { id: net_g, header: net_g, input: { type: text, format: number, quick: [尚未定义] } }
          rows:
            - { id: l1, cells: { line: 第 1 行, mass_mg: 1500, mass_g: 1.5, net_g: 尚未定义 } }
            - { id: l2, cells: { line: 第 2 行, mass_mg: 1400, mass_g: 1.5, net_g: 尚未定义 } }
            - { id: l3, cells: { line: 第 3 行, mass_mg: 1400, mass_g: 1.5, net_g: 1.4 } }
      explanation: |
        | 执行到 | mass_mg | mass_g | net_g |
        |---|---:|---:|---:|
        | 第 1 行 | 1500 | 1.5 | 尚未定义 |
        | 第 2 行 | 1400 | 1.5 | 尚未定义 |
        | 第 3 行 | 1400 | 1.5 | 1.4 |

        第 1 行用 1500 算出 mass_g = 1.5。第 2 行把 mass_mg 覆盖成 1400，mass_g **不会**跟着重算，仍是 1.5。第 3 行用的是覆盖后的 1400，所以 net_g 是 1.4。原始读数 1500 已经不在表里了。
      verify: |
        columns = ["mass_mg", "mass_g", "net_g"]
        states = trace(names=["df"])
        answers = {"trace": {
