id: py21
title: 从已有列算出新列
status: complete
minutes: 20
summary: 对整列做算术、换算单位并存成新列；分步写中间列，按赋值顺序追踪数据流；两个 Series 运算时按标签对齐，不一律按位置。
prerequisites: [py16, py02, py07]
encompassings:
  - {topic: py16, weight: 0.5}
  - {topic: py02, weight: 0.5}
  - {topic: py07, weight: 0.5}
  - {topic: py01, weight: 0.5}
sources:
  - source: pydata-book
    where: 第 5 章 §5.2
    url: https://wesmckinney.com/book/pandas-basics
    use: reference
  - source: pandas-docs
    where: 入门教程：衍生列
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/05_add_columns.html
    use: reference
  - source: pandas-docs
    where: 用户指南：Series 向量化和标签对齐
    url: https://pandas.pydata.org/docs/user_guide/dsintro.html#vectorized-operations-and-label-alignment-with-series
    use: reference
notes: |
  建议题型与判分：预测输出（P）、追踪变量（P）、小改代码（T）。
  范围：df["新列"] = 整列算式；列与数、列与列的四则运算；分步的中间列；改动来源列后新列不会重算；两个 Series 按标签对齐，标签对不上得到 NaN。不讲 assign、apply、条件赋值（py22 的 loc 赋值）、排序（py23）；py17 不是先修，不用布尔掩码。
  按骨架备注，标签对齐先用两个各有 2 个元素的 Series 讲；再用“从原表取出一部分再参与运算”和“把另一个 Series 赋成新列”两种真实情形练习。标签不完全相同时，运算结果的索引是两边标签的并集，并且会按标签排序；题目只按标签问值，不问顺序。
  k2 的“扣除瓶重”沿用 py01 的重新赋值：来源列改了，之前算出的列不会跟着变。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 3 分钟、练习 2 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。
intro: |
  这一节在表的右边添新列：把毫克换成克、算出浓度、扣掉容器的重量。新列都由已有的列算出来，关键是看清每一列从哪里来。

  宿主已经导入了 pandas（`pd`）并准备好数据表；每道题都从题面给出的表重新开始。大多数题用表 W：`sample_id` 是样本编号，`mass_mg` 是称得的质量（毫克），`volume_ml` 是溶液体积（毫升）。
wrapup: |
  新列的名字带上单位（`mass_g`、`conc_g_per_l`），换算分步写，每一步挑一行手算核对。读别人的代码时，按从上到下的顺序记下每一列是在哪一行、用哪些列算出来的；后面再改来源列，前面算好的列不会跟着变。

  两个 Series 相加、相除时，pandas 按标签配对。来源不同的两列放在一起算之前，先确认它们的标签是不是一一对应。
data:
  W:
    kind: dataframe
    name: df
    caption: 表 W
    index: [31, 7, 22, 4]
    indexHeader: 原行索引
    columns:
      sample_id: [S_A, S_B, S_C, S_D]
      mass_mg: [1500, 820, 2400, 960]
      volume_ml: [50, 20, 80, 40]
