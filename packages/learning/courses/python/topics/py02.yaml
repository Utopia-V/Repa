  - id: py02.k3
    keyPrerequisites: [py01]
    title: 单位随计算一起核对
    card:
      name: 单位核对
      aliases: [单位换算, 量级检查]
      definition: 每个数都带着单位：把单位写进名字，换算时核对该乘还是该除、乘除的数对不对，算完再看结果的大小说不说得通。
      conditions:
        - 小单位换大单位用除：分钟变小时除以 60，µL 变 mL 除以 1000；大单位换小单位用乘。
        - 浓度（mg/mL）乘体积（mL）得到质量（mg）；单位对不上的算式多半写错了。
        - 换算要保留小数时用 `/`，不要用 `//`。
      example:
        from: py02.k3.e0
        text: |
          135 分钟：`135 // 60` 得 2，`135 % 60` 得 15，即 2 小时 15 分；`135 / 60` 得 2.25，单位是小时。
    lesson: |
      数据里的数几乎都带单位：分钟、毫升、mg/mL。Python 只认数，不管单位，所以要把单位写进名字（`minutes`、`volume_ul`、`conc_mg_per_ml`），每一步自己核对。

      换算时先想“1 个大单位等于多少个小单位”：1 小时 = 60 分钟，1 mL = 1000 µL。

      - 小单位换成大单位，用除：`hours = minutes / 60`，`volume_ml = volume_ul / 1000`。
      - 大单位换成小单位，用乘：`minutes = hours * 60`。
      - 浓度乘体积得到质量：`mass_mg = conc_mg_per_ml * volume_ml`，单位上 mg/mL × mL = mg。

      | 要算 | 写法 | 结果 |
      |---|---|---:|
      | 90 分钟是几小时 | `90 / 60` | 1.5 |
      | 250 µL 是几 mL | `250 / 1000` | 0.25 |
      | 2 mg/mL 的溶液取 5 mL，含多少 mg | `2 * 5` | 10 |
      | 135 分钟是几小时几分 | `135 // 60` 和 `135 % 60` | 2 小时 15 分 |

      最后一行用的是[三种除法](repa:concept/py02.k2)里的 `//` 和 `%`。要保留小数的换算用 `/`：`250 // 1000` 得 0，0.25 mL 就丢了。

      算完再估一下大小：一个下午的实验算出要几千小时，一管样本算出几万毫升，多半是乘除用反了。
    example:
      id: py02.k3.e0
      kind: [predict, explain]
      body: |
        一次实验用了 135 分钟。阅读下面的程序。

        ```python startLine=1
        minutes = 135
        hours = minutes // 60
        rest_minutes = minutes % 60
        print(hours)
        print(rest_minutes)
        print(minutes / 60)
        ```
      slots:
        - id: line1
          type: text
          format: integer
          prompt: 第一行显示
          key: 2
        - id: line2
          type: text
          format: integer
          prompt: 第二行显示
          key: 15
        - id: line3
          type: text
          match: output
          prompt: 第三行显示
          key: "2.25"
        - id: unit
          type: choice
          prompt: 第三行显示的数，单位是什么？
          options:
            - { id: minute, content: 分钟 }
            - { id: hour, content: 小时 }
            - { id: second, content: 秒 }
          key: hour
      explanation: |
        依次显示 **2**、**15**、**2.25**。135 分钟里有 2 个完整的 60 分钟，余下 15 分钟，所以是 2 小时 15 分。`minutes / 60` 把分钟换成小时，得 2.25 **小时**：0.25 小时就是 15 分钟，两种写法说的是同一段时间。
      verify: |
        lines = run().lines()
        answers = {"line1": int(lines[0]), "line2": int(lines[1]), "line3": lines[2]}
      manual: [unit]
    practice:
      - id: py02.k3.q1
        kind: [specify]
        body: |
          `volume_ul` 是以微升（µL）为单位的体积，例如 250。要得到以毫升（mL）为单位的体积 `volume_ml`，哪一行对？
        slots:
          - id: line
            type: choice
            options:
              - id: times
                content: |
                  ```python
                  volume_ml = volume_ul * 1000
                  ```
                feedback: 微升换成毫升是小单位换大单位，数应当变小。250 µL 不会是 250000 mL。
              - id: floor
                content: |
                  ```python
                  volume_ml = volume_ul // 1000
                  ```
                feedback: 整除只留下整数部分，250 µL 会算成 0 mL。
              - id: div
                content: |
                  ```python
                  volume_ml = volume_ul / 1000
                  ```
              - id: hundred
                content: |
                  ```python
                  volume_ml = volume_ul / 100
                  ```
                feedback: 1 mL 是 1000 µL，不是 100 µL。
