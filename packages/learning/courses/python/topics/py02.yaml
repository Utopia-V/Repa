id: py02
title: 把计算写成表达式
status: complete
minutes: 20
summary: 读懂一行算式的计算顺序和括号；分清 /、// 和 %；换算时把单位写进名字，并用量级核对结果。
prerequisites: [py01]
encompassings:
  - {topic: py01, weight: 0.5}
sources:
  - source: think-python
    where: 第 1 章 §1
    url: https://allendowney.github.io/ThinkPython/chap01.html
    use: reference
  - source: python-docs
    where: 教程第 3 章 §3.1.1
    url: https://docs.python.org/3.12/tutorial/introduction.html
    use: reference
notes: |
  范围：先修 py01（名字、赋值、print 显示整数、逐行追踪）。本节引入 `*`、`/`、`//`、`%` 和括号；只用正数，不讲负数整除和 `**`。`/` 的结果只说“总带小数点”，int、float 的说法留给 py03；round 等函数留给 py04；比较留给 py08。单位只作为写进名字、核对乘除和量级的习惯，不引入单位库。
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）；k1 复习和 k3 练习各加一道小改代码（T），k3 测验用一道按测试判的排列题。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 3 分钟；k3 讲解与例题 3 分钟、练习 4 分钟；收束 1 分钟。
  讲解、例题和题目为本课自拟。
intro: |
  上一节的程序只做加减。这一节把几步计算写进一行：乘、除、括号，以及怎样让算出来的数带着正确的单位。

  程序仍当作一段短脚本，从第一行往下运行，只有 `print` 会在屏幕上显示东西。

  有些题会写“宿主提供了 `plates = 2`”或“宿主已经给 `a`、`b` 赋好了值”。宿主就是运行你的代码的这个环境：它事先替你把这些名字赋好值，你的代码里不要再写这一行；换一次运行，这些名字可能取别的值，所以代码要对任何取值都算对。
wrapup: |
  读一行算式，先找括号，再算乘除（`*`、`/`、`//`、`%`），最后算加减，同一级从左往右；`/` 的结果总带小数点。算完再看单位：名字里写的是什么单位，换算该乘还是该除，结果的大小说不说得通。

  向同事或 AI 提计算要求时，把“先合起来再乘”“保留小数”“结果以小时为单位”这类信息说出来，对方就不用猜。
kps:
  - id: py02.k1
    keyPrerequisites: [py01]
    title: 括号与运算顺序
    card:
      name: 运算顺序
      aliases: [括号, 先乘除后加减]
      definition: 一行算式里先算括号里的，再算乘除，最后算加减；同一级从左往右。想让加减先算，就把它放进括号。
      conditions:
        - 乘号要写成 `*`，不能省略，也不能写成 ×。
        - 把需求写成算式时，先想清楚哪几个数要先合在一起，再决定括号放在哪里。
      example:
        from: py02.k1.e0
        text: |
          ```python
          tubes = boxes * per_box + loose
          ```
          boxes 为 4、per_box 为 8、loose 为 3 时，先算 4 * 8 得 32，再加 3，tubes 是 35。
    lesson: |
      Python 的乘号写成 `*`。一行算式里既有加减又有乘时，计算顺序和数学课一样：

      1. 括号里的先算；
      2. 再算乘（下一个知识点的除法也在这一级）；
      3. 最后算加减；同一级的从左往右算。

      | 算式 | 怎样算 | 结果 |
      |---|---|---:|
      | `4 * 8 + 3` | 先算 `4 * 8` 得 32，再加 3 | 35 |
      | `4 * (8 + 3)` | 先算括号里的 `8 + 3` 得 11，再乘 4 | 44 |
      | `10 - 4 - 3` | 从左往右：`10 - 4` 得 6，再减 3 | 3 |

      [赋值](repa:concept/py01.k1)的读法不变：先把等号右边整个算完，再让左边的名字指向结果。

      把一句需求写成算式时，先想清楚哪几个数要先合在一起。“单价加运费，再乘份数”里，单价和运费要先相加，就得写成 `(price + fee) * count`；不加括号，乘法先算，就成了只有运费乘了份数。乘号也不能省：数学里的 `2(3 + 4)` 在 Python 里要写成 `2 * (3 + 4)`。
    example:
      id: py02.k1.e0
      kind: [predict, explain]
      body: |
        每盒装 8 管样本，一共 4 盒，另外还有 3 管散装。阅读下面的程序。

        ```python startLine=1
        boxes = 4
        per_box = 8
        loose = 3
        tubes = boxes * per_box + loose
        print(tubes)
        ```
      slots:
        - id: first
          type: choice
          prompt: 第 4 行等号右边，最先算的是哪一步？
          options:
            - id: add
              content: "`per_box + loose`，得 11"
            - id: mul
              content: "`boxes * per_box`，得 32"
          key: mul
        - id: output
          type: text
          format: integer
          prompt: 程序显示哪个整数？
          key: 35
      explanation: |
        第 4 行没有括号，乘法先算：`boxes * per_box` 是 4 * 8 = 32，再加上 `loose` 的 3，得 **35**，然后让 `tubes` 指向 35。最后一行显示 **35**。

        如果写成 `boxes * (per_box + loose)`，就成了 4 * 11 = 44，意思变成“每盒 11 管”，和实际情况不符。
      verify: |
        import ast
        # 按 Python 的计算顺序遍历第 4 行右边的算式，记下每一步运算完成的先后。
        done = []
        def walk(node):
            if isinstance(node, ast.BinOp):
                walk(node.left)
                walk(node.right)
                done.append(type(node.op).__name__)
        walk(ast.parse(CODE).body[3].value)
        answers = {"first": {"Mult": "mul", "Add": "add"}[done[0]], "output": int(run().out)}
    practice:
      - id: py02.k1.q1
        kind: [predict]
        body: |
          ```python
          print(2 + 3 * 4)
          print((2 + 3) * 4)
          ```
        slots:
          - id: line1
            type: text
            format: integer
            prompt: 第一行显示
            key: 14
            feedback:
              - when: 20
                message: 没有括号时乘法先算：先算 3 * 4 得 12，再加 2。
          - id: line2
            type: text
            format: integer
            prompt: 第二行显示
            key: 20
            feedback:
              - when: 14
                message: 括号里的 2 + 3 先算，得 5，再乘 4。
        explanation: |
          第一行显示 **14**：没有括号，先算 `3 * 4` 得 12，再加 2。第二行显示 **20**：括号里的 `2 + 3` 先算得 5，再乘 4。两行只差一对括号，结果就不同。
        verify: |
          lines = run().lines()
          answers = {"line1": int(lines[0]), "line2": int(lines[1])}
      - id: py02.k1.q2
        kind: [specify]
        body: |
          一份试剂单价 `price` 元，每买一份另收运费 `fee` 元，一共买 `count` 份。哪一行能算出要付的总钱数 `cost`？
        slots:
          - id: line
            type: choice
            options:
              - id: fee_only
                content: |
                  ```python
                  cost = price + fee * count
                  ```
                feedback: 没有括号时 `fee * count` 先算，单价只算了一份。
              - id: both
                content: |
                  ```python
                  cost = (price + fee) * count
                  ```
              - id: once
                content: |
                  ```python
                  cost = price * count + fee
                  ```
                feedback: 运费是每份都收，这一行只加了一次。
            key: both
        explanation: |
          `cost = (price + fee) * count` 正确：每一份要付单价加运费，所以先把两者加起来，再乘份数。例如单价 12、运费 3、买 5 份，要付 15 × 5 = 75 元。

          `price + fee * count` 先算了运费乘份数，单价只算了一份，得 27；`price * count + fee` 只收了一次运费，得 63。
        verify: |
          # 按需求逐份累加：每买一份，都付一次单价和一次运费。
          def expected(price, fee, count):
              total = 0
              for _ in range(count):
                  total = total + price + fee
              return total
          cases = [(12, 3, 5), (20, 4, 2)]
          fits = [option for option, code in OPTIONS["line"].items()
                  if all(run(code, price=p, fee=f, count=c)["cost"] == expected(p, f, c) for p, f, c in cases)]
          answers = {"line": fits[0] if len(fits) == 1 else fits}
      - id: py02.k1.q3
        kind: [trace]
        body: |
          ```python startLine=1
          n = 2
          n = n * 3 + 1
          n = (n - 1) * 2
          print(n)
          ```
        slots:
          - id: trace
            type: table
            prompt: 填写前三行各自执行后 `n` 的值。
            columns:
              - id: line
                header: 执行到
              - id: "n"
                header: "n"
                input: integer
            rows:
              - id: l1
                cells: { line: 第 1 行, "n": 2 }
              - id: l2
                cells: { line: 第 2 行, "n": 7 }
              - id: l3
                cells: { line: 第 3 行, "n": 12 }
          - id: output
            type: text
            format: integer
            prompt: 最后显示什么？
            key: 12
            feedback:
              - when: 5
                message: 括号里的 n - 1 先算。第 3 行的 n 是 7，括号里得 6，再乘 2。
        explanation: |
          `n` 依次是 **2 → 7 → 12**，最后显示 **12**。第 2 行先算 `2 * 3` 得 6，再加 1 得 7；第 3 行先算括号里的 `7 - 1` 得 6，再乘 2 得 12。每一行都用那一刻的 `n`。
        verify: |
          states = trace(names=["n"])[:3]
          answers = {
              "trace": {f"l{i}": {"n": state["n"]} for i, state in enumerate(states, 1)},
              "output": int(run().out),
          }
      - id: py02.k1.q4
        kind: [debug]
        body: |
          要先合并两批数量，再按每批 3 份包装。哪段代码对所有非负整数 a、b 都得到三倍的合计？
        slots:
          - id: formula
            type: choice
            options:
              - {id: first, content: "`result = a + b * 3`"}
              - {id: grouped, content: "`result = (a + b) * 3`"}
              - {id: reduced, content: "`result = a + (b - 3)`"}
            key: grouped
        explanation: "括号让 a + b 先计算，再把整个合计乘 3。没有括号时，只有 b 被乘了 3。"
        verify: |
          programs = {"first": "result = a + b * 3", "grouped": "result = (a + b) * 3", "reduced": "result = a + (b - 3)"}
          fits = [key for key, code in programs.items()
                  if all(run(code, a=a, b=b)["result"] == 3 * (a + b) for a, b in [(0, 0), (1, 0), (0, 2), (4, 7)])]
          assert len(fits) == 1
          answers = {"formula": fits[0]}
      - id: py02.k1.q5
        kind: [trace]
        body: |
          两个算式用了同样的数字和符号。分别计算结果，观察括号改变了哪一步。

          ```python
          print(30 - 12 - 4)
          print(30 - (12 - 4))
          ```
        slots:
          - {id: plain, type: text, format: integer, prompt: 第一行显示, key: 14}
          - {id: grouped, type: text, format: integer, prompt: 第二行显示, key: 22}
        explanation: "连续减法从左往右，先得到 18 再减 4，结果是 14。第二行先算括号中的 8，再算 30 - 8，结果是 22。"
        verify: |
          lines = run().lines()
          answers = {"plain": int(lines[0]), "grouped": int(lines[1])}
    review:
      - id: py02.k1.r1
        kind: [trace]
        body: |
          库存原有 20 份样本，用掉 2 批、每批 3 份，又收到 4 份。同事写下了这一行：

          ```python
          stock = 20 - 2 * 3 + 4
          ```
        slots:
          - id: steps
            type: order
            partial: true
            prompt: 按 Python 实际计算的先后，排出等号右边的计算步骤；不会发生的步骤不要放进来。
            items:
              - { id: sub, content: "`20 - 6` 得 14" }
              - { id: early_sub, content: "`20 - 2` 得 18" }
              - { id: add, content: "`14 + 4` 得 18" }
              - { id: mul, content: "`2 * 3` 得 6" }
              - { id: early_add, content: "`3 + 4` 得 7" }
            key: [mul, sub, add]
          - id: result
            type: text
            format: integer
            prompt: "`stock` 最后是多少？"
            key: 18
        explanation: |
          先算乘法 `2 * 3` 得 6；剩下的减和加是同一级，从左往右：`20 - 6` 得 14，再 `14 + 4` 得 **18**。

          `20 - 2` 不会发生，因为 2 先要和 3 相乘；`3 + 4` 也不会发生，因为 3 已经在乘法里用掉了。
        verify: |
          import ast
          # 按 Python 的计算顺序遍历算式，记下每一步实际算的是哪两个数。
          steps = []
          def value(node):
              if isinstance(node, ast.Constant):
                  return node.value
              left, right = value(node.left), value(node.right)
              symbol = {ast.Add: "+", ast.Sub: "-", ast.Mult: "*"}[type(node.op)]
              steps.append(f"{left} {symbol} {right}")
              return eval(f"{left} {symbol} {right}")
          result = value(ast.parse(CODE).body[0].value)
          # 把算出的步骤对应到块；不在这里的块就是不会发生的步骤。
          blocks = {"2 * 3": "mul", "20 - 6": "sub", "14 + 4": "add", "20 - 2": "early_sub", "3 + 4": "early_add"}
          answers = {"steps": [blocks[step] for step in steps], "result": run()["stock"]}
      - id: py02.k1.r2
        kind: [modify]
        body: |
          每块板有 96 个孔，每块板都要留出 6 个孔放对照，其余的孔放样本。`plates` 是板数。

          作答框里的代码想算出一共能放多少个样本，存进 `capacity`，但只在一块板时算对。请改正它，结果变量仍叫 `capacity`。宿主提供了 `plates = 2`，换一次实验可能是别的板数。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              capacity = plates * 96 - 6
            solution: |
              capacity = plates * (96 - 6)
            accepts:
              - capacity = (96 - 6) * plates
              - capacity = plates * 96 - plates * 6
              - capacity = plates * 90
            rejects:
              - code: capacity = plates * 96
                why: 没有扣掉对照孔
              - code: capacity = plates * 96 - 6 * 2
                why: 只在两块板时碰巧算对
              - code: capacity = (plates - 6) * 96
                why: 括号括错了位置
              - code: capacity = 180
                why: 把结果写死成两块板的数
            tests:
              - name: 两块板
                setup: plates = 2
                expect:
                  capacity: "180"
              - name: 三块板
                hidden: true
                setup: plates = 3
                expect:
                  capacity: "270"
              - name: 五块板
                hidden: true
                setup: plates = 5
                expect:
                  capacity: "450"
        explanation: |
          ```python
          capacity = plates * (96 - 6)
          ```

          每块板能放样本的孔是 96 - 6 = 90 个，要先在括号里算出来，再乘板数。原来的 `plates * 96 - 6` 先算乘法，只扣了一次 6 个孔，所以只有一块板时才对。写成 `plates * 96 - plates * 6` 也对。
      - id: py02.k1.r3
        kind:
          - trace
        body: |
          先抵扣优惠再按份数计费，与只给最后一项乘份数不同。读出两个算式的结果。

          ```python
          print((18 - 3) * 2)
          print(18 - 3 * 2)
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '30'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '12'
        explanation: 第一行先做括号内减法得到 15，再乘 2；第二行先乘得 6，再从 18 中减去它。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
    quiz:
      - id: py02.k1.x1
        kind: [predict]
        body: |
          逐行写出程序显示的整数。

          ```python startLine=1
          print(10 - 4 - 3)
          print(10 - (4 - 3))
          print(2 * 3 + 2 * 4)
          print(2 * (3 + 2) * 4)
          ```
        slots:
          - id: outputs
            type: table
            columns:
              - id: line
                header: 第几行
              - id: shown
                header: 显示
                input: integer
            rows:
              - id: l1
                cells: { line: 第 1 行, shown: 3 }
              - id: l2
                cells: { line: 第 2 行, shown: 9 }
              - id: l3
                cells: { line: 第 3 行, shown: 14 }
              - id: l4
                cells: { line: 第 4 行, shown: 40 }
        explanation: |
          | 行 | 怎样算 | 显示 |
          |---|---|---:|
          | 1 | 从左往右：10 - 4 得 6，再减 3 | 3 |
          | 2 | 括号先算：4 - 3 得 1，10 - 1 | 9 |
          | 3 | 两个乘法先算：6 + 8 | 14 |
          | 4 | 括号先算得 5，再从左往右乘：2 × 5 × 4 | 40 |

          第 1、2 行只差一对括号：减法从左往右算，括号改变了先后，结果也就不同。
        verify: |
          lines = run().lines()
          answers = {"outputs": {f"l{i}": {"shown": int(line)} for i, line in enumerate(lines, 1)}}
      - id: py02.k1.x2
        kind: [debug, predict]
        body: |
          需求是：每个样本先离心 5 分钟，再静置 10 分钟；`n` 个样本一个接一个处理，算出一共要多少分钟。同事写的程序是：

          ```python
          n = 4
          minutes = n * 5 + 10
          print(minutes)
          ```
        slots:
          - id: shown
            type: text
            format: integer
            prompt: 程序显示多少？
            key: 30
          - id: needed
            type: text
            format: integer
            prompt: 按需求，4 个样本一共要多少分钟？
            suffix: 分钟
            key: 60
          - id: coincide
            type: choice
            prompt: 同事先用一个样本试了试，结果和需求一样，就以为写对了。n 取下面哪个值时，`n * 5 + 10` 才会碰巧和需求算出同样的分钟数？
            options:
              - { id: n1, content: "1" }
              - { id: n2, content: "2" }
              - { id: n4, content: "4" }
              - { id: n10, content: "10" }
            key: n1
        explanation: |
          程序显示 **30**：先算 `4 * 5` 得 20，再加 10，静置时间只算了一次。按需求，每个样本要 5 + 10 = 15 分钟，4 个样本是 **60** 分钟，应当写成 `n * (5 + 10)`。

          n 取 **1** 时，`1 * 5 + 10` 是 15，`1 * (5 + 10)` 也是 15：只有一个样本时，静置“算一次”和“每个样本各算一次”没有区别。n 是 2、4、10 时，错误写法分别得 20、30、60，而需求是 30、60、150。检查算式时只试一个样本，查不出这处括号的问题，要多试几个不同的值。
        verify: |
          # 按需求逐个样本累加：每个样本 5 分钟加 10 分钟。
          def needed(n):
              total = 0
              for _ in range(n):
                  total = total + 5 + 10
              return total
          same = [f"n{n}" for n in (1, 2, 4, 10) if n * 5 + 10 == needed(n)]
          r = run()
          answers = {"shown": int(r.out), "needed": needed(r["n"]), "coincide": same[0] if len(same) == 1 else same}

      - id: py02.k1.x3
        kind:
          - trace
        body: |
          同一级除法与乘法从左到右；括号改变被除数。读出两个结果。

          ```python
          print(24 / 3 * 2)
          print(24 / (3 * 2))
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: '16.0'
          - id: v1
            type: text
            match: output
            prompt: 第 2 项
            key: '4.0'
        explanation: 第一行先 24 / 3 得 8.0，再乘 2；第二行先算括号中的 6，再用 24 除它。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
  - id: py02.k2
    keyPrerequisites: [py01]
    title: 除法 /、整除 // 与余数 %
    card:
      name: 三种除法
      aliases: [整除, 余数, "//", "%"]
      definition: "`/` 是普通除法，结果总带小数点；`//` 只留下整除的整数部分；`%` 取余数。"
      conditions:
        - "`/` 除得尽也带小数点：`6 / 2` 显示 3.0，不是 3。"
        - "`//` 与 `%` 常一起用：装满几盒、还剩几个。这里只用正数。"
        - 它们和 `*` 同一级，比加减先算；求平均要写成 `(a + b) / 2`。
      example:
        from: py02.k2.e0
        text: |
          50 管样本装进每盒 8 管的盒子：`50 // 8` 得 6（装满 6 盒），`50 % 8` 得 2（还剩 2 管），`50 / 8` 得 6.25。
    lesson: |
      Python 有三种和除法有关的写法。把 50 管样本装进每盒 8 管的盒子：

      | 写法 | 结果 | 意思 |
      |---|---:|---|
      | `50 / 8` | 6.25 | 普通除法 |
      | `50 // 8` | 6 | 整除：能装满 6 盒 |
      | `50 % 8` | 2 | 余数：装满后还剩 2 管 |

      可以这样核对：6 盒 × 8 管 + 2 管 = 50 管。

      - `/` 的结果总带小数点，即使除得尽：`6 / 2` 显示 `3.0`，不是 `3`。
      - `//` 只留下整数部分，不四舍五入：`50 // 8` 是 6，不是 7。
      - `%` 读作“除以……的余数”。这一节只用正数。

      这三种写法和 `*` 是同一级，比加减先算（见[运算顺序](repa:concept/py02.k1)）。所以两个读数的平均要写成 `(a + b) / 2`：写成 `a + b / 2`，会先算 `b / 2`，再加上 `a`。
    example:
      id: py02.k2.e0
      kind: [predict]
      body: |
        50 管样本，每盒装 8 管。阅读下面的程序。

        ```python startLine=1
        tubes = 50
        per_box = 8
        full = tubes // per_box
        left = tubes % per_box
        print(full)
        print(left)
        print(tubes / per_box)
        ```
      slots:
        - id: line1
          type: text
          format: integer
          prompt: 第一行显示（装满几盒）
          key: 6
        - id: line2
          type: text
          format: integer
          prompt: 第二行显示（还剩几管）
          key: 2
        - id: line3
          type: text
          match: output
          prompt: 第三行显示
          key: "6.25"
      explanation: |
        依次显示 **6**、**2**、**6.25**。`50 // 8` 只留下整除的整数部分 6，也就是能装满 6 盒；`50 % 8` 是余数 2，装满后还剩 2 管；`50 / 8` 是普通除法，得 6.25。

        核对一下：6 × 8 + 2 = 50，一管不多一管不少。
      verify: |
        lines = run().lines()
        answers = {"line1": int(lines[0]), "line2": int(lines[1]), "line3": lines[2]}
