id: py28
title: 把分组统计口径写明确
status: complete
minutes: 20
summary: 用 .agg(输出列名=("源列", "操作")) 把分组汇总的每一列写明白；分组列有缺失时用 dropna 说清要不要留下这些行，并用 size 与 count 核对行数。
prerequisites:
  - topic: py27
    key: true
    weight: 1.00
    covers: [py27.k1, py27.k2]
  - topic: py19
    key: true
    weight: 0.67
    covers: [py19.k1, py19.k3]
  - topic: py12
    key: true
    weight: 0.50
    covers: [py12.k1]
sources:
  - source: pydata-book
    where: 第 10 章 §10.2（数据聚合、命名聚合）
    url: https://wesmckinney.com/book/data-aggregation
    use: reference
  - source: pandas-docs
    where: 用户指南：分组（命名聚合、分组键中的缺失值）
    url: https://pandas.pydata.org/docs/user_guide/groupby.html
    use: reference
notes: |
  范围：只读写 .agg(输出列名=("源列", "操作")) 这一种固定形式，操作用 mean、sum、count、size、max、min；括号里两个位置的含义在 k1 讲解里就地说明，完整的元组行为由 py38 承担。分组键先用普通字符串，不讲 category 与 observed。k2 只讲分组列缺失时 dropna 的默认与 dropna=False，以及 size 与 count 的区别。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 4 分钟；k2 讲解与例题 4 分钟、练习 5 分钟；收束 2 分钟。
  小表、讲解和题目为本课自拟。例题里“第一个位置表示什么”一问列在 manual 里（例题，不强制核对）；k1.q3 的配置表由程序在候选的源列和操作里逐个运行、找出唯一符合要求的组合来核对。复习和测验题全部由程序核对。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始。大多数题用表 B 和表 A：`sample_id` 是样本编号，`group` 是实验组标签，`signal` 是一次测量的值（任意单位）；NaN 表示缺失。表 A 里有一个样本没有标组。

  上一节的分组结果只有一列、名字沿用原来的列名。交给别人的汇总表往往要好几列，每一列是什么，要写在代码里，也要写在要求里。
wrapup: |
  读一段 `.agg(...)`，每一行都读成“输出列名 = （从哪一列取值，怎样算）”，然后只相信括号里的内容，列名只是名字。再核对一次行数：各组的 size 加起来等不等于原表行数，不等就是有行因为分组列缺失被丢掉了。

  向同事或 AI 提要求时，可以说：“按 group 分组，输出 mean_signal（signal 的平均，跳过缺失）和 n_valid（有 signal 的样本数）两列；没有标组的样本单独列为一组，不要丢掉。”
