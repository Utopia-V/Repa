        explanation: |
          `s1` 只有 T1、T2 两行，nights 共 **5**，N4 那一晚没写灯号，被整行丢掉了；`s2` 多出组名为 NaN 的一行，共 **3** 行。T1 有 N1、N3、N6 三晚，size 数的是行，N6 虽然没数虫子也算在内，所以是 **3**。
        verify: |
