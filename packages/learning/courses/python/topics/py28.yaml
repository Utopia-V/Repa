kps:
  - id: py28.k1
    title: named aggregation 的固定（源列, 操作）配置指明输出
    card:
      name: 命名聚合
      aliases: [agg, named aggregation]
      definition: .agg(输出列名=("源列", "操作")) 写明结果的每一列：等号前是这一列的名字，括号里第一个位置是从哪一列取值，第二个位置是怎样算。
      conditions:
        - 结果的列按写的先后排列；每组一行，行标签是排好序的组名。
        - 输出列名只是名字，算的是什么由括号里的源列和操作决定。
      example:
        from: py28.k1.e0
        text: |
          ```python
          summary = df.groupby("group").agg(
              mean_signal=("signal", "mean"),
              n_valid=("signal", "count"),
          )
          ```
          表 B：control 组 mean_signal 10.0、n_valid 3；drug 组 10.5、2。
    lesson: |
      上一节的 `df.groupby("group")["signal"].mean()` 只得到一列，名字沿用 signal。交给别人的汇总表常常要好几列，而且每列叫什么、怎么算都要说得清。这时写成：

      ```python
      summary = df.groupby("group").agg(
          mean_signal=("signal", "mean"),
          n_valid=("signal", "count"),
      )
      ```

      括号没有合上之前可以换行，所以这是一行代码分几行写。`.agg(...)` 里每一行都照同一个格式读：

      > **输出列名 = ("从哪一列取值", "怎样算")**

      圆括号里有两个位置：第一个位置写源列的名字，第二个位置写操作的名字，常用的有 `"mean"`、`"sum"`、`"count"`、`"max"`、`"min"`。所以 `n_valid=("signal", "count")` 的意思是：数一数每组 signal 有值的格子，结果放进叫 n_valid 的一列。

      结果每组一行，行标签是排好序的组名（和 [每组一行](repa:concept/py27.k2) 一样），列按写的先后排列。

      输出列名可以随便起，pandas 不会检查它和括号里是否相符：写 `mean_signal=("signal", "max")` 也能运行，只是名不副实。核对一段 `.agg` 时，要看括号里的源列和操作，而不是只看列名。
    example:
      id: py28.k1.e0
      kind: [predict, explain]
      uses: [py27.k1, py27.k2]
      data: [B]
      body: |
        阅读代码，说出 `summary` 的样子。

        ```python
        summary = df.groupby("group").agg(
            mean_signal=("signal", "mean"),
            n_valid=("signal", "count"),
        )
        ```
      slots:
        - id: columns
          type: order
          partial: true
          prompt: "`summary` 有哪些列？按顺序排列。"
          items:
            - { id: group, content: "`group`" }
            - { id: n_valid, content: "`n_valid`" }
            - { id: signal, content: "`signal`" }
            - { id: mean_signal, content: "`mean_signal`" }
          key: [mean_signal, n_valid]
        - id: values
          type: table
          prompt: 填写每组的值。
          columns:
            - { id: group, header: 组 }
            - { id: mean_signal, header: mean_signal, input: { type: text, format: number } }
            - { id: n_valid, header: n_valid, input: integer }
          rows:
            - { id: control, cells: { group: control, mean_signal: 10, n_valid: 3 } }
            - { id: drug, cells: { group: drug, mean_signal: 10.5, n_valid: 2 } }
        - id: first
          type: choice
          prompt: "`(\"signal\", \"count\")` 里的 `\"signal\"` 表示什么？"
          options:
            - { id: name, content: 输出列的名字 }
            - { id: source, content: 从哪一列取值 }
            - { id: key, content: 按哪一列分组 }
          key: source
      explanation: |
        列依次是 **mean_signal、n_valid**，组名 control、drug 是行标签，不是列。control 组 signal 为 10.0、11.0、9.0，平均 **10.0**，有值 **3** 个；drug 组为 8.0、NaN、13.0，平均 **10.5**，有值 **2** 个。

        `("signal", "count")` 里的 `"signal"` 是**从哪一列取值**；输出列的名字写在等号前面，分组列写在 `groupby` 里。
      verify: |
        summary = run()["summary"]
        answers = {
            "columns": list(summary.columns),
            "values": {label: {"mean_signal": summary.loc[label, "mean_signal"], "n_valid": summary.loc[label, "n_valid"]} for label in summary.index},
        }
      manual: [first]
    practice:
      - id: py28.k1.q1
        kind: [predict]
        uses: [py27.k1, py27.k2]
        data: [B]
        body: |
          阅读代码，说出 `summary` 的样子。

          ```python
          summary = df.groupby("group").agg(
              total=("signal", "sum"),
              top=("signal", "max"),
          )
          ```
        slots:
          - id: columns
            type: order
            partial: true
            prompt: "`summary` 有哪些列？按顺序排列。"
            items:
              - { id: top, content: "`top`" }
              - { id: signal, content: "`signal`" }
              - { id: total, content: "`total`" }
            key: [total, top]
          - id: values
            type: table
            columns:
              - { id: group, header: 组 }
              - { id: total, header: total, input: { type: text, format: number } }
              - { id: top, header: top, input: { type: text, format: number } }
            rows:
              - { id: control, cells: { group: control, total: 30, top: 11 } }
              - { id: drug, cells: { group: drug, total: 21, top: 13 } }
        explanation: |
          列依次是 **total、top**，和写的先后一致。control 组：10.0 + 11.0 + 9.0 = **30.0**，最大 **11.0**；drug 组跳过 NaN，8.0 + 13.0 = **21.0**，最大 **13.0**。
        verify: |
          summary = run()["summary"]
          answers = {
              "columns": list(summary.columns),
              "values": {label: {"total": summary.loc[label, "total"], "top": summary.loc[label, "top"]} for label in summary.index},
          }
      - id: py28.k1.q2
        kind: [debug]
        uses: [py27.k1]
        data: [B]
        body: |
          要求是：“按 group 分组，mean_signal 是 signal 的平均，n_valid 是有 signal 的样本数。”同事写了：

          ```python startLine=1
          summary = df.groupby("group").agg(
              mean_signal=("signal", "mean"),
              n_valid=("sample_id", "count"),
          )
          ```
        slots:
          - id: line
            type: choice
            prompt: 哪一行不符合要求？
            options:
              - { id: l1, content: 第 1 行：分组列写错了 }
              - { id: l2, content: 第 2 行：平均的源列写错了 }
              - { id: l3, content: 第 3 行：数的是 sample_id 有值的个数，不是 signal 有值的个数 }
            key: l3
          - id: got
            type: text
            format: integer
            prompt: 这段代码算出的 drug 组 n_valid 是多少？
            key: 3
          - id: right
            type: text
            format: integer
            prompt: 按要求应当是多少？
            key: 2
        explanation: |
          问题在**第 3 行**。`("sample_id", "count")` 数的是 sample_id 有值的格子，每个样本都有编号，于是 drug 组得到 **3**，把 signal 缺失的 S_D 也算了进去。要求的是有 signal 的样本数，应写 `n_valid=("signal", "count")`，drug 组是 **2**。
        verify: |
          wrong = run()["summary"]
          fixed = run(CODE.replace('("sample_id", "count")', '("signal", "count")'))["summary"]
          by_hand = sum(1 for label, value in zip(df["group"], df["signal"]) if label == "drug" and value == value)
          # 只改第 3 行的源列就得到要求的结果，说明错在第 3 行。
          answers = {
              "line": "l3" if fixed.loc["drug", "n_valid"] == by_hand and wrong.loc["drug", "mean_signal"] == fixed.loc["drug", "mean_signal"] else "other",
              "got": wrong.loc["drug", "n_valid"],
              "right": by_hand,
          }
      - id: py28.k1.q3
        kind: [specify]
        uses: [py12.k1]
        data: [B]
        body: |
          要求是：“按 group 分组，输出两列：peak 是每组 signal 的最大值；n 是每组有 signal 的样本数。”

          代码写成 `df.groupby("group").agg(peak=(源列, 操作), n=(源列, 操作))`。把两处括号里的源列和操作填上。
        slots:
          - id: config
            type: table
            columns:
              - { id: output, header: 输出列 }
              - id: source
                header: 源列
                input: { type: choice, options: [{ id: sample_id, label: sample_id }, { id: group, label: group }, { id: signal, label: signal }] }
              - id: op
                header: 操作
                input: { type: choice, options: [{ id: mean, label: mean }, { id: sum, label: sum }, { id: count, label: count }, { id: max, label: max }] }
            rows:
              - { id: peak, cells: { output: peak, source: signal, op: max } }
              - { id: "n", cells: { output: "n", source: signal, op: count } }
        explanation: |
          peak 填 **("signal", "max")**；n 填 **("signal", "count")**：

          ```python
          summary = df.groupby("group").agg(
              peak=("signal", "max"),
              n=("signal", "count"),
          )
          ```

          n 不能写 `("sample_id", "count")`：sample_id 没有缺失，会把 signal 缺失的样本也数进去。
        verify: |
          # 按要求逐组手算，再在候选的源列和操作里找出唯一能得到这个结果的组合。
          peak, n = {}, {}
          for label, value in zip(df["group"].tolist(), df["signal"].tolist()):
              if value == value:
                  peak[label] = max(peak.get(label, value), value)
                  n[label] = n.get(label, 0) + 1
          def found(target):
              hits = []
              for source in ["sample_id", "group", "signal"]:
                  for op in ["mean", "sum", "count", "max"]:
                      r = run(f'out = df.groupby("group").agg(x=("{source}", "{op}"))["x"]')
                      if r.error is None and r["out"].to_dict() == target:
                          hits.append((source, op))
              return hits
          peak_hits, n_hits = found(peak), found(n)
          assert len(peak_hits) == 1 and len(n_hits) == 1, (peak_hits, n_hits)
          answers = {"config": {
              "peak": {"source": peak_hits[0][0], "op": peak_hits[0][1]},
              "n": {"source": n_hits[0][0], "op": n_hits[0][1]},
          }}
    review:
      - id: py28.k1.r1
        kind: [modify]
        uses: [py27.k1]
        data: [soil]
        body: |
          要求是：“按地块 plot 分组，依次输出两列：deepest 是测到的最大深度；n_sites 是测到深度的采样点个数。”

          挑出需要的行，排成一段代码，结果存进 `summary`。不需要的行不要放进来。
        slots:
          - id: lines
            type: order
            partial: true
            items:
              - { id: close, code: ) }
              - { id: n_site, code: 'n_sites=("site", "count"),' }
              - { id: deepest, code: 'deepest=("depth", "max"),' }
              - { id: open, code: 'summary = soil.groupby("plot").agg(' }
              - { id: n_depth, code: 'n_sites=("depth", "count"),' }
              - { id: deep_mean, code: 'deepest=("depth", "mean"),' }
            key: [open, deepest, n_depth, close]
            tests:
              - name: 表 soil
                expect:
                  summary: 'pd.DataFrame({"deepest": [25.0, 33.0, 30.0], "n_sites": [2, 2, 1]}, index=["A", "B", "C"])'
              - name: 另一片样地
                hidden: true
                data: [soil2]
                expect:
                  summary: 'pd.DataFrame({"deepest": [18.0, 20.0], "n_sites": [1, 2]}, index=["A", "B"])'
        explanation: |
          ```python
          summary = soil.groupby("plot").agg(
              deepest=("depth", "max"),
              n_sites=("depth", "count"),
          )
          ```

          deepest 要的是最大值，用 `"max"` 而不是 `"mean"`；n_sites 要数的是测到深度的采样点，源列应是 depth：地块 C 的东坡没测到深度，`("site", "count")` 会把它也数进去，得到 2 而不是 1。两列的先后也要照要求排。
      - id: py28.k1.r2
        kind: [predict]
        uses: [py27.k1, py27.k2]
        data: [water]
        body: |
          阅读代码，填写 `summary` 里每个站点的值。

          ```python
          summary = water.groupby("station").agg(
              lowest=("ph", "min"),
              n=("ph", "count"),
          )
          ```
        slots:
          - id: values
            type: table
            columns:
              - { id: station, header: 站点 }
              - { id: lowest, header: lowest, input: { type: text, format: number } }
              - { id: "n", header: "n", input: integer }
            rows:
              - { id: S1, cells: { station: S1, lowest: 7.2, "n": 2 } }
              - { id: S2, cells: { station: S2, lowest: 6.5, "n": 2 } }
              - { id: S3, cells: { station: S3, lowest: 8.0, "n": 1 } }
        explanation: |
          S1 测到 7.2 和 7.4（另一次没测到），最小 **7.2**，n 为 **2**；S2 测到 6.8 和 6.5，最小 **6.5**，n 为 **2**；S3 只有一次 8.0，n 为 **1**。lowest 和 n 都是从 ph 这一列算的。
        verify: |
          summary = run()["summary"]
          answers = {"values": {label: {"lowest": summary.loc[label, "lowest"], "n": summary.loc[label, "n"]} for label in summary.index}}
    quiz:
      - id: py28.k1.x1
        kind: [specify]
        uses: [py12.k1, py27.k1]
        data: [farm]
        body: |
          要求是：“按作物 crop 分组，依次输出两列：total_kg 是总产量，n_plots 是种这种作物的地块数。”哪一段代码符合要求？
        slots:
          - id: code
            type: choice
            options:
              - id: swapped
                content: |
                  ```python
                  summary = farm.groupby("crop").agg(
                      total_kg=("yield_kg", "count"),
                      n_plots=("yield_kg", "sum"),
                  )
                  ```
              - id: right
                content: |
                  ```python
                  summary = farm.groupby("crop").agg(
                      total_kg=("yield_kg", "sum"),
                      n_plots=("plot", "count"),
                  )
                  ```
              - id: mean
                content: |
                  ```python
                  summary = farm.groupby("crop").agg(
                      total_kg=("yield_kg", "mean"),
                      n_plots=("plot", "count"),
                  )
                  ```
              - id: order
                content: |
                  ```python
                  summary = farm.groupby("crop").agg(
                      n_plots=("plot", "count"),
                      total_kg=("yield_kg", "sum"),
                  )
                  ```
            key: right
        explanation: |
          total_kg 用 `("yield_kg", "sum")`、n_plots 用 `("plot", "count")`、两列按要求的先后写的那一段符合要求：wheat 15 千克、3 块地，corn 13 千克、2 块，rice 3 千克、1 块。把 sum 和 count 交换，列名就名不副实；`"mean"` 算的是平均产量；n_plots 写在前面，列的先后与要求不符。
        verify: |
          totals, plots = {}, {}
          for crop, value in zip(farm["crop"].tolist(), farm["yield_kg"].tolist()):
              totals[crop] = totals.get(crop, 0) + value
              plots[crop] = plots.get(crop, 0) + 1
          def fits(code):
