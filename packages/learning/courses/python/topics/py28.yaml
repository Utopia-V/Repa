  - id: py28.k2
    title: 分组键缺失用 dropna 明确是否保留，并核对 count/size
    card:
      name: 分组键缺失
      aliases: [dropna, size 与 count]
      definition: 分组列是缺失（NaN）的行，groupby 默认整行丢掉、不进任何一组；写 dropna=False 才会把它们留成单独的一组。
      conditions:
        - 核对：各组 size 加起来应等于原表行数；少了，就是有行因分组列缺失被丢掉了。
        - size 数这一组有几行；count 只数源列里有值的格子。
      example:
        from: py28.k2.e0
        text: |
          表 A 有 6 行，S_C 没有标组：默认分组只有 control（2 行）和 drug（3 行），共 5 行；dropna=False 多出一组 NaN（1 行）。
    lesson: |
      表 A 里 S_C 的 group 是 NaN。分组时，这一行默认**整行丢掉**：它不属于 control，也不属于 drug，也不会单独成组，结果里根本看不到它，也没有任何提示。

      要发现这一点，在汇总里同时放两种计数：

      ```python
      summary = df.groupby("group").agg(
          rows=("signal", "size"),
          n_valid=("signal", "count"),
      )
      ```

      - `"size"` 数这一组**有几行**，源列里是不是缺失都算；
      - `"count"` 只数源列里**有值**的格子，和 [行数与 count](repa:concept/py26.k1) 里一样。

      表 A 上，control 组 rows 2、n_valid 2；drug 组 rows 3、n_valid 2（S_D 没测到）。rows 加起来是 5，而 `len(df)` 是 6：差的那一行就是没标组的 S_C。

      想把没标组的行留下，写 `df.groupby("group", dropna=False)`，结果会多一行，组名显示为 NaN，排在最后。留下还是丢掉，是一条要写进要求的规则：丢掉时要报告丢了几行，留下时要说明这一组代表“没有标组”。
    example:
      id: py28.k2.e0
      kind: [predict]
      uses: [py19.k1, py26.k1]
      data: [A]
      body: |
        两段代码分别得到 `s1` 和 `s2`。

        ```python
        s1 = df.groupby("group").agg(rows=("signal", "size"))
        s2 = df.groupby("group", dropna=False).agg(rows=("signal", "size"))
        ```
      slots:
        - id: s1_groups
          type: text
          format: integer
          prompt: "`s1` 有几行（几个组）？"
          key: 2
        - id: s1_total
          type: text
          format: integer
          prompt: "`s1` 的 rows 加起来是多少？"
          key: 5
        - id: s2_groups
          type: text
          format: integer
          prompt: "`s2` 有几行？"
          key: 3
        - id: s2_total
          type: text
          format: integer
          prompt: "`s2` 的 rows 加起来是多少？"
          key: 6
        - id: dropped
          type: text
          prompt: "`s1` 里少了哪个样本？写出它的 sample_id。"
          key: S_C
      explanation: |
        `s1` 只有 control、drug **2** 组，rows 加起来 **5**；`s2` 多出组名为 NaN 的一组，共 **3** 行，rows 加起来 **6**，等于 `len(df)`。`s1` 里少的是没有标组的 **S_C**。
      verify: |
        r = run()
        s1, s2 = r["s1"], r["s2"]
        lost = [sample for sample, label in zip(df["sample_id"], df["group"]) if label != label]
        assert len(df) - s1["rows"].sum() == len(lost)
        answers = {
            "s1_groups": len(s1), "s1_total": s1["rows"].sum(),
            "s2_groups": len(s2), "s2_total": s2["rows"].sum(),
            "dropped": lost[0] if len(lost) == 1 else lost,
        }
    practice:
      - id: py28.k2.q1
        kind: [predict]
        uses: [py26.k1]
        data: [A]
        body: |
          阅读代码，填写 `summary` 每一行的值。组名为 NaN 的那一行也要填。

          ```python
          summary = df.groupby("group", dropna=False).agg(
              rows=("signal", "size"),
              n_valid=("signal", "count"),
          )
          ```
        slots:
          - id: values
            type: table
            columns:
              - { id: group, header: 组 }
              - { id: rows, header: rows, input: integer }
              - { id: n_valid, header: n_valid, input: integer }
            rows:
              - { id: control, cells: { group: control, rows: 2, n_valid: 2 } }
              - { id: drug, cells: { group: drug, rows: 3, n_valid: 2 } }
              - { id: missing, cells: { group: NaN, rows: 1, n_valid: 1 } }
        explanation: |
          | 组 | rows | n_valid |
          |---|---:|---:|
          | control | 2 | 2 |
          | drug | 3 | 2 |
          | NaN | 1 | 1 |

          drug 组有 3 行，但 S_D 的 signal 没测到，所以 size 是 3、count 是 2。NaN 组就是没标组的 S_C，它测到了 signal，两种计数都是 1。三组的 rows 加起来是 6，没有行被丢掉。
        verify: |
          summary = run()["summary"]
          def row_id(label):
              return "missing" if label != label else label
          answers = {"values": {row_id(label): {"rows": summary.loc[label, "rows"], "n_valid": summary.loc[label, "n_valid"]}
                                for label in summary.index if label == label}}
          nan_rows = summary[summary.index.isna()]
          answers["values"]["missing"] = {"rows": nan_rows["rows"].iloc[0], "n_valid": nan_rows["n_valid"].iloc[0]}
      - id: py28.k2.q2
        kind: [debug]
        uses: [py19.k1, py26.k1]
        data: [A]
        body: |
          同事交来的汇总表是这样算的：

          ```python
          summary = df.groupby("group").agg(rows=("signal", "size"))
          ```

          他发现 rows 加起来是 5，可表 A 明明有 6 行。
        slots:
          - id: why
            type: choice
            prompt: 少的那一行是怎么回事？
            options:
              - id: key_missing
                content: 有一行 group 是缺失，默认分组时整行被丢掉了
              - id: value_missing
                content: 有一行 signal 是缺失，size 没有数它
              - id: duplicate
                content: 有两行重复，被合并成了一行
            key: key_missing
          - id: fix
            type: choice
            prompt: 想让这一行作为单独一组留在结果里，应当怎样改？
            options:
              - { id: dropna, content: 在 groupby 里加上 dropna=False }
              - { id: count, content: 把 "size" 改成 "count" }
              - { id: column, content: 把源列 signal 改成 sample_id }
            key: dropna
        explanation: |
          少的是 group 为缺失的 S_C：默认分组把分组列缺失的行**整行丢掉**。不是 signal 缺失的缘故：size 数行，S_D 的 signal 缺失照样被数进 drug 组。加上 **dropna=False** 后，S_C 会单独成为组名为 NaN 的一组，rows 加起来就是 6。把 size 换成 count 或换源列，都找不回整行被丢掉的 S_C。
        verify: |
          r = run()
          missing_keys = int(df["group"].isna().sum())
          lost = len(df) - r["summary"]["rows"].sum()
          why = "key_missing" if lost == missing_keys and lost > 0 else "other"
          trials = {
              "dropna": 'summary = df.groupby("group", dropna=False).agg(rows=("signal", "size"))',
              "count": 'summary = df.groupby("group").agg(rows=("signal", "count"))',
              "column": 'summary = df.groupby("group").agg(rows=("sample_id", "size"))',
          }
          fixes = [option for option, code in trials.items() if run(code)["summary"]["rows"].sum() == len(df)]
          answers = {"why": why, "fix": fixes[0] if len(fixes) == 1 else fixes}
      - id: py28.k2.q3
        kind: [specify]
        uses: [py12.k1, py19.k3]
        body: |
          表里有些样本没有标组（group 是缺失），有些样本没测到 signal。同事只说：“按组算一下 signal 的平均值。”

          请写一段要求，说清：① 没有标组的样本怎么处理；② 汇总表里除了平均值，还要附上哪两种计数，各说明什么。
        slots:
          - id: spec
            type: text
            lines: 6
            rubric:
              - id: key
                label: 没有标组的样本
                guide: 明确是单独列为一组（dropna=False），还是排除并报告排除了几个；不能不提。
              - id: counts
                label: 两种计数
                guide: 每组的行数（size，样本数）和有 signal 的个数（count，参与平均的个数），并说清两者的区别。
        explanation: |
          一种写法：**按 group 分组，计算每组 signal 的平均值（跳过缺失）。没有标组的样本单独列为一组，不要丢掉。每组另给两列：rows 是这一组的样本数，n_valid 是这一组有 signal 的样本数，也就是平均值用到的个数。**

          也可以要求排除没有标组的样本，但要写明，并要求报告排除了几个。
    review:
      - id: py28.k2.r1
        kind: [predict]
        uses: [py19.k1]
