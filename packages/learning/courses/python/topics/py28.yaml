              return (list(summary.columns) == ["total_kg", "n_plots"]
                      and summary["total_kg"].to_dict() == totals and summary["n_plots"].to_dict() == plots)
          ok = [option for option, code in OPTIONS["code"].items() if fits(code)]
          answers = {"code": ok[0] if len(ok) == 1 else ok}
      - id: py28.k1.x2
