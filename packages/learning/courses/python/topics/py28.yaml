    quiz:
      - id: py28.k2.x1
        kind: [specify]
        uses: [py12.k1, py26.k1]
        data: [visits]
        body: |
          要求是：“按诊室 clinic 分组，依次输出两列：visits 是就诊人次（每行一次），timed 是记下了候诊时间的人次。没记诊室的就诊单独作为一组，不要丢掉。”哪一段代码符合要求？
        slots:
          - id: code
            type: choice
            options:
              - id: default
                content: |
                  ```python
                  summary = visits.groupby("clinic").agg(
                      visits=("wait_min", "size"),
                      timed=("wait_min", "count"),
                  )
                  ```
              - id: both_count
                content: |
                  ```python
                  summary = visits.groupby("clinic", dropna=False).agg(
                      visits=("wait_min", "count"),
                      timed=("wait_min", "count"),
                  )
                  ```
              - id: right
                content: |
                  ```python
                  summary = visits.groupby("clinic", dropna=False).agg(
                      visits=("wait_min", "size"),
                      timed=("wait_min", "count"),
                  )
                  ```
              - id: swapped
                content: |
                  ```python
                  summary = visits.groupby("clinic", dropna=False).agg(
                      visits=("wait_min", "count"),
                      timed=("wait_min", "size"),
                  )
                  ```
            key: right
        explanation: |
          带 `dropna=False`、visits 用 `"size"`、timed 用 `"count"` 的那一段符合要求：K1 3 人次、记了时间 2 人次；K2 2 人次、2 人次；没记诊室的 2 人次、2 人次。不写 dropna=False 会把没记诊室的 V3、V6 整行丢掉；visits 用 count 会漏掉 V2 这样没记时间的就诊；把 size 和 count 交换，两列就名不副实。
        verify: |
          # 按要求逐行手算：诊室缺失的单独成组，visits 数行，timed 数有时间的行。
          groups = {}
          for clinic, wait in zip(visits["clinic"].tolist(), visits["wait_min"].tolist()):
              key = "缺失" if clinic != clinic else clinic
              rows, timed = groups.get(key, (0, 0))
              groups[key] = (rows + 1, timed + (1 if wait == wait else 0))
          def fits(code):
              summary = run(code)["summary"]
              got = {("缺失" if label != label else label): (summary.loc[label, "visits"] if label == label else summary[summary.index.isna()]["visits"].iloc[0],
                                                          summary.loc[label, "timed"] if label == label else summary[summary.index.isna()]["timed"].iloc[0])
                     for label in summary.index}
              return got == groups
          ok = [option for option, code in OPTIONS["code"].items() if fits(code)]
          answers = {"code": ok[0] if len(ok) == 1 else ok}
      - id: py28.k2.x2
        kind: [predict]
        uses: [py19.k1, py26.k1]
        data: [visits]
        body: |
          屏幕上依次显示什么？

          ```python
          a = visits.groupby("clinic").agg(n=("visit", "size"))
          b = visits.groupby("clinic", dropna=False).agg(n=("visit", "size"))
          print(len(visits))
          print(a["n"].sum())
          print(b["n"].sum())
          ```
        slots:
          - id: line1
            type: text
            format: integer
            prompt: 第一行
            key: 7
          - id: line2
            type: text
            format: integer
            prompt: 第二行
            key: 5
          - id: line3
            type: text
            format: integer
            prompt: 第三行
            key: 7
        explanation: |
          依次显示 **7、5、7**。表里 7 次就诊；默认分组丢掉了没记诊室的 V3、V6，各组加起来只有 5；加上 dropna=False 后，它们单独成组，加起来又是 7。拿各组 size 之和和原表行数对一下，就能发现有没有行被悄悄丢掉。
        verify: |
          lines = run().lines()
          answers = {"line1": int(lines[0]), "line2": int(lines[1]), "line3": int(lines[2])}
