  出现 `("signal", "mean")` 时，就地说明两个位置各代表什么，只读写这一种形式；完整的元组行为由 py38 承担。先用普通字符串分组键；category 与 observed 的差别等实际数据需要时再补，不塞进这 20 分钟。
