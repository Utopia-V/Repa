  - id: py32.k2
    title: 同一时区的简单时间差和天数单位
    card:
      name: 时间差与天数
      aliases: [Timedelta, dt.days, 间隔天数]
      definition: 两个日期相减得到时间差（显示为“3 days”），它带着单位，不是普通数字；.dt.days 取出整数天数，才能和数字比较。
      conditions:
        - “间隔几天”是后一天减前一天；“包括首尾共几天”要再加 1，需求里要写明是哪一种。
        - 时间差直接和整数比较会报 TypeError；.dt.day 是日期的“几号”，不是天数。
      example:
        from: py32.k2.e0
        text: |
          ```python
          wait = (tested - collected).dt.days
          ```
          3 月 2 日采样、3 月 5 日检测，wait 为 3；3 月 31 日到 4 月 2 日跨了月份，wait 为 2。
    lesson: |
      把两列文字都读成日期以后，就可以相减：

      ```python
      collected = pd.to_datetime(log["collected"], format="%Y-%m-%d")
      tested = pd.to_datetime(log["tested"], format="%Y-%m-%d")
      gap = tested - collected
      ```

      `gap` 的每个值是一个**时间差**，显示成 `3 days` 这样，带着单位。它不是普通的整数：写 `gap > 5` 会报 TypeError。取 `.dt.days` 才得到整数天数，之后才能和数字比较、筛选：

      ```python
      wait = gap.dt.days
      ```

      相减时 pandas 按日历算，跨月、跨年、2 月有几天都不用自己数。

      “相隔几天”和“一共几天”差 1。3 月 2 日采样、3 月 5 日检测，相隔 5 − 2 = 3 天；如果说“从采样那天到检测那天，两头都算，一共几天”，是 4 天，要写成 `gap.dt.days + 1`。需求里要写明是哪一种，例如“采样当天算第 0 天”。
    example:
      id: py32.k2.e0
      kind: [predict]
      data: [log]
      body: |
        想知道每个样本采样后等了几天才检测。阅读代码，填出 `wait` 的值。

        ```python
        collected = pd.to_datetime(log["collected"], format="%Y-%m-%d")
        tested = pd.to_datetime(log["tested"], format="%Y-%m-%d")
        wait = (tested - collected).dt.days
        ```
      slots:
        - id: wait
          type: table
          columns:
            - { id: sample_id, header: sample_id }
            - { id: collected, header: collected }
            - { id: tested, header: tested }
            - { id: wait, header: wait, input: integer }
          rows:
            - { id: r0, cells: { sample_id: S_A, collected: "2026-03-02", tested: "2026-03-05", wait: 3 } }
            - { id: r1, cells: { sample_id: S_B, collected: "2026-03-15", tested: "2026-03-15", wait: 0 } }
            - { id: r2, cells: { sample_id: S_C, collected: "2026-03-31", tested: "2026-04-02", wait: 2 } }
            - { id: r3, cells: { sample_id: S_D, collected: "2026-04-01", tested: "2026-04-08", wait: 7 } }
        - id: span
          type: text
          format: integer
          prompt: S_A 从采样那天到检测那天，两头都算，一共是几天？
          key: 4
      explanation: |
        `wait` 依次为 **3、0、2、7**。S_B 当天采样当天检测，相隔 0 天；S_C 从 3 月 31 日到 4 月 2 日跨了月份，pandas 按日历算出 2 天。`.dt.days` 把每个时间差变成整数。

        S_A 两头都算是 **4** 天（3 月 2、3、4、5 日），比相隔天数多 1。
      verify: |
        r = run()
        wait = r["wait"]
        answers = {
            "wait": {f"r{label}": {"wait": value} for label, value in wait.items()},
            "span": wait.iloc[0] + 1,
        }
    practice:
      - id: py32.k2.q1
        kind: [debug]
        data: [log]
        body: |
          要标出等了超过 5 天才检测的样本。

          ```python startLine=1
          collected = pd.to_datetime(log["collected"], format="%Y-%m-%d")
          tested = pd.to_datetime(log["tested"], format="%Y-%m-%d")
          gap = tested - collected
          late = gap > 5
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行到第 4 行时会怎样？
            options:
              - id: values
                content: "`late` 依次为 False、False、False、True"
              - id: error
                content: 报 TypeError：时间差不能直接和整数比较
              - id: all_false
                content: "`late` 全是 False"
            key: error
          - id: fix
            type: choice
            prompt: 第 4 行改成哪一行才对？
            options:
              - id: day
                content: |
                  ```python
                  late = gap.dt.day > 5
                  ```
                feedback: 时间差没有 .dt.day（那是日期的“几号”），会报 AttributeError。
              - id: days
                content: |
                  ```python
                  late = gap.dt.days > 5
                  ```
              - id: plain
                content: |
                  ```python
                  late = gap.days > 5
                  ```
                feedback: 一整列时间差要先写 .dt，才能取 days。
            key: days
        explanation: |
          第 4 行**报 TypeError**：`gap` 里是带单位的时间差，pandas 不知道 5 是 5 天还是 5 秒，所以不让它和整数直接比较。

          改成 `late = gap.dt.days > 5`：先取出整数天数（3、0、2、7），再比较，只有 S_D 是 True。`.dt.day` 是日期的“几号”，时间差没有它；不写 `.dt` 也取不到 days。
        verify: |
          import datetime
          r = run()
          prelude = "\n".join(CODE.splitlines()[:3]) + "\n"
          # 用标准库的日期独立算出“超过 5 天”的结果，再挑出与它一致且不报错的那一行。
          expected = [
