id: py32
title: 日期是一种有单位的值
status: complete
minutes: 20
summary: 按约定的格式把文字读成日期并数清读不了的值；两个日期相减得到时间差，取出整数天数；按日期区间筛选时写明两端算不算。
prerequisites:
  - topic: py20
    key: true
    weight: 1.00
    covers: [py20.k1, py20.k2]
  - topic: py18
    key: true
    weight: 1.00
    covers: [py18.k1, py18.k2]
sources:
  - source: pydata-book
    where: 第 11 章 §11.1–11.3
    url: https://wesmckinney.com/book/time-series
    use: reference
  - source: pandas-docs
    where: 入门教程：日期时间
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/09_timeseries.html
    use: reference
notes: |
  范围：输入格式固定、同一时区，日期只到“日”，只用简单的天数间隔；跨时区、夏令时、月份或工作日这类日历偏移另开后续内容。k3 有一道带时刻的题，只用来说明右边界为什么写成“小于下个月 1 日”，不展开时间处理。不问 dtype 的显示文字（pandas 3 里是 datetime64[us]，与教材不同）。
  运行时行为（Pyodide 里核对过）：format 为 "%Y-%m-%d" 时，"2026/03/09"、"20260402"、"2026-02-30" 都读不了，默认报 ValueError，加 errors="coerce" 变成 NaT；空字符串和原本的缺失不报错，直接是 NaT。题目里没有用不补零的写法（如 "2026-3-9"，这个格式也能读）。时间差不能直接和整数比较（TypeError），要先 .dt.days；时间差没有 .dt.day（AttributeError），日期才有 .dt.day（几号）。两个比较不加括号用 & 连起来时报 TypeError。
  建议题型与判分：预测输出（P）、找错（P）、写清需求（S/O）。复习和测验的答案都由 verify 或测试算出，没有 manual。
  节奏（待试做校准）：开场 1 分钟；k1、k2、k3 各约 6 分钟（讲解与例题 2 分钟、练习 4 分钟）；收束 1 分钟。三个知识点偏紧，试用时若超时，优先把 k3 的带时刻一题移到复习。
  取材：日期转换与时间差的写法参照 pandas 入门教程与 Python for Data Analysis 第 11 章，小表、讲解和题目为本课自拟。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码。

  从 CSV 或 Excel 读进来的日期，在 pandas 里往往只是一串文字，例如 `"2026-03-02"`。文字不能相减，也不能按先后比较大小。这一节先按约定的格式把它读成日期，再算相隔几天、筛出某段时间的记录。本节的日期都在同一个时区，只精确到“日”。
wrapup: |
  向同事或 AI 提日期相关的需求时，可以照这三句说：

  - “collected 列按 年-月-日 读成日期，读不了的变成缺失，并告诉我有几个。”
  - “等待天数是检测日期减采样日期的整数天数，采样当天算第 0 天。”
  - “只要 3 月 1 日（含）到 4 月 1 日（不含）之间采的样本。”

  拿到代码后，看 format 是否与数据的写法一致，看有没有数读不了的值，看区间两端用的是 `>=`、`>` 还是 `<`、`<=`。
