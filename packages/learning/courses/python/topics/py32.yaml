kps:
  - id: py32.k1
    title: 按固定格式读懂 to_datetime 与转换失败
    card:
      name: 按格式读日期
      aliases: [to_datetime, NaT, format]
      definition: pd.to_datetime(列, format="%Y-%m-%d") 按给定格式把文字逐个读成日期；格式对不上的值默认让整行报 ValueError，加 errors="coerce" 时变成缺失 NaT。
      conditions:
        - 用了 errors="coerce" 不等于都读对了，要用 isna().sum() 数出有几个 NaT，写进结果说明。
        - 03/04/2026 是 3 月 4 日还是 4 月 3 日只能由数据来源说明，format 要照着说明写。
        - 原本就空着的格子不算格式错误，也直接是 NaT。
      example:
        from: py32.k1.e0
        text: |
          ```python
          dates = pd.to_datetime(raw["collected"], format="%Y-%m-%d", errors="coerce")
          n_bad = dates.isna().sum()
          ```
          "2026/03/09" 用了斜杠，"2026-02-30" 日历上没有，这两个变成 NaT，n_bad 为 2。
    lesson: |
      读进来的日期往往还是文字。`pd.to_datetime` 把一列文字读成日期，`format` 告诉它每个值长什么样：

      | 写法 | 意思 |
      |---|---|
      | `%Y` | 四位年份，例如 2026 |
      | `%m` | 月份，例如 03 |
      | `%d` | 几号，例如 09 |

      `format="%Y-%m-%d"` 就是“年-月-日，中间用短横线”。连接符号也要一模一样：`"2026/03/09"` 用了斜杠，对不上；`"2026-02-30"` 写法对，但日历上没有 2 月 30 日，也读不了。

      遇到读不了的值，默认整行代码报 **ValueError**，什么结果也不产生。加上 `errors="coerce"`，读不了的值变成 **NaT**（日期的缺失值），其余照常读。这和把文字转成数字时的做法一样：程序不报错了，但坏值还在，要用 `.isna().sum()` 数出有几个，写进结果说明。

      格式还决定怎样理解一个值。`"03/04/2026"` 按 `"%d/%m/%Y"`（日/月/年）是 4 月 3 日，按 `"%m/%d/%Y"`（月/日/年）是 3 月 4 日，两种都读得通、都不报错。哪一种对，只能由数据的来源说明，需求里要写明。
    example:
      id: py32.k1.e0
      kind: [predict]
      uses: [py20.k1, py19.k1]
      data: [raw]
      body: |
        登记表约定采样日期写成“年-月-日”。阅读代码，回答下面几问。

        ```python
        dates = pd.to_datetime(raw["collected"], format="%Y-%m-%d", errors="coerce")
        n_bad = dates.isna().sum()
        ```
      slots:
        - id: nat
          type: table
          label: 哪些值变成了 NaT
          columns:
            - { id: sample_id, header: sample_id }
            - { id: collected, header: collected }
            - { id: nat, header: 变成 NaT 吗, input: bool }
          rows:
            - { id: r0, cells: { sample_id: S_A, collected: "2026-03-02", nat: false } }
            - { id: r1, cells: { sample_id: S_B, collected: "2026/03/09", nat: true } }
            - { id: r2, cells: { sample_id: S_C, collected: "2026-03-15", nat: false } }
            - { id: r3, cells: { sample_id: S_D, collected: "2026-02-30", nat: true } }
        - id: n_bad
          type: text
          format: integer
          prompt: "`n_bad` 是多少？"
          key: 2
        - id: strict
          type: choice
          prompt: 如果去掉 `errors="coerce"`，第一行运行时会怎样？
          options:
            - id: skip
              content: 只把读不了的两个值变成 NaT，其余照常
            - id: drop
              content: 把读不了的两行从表里删掉
            - id: error
              content: 报 ValueError，`dates` 没有得到任何值
          key: error
      explanation: |
        S_B 和 S_D 变成 **NaT**，`n_bad` 是 **2**。S_B 的 `"2026/03/09"` 用了斜杠，和格式里的短横线对不上；S_D 的 `"2026-02-30"` 写法没错，但日历上没有 2 月 30 日。

        去掉 `errors="coerce"` 时，遇到第一个读不了的值就**报 ValueError**，这一行没有完成，`dates` 也就没有被赋值。`errors="coerce"` 也不会删掉任何行：`dates` 仍有 4 个值，只是其中两个是 NaT。
      verify: |
        r = run()
        dates = r["dates"]
        strict = run(CODE.replace(', errors="coerce"', ""))
        answers = {
            "nat": {f"r{label}": {"nat": bool(value)} for label, value in dates.isna().items()},
            "n_bad": r["n_bad"],
            "strict": "error" if strict.error == "ValueError" and "dates" not in strict.vars else "other",
        }
    practice:
      - id: py32.k1.q1
        kind: [predict]
        uses: [py20.k1, py19.k1]
        data: [raw2]
        body: |
          日期约定写成“年-月-日”。阅读代码。

          ```python
          dates = pd.to_datetime(raw["collected"], format="%Y-%m-%d", errors="coerce")
          ```
        slots:
          - id: bad
            type: choice
            multiple: true
            prompt: 哪几个样本的日期读不了，变成了 NaT？选出全部。
            options:
              - { id: S_E, content: "S_E（`2026-04-01`）" }
              - { id: S_F, content: "S_F（`20260402`）" }
              - { id: S_G, content: "S_G（`2026-04-03`）" }
              - { id: S_H, content: "S_H（`2026-04-31`）" }
              - { id: S_I, content: "S_I（`2026-04-05`）" }
            key: [S_F, S_H]
          - id: size
            type: text
            format: integer
            prompt: "`dates` 一共有几个值（包括 NaT）？"
            key: 5
            feedback:
              - when: 3
                message: errors="coerce" 不删值，读不了的位置留下 NaT，个数和原来的列一样。
        explanation: |
          **S_F 和 S_H** 读不了：`"20260402"` 中间没有短横线；4 月只有 30 天，`"2026-04-31"` 不存在。`dates` 仍有 **5** 个值，读不了的位置是 NaT，没有被删掉。
        verify: |
          dates = run()["dates"]
          answers = {"bad": list(raw["sample_id"][dates.isna()]), "size": len(dates)}
      - id: py32.k1.q2
        kind: [debug]
        uses: [py20.k1]
        data: [raw3]
        body: |
          下面的程序想数出读不了的日期有几个。

          ```python startLine=1
          dates = pd.to_datetime(raw["collected"], format="%Y-%m-%d")
          print(dates.isna().sum())
          ```
        slots:
          - id: outcome
            type: choice
            prompt: 运行结果是什么？
            options:
              - id: one
                content: 显示 1
              - id: error
                content: 第 1 行报 ValueError，第 2 行没有运行
              - id: zero
                content: 显示 0
            key: error
          - id: fix
            type: choice
            prompt: 把第 1 行换成哪一行，程序就能显示读不了的个数 1？
            options:
              - id: coerce
                content: |
                  ```python
                  dates = pd.to_datetime(raw["collected"], format="%Y-%m-%d", errors="coerce")
                  ```
              - id: dots
                content: |
                  ```python
                  dates = pd.to_datetime(raw["collected"], format="%Y.%m.%d")
                  ```
                feedback: 换成点号以后，另外两个用短横线的值又对不上了，照样报错。
              - id: noformat
                content: |
                  ```python
                  dates = pd.to_datetime(raw["collected"])
                  ```
                feedback: 不写 format 时 pandas 按第一个值猜格式，第三个值仍然对不上，照样报错。
            key: coerce
        explanation: |
          `"2026.05.08"` 用的是点号，和 `"%Y-%m-%d"` 对不上，所以第 1 行**报 ValueError**，程序停在这里，第 2 行没有机会运行。

          加上 `errors="coerce"` 后，这个值变成 NaT，第 2 行显示 1。把格式改成点号，另外两个值又对不上；去掉 format，pandas 按第一个值猜出“年-月-日”，第三个值照样报错。
        verify: |
          r = run()
          prelude_ok = [option for option, line in OPTIONS["fix"].items()
                        if run(line + "\nprint(dates.isna().sum())").error is None
                        and run(line + "\nprint(dates.isna().sum())").out.strip() == "1"]
          answers = {
              "outcome": "error" if r.error == "ValueError" and r.out == "" else ("one" if r.out.strip() == "1" else "zero"),
              "fix": prelude_ok[0] if len(prelude_ok) == 1 else prelude_ok,
          }
      - id: py32.k1.q3
        kind: [specify]
        body: |
          合作实验室发来的表里，日期写成 `03/04/2026`、`25/04/2026` 这样。对方说明：前两位是“日”，中间两位是“月”，最后是年。
        slots:
          - id: fmt
            type: choice
            prompt: "`pd.to_datetime` 的 format 应该写哪一个？"
            options:
              - { id: mdy, content: '`"%m/%d/%Y"`' }
              - { id: ymd, content: '`"%Y-%m-%d"`' }
              - { id: dmy, content: '`"%d/%m/%Y"`' }
              - { id: ymd_slash, content: '`"%Y/%m/%d"`' }
            key: dmy
          - id: month
            type: text
            format: integer
            prompt: 按对方的说明，`03/04/2026` 是几月？
            key: 4
            feedback:
              - when: 3
                message: 前两位 03 是日，中间的 04 才是月。
        explanation: |
          写 **`"%d/%m/%Y"`**：`%d` 是日，`%m` 是月，`%Y` 是四位年份，中间用斜杠。按这个格式，`03/04/2026` 是 **4** 月 3 日。

          如果写成 `"%m/%d/%Y"`，`03/04/2026` 也能读，只是读成了 3 月 4 日，程序不会提醒你；`25/04/2026` 才会因为没有 25 月而读不了。所以一列里日和月都不超过 12 时，只能靠来源说明来定格式。
        verify: |
          formats = {"mdy": "%m/%d/%Y", "ymd": "%Y-%m-%d", "dmy": "%d/%m/%Y", "ymd_slash": "%Y/%m/%d"}
          # 对方说明前两位是日：用一个不会混淆的值 25/04/2026 挑出把它读成 4 月 25 日的格式。
          fits = []
          for option, fmt in formats.items():
              value = pd.to_datetime(pd.Series(["25/04/2026"]), format=fmt, errors="coerce").iloc[0]
