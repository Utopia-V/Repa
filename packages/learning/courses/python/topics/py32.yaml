                  ```python
                  in_march = (collected >= "2026-03-01") and (collected < "2026-04-01")
                  ```
                feedback: and 只能连接两个单独的 True/False；一整列要用 &。
              - id: paren
                content: |
                  ```python
                  in_march = (collected >= "2026-03-01") & (collected < "2026-04-01")
                  ```
              - id: or
                content: |
                  ```python
                  in_march = (collected >= "2026-03-01") | (collected < "2026-04-01")
                  ```
                feedback: "| 表示两个条件满足一个就行，每一行都会是 True。"
            key: paren
        explanation: |
          第 2 行**报 TypeError**。`&` 比 `>=`、`<` 先算，Python 先去算 `"2026-03-01" & collected`，文字和一列日期没法做 `&`。

          给每个比较加上括号，写成 `(collected >= "2026-03-01") & (collected < "2026-04-01")`，得到 True、True、True、False。换成 `and` 会报错，因为它只能连接两个单独的 True/False；换成 `|` 则每一行都满足其中一个条件。
        verify: |
          import datetime
          r = run()
          prelude = CODE.splitlines()[0] + "\n"
          lo, hi = datetime.date(2026, 3, 1), datetime.date(2026, 4, 1)
