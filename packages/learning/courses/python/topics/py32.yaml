  - id: py32.k3
    title: 按日期区间筛选，明确左右边界
    card:
      name: 日期区间
      aliases: [左闭右开, 日期筛选]
      definition: 读成日期后可以和 "2026-03-01" 这样的文字比较先后；一段时间用 & 连起两个加了括号的比较，3 月写成 >= 3 月 1 日且 < 4 月 1 日。
      conditions:
        - 需求要写明两端那一天算不算；右端写成“小于下个月 1 日”不用记每月几天。
        - 记录带时刻时，<= "2026-03-31" 只到 3 月 31 日零点，当天下午的记录会漏掉。
      example:
        from: py32.k3.e0
        text: |
          ```python
          march = log.loc[(collected >= "2026-03-01") & (collected < "2026-04-01"), ["sample_id"]]
          ```
          留下 3 月 2 日、15 日、31 日采的 S_A、S_B、S_C；4 月 1 日采的 S_D 不在 3 月。
    lesson: |
      读成日期以后，就能比较先后：`collected >= "2026-03-01"` 对每一行判断“是不是在 3 月 1 日或之后”，得到一列 True/False，右边的文字 pandas 会当作日期来比较。

      一段时间要两个条件同时成立，用 `&` 连起来，每个比较加括号：

      ```python
      in_march = (collected >= "2026-03-01") & (collected < "2026-04-01")
      ```

      注意两端写法不同：左端 `>=` 包含 3 月 1 日，右端 `<` 不包含 4 月 1 日。这叫**左闭右开**，表示一个月很方便：不用记 3 月有 31 天，换成 2 月也照样写“小于 3 月 1 日”。

      还有一个理由：有的记录带时刻，例如 `2026-03-31 14:20`。`"2026-03-31"` 当作日期时是 3 月 31 日零点，所以 `<= "2026-03-31"` 会漏掉 3 月 31 日下午的记录，而 `< "2026-04-01"` 不会。

      不管怎样写，需求里都要说清两端那一天算不算，例如“3 月 1 日（含）到 4 月 1 日（不含）”。
    example:
      id: py32.k3.e0
      kind: [predict]
      uses: [py18.k1, py18.k2, py17.k2]
      data: [log]
      body: |
        只要 3 月采的样本。阅读代码。

        ```python
        collected = pd.to_datetime(log["collected"], format="%Y-%m-%d")
        march = log.loc[(collected >= "2026-03-01") & (collected < "2026-04-01"), ["sample_id"]]
        ```
      slots:
        - id: rows
          type: order
          partial: true
          prompt: 按先后顺序排出 `march` 里的 sample_id。
          items:
            - { id: S_A, content: S_A }
            - { id: S_B, content: S_B }
            - { id: S_C, content: S_C }
            - { id: S_D, content: S_D }
          key: [S_A, S_B, S_C]
        - id: why
          type: choice
          prompt: S_D 是 4 月 1 日采的，它为什么不在结果里？
          options:
            - id: strict
              content: "右端写的是 `<`，不包含 4 月 1 日"
            - id: left
              content: "左端写的是 `>=`，把它排除了"
            - id: format
              content: 它的日期读不了
          key: strict
      explanation: |
        留下 **S_A、S_B、S_C**（3 月 2 日、15 日、31 日）。S_D 是 4 月 1 日，右端的 `<` 不包含这一天，所以没有留下。3 月 31 日的 S_C 留下了，不用另外写“小于等于 3 月 31 日”。
      verify: |
        march = run()["march"]
        answers = {"rows": list(march["sample_id"])}
      manual: [why]
    practice:
      - id: py32.k3.q1
        kind: [predict]
        uses: [py18.k1, py18.k2]
        data: [visits]
        body: |
          要标出 3 月 15 日到 3 月 31 日（两天都算）之间的采样。阅读代码，填写 `in_window` 的值。

