      - id: py32.k3.q2
        kind: [debug]
        uses: [py18.k2]
        data: [log]
        body: |
          下面的代码想标出 3 月采的样本。

          ```python startLine=1
          collected = pd.to_datetime(log["collected"], format="%Y-%m-%d")
          in_march = collected >= "2026-03-01" & collected < "2026-04-01"
          ```
        slots:
