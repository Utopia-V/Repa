              for c, t in zip(log["collected"], log["tested"])
          ]
          fits = []
          for option, line in OPTIONS["fix"].items():
              result = run(prelude + line)
              if result.error is None and list(result["late"]) == expected:
                  fits.append(option)
          answers = {"outcome": "error" if r.error == "TypeError" else "other", "fix": fits[0] if len(fits) == 1 else fits}
