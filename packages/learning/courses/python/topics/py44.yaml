            type: choice
            multiple: true
            options:
              - id: direct
                content: |
                  ```python
                  value = responses[1]["answers"]["q2"]
                  ```
              - id: stepwise
                content: |
                  ```python
                  second = responses[1]
                  value = second["answers"]["q2"]
                  ```
              - id: with_get
                content: |
                  ```python
