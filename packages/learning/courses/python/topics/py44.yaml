kps:
  - id: py44.k1
    title: CSV 的行列与 JSON 的列表/字典层次
    card:
      name: 文件里的层次
      aliases: [JSON, CSV, 嵌套]
      definition: CSV 是一张表：第一行通常是列名，之后每行一条记录，字段用分隔符隔开；JSON 读进来后，花括号变成字典、方括号变成列表，可以一层套一层。
      conditions:
        - read_csv 默认把第一行当列名；文件没有列名行时，第一条记录会被当成列名。
        - 字典的 len 是键的个数，不是里面列表的长度；要数记录，先走到放记录的那个列表。
      example:
        from: py44.k1.e0
        text: |
          plates/p1.json 读进来，data 是字典；data["samples"] 是列表；data["samples"][0] 是字典；data["samples"][0]["signal"] 是整数 8。
    lesson: |
      **CSV** 就是一张用文字写成的表：

      ```text
      sample_id,signal,group
      001,8,control
      002,10,drug
      ```

      第一行通常是**列名**，后面每一行是一条记录，同一行里的字段用逗号隔开。`pd.read_csv` 默认把第一行当列名，所以上面三行文字读成 2 行 3 列的表。文件没有列名行、或者用的不是逗号时，就要另外告诉 read_csv。

      **JSON** 能表达一层套一层的结构。用 `json` 模块读进来以后：

      | JSON 里写的 | 读进 Python 变成 |
      |---|---|
      | `{ ... }` 花括号 | 字典（dict） |
      | `[ ... ]` 方括号 | 列表（list） |
      | `"S01"` 带引号 | 字符串（str） |
      | `8`、`9.5` | 整数（int）、小数（float） |
      | `true` / `false` | `True` / `False` |
      | `null` | `None` |

      ```python
      import json
      with open("plates/p1.json", encoding="utf-8") as f:
          data = json.load(f)
      ```

      `json.load(f)` 读一个打开的文件；`json.loads(文字)` 读一段已经在手里的文字。

      读一个 JSON，先一层层认清：最外层是字典还是列表？某个键对应的是一个值、一个列表，还是又一个字典？注意 `len` 对字典数的是**键的个数**：`data` 有 plate、operator、samples 三个键，`len(data)` 是 3，跟有几条样本无关；样本数是 `len(data["samples"])`。
    example:
      id: py44.k1.e0
      kind: [predict]
      uses: [py43.k2, py37.k1]
      data: [p1_file]
      body: |
        读入文件：

        ```python
        import json
        with open("plates/p1.json", encoding="utf-8") as f:
            data = json.load(f)
        ```

        按文件内容，写出下面每个表达式得到的是哪种东西。
      slots:
        - id: types
          type: table
          columns:
            - { id: expr, header: 表达式 }
            - id: kind
              header: 类型
              input:
                type: choice
                options:
                  - { id: dict, label: 字典 dict }
                  - { id: list, label: 列表 list }
                  - { id: str, label: 字符串 str }
                  - { id: int, label: 整数 int }
          rows:
            - { id: top, cells: { expr: data, kind: dict } }
            - { id: plate, cells: { expr: 'data["plate"]', kind: str } }
            - { id: samples, cells: { expr: 'data["samples"]', kind: list } }
            - { id: first, cells: { expr: 'data["samples"][0]', kind: dict } }
            - { id: signal, cells: { expr: 'data["samples"][0]["signal"]', kind: int } }
      explanation: |
        最外层是花括号，`data` 是**字典**；`data["plate"]` 是带引号的 "P1"，是**字符串**；`data["samples"]` 是方括号，是**列表**；列表里每一项是花括号，`data["samples"][0]` 是**字典**；它的 `"signal"` 是不带引号的 8，是**整数**。

        一层层看下来：字典 → 列表 → 字典 → 值。每走一步，先想清楚手里拿着的是哪一种。
      verify: |
        data = run()["data"]
        values = {
            "top": data,
            "plate": data["plate"],
            "samples": data["samples"],
            "first": data["samples"][0],
            "signal": data["samples"][0]["signal"],
        }
        answers = {"types": {row: {"kind": type(value).__name__} for row, value in values.items()}}
    practice:
      - id: py44.k1.q1
        kind: [predict]
        uses: [py15.k1, py15.k2, py14.k2]
        data: [p2_csv]
        body: |
          ```python
          df = pd.read_csv("plates/p2.csv", dtype={"sample_id": "str"})
          ```
        slots:
          - id: lines
            type: text
            format: integer
            prompt: 文件 `plates/p2.csv` 一共有几行文字？
            key: 5
          - id: rows
            type: text
            format: integer
            prompt: "`df.shape` 的第一个数（行数）"
            key: 4
            feedback:
              - when: 5
                message: 第一行是列名，不算一条记录。
          - id: cols
            type: text
            format: integer
            prompt: "`df.shape` 的第二个数（列数）"
            key: 3
          - id: header
            type: choice
            prompt: 文件的第一行在 `df` 里变成了什么？
            options:
              - { id: record, content: 第一条记录 }
              - { id: columns, content: 列名 }
              - { id: dropped, content: 被丢掉了，哪里都没有 }
            key: columns
        explanation: |
          文件有 **5** 行文字：1 行列名加 4 行记录。read_csv 把第一行当**列名**，所以 `df` 是 **4** 行 **3** 列。数记录时不要把列名那一行算进去。
        verify: |
          df = run()["df"]
          with open("plates/p2.csv", encoding="utf-8") as f:
              lines = f.read().splitlines()
          answers = {
              "lines": len(lines),
              "rows": df.shape[0],
              "cols": df.shape[1],
              "header": "columns" if list(df.columns) == lines[0].split(",") else "other",
          }
      - id: py44.k1.q2
        kind: [predict]
        uses: [py37.k2]
        body: |
          阅读程序，写出第 3–5 行各显示什么。

          ```python startLine=1
          import json
          rec = json.loads('{"ok": true, "note": null, "ids": ["001", "002"]}')
          print(rec["ok"])
          print(rec["note"])
          print(rec["ids"][0])
          ```
        slots:
          - id: output
            type: table
            columns:
              - { id: line, header: 代码行 }
              - { id: shown, header: 显示, input: text }
            rows:
              - { id: l3, cells: { line: 第 3 行, shown: "True" } }
              - { id: l4, cells: { line: 第 4 行, shown: None } }
              - { id: l5, cells: { line: 第 5 行, shown: "001" } }
        explanation: |
          依次显示 **True**、**None**、**001**。JSON 的 `true` 读成 Python 的 True，`null` 读成 None；`"001"` 带引号，是字符串，前导零保留。
        verify: |
          lines = run().lines()
          answers = {"output": {f"l{number}": {"shown": text} for number, text in zip(range(3, 6), lines)}}
      - id: py44.k1.q3
        kind: [predict, explain]
        uses: [py06.k1, py37.k1]
        data: [p1_data]
        body: |
          ```python startLine=1
          print(len(data))
          print(len(data["samples"]))
          ```
        slots:
          - id: first
            type: text
            format: integer
