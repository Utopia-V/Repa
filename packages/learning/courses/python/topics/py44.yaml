                  ```
              - id: from_end
                content: |
                  ```python
                  value = responses[-2]["answers"]["q2"]
                  ```
                feedback: 倒数第二位只有在恰好 3 个人时才是第二位；换成 2 个人的文件，它取到的是第一位。
              - id: by_id
                content: |
                  ```python
                  value = responses["R2"]["answers"]["q2"]
                  ```
                feedback: 最外层是列表，只能按位置取，用文字 "R2" 会报 TypeError。
              - id: third
                content: |
                  ```python
                  value = responses[2]["answers"]["q2"]
                  ```
                feedback: 位置从 0 数起，位置 2 是第三位。
            key: [direct, stepwise, with_get]
        explanation: |
          最外层是列表，第二位的位置是 1；取出的字典里，回答放在 `"answers"` 这个字典里，再取 `"q2"`。

          - `responses[1]["answers"]["q2"]`、先存成 `second` 再取，两种写法一回事，都对。
          - `.get("q2")` 在键存在时取到同一个值，也对。
          - `responses[-2]` 是倒数第二位：本文件正好 3 人，碰巧也是第二位；换成 2 个人的文件，它就成了第一位。要“第二位”，就写位置 1。
          - `responses["R2"]` 用文字去取列表，报 TypeError；`responses[2]` 是第三位。
        verify: |
