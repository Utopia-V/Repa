    quiz:
      - id: py44.k2.x1
        kind: [explain, debug]
        uses: [py37.k2, py06.k2]
        data: [responses_a]
        body: |
          需求是：取出列表里**第二位**受访者对问题 q2 的回答，存进 `value`。换一份同样结构的文件，代码也要取对，别的文件里的受访者人数不一定是 3。

