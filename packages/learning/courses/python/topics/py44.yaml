  - id: py44.k2
    title: 按键和位置走到目标值
    card:
      name: 逐层取值
      aliases: [嵌套取值, 路径]
      definition: 从最外层开始，遇到字典用键、遇到列表用从 0 开始的位置，一层一层写方括号，直到拿到要的值。
      conditions:
        - 每一步先想手里是字典还是列表：对列表用文字键报 TypeError，键写错报 KeyError，位置超出报 IndexError。
        - 对字典用数字位置，例如 data[0]，Python 会把 0 当成一个键去找，报 KeyError。
      example:
        from: py44.k2.e0
        text: |
          data["samples"][1]["signal"]：先取 samples 这个列表，再取第 2 项（位置 1）这个字典，最后取它的 signal，得到 10。
    lesson: |
      要的值藏在几层里面时，从最外层开始，一层一层往里走：

      ```python
      data["samples"][1]["signal"]
      ```

      读法是从左往右：

      1. `data` 是字典，用键 `"samples"` 取出样本列表；
      2. 列表按位置取，`[1]` 是第 2 项（位置从 0 开始），得到 S02 那条记录的字典；
      3. 这个字典再用键 `"signal"`，得到 10。

      走错一层时，报错的类型能告诉你错在哪：

      | 写法 | 报错 | 原因 |
      |---|---|---|
      | `data["sample"]` | KeyError | 字典里没有这个键（少了一个 s） |
      | `data["samples"]["S02"]` | TypeError | 列表只能按位置取，不能用文字 |
      | `data["samples"][4]` | IndexError | 列表只有 4 项，位置最大是 3 |
      | `data[0]` | KeyError | 字典没有位置，0 被当成一个键去找 |

      还有一个常见的偷懒：照着眼前的文件把值抄成 `signal = 10`。换一份文件，它就错了。写出取值的路径，代码才能用在下一份文件上。
    example:
      id: py44.k2.e0
      kind: [trace]
      uses: [py37.k2, py06.k2]
      data: [p1_data]
      body: |
        按顺序看 `data["samples"][1]["signal"]` 每走一步拿到了什么。
      slots:
        - id: steps
          type: table
          columns:
            - { id: expr, header: 走到 }
            - id: kind
              header: 拿到的是
              input:
                type: choice
                options:
                  - { id: dict, label: 字典 dict }
                  - { id: list, label: 列表 list }
                  - { id: int, label: 整数 int }
          rows:
            - { id: s1, cells: { expr: 'data["samples"]', kind: list } }
            - { id: s2, cells: { expr: 'data["samples"][1]', kind: dict } }
            - { id: s3, cells: { expr: 'data["samples"][1]["signal"]', kind: int } }
        - id: sample
          type: text
          prompt: 第二步拿到的是哪个样本的记录？写出它的 sample_id。
          key: S02
        - id: value
          type: text
          format: integer
          prompt: 最后得到的值是多少？
          key: 10
      explanation: |
        第一步用键取出**列表**；第二步按位置 1 取出第 2 项，是 **S02** 那条记录的**字典**；第三步用键 "signal" 取出**整数 10**。位置从 0 开始，`[1]` 是第二项，不是 S01。
      verify: |
        steps = [data["samples"], data["samples"][1], data["samples"][1]["signal"]]
        answers = {
            "steps": {f"s{number}": {"kind": type(value).__name__} for number, value in enumerate(steps, 1)},
            "sample": steps[1]["sample_id"],
            "value": steps[2],
        }
    practice:
      - id: py44.k2.q1
        kind: [modify]
        uses: [py37.k2, py06.k2]
        data: [p1_data]
        body: |
          要取出 S03 的 group。用下面的块拼出这个表达式，从左往右排；用不到的块不要放进来。
        slots:
          - id: path
            type: order
            partial: true
            items:
              - { id: group, content: '`["group"]`' }
              - { id: i3, content: '`[3]`' }
              - { id: data, content: '`data`' }
              - { id: S03, content: '`["S03"]`' }
              - { id: i2, content: '`[2]`' }
              - { id: samples, content: '`["samples"]`' }
            key: [data, samples, i2, group]
        explanation: |
          `data["samples"][2]["group"]`，得到 "drug"。S03 是列表里的第 3 项，位置是 2。`["S03"]` 不能用：列表只能按位置取，"S03" 只是记录里 sample_id 的值，不是键；`[3]` 是第 4 项 S04。
        verify: |
          samples = data["samples"]
          # 独立找出 S03 在列表里的位置，再确认整条路径能取到它的 group。
          position = [index for index, record in enumerate(samples) if record["sample_id"] == "S03"][0]
          assert data["samples"][position]["group"] == "drug"
          answers = {"path": ["data", "samples", f"i{position}", "group"]}
      - id: py44.k2.q2
        kind: [predict, debug]
        uses: [py11.k2, py37.k2, py06.k2]
        data: [p1_data]
        body: |
          写出每个表达式的结果：能取到值的写出值，报错的写出异常类型的名字。
        slots:
          - id: results
            type: table
            columns:
              - { id: expr, header: 表达式 }
              - { id: result, header: 结果, input: text }
            rows:
              - { id: r1, cells: { expr: 'data["sample"]', result: KeyError } }
              - { id: r2, cells: { expr: 'data["samples"]["S02"]', result: TypeError } }
              - { id: r3, cells: { expr: 'data["samples"][4]', result: IndexError } }
              - { id: r4, cells: { expr: 'data["samples"][-1]["sample_id"]', result: S04 } }
        explanation: |
          - `data["sample"]`：键少了一个 s，字典里没有，**KeyError**。
          - `data["samples"]["S02"]`：样本列表只能按位置取，用文字报 **TypeError**。
          - `data["samples"][4]`：列表有 4 项，位置是 0–3，**IndexError**。
          - `data["samples"][-1]["sample_id"]`：-1 是最后一项，得到 **S04**。
        verify: |
          expressions = {
              "r1": 'data["sample"]',
              "r2": 'data["samples"]["S02"]',
              "r3": 'data["samples"][4]',
              "r4": 'data["samples"][-1]["sample_id"]',
          }
          results = {}
          for row, expression in expressions.items():
              try:
                  results[row] = {"result": eval(expression)}
              except Exception as caught:
                  results[row] = {"result": type(caught).__name__}
          answers = {"results": results}
      - id: py44.k2.q3
        kind: [modify]
        uses: [py37.k2, py06.k2]
        data: [runs_a]
        body: |
          需求是：取出**第二块板**上**第一个样本**的 signal，存进 `signal`。换一份同样结构的文件，代码也要取对。

