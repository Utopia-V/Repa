            key: right
        explanation: |
          报 **KeyError**，不是 IndexError：`config` 是字典，没有“第 0 项”，Python 把 0 当成一个键去找，找不到。板的列表放在 `"plates"` 这个键下面，要先取出它，再按位置取第一块：`print(config["plates"][0]["wells"])`。

          用 "P1" 去取列表报 TypeError；位置 1 是第二块板 P2；`config` 最外层没有 "wells" 这个键。
        verify: |
          wanted = [plate for plate in config["plates"] if plate["plate"] == "P1"][0]["wells"]
          fits = [option for option, code in OPTIONS["fix"].items()
                  if run(code).error is None and run(code).out.strip() == str(wanted)]
          answers = {"error": run().error, "fix": fits[0] if len(fits) == 1 else fits}

  - id: py44.k3
    title: 缺键、缺失和字段类型的验证
    card:
      name: 缺失与类型
      aliases: [缺键, "null", 字段类型]
      definition: 一条记录的某个值可能缺这一项、写着 null（读成 None）、或者类型不对（例如文字 "12"）；先用 in、get 和 type() 查出是哪一种，再按写明的规则处理。
      conditions:
        - get 只在缺这一项时用默认值；键在而值是 null 时，get 照样得到 None。
        - read_csv 把空格子读成 NaN，整列跟着变成小数；一列里只要有一格是文字，整列都成了文字。
      example:
        from: py44.k3.e0
        text: |
          S03 没有 signal 这一项："signal" in rec 是 False，rec.get("signal") 得到 None；S04 写着 null：in 是 True，get 同样得到 None。
    lesson: |
      从文件里取值时，同一个字段在不同记录里可能是三种不同的“不对劲”：

      | 情况 | JSON 里的样子 | `"signal" in rec` | `rec.get("signal")` | `rec["signal"]` |
      |---|---|---|---|---|
      | 正常 | `"signal": 12` | True | 12 | 12 |
      | 缺这一项 | 没有 `"signal"` | False | None | 报 KeyError |
      | 值为空 | `"signal": null` | True | None | None |
      | 类型不对 | `"signal": "12"` | True | `'12'`（文字） | `'12'` |

      - `rec["signal"]` 遇到缺键会报错；`rec.get("signal")` 不报错，缺键时得到 None，也可以写 `rec.get("signal", 默认值)`。默认值只在**缺这一项**时才用，值写着 null 时仍是 None。
      - `type(值)` 告诉你类型：`type(12)` 是 int，`type("12")` 是 str。文字 "12" 看着像数，却不能直接拿来算。

      CSV 读成表时也有对应的情况：空着的格子读成 **NaN**，整数列会因此变成小数列（float64）；一列里只要有一格写着“未测”这样的文字，整列都成了文字列（str）。

      查出来之后，怎样处理是业务规则，要写清楚，而不是让代码悄悄决定。尤其不要把缺失补成 0：0 是一个真实的测量结果，缺测不是。
    example:
      id: py44.k3.e0
      kind: [predict]
      uses: [py37.k2, py37.k3]
      data: [recs_a]
      body: |
        对每条记录 `rec`，分别求出：`"signal" in rec`、`rec.get("signal")` 显示什么，以及 `type(rec.get("signal"))` 是哪种类型。
      slots:
        - id: checks
          type: table
          columns:
            - { id: record, header: 记录 }
            - { id: has, header: '"signal" in rec', input: bool }
            - { id: got, header: rec.get("signal"), input: { type: text, match: output } }
            - id: kind
              header: 类型
              input:
                type: choice
                options:
                  - { id: int, label: int }
                  - { id: str, label: str }
                  - { id: NoneType, label: NoneType（None 的类型） }
          rows:
            - { id: S01, cells: { record: S01, has: true, got: "12", kind: int } }
            - { id: S02, cells: { record: S02, has: true, got: "'12'", kind: str } }
            - { id: S03, cells: { record: S03, has: false, got: None, kind: NoneType } }
            - { id: S04, cells: { record: S04, has: true, got: None, kind: NoneType } }
      explanation: |
        | 记录 | in | get | 类型 |
        |---|---|---|---|
        | S01 | True | 12 | int |
        | S02 | True | '12' | str |
        | S03 | False | None | NoneType |
        | S04 | True | None | NoneType |

        S02 的值带引号，读进来是文字 '12'。S03 和 S04 用 get 都得到 None，但原因不同：S03 根本没有这一项，S04 有这一项、值写着 null。要分清这两种，就看 `in`。
      verify: |
        rows = {}
        for rec in recs:
            value = rec.get("signal")
            rows[rec["sample_id"]] = {"has": "signal" in rec, "got": value, "kind": type(value).__name__}
        answers = {"checks": rows}
    practice:
      - id: py44.k3.q1
        kind: [predict]
        uses: [py37.k2, py37.k3]
        body: |
          在交互解释器里依次输入下面几行。每一行显示什么？什么都不显示的写 NOTHING，报错的写 ERROR。

          ```python startLine=1
          rec = {"sample_id": "S03", "group": "drug"}
          rec.get("signal")
          rec.get("signal", "缺失")
          "signal" in rec
          rec["signal"]
          ```
        slots:
          - id: shown
            type: table
            columns:
              - { id: line, header: 输入 }
              - { id: shown, header: 显示, input: { type: text, match: output, quick: [NOTHING, ERROR] } }
            rows:
              - { id: l2, cells: { line: 第 2 行, shown: NOTHING } }
              - { id: l3, cells: { line: 第 3 行, shown: "'缺失'" } }
              - { id: l4, cells: { line: 第 4 行, shown: "False" } }
              - { id: l5, cells: { line: 第 5 行, shown: ERROR } }
        explanation: |
          - 第 2 行：缺这一项，get 得到 None；交互解释器遇到 None **什么都不显示**（NOTHING）。
          - 第 3 行：给了默认值，得到 **'缺失'**。
          - 第 4 行：**False**，记录里没有 signal 这个键。
          - 第 5 行：用方括号取一个不存在的键，报 KeyError（**ERROR**）。
        verify: |
          shown = repl()
          answers = {"shown": {f"l{number}": {"shown": text} for number, text in zip(range(2, 6), shown[1:])}}
      - id: py44.k3.q2
        kind: [predict]
        uses: [py15.k1, py15.k2, py14.k3]
        data: [signal_csvs]
        body: |
          ```python startLine=1
          a = pd.read_csv("plates/a.csv", dtype={"sample_id": "str"})
          b = pd.read_csv("plates/b.csv", dtype={"sample_id": "str"})
          print(a["signal"].dtype)
          print(b["signal"].dtype)
          ```
        slots:
          - id: dtypes
            type: table
            columns:
              - { id: line, header: 代码行 }
              - id: shown
                header: 显示
                input:
                  type: choice
                  options:
                    - { id: int64, label: int64 }
                    - { id: float64, label: float64 }
                    - { id: str, label: str }
            rows:
              - { id: l3, cells: { line: 第 3 行, shown: float64 } }
              - { id: l4, cells: { line: 第 4 行, shown: str } }
          - id: blank
            type: choice
            prompt: "`a` 里 002 那一格读成了什么？"
            options:
              - { id: zero, content: "0" }
              - { id: empty, content: 空的文字 "" }
              - { id: nan, content: NaN（缺失） }
            key: nan
        explanation: |
          第 3 行显示 **float64**：空格子读成 **NaN**，而 NaN 只能放在小数列里，整列的 8、12 也跟着成了 8.0、12.0。第 4 行显示 **str**：只要有一格是“未测”这样的文字，整列都成了文字，8 和 12 也成了文字 '8'、'12'。

          两种情况都不会报错，读完看一眼每列的 dtype，才能发现。
        verify: |
          r = run()
          a, b = r["a"], r["b"]
          blank = a.loc[a["sample_id"] == "002", "signal"].iloc[0]
          answers = {
              "dtypes": {"l3": {"shown": str(a["signal"].dtype)}, "l4": {"shown": str(b["signal"].dtype)}},
              "blank": "nan" if pd.isna(blank) else "other",
          }
      - id: py44.k3.q3
        kind: [explain]
        uses: [py37.k3, py03.k1]
        data: [recs_b]
        body: |
          把每条记录的 signal 归到一类。
        slots:
          - id: classes
            type: table
            columns:
              - { id: record, header: 记录 }
              - id: category
                header: signal 的情况
                input:
                  type: choice
                  options:
                    - { id: ok, label: 正常的数 }
                    - { id: missing, label: 缺这一项 }
                    - { id: "null", label: 值为 null }
                    - { id: text, label: 是文字 }
            rows:
              - { id: S05, cells: { record: S05, category: ok } }
              - { id: S06, cells: { record: S06, category: "null" } }
              - { id: S07, cells: { record: S07, category: text } }
              - { id: S08, cells: { record: S08, category: missing } }
        explanation: |
          S05 是**正常的数**；S06 有 signal 这一项，**值为 null**；S07 的 "9.5" 带引号，**是文字**；S08 只有 sample_id 和 group，**缺这一项**。

          查的办法：先用 `"signal" in rec` 看有没有这一项，有的话再用 `type(rec["signal"])` 看是 int、float、str 还是 NoneType。
        verify: |
          classes = {}
          for rec in recs:
              if "signal" not in rec:
                  category = "missing"
              elif rec["signal"] is None:
                  category = "null"
              elif type(rec["signal"]) is str:
                  category = "text"
              else:
                  category = "ok"
              classes[rec["sample_id"]] = {"category": category}
          answers = {"classes": classes}
      - id: py44.k3.q4
        kind: [specify]
        body: |
          你请 AI 从一批 JSON 记录里取出每个样本的 signal 来算平均值。记录里可能有：缺 signal 这一项的，signal 写着 null 的，signal 是文字（例如 "9.5"）的。

          写一段给 AI 的要求，说清这三种情况各怎样处理。
        slots:
          - id: rule
            type: text
            lines: 5
            rubric:
              - id: missing
                label: 缺这一项和 null 的处理
                guide: 写明这两种算缺失、不当作 0，是否参与平均要说清楚（例如不参与）。只写“去掉”而没说明不补 0 也可以算，只要别人照做不会补 0。
              - id: text
                label: 文字值的处理
                guide: 写明文字值怎么办，例如先列出这些样本编号给我看、不要自动转换；或者明确允许转成数，转不了的算缺失。
              - id: report
                label: 交回什么信息
                guide: 要求把被排除或有问题的样本编号、各有几条报告出来，让人能核对。
        explanation: |
          一种写法：**“缺 signal 这一项或值为 null 的，记为缺失，不当作 0，不参与平均。signal 是文字的，先不要自动转换，把这些样本编号列出来给我确认。最后告诉我参与平均的有几条，缺失和文字的各是哪些样本。”**

          三项各算一项：缺失怎样处理、文字怎样处理、交回哪些便于核对的信息。规则可以和这里不同，例如允许把 "9.5" 转成 9.5，但要写明，不能让 AI 自己决定。
    review:
      - id: py44.k3.r1
        kind: [modify]
        uses: [py37.k2]
        body: |
          每个采样点的记录 `rec` 是一个字典，可能没有 `"depth"` 这一项。需求是：

          > 取出 depth 存进 `depth`；没有这一项时，`depth` 得到 None，不报错，也不补成 0。

          作答框里的代码遇到缺 depth 的记录会报 KeyError。请改动它并提交。宿主会准备好不同的 `rec` 来检查。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              depth = rec["depth"]
            solution: |
              depth = rec.get("depth")
            accepts:
              - depth = rec.get("depth", None)
            rejects:
              - code: depth = rec.get("depth", 0)
                why: 缺的时候补成了 0
              - code: depth = "depth" in rec
                why: 得到的是有没有这一项，不是深度
            tests:
              - name: 有 depth
                setup: 'rec = {"site": "北坡", "depth": 30}'
                expect:
                  depth: "30"
              - name: 缺 depth
                setup: 'rec = {"site": "东坡"}'
                expect:
                  depth: None
              - name: depth 为 None
                hidden: true
                setup: 'rec = {"site": "西坡", "depth": None}'
                expect:
                  depth: None
              - name: depth 恰好是 0
                hidden: true
                setup: 'rec = {"site": "南坡", "depth": 0}'
                expect:
                  depth: "0"
        explanation: |
          ```python
          depth = rec.get("depth")
          ```

          get 在缺这一项时得到 None，不报错。写成 `rec.get("depth", 0)` 会把缺测补成 0，和真的测出 0 分不开，不符合需求。
      - id: py44.k3.r2
        kind: [explain]
        uses: [py37.k2, py37.k3]
        body: |
          两条记录：

          ```python
          rec_a = {"sample_id": "S07", "signal": None}
          rec_b = {"sample_id": "S08"}
          ```

          `rec_a` 来自 JSON 里的 `"signal": null`。下面哪一句说法正确？
        slots:
          - id: claim
            type: choice
            options:
              - id: both_no_key
                content: 两条记录都没有 signal 这一项
              - id: zero
                content: rec_a 的 signal 是 0
              - id: get_error
                content: 对 rec_b 写 rec_b.get("signal") 会报 KeyError
              - id: same_get
                content: 两条记录用 get 取 signal 都得到 None，但只有 rec_a 有 signal 这一项
            key: same_get
        explanation: |
          “两条记录用 get 都得到 None，但只有 rec_a 有 signal 这一项”正确。rec_a 的 null 读成 None，键还在；rec_b 根本没有这个键，get 不报错，也得到 None。要分清它们，用 `"signal" in rec`。null 不是 0。
        verify: |
          r = run()
          a, b = r["rec_a"], r["rec_b"]
          holds = {
              "both_no_key": "signal" not in a and "signal" not in b,
              "zero": a.get("signal") == 0 and a.get("signal") is not None,
              "get_error": False,
              "same_get": a.get("signal") is None and b.get("signal") is None and "signal" in a and "signal" not in b,
          }
          try:
              b.get("signal")
          except KeyError:
              holds["get_error"] = True
          true = [claim for claim, ok in holds.items() if ok]
          answers = {"claim": true[0] if len(true) == 1 else true}
    quiz:
      - id: py44.k3.x1
        kind: [explain, predict]
        uses: [py15.k1, py14.k3]
        data: [depth_mixed]
        body: |
          用 `df = pd.read_csv("field/day4.csv")` 读进文件。读完发现 depth 一列不能直接求平均。
        slots:
          - id: dtype
            type: choice
            prompt: "`df[\"depth\"]` 读成了什么类型？"
            options:
              - { id: int64, content: int64（整数） }
              - { id: float64, content: float64（小数） }
              - { id: str, content: str（文字） }
            key: str
          - id: culprit
            type: choice
            prompt: 哪个采样点的那一格，让整列都成了这个类型？
            options:
              - { id: north, content: 北坡 }
              - { id: south, content: 南坡 }
              - { id: east, content: 东坡 }
              - { id: west, content: 西坡 }
              - { id: peak, content: 山顶 }
              - { id: valley, content: 谷底 }
            key: peak
          - id: fixed
            type: choice
            prompt: 如果把那一格改成 21（其余不变）再读，depth 是什么类型？
            options:
              - { id: int64, content: int64（整数） }
              - { id: float64, content: float64（小数） }
              - { id: str, content: str（文字） }
            key: int64
        explanation: |
          一列只有一种类型。只要有一格不是数，`约 21` 这样的写法，整列都会读成文字：谷底的 33、北坡的 30 在 `df` 里也是文字，不能直接算平均。

          是哪一格出的问题，可以逐个看：只有山顶那格带着汉字。把它改成 21，六格都是整数，depth 就读成 int64。

          读完先看 `df.dtypes`：该是数的列显示 str，就回头在文件里找夹着文字的那一格。至于“约 21”该改成 21、记为缺失，还是去问记录的人，要按需求定，不能让程序悄悄决定。
        verify: |
          import io
          from pathlib import Path
          text = Path("field/day4.csv").read_text(encoding="utf-8")
          header, *rows = text.strip().split("\n")

          def kind(lines):
              frame = pd.read_csv(io.StringIO("\n".join([header] + lines)))
              dtype = frame["depth"].dtype
              return "int64" if dtype.kind == "i" else "float64" if dtype.kind == "f" else "str"

          sites = ["north", "south", "east", "west", "peak", "valley"]
          culprits = [sites[i] for i in range(len(rows)) if kind(rows[:i] + rows[i + 1:]) != "str"]
          fixed_rows = [row.replace("约 ", "") for row in rows]
          answers = {
              "dtype": kind(rows),
              "culprit": culprits[0] if len(culprits) == 1 else culprits,
              "fixed": kind(fixed_rows),
          }
      - id: py44.k3.x2
        kind: [explain]
        uses: [py37.k2]
        body: |
          需求写着：“signal 缺失的样本记为缺失，不当作 0。”AI 给的代码对每条记录 `rec` 这样取值：

          ```python
          value = rec.get("signal", 0)
          ```

          下面哪些说法正确？选出所有。
        slots:
          - id: claims
            type: choice
            multiple: true
            options:
              - { id: missing_zero, content: 缺 signal 这一项的记录，value 得到 0 }
              - { id: null_zero, content: signal 为 null 的记录，value 也得到 0 }
              - { id: missing_error, content: 缺 signal 这一项的记录会报 KeyError }
              - { id: mixed, content: 按这段代码，缺测的样本和真的测出 0 的样本分不出来 }
            key: [missing_zero, mixed]
        explanation: |
          正确的是“缺这一项得到 0”和“缺测与真测出 0 分不出来”。get 的默认值只在缺这一项时使用，所以缺 signal 的记录得到 0，不会报错；signal 为 null 的记录键还在，得到的是 None，不是 0。

          这段代码把缺测补成了 0，和需求不符：它应当得到 None（或单独记为缺失），而不是 0。
        verify: |
          code = CODE
          missing = run(code, rec={"sample_id": "S03"})
          null = run(code, rec={"sample_id": "S04", "signal": None})
          zero = run(code, rec={"sample_id": "S09", "signal": 0})
          holds = {
              "missing_zero": missing.error is None and missing["value"] == 0,
              "null_zero": null.error is None and null["value"] == 0 and null["value"] is not None,
              "missing_error": missing.error == "KeyError",
              "mixed": missing.error is None and missing["value"] == zero["value"],
          }
          answers = {"claims": [claim for claim, ok in holds.items() if ok]}
