id: py44
title: 从文件里的结构找到一条记录
status: complete
minutes: 20
summary: 认出 CSV 的行列和 JSON 每一层是字典、列表还是值，按键和位置一层层走到目标值，并分清缺键、空值和类型不对。
prerequisites:
  - topic: py43
    key: true
    weight: 0.67
    covers: [py43.k2]
  - topic: py37
    key: true
    weight: 0.67
    covers: [py37.k1, py37.k2, py37.k3]
  - topic: py15
    key: false
    weight: 0.33
    covers: [py15.k1, py15.k2]
sources:
  - source: pydata-book
    where: 第 6 章 §6.1
    url: https://wesmckinney.com/book/accessing-data
    use: reference
  - source: python-docs
    where: 教程第 7 章 §7.2.2
    url: https://docs.python.org/3.12/tutorial/inputoutput.html
    use: reference
  - source: python-docs
    where: 标准库：json
    url: https://docs.python.org/3.12/library/json.html
    use: reference
notes: |
  范围：JSON 只用 json.load、json.loads 读入，再用方括号按键、按位置取值，get 和 in 处理缺键，type() 分辨类型；CSV 只用 py15 的 read_csv（含 dtype={"sample_id": "str"}、sep）和 py14 的 shape、columns、dtype。本节的先修里没有 if、循环、自定义函数和比较运算，所以“验证”停在用表达式查出每条记录的情况、并把处理规则写清楚，不写判断和循环。字典的 len 是键的个数，在讲解里就地说明。
  运行环境：每道题的文件在自己的 python 夹具里删掉目录重建，再按题面读入；JSON 原文在 display 里给学生看。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 3 分钟；k2 讲解与例题 3 分钟、练习 4 分钟；k3 讲解与例题 3 分钟、练习 3 分钟。
  情境、文件内容和题目为本课自拟。复习和测验题全部由程序核对，没有 manual 作答位。
intro: |
  数据不只放在表格里。仪器导出、网页接口和配置文件常用 JSON，它像一层套一层的盒子：外面是一个字典，里面某个键对应一个列表，列表里每一项又是一个字典。

  这一节练三件事：看出每一层是什么，一层层走到想要的那个值，以及遇到缺了、空了、类型不对的值时，先查出来、再说清怎么处理。题目里已经导入了 pandas（叫 `pd`），每道题用到的文件都会按题面重新准备好。
wrapup: |
  读一个结构化文件，先画出它的层次：最外层是字典还是列表？要的值在第几层、靠哪个键或哪个位置拿到？

  拿不准的记录，不要让代码悄悄补成 0 或跳过。向同事或 AI 说清：“signal 缺这一项或为 null 的记为缺失，不当作 0；signal 是文字的，列出这些样本编号，先不要计算。”
