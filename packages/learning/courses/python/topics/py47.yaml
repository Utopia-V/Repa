  - id: py47.k2
    keyPrerequisites: [py05, py37]
    title: 区分字符串出现与人物身份，规定别名和误匹配范围
    card:
      name: 别名与误匹配
      aliases: [人物计数规则, 排除词]
      definition: 数人物不等于数字符串：先写明哪些叫法算这个人、哪些包含这些字的更长的词不算、按次数还是按句子数，程序再照规则数。
      conditions:
        - 名字可能藏在别的词里：“沈青山”里也有“沈青”，count 照样数它。
        - 同一个词可能有别的意思（“木头”是外号还是木料），程序分不出时，规则里要写明怎样处理。
      example:
        from: py47.k2.e0
        text: |
          规则“沈青、青儿算；沈青山不算”：
          ```python
          person = text.count("沈青") - text.count("沈青山") + text.count("青儿")
          ```
          4 - 2 + 1 = 3：先数字面，减去藏在“沈青山”里的，再加上别名。
    lesson: |
      程序数的是字，你关心的是人。两者至少有三处对不上：

      - **一个人有几种叫法**：沈青，娘叫她“青儿”。只数“沈青”会漏掉。
      - **名字藏在别的词里**：“沈青山”是她叔叔，`count("沈青")` 照样把他数进去；只数一个“青”字，连“青石桥”也算上。
      - **数的单位**：数出现几次，还是数提到她的句子有几句。

      所以写代码之前，先把规则写清楚：哪些叫法算这个人；哪些包含这些字的更长的词不算；按次数还是按句子数。规则定了，程序才有确定的做法。例如“沈青、青儿算；沈青山不算；按次数”可以写成：

      ```python
      person = text.count("沈青") - text.count("沈青山") + text.count("青儿")
      ```

      先数字面，减去不该算的，再加上别名。也可以先用 `replace` 把“沈青山”换成别的字，再在换过的文字里数：`text.replace("沈青山", "某人").count("沈青")`。这时要记得后面的 `count` 是对换过的文字做的。

      有些情况规则也说不清：“木头”可能是人的外号，也可能就是一根木头。程序分不出这种意思，规则里要写明怎样处理，例如“只在作称呼时算，逐处人工核对”。
    example:
      id: py47.k2.e0
      kind: [predict, explain]
      uses: [py37.k1]
      data: [story]
      body: |
        规则：沈青的叫法有“沈青”“青儿”两种；“沈青山”是她叔叔，不算沈青；一句里出现两次算两次。先把三个字面次数并排放进字典里看，再按规则算。

        ```python
        counts = {"沈青": text.count("沈青"), "青儿": text.count("青儿"), "沈青山": text.count("沈青山")}
        person = counts["沈青"] - counts["沈青山"] + counts["青儿"]
        print(person)
        ```
      slots:
        - id: counts
          type: table
          label: counts 里的值
          columns:
            - { id: key, header: 键 }
            - { id: value, header: 值, input: integer }
          rows:
            - { id: shen, cells: { key: 沈青, value: 4 } }
            - { id: er, cells: { key: 青儿, value: 1 } }
            - { id: shan, cells: { key: 沈青山, value: 2 } }
        - id: person
          type: text
          format: integer
          prompt: 程序显示什么？
          key: 3
        - id: why
          type: choice
          prompt: 为什么要减去 `counts["沈青山"]`？
          options:
            - id: alias
              content: “沈青山”是沈青的另一种叫法
            - id: duplicate
              content: “沈青山”在文中出现了两次，要去掉重复的一次
            - id: inside
              content: “沈青山”里含有“沈青”两个字，`count("沈青")` 把它也数了进去
          key: inside
      explanation: |
        counts 里是 **沈青 4、青儿 1、沈青山 2**，程序显示 **3**。

        “沈青”的 4 处里，有 2 处其实是“沈青山”的前两个字，按规则不算，所以减去 2；娘喊的“青儿”是沈青，加上 1。4 - 2 + 1 = 3，对应原文里“沈青推开院门”“喊青儿”“沈青应了一声”这三处。
      verify: |
        r = run()
        counts = r["counts"]
        cleaned = text.replace("沈青山", "")
        holds = {
            "inside": "沈青" in "沈青山" and cleaned.count("沈青") == counts["沈青"] - counts["沈青山"],
            "alias": False,
            "duplicate": False,
        }
        true = [option for option, ok in holds.items() if ok]
        answers = {
            "counts": {"shen": {"value": counts["沈青"]}, "er": {"value": counts["青儿"]}, "shan": {"value": counts["沈青山"]}},
            "person": int(r.out),
            "why": true[0] if len(true) == 1 else true,
        }
    practice:
