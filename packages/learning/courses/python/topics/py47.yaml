  story_zhou:
    kind: python
    code: |
      text = "周明德一早出门了。明哥，明天还去河边吗？周明点点头。周明把网收好，等周明德回来。"
    display: |
      变量 `text` 里是下面这段小说：

      ```text
      周明德一早出门了。明哥，明天还去河边吗？周明点点头。周明把网收好，等周明德回来。
      ```
  story_mu:
    kind: python
    code: |
      text = "阿木扛着木头回家。娘说木头，先吃饭。阿木放下木头，笑了。村口的阿木叔也来了。"
    display: |
      变量 `text` 里是下面这段小说：

      ```text
      阿木扛着木头回家。娘说木头，先吃饭。阿木放下木头，笑了。村口的阿木叔也来了。
      ```
  note_en:
    kind: python
    code: |
      note = "Ann met Anna. Ann smiled."
    display: |
      变量 `note` 里是一句英文：

      ```text
