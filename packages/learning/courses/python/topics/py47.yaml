          照这条规则，本段是 3 次：“阿木扛着”“木头，先吃饭”“阿木放下”。其他写法只要三项都说清、别人照做得到同一个数，也成立。注意“木头”这种一词两义的情况，`count` 一定会把三处“木头”都数进去，规则里必须交代。
