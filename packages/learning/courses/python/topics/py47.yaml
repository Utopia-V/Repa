        explanation: |
          替换之后要在**换过的文字** `cleaned` 里数，原来的 `text` 并没有被改动（字符串不能原地改写，`replace` 交回的是一份新的文字）：

          ```python
          cleaned = text.replace("沈青山", "某人")
          total = cleaned.count("沈青") + cleaned.count("青儿")
          ```

          写成 `total = text.count("沈青") - text.count("沈青山") + text.count("青儿")` 也对。本例 total 是 3；判分时还会换一段“沈青山”出现次数不同的文字。
      - id: py47.k2.q3
