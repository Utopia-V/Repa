      - id: py47.k2.q2
        kind: [debug, modify]
        uses: [py05.k2]
        data: [story]
        body: |
          规则：沈青的叫法是“沈青”“青儿”；“沈青山”是她叔叔，不算；按出现次数数。

          同事的代码先把“沈青山”替换掉了，可结果还是不对。请改正它，结果仍放在 `total` 里。这条规则只针对这几个名字，名字可以直接写在代码里；但换一段文字，代码也要照这条规则数对。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 4
            starter: |
              cleaned = text.replace("沈青山", "某人")
              total = text.count("沈青") + text.count("青儿")
            solution: |
              cleaned = text.replace("沈青山", "某人")
              total = cleaned.count("沈青") + cleaned.count("青儿")
            accepts:
              - total = text.count("沈青") - text.count("沈青山") + text.count("青儿")
            rejects:
              - code: |
                  cleaned = text.replace("沈青山", "某人")
                  total = cleaned.count("沈青")
