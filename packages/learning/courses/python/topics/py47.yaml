    display: |
      变量 `text` 里是下面这段小说（一整段，中间没有换行）：

      ```text
      沈青推开院门。娘在灶台边喊青儿带上伞。沈青应了一声，往青石桥走去。桥头站着叔叔沈青山，沈青山冲她招手。
