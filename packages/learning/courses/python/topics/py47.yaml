kps:
  - id: py47.k1
    keyPrerequisites: [py35, py10]
    title: 用 split/count 或短循环追踪明确的字面匹配
    card:
      name: 字面匹配
      aliases: [count, in, split]
      definition: "`count` 数一段文字里某几个字连着出现了几处，`in` 只回答有没有；两者都只认字面，不管前后挨着什么字。"
      conditions:
        - "`split(\"。\")` 在每个句号处切开得到列表；文字以句号结尾时，最后多一个空字符串。"
        - 循环里每句加 1 数的是句子数；要数出现次数，就把每句的 count 加起来。
      example:
        from: py47.k1.e0
        text: |
          ```python
          total = text.count("沈青")
          ```
          在“……叔叔沈青山，沈青山冲她招手”这段里，count 把“沈青山”里的“沈青”也数了进去，得到 4；按句子数，提到“沈青”的句子只有 3 句。
    lesson: |
      数名字，最直接的工具是字符串的 `count`：`text.count("沈青")` 从头到尾找“沈青”这两个字连在一起出现的地方，数一共几处，得到一个整数。它只认字面：前后挨着什么字都不管，所以“沈青山”里的“沈青”也会被数进去；一处都对不上就是 0。

      `"沈青" in s` 只回答“有没有”，结果是 True 或 False，不告诉你有几处。

      要按句子看，可以先用 `split` 把文字切开：`text.split("。")` 在每个句号处切一刀，得到一个列表，句号本身不留下。文字以句号结尾时，最后一刀后面什么也没有，所以列表最后多出一个空字符串 `""`。英文常用不带参数的 `split()`，按空格切成单词，标点会粘在单词上，例如 `"Anna."`。

      切成句子后，用一个短循环逐句检查：

      ```python
      n = 0
      for s in text.split("。"):
          if "沈青" in s:
              n = n + 1
      ```

      这样数出来的是“提到沈青的句子有几句”：一句里出现两次，也只加 1。想数出现次数，就把每句的次数加起来：`n = n + s.count("沈青")`，结果和直接写 `text.count("沈青")` 一样。两个数都有用，但回答的不是同一个问题，提需求时要说清要哪一个。
    example:
      id: py47.k1.e0
      kind: [predict, explain]
      uses: [py35.k3, py10.k1]
      data: [story]
      body: |
        我们想知道沈青在这段文字里被提到了几次。先看程序按字面能数出什么。

        ```python
        total = text.count("沈青")
        n = 0
        for s in text.split("。"):
            if "沈青" in s:
                n = n + 1
        print(total)
        print(n)
        ```
      slots:
        - id: total
          type: text
          format: integer
          prompt: 第一行显示
          key: 4
        - id: n
          type: text
          format: integer
          prompt: 第二行显示
          key: 3
        - id: why
          type: choice
          prompt: 两个数为什么不一样？
          options:
            - id: empty
              content: 最后切出来的空字符串也被算了一句
            - id: twice
              content: 最后一句里“沈青”出现了两次，按句子数只加 1
            - id: alias
              content: "`count` 把“青儿”也算成了“沈青”"
          key: twice
      explanation: |
        第一行显示 **4**，第二行显示 **3**。

        `count` 只认字面：两处“沈青”，再加上“沈青山”出现的两次里各带一个“沈青”，一共 4 处。循环按句子数：`text.split("。")` 切出 5 段（最后一段是空字符串），提到“沈青”的是第 1、3、4 段，所以 n 是 3。第 4 段“桥头站着叔叔沈青山，沈青山冲她招手”里出现了两次，按句子只加 1，这就是两个数的差别。空字符串里没有“沈青”，不会被算进去；“青儿”和“沈青”不是同样的字，count 不会把它算进去。

        还要注意：这两个数里都包含了“沈青山”，他是另一个人。下一个知识点专门处理这件事。
      verify: |
        r = run()
        lines = r.lines()
        sentences = text.split("。")
        holds = {
            "twice": any(s.count("沈青") > 1 for s in sentences),
            "empty": "沈青" in "",
            "alias": text.count("沈青") != text.replace("青儿", "").count("沈青"),
        }
        true = [option for option, ok in holds.items() if ok]
        answers = {"total": int(lines[0]), "n": int(lines[1]), "why": true[0] if len(true) == 1 else true}
    practice:
      - id: py47.k1.q1
        kind: [predict]
        data: [story]
        body: |
          下面每一行单独输入交互解释器，写出它显示的内容。

          ```python
          text.count("青")
          text.count("沈青山")
          "青儿" in text
          text.count("林")
          ```
        slots:
          - id: shown
            type: table
            columns:
              - { id: expr, header: 输入 }
              - { id: shown, header: 显示, input: { type: text, match: output } }
            rows:
              - { id: r1, cells: { expr: '`text.count("青")`', shown: "6" } }
              - { id: r2, cells: { expr: '`text.count("沈青山")`', shown: "2" } }
              - { id: r3, cells: { expr: '`"青儿" in text`', shown: "True" } }
              - { id: r4, cells: { expr: '`text.count("林")`', shown: "0" } }
        explanation: |
          依次是 **6、2、True、0**。

          “青”这个字出现在两处“沈青”、“青儿”、“青石桥”和两处“沈青山”里，一共 6 处：count 不管它是名字的一部分还是桥名。“沈青山”出现 2 次。`in` 只回答有没有，所以是 True，而不是 1。文中没有“林”字，count 得到 0。
        verify: |
          shown = repl()
          answers = {"shown": {f"r{i}": {"shown": value} for i, value in enumerate(shown, 1)}}
      - id: py47.k1.q2
        kind: [trace]
        uses: [py35.k2, py10.k1]
        data: [story]
        body: |
          `text.split("。")` 切出 5 段。按循环的顺序，填写每一轮 `"沈青" in s` 的结果，以及这一轮结束后 `n` 的值，再写出最后显示什么。

          ```python
          n = 0
          for s in text.split("。"):
              if "沈青" in s:
                  n = n + 1
          print(n)
          ```
        slots:
          - id: rounds
            type: table
            columns:
              - { id: s, header: 这一轮的 s }
              - { id: hit, header: '"沈青" in s', input: bool }
              - { id: n, header: 这一轮结束后的 n, input: integer }
            rows:
              - { id: s1, cells: { s: 沈青推开院门, hit: true, n: 1 } }
              - { id: s2, cells: { s: 娘在灶台边喊青儿带上伞, hit: false, n: 1 } }
              - { id: s3, cells: { s: 沈青应了一声，往青石桥走去, hit: true, n: 2 } }
              - { id: s4, cells: { s: 桥头站着叔叔沈青山，沈青山冲她招手, hit: true, n: 3 } }
              - { id: s5, cells: { s: '""（空字符串）', hit: false, n: 3 } }
          - id: output
            type: text
            format: integer
            prompt: 最后显示什么？
            key: 3
            feedback:
              - when: 4
                message: 第 4 段里“沈青”出现了两次，但这个循环每句最多加 1。
              - when: 2
                message: 第 4 段的“沈青山”里也有“沈青”两个字，`in` 只认字面，这一段是 True。
        explanation: |
          `n` 依次是 **1、1、2、3、3**，最后显示 **3**。

          第 2 段只有“青儿”，没有“沈青”两个字连在一起，所以是 False。第 4 段的“沈青山”里有“沈青”，`in` 只认字面，是 True；它出现了两次，但这个循环每句最多加 1。最后一段是句号后面切出来的空字符串，什么都不包含。
        verify: |
          n = 0
          rows = {}
          for i, s in enumerate(text.split("。"), 1):
              hit = "沈青" in s
              if hit:
                  n = n + 1
              rows[f"s{i}"] = {"hit": hit, "n": n}
          answers = {"rounds": rows, "output": int(run().out)}
      - id: py47.k1.q3
        kind: [modify]
        uses: [py35.k3]
        data: [story]
        body: |
          需求是：

          > 数出名字 `name` 在 `text` 里一共出现了几次，同一句里出现两次算两次，结果放在 `n` 里。

          同事写的代码在作答框里，它数成了句子数。请改动它并提交。宿主提供了 `text` 和 `name`；这次 `name` 是 `"沈青"`，换一次分析可以是别的名字。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 6
            starter: |
              n = 0
              for s in text.split("。"):
                  if name in s:
                      n = n + 1
            solution: |
              n = 0
              for s in text.split("。"):
                  n = n + s.count(name)
            accepts:
              - n = text.count(name)
              - |
                n = 0
                for s in text.split("。"):
                    if name in s:
                        n = n + s.count(name)
            rejects:
              - code: n = text.count("沈青")
                why: 把名字写死成“沈青”
              - code: n = len(text.split("。"))
                why: 数的是切出来的段数
              - code: n = len(text.split(name))
                why: 按名字切开后的段数比出现次数多 1
            tests:
              - name: 沈青
                setup: name = "沈青"
                expect:
                  n: "4"
              - name: 换一个名字
                hidden: true
                setup: name = "青儿"
                expect:
                  n: "1"
              - name: 换一段文字，同一句里出现两次
                hidden: true
                data: [story_lin]
                setup: name = "舟儿"
                expect:
                  n: "2"
        explanation: |
          把“这句有没有”换成“这句有几处”，再累加：

          ```python
          n = 0
          for s in text.split("。"):
              n = n + s.count(name)
          ```

          直接写 `n = text.count(name)` 也对，结果相同。本例 n 是 4；判分时还会换名字、换一段一句里出现两次的文字运行你的代码。名字要用 `name`，不要写死成“沈青”。
    review:
      - id: py47.k1.r1
        kind: [predict]
        data: [note_en]
        body: |
          英文常按空格把一句话切成单词。下面每一行依次输入交互解释器，写出第 1、3、4 行显示的内容。

          ```python
          note.count("Ann")
          words = note.split()
          words.count("Ann")
          words.count("Anna")
          ```
        slots:
          - id: c1
            type: text
            match: output
            prompt: '`note.count("Ann")` 显示'
            key: "3"
          - id: c3
            type: text
            match: output
            prompt: '`words.count("Ann")` 显示'
            key: "2"
          - id: c4
            type: text
            match: output
            prompt: '`words.count("Anna")` 显示'
            key: "0"
          - id: why
            type: choice
            prompt: 最后一行为什么是这个结果？
            options:
              - id: case
                content: "`count` 不区分大小写，“Anna”被算成了“Ann”"
              - id: period
                content: "`split()` 只按空格切，列表里的是 `\"Anna.\"`，带着句点，和 `\"Anna\"` 不是同一个字符串"
              - id: twice
                content: “Anna”已经在第 1 行被数过，不会再数一次
            key: period
        explanation: |
          依次显示 **3、2、0**。

          字符串的 `count` 按字面找“Ann”：两个 Ann 各一处，“Anna”的前三个字母也是一处，共 3。`note.split()` 得到 `['Ann', 'met', 'Anna.', 'Ann', 'smiled.']`，列表的 `count` 要整个元素完全相同才算：两个 `'Ann'` 算，`'Anna.'` 不算，所以是 2。同理，列表里没有恰好等于 `'Anna'` 的元素——那个元素带着句点，是 `'Anna.'`——所以是 0。
        verify: |
          shown = repl()
          words = note.split()
          holds = {
              "period": "Anna." in words and "Anna" not in words,
              "case": note.count("ann") == note.count("Ann") and "ann" in note,
              "twice": False,
          }
          true = [option for option, ok in holds.items() if ok]
          answers = {"c1": shown[0], "c3": shown[2], "c4": shown[3], "why": true[0] if len(true) == 1 else true}
      - id: py47.k1.r2
        kind: [modify]
        uses: [py35.k1, py35.k3, py10.k1]
        body: |
          日记 `lines` 是一个列表，每个元素是一行字。把下面的代码块排成程序：数出有几行提到了 `name`（同一行提到两次也只算 1 行），最后显示这个数。拖动时也要排好缩进。不是每一块都要用。
        slots:
          - id: program
            type: order
            partial: true
            indent: 2
            items:
              - { id: count, code: n = n + line.count(name) }
              - { id: show, code: print(n) }
              - { id: loop, code: "for line in lines:" }
              - { id: add, code: n = n + 1 }
              - { id: init, code: n = 0 }
              - { id: check, code: "if name in line:" }
              - { id: length, code: n = len(lines) }
            key: [init, loop, check, add, show]
            indents: { init: 0, loop: 0, check: 1, add: 2, show: 0, count: 2, length: 0 }
            tests:
              - name: 一行里提到两次
                setup: |
                  lines = ["今天见到阿木", "阿木说阿木的狗丢了", "晚上下雨"]
                  name = "阿木"
                stdout: "2"
              - name: 没有一行提到
                hidden: true
                setup: |
                  lines = ["下雨", "又下雨"]
                  name = "阿木"
                stdout: "0"
              - name: 换一个名字
                hidden: true
                setup: |
                  lines = ["小满来了", "小满和小满的妹妹", "阿木", "小满"]
                  name = "小满"
                stdout: "3"
        explanation: |
          ```python
          n = 0
          for line in lines:
              if name in line:
                  n = n + 1
          print(n)
          ```

          `n = 0` 放在循环前面，只做一次；`if` 缩进在循环里，加 1 再缩进一层，只在这一行提到名字时执行；`print` 不缩进，循环结束后显示一次。“n = n + line.count(name)”数的是出现次数，第二行提到两次会加 2；“n = len(lines)”数的是总行数。
    quiz:
      - id: py47.k1.x1
        kind: [predict]
        uses: [py35.k3]
        data: [story_lin]
        body: |
          要数出“舟儿”在 `text` 里一共出现几次，同一句里出现两次算两次。哪一段代码把正确的次数放进了 `n`？
        slots:
          - id: program
            type: choice
            options:
              - id: per_sentence
                content: |
                  ```python
                  n = 0
                  for s in text.split("。"):
