id: py47
title: 兴趣支线：小说里的名字出现了几次
status: complete
minutes: 20
summary: 用 count、in、split 和短循环按字面数名字，再把“提到这个人”写成别名、排除词和计数单位都清楚的规则。
prerequisites: [py05, py36, py37]
encompassings:
  - {topic: py05, weight: 0.5}
  - {topic: py36, weight: 0}
  - {topic: py37, weight: 0.5}
  - {topic: py12, weight: 0.5}
sources:
  - source: think-python
    where: 第 8 章
    url: https://allendowney.github.io/ThinkPython/chap08.html
    use: reference
  - source: think-python
    where: 第 12 章
    url: https://allendowney.github.io/ThinkPython/chap12.html
    use: reference
  - source: python-docs
    where: 标准库：字符串方法（str.count、str.split、str.replace）
    url: https://docs.python.org/3.12/library/stdtypes.html#string-methods
    use: reference
notes: |
  范围：只处理题面给出的一小段自拟文字，用 count、in、split 和 py35、py36 的短循环；不讲分词、正则表达式，也不读整本书的文件。py37 的字典只在 k2 例题里用来并排看几个次数。split 和 count 在本节第一次出现，在 k1 讲解里讲清。
  兴趣支线，主线完成不以它为关键先修。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 5 分钟；k2 讲解与例题 4 分钟、练习 5 分钟；收束 2 分钟。
  小说片段、人物和题目都是本课自拟。复习和测验题的答案全部由 verify 用另一种算法（re 正则或逐句计算）独立算出，没有 manual 作答位；k2.q3 是写规则的开放作答，只放在练习里。
  几段文字特意让“只数字面”和“按规则数”的结果不同，避免错误做法碰巧得出正确的数；改文字时要重新核对这一点。
intro: |
  这一节是兴趣支线：数一数一段小说里某个人物被提到了几次。按字面数的工具很简单，难处在于“提到这个人”到底指什么。

  题目里的小说片段都是本课自己编的。变量 `text` 里放的就是题面展示的那段文字，每道题都从题面给出的文字重新开始。
wrapup: |
  让 AI 帮你数人物时，可以这样说：“数沈青被提到的次数：‘沈青’‘青儿’都算；‘沈青山’是另一个人，不算；一句里出现两次算两次。”

  拿到结果后，先在原文里找一处名字藏在更长的词里的地方、一处别名，核对它们有没有按规则处理。
