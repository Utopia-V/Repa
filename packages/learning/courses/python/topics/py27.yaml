      - id: py27.k2.q3
        kind: [modify]
        uses: [py16.k1]
        data: [G]
        body: |
          需求是：

          > 按 group 分组，对每组的 signal 求平均（跳过缺失）。结果是一张表：第一列 group，第二列 signal，每组一行，组名按字母顺序，行标签从 0 开始。不改变 `df`。

          作答框里是 AI 给的代码，它离需求还差两处。请改动它并提交，结果变量仍叫 `result`。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              result = df.groupby("group")["signal"].sum()
            solution: |
              result = df.groupby("group")["signal"].mean().reset_index()
            accepts:
              - result = df.groupby("group")[["signal"]].mean().reset_index()
              - result = df.groupby("group", as_index=False)["signal"].mean()
            rejects:
              - code: result = df.groupby("group")["signal"].mean()
                why: 组名还是行标签，结果是一列而不是带 group 列的表
              - code: result = df.groupby("group")["signal"].sum().reset_index()
                why: 仍是求和而不是平均
              - code: result = df.groupby("group", sort=False)["signal"].mean().reset_index()
                why: 关掉了排序，组按首次出现的顺序排列
              - code: result = df.groupby("group").mean().reset_index()
                why: 没有选出 signal 列，对文字列 sample_id 求平均会报错
              - code: result = df.groupby("group")["signal"].mean().reset_index(drop=True)
                why: drop=True 把组名直接丢掉了
            tests:
              - name: 表 G
                expect:
                  result: 'pd.DataFrame({"group": ["control", "drug"], "signal": [8.0, 11.0]})'
                  df: df
              - name: 三个组、首次出现的顺序不是字母顺序
                hidden: true
                data: [G2]
                expect:
                  result: 'pd.DataFrame({"group": ["control", "drug", "placebo"], "signal": [7.0, 9.0, 4.0]})'
                  df: df
              - name: 只有两个组、drug 先出现
                hidden: true
                data: [G3]
                expect:
                  result: 'pd.DataFrame({"group": ["control", "drug"], "signal": [9.0, 7.0]})'
                  df: df
        explanation: |
          要改两处：`.sum()` 改成 `.mean()`；再接 `.reset_index()`，让组名成为 group 列。

          ```python
          result = df.groupby("group")["signal"].mean().reset_index()
          ```

          写成 `df.groupby("group", as_index=False)["signal"].mean()` 也对。表 G 上结果是两行：control 8.0、drug 11.0。判分时还会换几张组的出现顺序不同、有缺失值的表运行你的代码。
