id: py27
title: 按组回答一个问题
status: complete
minutes: 20
summary: 读懂 df.groupby("分组列")["值列"].聚合()：先按组分开，组内照常汇总，再合成每组一行的结果；分清每条记录一行、每组一行和整张表一个数。
prerequisites:
  - topic: py26
    key: true
    weight: 0.67
    covers: [py26.k1, py26.k2]
  - topic: py16
    key: true
    weight: 0.33
    covers: [py16.k1, py16.k2]
sources:
  - source: pydata-book
    where: 第 10 章 §10.1–10.2（分组机制与数据聚合）
    url: https://wesmckinney.com/book/data-aggregation
    use: reference
  - source: pandas-docs
    where: 入门教程：汇总统计（按类别分组汇总）
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/06_calculate_statistics.html
    use: reference
notes: |
  范围：只用一个分组列、一个值列和一种聚合（mean、sum、count、max）。命名聚合 .agg(新列名=(列, 操作)) 和分组键缺失时的 dropna 由 py28 承担；size 与 count 的区别也留给 py28.k2。书 §10 里 groupby(..., axis="columns") 的写法在 pandas 3 已移除，不进入本课。组名用英文或字母，避免中文组名的排序顺序干扰判断。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 4 分钟、练习 4 分钟；k2 讲解与例题 3 分钟、两道读结果题 3 分钟、小改代码题 4 分钟；收束 1 分钟。
  小表、讲解和题目为本课自拟。k1.q2 的三个结构字段要靠读代码判断，列在 manual 里；它是练习，不强制模型核对。复习和测验题全部由程序核对。
intro: |
  宿主已经准备好 pandas 和数据表，你直接读表和代码，不需要写导入或构造数据的代码。

  每道题都从题面给出的表重新开始。大多数题用表 G：`sample_id` 是样本编号，`group` 是实验组标签，`signal` 是一次测量的值（任意单位），NaN 表示没测到。左边的原行索引是原表的行标签。

  上一节用掩码一次筛出一个组再汇总；这一节一行代码对每个组都汇总一遍。
wrapup: |
  读到 `groupby` 时，先找三样：按哪一列分组、对哪一列算、算什么；再说出结果的样子：每组一行，行标签是排好序的组名，有几个组就有几行。

  向同事或 AI 提要求时，可以说：“按 group 分组，对每组的 signal 求平均（跳过缺失），输出一张表，group 一列、signal 一列，每组一行。”
