    quiz:
      - id: py27.k2.x1
        kind: [explain, predict]
        uses: [py16.k1, py26.k1]
        data: [water]
        body: |
          同事发来分组统计的结果，要的是每个站点测到浓度的次数（没测到的不算）：一张表，第一列 station，第二列 conc 存次数，行标签从 0 开始，站点按字母顺序：

          ```text
            station  conc
          0       A     1
          1       B     2
          2       C     2
          ```

          他说这是用表 water 算出来的，却没写代码。
        slots:
          - id: code
            type: choice
            multiple: true
            prompt: 下面哪些代码在表 water 上运行，得到的 `result` 正好是上面这张表？选出所有的。
            options:
              - id: reset
                content: |
                  ```python
                  result = water.groupby("station")["conc"].count().reset_index()
                  ```
              - id: as_index
                content: |
                  ```python
                  result = water.groupby("station", as_index=False)["conc"].count()
                  ```
              - id: series
                content: |
                  ```python
                  result = water.groupby("station")["conc"].count()
                  ```
                feedback: 结果是一列（Series），station 在行标签里，不是一列。
              - id: frame_only
                content: |
                  ```python
                  result = water.groupby("station")[["conc"]].count()
                  ```
                feedback: 是一张表，但 station 还在行标签里，行标签不是 0、1、2。
              - id: total
                content: |
                  ```python
                  result = water.groupby("station")["conc"].sum().reset_index()
                  ```
                feedback: sum 是把浓度加起来，A 站得 3.0，不是次数 1。
            key: [reset, as_index]
        explanation: |
          要的是一张表：station 是普通的一列，行标签是 0、1、2。

          - `.count().reset_index()`：先得到以 station 为行标签的一列，`reset_index()` 把 station 变回普通的一列，行标签重新编为 0、1、2。
          - `groupby("station", as_index=False)`：一开始就不让 station 进行标签，结果相同。
          - 只写 `["conc"].count()` 得到一列，station 在行标签里。
          - `[["conc"]].count()` 得到一张表，但 station 仍在行标签里，要再接 `reset_index()`。
          - `sum()` 是把浓度加起来，不是数次数：A 站得 3.0，不是 1。
        verify: |
          expected = pd.DataFrame({"station": ["A", "B", "C"], "conc": [1, 2, 2]})
          fits = []
          for option, code in OPTIONS["code"].items():
              r = run(code)
              out = r["result"] if r.error is None else None
              if isinstance(out, pd.DataFrame) and list(out.columns) == ["station", "conc"] and out.equals(expected):
                  fits.append(option)
          answers = {"code": fits}
