kps:
  - id: py27.k1
    title: groupby 先分组再聚合
    card:
      name: 分组聚合
      aliases: [groupby, 按组汇总]
      definition: df.groupby("分组列")["值列"].聚合() 先按分组列的取值把行分成几组，在每组里对值列做同一种汇总，再把各组的结果合在一起。
      conditions:
        - 读代码时依次找三样：按哪一列分组、对哪一列算、算什么。
        - 组内照常跳过缺失：每组的 mean 除以这一组的 count。
      example:
        from: py27.k1.e0
        text: |
          ```python
          result = df.groupby("group")["signal"].mean()
          ```
          表 G 里 control 组为 10.0、NaN、6.0，平均 8.0；drug 组为 8.0、13.0、12.0，平均 11.0。
    lesson: |
      上一节要算 drug 组的平均，先用掩码筛出 drug 组，再求 `mean()`。组多了，一组一组筛很麻烦。下面这一行对每个组都算一遍：

      ```python
      result = df.groupby("group")["signal"].mean()
      ```

      从左往右读三段：

      1. `groupby("group")`：按 group 列的取值分组。表 G 里只有 drug 和 control 两种，于是分成两组。
      2. `["signal"]`：在每一组里取出 signal 这一列。
      3. `.mean()`：对每一组的 signal 求平均。

      手算时也照这三步做：

      | 组 | 这一组的 signal | 平均 |
      |---|---|---:|
      | control | 10.0、NaN、6.0 | 8.0 |
      | drug | 8.0、13.0、12.0 | 11.0 |

      组内的汇总照[跳过缺失](repa:concept/py26.k2)的规则：control 组有 3 行，只有 2 个值，16.0 / 2 = 8.0。把 `.mean()` 换成 `.sum()`、`.count()`、`.max()`，就是对每组做另一种汇总。
    example:
      id: py27.k1.e0
      kind: [predict]
      uses: [py26.k1, py26.k2, py16.k1]
      data: [G]
      body: |
        阅读代码，写出每个组的结果。

        ```python
        result = df.groupby("group")["signal"].mean()
        ```
      slots:
        - id: means
          type: table
          columns:
            - { id: group, header: 组 }
            - { id: mean, header: 平均, input: { type: text, format: number } }
          rows:
            - { id: control, cells: { group: control, mean: 8 } }
            - { id: drug, cells: { group: drug, mean: 11 } }
        - id: used
          type: text
          format: integer
          prompt: control 组的平均用到了几个值？
          key: 2
      explanation: |
        control 组是索引 7、4、9 三行，signal 为 10.0、NaN、6.0，跳过 NaN 后平均 16.0 / 2 = **8.0**，用到 **2** 个值；drug 组是索引 31、22、15，(8.0 + 13.0 + 12.0) / 3 = **11.0**。
      verify: |
        result = run()["result"]
        groups = {}
        for label, value in zip(df["group"].tolist(), df["signal"].tolist()):
            if value == value:  # 跳过 NaN
                groups.setdefault(label, []).append(value)
        assert all(result[label] == sum(values) / len(values) for label, values in groups.items())
        answers = {"means": {label: {"mean": result[label]} for label in result.index}, "used": len(groups["control"])}
    practice:
      - id: py27.k1.q1
        kind: [predict]
        uses: [py26.k1, py26.k2]
        data: [G]
        body: |
          阅读代码，填写 `total` 和 `n` 里每个组的值。

          ```python
          total = df.groupby("group")["signal"].sum()
          n = df.groupby("group")["signal"].count()
          ```
        slots:
          - id: values
            type: table
            columns:
              - { id: group, header: 组 }
              - { id: total, header: total, input: { type: text, format: number } }
              - { id: n, header: "n", input: integer }
            rows:
              - { id: control, cells: { group: control, total: 16, n: 2 } }
              - { id: drug, cells: { group: drug, total: 33, n: 3 } }
        explanation: |
          control 组：10.0 + 6.0 = **16.0**，有值的 **2** 个；drug 组：8.0 + 13.0 + 12.0 = **33.0**，有值的 **3** 个。count 在每组里只数有值的格子，所以 control 组是 2 而不是 3。
        verify: |
          r = run()
          answers = {"values": {label: {"total": r["total"][label], "n": r["n"][label]} for label in r["total"].index}}
      - id: py27.k1.q2
        kind: [explain, predict]
        uses: [py16.k1]
        data: [soil]
        body: |
          阅读代码，说出它在做什么。

          ```python
          deepest = soil.groupby("plot")["depth"].max()
          ```
        slots:
          - id: key
            type: choice
            prompt: 按哪一列分组？
            options:
              - { id: site, content: site }
              - { id: plot, content: plot }
              - { id: depth, content: depth }
            key: plot
          - id: value
            type: choice
            prompt: 对哪一列做汇总？
            options:
              - { id: site, content: site }
              - { id: plot, content: plot }
              - { id: depth, content: depth }
            key: depth
          - id: how
            type: choice
            prompt: 做什么汇总？
            options:
              - { id: max, content: 取最大值 }
              - { id: mean, content: 求平均 }
              - { id: count, content: 数有几个 }
            key: max
          - id: plot_c
            type: text
            format: integer
            prompt: 地块 C 的结果是多少？
            key: 34
        explanation: |
          按 **plot** 分组，对 **depth** 取**最大值**：每个地块里最深的那个采样点有多深。地块 C 有北坡 30 和东坡 34 两个采样点，结果是 **34**。
        verify: |
          deepest = run()["deepest"]
          answers = {"plot_c": deepest["C"]}
        manual: [key, value, how]
      - id: py27.k1.q3
        kind: [debug]
        uses: [py16.k1]
        data: [G]
        body: |
          要求是“每个组 signal 的最大值”。同事写了：

          ```python
          result = df.groupby("signal")["group"].max()
          ```
        slots:
          - id: problem
            type: choice
            prompt: 问题在哪里？
            options:
              - id: swapped
                content: 分组列和值列写反了：按 signal 分组，对 group 取最大
              - id: agg
                content: 应该用 mean 而不是 max
              - id: fine
                content: 没有问题，结果就是每组的最大值
            key: swapped
          - id: rows
            type: text
            format: integer
            prompt: 这段代码的结果有几行？
            key: 5
          - id: drug_max
            type: text
            format: number
            prompt: 改对以后，drug 组的结果是多少？
            key: 13
        explanation: |
          分组列和值列**写反了**。`groupby("signal")` 把每个不同的 signal 值当作一组：5 个有值的 signal 各不相同，于是得到 **5** 行（NaN 那一行不成组），每行是这一组的 group 文字，回答的不是要求的问题。改成 `df.groupby("group")["signal"].max()` 后，drug 组的最大值是 **13.0**。
        verify: |
          wrong = run()["result"]
          fixed = run('result = df.groupby("group")["signal"].max()')["result"]
          by_hand = max(value for label, value in zip(df["group"], df["signal"]) if label == "drug" and value == value)
          answers = {
              "problem": "swapped" if list(wrong.index) != list(fixed.index) and fixed["drug"] == by_hand else "fine",
              "rows": len(wrong),
              "drug_max": fixed["drug"],
          }
    review:
      - id: py27.k1.r1
        kind: [modify]
        uses: [py16.k1]
        data: [plants]
        body: |
          把下面四块拼成一行代码，算出每个地块幼苗的平均高度，存进 `result`。每块都要用上。
        slots:
          - id: chunks
            type: order
            items:
              - { id: mean, code: .mean() }
              - { id: start, code: result = plants }
              - { id: column, code: '["height"]' }
              - { id: group, code: .groupby("plot") }
            key: [start, group, column, mean]
          - id: plot_b
            type: text
            format: number
            prompt: 地块 B 的平均高度是多少？
            key: 14
        explanation: |
          拼成 `result = plants.groupby("plot")["height"].mean()`：先分组，再取 height 列，最后求平均。地块 B 有 15 和 13 两株，平均 **14.0**。

          先取列再分组（`plants["height"].groupby("plot")`）会报错，因为单独取出的 height 列里没有 plot；先求平均再取列，会对 plant_id 这样的文字列也求平均而报错。
        verify: |
          import itertools
          chunks = {"start": 'result = plants', "group": '.groupby("plot")', "column": '["height"]', "mean": '.mean()'}
          groups = {}
          for plot, height in zip(plants["plot"].tolist(), plants["height"].tolist()):
              groups.setdefault(plot, []).append(height)
          expected = {plot: sum(values) / len(values) for plot, values in groups.items()}
          fits = []
          for rest in itertools.permutations(["group", "column", "mean"]):
              order = ["start", *rest]
              r = run("".join(chunks[part] for part in order))
              if r.error is None and isinstance(r["result"], pd.Series) and r["result"].to_dict() == expected:
                  fits.append(order)
          answers = {"chunks": fits[0] if len(fits) == 1 else fits, "plot_b": expected["B"]}
      - id: py27.k1.r2
        kind: [predict]
        uses: [py26.k2]
        data: [water]
        body: |
          阅读代码，填写每个站点的结果。

          ```python
          avg = water.groupby("station")["conc"].mean()
          ```
        slots:
          - id: avg
            type: table
            columns:
              - { id: station, header: 站点 }
              - { id: value, header: 平均浓度, input: { type: text, format: number } }
            rows:
              - { id: A, cells: { station: A, value: 3 } }
              - { id: B, cells: { station: B, value: 7 } }
              - { id: C, cells: { station: C, value: 6 } }
        explanation: |
          A 站：3.0 和 NaN，跳过 NaN 后只剩 3.0，平均 **3.0**；B 站：(6.0 + 8.0) / 2 = **7.0**；C 站：(5.0 + 7.0) / 2 = **6.0**。A 站的平均只来自一次测量，报告时最好附上 n。
        verify: |
          avg = run()["avg"]
          answers = {"avg": {station: {"value": avg[station]} for station in avg.index}}
    quiz:
      - id: py27.k1.x1
        kind: [predict]
        uses: [py16.k2]
        data: [survey]
        body: |
          屏幕上显示什么？`.loc["上海"]` 按行标签取出上海那一组的值。

          ```python
          by_city = survey.groupby("city")["age"].mean()
          print(by_city.loc["上海"])
          ```
        slots:
          - id: output
            type: text
            match: output
            key: "33.0"
        explanation: |
          显示 **33.0**。上海组是 R1、R3、R6 三位，年龄 30、36、33，平均 99 / 3 = 33.0。平均值是浮点数，所以显示 33.0 而不是 33。
        verify: |
          answers = {"output": run().lines()[0]}
      - id: py27.k1.x2
        kind: [explain]
        uses: [py16.k1]
        data: [farm]
        body: |
          要求是“每种作物的总产量”。哪一行代码符合要求？
        slots:
          - id: code
            type: choice
            options:
              - id: swapped
                content: |
                  ```python
                  result = farm.groupby("yield_kg")["crop"].sum()
                  ```
              - id: whole
                content: |
                  ```python
                  result = farm["yield_kg"].sum()
                  ```
              - id: right
                content: |
                  ```python
                  result = farm.groupby("crop")["yield_kg"].sum()
                  ```
              - id: mean
                content: |
                  ```python
                  result = farm.groupby("crop")["yield_kg"].mean()
                  ```
            key: right
        explanation: |
          `farm.groupby("crop")["yield_kg"].sum()` 符合要求：按作物分组，对产量求和，wheat 为 15、corn 为 12、rice 为 3。`farm["yield_kg"].sum()` 是全部地块的总产量 30，不分作物；把分组列和值列写反，是按产量分组去拼作物名；`.mean()` 算的是平均产量而不是总产量。
        verify: |
          totals = {}
          for crop, value in zip(farm["crop"].tolist(), farm["yield_kg"].tolist()):
              totals[crop] = totals.get(crop, 0) + value
          def fits(code):
              result = run(code)["result"]
              return isinstance(result, pd.Series) and result.to_dict() == totals
          ok = [option for option, code in OPTIONS["code"].items() if fits(code)]
          answers = {"code": ok[0] if len(ok) == 1 else ok}

  - id: py27.k2
    title: 区分每条记录与每组一行的结果
    card:
      name: 每组一行
      aliases: [分组结果的形状]
      definition: 分组汇总的结果每组一行：行数等于不同组的个数，行标签是排好序的组名，而不是原表的行索引。
      conditions:
        - 结果默认按组名排序，不按组在原表里第一次出现的顺序。
        - 写成 [["signal"]] 得到一张表；再接 reset_index()，组名会变成普通的一列。
      example:
        from: py27.k2.e0
        text: |
          表 G 有 6 行；`df.groupby("group")["signal"].mean()` 只有 2 行，行标签依次是 control、drug。
    lesson: |
      同一张表，可以得到三种“粒度”的结果：

      | 代码 | 结果是什么 | 表 G 上有几个值 |
      |---|---|---:|
      | `df` | 每条记录一行 | 6 行 |
      | `df.groupby("group")["signal"].mean()` | 每组一行 | 2 个 |
      | `df["signal"].mean()` | 整张表一个数 | 1 个 |

      分组的结果是一列（Series），行标签是组名，不是原来的 31、7、22……。组名**默认按字母顺序排好**：表 G 里 drug 先出现，结果里却是 control 在前。行数等于有几个不同的组，和原表行数无关，所以不能把它和原表一行一行地对齐。`df` 本身也没有变。

      需要一张表时，有两处可以改：

      - 值列写成列名列表 `[["signal"]]`，结果是一张表（[单列与多列](repa:concept/py16.k1)的区别照样成立）；
      - 再接 `.reset_index()`，组名从行标签变成普通的一列 group，行标签重新编为 0、1……。写成 `df.groupby("group", as_index=False)["signal"].mean()` 效果相同。
    example:
      id: py27.k2.e0
      kind: [predict]
      uses: [py14.k1, py16.k1]
      data: [G]
      body: |
        阅读代码，说出 `result` 的样子。

        ```python
        result = df.groupby("group")["signal"].mean()
        ```
      slots:
        - id: labels
          type: order
          partial: true
          prompt: "`result` 的行标签是什么？按结果里的顺序排出来，不属于它的不要放进来。"
          items:
            - { id: drug, content: drug }
            - { id: control, content: control }
            - { id: "31", content: "31" }
            - { id: "7", content: "7" }
          key: [control, drug]
        - id: nrows
          type: text
          format: integer
          prompt: "`result` 有几行？"
          key: 2
        - id: df_rows
          type: text
          format: integer
          prompt: 运行之后，`df` 有几行？
          key: 6
      explanation: |
        `result` 只有 **2** 行，行标签依次是 **control、drug**：组名按字母排序，虽然 drug 在原表里先出现；原行索引 31、7 不会出现在结果里。`df` 没有变，仍是 **6** 行。
      verify: |
        r = run()
        result = r["result"]
        assert set(result.index) == set(df["group"]) and list(result.index) == sorted(set(df["group"]))
        answers = {"labels": [str(label) for label in result.index], "nrows": len(result), "df_rows": len(r["df"])}
    practice:
      - id: py27.k2.q1
        kind: [predict]
