      - id: py10.k3.x2
        kind: [explain]
        uses: [py08.k1]
        body: |
          要求：`count` 小于 0 时 `label` 为“无效”，否则为“有效”。宿主事先给 `count` 赋了值，每段代码之后都会执行 `print(label)`。

          哪几段代码对任何整数 `count` 都符合要求，并且 `print(label)` 不会报错？选出所有符合的。
        slots:
          - id: programs
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            options:
              - id: default
                content: |
                  ```python
                  label = "有效"
                  if count < 0:
                      label = "无效"
                  ```
              - id: only_if
                content: |
                  ```python
                  if count < 0:
                      label = "无效"
                  ```
              - id: with_else
                content: |
                  ```python
                  if count < 0:
                      label = "无效"
                  else:
                      label = "有效"
                  ```
              - id: two_ifs
                content: |
                  ```python
                  if count < 0:
                      label = "无效"
                  if count > 0:
                      label = "有效"
                  ```
            key: [default, with_else]
        explanation: |
          **先给默认值的那段**和**带 else 的那段**符合要求：不论走哪条路径，label 最后都有值，而且值是对的。

          只有一个 if 的那段，count 不小于 0 时 label 从来没被赋值，print 会报 NameError。两个 if 的那段漏掉了 count 恰好为 0 的情况：两个条件都不成立，同样报错。
        verify: |
          def wanted(count):
              return "无效" if count < 0 else "有效"
          fits = []
          for option, code in OPTIONS["programs"].items():
              results = [(v, run(code + "\nprint(label)", count=v)) for v in (-5, -1, 0, 1, 7)]
              if all(r.error is None and r.out.strip() == wanted(v) for v, r in results):
                  fits.append(option)
          answers = {"programs": fits}
