        signal 为 25 时条件成立，第 3 行把 flag 改为“偏高”，显示 **偏高**。signal 为 12 时条件不成立，第 3 行**没有执行**，flag 保持第 1 行给的默认值，显示 **正常**。
      verify: |
        import sys
        def ran(code=CODE, **inputs):
            lines = set()
            def tracer(frame, event, arg):
