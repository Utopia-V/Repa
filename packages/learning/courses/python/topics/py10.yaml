id: py10
title: 有条件地做一件事
status: complete
minutes: 20
summary: 读懂 if/elif/else：一组分支只走一条路径；缩进划出哪些行受条件控制；按实际走过的路径追踪变量的值。
prerequisites: [py09, py01]
encompassings:
  - {topic: py09, weight: 0.5}
  - {topic: py01, weight: 0.5}
sources:
  - source: think-python
    where: 第 5 章 （跳过递归）
    url: https://allendowney.github.io/ThinkPython/chap05.html
    use: reference
  - source: python-docs
    where: 教程第 4 章 §4.1
    url: https://docs.python.org/3.12/tutorial/controlflow.html
    use: reference
notes: |
  建议题型与判分：预测输出（P）、追踪变量（P）、找错（P）。
  范围：只用一层 if/elif/else，条件只用 py08 的比较和 py09 的 and/or/not；不嵌套 if，不用循环、列表和函数定义。程序仍按 py01 的约定当作短脚本从上往下运行。
  很多题由宿主事先给输入变量赋值（例如 signal），代码里不写这一行，同一段代码换几个值运行，这样能直接比较不同路径；题面每次都说明。
  k2 的 Parsons 题按测试判，测试用 setup 给输入变量赋不同的值，学生排出的程序不能把值写死。
  核对里的 ran() 用 sys.settrace 记下实际执行过的行号；else: 这一行本身没有字节码，不会被记下，所以只问分支里的行。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 4 分钟；k2 讲解与例题 2 分钟、练习 4 分钟；k3 讲解与例题 2 分钟、练习 3 分钟；收束 1 分钟。
  情境与数据为本课自拟，阈值都是题目约定，不是科研结论。
intro: |
  这一节读带条件的代码：程序走到 `if` 时先算出条件是 True 还是 False，再决定下面几行做不做。

  代码仍当作短脚本从上往下运行。有些题会说“宿主事先给 `signal` 赋了值”，这时代码里不写这一行，同一段代码会换不同的值运行，你要分别说出结果。题里的阈值都是题目自己的约定。
wrapup: |
  读一段带 `if` 的代码，可以按三步走：先算条件，找出这次走的是哪一条路径；再看缩进，分清哪些行属于这条路径、哪些行之后无论如何都会执行；最后只执行这条路径上的赋值，写下各个名字的值。

  向 AI 描述分类规则时，也按这个顺序说：每一档的条件（含不含等号）、档与档的先后、都不满足时怎么办。
kps:
  - id: py10.k1
    keyPrerequisites: [py08]
    title: if/elif/else 的互斥路径
    card:
      name: if/elif/else
      aliases: [条件分支, 分支]
      definition: 从上往下依次检查条件，第一个为 True 的分支执行，同一组里其余的分支都跳过；条件都不成立时执行 else。
      conditions:
        - 一组 if/elif/else 只走一条路径；前面的条件成立以后，后面的 elif 不再检查，所以条件的先后会影响结果。
        - 分开写的两个 if 是两组，各查各的，可能都执行。
      example:
        from: py10.k1.e0
        text: |
          ```python
          signal = 12
          if signal >= 15:
              level = "高"
          elif signal >= 10:
              level = "中"
          else:
              level = "低"
          print(level)
          ```
          `signal >= 15` 为 False，接着查 `signal >= 10`，为 True，于是 level 为“中”，else 被跳过；显示“中”。
    lesson: |
      程序走到 `if` 这一行时，先算出冒号前面的条件，也就是 [比较](repa:concept/py08.k1) 或 [and/or/not](repa:concept/py09.k1) 得到的 True 或 False。条件为 True，就执行它下面缩进的几行；为 False，就跳过这几行。

      几种情况可以连成一组：`elif` 是“否则，如果……”，`else` 是“否则”，`else` 后面不写条件。

      ```python
      if signal >= 15:
          level = "高"
      elif signal >= 10:
          level = "中"
      else:
          level = "低"
      ```

      Python 从上往下检查：

      1. 先看 `signal >= 15`。成立就让 level 为“高”，**这一组到此结束**，后面的 elif 和 else 都不再看。
      2. 不成立，才看 `signal >= 10`。
      3. 前面的条件都不成立，执行 else 下面的行。

      | signal | `signal >= 15` | `signal >= 10` | level |
      |---:|---|---|---|
      | 18 | True | （不再检查） | 高 |
      | 12 | False | True | 中 |
      | 7 | False | False | 低 |

      所以一组 if/elif/else 恰好走一条路径；没有 else 时，条件都不成立就一条也不走。signal 为 18 时 `signal >= 10` 其实也成立，但它排在后面，轮不到它：**条件的先后会影响结果**。

      如果写成两个分开的 `if`，就是两组，第二个 if 不管第一个成不成立都会检查，两块可能都执行。
    example:
      id: py10.k1.e0
      kind: [predict, trace]
      uses: [py08.k1, py08.k2]
      body: |
        把测量值分成高、中、低三档。阅读代码。

        ```python startLine=1
        signal = 12
        if signal >= 15:
            level = "高"
        elif signal >= 10:
            level = "中"
        else:
            level = "低"
        print(level)
        ```
      slots:
        - id: conds
          type: table
          prompt: 这次运行时，下面两个条件分别是 True 还是 False？
          columns:
            - { id: line, header: 行 }
            - { id: cond, header: 条件 }
            - { id: value, header: 结果, input: bool }
          rows:
            - { id: c2, cells: { line: 第 2 行, cond: "`signal >= 15`", value: false } }
            - { id: c4, cells: { line: 第 4 行, cond: "`signal >= 10`", value: true } }
        - id: output
          type: text
          match: text
          prompt: 第 8 行显示什么？
          key: "中"
      explanation: |
        signal 是 12：第 2 行的 `signal >= 15` 为 **False**，跳过第 3 行，接着查第 4 行；`signal >= 10` 为 **True**，执行第 5 行，level 为“中”。这一组到此结束，else 下面的第 7 行不执行。最后显示 **中**。
      verify: |
        import re
        lines = CODE.splitlines()
        # 从题面代码里取出第 2、4 行的条件文字，按这次运行时 signal 的值求出 True/False。
        conds = {f"c{n}": re.match(r"\s*(?:if|elif) (.*):$", lines[n - 1]).group(1) for n in (2, 4)}
        r = run()
        answers = {
            "conds": {row: {"value": eval(cond, {"signal": r["signal"]})} for row, cond in conds.items()},
            "output": r.out.strip(),
        }
    practice:
      - id: py10.k1.q1
        kind: [predict]
        uses: [py08.k2]
        body: |
          还是分三档的代码，这次测量值恰好是 15。

          ```python startLine=1
          signal = 15
          if signal >= 15:
              level = "高"
          elif signal >= 10:
              level = "中"
          else:
              level = "低"
          print(level)
          ```
        slots:
          - id: output
            type: text
            match: text
            prompt: 第 8 行显示什么？
            key: "高"
            feedback:
              - when: "中"
                message: 15 满足 `signal >= 15`（`>=` 包含等号），第一个分支就执行了，轮不到 elif。
          - id: checked
            type: choice
            prompt: 第 4 行的条件 `signal >= 10` 这次有没有被检查？
            options:
              - { id: "no", content: 没有，第 2 行的条件已经成立，这一组到此结束 }
              - { id: "yes", content: 检查了，而且也是 True }
            key: "no"
        explanation: |
          显示 **高**。15 满足 `signal >= 15`，执行第 3 行；一组 if/elif/else 只走一条路径，所以第 4 行的条件**没有被检查**，else 也被跳过。虽然 15 也满足 `signal >= 10`，但它排在后面，轮不到它。
        verify: |
          import sys
          def ran(code=CODE):
              lines = set()
              def tracer(frame, event, arg):
                  if frame.f_code.co_filename == "<ran>" and event == "line":
                      lines.add(frame.f_lineno)
                  return tracer
              sys.settrace(tracer)
              try:
                  exec(compile(code, "<ran>", "exec"), {})
              finally:
                  sys.settrace(None)
              return lines
          answers = {"output": run().out.strip(), "checked": "yes" if 4 in ran() else "no"}
      - id: py10.k1.q2
        kind: [debug, predict]
        body: |
          有人想把测量值分成高（至少 15）、中（10 到 14）、低（低于 10）三档，写成了下面的样子。

          ```python startLine=1
          signal = 18
          if signal >= 10:
              level = "中"
          elif signal >= 15:
              level = "高"
          else:
              level = "低"
          print(level)
          ```
        slots:
          - id: output
            type: text
            match: text
            prompt: 第 8 行显示什么？
            key: "中"
          - id: when_high
            type: choice
            prompt: 把第 1 行换成别的整数，level 什么时候会是“高”？
            options:
              - { id: at_least_15, content: signal 至少为 15 时 }
              - { id: between, content: signal 在 10 到 14 之间时 }
              - { id: never, content: 不管 signal 是多少，都不会 }
            key: never
        explanation: |
          显示 **中**。18 满足第 2 行的 `signal >= 10`，执行第 3 行后这一组就结束了。

          而且**不管 signal 是多少，level 都不会是“高”**：能满足 `signal >= 15` 的值一定也满足 `signal >= 10`，早在第 2 行就走掉了，第 4 行的分支永远轮不到。要把“高”分出来，得把更严格的 `signal >= 15` 放在前面。
        verify: |
          # 把第 1 行换成 -50 到 99 的每个整数，收集出现过的 level。
          body = CODE.split("\n", 1)[1]
          levels = {run(body, signal=s)["level"] for s in range(-50, 100)}
          answers = {"output": run().out.strip(), "when_high": "never" if "高" not in levels else "other"}
      - id: py10.k1.q3
        kind: [predict]
        body: |
          两段代码只差一个词：A 用了两个分开的 `if`，B 的第二个是 `elif`。

          A：

          ```python
          signal = 16
          if signal >= 10:
              print("达标")
          if signal >= 15:
              print("偏高")
          ```

          B：

          ```python
          signal = 16
          if signal >= 10:
              print("达标")
          elif signal >= 15:
              print("偏高")
          ```
        slots:
          - id: a_lines
            type: text
            format: integer
            prompt: A 一共显示几行？
            key: 2
          - id: b_lines
            type: text
            format: integer
            prompt: B 一共显示几行？
            key: 1
            feedback:
              - when: 2
                message: B 是一组 if/elif，第一个条件成立后，elif 不再检查。
        explanation: |
          A 显示 **2** 行：“达标”“偏高”。两个分开的 if 是两组，各查各的，16 两个条件都满足。

          B 只显示 **1** 行：“达标”。`elif` 和前面的 `if` 是一组，第一个条件成立以后，elif 就不再检查。
        verify: |
          answers = {"a_lines": len(run(BLOCKS[0]).lines()), "b_lines": len(run(BLOCKS[1]).lines())}
      - id: py10.k1.q4
        kind: [trace]
        uses: [py08.k1]
        body: |
          两个条件本来都成立，但它们在同一条 if/elif 链里。最终显示哪一行？

          ```python
          score = 95
          if score >= 60:
              print("pass")
          elif score >= 90:
              print("excellent")
          else:
              print("retry")
          ```
        slots:
          - {id: output, type: text, match: text, prompt: 显示内容, key: pass}
        explanation: "第一条条件已经成立，执行 pass 后就跳过同一条链的其他分支。elif 不是再独立检查一次；如果要优先优秀档，应把较高阈值放在前面。"
        verify: |
          answers = {"output": str(run().lines()[0])}
      - id: py10.k1.q5
        kind: [debug]
        uses: [py08.k1]
        body: |
          改为两个独立的 if 以后，屏幕会显示几行？填写行数。

          ```python
          score = 95
          if score >= 60:
              print("pass")
          if score >= 90:
              print("excellent")
          ```
        slots:
          - {id: lines, type: text, format: integer, prompt: 显示行数, key: 2}
        explanation: "两个 if 各自判断，95 同时满足两条条件，所以显示两行。它们不再是互斥的 if/elif 分支链。"
        verify: |
          answers = {"lines": len(run().lines())}
    review:
      - id: py10.k1.r1
        kind: [trace]
        uses: [py08.k1, py08.k2]
        body: |
          冷藏样本要求温度在 2 到 8 度之间（含 2 和 8）。宿主事先给 `temp` 赋了值，代码里没有这一行。

          ```python
          if temp > 8:
              status = "过热"
          elif temp < 2:
              status = "过冷"
          else:
              status = "正常"
          ```

          这段代码分别在下表的四个温度下运行，写出每次运行后 `status` 的值。
        slots:
          - id: status
            type: table
            columns:
              - { id: temp, header: temp }
              - { id: status, header: status, input: text }
            rows:
              - { id: t1, cells: { temp: "1", status: 过冷 } }
              - { id: t2, cells: { temp: "2", status: 正常 } }
              - { id: t8, cells: { temp: "8", status: 正常 } }
              - { id: t9, cells: { temp: "9", status: 过热 } }
        explanation: |
          | temp | `temp > 8` | `temp < 2` | status |
          |---:|---|---|---|
          | 1 | False | True | 过冷 |
          | 2 | False | False | 正常 |
          | 8 | False | False | 正常 |
          | 9 | True | （不再检查） | 过热 |

          2 和 8 恰好在边界上：`temp > 8` 和 `temp < 2` 都不含等号，两个条件都不成立，走到 else。
        verify: |
          answers = {"status": {f"t{t}": {"status": run(temp=t)["status"]} for t in (1, 2, 8, 9)}}
      - id: py10.k1.r2
        kind: [explain]
        uses: [py08.k2]
        body: |
          要求：pH 低于 6 记为“酸”，高于 8 记为“碱”，其余（包括恰好为 6 和 8）记为“中性”。宿主事先给 `ph` 赋了值。

          哪一段代码对任何 pH 值都符合要求？
        slots:
          - id: program
            type: choice
            options:
              - id: wide
                content: |
                  ```python
                  if ph <= 6:
                      label = "酸"
                  elif ph >= 8:
                      label = "碱"
                  else:
                      label = "中性"
                  ```
                feedback: 恰好为 6 或 8 时应记为“中性”，`<=` 和 `>=` 把它们分进了酸和碱。
              - id: right
                content: |
                  ```python
                  if ph < 6:
                      label = "酸"
                  elif ph > 8:
                      label = "碱"
                  else:
                      label = "中性"
                  ```
              - id: two_ifs
                content: |
                  ```python
                  label = "中性"
                  if ph < 6:
                      label = "酸"
                  if ph < 8:
                      label = "碱"
                  ```
                feedback: 第二个条件写成了 `ph < 8`：pH 为 5 时先记为“酸”，接着又被改成“碱”。
            key: right
        explanation: |
          用 `ph < 6`、`ph > 8`，再用 else 接住其余情况的那一段符合要求：恰好 6 和 8 两个条件都不成立，走到 else，记为“中性”。

          写成 `<=`、`>=` 的那段把 6 和 8 分错了档。两个分开的 if 那段，第二个条件写反了方向，pH 为 5 时会先记“酸”又被改成“碱”，pH 为 7 也会被记成“碱”。
        verify: |
          def wanted(ph):
              return "酸" if ph < 6 else "碱" if ph > 8 else "中性"
          values = [3, 5.5, 6, 6.5, 7, 8, 8.5, 10]
          fits = [option for option, code in OPTIONS["program"].items()
                  if all(run(code, ph=v)["label"] == wanted(v) for v in values)]
          answers = {"program": fits[0] if len(fits) == 1 else fits}
    quiz:
      - id: py10.k1.x1
        kind: [predict, trace]
        uses: [py09.k1, py08.k1]
        body: |
          ```python startLine=1
          signal = 12
          group = "drug"
          if signal >= 10 and group == "control":
              note = "对照组达标"
          elif signal >= 10:
              note = "达标"
          else:
              note = "未达标"
          print(note)
          ```
        slots:
          - id: line
            type: choice
            prompt: 第 4、6、8 行里，哪一行被执行了？
            options:
              - { id: l4, content: 第 4 行 }
              - { id: l6, content: 第 6 行 }
              - { id: l8, content: 第 8 行 }
            key: l6
          - id: output
            type: text
            match: text
            prompt: 第 9 行显示什么？
            key: "达标"
        explanation: |
          第 3 行的条件要两边都成立：`signal >= 10` 为 True，但 `group == "control"` 为 False，所以整个条件是 False。接着查第 5 行，`signal >= 10` 为 True，执行**第 6 行**，这一组结束。显示 **达标**。
        verify: |
          import sys
          def ran(code=CODE):
              lines = set()
              def tracer(frame, event, arg):
                  if frame.f_code.co_filename == "<ran>" and event == "line":
                      lines.add(frame.f_lineno)
                  return tracer
              sys.settrace(tracer)
              try:
                  exec(compile(code, "<ran>", "exec"), {})
              finally:
                  sys.settrace(None)
              return lines
          hit = [f"l{n}" for n in (4, 6, 8) if n in ran()]
          answers = {"line": hit[0] if len(hit) == 1 else hit, "output": run().out.strip()}
      - id: py10.k1.x2
        kind: [debug]
        uses: [py08.k2]
        body: |
          要求：signal 至少 20 记为“很高”，至少 10（但不到 20）记为“高”，其余记为“低”。有人写成了下面的代码，宿主事先给 `signal` 赋了值。

          ```python
          if signal >= 10:
              level = "高"
          elif signal >= 20:
              level = "很高"
          else:
              level = "低"
          ```
        slots:
          - id: wrong
            type: choice
            multiple: true
            minSelected: 0
            scoring: options
            prompt: 用下面哪些 signal 运行，得到的 level 会和要求不一致？选出所有不一致的。
            options:
              - { id: s5, content: "5" }
              - { id: s12, content: "12" }
              - { id: s20, content: "20" }
              - { id: s25, content: "25" }
            key: [s20, s25]
        explanation: |
          **20 和 25** 不一致：按要求应记为“很高”，但它们先满足了第 1 行的 `signal >= 10`，被记成“高”，elif 轮不到。5 记为“低”、12 记为“高”，都与要求一致。

          更严格的条件 `signal >= 20` 要放在前面检查。
        verify: |
          def wanted(s):
              return "很高" if s >= 20 else "高" if s >= 10 else "低"
          answers = {"wrong": [f"s{s}" for s in (5, 12, 20, 25) if run(signal=s)["level"] != wanted(s)]}

      - id: py10.k1.x3
        kind:
          - trace
        body: |
          同一条分支链只选择第一条成立路径。观察中间档是否还会执行。

          ```python
          score = 92
          if score >= 90:
              print("high")
          elif score >= 60:
              print("middle")
          else:
              print("low")
          ```
        slots:
          - id: v0
            type: text
            match: output
            prompt: 第 1 项
            key: high
        explanation: 第一条已经命中，因此不再执行 elif，即使 score >= 60 本来也成立。
        verify: |
          r = run()
          values = r.lines()
          answers = {f"v{i}": value for i, value in enumerate(values)}
        uses:
          - py08.k1
  - id: py10.k2
    keyPrerequisites: []
    title: 缩进划定执行范围
    card:
      name: 缩进
      aliases: [代码块, 缩进块]
      definition: 冒号下面向右缩进的连续几行属于这个 if（或 elif、else），条件决定它们整块做或不做；回到原来位置的第一行起，就不再受这个条件控制。
      conditions:
        - 一行和哪一行左边对齐，就和它同级；同一块里的行要对齐，习惯每层 4 个空格。
        - 冒号下面没有缩进的行、或同一块没有对齐，Python 读不懂，一行都不会运行（IndentationError）。
      example:
        from: py10.k2.e0
        text: |
          两段代码只差最后一行 `print(total)` 的缩进：放在 if 外面，signal 为 12 时也会显示 0；缩进到 if 里面，条件不成立时整块跳过，什么也不显示。
    lesson: |
      `if` 这一行末尾的冒号表示“下面是一块”。冒号下面**向右缩进**的连续几行都属于这个 if：条件成立就整块执行，不成立就整块跳过。第一条**回到原来位置**的行，是这块之后的普通代码，无论条件如何都会执行。

      ```python startLine=1
      signal = 25
      if signal > 20:
          print("偏高")
          checked = "需复核"
      print("记录完成")
      ```

      第 3、4 行属于这个 if；第 5 行和 `if` 左边对齐，不属于它。signal 为 25 时显示“偏高”“记录完成”；把第 1 行换成 `signal = 12`，只显示“记录完成”，第 4 行的赋值也没有发生。

      所以两段代码哪怕只差一行的缩进，意思也可能完全不同。读的时候竖着看左边：一行和哪一行对齐，就和它同级。elif、else 下面的块也是这样划分的。

      缩进由空格组成，习惯每层 4 个空格。冒号下面一行缩进都没有，或同一块里的行没有对齐，Python 读不懂这段代码，会报 IndentationError，程序一行都不会运行。
