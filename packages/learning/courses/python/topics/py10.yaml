  - id: py10.k3
    keyPrerequisites: [py01, py08]
    title: 每条路径后的变量值
    card:
      name: 分支后的变量
      aliases: [默认值, 路径追踪]
      definition: 一组 if 之后某个名字的值，取决于这次实际走了哪条路径；没走到的分支里的赋值不会发生。
      conditions:
        - 只在某个分支里赋值的名字，没走那条路时保持原来的值；原来就没有值的，之后一用就报 NameError。
        - 在 if 之前先给一个默认值，或者用 else 接住其余情况，可以保证每条路径之后都有值。
      example:
        from: py10.k3.e0
        text: |
          ```python
          flag = "正常"
          if signal > 20:
              flag = "偏高"
          print(flag)
          ```
          signal 为 25 时显示“偏高”；为 12 时第 3 行没有执行，flag 保持默认值，显示“正常”。
    lesson: |
      读完一组 if，要回答“之后这个名字是多少”，先确定这次走的是哪条路径，再只执行这条路径上的赋值，[按顺序记下每个名字的值](repa:concept/py01.k2)。没走到的分支，里面写了什么赋值都不算数。

      常见的写法是**先给默认值，再在分支里改**：

      ```python startLine=1
      flag = "正常"
      if signal > 20:
          flag = "偏高"
      print(flag)
      ```

      | signal | 走的路径 | 第 4 行时 flag |
      |---:|---|---|
      | 25 | 执行第 3 行 | 偏高 |
      | 12 | 跳过第 3 行 | 正常 |

      如果去掉第 1 行，signal 为 12 时 `flag` 从来没有被赋值，第 4 行用到它就会报 NameError：这个名字还不存在。

      有几个分开的 if 时，每个 if 都可能改同一个名字。逐个看条件，成立一次就执行一次那里的赋值，例如成立两次就加了两次。
    example:
      id: py10.k3.e0
      uses: [py01.k2]
      kind: [trace]
      body: |
        宿主事先给 `signal` 赋了值，代码里没有这一行。

        ```python startLine=1
        flag = "正常"
        if signal > 20:
            flag = "偏高"
        print(flag)
        ```
      slots:
