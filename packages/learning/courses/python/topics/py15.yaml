            scoring: options
            options:
              - { id: rows, content: "`len(df)` 是否等于文件里的记录数 4" }
              - { id: columns, content: "`list(df.columns)` 是否是 sample_id、signal、group" }
              - { id: error, content: 程序运行时有没有报错 }
              - { id: suffix, content: 文件名是否以 .csv 结尾 }
            key: [rows, columns]
