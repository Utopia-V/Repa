    quiz:
      - id: py15.k3.x1
        kind: [debug]
        body: |
          读入 survey2.csv 以后，`df.shape` 是 (12, 1)，`list(df.columns)` 显示 `['site\tspecies\tcount']`（`\t` 是制表符）。最可能是哪里出了问题？
