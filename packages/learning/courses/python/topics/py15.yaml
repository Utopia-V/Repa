              - { id: lost, content: 被丢掉了，哪里都没有 }
            key: header
        explanation: |
          文件没有列名行，read_csv 照样把第一行当成列名：6 条记录只剩 5 行数据，`runs.shape` 是 **(5, 3)**。R01 那条记录**成了列名** R01、42、ok，不在数据里。

          文件 6 行、表 5 行，这个差就是线索。
        verify: |
