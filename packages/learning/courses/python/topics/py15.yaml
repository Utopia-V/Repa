            key: sep
        explanation: |
          只有 1 列、列名里夹着制表符，说明每行都没有被切开：文件**用制表符分隔，read_csv 却按默认的逗号切分**，要加 `sep="\t"`。编码不对会报错；没有列名行时列数是对的，只是列名像数据。
