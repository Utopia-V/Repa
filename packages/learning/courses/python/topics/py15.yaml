id: py15
title: 读入 CSV，先确认没有读错
status: complete
minutes: 20
summary: '用 read_csv 的路径、sep 和 encoding 把文件读对；用 dtype={"列名": "str"} 保住编号的前导零；读完核对列名、行数和前几行。'
prerequisites: [py14, py04]
encompassings:
  - {topic: py14, weight: 0.5}
  - {topic: py04, weight: 0.5}
sources:
  - source: pydata-book
    where: 第 6 章 §6.1
    url: https://wesmckinney.com/book/accessing-data
    use: reference
  - source: pandas-docs
    where: 入门教程：表格读写
    url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/02_read_write.html
    use: reference
  - source: pandas-docs
    where: API：pandas.read_csv 的 sep、encoding、dtype 参数
    url: https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html
    use: reference
notes: |
  建议题型与判分：找错（P）、小改代码（T）、写清需求（S/O）。
  出现 `dtype={"id": "str"}` 时，就地说明“把列名映射到读入类型”这一固定配置，只读写这一种形式；完整的字典行为由 py37 承担。
  范围：read_csv 只讲路径、sep、encoding、dtype 四样；header=None、names、skiprows、skipinitialspace 这些修补参数不讲，k3 只要求认出读错并说清楚。不讲 to_csv（py34）。
  题目用的 CSV 由 python 夹具在运行环境里写出（核对时是 Pyodide 的内存文件系统），题面通过 display 显示文件内容；每道题用不同的文件名，因为同一个 topic 的核对共用一个解释器，文件会留到后面的题。夹具里同时 import pandas as pd，对应“宿主已经导入 pandas”。代码题的隐藏测试换一份内容不同、路径相同的文件。
  GBK 文件用来代表中文 Windows 上 Excel 另存的 CSV；gb18030、cp936 也能读，代码题按读出的结果判，不限定写法。Windows 路径里的 \U 会让字符串字面量成为语法错误，只在 k1.r2 出现，用 compile 核对。
  节奏（待试做校准）：开场 1 分钟；k1 讲解与例题 3 分钟、练习 5 分钟；k2 讲解与例题 2 分钟、练习 4 分钟；k3 讲解与例题 2 分钟、练习 3 分钟。
  文件内容、讲解和题目为本课自拟。
intro: |
  这一节把文件读成表。题目会先显示文件的内容，也就是用记事本打开看到的样子；宿主已经运行了 `import pandas as pd`，并把文件放在了题目说的位置。

  读文件最怕的不是报错，而是没报错却读错了。所以每次读完，都要核对一下读出来的表。
wrapup: |
  读一个 CSV，先说清四件事：文件在哪里（路径）、用什么隔开（sep）、按什么编码存的（encoding）、哪些编号列要按文字读（dtype）。读完马上核对列名、行数和前几行。

  请别人或 AI 写读入代码时，可以把这几件事和核对结果一起写进要求，例如：“data/plates.csv，分号分隔，GBK 编码，well 和 batch 按文字读；读入后应有 96 行、5 列。”
