            rows:
              - { id: r1, cells: { input: "`>>> df = pd.read_csv(\"batches.csv\")`", shown: NOTHING } }
              - { id: r2, cells: { input: "`>>> list(df[\"batch\"])`", shown: "[7, 7, 12]" } }
              - { id: r3, cells: { input: "`>>> df2 = pd.read_csv(\"batches.csv\", dtype={\"batch\": \"str\"})`", shown: NOTHING } }
              - { id: r4, cells: { input: "`>>> list(df2[\"batch\"])`", shown: "['07', '07', '12']" } }
              - { id: r5, cells: { input: "`>>> list(df2[\"count\"])`", shown: "[120, 98, 143]" } }
        explanation: |
          | 输入 | 显示 |
          |---|---|
          | `df = pd.read_csv("batches.csv")` | NOTHING：赋值不显示 |
          | `list(df["batch"])` | [7, 7, 12]：批号被当成整数，07 成了 7 |
          | `df2 = pd.read_csv(..., dtype={"batch": "str"})` | NOTHING |
          | `list(df2["batch"])` | ['07', '07', '12']：按文字读，零还在 |
          | `list(df2["count"])` | [120, 98, 143]：count 没写进对照表，仍是整数 |
        verify: |
          inputs = [
              'df = pd.read_csv("batches.csv")',
              'list(df["batch"])',
              'df2 = pd.read_csv("batches.csv", dtype={"batch": "str"})',
              'list(df2["batch"])',
              'list(df2["count"])',
          ]
