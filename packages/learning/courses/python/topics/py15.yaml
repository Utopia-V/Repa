              - code: pts = pd.read_csv("patients.csv")
                why: 删掉了 dtype，编号读成整数 42
              - code: pts = pd.read_csv("patients.csv", dtype="str")
                why: 所有列都成了文字
            tests:
              - name: 编号保留原样
                expect:
                  list(pts["patient_id"]): '["0042", "0042", "0107"]'
                  list(pts["dose"]): "[10, 10, 15]"
              - name: 换一份文件
                hidden: true
                data: [patients2]
                expect:
                  list(pts["patient_id"]): '["0009", "0090", "0900"]'
                  list(pts["visit"]): "[1, 1, 2]"
        explanation: |
          冒号两边写反了：原来的意思是“名叫 str 的列读成 patient_id 类型”，read_csv 不认识这种类型，报错。列名放在冒号前，类型放在冒号后：

          ```python
          pts = pd.read_csv("patients.csv", dtype={"patient_id": "str"})
          ```
      - id: py15.k2.x2
        kind: [predict, debug]
        data: [wells]
        body: |
          ```python
          df = pd.read_csv("wells.csv", dtype={"well": "str"})
          ```
        slots:
          - id: batch
            type: text
            match: output
            prompt: 在交互窗口里输入 `list(df["batch"])`，显示什么？
            key: "[7, 7, 12]"
          - id: fix
            type: choice
            prompt: 要让 well 和 batch 都保留原来的写法，应改成哪一种？
            options:
              - id: two_items
                content: |
                  ```python
                  df = pd.read_csv("wells.csv", dtype={"well": "str", "batch": "str"})
                  ```
              - id: list_names
                content: |
                  ```python
                  df = pd.read_csv("wells.csv", dtype={"well", "batch": "str"})
                  ```
              - id: two_args
                content: |
                  ```python
                  df = pd.read_csv("wells.csv", dtype={"well": "str"}, dtype={"batch": "str"})
                  ```
            key: two_items
        explanation: |
          对照表里只有 well，batch 照旧由 pandas 判断，读成整数：**[7, 7, 12]**，007 和 012 前面的零丢了。

          要两列都按文字读，在**同一个对照表里写两项**，每项都是 `"列名": "类型"`，用逗号隔开。只在最后写一次类型不行，每一项都要有冒号和类型；dtype 也不能写两次。
        verify: |
          df = run()["df"]
          def fits(code):
              r = run(code)
              return r.error is None and list(r["df"]["well"]) == ["01", "02", "03"] and list(r["df"]["batch"]) == ["007", "007", "012"]
          good = [option for option, code in OPTIONS["fix"].items() if fits(code)]
          answers = {"batch": repl('list(df["batch"])', df=df)[0], "fix": good[0] if len(good) == 1 else good}

  - id: py15.k3
    keyPrerequisites: [py14]
    title: 核对列名、行数与样例
    card:
      name: 读入后核对
      aliases: [核对读入, 列名检查, 行数检查]
      definition: 读入以后马上核对三件事：列名和预期一致（拼写、大小写、空格）；行数等于文件里的数据行数（不算列名那一行）；前几行的值落在该在的列里，类型也对。
      conditions:
        - 列名多了空格或换了大小写，之后 `df["列名"]` 会报 KeyError。
        - 文件没有列名行时，第一行数据会被当成列名：行数少 1，列名看起来像数据。
      example:
        from: py15.k3.e0
        text: |
          batch2.csv 有 4 行数据、没有列名行。读进来是 3 行，列名成了 S_A、8、control：第一行数据被当成了列名。
    lesson: |
      read_csv 不报错，不等于读对了。读完花半分钟核对三件事：

      1. **列名**：`list(df.columns)` 和预期的一样吗？常见的问题有：列名首尾多了空格（`' signal'`）、大小写不同（`Depth` 和 `depth`），或者整行挤成了一个列名（分隔符不对）。列名不对，后面写 `df["signal"]` 就会报 KeyError。
      2. **行数**：`len(df)` 应当等于文件里的**数据行数**，也就是用记事本看到的总行数减去列名那一行。少了一行，最常见的原因是文件根本没有列名行，第一行数据被当成了列名。
      3. **样例**：`df.head()` 看前几行，值是不是落在了该在的列里，编号的前导零还在不在，数值列是不是数（`df.dtypes`）。

      核对的结果可以写成一句话，交给同事或 AI 时就是一份验收条件：“读入后应有 4 行、3 列，列名依次是 sample_id、signal、group，sample_id 是文字。”
    example:
      id: py15.k3.e0
      kind: [predict, debug]
      data: [noheader]
      body: |
        ```python
        df = pd.read_csv("batch2.csv")
        ```
      slots:
        - id: rows
          type: text
          format: integer
          prompt: "`len(df)` 是多少？"
          key: 3
        - id: first
          type: text
          match: text
          prompt: "`list(df.columns)` 的第一个列名是什么？"
          key: S_A
        - id: cause
          type: choice
          prompt: 读对了吗？
          options:
            - { id: ok, content: 读对了，只是列名和约定的不一样 }
            - { id: header, content: 没读对，文件没有列名行，第一行数据被当成了列名，少了一行 }
            - { id: sep, content: 没读对，分隔符不对 }
          key: header
      explanation: |
        read_csv 默认把文件的第一行当成列名。这个文件没有列名行，第一行 `S_A,8,control` 就成了列名：`list(df.columns)` 是 ['S_A', '8', 'control']，第一个是 **S_A**。剩下的 3 行才是数据，`len(df)` 是 **3**，而文件里有 4 条记录。

        所以**没读对**：样本 S_A 的数据丢进了列名里。分隔符是对的，三列都切开了。只看程序没报错，发现不了这个问题，要拿行数和列名去和文件、和约定比。
      verify: |
        df = run()["df"]
        with open("batch2.csv", encoding="utf-8") as f:
            records = [line for line in f.read().splitlines() if line]
        first_record = records[0].split(",")
        cause = "header" if list(df.columns) == first_record and len(df) == len(records) - 1 else "ok"
        answers = {"rows": len(df), "first": list(df.columns)[0], "cause": cause}
    practice:
      - id: py15.k3.q1
        kind: [debug]
        data: [spaced]
        body: |
          ```python
          df = pd.read_csv("spaced.csv")
          ```
        slots:
          - id: columns
            type: text
            match: output
            prompt: 在交互窗口里输入 `list(df.columns)`，显示什么？
            key: "['sample_id', ' signal', ' group']"
          - id: get
            type: choice
            prompt: 接着输入 `df["signal"]`，会怎样？
            options:
              - { id: series, content: 取出 signal 这一列 }
              - { id: error, content: 报 KeyError，表里没有叫 signal 的列 }
            key: error
        explanation: |
          第一行的逗号后面有空格，read_csv 把空格也算进了列名：**['sample_id', ' signal', ' group']**，后两个列名以空格开头。

          所以 `df["signal"]` 找不到这一列，**报 KeyError**。这类问题肉眼看文件很难发现，看 `list(df.columns)` 时注意引号里的空格。
        verify: |
          df = run()["df"]
          answers = {
              "columns": repl("list(df.columns)", df=df)[0],
              "get": "error" if run('df = pd.read_csv("spaced.csv")\ncolumn = df["signal"]').error == "KeyError" else "series",
          }
      - id: py15.k3.q2
        kind: [specify]
        data: [quadrats]
        body: |
          你要请同事读入 quadrats.csv。先根据文件内容，写出读入后应当满足的核对条件。
        slots:
          - id: checks
            type: table
            columns:
              - { id: item, header: 核对项 }
              - { id: expected, header: 应当是, input: text }
            rows:
              - { id: rows, cells: { item: 行数（不算列名）, expected: "5" } }
              - { id: cols, cells: { item: 列数, expected: "3" } }
              - { id: last, cells: { item: 最后一列的列名, expected: count } }
          - id: plot_type
            type: choice
            prompt: plot 列读进来应当是什么类型？
            options:
              - { id: str, content: str }
              - { id: int64, content: int64 }
            key: str
        explanation: |
          文件有 6 行，第一行是列名，所以数据是 **5** 行；每行 **3** 个值，最后一列叫 **count**。plot 列是 Q01 这样的样方编号，应当是文字 **str**。

          写成一句话：读入后应有 5 行、3 列，列名依次是 plot、species、count，plot 是文字。
        verify: |
          with open("quadrats.csv", encoding="utf-8") as f:
              lines = [line for line in f.read().splitlines() if line]
          header = lines[0].split(",")
          df = pd.read_csv("quadrats.csv")
          answers = {
              "checks": {"rows": {"expected": str(len(lines) - 1)}, "cols": {"expected": str(len(header))}, "last": {"expected": header[-1]}},
              "plot_type": str(df["plot"].dtype),
          }
      - id: py15.k3.q3
        kind: [debug]
        body: |
          四次读入的情况如下，预期的列都是 id 和 value。每次最可能是哪里出了问题？
        slots:
          - id: causes
            type: table
            columns:
              - { id: seen, header: 读入后看到的 }
              - id: cause
                header: 最可能的问题
                input:
                  type: choice
                  options:
                    - { id: sep, label: 分隔符不对 }
                    - { id: header, label: 文件没有列名行 }
                    - { id: encoding, label: 编码不对 }
                    - { id: none, label: 没有问题 }
            rows:
              - { id: c1, cells: { seen: "shape 是 (4, 1)，列名是 `id;value`", cause: sep } }
              - { id: c2, cells: { seen: "文件有 4 行，shape 是 (3, 2)，列名是 `A01` 和 `7`", cause: header } }
              - { id: c3, cells: { seen: 报 UnicodeDecodeError, cause: encoding } }
              - { id: c4, cells: { seen: "文件有 5 行，shape 是 (4, 2)，列名是 `id` 和 `value`", cause: none } }
        explanation: |
          | 看到的 | 问题 |
          |---|---|
          | 只有 1 列，列名里有分号 | 分隔符不对，整行没切开 |
          | 行数比文件少 1，列名像数据 | 文件没有列名行，第一行数据成了列名 |
          | UnicodeDecodeError | 编码不对 |
          | 5 行文件读出 4 行数据，列名正确 | 没有问题：第一行本来就是列名 |
        verify: |
          # 为每种问题造一个文件，读入后得到的现象与题面四行逐一对应。
          files = {
              "sep": ("id;value\nA01;7\nA02;3\nA03;5\nA04;9\n", "utf-8"),
              "header": ("A01,7\nA02,3\nA03,5\nA04,9\n", "utf-8"),
              "encoding": ("编号,value\n甲,7\n", "gbk"),
              "none": ("id,value\nA01,7\nA02,3\nA03,5\nA04,9\n", "utf-8"),
          }
          seen = {}
          for cause, (text, encoding) in files.items():
              with open(f"check_{cause}.csv", "w", encoding=encoding) as f:
                  f.write(text)
              try:
                  table = pd.read_csv(f"check_{cause}.csv")
                  seen[cause] = (len(text.splitlines()), table.shape, list(table.columns))
              except UnicodeDecodeError:
                  seen[cause] = "UnicodeDecodeError"
          described = {
              "c1": lambda s: s != "UnicodeDecodeError" and s[1] == (4, 1) and s[2] == ["id;value"],
              "c2": lambda s: s != "UnicodeDecodeError" and s[0] == 4 and s[1] == (3, 2) and s[2] == ["A01", "7"],
              "c3": lambda s: s == "UnicodeDecodeError",
              "c4": lambda s: s != "UnicodeDecodeError" and s[0] == 5 and s[1] == (4, 2) and s[2] == ["id", "value"],
          }
          answers = {"causes": {row: {"cause": [cause for cause, s in seen.items() if test(s)][0]} for row, test in described.items()}}
    review:
      - id: py15.k3.r1
