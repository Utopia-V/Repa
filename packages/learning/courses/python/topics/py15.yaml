          **行数**和**列名**这两项都能发现：读出 3 行而不是 4 行，列名是 S_A、8、control 而不是约定的名字。

          程序不会报错，文件名也没有问题，这两项看不出任何异常。
        verify: |
          df = pd.read_csv("batch2.csv")
