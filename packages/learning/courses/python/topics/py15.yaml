  - id: py15.k2
    keyPrerequisites: [py03, py14]
    title: "读懂 dtype={\"id\": \"str\"} 的列名到类型配置，保留前导零"
    card:
      name: dtype 参数
      aliases: [保留前导零, 按文字读入, 列名到类型]
      definition: "`dtype={\"sample_id\": \"str\"}` 告诉 read_csv：sample_id 这一列按文字读，001 就保持 001；没写到的列仍由 pandas 自己判断类型。"
      conditions:
        - '大括号里每一项写成 "列名": "类型"，冒号前是列名、后是类型，几项之间用逗号隔开。'
        - 要在读入时指定：读成整数以后，原来的 001 已经变成 1，事后转回文字也只能得到 "1"。
      example:
        from: py15.k2.e0
        text: |
          ids.csv 的编号是 001、002、010。不写 dtype 时读成 1、2、10；写了 `dtype={"sample_id": "str"}`，读成 '001'、'002'、'010'，signal 仍是整数。
    lesson: |
      read_csv 会自己猜每一列的类型。一列全是 001、002、010 这样的值，它当成整数，读成 1、2、10：前导零丢了，001 和 01 也分不开了。编号、邮编、批号这类列，要告诉它“按文字读”：

      ```python
      df = pd.read_csv("ids.csv", dtype={"sample_id": "str"})
      ```

      `dtype=` 后面大括号里是一份**对照表**，每一项写成 `"列名": "类型"`：冒号前是列名，冒号后是要读成的类型。这里只有一项，意思是“sample_id 这一列读成 str”。要设好几列，项与项之间用逗号隔开：

      ```python
      df = pd.read_csv("records.csv", dtype={"sample_id": "str", "batch": "str"})
      ```

      没写到的列照旧由 pandas 判断，signal 仍是整数。大括号这种写法以后讲字典时会细说，这里只要读懂、会写这一种固定形式。

      两点要注意：

      - **在读入时就指定。** 读成整数以后，原来是 001 还是 1 已经没有记录了，事后再转成文字只能得到 "1"。
      - **冒号两边不能写反。** `{"str": "sample_id"}` 的意思成了“名叫 str 的列读成 sample_id 类型”，read_csv 不认识 sample_id 这种类型，会报错。另外，`dtype="str"` 不带大括号，会把**所有列**都读成文字，数值列也不能算了。
    example:
      id: py15.k2.e0
      kind: [predict]
      uses: [py14.k3]
      data: [ids]
      body: |
        ```python
        a = pd.read_csv("ids.csv")
        b = pd.read_csv("ids.csv", dtype={"sample_id": "str"})
        ```
      slots:
        - id: values
          type: table
          prompt: 在交互窗口里输入下面两行，各显示什么？
          columns:
            - { id: input, header: 输入 }
            - { id: shown, header: 显示, input: { type: text, match: output } }
          rows:
            - { id: a, cells: { input: "`>>> list(a[\"sample_id\"])`", shown: "[1, 2, 10]" } }
            - { id: b, cells: { input: "`>>> list(b[\"sample_id\"])`", shown: "['001', '002', '010']" } }
        - id: signal
          type: choice
          prompt: 表 b 的 signal 列是什么类型？
          options:
            - { id: int64, content: int64，没写到的列照旧按整数读 }
            - { id: str, content: str，dtype 让所有列都按文字读 }
          key: int64
      explanation: |
        不写 dtype 时，read_csv 把 sample_id 当成整数：**[1, 2, 10]**，前导零丢了。写了 `dtype={"sample_id": "str"}`，这一列按文字读：**['001', '002', '010']**，带引号，因为是文字。

        对照表里只写了 sample_id，signal 照旧由 pandas 判断，仍是 **int64**，可以计算。
      verify: |
        r = run()
        shown = repl('list(a["sample_id"])\nlist(b["sample_id"])', a=r["a"], b=r["b"])
        answers = {"values": {"a": {"shown": shown[0]}, "b": {"shown": shown[1]}}, "signal": str(r["b"]["signal"].dtype)}
    practice:
      - id: py15.k2.q1
        kind: [predict]
        data: [batches]
        body: |
          在交互窗口里依次输入下面几行。
