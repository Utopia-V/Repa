kps:
  - id: py15.k1
    keyPrerequisites: [py04, py14]
    title: read_csv 的路径、分隔符和编码
    card:
      name: read_csv
      aliases: [读入 CSV, sep, encoding, 路径]
      definition: "`pd.read_csv(路径, sep=分隔符, encoding=编码)` 按路径找到文件，用 sep 把每行切成列，用 encoding 把文件里的字节解读成文字，得到一张表；sep 默认是逗号，encoding 默认是 UTF-8。"
      conditions:
        - 分隔符不对时不报错，整行挤成一列：列数是 1，列名里还带着分号或制表符。
        - 中文 Windows 上 Excel 另存的 CSV 常是 GBK 编码，按默认的 UTF-8 读会报 UnicodeDecodeError，要写 encoding="gbk"。
      example:
        from: py15.k1.e0
        text: |
          samples.csv 用分号隔开。`pd.read_csv("samples.csv")` 读成 3 行 1 列，列名是一整串 sample_id;signal;group；加上 `sep=";"` 才是 3 列。
    lesson: |
      CSV 是用纯文字存的表格：一行是一条记录，同一行的值用分隔符隔开，第一行通常是列名。用 pandas 的 read_csv 把它读成一张表：

      ```python
      df = pd.read_csv("data/samples.csv")
      ```

      读之前要说清三件事。

      **路径**：第一个参数，文件在哪里。`"data/samples.csv"` 是相对路径：从程序运行的文件夹出发，进入 data 文件夹，找 samples.csv。路径写错、或者文件不在那里，报 FileNotFoundError。

      Windows 上复制来的完整路径带反斜杠，例如 `C:\Users\wang\samples.csv`。直接放进引号里不行：引号里的 `\U` 这类组合对 Python 有特殊含义，会报语法错误。改成正斜杠 `"C:/Users/wang/samples.csv"`，或者在引号前加一个 r：`r"C:\Users\wang\samples.csv"`。

      **分隔符 sep**：默认是逗号。有的文件用分号（不少欧洲语言版本的 Excel 这样存）或制表符隔开，要写 `sep=";"` 或 `sep="\t"`（`\t` 代表制表符）。分隔符不对，read_csv **不会报错**，而是把整行当成一个值：表只剩一列，列名是 `sample_id;signal;group` 这样一整串。

      **编码 encoding**：文件里的中文是按某种编码存成字节的，read_csv 默认按 UTF-8 解读。中文 Windows 上 Excel 另存的 CSV 常常是 GBK 编码，按默认方式读会报 UnicodeDecodeError，写 `encoding="gbk"` 让它按 GBK 解读。

      sep 和 encoding 都是[关键字参数](repa:concept/py04.k2)，可以一起写，先后不限：

      ```python
      df = pd.read_csv("data/plates.csv", sep=";", encoding="gbk")
      ```

      读完先看 `df.shape` 和 `list(df.columns)`：列数和列名对了，分隔符就对了。
    example:
      id: py15.k1.e0
      kind: [predict, debug]
      data: [semi]
      body: |
        ```python
        df = pd.read_csv("samples.csv")
        print(df.shape)
        ```
      slots:
        - id: nrows
          type: text
          format: integer
          prompt: 读进来的表有几行？
          key: 3
        - id: ncols
          type: text
          format: integer
          prompt: 有几列？
          key: 1
        - id: fix
          type: choice
          prompt: 要读成 sample_id、signal、group 三列，第 1 行应改成哪一种？
          options:
            - id: comma
              content: |
                ```python
                df = pd.read_csv("samples.csv", sep=",")
                ```
            - id: semicolon
              content: |
                ```python
                df = pd.read_csv("samples.csv", sep=";")
                ```
            - id: encoding
              content: |
                ```python
                df = pd.read_csv("samples.csv", encoding="gbk")
                ```
          key: semicolon
      explanation: |
        文件用分号隔开，read_csv 默认按逗号切分。整行里一个逗号也没有，于是每行成了一个值：表有 **3** 行、**1** 列，列名是一整串 `sample_id;signal;group`。这时程序不报错，只有看 shape 或列名才会发现。

        改成 **`sep=";"`** 就读成了 3 列。`sep=","` 就是默认值，结果不变；编码和这个问题无关。
      verify: |
        r = run()
        lines = CODE.splitlines()
        fits = [option for option, line in OPTIONS["fix"].items()
                if run(line).error is None and list(run(line)["df"].columns) == ["sample_id", "signal", "group"]]
        answers = {"nrows": r["df"].shape[0], "ncols": r["df"].shape[1], "fix": fits[0] if len(fits) == 1 else fits}
    practice:
      - id: py15.k1.q1
        kind: [debug]
        data: [tabs]
        body: |
          ```python
          plate = pd.read_csv("plate.tsv")
          ```
        slots:
          - id: ncols
            type: text
            format: integer
            prompt: 读进来的表有几列？
            key: 1
          - id: fix
            type: choice
            prompt: 应改成哪一种？
            options:
              - id: tab
                content: |
                  ```python
                  plate = pd.read_csv("plate.tsv", sep="\t")
                  ```
              - id: space
                content: |
                  ```python
                  plate = pd.read_csv("plate.tsv", sep=" ")
                  ```
              - id: word
                content: |
                  ```python
                  plate = pd.read_csv("plate.tsv", sep="tab")
                  ```
            key: tab
        explanation: |
          文件用制表符隔开，按默认的逗号切分，每行都切不开，只有 **1** 列。

          制表符在引号里写成 **`"\t"`**。看起来像空格，但它不是空格，`sep=" "` 切不开；写成英文单词 `"tab"`，read_csv 会去找“tab”这三个字母，同样切不开。
        verify: |
          fits = [option for option, line in OPTIONS["fix"].items()
                  if run(line).error is None and list(run(line)["plate"].columns) == ["well", "count"]]
          answers = {"ncols": run()["plate"].shape[1], "fix": fits[0] if len(fits) == 1 else fits}
      - id: py15.k1.q2
        kind: [debug]
        data: [gbk]
        body: |
          ```python
          groups = pd.read_csv("groups.csv")
          ```

          运行时报错，最后一行是：

          ```text
          UnicodeDecodeError: 'utf-8' codec can't decode byte 0xb1 in position 0: invalid start byte
          ```
        slots:
          - id: cause
            type: choice
            prompt: 问题出在哪里？
            options:
              - { id: path, content: 路径不对，找不到文件 }
              - { id: encoding, content: 文件是 GBK 编码，read_csv 按默认的 UTF-8 去解读 }
              - { id: sep, content: 分隔符不对 }
            key: encoding
          - id: fix
            type: choice
            prompt: 应改成哪一种？
            options:
              - id: gbk
                content: |
                  ```python
                  groups = pd.read_csv("groups.csv", encoding="gbk")
                  ```
              - id: sep_gbk
                content: |
                  ```python
                  groups = pd.read_csv("groups.csv", sep="gbk")
                  ```
              - id: utf8
                content: |
                  ```python
                  groups = pd.read_csv("groups.csv", encoding="utf-8")
                  ```
            key: gbk
        explanation: |
          UnicodeDecodeError 说的是：按 'utf-8' 解读文件里的字节时，碰到了解读不了的字节。文件找到了（否则是 FileNotFoundError），分隔符的问题也不会报这个错；问题是**文件按 GBK 存、却按 UTF-8 读**。

          改成 **`encoding="gbk"`**。编码要写给 encoding，写给 sep 没有用；`encoding="utf-8"` 就是默认值，结果不变。
        verify: |
          r = run()
          cause = {"UnicodeDecodeError": "encoding", "FileNotFoundError": "path"}.get(r.error, "sep")
          fits = [option for option, line in OPTIONS["fix"].items()
                  if run(line).error is None and list(run(line)["groups"].columns) == ["编号", "组别", "信号"]]
          answers = {"cause": cause, "fix": fits[0] if len(fits) == 1 else fits}
      - id: py15.k1.q3
        kind: [modify]
        uses: [py04.k2]
        data: [data_plates]
        body: |
          要求：把 data 文件夹里的 plates.csv 读成一张表，存进 `plates`，三列依次是孔位、计数、处理。

          作答框里的代码报 FileNotFoundError。改动它，让读出来的表正确。
        slots:
          - id: code
            type: code
            language: python
            maxLines: 3
            starter: |
              plates = pd.read_csv("plates.csv")
            solution: |
              plates = pd.read_csv("data/plates.csv", sep=";", encoding="gbk")
            accepts:
              - plates = pd.read_csv("data/plates.csv", encoding="gbk", sep=";")
              - plates = pd.read_csv("data/plates.csv", sep=";", encoding="gb18030")
            rejects:
              - code: plates = pd.read_csv("data/plates.csv", encoding="gbk")
                why: 只改了路径和编码，没写分号分隔，读成一列
              - code: plates = pd.read_csv("data/plates.csv", sep=";")
                why: 没写编码，按 UTF-8 读 GBK 文件报错
              - code: plates = pd.read_csv("plates.csv", sep=";", encoding="gbk")
                why: 路径没改，文件在 data 文件夹里
            tests:
