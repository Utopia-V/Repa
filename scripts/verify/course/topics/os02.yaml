id: os02
title: 进程控制块
status: complete
minutes: 15
summary: 进程控制块里记了什么，系统怎样把它们组织起来。
prerequisites: [os01]
sources:
  - { source: notes, where: 第二节, use: reference }
kps:
  - id: os02.k1
    title: 进程控制块记录什么
    card:
      name: 进程控制块
      definition: 进程控制块是操作系统为每个进程保存的一份记录，写着它的标识、状态和恢复执行所需的现场。
      conditions: [每个进程恰有一个进程控制块]
      example: { from: os02.k1.e0, text: 进程被换下处理机时，寄存器的值存进它的进程控制块。 }
    lesson: |
      处理机在几个进程之间来回切换，被换下的进程以后还要从原处接着执行，所以操作系统要为每个进程记下一份资料，这就是**进程控制块**。它写着进程的标识、当前状态，以及恢复执行所需的现场，例如程序计数器和各寄存器的值。进程控制块与进程一一对应：进程创建时建立，进程结束时撤销。
    example:
      id: os02.k1.e0
      body: 进程被换下处理机时，它的寄存器的值存到哪里？
      slots:
        - id: place
          type: choice
          options:
            - { id: pcb, content: 它的进程控制块 }
            - { id: disk, content: 磁盘上的交换区 }
          key: pcb
      explanation: 恢复执行要用这些值，所以存进它自己的进程控制块。
      manual: [place]
    practice:
      - id: os02.k1.q1
        body: 一个进程有几个进程控制块？
        slots:
          - id: count
            type: choice
            options:
              - { id: one, content: 一个 }
              - { id: many, content: 每个线程一个 }
            key: one
        explanation: 进程控制块与进程一一对应。
        manual: [count]
      - id: os02.k1.q2
        body: 进程的当前状态记在哪里？
        slots:
          - id: place
            type: choice
            options:
              - { id: pcb, content: 进程控制块 }
              - { id: code, content: 进程的程序代码 }
            key: pcb
        explanation: 状态是操作系统管理进程用的信息，记在进程控制块里。
        manual: [place]
      - id: os02.k1.q3
        body: 进程结束时，它的进程控制块怎样处理？
        slots:
          - id: fate
            type: choice
            options:
              - { id: kept, content: 保留到关机 }
              - { id: removed, content: 撤销 }
            key: removed
        explanation: 进程控制块随进程创建而建立、随进程结束而撤销。
        manual: [fate]
      - id: os02.k1.q4
        body: 用一句话说明，为什么被换下处理机的进程以后能从原处接着执行。
        slots:
          - id: why
            type: text
            lines: 3
            rubric:
              - id: save
                label: 现场存在哪里
                guide: 说出寄存器、程序计数器这些现场保存在进程控制块里。
              - id: restore
                label: 怎样恢复
                guide: 说出恢复执行时从进程控制块取回现场。
        explanation: 换下时现场存进进程控制块，恢复时取回，所以能从原处接着执行。
    review:
      - id: os02.k1.r1
        body: 程序计数器的值在进程被换下时存到哪里？
        slots:
          - id: place
            type: choice
            options:
              - { id: pcb, content: 进程控制块 }
              - { id: cache, content: 处理机的缓存 }
            key: pcb
        explanation: 程序计数器是现场的一部分，存进进程控制块。
        manual: [place]
    quiz:
      - id: os02.k1.x1
        body: 进程控制块在什么时候建立？
        slots:
          - id: when
            type: choice
            options:
              - { id: create, content: 进程创建时 }
              - { id: first, content: 进程第一次运行时 }
            key: create
        explanation: 进程创建时就建立它的进程控制块。
        manual: [when]
  - id: os02.k2
    title: 进程控制块怎样组织
    card:
      name: 状态队列
      definition: 操作系统把状态相同的进程的进程控制块链成队列，例如就绪队列和各个阻塞队列。
      conditions: [调度程序从就绪队列里挑进程]
      example: { from: os02.k2.e0, text: 调度程序从就绪队列里挑下一个运行的进程。 }
    lesson: |
      系统里的进程控制块很多，调度时要很快找到所有就绪的进程，所以操作系统按状态把它们链成队列：就绪的进程在**就绪队列**里，等不同事件的进程在各自的**阻塞队列**里。进程换状态时，它的进程控制块就从一个队列移到另一个队列。调度程序只看就绪队列，不必扫描全部进程。
    example:
      id: os02.k2.e0
      body: 调度程序从哪个队列里挑下一个运行的进程？
      slots:
        - id: queue
          type: choice
          options:
            - { id: ready, content: 就绪队列 }
            - { id: blocked, content: 阻塞队列 }
          key: ready
      explanation: 只有就绪的进程得到处理机就能执行，所以从就绪队列里挑。
      manual: [queue]
    practice:
      - id: os02.k2.q1
        body: 等磁盘的进程的进程控制块在哪个队列里？
        slots:
          - id: queue
            type: choice
            options:
              - { id: ready, content: 就绪队列 }
              - { id: blocked, content: 阻塞队列 }
            key: blocked
        explanation: 等磁盘是在等事件，进程处于阻塞，所以在阻塞队列里。
        manual: [queue]
      - id: os02.k2.q2
        body: 进程等的事件发生以后，它的进程控制块移到哪个队列？
        slots:
          - id: queue
            type: choice
            options:
              - { id: ready, content: 就绪队列 }
              - { id: running, content: 不进队列，直接运行 }
            key: ready
        explanation: 事件发生后进程回到就绪，进程控制块移到就绪队列。
        manual: [queue]
      - id: os02.k2.q3
        body: 调度程序挑进程时要不要扫描全部进程控制块？
        slots:
          - id: scan
            type: choice
            options:
              - { id: "yes", content: 要 }
              - { id: "no", content: 不要，只看就绪队列 }
            key: "no"
        explanation: 进程控制块按状态链成了队列，调度程序只看就绪队列。
        manual: [scan]
    review:
      - id: os02.k2.r1
        body: 时间片用完的进程，进程控制块移到哪个队列？
        slots:
          - id: queue
            type: choice
            options:
              - { id: ready, content: 就绪队列 }
              - { id: blocked, content: 阻塞队列 }
            key: ready
        explanation: 时间片用完回到就绪，进程控制块移到就绪队列。
        manual: [queue]
    quiz:
      - id: os02.k2.x1
        body: 等键盘输入的进程的进程控制块在哪个队列里？
        slots:
          - id: queue
            type: choice
            options:
              - { id: ready, content: 就绪队列 }
              - { id: blocked, content: 阻塞队列 }
            key: blocked
        explanation: 等键盘输入是在等事件，所以在阻塞队列里。
        manual: [queue]
