id: un02
title: 质量单位
status: complete
minutes: 45
summary: 吨、千克、克之间怎样换算。
prerequisites: []
sources:
  - source: notes
    where: 第二节
    use: reference
kps:
  - id: un02.k1
    title: 千克和克
    card:
      name: 千克和克
      definition: 1 千克等于 1000 克。
      conditions:
        - 千克换成克乘 1000，反过来除以 1000
      example:
        from: un02.k1.e0
        text: 2 千克等于 2000 克。
    lesson: |
      1 千克等于 1000 克。从千克换成克乘 1000，从克换成千克除以 1000。
    example:
      id: un02.k1.e0
      body: 2 千克等于多少克？
      slots:
        - id: value
          type: choice
          options:
            - id: a
              content: 200 克
            - id: b
              content: 2000 克
          key: b
      explanation: 1 千克等于 1000 克，2 千克就是 2000 克。
      manual:
        - value
    practice:
      - id: un02.k1.q1
        body: 3 千克等于多少克？
        slots:
          - id: value
            type: choice
            options:
              - id: a
                content: 3000 克
              - id: b
                content: 300 克
            key: a
        explanation: 1 千克等于 1000 克，3 千克就是 3000 克。
        manual:
          - value
      - id: un02.k1.q2
        body: 4000 克等于多少千克？
        slots:
          - id: value
            type: choice
            options:
              - id: a
                content: 400 千克
              - id: b
                content: 4 千克
            key: b
        explanation: 1000 克是 1 千克，4000 克就是 4 千克。
        manual:
          - value
      - id: un02.k1.q3
        body: 5 千克等于多少克？
        slots:
          - id: value
            type: choice
            options:
              - id: a
                content: 5000 克
              - id: b
                content: 500 克
            key: a
        explanation: 1 千克等于 1000 克，5 千克就是 5000 克。
        manual:
          - value
    review:
