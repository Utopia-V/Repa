          - id: value
            type: choice
            options:
              - id: a
                content: 500 厘米
              - id: b
                content: 50 厘米
            key: a
        explanation: 1 米等于 100 厘米，5 米就是 500 厘米。
        manual:
          - value
    review:
      - id: un01.k1.r1
        body: 6 米等于多少厘米？
