id: un01
title: 长度单位
status: complete
minutes: 45
summary: 千米、米、厘米之间怎样换算。
prerequisites: []
sources:
  - source: notes
    where: 第一节
    use: reference
kps:
  - id: un01.k1
    title: 米和厘米
    card:
      name: 米和厘米
      definition: 1 米等于 100 厘米。
      conditions:
        - 米换成厘米乘 100，反过来除以 100
      example:
        from: un01.k1.e0
        text: 2 米等于 200 厘米。
    lesson: |
      1 米等于 100 厘米。从米换成厘米乘 100，从厘米换成米除以 100。
    example:
      id: un01.k1.e0
      body: 2 米等于多少厘米？
      slots:
        - id: value
          type: choice
          options:
            - id: a
              content: 20 厘米
            - id: b
              content: 200 厘米
          key: b
      explanation: 1 米等于 100 厘米，2 米就是 200 厘米。
      manual:
        - value
    practice:
      - id: un01.k1.q1
        body: 3 米等于多少厘米？
        slots:
          - id: value
            type: choice
            options:
              - id: a
                content: 300 厘米
              - id: b
                content: 30 厘米
            key: a
        explanation: 1 米等于 100 厘米，3 米就是 300 厘米。
        manual:
          - value
      - id: un01.k1.q2
        body: 400 厘米等于多少米？
        slots:
          - id: value
            type: choice
            options:
              - id: a
                content: 40 米
              - id: b
                content: 4 米
            key: b
        explanation: 100 厘米是 1 米，400 厘米就是 4 米。
        manual:
          - value
      - id: un01.k1.q3
        body: 5 米等于多少厘米？
